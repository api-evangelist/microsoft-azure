components:
  schemas:
    ConversationalAnalysisAuthoringCopyAuthorizationOptions:
      description: Represents the options for authorizing a project copy to the current Azure resource.
      required:
      - projectKind
      type: object
      properties:
        projectKind:
          description: Represents the project kind.
          $ref: '#/components/schemas/ConversationalAnalysisAuthoringProjectKind'
        storageInputContainerName:
          description: The name of the storage container.
          type: string
        allowOverwrite:
          description: Whether to allow an existing project to be overwritten using the resulting copy authorization.
          type: boolean
      x-ms-client-name: CopyAuthorizationOptions
    ConversationalAnalysisAuthoringDeploymentResource:
      description: Represents an Azure resource assigned to a deployment.
      required:
      - resourceId
      - region
      type: object
      properties:
        resourceId:
          description: Represents the Azure resource Id.
          type: string
        region:
          description: Represents the resource region.
          type: string
      x-ms-client-name: DeploymentResource
    ConversationalAnalysisAuthoringUtteranceIntentsEvaluationResult:
      description: Represents the comparison between the expected and the predicted intent for an utterance.
      required:
      - expectedIntent
      - predictedIntent
      type: object
      properties:
        expectedIntent:
          description: Represents the utterance's expected intent.
          type: string
        predictedIntent:
          description: Represents the utterance's predicted intent.
          type: string
      x-ms-client-name: UtteranceIntentsEvaluationResult
    ConversationalAnalysisAuthoringAssignedResourceDeploymentsMetadata:
      description: Represents the metadata for deployments assigned to a resource.
      required:
      - value
      - nextLink
      type: object
      properties:
        value:
          description: The list of retrieved assigned project deployments.
          type: array
          items:
            $ref: '#/components/schemas/ConversationalAnalysisAuthoringAssignedProjectDeploymentsMetadata'
        nextLink:
          description: The next page link.
          type:
          - string
          - 'null'
      x-ms-client-name: AssignedResourceDeploymentsMetadata
    ConversationalAnalysisAuthoringResourceMetadata:
      description: Represents metadata for the Azure resource..
      required:
      - azureResourceId
      - customDomain
      - region
      type: object
      properties:
        azureResourceId:
          description: Represents the Azure resource ID.
          type: string
        customDomain:
          description: Represents the Azure resource custom domain.
          type: string
        region:
          description: Represents the Azure resource region.
          type: string
      x-ms-client-name: ResourceMetadata
    ConversationalAnalysisAuthoringUtteranceEntityEvaluationResult:
      description: Represents the evaluation output of an entity label or prediction.
      required:
      - category
      - offset
      - length
      type: object
      properties:
        category:
          description: Represents the entity category.
          type: string
        offset:
          format: int32
          description: Represents the entity offset index relative to the original text.
          type: integer
        length:
          format: int32
          description: Represents the entity length.
          type: integer
      x-ms-client-name: UtteranceEntityEvaluationResult
    ConversationalAnalysisAuthoringAssignedDeploymentResource:
      description: Represents the assigned deployment resource.
      required:
      - azureResourceId
      - region
      type: object
      properties:
        azureResourceId:
          description: The resource ID.
          type: string
        region:
          description: The resource region.
          type: string
      x-ms-client-name: AssignedDeploymentResource
    ConversationalAnalysisAuthoringTrainingJobState:
      description: Represents the state of a training job.
      required:
      - result
      type: object
      allOf:
      - $ref: '#/components/schemas/ConversationalAnalysisAuthoringJobState'
      properties:
        result:
          description: Represents training tasks detailed result.
          $ref: '#/components/schemas/ConversationalAnalysisAuthoringTrainingJobResult'
      x-ms-client-name: TrainingJobState
    ConversationalAnalysisAuthoringDeploymentResourcesJobState:
      description: Represents the state of a deployment resources job.
      type: object
      allOf:
      - $ref: '#/components/schemas/ConversationalAnalysisAuthoringJobState'
      x-ms-client-name: DeploymentResourcesJobState
    ConversationalAnalysisAuthoringSupportedLanguages:
      description: Represents a list of retrieved languages.
      required:
      - value
      - nextLink
      type: object
      properties:
        value:
          description: The list of the languages.
          type: array
          items:
            $ref: '#/components/schemas/ConversationalAnalysisAuthoringSupportedLanguage'
        nextLink:
          description: The next page link.
          type:
          - string
          - 'null'
      x-ms-client-name: SupportedLanguages
    ConversationalAnalysisAuthoringEntitiesEvaluationSummary:
      description: Represents the evaluation result summary for the project's entities.
      required:
      - confusionMatrix
      - entities
      - microF1
      - microPrecision
      - microRecall
      - macroF1
      - macroPrecision
      - macroRecall
      type: object
      properties:
        confusionMatrix:
          description: Represents the confusion matrix between two entities (the two entities can be the same). The matrix is between the entity that was labelled and the entity that was predicted.
          $ref: '#/components/schemas/ConversationalAnalysisAuthoringConfusionMatrix'
        entities:
          description: Represents the entities evaluation summary.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ConversationalAnalysisAuthoringEntityEvaluationSummary'
        microF1:
          format: float
          description: Represents the micro F1. Expected value is a float between 0 and 1 inclusive.
          type: number
        microPrecision:
          format: float
          description: Represents the micro precision. Expected value is a float between 0 and 1 inclusive.
          type: number
        microRecall:
          format: float
          description: Represents the micro recall. Expected value is a float between 0 and 1 inclusive.
          type: number
        macroF1:
          format: float
          description: Represents the macro F1. Expected value is a float between 0 and 1 inclusive.
          type: number
        macroPrecision:
          format: float
          description: Represents the macro precision. Expected value is a float between 0 and 1 inclusive.
          type: number
        macroRecall:
          format: float
          description: Represents the macro recall. Expected value is a float between 0 and 1 inclusive.
          type: number
      x-ms-client-name: EntitiesEvaluationSummary
