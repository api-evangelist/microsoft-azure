  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Migrate/assessmentProjects/{projectName}/groups/{groupName}/updateMachines
  : post:
      operationId: microsoftAzureGroupsoperationsUpdatemachines
      tags:
      - GroupsOperations
      summary: Microsoft Azure Update Machines In Group
      description: Update machines in group by adding or removing machines.
      parameters:
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - name: projectName
        in: path
        description: Assessment Project Name
        required: true
        schema:
          type: string
          pattern: ^[^<>&:\?/#]{1,260}$
      - name: groupName
        in: path
        description: Group ARM name
        required: true
        schema:
          type: string
          pattern: ^[^<>&:\?/#]{1,260}$
      responses:
        '200':
          description: ARM operation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '202':
          description: Resource operation accepted.
          headers:
            Retry-After:
              description: The Retry-After header can indicate how long the client should wait before polling the operation status.
              schema:
                type: integer
                format: int32
            Location:
              description: The Location header contains the URL where the status of the long running operation can be checked.
              schema:
                type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: ../../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation-options:
        final-state-via: location
      x-ms-long-running-operation: true
      x-ms-examples:
        GroupsOperations_UpdateMachines_MaximumSet_Gen:
          $ref: ./examples/GroupsOperations_UpdateMachines_MaximumSet_Gen.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupBody'
        description: The content of the action request
        required: true
components:
  schemas:
    AzureResourceProperties:
      type: object
      description: Common properties for all azure tracked and proxy resources.
      properties:
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: The status of the last operation.
    GroupUpdateOperation:
      type: string
      enum:
      - Add
      - Remove
      x-ms-enum:
        name: GroupUpdateOperation
        modelAsString: true
    GroupBodyProperties:
      type: object
      description: Body properties of group update.
      properties:
        operationType:
          $ref: '#/components/schemas/GroupUpdateOperation'
          description: Whether to add or remove the machines.
        machines:
          type: array
          description: List of machine names that are part of this group.
          items:
            type: string
    GroupType:
      type: string
      enum:
      - Default
      - Import
      x-ms-enum:
        name: GroupType
        modelAsString: true
    ProvisioningState:
      type: string
      description: The status of the current operation.
      enum:
      - Succeeded
      - Failed
      - Canceled
      - Provisioning
      - Updating
      - Deleting
      - Accepted
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
        values:
        - name: Succeeded
          value: Succeeded
          description: Resource has been created.
        - name: Failed
          value: Failed
          description: Resource creation failed.
        - name: Canceled
          value: Canceled
          description: Resource creation was canceled.
        - name: Provisioning
          value: Provisioning
          description: Resource is being Provisioned.
        - name: Updating
          value: Updating
          description: Resource is being Updated.
        - name: Deleting
          value: Deleting
          description: Resource is being Deleted.
        - name: Accepted
          value: Accepted
          description: Resource is being Accepted.
    GroupStatus:
      type: string
      enum:
      - Created
      - Updated
      - Running
      - Completed
      - Invalid
      x-ms-enum:
        name: GroupStatus
        modelAsString: true
    GroupListResult:
      type: object
      description: The response of a Group list operation.
      properties:
        value:
          type: array
          description: The Group items on this page
          items:
            $ref: '#/components/schemas/Group'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    GroupProperties:
      type: object
      description: Properties of group resource.
      properties:
        groupStatus:
          $ref: '#/components/schemas/GroupStatus'
          description: Whether the group has been created and is valid.
          readOnly: true
        machineCount:
          type: integer
          format: int32
          description: Number of machines part of this group.
          readOnly: true
        assessments:
          type: array
          description: List of References to Assessments created on this group.
          items:
            type: string
          readOnly: true
        supportedAssessmentTypes:
          type: array
          description: List of assessment types supported on this group.
          items:
            $ref: '#/components/schemas/AssessmentType'
        areAssessmentsRunning:
          type: boolean
          description: If the assessments are in running state.
          readOnly: true
        createdTimestamp:
          type: string
          format: date-time
          description: Time when this group was created. Date-Time represented in ISO-8601 format.
          readOnly: true
        updatedTimestamp:
          type: string
          format: date-time
          description: Time when this group was last updated. Date-Time represented in ISO-8601 format.
          readOnly: true
        groupType:
          $ref: '#/components/schemas/GroupType'
          description: The type of group.
          x-ms-mutability:
          - read
          - create
      allOf:
      - $ref: '#/components/schemas/AzureResourceProperties'
    Group:
      type: object
      description: Group resource.
      properties:
        properties:
          $ref: '#/components/schemas/GroupProperties'
          description: The resource-specific properties for this resource.
          x-ms-client-flatten: true
          x-ms-mutability:
          - read
          - create
      allOf:
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/definitions/ProxyResource
    UpdateGroupBody:
      type: object
      description: Properties of group update.
      properties:
        eTag:
          type: string
          description: For optimistic concurrency control.
        properties:
          $ref: '#/components/schemas/GroupBodyProperties'
          description: Properties of the group.
    AssessmentType:
      type: string
      enum:
      - Unknown
      - MachineAssessment
      - AvsAssessment
      - SqlAssessment
      - WebAppAssessment
      x-ms-enum:
        name: AssessmentType
        modelAsString: true
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
