      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Operationalinsights Workspaces Workspacename Features Servicemap Machines Machinename Machinegroups
components:
  parameters:
    migrateProjectName:
      name: migrateProjectName
      description: Name of the Azure Migrate project.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: API version.
      schema:
        type: string
    continuationToken:
      name: continuationToken
      description: The continuation token.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      x-ms-parameter-location: method
      required: true
      description: Resource group name within the specified subscriptionId.
      schema:
        type: string
        maxLength: 64
        minLength: 1
        pattern: '[a-zA-Z0-9_-]+'
    subscriptionId:
      name: subscriptionId
      description: Azure Subscription Id in which migrate project was created.
      in: path
      required: true
      schema:
        type: string
    machineName:
      name: machineName
      description: Unique name of a machine in Azure migration hub.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    pageSize:
      name: pageSize
      description: The number of items to be returned in a single page. This value is honored only if it is less than the 100.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
    MachineNameParameter:
      name: machineName
      in: path
      x-ms-parameter-location: method
      required: true
      description: Machine resource name.
      schema:
        type: string
        maxLength: 64
        minLength: 3
    WorkspaceNameParameter:
      name: workspaceName
      in: path
      x-ms-parameter-location: method
      required: true
      description: OMS workspace containing the resources of interest.
      schema:
        type: string
        maxLength: 63
        minLength: 3
        pattern: '[a-zA-Z0-9_][a-zA-Z0-9_-]+[a-zA-Z0-9_]'
    resourceGroupName:
      name: resourceGroupName
      description: Name of the Azure Resource Group that migrate project is part of.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: Azure subscription identifier.
      schema:
        type: string
    api-version:
      name: api-version
      description: Standard request header. Used by service to identify API version used by client.
      in: query
      required: true
      schema:
        type: string
        enum:
        - 2018-09-01-preview
  schemas:
    Ipv6NetworkInterface:
      description: Describes an IPv6 network interface.
      properties:
        ipAddress:
          type: string
          description: IPv6 address.
      required:
      - ipAddress
    VirtualMachineConfiguration:
      description: Describes the virtualization-related configuration of a machine.
      properties:
        virtualMachineType:
          $ref: '#/components/schemas/VirtualMachineType'
          description: Specifies the virtualization technology used by the machine (hyperv, vmware, etc.)
        nativeMachineId:
          type: string
          description: The unique identifier of the virtual machine as reported by the underlying virtualization system.
        virtualMachineName:
          type: string
          description: The Name of the virtual machine.
        nativeHostMachineId:
          type: string
          description: The unique identifier of the host of this virtual machine as reported by the underlying virtualization system.
    CoreResource:
      description: Marker resource for the core Service Map resources
      allOf:
      - $ref: '#/components/schemas/Resource'
      discriminator:
        propertyName: kind
      properties:
        etag:
          type: string
          description: Resource ETAG.
        kind:
          type: string
          description: Additional resource type qualifier.
          enum:
          - machine
          - process
          - port
          - clientGroup
          - machineGroup
      required:
      - kind
    HostingConfiguration:
      description: Describes the hosting configuration of a machine.
      discriminator:
        propertyName: kind
      properties:
        provider:
          type: string
          description: The hosting provider of the VM.
          enum:
          - azure
        kind:
          type: string
          description: Additional hosting configuration type qualifier.
          enum:
          - provider:azure
      required:
      - kind
    MachineCollection:
      description: Collection of machines.
      type: object
      properties:
        value:
          description: Gets or sets the machines.
          type: array
          items:
            $ref: '#/components/schemas/Machine'
        nextLink:
          description: Gets or sets the value of nextLink.
          type: string
    Error:
      type: object
      description: Error details.
      properties:
        code:
          type: string
          description: Error code identifying the specific error.
        message:
          type: string
          description: Error message in the caller's locale.
      required:
      - code
    Timezone:
      description: Describes a timezone.
      properties:
        fullName:
          type: string
          description: Timezone full name.
    AgentConfiguration:
      description: Describes the configuration of the Dependency Agent installed on a machine.
      properties:
        agentId:
          type: string
          description: Health Service Agent unique identifier.
        dependencyAgentId:
          type: string
          description: Dependency Agent unique identifier.
        dependencyAgentVersion:
          type: string
          description: Dependency Agent version number.
        dependencyAgentRevision:
          type: string
          description: Dependency Agent revision number.
        rebootStatus:
          $ref: '#/components/schemas/MachineRebootStatus'
          description: Specifies whether the machine has been rebooted since the Dependency Agent installation.
        clockGranularity:
          type: integer
          format: int32
          description: Machine clock granularity in milliseconds.
      required:
      - agentId
    RelationshipProperties:
      description: Relationship properties.
      properties:
        source:
          $ref: '#/components/schemas/ResourceReference'
          description: Source resource of the relationship.
        destination:
          $ref: '#/components/schemas/ResourceReference'
          description: Destination resource of the relationship.
        startTime:
          type: string
          format: date-time
          description: Relationship start time.
        endTime:
          type: string
          format: date-time
          description: Relationship end time.
      required:
      - source
      - destination
    HypervisorConfiguration:
      description: Describes the hypervisor configuration of a machine.
      properties:
        hypervisorType:
          $ref: '#/components/schemas/HypervisorType'
          description: Specifies the virtualization technology used by the hypervisor (hyperv, vmware, etc.)
        nativeHostMachineId:
          type: string
          description: The unique identifier of the hypervisor machine as reported by the underlying virtualization system.
    ConnectionCollection:
      type: object
      description: Collection of Connection resources.
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
          description: Collection of Connection resources.
        nextLink:
          type: string
          description: The URL to the next set of resources.
    ConnectionFailureState:
      description: "Connection failure state:\n * ```ok``` indicates no failures\n * ```failed``` indicates only failures\n * ```mixed``` indicates both failures and successes"
      type: string
      enum:
      - ok
      - failed
      - mixed
      x-ms-enum:
        name: ConnectionFailureState
        modelAsString: false
    MonitoringState:
      description: Used to specify if a resources is monitored or discovered.
      type: string
      enum:
      - monitored
      - discovered
      x-ms-enum:
        name: MonitoringState
        modelAsString: false
    VirtualMachineType:
      description: Specifies the virtualization type of a machine.
      type: string
      enum:
      - unknown
      - hyperv
      - ldom
      - lpar
      - vmware
      - virtualPc
      - xen
      x-ms-enum:
        name: VirtualMachineType
        modelAsString: false
    ProcessDetails:
      description: Describes process metadata.
      properties:
        persistentKey:
          type: string
          description: A unique identifier for a process, generally resilient to process restart, computed by Service Map.
        poolId:
          type: integer
          format: int32
          description: Represents the identity of the process pool assigned to the process by Dependency Agent.
        firstPid:
          type: integer
          format: int32
          description: The Operating System Process Identifier (PID) of the first process in this process pool.
        description:
          type: string
          description: Process description.
        companyName:
          type: string
          description: Name of company that created the process executable.
        internalName:
          type: string
          description: Internal process name.
        productName:
          type: string
          description: Product name.
        productVersion:
          type: string
          description: Product version.
        fileVersion:
          type: string
          description: File version.
        commandLine:
          type: string
          description: Process command line.
        executablePath:
          type: string
          description: Process executable path.
        workingDirectory:
          type: string
          description: Process workingDirectory.
        services:
          type: array
          items:
            $ref: '#/components/schemas/ProcessHostedService'
          x-ms-identifiers: []
          description: Collection of services hosted by this Process (Windows only).
        zoneName:
          type: string
          description: Process zone name (Linux only).
    ProcessCollection:
      type: object
      description: Collection of Process resources.
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/Process'
          description: Collection of Process resources.
        nextLink:
          type: string
          description: The URL to the next set of resources.
    MachineProperties:
      description: Properties of the machine resource.
      type: object
      properties:
        discoveryData:
          description: Gets or sets the discovery details of the machine published by various sources.
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryDetails'
          x-ms-identifiers:
          - machineId
        assessmentData:
          description: Gets or sets the assessment details of the machine published by various sources.
          type: array
          items:
            $ref: '#/components/schemas/AssessmentDetails'
          x-ms-identifiers:
          - assessmentId
        migrationData:
          description: Gets or sets the migration details of the machine published by various sources.
          type: array
          items:
            $ref: '#/components/schemas/MigrationDetails'
          x-ms-identifiers: []
        lastUpdatedTime:
          format: date-time
          description: Gets or sets the time of the last modification of the machine.
          type: string
    PortReference:
      description: Reference to a port.
      allOf:
      - $ref: '#/components/schemas/ResourceReference'
      x-ms-discriminator-value: ref:port
