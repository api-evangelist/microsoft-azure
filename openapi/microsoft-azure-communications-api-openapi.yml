paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Support/supportTickets/{supportTicketName}/checkNameAvailability:
    post:
      tags:
      - Communications
      description: Check the availability of a resource name. This API should be used to check the uniqueness of the name for adding a new communication to the support ticket.
      operationId: microsoftAzureCommunicationsChecknameavailability
      x-ms-examples:
        Checks whether name is available for Communication resource:
          $ref: ./examples/CheckNameAvailabilityForSupportTicketCommunication.json
      parameters:
      - name: supportTicketName
        in: path
        description: Support ticket name.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckNameAvailabilityOutput'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      summary: Microsoft Azure Post Subscriptions Subscriptionid Providers Microsoft Support Supporttickets Supportticketname Checknameavailability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckNameAvailabilityInput'
        description: Input to check.
        required: true
  /providers/Microsoft.Support/supportTickets/{supportTicketName}/checkNameAvailability:
    post:
      tags:
      - Communications
      description: Check the availability of a resource name. This API should be used to check the uniqueness of the name for adding a new communication to the support ticket.
      operationId: microsoftAzureCommunicationsnosubscriptionChecknameavailability
