      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/AzureResourceNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ClientTenantIdHeaderParameter'
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/TenantResource'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResource'
        default:
          description: An error response received from Power BI service.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      summary: Microsoft Azure Patch Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Powerbi Privatelinkservicesforpowerbi Azureresourcename
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantResource'
        description: Tenant resource to be created or updated.
        required: true
    delete:
      tags:
      - PowerBIResources
      operationId: microsoftAzurePowerbiresourcesDelete
      x-ms-examples:
        Deletes private link service resource:
          $ref: ./examples/PowerBIResources_Delete.json
      description: Deletes a Private Link Service Resource for Power BI.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
