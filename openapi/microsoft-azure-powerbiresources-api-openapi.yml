openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Power BI Resources API
tags:
- name: PowerBIResources
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.PowerBI/privateLinkServicesForPowerBI/{azureResourceName}
  : get:
      tags:
      - PowerBIResources
      operationId: microsoftAzurePowerbiresourcesListbyresourcename
      x-ms-examples:
        List private link resources in a Azure resource:
          $ref: ./examples/PowerBIResources_ListByResourceName.json
      description: Gets all the private link resources for the given Azure resource.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/AzureResourceNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantResource'
        default:
          description: An error response received from Power BI service.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Powerbi Privatelinkservicesforpowerbi Azureresourcename
    put:
