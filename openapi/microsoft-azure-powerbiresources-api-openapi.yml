components:
  parameters:
    AzureResourceNameParameter:
      name: azureResourceName
      in: path
      required: true
      description: The name of the Azure resource.
      x-ms-parameter-location: client
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to be used with the HTTP request.
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The Azure subscription ID. This is a GUID-formatted string (e.g. 00000000-0000-0000-0000-000000000000).
      schema:
        type: string
    ClientTenantIdHeaderParameter:
      name: x-ms-client-tenant-id
      in: header
      description: The client tenant id in header. This is a GUID-formatted string (e.g. 00000000-0000-0000-0000-000000000000).
      required: false
      x-ms-client-name: ClientTenantId
      x-ms-parameter-location: method
      schema:
        type: string
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      description: The name of the resource group.
      x-ms-parameter-location: client
      schema:
        type: string
  schemas:
    PrivateEndpointConnectionProperties:
      title: PrivateEndpointConnectionProperties
      type: object
      properties:
        privateEndpoint:
          $ref: '#/components/schemas/PrivateEndpoint'
          description: Specifies the private endpoint.
        privateLinkServiceConnectionState:
          $ref: '#/components/schemas/ConnectionState'
          description: Specifies the connection state.
        provisioningState:
          description: Provisioning state of the Private Endpoint Connection.
          enum:
          - Creating
          - Updating
          - Deleting
          - Succeeded
          - Canceled
          - Failed
          type: string
          x-ms-enum:
            name: ResourceProvisioningState
            modelAsString: true
    PrivateEndpoint:
      title: PrivateEndpoint
      type: object
      properties:
        id:
          type: string
          description: Specifies the id of private endpoint.
    TenantResource:
      title: TenantResource
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Specifies the resource identifier of the resource.
        name:
          type: string
          description: Specifies the name of the resource.
          readOnly: true
        type:
          type: string
          readOnly: true
          description: Specifies the type of the resource.
        systemData:
          readOnly: true
          description: The system metadata relating to this resource.
          $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/systemData
        location:
          type: string
          description: Specifies the location of the resource.
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/TenantProperties'
          description: Specifies the properties of the resource.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Specifies the tags of the resource.
      x-ms-azure-resource: true
    TenantProperties:
      title: TenantProperties
      type: object
      properties:
        tenantId:
          type: string
          description: Specifies the tenant id of the resource.
        privateEndpointConnections:
          type: array
          items:
            $ref: '#/components/schemas/PrivateEndpointConnection'
          description: Specifies the private endpoint connections of the resource.
    ConnectionState:
      description: ConnectionState information.
      type: object
      properties:
        status:
          description: Status of the connection.
          enum:
          - Pending
          - Approved
          - Rejected
          - Disconnected
          type: string
          x-ms-enum:
            name: PersistedConnectionStatus
            modelAsString: true
        description:
          description: Description of the connection state.
          type: string
        actionsRequired:
          description: Actions required (if any).
          type: string
    PrivateEndpointConnection:
      title: PrivateEndpointConnection
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Specifies the id of the resource.
        name:
          type: string
          readOnly: true
          description: Specifies the name of the resource.
        type:
          type: string
          readOnly: true
          description: Specifies the type of the resource.
        systemData:
          readOnly: true
          description: The system meta data relating to this resource.
          $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/systemData
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/PrivateEndpointConnectionProperties'
          description: Specifies the properties of the private endpoint connection.
      x-ms-azure-resource: true
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
