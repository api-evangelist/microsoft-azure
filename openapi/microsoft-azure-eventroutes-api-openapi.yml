openapi: 3.2.0
info:
  version: 2023-02-27-preview
  title: Microsoft Azure Azure Digital Twins Event Routes API
  description: A service for managing and querying digital twins and digital twin models.
servers:
- url: https://digitaltwins-hostname
security:
- oauth2: []
tags:
- name: EventRoutes
paths:
  /eventroutes:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    get:
      tags:
      - EventRoutes
      description: 'Retrieves all event routes.

        Status codes:

        * 200 OK'
      operationId: microsoftAzureEventroutesList
      x-ms-examples:
        List event routes:
          $ref: ./examples/EventRoutesList.json
      parameters:
      - $ref: '#/components/parameters/max-items-per-page'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRouteCollection'
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Eventroutes
  /eventroutes/{id}:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    get:
      tags:
      - EventRoutes
      description: 'Retrieves an event route.

        Status codes:

        * 200 OK

        * 404 Not Found

        * EventRouteNotFound - The event route was not found.'
      operationId: microsoftAzureEventroutesGetbyid
      x-ms-examples:
        Get an event route by id:
          $ref: ./examples/EventRouteGet.json
      parameters:
      - $ref: '#/components/parameters/eventRouteId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRoute'
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Get Eventroutes Id
    put:
      tags:
      - EventRoutes
      description: 'Adds or replaces an event route.

        Status codes:

        * 204 No Content

        * 400 Bad Request

        * EventRouteEndpointInvalid - The endpoint provided does not exist or is not active.

        * EventRouteFilterInvalid - The event route filter is invalid.

        * EventRouteIdInvalid - The event route id is invalid.

        * LimitExceeded - The maximum number of event routes allowed has been reached.'
      operationId: microsoftAzureEventroutesAdd
      x-ms-examples:
        Add an event route:
          $ref: ./examples/EventRoutePut.json
        Add an event route (with filter):
          $ref: ./examples/EventRoutePutWithFilter.json
      parameters:
      - $ref: '#/components/parameters/eventRouteId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '204':
          description: Success
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Put Eventroutes Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRoute'
        description: The event route data
        required: true
    delete:
      tags:
      - EventRoutes
      description: 'Deletes an event route.

        Status codes:

        * 204 No Content

        * 404 Not Found

        * EventRouteNotFound - The event route was not found.'
      operationId: microsoftAzureEventroutesDelete
      x-ms-examples:
        Delete an event route:
          $ref: ./examples/EventRouteDelete.json
      parameters:
      - $ref: '#/components/parameters/eventRouteId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '204':
          description: Success
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Delete Eventroutes Id
components:
  schemas:
    EventRouteCollection:
      description: A collection of EventRoute objects.
      type: object
      required:
      - value
      properties:
        value:
          description: The EventRoute objects.
          type: array
          items:
            $ref: '#/components/schemas/EventRoute'
        nextLink:
          description: A URI to retrieve the next page of results.
          type: string
    Error:
      description: Error definition.
      properties:
        code:
          description: Service specific error code which serves as the substatus for the HTTP error code.
          type: string
          readOnly: true
        message:
          description: A human-readable representation of the error.
          type: string
          readOnly: true
        details:
          description: Internal error details.
          type: array
          items:
            $ref: '#/components/schemas/Error'
          readOnly: true
        innererror:
          description: An object containing more specific information than the current object about the error.
          $ref: '#/components/schemas/InnerError'
    ErrorResponse:
      description: Error response.
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
          description: The error details.
    InnerError:
      description: A more specific error description than was provided by the containing error.
      properties:
        code:
          description: A more specific error code than was provided by the containing error.
          type: string
        innererror:
          description: An object containing more specific information than the current object about the error.
          $ref: '#/components/schemas/InnerError'
    EventRoute:
      description: A route which directs notification and telemetry events to an endpoint. Endpoints are a destination outside of Azure Digital Twins such as an EventHub.
      type: object
      required:
      - endpointName
      - filter
      properties:
        id:
          description: The id of the event route.
          type: string
          readOnly: true
        endpointName:
          description: The name of the endpoint this event route is bound to.
          type: string
        filter:
          description: An expression which describes the events which are routed to the endpoint.
          type: string
  parameters:
    api-version:
      name: api-version
      in: query
      description: The requested API version.
      required: true
      schema:
        type: string
        minLength: 1
    tracestate:
      name: tracestate
      in: header
      description: Provides vendor-specific trace identification information and is a companion to traceparent.
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        postfix: Options
      schema:
        type: string
    traceparent:
      name: traceparent
      in: header
      description: Identifies the request in a distributed tracing system.
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        postfix: Options
      schema:
        type: string
    max-items-per-page:
      name: max-items-per-page
      in: header
      description: The maximum number of items to retrieve per request. The server may choose to return less than the requested number.
      required: false
      x-ms-client-name: MaxItemsPerPage
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        postfix: Options
      schema:
        type: integer
    eventRouteId:
      name: id
      in: path
      required: true
      description: The id for an event route. The id is unique within event routes and case sensitive.
      x-ms-parameter-location: method
      schema:
        type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes: {}
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize?resource=0b07f429-9f4b-4714-9392-cc5e8e80c8b0
