      - SecurityUserConfigurations
      description: Retrieves a network manager security user configuration.
      operationId: microsoftAzureSecurityuserconfigurationsGet
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserConfiguration'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ./network.json#/definitions/CloudError
      x-ms-examples:
        Get security user configurations:
          $ref: ./examples/NetworkManagerSecurityUserConfigurationGet.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Networkmanagers Networkmanagername Securityuserconfigurations Configurationname
    put:
      tags:
      - SecurityUserConfigurations
      description: Creates or updates a network manager security user configuration.
      operationId: microsoftAzureSecurityuserconfigurationsCreateorupdate
      responses:
        '200':
          description: Updated Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserConfiguration'
        '201':
          description: Created Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserConfiguration'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ./network.json#/definitions/CloudError
