components:
  schemas:
    DevopsPolicyList:
      required:
      - value
      type: object
      properties:
        value:
          type: array
          description: List of policies
          items:
            $ref: '#/components/schemas/DevopsPolicy'
        nextLink:
          type: string
          description: Pagination link
    ErrorResponseModel:
      description: The error response model for policy
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorModel'
    SystemData:
      type: object
      readOnly: true
      properties:
        createdBy:
          type: string
          description: Created by
        createdByType:
          type: string
          description: Created by type
        createdAt:
          format: date-time
          type: string
          description: Created at
        lastModifiedBy:
          type: string
          description: last modified by
        lastModifiedByType:
          type: string
          description: last modified by type
        lastModifiedAt:
          format: date-time
          type: string
          description: last modified at
    DevopsPolicyDecisionRule:
      type: object
      required:
      - effect
      - principals
      - principalGroups
      properties:
        effect:
          description: The effect for rule
          enum:
          - Permit
          type: string
          x-ms-enum:
            name: Decision
            modelAsString: true
        purviewRoleName:
          type: string
          description: This is field will indicate the role of a devops policy.
        principals:
          type: array
          description: Azure Active Directory Ids for users
          items:
            type: string
            description: Azure Active Directory Id
        principalGroups:
          type: array
          description: Azure Active Directory Ids for groups
          items:
            type: string
            description: Azure Active Directory Id
        resourceAzurePath:
          type: string
          description: Optional resource path of the azure resource
    ErrorModel:
      description: The error model for policy
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: The error code
          minLength: 1
          type: string
        message:
          description: The error message
          minLength: 1
          type: string
        details:
          description: The error details
          type: array
          items:
            $ref: '#/components/schemas/ErrorModel'
    DevopsPolicy:
      required:
      - decisionRules
      - purviewResourceName
      type: object
      properties:
        systemData:
          $ref: '#/components/schemas/SystemData'
        decisionRules:
          type: array
          description: Array of decisionRules for the policy
          items:
            $ref: '#/components/schemas/DevopsPolicyDecisionRule'
        purviewResourceName:
          type: string
          description: Purview resource name
  parameters:
    api-version:
      in: query
      name: api-version
      description: The api version to use.
      required: true
      x-ms-client-name: ApiVersion
      x-ms-parameter-location: method
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
