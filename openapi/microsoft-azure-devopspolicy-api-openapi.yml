        name: purviewResourceName
        description: Name of resource as registered on the Azure purview portal
        required: true
        schema:
          type: string
      - in: header
        name: If-Match
        description: Http Etag value of a policy to be updated. Required only during the replace operation
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: An HTTP entity tag associated with the policy entity
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevopsPolicy'
        '201':
          description: Created
          headers:
            ETag:
              description: An HTTP entity tag associated with the policy entity
              schema:
                type: string
          content:
            application/json:
              schema:
