      summary: Microsoft Azure Put Devops Policies Purviewresourcename Sql Security Auditor Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevopsPolicy'
        description: Devops policy object to create or update..
        required: true
