openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Acr Metadata API
servers:
- url: https://{registryName}.azurecr.io
  description: Azure Container Registry data plane endpoint
  variables:
    registryName:
      default: myregistry
      description: The name of the Azure Container Registry.
tags:
- name: AcrMetadata
paths:
  /acr/v1/{name}:
    get:
      tags:
      - AcrMetadata
      description: Get repository attributes
      operationId: microsoftAzureGetacrrepositoryattributes
      x-ms-examples:
        Get details of repository:
          $ref: ./examples/GetAcrRepositoryAttributes.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      responses:
        '200':
          description: Returns a list of attributes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryAttributes'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get Acr Name
    patch:
      tags:
      - AcrMetadata
      description: Update the attribute identified by `name` where `reference` is the name of the repository.
      operationId: microsoftAzureUpdateacrrepositoryattributes
      x-ms-examples:
        Update repository attributes:
          $ref: ./examples/UpdateAcrRepository.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      responses:
        '200':
          description: The attributes is updated
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Patch Acr Name
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeableAttributes'
        description: Repository attribute value
  /acr/v1/{name}/_tags:
    get:
      tags:
      - AcrMetadata
      description: List tags of a repository
      operationId: microsoftAzureGetacrtags
      x-ms-examples:
        Get tags of a repository:
          $ref: ./examples/GetAcrTags.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/QueryLast'
      - $ref: '#/components/parameters/QueryNum'
      - $ref: '#/components/parameters/QueryOrderBy'
      - $ref: '#/components/parameters/QueryDigest'
      responses:
        '200':
          description: Tag details of a repository
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrRepositoryTags'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get Acr Name Tags
  /acr/v1/{name}/_tags/{reference}:
    get:
      tags:
      - AcrMetadata
      description: Get tag attributes by tag
      operationId: microsoftAzureGetacrtagattributes
      x-ms-examples:
        Get tag attributes:
          $ref: ./examples/GetAcrTagAttributes.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/ManifestReference'
      responses:
        '200':
          description: Tag attributes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrTagAttributes'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get Acr Name Tags Reference
    patch:
      tags:
      - AcrMetadata
      description: Update tag attributes
      operationId: microsoftAzureUpdateacrtagattributes
      x-ms-examples:
        Update attributes of a manifest:
          $ref: ./examples/UpdateAcrTagAttributes.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/ManifestReference'
      - $ref: '#/components/parameters/RepoValue'
      responses:
        '200':
          description: The attributes are updated
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Patch Acr Name Tags Reference
    delete:
      tags:
      - AcrMetadata
      description: Delete tag
      operationId: microsoftAzureDeleteacrtag
      x-ms-examples:
        Update attributes of a manifest:
          $ref: ./examples/DeleteAcrTag.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/ManifestReference'
      responses:
        '202':
          description: The tag is deleted
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Delete Acr Name Tags Reference
  /acr/v1/{name}/_manifests:
    get:
      tags:
      - AcrMetadata
      description: List manifests of a repository
      operationId: microsoftAzureGetacrmanifests
      x-ms-examples:
        Get details of repository:
          $ref: ./examples/GetAcrManifests.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/QueryLast'
      - $ref: '#/components/parameters/QueryNum'
      - $ref: '#/components/parameters/QueryOrderBy'
      responses:
        '200':
          description: Returns a list of manifests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrManifests'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get Acr Name Manifests
  /acr/v1/{name}/_manifests/{reference}:
    get:
      tags:
      - AcrMetadata
      description: Get manifest attributes
      operationId: microsoftAzureGetacrmanifestattributes
      x-ms-examples:
        Get manifest attributes:
          $ref: ./examples/GetAcrManifestAttributes.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/ImageReference'
      responses:
        '200':
          description: List of attributes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrManifestAttributes'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get Acr Name Manifests Reference
    patch:
      tags:
      - AcrMetadata
      description: Update attributes of a manifest
      operationId: microsoftAzureUpdateacrmanifestattributes
      x-ms-examples:
        Update attributes of a manifest:
          $ref: ./examples/UpdateAcrManifestAttributes.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/ImageReference'
      - $ref: '#/components/parameters/RepoValue'
      responses:
        '200':
          description: The attributes are updated
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Patch Acr Name Manifests Reference
components:
  parameters:
    QueryOrderBy:
      name: orderby
      in: query
      description: orderby query parameter
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    ImageName:
      name: name
      in: path
      description: Name of the image (including the namespace)
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ManifestReference:
      name: reference
      in: path
      description: Tag or digest of the target manifest
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    QueryLast:
      name: last
      in: query
      description: Query parameter for the last item in previous query. Result set will include values lexically after last.
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    QueryDigest:
      name: digest
      in: query
      description: filter by digest
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    ImageReference:
      name: reference
      in: path
      description: A tag or a digest, pointing to a specific image
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    RepoValue:
      name: value
      in: body
      description: Repository attribute value
      required: false
      schema:
        $ref: '#/components/schemas/ChangeableAttributes'
      x-ms-parameter-location: method
    QueryNum:
      name: n
      in: query
      description: query parameter for max number of items
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
  schemas:
    AcrRepositoryTags:
      description: List of tag details
      properties:
        registry:
          type: string
          description: Registry name
        imageName:
          type: string
          description: Image name
        tags:
          type: array
          x-ms-client-name: TagsAttributes
          description: List of tag attribute details
          items:
            $ref: '#/components/schemas/AcrTagAttributesBase'
      example:
        registry: registry
        imageName: imageName
        tags:
        - changeableAttributes:
            readEnabled: true
            listEnabled: true
            deleteEnabled: true
            writeEnabled: true
          name: name
          digest: digest
          createdTime: createdTime
          signed: true
          lastUpdateTime: lastUpdateTime
        - changeableAttributes:
            readEnabled: true
            listEnabled: true
            deleteEnabled: true
            writeEnabled: true
          name: name
          digest: digest
          createdTime: createdTime
          signed: true
          lastUpdateTime: lastUpdateTime
    AcrManifestAttributesBase:
      type: object
      description: Manifest details
      properties:
        digest:
          type: string
          description: Manifest
        imageSize:
          type: integer
          description: Image size
        createdTime:
          type: string
          description: Created time
        lastUpdateTime:
          type: string
          description: Last update time
        architecture:
          type: string
          description: CPU architecture
        os:
          type: string
          description: Operating system
        mediaType:
          type: string
          description: Media type
        configMediaType:
          type: string
          description: Config blob media type
        tags:
          type: array
          description: List of tags
          items:
            type: string
            description: Tag name
        changeableAttributes:
          $ref: '#/components/schemas/ChangeableAttributes'
          description: Changeable attributes
      example:
        changeableAttributes:
          readEnabled: true
          listEnabled: true
          deleteEnabled: true
          writeEnabled: true
        os: os
        digest: digest
        imageSize: 2401606
        createdTime: createdTime
        mediaType: mediaType
        configMediaType: configMediaType
        lastUpdateTime: lastUpdateTime
        architecture: architecture
        tags:
        - tags
        - tags
    ChangeableAttributes:
      properties:
        deleteEnabled:
          type: boolean
          description: Delete enabled
        writeEnabled:
          type: boolean
          description: Write enabled
        listEnabled:
          type: boolean
          description: List enabled
        readEnabled:
          type: boolean
          description: Read enabled
      example:
        readEnabled: true
        listEnabled: true
        deleteEnabled: true
        writeEnabled: true
    AcrTagAttributesBase:
      description: Tag attribute details
      properties:
        name:
          type: string
          description: Tag name
        digest:
          type: string
          description: Tag digest
        createdTime:
          type: string
          description: Tag created time
        lastUpdateTime:
          type: string
          description: Tag last update time
        signed:
          type: boolean
          description: Is signed
        changeableAttributes:
          $ref: '#/components/schemas/ChangeableAttributes'
          description: Changeable attributes
      example:
        changeableAttributes:
          readEnabled: true
          listEnabled: true
          deleteEnabled: true
          writeEnabled: true
        name: tagname
        digest: sha256:0873c923e00e0fd2ba78041bfb64a105e1ecb7678916d1f7776311e45bf5634b
        createdTime: '2018-08-10T17:28:44.1082945Z'
        signed: true
        lastUpdateTime: '2018-08-10T17:28:44.1082945Z'
    AcrManifestAttributes:
      description: Manifest attributes details
      properties:
        registry:
          description: Registry name
          type: string
        imageName:
          description: Image name
          type: string
        manifest:
          x-ms-client-name: ManifestAttributes
          description: Manifest attributes
          $ref: '#/components/schemas/AcrManifestAttributesBase'
      example:
        registry: acrapi.azurecr-test.io
        imageName: nanoserver
        manifest:
          digest: sha256:110d2b6c84592561338aa040b1b14b7ab81c2f9edbd564c2285dd7d70d777086
          imageSize: 2401606
          createdTime: '2018-09-06T06:17:20.9983915Z'
          lastUpdateTime: '2018-09-06T06:17:20.9983915Z'
          architecture: amd64
          os: windows
          mediaType: application/vnd.docker.distribution.manifest.v2+json
          configMediaType: application/vnd.docker.container.image.v1+json
          tags:
          - 4.7.2-20180905-nanoserver-1803
          changeableAttributes:
            deleteEnabled: true
            writeEnabled: true
            readEnabled: true
            listEnabled: true
    RepositoryAttributes:
      type: object
      description: Repository attributes
      properties:
        registry:
          type: string
          description: Registry name
        imageName:
          type: string
          description: Image name
        createdTime:
          type: string
          description: Image created time
        lastUpdateTime:
          type: string
          description: Image last update time
        manifestCount:
          type: integer
          description: Number of the manifests
        tagCount:
          type: integer
          description: Number of the tags
        changeableAttributes:
          description: Changeable attributes
          $ref: '#/components/schemas/ChangeableAttributes'
      example:
        registry: registryname.azurecr.io
        changeableAttributes:
          readEnabled: true
          listEnabled: true
          deleteEnabled: true
          writeEnabled: true
        imageName: imageName
        createdTime: '2018-09-07T16:30:46.6583219Z'
        tagCount: 6
        manifestCount: 2
        lastUpdateTime: '2018-09-07T16:30:46.6583219Z'
    AcrManifests:
      description: Manifest attributes
      properties:
        registry:
          type: string
          description: Registry name
        imageName:
          type: string
          description: Image name
        manifests:
          x-ms-client-name: ManifestsAttributes
          type: array
          description: List of manifests
          items:
            $ref: '#/components/schemas/AcrManifestAttributesBase'
            description: Manifest details
      example:
        registry: registry
        imageName: imageName
        manifests:
        - changeableAttributes:
            quarantineDetails: quarantineDetails
            readEnabled: true
            quarantineState: quarantineState
            listEnabled: true
            deleteEnabled: true
            writeEnabled: true
          os: os
          digest: digest
          imageSize: 2401606
          createdTime: createdTime
          mediaType: mediaType
          configMediaType: configMediaType
          lastUpdateTime: lastUpdateTime
          architecture: architecture
          tags:
          - tags
          - tags
        - changeableAttributes:
            quarantineDetails: quarantineDetails
            readEnabled: true
            quarantineState: quarantineState
            listEnabled: true
            deleteEnabled: true
            writeEnabled: true
          os: os
          digest: digest
          imageSize: 2401606
          createdTime: createdTime
          mediaType: mediaType
          configMediaType: configMediaType
          lastUpdateTime: lastUpdateTime
          architecture: architecture
          tags:
          - tags
          - tags
    AcrErrors:
      description: Acr error response describing why the operation failed
      properties:
        errors:
          type: array
          description: Array of detailed error
          items:
            $ref: '#/components/schemas/AcrErrorInfo'
    AcrErrorInfo:
      description: Error information
      properties:
        code:
          description: Error code
          type: string
        message:
          type: string
          description: Error message
        detail:
          type: object
          description: Error details
    AcrTagAttributes:
      description: Tag attributes
      properties:
        registry:
          type: string
          description: Registry name
        imageName:
          type: string
          description: Image name
        tag:
          x-ms-client-name: TagAttributes
          description: List of tag attribute details
          $ref: '#/components/schemas/AcrTagAttributesBase'
      example:
        registry: registry
        imageName: imageName
        tag:
          changeableAttributes:
            readEnabled: true
            listEnabled: true
            deleteEnabled: true
            writeEnabled: true
          name: name
          digest: digest
          createdTime: createdTime
          signed: true
          lastUpdateTime: lastUpdateTime
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
