openapi: 3.2.0
info:
  title: Microsoft Azure Azure Container Registry Acr Metadata API
  description: Metadata API definition for the Azure Container Registry runtime
  version: 2019-07-15-preview
security:
- registry_auth: []
  registry_oauth2: []
tags:
- name: AcrMetadata
paths:
  /acr/v1/{name}:
    get:
      tags:
      - AcrMetadata
      description: Get repository attributes
      operationId: microsoftAzureGetacrrepositoryattributes
      x-ms-examples:
        Get details of repository:
          $ref: ./examples/GetAcrRepositoryAttributes.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      responses:
        '200':
          description: Returns a list of attributes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryAttributes'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get Acr Name
    patch:
      tags:
      - AcrMetadata
      description: Update the attribute identified by `name` where `reference` is the name of the repository.
      operationId: microsoftAzureUpdateacrrepositoryattributes
      x-ms-examples:
        Update repository attributes:
          $ref: ./examples/UpdateAcrRepository.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      responses:
        '200':
          description: The attributes is updated
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Patch Acr Name
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeableAttributes'
        description: Repository attribute value
  /acr/v1/{name}/_tags:
    get:
      tags:
      - AcrMetadata
      description: List tags of a repository
      operationId: microsoftAzureGetacrtags
      x-ms-examples:
        Get tags of a repository:
          $ref: ./examples/GetAcrTags.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/QueryLast'
      - $ref: '#/components/parameters/QueryNum'
      - $ref: '#/components/parameters/QueryOrderBy'
      - $ref: '#/components/parameters/QueryDigest'
      responses:
        '200':
          description: Tag details of a repository
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrRepositoryTags'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get Acr Name Tags
  /acr/v1/{name}/_tags/{reference}:
    get:
      tags:
      - AcrMetadata
      description: Get tag attributes by tag
      operationId: microsoftAzureGetacrtagattributes
      x-ms-examples:
        Get tag attributes:
          $ref: ./examples/GetAcrTagAttributes.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/ManifestReference'
      responses:
        '200':
          description: Tag attributes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrTagAttributes'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get Acr Name Tags Reference
    patch:
      tags:
      - AcrMetadata
      description: Update tag attributes
      operationId: microsoftAzureUpdateacrtagattributes
      x-ms-examples:
        Update attributes of a manifest:
          $ref: ./examples/UpdateAcrTagAttributes.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/ManifestReference'
      - $ref: '#/components/parameters/RepoValue'
      responses:
        '200':
          description: The attributes are updated
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Patch Acr Name Tags Reference
    delete:
      tags:
      - AcrMetadata
      description: Delete tag
      operationId: microsoftAzureDeleteacrtag
      x-ms-examples:
        Update attributes of a manifest:
          $ref: ./examples/DeleteAcrTag.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      - $ref: '#/components/parameters/ManifestReference'
      responses:
        '202':
          description: The tag is deleted
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Delete Acr Name Tags Reference
components:
  schemas:
    AcrErrorInfo:
      description: Error information
      properties:
        code:
          description: Error code
          type: string
        message:
          type: string
          description: Error message
        detail:
          type: object
          description: Error details
    RepositoryAttributes:
      type: object
      description: Repository attributes
      properties:
        registry:
          type: string
          description: Registry name
        imageName:
          type: string
          description: Image name
        createdTime:
          type: string
          description: Image created time
        lastUpdateTime:
          type: string
          description: Image last update time
        manifestCount:
          type: integer
          description: Number of the manifests
        tagCount:
          type: integer
          description: Number of the tags
        changeableAttributes:
          description: Changeable attributes
          $ref: '#/components/schemas/ChangeableAttributes'
      example:
        registry: registryname.azurecr.io
        changeableAttributes:
          readEnabled: true
          listEnabled: true
          deleteEnabled: true
          writeEnabled: true
        imageName: imageName
        createdTime: '2018-09-07T16:30:46.6583219Z'
        tagCount: 6
        manifestCount: 2
        lastUpdateTime: '2018-09-07T16:30:46.6583219Z'
    AcrTagAttributesBase:
      description: Tag attribute details
      properties:
        name:
          type: string
          description: Tag name
        digest:
          type: string
          description: Tag digest
        createdTime:
          type: string
          description: Tag created time
        lastUpdateTime:
          type: string
          description: Tag last update time
        signed:
          type: boolean
          description: Is signed
        changeableAttributes:
          $ref: '#/components/schemas/ChangeableAttributes'
          description: Changeable attributes
      example:
        changeableAttributes:
          readEnabled: true
          listEnabled: true
          deleteEnabled: true
          writeEnabled: true
        name: tagname
        digest: sha256:0873c923e00e0fd2ba78041bfb64a105e1ecb7678916d1f7776311e45bf5634b
        createdTime: '2018-08-10T17:28:44.1082945Z'
        signed: true
        lastUpdateTime: '2018-08-10T17:28:44.1082945Z'
    ChangeableAttributes:
      properties:
        deleteEnabled:
          type: boolean
          description: Delete enabled
        writeEnabled:
          type: boolean
          description: Write enabled
        listEnabled:
          type: boolean
          description: List enabled
        readEnabled:
          type: boolean
          description: Read enabled
      example:
        readEnabled: true
        listEnabled: true
        deleteEnabled: true
        writeEnabled: true
    AcrErrors:
      description: Acr error response describing why the operation failed
      properties:
        errors:
          type: array
          description: Array of detailed error
          items:
            $ref: '#/components/schemas/AcrErrorInfo'
    AcrTagAttributes:
      description: Tag attributes
      properties:
        registry:
          type: string
          description: Registry name
        imageName:
          type: string
          description: Image name
        tag:
          x-ms-client-name: TagAttributes
          description: List of tag attribute details
          $ref: '#/components/schemas/AcrTagAttributesBase'
      example:
        registry: registry
        imageName: imageName
        tag:
          changeableAttributes:
            readEnabled: true
            listEnabled: true
            deleteEnabled: true
            writeEnabled: true
          name: name
          digest: digest
          createdTime: createdTime
          signed: true
          lastUpdateTime: lastUpdateTime
    AcrRepositoryTags:
      description: List of tag details
      properties:
        registry:
          type: string
          description: Registry name
        imageName:
          type: string
          description: Image name
        tags:
          type: array
          x-ms-client-name: TagsAttributes
          description: List of tag attribute details
          items:
            $ref: '#/components/schemas/AcrTagAttributesBase'
      example:
        registry: registry
        imageName: imageName
        tags:
        - changeableAttributes:
            readEnabled: true
            listEnabled: true
            deleteEnabled: true
            writeEnabled: true
          name: name
          digest: digest
          createdTime: createdTime
          signed: true
          lastUpdateTime: lastUpdateTime
        - changeableAttributes:
            readEnabled: true
            listEnabled: true
            deleteEnabled: true
            writeEnabled: true
          name: name
          digest: digest
          createdTime: createdTime
          signed: true
          lastUpdateTime: lastUpdateTime
  parameters:
    QueryDigest:
      name: digest
      in: query
      description: filter by digest
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    QueryNum:
      name: n
      in: query
      description: query parameter for max number of items
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
    ImageName:
      name: name
      in: path
      description: Name of the image (including the namespace)
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ManifestReference:
      name: reference
      in: path
      description: Tag or digest of the target manifest
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    QueryOrderBy:
      name: orderby
      in: query
      description: orderby query parameter
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    QueryLast:
      name: last
      in: query
      description: Query parameter for the last item in previous query. Result set will include values lexically after last.
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    RepoValue:
      name: value
      in: body
      description: Repository attribute value
      required: false
      schema:
        $ref: '#/components/schemas/ChangeableAttributes'
      x-ms-parameter-location: method
  securitySchemes:
    registry_auth:
      type: http
      scheme: basic
    registry_oauth2:
      type: apiKey
      in: header
      name: Authorization
x-ms-parameterized-host:
  hostTemplate: '{url}'
  useSchemePrefix: false
  positionInOperation: first
  parameters:
  - $ref: '#/components/parameters/Url'
