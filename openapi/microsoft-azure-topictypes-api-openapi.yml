openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Topic Types API
tags:
- name: TopicTypes
paths:
  /providers/Microsoft.EventGrid/topicTypes:
    get:
      tags:
      - TopicTypes
      summary: Microsoft Azure List Topic Types
      description: List all registered topic types.
      operationId: microsoftAzureTopictypesList
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicTypesListResult'
        default:
          description: "*** Error Responses: ***\n\n * 400 Bad Request.\n\n * 404 Not Found.\n\n * 500 Internal Server Error."
      x-ms-examples:
        TopicTypes_List:
          $ref: ./examples/TopicTypes_List.json
      x-ms-pageable:
        nextLinkName: null
  /providers/Microsoft.EventGrid/topicTypes/{topicTypeName}:
    get:
      tags:
      - TopicTypes
      summary: Microsoft Azure Get A Topic Type
      description: Get information about a topic type.
      operationId: microsoftAzureTopictypesGet
      parameters:
      - name: topicTypeName
        in: path
        description: Name of the topic type.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicTypeInfo'
        default:
          description: "*** Error Responses: ***\n\n * 400 Bad Request.\n\n * 404 Not Found.\n\n * 500 Internal Server Error."
      x-ms-examples:
        TopicTypes_Get:
          $ref: ./examples/TopicTypes_Get.json
  /providers/Microsoft.EventGrid/topicTypes/{topicTypeName}/eventTypes:
    get:
      tags:
      - TopicTypes
      summary: Microsoft Azure List Event Types
      description: List event types for a topic type.
      operationId: microsoftAzureTopictypesListeventtypes
      parameters:
      - name: topicTypeName
        in: path
        description: Name of the topic type.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypesListResult'
        default:
          description: "*** Error Responses: ***\n\n * 400 Bad Request.\n\n * 404 Not Found.\n\n * 500 Internal Server Error."
      x-ms-examples:
        TopicTypes_ListEventTypes:
          $ref: ./examples/TopicTypes_ListEventTypes.json
      x-ms-pageable:
        nextLinkName: null
components:
  schemas:
    EventTypesListResult:
      description: Result of the List Event Types operation
      type: object
      properties:
        value:
          description: A collection of event types
          type: array
          items:
            $ref: '#/components/schemas/EventType'
    TopicTypeProperties:
      description: Properties of a topic type.
      type: object
      properties:
        provider:
          description: Namespace of the provider of the topic type.
          type: string
        displayName:
          description: Display Name for the topic type.
          type: string
        description:
          description: Description of the topic type.
          type: string
        resourceRegionType:
          description: Region type of the resource.
          enum:
          - RegionalResource
          - GlobalResource
          type: string
          x-ms-enum:
            name: ResourceRegionType
            modelAsString: true
        provisioningState:
          description: Provisioning state of the topic type
          enum:
          - Creating
          - Updating
          - Deleting
          - Succeeded
          - Canceled
          - Failed
          type: string
          x-ms-enum:
            name: TopicTypeProvisioningState
            modelAsString: true
        supportedLocations:
          description: List of locations supported by this topic type.
          type: array
          items:
            type: string
        sourceResourceFormat:
          description: Source resource format.
          type: string
        supportedScopesForSource:
          description: Supported source scopes.
          type: array
          items:
            enum:
            - Resource
            - ResourceGroup
            - AzureSubscription
            - ManagementGroup
            type: string
            x-ms-enum:
              name: TopicTypeSourceScope
              modelAsString: true
    TopicTypeInfo:
      description: Properties of a topic type info.
      type: object
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        properties:
          $ref: '#/components/schemas/TopicTypeProperties'
          description: Properties of the topic type info
          x-ms-client-flatten: true
    EventType:
      description: Event Type for a subject under a topic
      type: object
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        properties:
          $ref: '#/components/schemas/EventTypeProperties'
          description: Properties of the event type.
          x-ms-client-flatten: true
    TopicTypesListResult:
      description: Result of the List Topic Types operation
      type: object
      properties:
        value:
          description: A collection of topic types
          type: array
          items:
            $ref: '#/components/schemas/TopicTypeInfo'
    Resource:
      description: Definition of a Resource
      type: object
      properties:
        id:
          description: Fully qualified identifier of the resource.
          type: string
          readOnly: true
        name:
          description: Name of the resource.
          type: string
          readOnly: true
        type:
          description: Type of the resource.
          type: string
          readOnly: true
      x-ms-azure-resource: true
    EventTypeProperties:
      description: Properties of the event type
      type: object
      properties:
        displayName:
          description: Display name of the event type.
          type: string
        description:
          description: Description of the event type.
          type: string
        schemaUrl:
          description: Url of the schema for this event type.
          type: string
        isInDefaultSet:
          description: IsInDefaultSet flag of the event type.
          type: boolean
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      description: Version of the API to be used with the client request.
      required: true
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
