            name: DataProvider
            modelAsString: true
        satelliteSource:
          description: 'Source of satellite data. Available Value: Sentinel_2_L2A.'
          minLength: 1
          enum:
          - Sentinel_2_L2A
          - Sentinel_2_L1C
          type: string
          x-ms-enum:
            name: Source
            modelAsString: true
        sensorType:
          description: 'SensorType. The sensor placement map generated for sensor type (e.g., soil moisture, soil temperature, npk). Available Value: SoilMoisture.'
          minLength: 1
          type: string
        isRanked:
          description: IsRanked, if True the sensor placements will be ranked.
          type: boolean
        id:
          description: Unique job id.
          type: string
          readOnly: true
        status:
          description: 'Status of the job.

            Possible values: ''Waiting'', ''Running'', ''Succeeded'', ''Failed'', ''Cancelled''.'
          type: string
          readOnly: true
        durationInSeconds:
          format: double
          description: Duration of the job in seconds.
          type: number
          readOnly: true
        message:
          description: Status message to capture more details of the job.
          type: string
          readOnly: true
        errorCode:
          description: Error Code when job failed.
          type: string
          readOnly: true
        createdDateTime:
          format: date-time
          description: 'Job created at dateTime. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        lastActionDateTime:
          format: date-time
          description: 'Job was last acted upon at dateTime. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        startTime:
          format: date-time
          description: 'Job start time when available. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        endTime:
          format: date-time
          description: 'Job end time when available. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        name:
          description: Name to identify resource.
          maxLength: 100
          minLength: 0
          type: string
        description:
          description: Textual description of the resource.
          maxLength: 500
          minLength: 0
          type: string
        createdBy:
          description: Created by user/tenant id.
          type: string
          readOnly: true
        modifiedBy:
          description: Modified by user/tenant id.
          type: string
          readOnly: true
        properties:
          description: 'A collection of key value pairs that belongs to the resource.

            Each pair must not have a key greater than 50 characters

            and must not have a value greater than 150 characters.

            Note: A maximum of 25 key value pairs can be provided for a resource and only string,

            numeral and datetime (yyyy-MM-ddTHH:mm:ssZ) values are supported.'
          type: object
          additionalProperties: {}
          example:
            key1: value1
            key2: 123.45
    Error:
      description: An error from the Azure AgPlatform service.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Server-defined set of error codes.
          minLength: 1
          type: string
        message:
          description: Human-readable representation of the error.
          minLength: 1
          type: string
        target:
          description: Target of the error.
          type: string
        details:
          description: Array of details about specific errors that led to this reported error.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        innererror:
          $ref: '#/components/schemas/InnerError'
    BiomassModelJob:
      description: Schema of biomass model job.
      required:
      - boundaryId
      - cropName
      - imageFormat
      - imageResolution
      - inferenceEndDateTime
      - modelVersion
      - partyId
      - plantingStartDateTime
      - satelliteProvider
      - satelliteSource
      - weatherExtensionId
      type: object
      properties:
        partyId:
          description: Party Id.
          minLength: 1
          type: string
        boundaryId:
          description: The id of the boundary object for which biomass is being calculated.
          minLength: 1
          type: string
        modelVersion:
          description: 'The version of the biomass model to be run. Available Value: 1.0 .'
          minLength: 1
          type: string
        cropName:
          description: 'Crop name for biomass model. Available Value: Corn.'
          minLength: 1
