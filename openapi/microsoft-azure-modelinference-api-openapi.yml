components:
  schemas:
    SoilMoistureModelJob:
      description: Schema of soil moisture model job.
      required:
      - boundaryId
      - imageFormat
      - imageResolution
      - inferenceEndDateTime
      - inferenceStartDateTime
      - modelVersion
      - partyId
      - satelliteProvider
      - satelliteSource
      - sensorDataModelId
      - sensorDefinition
      - sensorPartnerId
      type: object
      properties:
        partyId:
          description: Party Id.
          minLength: 1
          type: string
        boundaryId:
          description: The id of the boundary object for which soil moisture is being calculated.
          minLength: 1
          type: string
        sensorDataModelId:
          description: Sensor data model Id.
          minLength: 1
          type: string
        sensorPartnerId:
          description: Sensor partner Id.
          minLength: 1
          type: string
        inferenceStartDateTime:
          format: date-time
          description: Inference start date time for soil moisture calculations.
          type: string
        inferenceEndDateTime:
          format: date-time
          description: Inference end date time for soil moisture calculations.
          type: string
        satelliteProvider:
          description: 'Provider of satellite data. Available Value: Microsoft.'
          minLength: 1
          enum:
          - Microsoft
          type: string
          x-ms-enum:
            name: DataProvider
            modelAsString: true
        satelliteSource:
          description: 'Source of satellite data. Available Value: Sentinel_2_L2A.'
          minLength: 1
          enum:
          - Sentinel_2_L2A
          - Sentinel_2_L1C
          type: string
          x-ms-enum:
            name: Source
            modelAsString: true
        imageResolution:
          format: double
          description: 'ImageResolution in meters. Available values: 10, 20, 60.'
          type: number
        imageFormat:
          description: 'ImageFormat. Available value: TIF.'
          minLength: 1
          enum:
          - TIF
          type: string
          x-ms-enum:
            name: ImageFormat
            modelAsString: true
        modelVersion:
          description: The version of the soil moisture model to be run.
          minLength: 1
          type: string
        sensorDefinition:
          $ref: '#/components/schemas/SoilMoistureModelSensorDefinition'
        id:
          description: Unique job id.
          type: string
          readOnly: true
        status:
          description: 'Status of the job.

            Possible values: ''Waiting'', ''Running'', ''Succeeded'', ''Failed'', ''Cancelled''.'
          type: string
          readOnly: true
        durationInSeconds:
          format: double
          description: Duration of the job in seconds.
          type: number
          readOnly: true
        message:
          description: Status message to capture more details of the job.
          type: string
          readOnly: true
        errorCode:
          description: Error Code when job failed.
          type: string
          readOnly: true
        createdDateTime:
          format: date-time
          description: 'Job created at dateTime. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        lastActionDateTime:
          format: date-time
          description: 'Job was last acted upon at dateTime. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        startTime:
          format: date-time
          description: 'Job start time when available. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        endTime:
          format: date-time
          description: 'Job end time when available. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        name:
          description: Name to identify resource.
          maxLength: 100
          minLength: 0
          type: string
        description:
          description: Textual description of the resource.
          maxLength: 500
          minLength: 0
          type: string
        createdBy:
          description: Created by user/tenant id.
          type: string
          readOnly: true
        modifiedBy:
          description: Modified by user/tenant id.
          type: string
          readOnly: true
        properties:
          description: 'A collection of key value pairs that belongs to the resource.

            Each pair must not have a key greater than 50 characters

            and must not have a value greater than 150 characters.

            Note: A maximum of 25 key value pairs can be provided for a resource and only string,

            numeral and datetime (yyyy-MM-ddTHH:mm:ssZ) values are supported.'
          type: object
          additionalProperties: {}
          example:
            key1: value1
            key2: 123.45
    SensorPlacementModelJob:
      description: Schema of sensor placement model job.
      required:
      - boundaryId
