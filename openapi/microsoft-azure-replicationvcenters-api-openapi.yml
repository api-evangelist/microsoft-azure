            application/json:
              schema:
                $ref: '#/components/schemas/VCenter'
        '202':
          description: Accepted
      x-ms-long-running-operation: true
      x-ms-examples:
        Add vCenter.:
          $ref: ./examples/ReplicationvCenters_Create.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddVCenterRequest'
        description: The input to the add vCenter operation.
        required: true
    delete:
      tags:
      - ReplicationvCenters
      summary: Microsoft Azure Remove Vcenter Operation
      description: The operation to remove(unregister) a registered vCenter server from the vault.
      operationId: microsoftAzureReplicationvcentersDelete
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/SubscriptionId'
      - name: fabricName
        in: path
