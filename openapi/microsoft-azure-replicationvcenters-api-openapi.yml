          type: string
      - name: vcenterName
        in: path
        description: vcenter name.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VCenter'
      x-ms-examples:
        Gets the details of a vCenter.:
          $ref: ./examples/ReplicationvCenters_Get.json
    put:
      tags:
      - ReplicationvCenters
      summary: Microsoft Azure Add Vcenter
      description: The operation to create a vCenter object..
      operationId: microsoftAzureReplicationvcentersCreate
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
