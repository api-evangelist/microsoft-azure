openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Tags API
tags:
- name: TagsApi
paths:
  /projects/{projectId}/tags:
    get:
      tags:
      - TagsApi
      summary: Microsoft Azure Get The Tags For A Given Project And Iteration
      operationId: microsoftAzureGettags
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: iterationId
        in: query
        description: The iteration id. Defaults to workspace.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful GetTags request:
          $ref: ./examples/GetTags.json
      description: Needs a more full description created.
    post:
      tags:
      - TagsApi
      summary: Microsoft Azure Create A Tag For The Project
      operationId: microsoftAzureCreatetag
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: name
        in: query
        description: The tag name.
        required: true
        schema:
          type: string
      - name: description
        in: query
        description: Optional description for the tag.
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: Optional type for the tag.
        required: false
        schema:
          type: string
          enum:
          - Regular
          - Negative
          - GeneralProduct
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
            application/xml:
              schema:
                $ref: '#/components/schemas/Tag'
            text/xml:
              schema:
                $ref: '#/components/schemas/Tag'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful CreateTag request:
          $ref: ./examples/CreateTag.json
      description: Needs a more full description created.
  /projects/{projectId}/tags/{tagId}:
    get:
      tags:
      - TagsApi
      summary: Microsoft Azure Get Information About A Specific Tag
      operationId: microsoftAzureGettag
      parameters:
      - name: projectId
        in: path
        description: The project this tag belongs to.
        required: true
        schema:
          type: string
          format: uuid
      - name: tagId
        in: path
        description: The tag id.
        required: true
        schema:
          type: string
          format: uuid
      - name: iterationId
        in: query
        description: The iteration to retrieve this tag from. Optional, defaults to current training set.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
            application/xml:
              schema:
                $ref: '#/components/schemas/Tag'
            text/xml:
              schema:
                $ref: '#/components/schemas/Tag'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful GetTag request:
          $ref: ./examples/GetTag.json
      description: Needs a more full description created.
    delete:
      tags:
      - TagsApi
      summary: Microsoft Azure Delete A Tag From The Project
      operationId: microsoftAzureDeletetag
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: tagId
        in: path
        description: Id of the tag to be deleted.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful DeleteTag request:
          $ref: ./examples/DeleteTag.json
      description: Needs a more full description created.
    patch:
      tags:
      - TagsApi
      summary: Microsoft Azure Update A Tag
      operationId: microsoftAzureUpdatetag
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: tagId
        in: path
        description: The id of the target tag.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
            application/xml:
              schema:
                $ref: '#/components/schemas/Tag'
            text/xml:
              schema:
                $ref: '#/components/schemas/Tag'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful UpdateTag request:
          $ref: ./examples/UpdateTag.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
          application/xml:
            schema:
              $ref: '#/components/schemas/Tag'
          text/xml:
            schema:
              $ref: '#/components/schemas/Tag'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tag'
        description: The updated tag model.
        required: true
components:
  schemas:
    CustomVisionError:
      required:
      - code
      - message
      type: object
