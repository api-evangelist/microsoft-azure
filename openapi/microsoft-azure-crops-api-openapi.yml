openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Crops API
tags:
- name: Crops
paths:
  /crops:
    get:
      tags:
      - Crops
      description: Returns a paginated list of crop resources.
      operationId: microsoftAzureCropsList
      parameters:
      - in: query
        name: phenotypes
        description: Crop phenotypes of the resource.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: breedingMethods
        description: Breeding method of the resource.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: ids
        description: Ids of the resource.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: names
        description: Names of the resource.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: propertyFilters
        description: 'Filters on key-value pairs within the Properties object.

          eg. "{testKey} eq {testValue}".'
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: statuses
        description: Statuses of the resource.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: minCreatedDateTime
        description: Minimum creation date of resource (inclusive).
        schema:
          type: string
          format: date-time
      - in: query
        name: maxCreatedDateTime
        description: Maximum creation date of resource (inclusive).
        schema:
          type: string
          format: date-time
      - in: query
        name: minLastModifiedDateTime
        description: Minimum last modified date of resource (inclusive).
        schema:
          type: string
          format: date-time
      - in: query
        name: maxLastModifiedDateTime
        description: Maximum last modified date of resource (inclusive).
        schema:
          type: string
          format: date-time
      - in: query
        name: maxPageSize
        description: 'Maximum number of items needed (inclusive).

          Minimum = 10, Maximum = 1000, Default value = 50.'
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 1000
          minimum: 10
      - in: query
        name: skipToken
        description: Skip token for getting next set of results.
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropListResponse'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        Crops_List:
          $ref: ./examples/Crops_List.json
      summary: Microsoft Azure Get Crops
  /crops/{cropId}:
    get:
      tags:
      - Crops
      description: Gets a specified crop resource.
      operationId: microsoftAzureCropsGet
      parameters:
      - in: path
        name: cropId
        description: Id of the crop.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crop'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Crops_Get:
          $ref: ./examples/Crops_Get.json
      summary: Microsoft Azure Get Crops Cropid
    patch:
      tags:
      - Crops
      description: Creates or updates a crop resource.
      operationId: microsoftAzureCropsCreateorupdate
      parameters:
      - in: path
        name: cropId
        description: Id of the crop resource.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crop'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crop'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Crops_CreateOrUpdate:
          $ref: ./examples/Crops_CreateOrUpdate.json
      summary: Microsoft Azure Patch Crops Cropid
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Crop'
        description: Crop resource payload to create or update.
        required: true
    delete:
      tags:
      - Crops
      description: Deletes Crop for given crop id.
      operationId: microsoftAzureCropsDelete
      parameters:
      - in: path
        name: cropId
        description: Id of crop to be deleted.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Crops_Delete:
          $ref: ./examples/Crops_Delete.json
      summary: Microsoft Azure Delete Crops Cropid
components:
  schemas:
    ErrorResponse:
      description: An error response from the Azure AgPlatform service. See https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses for ErrorResponse reference document.
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
        traceId:
          description: Unique trace Id.
          type: string
    Error:
      description: An error from the Azure AgPlatform service.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Server-defined set of error codes.
          minLength: 1
          type: string
        message:
          description: Human-readable representation of the error.
          minLength: 1
          type: string
        target:
          description: Target of the error.
          type: string
        details:
          description: Array of details about specific errors that led to this reported error.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        innererror:
          $ref: '#/components/schemas/InnerError'
    Measure:
      description: Schema for storing measurement reading and unit.
      type: object
      properties:
        unit:
          description: Data unit.
          maxLength: 50
          minLength: 1
          type: string
        value:
          format: double
          description: Data value.
          type: number
    Crop:
      description: Schema of crop resource.
      type: object
      properties:
        phenotype:
          description: Crop phenotype.
          maxLength: 100
          minLength: 0
          type: string
        breedingMethod:
          description: Breeding Method.
          enum:
          - VARIETY
          - HYBRID
          - UNKNOWN
          type: string
          x-ms-enum:
            name: BreedingMethod
            modelAsString: true
        measurements:
          description: Measurements.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Measure'
          x-ms-mutability:
          - read
          - create
          - update
        id:
          description: Unique resource ID.
          type: string
          readOnly: true
        eTag:
          description: The ETag value to implement optimistic concurrency.
          type: string
          readOnly: true
        status:
          description: Status of the resource.
          maxLength: 100
          minLength: 0
          type: string
        createdDateTime:
          format: date-time
          description: 'Date-time when resource was created, sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
          example: '2020-12-31T11:10:21Z'
        modifiedDateTime:
          format: date-time
          description: 'Date-time when resource was last modified, sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
          example: '2020-12-31T11:10:21Z'
        source:
          description: Source of the resource.
          maxLength: 100
          minLength: 2
          type: string
        name:
          description: Name to identify resource.
          maxLength: 100
          minLength: 0
          type: string
        description:
          description: Textual description of the resource.
          maxLength: 500
          minLength: 0
          type: string
        createdBy:
          description: Created by user/tenant id.
          type: string
          readOnly: true
        modifiedBy:
          description: Modified by user/tenant id.
          type: string
          readOnly: true
        properties:
          description: 'A collection of key value pairs that belongs to the resource.

            Each pair must not have a key greater than 50 characters

            and must not have a value greater than 150 characters.

            Note: A maximum of 25 key value pairs can be provided for a resource and only string,

            numeral and datetime (yyyy-MM-ddTHH:mm:ssZ) values are supported.'
          type: object
          additionalProperties: {}
          example:
            key1: value1
            key2: 123.45
    CropListResponse:
      description: Paged response contains list of requested objects and a URL link to get the next set of results.
      required:
      - value
      type: object
      properties:
        value:
          description: List of requested objects.
          type: array
          items:
            $ref: '#/components/schemas/Crop'
        skipToken:
          description: Token used in retrieving the next page. If null, there are no additional pages.
          type: string
        nextLink:
          description: Continuation link (absolute URI) to the next page of results in the list.
          type: string
    InnerError:
      description: Inner error containing list of errors.See https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#innererror--object for InnerError reference document.
      type: object
      properties:
        code:
          description: Specific error code than was provided by the containing error.
          type: string
        innererror:
          $ref: '#/components/schemas/InnerError'
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
