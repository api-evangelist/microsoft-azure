openapi: 3.2.0
info:
  title: Microsoft Azure Logs V1 Dot1 Preview2 API
  version: '1.0'
  description: 'Operations tagged LogsV1Dot1Preview2 across 2 of this provider''s published API definitions: personalizer-client-2022-09-01-preview-openapi-original.yml, personalizer-client-v11-preview3-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /personalizer
- url: /personalizer/v1.1-preview.3
tags:
- name: LogsV1Dot1Preview2
  description: Manages reinforcement learning logs.
paths:
  /logs/interactions:
    post:
      tags:
      - LogsV1Dot1Preview2
      summary: Microsoft Azure Post Interactions
      description: The endpoint is intended to be used from within a SDK for logging interactions and accepts specific format defined in https://github.com/VowpalWabbit/reinforcement_learning. This endpoint should not be used by the customer.
      operationId: microsoftAzureLogInteractions
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      responses:
        '204':
          description: No Content
        default:
          description: Invalid request.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Successful Log_Interactions request:
          $ref: ./examples/Log_Interactions.json
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        description: Interactions binary payload.
        required: true
      security:
      - {}
    servers:
    - url: /personalizer
  /logs/observations:
    post:
      tags:
      - LogsV1Dot1Preview2
      summary: Microsoft Azure Post Observations
      description: The endpoint is intended to be used from within a SDK for logging observations and accepts specific format defined in https://github.com/VowpalWabbit/reinforcement_learning. This endpoint should not be used by the customer.
      operationId: microsoftAzureLogObservations
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      responses:
        '204':
          description: No Content
        default:
          description: Invalid request.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Successful Log_Observations request:
          $ref: ./examples/Log_Observations.json
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        description: Observations binary payload.
        required: true
      security:
      - {}
    servers:
    - url: /personalizer
  /logs:
    delete:
      tags:
      - LogsV1Dot1Preview2
      summary: Microsoft Azure Deletes Logs
      description: Delete all logs of Rank and Reward calls stored by Personalizer.
      operationId: microsoftAzureLogDelete
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      responses:
        '204':
          description: No Content
        default:
          description: A generic error has occurred on the server.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Successful Log_Delete request:
          $ref: ./examples/Log_Delete.json
      security:
      - {}
    servers:
    - url: /personalizer
  /logs/properties:
    get:
      tags:
      - LogsV1Dot1Preview2
      summary: Microsoft Azure Get Log Properties
      description: Get properties of the Personalizer logs.
      operationId: microsoftAzureLogGetproperties
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsProperties'
        default:
          description: Log properties not found.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Successful Log_GetProperties request:
          $ref: ./examples/Log_GetProperties.json
      security:
      - {}
    servers:
    - url: /personalizer
