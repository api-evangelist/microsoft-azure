        schema:
          type: string
          enum:
          - Regular
          - Advanced
      - name: reservedBudgetInHours
        in: query
        description: The number of hours reserved as budget for training (if applicable).
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: forceTrain
        in: query
        description: 'Whether to force train even if dataset and configuration does not change (default: false).'
        required: false
        schema:
          type: boolean
          default: false
      - name: notificationEmailAddress
        in: query
        description: 'The email address to send notification to when training finishes (default: null).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Iteration'
            application/xml:
              schema:
                $ref: '#/components/schemas/Iteration'
            text/xml:
              schema:
                $ref: '#/components/schemas/Iteration'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful TrainProject request:
          $ref: ./examples/TrainProject.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingParameters'
          application/xml:
            schema:
              $ref: '#/components/schemas/TrainingParameters'
          text/xml:
            schema:
              $ref: '#/components/schemas/TrainingParameters'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrainingParameters'
        description: Additional training parameters passed in to control how the project is trained.
  /projects/import:
    post:
      tags:
      - ProjectApi
      summary: Microsoft Azure Imports A Project
      operationId: microsoftAzureImportproject
      parameters:
      - name: token
        in: query
        description: Token generated from the export project call.
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: Optional, name of the project to use instead of auto-generated name.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            application/xml:
              schema:
                $ref: '#/components/schemas/Project'
            text/xml:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful ImportProject request:
          $ref: ./examples/ImportProject.json
      description: Needs a more full description created.
components:
  schemas:
    Export:
      type: object
      properties:
        platform:
          description: Platform of the export.
          enum:
          - CoreML
          - TensorFlow
          - DockerFile
          - ONNX
          - VAIDK
          type: string
          readOnly: true
          x-ms-enum:
            name: ExportPlatform
            modelAsString: true
        status:
          description: Status of the export.
          enum:
          - Exporting
          - Failed
          - Done
          type: string
          readOnly: true
          x-ms-enum:
            name: ExportStatus
            modelAsString: true
        downloadUri:
          description: URI used to download the model. If VNET feature is enabled this will be a relative path to be used with GetArtifact, otherwise this will be an absolute URI to the resource.
          type: string
          readOnly: true
        flavor:
          description: 'Flavor of the export. These are specializations of the export platform.

            Docker platform has valid flavors: Linux, Windows, ARM.

            Tensorflow platform has valid flavors: TensorFlowNormal, TensorFlowLite.

            ONNX platform has valid flavors: ONNX10, ONNX12.'
          enum:
          - Linux
          - Windows
          - ONNX10
          - ONNX12
          - ARM
          - TensorFlowNormal
          - TensorFlowLite
          type:
          - string
          - 'null'
          readOnly: true
          x-ms-enum:
            name: ExportFlavor
            modelAsString: true
        newerVersionAvailable:
          description: Indicates an updated version of the export package is available and should be re-exported for the latest changes.
          type: boolean
          readOnly: true
    TagPerformance:
      description: Represents performance data for a particular tag in a trained iteration.
      type: object
      properties:
        id:
          format: uuid
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        precision:
          format: float
          description: Gets the precision.
          type: number
          readOnly: true
        precisionStdDeviation:
          format: float
          description: Gets the standard deviation for the precision.
          type: number
          readOnly: true
        recall:
          format: float
          description: Gets the recall.
          type: number
          readOnly: true
        recallStdDeviation:
          format: float
          description: Gets the standard deviation for the recall.
          type: number
          readOnly: true
        averagePrecision:
          format: float
          description: Gets the average precision when applicable.
          type:
          - number
          - 'null'
          readOnly: true
    ImagePerformance:
      description: Image performance model.
      type: object
      properties:
        predictions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Prediction'
          readOnly: true
        id:
          format: uuid
          type: string
          readOnly: true
        created:
          format: date-time
          type: string
          readOnly: true
        width:
          format: int32
          type: integer
          readOnly: true
        height:
          format: int32
          type: integer
          readOnly: true
        imageUri:
          type: string
          readOnly: true
        thumbnailUri:
          type: string
          readOnly: true
        tags:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImageTag'
          readOnly: true
        regions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImageRegion'
          readOnly: true
    Prediction:
      description: Prediction result.
      type: object
      properties:
        probability:
          format: float
          description: Probability of the tag.
          type: number
          readOnly: true
        tagId:
          format: uuid
          description: Id of the predicted tag.
          type: string
          readOnly: true
        tagName:
          description: Name of the predicted tag.
          type:
          - string
          - 'null'
          readOnly: true
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
          description: Bounding box of the prediction.
          readOnly: true
        tagType:
          description: Type of the predicted tag.
          enum:
          - Regular
          - Negative
          - GeneralProduct
          type:
          - string
          - 'null'
          readOnly: true
          x-ms-enum:
            name: TagType
            modelAsString: true
    TrainingParameters:
      description: Parameters used for training.
      type: object
      properties:
        selectedTags:
          description: List of tags selected for this training session, other tags in the project will be ignored.
          type: array
          items:
            format: uuid
            type: string
          readOnly: false
    Project:
      description: Represents a project.
      required:
      - name
      - description
      - settings
      type: object
      properties:
        id:
          format: uuid
          description: Gets the project id.
          type: string
          readOnly: true
        name:
          description: Gets or sets the name of the project.
          type: string
          readOnly: false
        description:
          description: Gets or sets the description of the project.
          type:
          - string
          - 'null'
          readOnly: false
        settings:
          $ref: '#/components/schemas/ProjectSettings'
          description: Gets or sets the project settings.
          readOnly: false
        created:
          format: date-time
          description: Gets the date this project was created.
          type: string
          readOnly: true
        lastModified:
          format: date-time
          description: Gets the date this project was last modified.
          type: string
          readOnly: true
        thumbnailUri:
          description: Gets the thumbnail url representing the image. If VNET feature is enabled this will be a relative path to be used with GetArtifact, otherwise this will be an absolute URI to the resource.
          type: string
          readOnly: true
        drModeEnabled:
          description: Gets if the Disaster Recovery (DR) mode is on, indicating the project is temporarily read-only.
          type:
          - boolean
          - 'null'
          readOnly: true
        status:
          description: Gets the status of the project.
          enum:
          - Succeeded
          - Importing
          - Failed
          type: string
          readOnly: false
          x-ms-enum:
            name: ProjectStatus
            modelAsString: true
    ImageProcessingSettings:
      description: Represents image preprocessing settings used by image augmentation.
      type: object
      properties:
        augmentationMethods:
          description: 'Gets or sets enabled image transforms. The key corresponds to the transform name. If value is set to true, then correspondent transform is enabled. Otherwise this transform will not be used.

            Augmentation will be uniformly distributed among enabled transforms.'
          type:
          - object
          - 'null'
          additionalProperties:
            type: boolean
          readOnly: false
    ImageRegion:
      required:
      - tagId
      - left
      - top
      - width
      - height
      type: object
      properties:
        regionId:
          format: uuid
          type: string
          readOnly: true
        tagName:
          type: string
          readOnly: true
        created:
          format: date-time
          type: string
          readOnly: true
        tagId:
          format: uuid
          description: Id of the tag associated with this region.
          type: string
          readOnly: false
        left:
          format: float
          description: Coordinate of the left boundary.
          type: number
          readOnly: false
        top:
          format: float
          description: Coordinate of the top boundary.
          type: number
          readOnly: false
        width:
          format: float
          description: Width.
          type: number
          readOnly: false
        height:
          format: float
          description: Height.
          type: number
          readOnly: false
    ProjectExport:
      description: Represents information about a project export.
      type: object
      properties:
        iterationCount:
          format: int32
          description: Count of iterations that will be exported.
          type: integer
          readOnly: true
        imageCount:
          format: int32
          description: Count of images that will be exported.
          type: integer
          readOnly: true
        tagCount:
          format: int32
          description: Count of tags that will be exported.
          type: integer
          readOnly: true
        regionCount:
          format: int32
          description: Count of regions that will be exported.
          type: integer
          readOnly: true
        estimatedImportTimeInMS:
          format: int32
          description: 'Estimated time this project will take to import, can change based on network connectivity and load between

            source and destination regions.'
          type: integer
          readOnly: true
        token:
          description: 'Opaque token that should be passed to ImportProject to perform the import. This token grants access to import this

            project to all that have the token.'
          type: string
          readOnly: true
    BoundingBox:
      description: Bounding box that defines a region of an image.
      required:
      - left
      - top
      - width
      - height
      type: object
      properties:
        left:
          format: float
          description: Coordinate of the left boundary.
          type: number
          readOnly: false
        top:
          format: float
          description: Coordinate of the top boundary.
          type: number
          readOnly: false
        width:
          format: float
          description: Width.
          type: number
          readOnly: false
        height:
          format: float
          description: Height.
          type: number
          readOnly: false
    CustomVisionError:
      required:
      - code
      - message
      type: object
      properties:
        code:
