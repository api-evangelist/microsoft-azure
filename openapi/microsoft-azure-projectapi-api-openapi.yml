          - BadRequestInvalidImportToken
          - BadRequestExportWhileTraining
          - BadRequestImageMetadataKey
          - BadRequestImageMetadataValue
          - BadRequestOperationNotSupported
          - BadRequestInvalidArtifactUri
          - BadRequestCustomerManagedKeyRevoked
          - BadRequestInvalid
          - UnsupportedMediaType
          - Forbidden
          - ForbiddenUser
          - ForbiddenUserResource
          - ForbiddenUserSignupDisabled
          - ForbiddenUserSignupAllowanceExceeded
          - ForbiddenUserDoesNotExist
          - ForbiddenUserDisabled
          - ForbiddenUserInsufficientCapability
          - ForbiddenDRModeEnabled
          - ForbiddenInvalid
          - NotFound
          - NotFoundProject
          - NotFoundProjectDefaultIteration
          - NotFoundIteration
          - NotFoundIterationPerformance
          - NotFoundTag
          - NotFoundImage
          - NotFoundDomain
          - NotFoundApimSubscription
          - NotFoundInvalid
          - Conflict
          - ConflictInvalid
          - ErrorUnknown
          - ErrorIterationCopyFailed
          - ErrorPreparePerformanceMigrationFailed
          - ErrorProjectInvalidWorkspace
          - ErrorProjectInvalidPipelineConfiguration
          - ErrorProjectInvalidDomain
          - ErrorProjectTrainingRequestFailed
          - ErrorProjectImportRequestFailed
          - ErrorProjectExportRequestFailed
          - ErrorFeaturizationServiceUnavailable
          - ErrorFeaturizationQueueTimeout
          - ErrorFeaturizationInvalidFeaturizer
          - ErrorFeaturizationAugmentationUnavailable
          - ErrorFeaturizationUnrecognizedJob
          - ErrorFeaturizationAugmentationError
          - ErrorExporterInvalidPlatform
          - ErrorExporterInvalidFeaturizer
          - ErrorExporterInvalidClassifier
          - ErrorPredictionServiceUnavailable
          - ErrorPredictionModelNotFound
          - ErrorPredictionModelNotCached
          - ErrorPrediction
          - ErrorPredictionStorage
          - ErrorRegionProposal
          - ErrorUnknownBaseModel
          - ErrorInvalid
          type: string
          x-ms-enum:
            name: CustomVisionErrorCodes
            modelAsString: true
        message:
          description: A message explaining the error reported by the service.
          type: string
    ImageTag:
      type: object
      properties:
        tagId:
          format: uuid
          type: string
          readOnly: true
        tagName:
          type: string
          readOnly: true
        created:
          format: date-time
          type: string
          readOnly: true
    IterationPerformance:
      description: Represents the detailed performance data for a trained iteration.
      type: object
      properties:
        perTagPerformance:
          description: Gets the per-tag performance details for this iteration.
          type: array
          items:
            $ref: '#/components/schemas/TagPerformance'
          readOnly: true
        precision:
          format: float
          description: Gets the precision.
          type: number
          readOnly: true
        precisionStdDeviation:
          format: float
          description: Gets the standard deviation for the precision.
          type: number
          readOnly: true
        recall:
          format: float
          description: Gets the recall.
          type: number
          readOnly: true
        recallStdDeviation:
          format: float
          description: Gets the standard deviation for the recall.
          type: number
          readOnly: true
        averagePrecision:
          format: float
          description: Gets the average precision when applicable.
          type:
          - number
          - 'null'
          readOnly: true
    Iteration:
      description: Iteration model to be sent over JSON.
      required:
      - name
      type: object
      properties:
        id:
          format: uuid
          description: Gets the id of the iteration.
          type: string
          readOnly: true
        name:
          description: Gets or sets the name of the iteration.
          type: string
          readOnly: false
        status:
          description: Gets the current iteration status.
          type: string
          readOnly: true
        created:
          format: date-time
          description: Gets the time this iteration was completed.
          type: string
          readOnly: true
        lastModified:
          format: date-time
          description: Gets the time this iteration was last modified.
          type: string
          readOnly: true
        trainedAt:
          format: date-time
          description: Gets the time this iteration was last modified.
          type:
          - string
          - 'null'
          readOnly: true
        projectId:
          format: uuid
          description: Gets the project id of the iteration.
          type: string
          readOnly: true
        exportable:
          description: Whether the iteration can be exported to another format for download.
          type: boolean
          readOnly: true
        exportableTo:
          description: A set of platforms this iteration can export to.
          type: array
          items:
            enum:
            - CoreML
            - TensorFlow
            - DockerFile
            - ONNX
            - VAIDK
            type: string
          readOnly: true
        domainId:
          format: uuid
          description: Get or sets a guid of the domain the iteration has been trained on.
          type:
          - string
          - 'null'
          readOnly: true
        classificationType:
          description: Gets the classification type of the project.
          enum:
          - Multiclass
          - Multilabel
          type:
          - string
          - 'null'
          readOnly: true
          x-ms-enum:
            name: Classifier
            modelAsString: true
        trainingType:
          description: Gets the training type of the iteration.
          enum:
          - Regular
          - Advanced
          type: string
          readOnly: true
          x-ms-enum:
            name: TrainingType
            modelAsString: true
        reservedBudgetInHours:
          format: int32
          description: Gets the reserved advanced training budget for the iteration.
          type: integer
          readOnly: true
        trainingTimeInMinutes:
          format: int32
          description: Gets the training time for the iteration.
          type: integer
          readOnly: true
        publishName:
          description: Name of the published model.
          type: string
          readOnly: true
        originalPublishResourceId:
          description: Resource Provider Id this iteration was originally published to.
          type: string
          readOnly: true
    ProjectSettings:
      description: Represents settings associated with a project.
      type: object
      properties:
        domainId:
          format: uuid
          description: Gets or sets the id of the Domain to use with this project.
          type: string
          readOnly: false
        classificationType:
          description: Gets or sets the classification type of the project.
          enum:
          - Multiclass
          - Multilabel
          type:
          - string
          - 'null'
          readOnly: false
          x-ms-enum:
            name: Classifier
            modelAsString: true
        targetExportPlatforms:
          description: A list of ExportPlatform that the trained model should be able to support.
          type: array
          items:
            enum:
            - CoreML
            - TensorFlow
            - DockerFile
            - ONNX
            - VAIDK
            type: string
          readOnly: false
        useNegativeSet:
          description: Indicates if negative set is being used.
          type:
          - boolean
          - 'null'
          readOnly: true
        detectionParameters:
          description: Detection parameters in use, if any.
          type: string
          readOnly: true
        imageProcessingSettings:
          $ref: '#/components/schemas/ImageProcessingSettings'
          description: Gets or sets image preprocessing settings.
          readOnly: false
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
