          type: string
          format: uuid
      - name: iterationId
        in: path
        description: The iteration id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Export'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Export'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Export'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful GetExports request:
          $ref: ./examples/GetExports.json
      description: Needs a more full description created.
    post:
      tags:
      - ProjectApi
      summary: Microsoft Azure Export A Trained Iteration
      operationId: microsoftAzureExportiteration
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: iterationId
        in: path
        description: The iteration id.
        required: true
        schema:
          type: string
          format: uuid
      - name: platform
        in: query
        description: The target platform.
        required: true
        schema:
          type: string
          enum:
          - CoreML
          - TensorFlow
          - DockerFile
          - ONNX
          - VAIDK
      - name: flavor
        in: query
        description: The flavor of the target platform.
        required: false
        schema:
          type: string
          enum:
          - Linux
          - Windows
          - ONNX10
          - ONNX12
          - ARM
          - TensorFlowNormal
          - TensorFlowLite
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
