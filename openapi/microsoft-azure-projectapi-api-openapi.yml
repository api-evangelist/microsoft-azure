        required: true
        schema:
          type: string
          format: uuid
      - name: threshold
        in: query
        description: The threshold used to determine true predictions.
        required: false
        schema:
          type: number
          format: float
      - name: overlapThreshold
        in: query
        description: If applicable, the bounding box overlap threshold used to determine true predictions.
        required: false
        schema:
          type: number
          format: float
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IterationPerformance'
            application/xml:
              schema:
