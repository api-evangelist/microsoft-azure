openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Project API
tags:
- name: ProjectApi
paths:
  /projects:
    get:
      tags:
      - ProjectApi
      summary: Microsoft Azure Get Your Projects
      operationId: microsoftAzureGetprojects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful GetProjects request:
          $ref: ./examples/GetProjects.json
      description: Needs a more full description created.
    post:
      tags:
      - ProjectApi
      summary: Microsoft Azure Create A Project
      operationId: microsoftAzureCreateproject
      parameters:
      - name: name
        in: query
        description: Name of the project.
        required: true
        schema:
          type: string
      - name: description
        in: query
        description: The description of the project.
        required: false
        schema:
          type: string
      - name: domainId
        in: query
        description: The id of the domain to use for this project. Defaults to General.
        required: false
        schema:
          type: string
          format: uuid
      - name: classificationType
        in: query
        description: The type of classifier to create for this project.
        required: false
        schema:
          type: string
          enum:
          - Multiclass
          - Multilabel
      - name: targetExportPlatforms
        in: query
        description: List of platforms the trained model is intending exporting to.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - CoreML
            - TensorFlow
            - DockerFile
            - ONNX
            - VAIDK
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            application/xml:
              schema:
                $ref: '#/components/schemas/Project'
            text/xml:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful CreateProject request:
          $ref: ./examples/CreateProject.json
      description: Needs a more full description created.
  /projects/{projectId}:
    get:
      tags:
      - ProjectApi
      summary: Microsoft Azure Get A Specific Project
      operationId: microsoftAzureGetproject
      parameters:
      - name: projectId
        in: path
        description: The id of the project to get.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            application/xml:
              schema:
                $ref: '#/components/schemas/Project'
            text/xml:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful GetProject request:
          $ref: ./examples/GetProject.json
      description: Needs a more full description created.
    delete:
      tags:
      - ProjectApi
      summary: Microsoft Azure Delete A Specific Project
      operationId: microsoftAzureDeleteproject
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful DeleteProject request:
          $ref: ./examples/DeleteProject.json
      description: Needs a more full description created.
    patch:
      tags:
      - ProjectApi
      summary: Microsoft Azure Update A Specific Project
      operationId: microsoftAzureUpdateproject
      parameters:
      - name: projectId
        in: path
        description: The id of the project to update.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            application/xml:
              schema:
                $ref: '#/components/schemas/Project'
            text/xml:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful UpdateProject request:
          $ref: ./examples/UpdateProject.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/xml:
            schema:
              $ref: '#/components/schemas/Project'
          text/xml:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
        description: The updated project model.
        required: true
  /projects/{projectId}/artifacts:
    get:
      tags:
      - ProjectApi
      summary: Microsoft Azure Get Artifact Content From Blob Storage, Based On Artifact Relative Path In The Blob
      operationId: microsoftAzureGetartifact
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: path
        in: query
        description: The relative path for artifact.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: Error response
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful GetArtifact request:
