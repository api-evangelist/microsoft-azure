              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Get information about an account:
          $ref: ./examples/GetAccount.json
      tags:
      - Account
      description: Gets the details of the specified account. An account represents a customer.
      summary: Microsoft Azure Get Accounts Accountname
    put:
      operationId: microsoftAzureAccountCreateorreplace
      parameters:
      - in: path
        name: accountName
        required: true
        description: Name of the account. Can only contain letters, numbers, underscores and dashes, and is case-sensitive. Can be up to 100 characters in length.
        schema:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^([A-Za-z0-9_-]+)$
      - $ref: '#/components/parameters/ApiVersionParameter'
      - in: header
        name: If-Match
        description: Makes a request conditional on a matching etag.
        schema:
          type: string
      - in: header
        name: If-None-Match
        description: Makes a request conditional on a non-matching etag.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        default:
          description: An error response object.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Put new information about an account:
          $ref: ./examples/PutAccount.json
      tags:
      - Account
      description: Creates or replaces the specified account, representing a customer. In the body of the request, include additional service-specific configuration. For example, for Microsoft Teams Direct Routing, specify the customer-specific subdomain label and DNS TXT values from the customer's Microsoft 365 configuration.
      summary: Microsoft Azure Put Accounts Accountname
      requestBody:
