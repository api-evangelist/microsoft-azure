components:
  schemas:
    PrivateEndpoint:
      description: A private endpoint class.
      type: object
      properties:
        id:
          description: The private endpoint identifier.
          type: string
    PrivateEndpointConnectionProperties:
      description: A private endpoint connection properties class.
      type: object
      properties:
        privateEndpoint:
          $ref: '#/components/schemas/PrivateEndpoint'
        privateLinkServiceConnectionState:
          $ref: '#/components/schemas/PrivateLinkServiceConnectionState'
        provisioningState:
          description: The provisioning state.
          type: string
          readOnly: true
    DataShareErrorInfo:
      description: The data share error body model.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Code of the error
          type: string
        details:
          description: Nested details of the error model
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/DataShareErrorInfo'
        message:
          description: Message of the error
          type: string
        target:
          description: Target of the error
          type: string
    TeamsDrConfig:
      additionalProperties: false
      properties:
        callScreening:
          type: boolean
          description: Enables/disables caller ID screening for the account. Caller ID screening is enabled by default.
        subdomain:
          pattern: ^([A-Za-z0-9_-]+)$
          minLength: 1
          maxLength: 10
          type: string
          description: Customer-specific domain name label. Can only contain letters, numbers, underscores and dashes. Can be up to 10 characters in length.
        subdomainTokens:
          $ref: '#/components/schemas/TeamsDrSubdomainTokens'
      required:
      - callScreening
      - subdomain
      - subdomainTokens
      type: object
      description: Account configuration relating to Microsoft Teams Direct Routing.
    UserAssignedIdentity:
      description: Uses client ID and Principal ID
      type: object
      properties:
        clientId:
          description: Gets or Sets Client ID
          type: string
          readOnly: true
        principalId:
          description: Gets or Sets Principal ID
          type: string
          readOnly: true
    AccountList_2:
      description: Paged list of account resources
      required:
      - value
      type: object
      properties:
        count:
          format: int64
          description: Total item count.
          type: integer
        nextLink:
          description: The Url of next result page.
          type: string
        value:
          description: Collection of items of type results.
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/Account_3'
    SystemData_2:
      description: Metadata pertaining to creation and last modification of the resource.
      type: object
      properties:
        createdAt:
          format: date-time
          description: The timestamp of resource creation (UTC).
          type: string
          readOnly: true
        createdBy:
          description: The identity that created the resource.
          type: string
          readOnly: true
        createdByType:
          description: The type of identity that created the resource.
          enum:
          - User
          - Application
          - ManagedIdentity
          - Key
          type: string
          readOnly: true
          x-ms-enum:
            name: createdByType
            modelAsString: true
        lastModifiedAt:
          format: date-time
          description: The timestamp of the last modification the resource (UTC).
          type: string
          readOnly: true
        lastModifiedBy:
          description: The identity that last modified the resource.
          type: string
          readOnly: true
        lastModifiedByType:
          description: The type of identity that last modified the resource.
          enum:
          - User
          - Application
          - ManagedIdentity
          - Key
          type: string
          readOnly: true
          x-ms-enum:
            name: lastModifiedByType
            modelAsString: true
    CloudConnectors_2:
      type: object
