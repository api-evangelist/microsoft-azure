openapi: 3.2.0
info:
  title: Microsoft Azure Text Independent API
  version: '1.0'
  description: 'Operations tagged Text-Independent across 2 of this provider''s published API definitions: speaker-identification-api-openapi-original.yml, speaker-verification-api-openapi-original.yml. Each path carries the servers of the definition it was published in.'
security:
- apiKeyHeader: []
tags:
- name: Text-Independent
paths:
  /text-independent/profiles:
    post:
      description: Creates a new speaker profile with specified locale.
      operationId: microsoftAzureTextindependentCreateprofile
      summary: Microsoft Azure Create Profile
      x-ms-examples:
        Successful Query:
          $ref: ./examples/createProfile.json
      tags:
      - Text-Independent
      parameters:
      - $ref: '#/components/parameters/apiVersionParam'
      responses:
        '201':
          description: Speaker profile created successfully. GUID is returned to reference the created profile.
          headers:
            location:
              description: url location of new resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TiProfileInfo'
        default:
          $ref: '#/components/responses/SpeakerErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocaleInfo'
        description: 'Provide following detail info when creating a new profile.

          Fields  | Description

          ------- | ------------

          locale  | Locale for the language of this speaker profile. A complete supported locale list is here: <ul><li>**en-US (American English)**</li><li>**es-ES (Castilian Spanish)**</li><li>**fr-FR (Standard French)**</li><li>**zh-CN (Mandarin Chinese)**</li></ul>'
    get:
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
      description: 'Retrieves a set of profiles.

        Profiles are sorted alphabetically by ProfileId'
      operationId: microsoftAzureTextindependentListprofiles
      summary: Microsoft Azure List Profile
      x-ms-examples:
        Successful Query:
          $ref: ./examples/listProfiles.json
      tags:
      - Text-Independent
      parameters:
      - $ref: '#/components/parameters/apiVersionParam'
      - in: query
        name: maxpagesize
        description: The number of profiles to return. Default is 100 and the maximum is 500
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TiProfileInfoList'
        default:
          $ref: '#/components/responses/SpeakerErrorResponse'
  /text-independent/profiles/{profileId}:
    get:
      description: Retrieves a single profile by ID.
      operationId: microsoftAzureTextindependentGetprofile
      summary: Microsoft Azure Retrieve Single Profile
      x-ms-examples:
        Successful Query:
          $ref: ./examples/fetchProfile.json
      tags:
      - Text-Independent
      parameters:
      - $ref: '#/components/parameters/apiVersionParam'
      - $ref: '#/components/parameters/profileIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TiProfileInfo'
        default:
          $ref: '#/components/responses/SpeakerErrorResponse'
    delete:
      description: Deletes an existing profile.
      operationId: microsoftAzureTextindependentDeleteprofile
      summary: Microsoft Azure Delete Profile
      x-ms-examples:
        Successful Query:
          $ref: ./examples/deleteProfile.json
      tags:
      - Text-Independent
      parameters:
      - $ref: '#/components/parameters/apiVersionParam'
      - $ref: '#/components/parameters/profileIdParam'
      responses:
        '204':
          description: OK
        default:
          $ref: '#/components/responses/SpeakerErrorResponse'
    parameters:
    - $ref: '#/components/parameters/profileIdParam_2'
  /text-independent/profiles/{profileId}:reset:
    post:
      description: 'Resets existing profile to its original creation state. The reset operation does the following:

        * Updates enrollmentStatus to Enrolling.

        * Updates lastUpdatedDateTime.

        * Updates enrollmentsCount to 0.

        * Updates enrollmentsLength to 0.

        * Updates enrollmentsSpeechLength to 0.

        * Updates remainingEnrollmentsSpeechLength to the required number.

        * Removes all associated enrollments from storage.

        * Removes chosen passphrase association.

        * Resets value of modelVersion.'
      operationId: microsoftAzureTextindependentResetprofile
      summary: Microsoft Azure Reset Profile
      x-ms-examples:
        Successful Query:
          $ref: ./examples/resetProfile.json
      tags:
      - Text-Independent
      parameters:
      - $ref: '#/components/parameters/apiVersionParam'
      - $ref: '#/components/parameters/profileIdParam'
      responses:
        '200':
          description: Speaker profile reset successfully. Profile is returned with reset values.
          headers:
            location:
              description: url location of the resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TiProfileInfo'
        default:
          $ref: '#/components/responses/SpeakerErrorResponse'
  /text-independent/profiles/{profileId}/enrollments:
    post:
      description: 'Adds an enrollment to existing profile.

        The first enrollment must be a predefined activation phrase which can be listed using the /phrases/{locale} api.

        If the minimum number of requested enrollment audios is reached, a voice print is created.

        Any further enrollment will be used to improve the voice print.


        Limitations:

        * Minimum audio input length per request is **1 second**

        * Maximum audio input length per request is **120 seconds**

        * Minimum total effective speech length (excluding silence and other non-speech frames) for creating a voiceprint is **20 seconds**

        This limitation can be disabled by setting ignoreMinLength to **true**.


        * Maximum total audio input length allowed for creating a voiceprint is **300 seconds**

        * Minimum audio Signal-to-noise ratio (SNR) is **2dB**'
      operationId: microsoftAzureTextindependentCreateenrollment
      summary: Microsoft Azure Enroll Profile
      x-ms-examples:
        Successful Query:
          $ref: ./examples/createEnrollment.json
      tags:
      - Text-Independent
      parameters:
      - $ref: '#/components/parameters/apiVersionParam'
      - $ref: '#/components/parameters/profileIdParam'
      - in: query
        name: ignoreMinLength
        description: If true, a voice print will be created immediately for this profile regardless of how much speech is supplied or stored. Default is false.
        schema:
          type: boolean
          default: false
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TiEnrollmentInfo'
        default:
          $ref: '#/components/responses/SpeakerErrorResponse'
      requestBody:
        content:
          audio/wav; codecs=audio/pcm:
            schema:
              type: object
              format: file
        description: Binary audio file. Supported formats are audio/wav; codecs=audio/pcm. Supports audio up to 5MB.
        required: true
    parameters:
    - $ref: '#/components/parameters/profileIdParam_2'
  /text-independent/profiles:identifySingleSpeaker:
    post:
      description: 'Identifies who is speaking in input audio among a list of candidate profiles.


        Limitations:

        * Minimum audio input length is **1 second**

        * Maximum audio input length is **120 seconds**

        * Minimum candidate speakers count is **1**

        * Maximum candidate speakers count is **50**

        * Minimum effective speech length (excluding silence and other non-speech frames) is **4 seconds**

        This limitation can be disabled by setting "ignoreMinLength" to **true**.


        * Minimum audio Signal-to-noise ratio (SNR) is **2dB**'
      operationId: microsoftAzureTextindependentIdentifysinglespeaker
      summary: Microsoft Azure Identify Single Speaker Profile
      x-ms-examples:
        Successful Query:
          $ref: ./examples/identifySingleSpeaker.json
      tags:
      - Text-Independent
      parameters:
      - $ref: '#/components/parameters/apiVersionParam'
      - in: query
        name: profileIds
        required: true
        description: Comma-delimited profile IDs. Maximum supported number is 50 IDs.
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
          minItems: 1
      - in: query
        name: ignoreMinLength
        description: If true, the minimum amount of speech needed for identification is skipped. Default is false.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifiedSingleSpeakerInfo'
        default:
          $ref: '#/components/responses/SpeakerErrorResponse'
      requestBody:
        content:
          audio/wav; codecs=audio/pcm:
            schema:
              type: object
              format: file
        description: Binary audio file. Supported formats are audio/wav; codecs=audio/pcm. Supports audio up to 5MB.
        required: true
  /text-independent/phrases/{locale}:
    get:
      description: Retrieves list of supported passphrases for a specific locale.
      operationId: microsoftAzureTextindependentListactivationphrases
      summary: Microsoft Azure Activation Phrases
      x-ms-examples:
        Successful Query:
          $ref: ./examples/listActivationPhrases.json
      tags:
      - Text-Independent
      parameters:
      - $ref: '#/components/parameters/apiVersionParam'
      - $ref: '#/components/parameters/localeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationPhraseInfo'
        default:
          $ref: '#/components/responses/SpeakerErrorResponse'
  /text-independent/profiles/{profileId}/reset:
    parameters:
    - $ref: '#/components/parameters/profileIdParam_2'
    post:
      description: 'Resets existing profile to its original creation state. The reset operation does the following:

        * Updates enrollmentStatus to Enrolling.

        * Updates lastUpdatedDateTime.

        * Updates enrollmentsCount to 0.

        * Updates enrollmentsLength to 0.

        * Updates enrollmentsSpeechLength to 0.

        * Updates remainingEnrollmentsSpeechLength to the required number.

        * Removes all associated enrollments from storage.

        * Removes chosen passphrase association.

        * Resets value of modelVersion.'
      operationId: microsoftAzureTextindependentResetprofile
      summary: Microsoft Azure Reset Profile
      x-ms-examples:
        Successful Query:
          $ref: ./examples/resetProfile.json
      tags:
      - Text-Independent
      responses:
        '204':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/ServerError'
  /text-independent/profiles/{profileId}/verify:
    parameters:
    - $ref: '#/components/parameters/profileIdParam_2'
    post:
      description: 'Verifies existing profiles against input audio.


        Limitations:

        * Minimum audio input length is **1 second**

        * Maximum audio input length is **120 seconds**

        * Minimum effective speech length (excluding silence and other "non-speech" frames) is **4 seconds**

        This limitation can be disabled by setting "ignoreMinLength" to **true**.

        * Minimum audio Signal-to-noise ratio (SNR) is **0dB**'
      operationId: microsoftAzureTextindependentVerifyprofile
      summary: Microsoft Azure Verify Profile
      x-ms-examples:
        Successful Query:
          $ref: ./examples/verify.json
      tags:
      - Text-Independent
      parameters:
      - in: query
        name: ignoreMinLength
        description: If true, a voice print will be created immediately for this profile regardless of how much speech is supplied or stored. Default is false.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionInfo'
        '400':
          description: 'Bad Request

            * InvalidRequest - Invalid audio length. Maximum allowed length per recognition request is 120 seconds.

            * InvalidRequest - Invalid audio length. Minimum allowed length per recognition request is 1 second.

            * InvalidRequest - Invalid audio format. Supported format is 16Khz 16bit Mono PCM.

            * InvalidArgument - Invalid ignoreMinLength parameter value. Valid values are "true" and "false".

            * InvalidRequest - Profile is not enrolled.'
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: InvalidRequest
                  message: Profile is not enrolled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          description: UnsupportedMediaType - Unsupported media type. Only "audio/wav; codecs=audio/pcm" is accepted.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UnsupportedMediaType
                  message: Unsupported media type. Only 'audio/wav; codecs=audio/pcm' is accepted.
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        content:
          audio/wav; codecs=audio/pcm:
            schema:
              type: object
              format: file
        description: Binary audio file. Supported formats are audio/wav; codecs=audio/pcm. Supports audio up to 5MB.
        required: true
components:
  schemas:
    TiProfileInfo:
      description: Text-Independent Speaker profile info
      type: object
      properties:
        profileId:
          $ref: '#/components/schemas/ProfileId'
        locale:
          $ref: '#/components/schemas/Locale'
        profileStatus:
          $ref: '#/components/schemas/ProfileStatus'
        enrollmentStatus:
          $ref: '#/components/schemas/EnrollmentStatus'
        createdDateTime:
          $ref: '#/components/schemas/CreatedDateTime'
        lastUpdatedDateTime:
          $ref: '#/components/schemas/LastUpdatedDateTime'
        enrollmentsCount:
          $ref: '#/components/schemas/EnrollmentsCount'
        enrollmentsLengthInSec:
          $ref: '#/components/schemas/EnrollmentsLengthInSec'
        enrollmentsSpeechLengthInSec:
          $ref: '#/components/schemas/EnrollmentsSpeechLengthInSec'
        remainingEnrollmentsSpeechLengthInSec:
          $ref: '#/components/schemas/RemainingEnrollmentsSpeechLengthInSec'
        modelVersion:
          $ref: '#/components/schemas/ModelVersion'
    EnrollmentStatus:
      type: string
      description: 'Status representing the current state of the profile enrollment. Available values are:

        * Enrolling: profile has no voice print and not ready for recognition requests.

        * Training: voice print of profile is being created and can’t be used for recognition at the moment.

        * Enrolled: profile has a voice print and ready for recognition requests.'
      enum:
      - Enrolling
      - Training
      - Enrolled
      x-ms-enum:
        name: TrainingStatusType
        modelAsString: false
      example: Enrolling
    TiProfileInfoList:
      description: Text-Independent Speaker profile info list
      type: object
      required:
      - value
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/TiProfileInfo'
        nextLink:
          type: string
          example: '{opaqueUrl}'
    ModelVersion:
      type: string
      format: date
      description: Date specifying the model assigned to this profile. Format is yyyy-mm-dd. If profile has no enrollments, this value will be empty.
      example: '2019-12-05'
    ProfileId:
      type: string
      description: Unique identifier for profile id (guid).
      format: uuid
      example: 49a36324-fc4b-4387-aa06-090cfbf0064f
    IdentifiedSingleSpeakerInfo:
      type: object
      properties:
        identifiedProfile:
          description: Object containing data of identified profile.
          $ref: '#/components/schemas/IdentifyInfo'
        profilesRanking:
          description: Object containing data of the top 5 profiles (including identified profile) sorted in descending order by score.
          type: array
          items:
            $ref: '#/components/schemas/IdentifyInfo'
          example:
          - profileId: 111f427c-3791-468f-b709-fcef7660fff9
            score: 0.63
          - profileId: 3669fa29-1bf3-45ad-beea-6b348d058d7e
            score: 0.49
          - profileId: 0e196cd9-32d5-4883-8631-54a0e7c7cb3d
            score: 0.4
          - profileId: 726e57d9-04e0-4214-b482-7f786fa83560
            score: 0.1
          - profileId: f95189fd-1bf5-4485-9c2e-e5897e0c98ca
            score: 0.03
    IdentifyInfo:
      description: Identified speaker info
      type: object
      properties:
        profileId:
          type: string
          description: ID of identified of profile. If no candidate is identified as the right speaker, the value is set to empty GUID.
          example: 111f427c-3791-468f-b709-fcef7660fff9
          format: uuid
        score:
          type: number
          description: A float number indicating the similarity between input audio and targeted voice print. This number must be between 0 and 1. A higher number means higher similarity.
          example: 0.63
    LocaleInfo:
      description: Speaker profile locale
      type: object
      required:
      - locale
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
    EnrollmentsCount:
      type: integer
      description: Number of enrollment audios accepted for this profile.
      example: 1
    CreatedDateTime:
      type: string
      format: date-time
      description: Profile creation datetime.
      example: '2015-04-23T18:25:43.41Z'
    ProfileStatus:
      type: string
      description: 'Status representing the current state of the profile activation. Available values are:

        * Active: profile is active and can be used if the enrollment status is ''Enrolled''.

        * Inactive: profile has not been activated and an activation phrase must be submitted.'
      enum:
      - Active
      - Inactive
      x-ms-enum:
        name: ProfileStatusType
        modelAsString: false
      example: Inactive
    EnrollmentsSpeechLengthInSec:
      type: number
      description: Summation of pure speech (which is the amount of audio after removing silence and non-speech segments) across all profile enrollments in seconds.
      example: 1.35
    ActivationPhrase:
      type: string
      description: Activation phrases available to activate a profile.
      example: this is my activation phrase to identify me
    Locale:
      type: string
      pattern: ^[a-zA-Z]{2}-?[a-zA-Z]{2}$
      description: Language identifier consisting of a combination of language code and country code.
      example: en-US
    SpeakerErrorInfo:
      description: Speaker error message
      type: object
      required:
      - error
      properties:
        error:
          required:
          - code
          - message
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    TiEnrollmentInfo:
      description: Speaker profile enrollment info
      type: object
      properties:
        profileId:
          $ref: '#/components/schemas/ProfileId'
        enrollmentStatus:
          $ref: '#/components/schemas/EnrollmentStatus'
        enrollmentsCount:
          $ref: '#/components/schemas/EnrollmentsCount'
        enrollmentsLengthInSec:
          $ref: '#/components/schemas/EnrollmentsLengthInSec'
        enrollmentsSpeechLengthInSec:
          $ref: '#/components/schemas/EnrollmentsSpeechLengthInSec'
        remainingEnrollmentsSpeechLengthInSec:
          $ref: '#/components/schemas/RemainingEnrollmentsSpeechLengthInSec'
        audioLengthInSec:
          type: number
          description: This enrollment audio length in seconds.
          example: 1.83
        audioSpeechLengthInSec:
          type: number
          description: This enrollment audio pure speech (which is the amount of audio after removing silence and non-speech segments) length in seconds.
          example: 1.35
    LastUpdatedDateTime:
      type: string
      format: date-time
      description: Last datetime when the profile was updated.
      example: '2015-04-23T19:34:51.52Z'
    EnrollmentsLengthInSec:
      type: number
      description: Total length of enrollment audios accepted for this profile in seconds.
      example: 1.83
    ActivationPhraseInfo:
      description: Activation phrase list
      type: object
      required:
      - value
      properties:
        value:
          type: array
          items:
            type: object
            properties:
              activationPhrase:
                $ref: '#/components/schemas/ActivationPhrase'
    RemainingEnrollmentsSpeechLengthInSec:
      type: number
      description: Amount of pure speech (which is the amount of audio after removing silence and non-speech segments) needed to complete profile enrollment in seconds.
      example: 18.65
    TiProfileInfo_2:
      description: Text-Independent Speaker profile info
      properties:
        profileId:
          $ref: '#/components/schemas/ProfileId_2'
        locale:
          $ref: '#/components/schemas/Locale'
        enrollmentStatus:
          $ref: '#/components/schemas/EnrollmentStatus_2'
        createdDateTime:
          $ref: '#/components/schemas/CreatedDateTime_2'
        lastUpdatedDateTime:
          $ref: '#/components/schemas/LastUpdatedDateTime_2'
        enrollmentsCount:
          $ref: '#/components/schemas/EnrollmentsCount_2'
        enrollmentsLength:
          $ref: '#/components/schemas/EnrollmentsLength'
        enrollmentsSpeechLength:
          $ref: '#/components/schemas/EnrollmentsSpeechLength'
        remainingEnrollmentsSpeechLength:
          $ref: '#/components/schemas/RemainingEnrollmentsSpeechLength'
        modelVersion:
          $ref: '#/components/schemas/ModelVersion_2'
    EnrollmentStatus_2:
      type: string
      description: 'Status representing the current state of the profile. Available values are:

        * Enrolling: profile has no voice print and not ready for recognition requests.

        * Training: voice print of profile is being created and can’t be used for recognition at the moment.

        * Enrolled: profile has a voice print and ready for recognition requests.'
      enum:
      - Enrolling
      - Training
      - Enrolled
      x-ms-enum:
        name: TrainingStatusType
        modelAsString: false
      example: Enrolling
    TiProfileInfoList_2:
      description: Text-Independent Speaker profile info list
      properties:
        profiles:
          items:
            $ref: '#/components/schemas/TiProfileInfo_2'
        '@nextLink':
          type: string
          example: https://{Endpoint}/text-independent/profiles?$top=35&$continuationToken=U21pdGg1QmVuOTk5
    ModelVersion_2:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
      description: Date specifying the model assigned to this profile. Format is yyyy-mm-dd. If profile has no enrollments, this value will be empty.
      example: '2019-12-05'
    ProfileId_2:
      type: string
      pattern: ^([0-9a-fA-F]){8}-?([0-9a-fA-F]){4}-?([0-9a-fA-F]){4}-?([0-9a-fA-F]){4}-?([0-9a-fA-F]){12}$
      description: Unique identifier for profile id (guid).
      format: uuid
      example: 49a36324-fc4b-4387-aa06-090cfbf0064f
    EnrollmentsCount_2:
      type: integer
      description: Number of enrolment audios accepted for this profile.
      example: 1
    LocaleInfo_2:
      description: Speaker profile locale
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
    CreatedDateTime_2:
      type: string
      description: Profile creation datetime.
      example: '2015-04-23T18:25:43.41Z'
    EnrollmentsLength:
      type: number
      description: Total length of enrollment audios accepted for this profile in seconds.
      example: 1.83
    RemainingEnrollmentsSpeechLength:
      type: number
      description: Amount of pure speech (which is the amount of audio after removing silence and non-speech segments) needed to complete profile enrollment in seconds.
      example: 18.65
    RecognitionInfo:
      description: Speaker recognition result
      properties:
        recognitionResult:
          type: string
          description: Does audio belong to targeted profile?
          enum:
          - accept
          - reject
          x-ms-enum:
            name: ResultType
            modelAsString: false
          example: Accept
        score:
          type: number
          description: A float number indicating the similarity between input audio and targeted voice print. This number must be between 0 and 1. A higher number means higher similarity.
          example: 0.63
    EnrollmentsSpeechLength:
      type: number
      description: Summation of pure speech (which is the amount of audio after removing silence and non-speech segments) across all profile enrollments in seconds.
      example: 1.35
    TiEnrollmentInfo_2:
      description: Text-Independent Speaker profile enrollment info
      properties:
        profileId:
          $ref: '#/components/schemas/ProfileId_2'
        enrollmentStatus:
          $ref: '#/components/schemas/EnrollmentStatus_2'
        enrollmentsCount:
          $ref: '#/components/schemas/EnrollmentsCount_2'
        enrollmentsLength:
          $ref: '#/components/schemas/EnrollmentsLength'
        enrollmentsSpeechLength:
          $ref: '#/components/schemas/EnrollmentsSpeechLength'
        remainingEnrollmentsSpeechLength:
          $ref: '#/components/schemas/RemainingEnrollmentsSpeechLength'
        audioLength:
          type: number
          description: This enrolment audio length in seconds.
          example: 1.83
        audioSpeechLength:
          type: number
          description: This enrollment audio pure speech (which is the amount of audio after removing silence and non-speech segments) length in seconds.
          example: 1.35
    LastUpdatedDateTime_2:
      type: string
      description: Last datetime when the profile was updated.
      example: '2015-04-23T19:34:51.52Z'
    Error:
      description: Speaker error message
      required:
      - error
      properties:
        error:
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    SpeakerErrorResponse:
      description: Failure
      x-ms-error-response: true
      headers:
        x-ms-error-code:
          description: Error code
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SpeakerErrorInfo'
    ServerError:
      description: Internal Server Error.
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: InternalServerError
              message: Internal Server Error.
    Unauthorized:
      description: Request is not authorized. Make sure subscription key is included and valid.
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: Unauthorized
              message: Request is not authorized. Make sure subscription key is included and valid.
    RateLimit:
