          type: string
        microsoftAccountClientId:
          description: "Gets or sets the OAuth 2.0 client ID that was created for the app used for authentication.\n            This setting is required for enabling Microsoft Account authentication.\n            Microsoft Account OAuth documentation: https://dev.onedrive.com/auth/msa_oauth.htm"
          type: string
        microsoftAccountClientSecret:
