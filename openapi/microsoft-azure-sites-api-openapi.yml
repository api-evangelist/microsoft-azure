          format: double
          description: "Gets or sets the number of hours after session token expiration that a session token can be used to\n            call the token refresh API. The default is 72 hours."
          type: number
        clientId:
          description: "Gets or sets the Client ID of this relying party application, known as the client_id.\n            This setting is required for enabling OpenID Connection authentication with Azure Active Directory or \n            other 3rd party OpenID Connect providers.\n            More information on OpenID Connect: http://openid.net/specs/openid-connect-core-1_0.html"
          type: string
        clientSecret:
          description: "Gets or sets the Client Secret of this relying party application (in Azure Active Directory, this is also referred to as the Key).\n            This setting is optional. If no client secret is configured, the OpenID Connect implicit auth flow is used to authenticate end users.\n            Otherwise, the OpenID Connect Authorization Code Flow is used to authenticate end users.\n            More information on OpenID Connect: http://openid.net/specs/openid-connect-core-1_0.html"
          type: string
        issuer:
          description: "Gets or sets the OpenID Connect Issuer URI that represents the entity which issues access tokens for this application.\n            When using Azure Active Directory, this value is the URI of the directory tenant, e.g. https://sts.windows.net/{tenant-guid}/.\n            This URI is a case-sensitive identifier for the token issuer.\n            More information on OpenID Connect Discovery: http://openid.net/specs/openid-connect-discovery-1_0.html"
          type: string
        allowedAudiences:
          description: "Gets or sets a list of allowed audience values to consider when validating JWTs issued by \n            Azure Active Directory. Note that the {Microsoft.Web.Hosting.Administration.SiteAuthSettings.ClientId} value is always considered an\n            allowed audience, regardless of this setting."
          type: array
          items:
            type: string
        additionalLoginParams:
          description: "Gets or sets a list of login parameters to send to the OpenID Connect authorization endpoint when\n            a user logs in. Each parameter must be in the form \"key=value\"."
          type: array
          items:
            type: string
        aadClientId:
          type: string
        openIdIssuer:
          type: string
        googleClientId:
          description: "Gets or sets the OpenID Connect Client ID for the Google web application.\n            This setting is required for enabling Google Sign-In.\n            Google Sign-In documentation: https://developers.google.com/identity/sign-in/web/"
          type: string
        googleClientSecret:
          description: "Gets or sets the client secret associated with the Google web application.\n            This setting is required for enabling Google Sign-In.\n            Google Sign-In documentation: https://developers.google.com/identity/sign-in/web/"
          type: string
        googleOAuthScopes:
          description: "Gets or sets the OAuth 2.0 scopes that will be requested as part of Google Sign-In authentication.\n            This setting is optional. If not specified, \"openid\", \"profile\", and \"email\" are used as default scopes.\n            Google Sign-In documentation: https://developers.google.com/identity/sign-in/web/"
          type: array
          items:
            type: string
        facebookAppId:
          description: "Gets or sets the App ID of the Facebook app used for login.\n            This setting is required for enabling Facebook Login.\n            Facebook Login documentation: https://developers.facebook.com/docs/facebook-login"
          type: string
        facebookAppSecret:
