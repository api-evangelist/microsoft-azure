components:
  schemas:
    JobInformationBasic:
      required:
      - name
      - type
      properties:
        jobId:
          readOnly: true
          type: string
          format: uuid
          description: The job's unique identifier (a GUID).
        name:
          type: string
          description: The friendly name of the job.
        type:
          type: string
          enum:
          - USql
          - Hive
          - Scope
          x-ms-enum:
            name: JobType
            modelAsString: false
          description: The job type of the current job (Hive, USql, or Scope (for internal use only)).
        submitter:
          readOnly: true
          type: string
          description: The user or account that submitted the job.
        degreeOfParallelism:
          type: integer
          format: int32
          default: 1
          description: The degree of parallelism used for this job.
        degreeOfParallelismPercent:
          type: number
          format: double
          readOnly: true
          description: the degree of parallelism in percentage used for this job.
        priority:
          type: integer
          format: int32
          description: The priority value for the current job. Lower numbers have a higher priority. By default, a job has a priority of 1000. This must be greater than 0.
        submitTime:
          readOnly: true
          type: string
          format: date-time
          description: The time the job was submitted to the service.
        startTime:
          readOnly: true
          type: string
          format: date-time
          description: The start time of the job.
        endTime:
          readOnly: true
          type: string
          format: date-time
          description: The completion time of the job.
        state:
          readOnly: true
          type: string
          enum:
          - Accepted
          - Compiling
          - Ended
          - New
          - Queued
          - Running
          - Scheduling
          - Starting
          - Paused
          - WaitingForCapacity
          - Yielded
          - Finalizing
          x-ms-enum:
            name: JobState
            modelAsString: false
          description: The job state. When the job is in the Ended state, refer to Result and ErrorMessage for details.
        result:
          readOnly: true
          type: string
          enum:
          - None
          - Succeeded
          - Cancelled
          - Failed
          x-ms-enum:
            name: JobResult
            modelAsString: false
          description: The result of job execution or the current result of the running job.
        logFolder:
          readOnly: true
          type: string
