openapi: 3.2.0
info:
  title: 'Microsoft Azure Custom Speech Transcriptions: API'
  version: '1.0'
  description: 'Operations tagged Custom Speech Transcriptions: across 3 of this provider''s published API definitions: speech-services-api-v20-openapi-original.yml, speech-services-api-v30-openapi-original.yml, speech-services-api-v32-preview2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
security:
- api_key: []
- token: []
tags:
- name: 'Custom Speech Transcriptions:'
paths:
  /transcriptions/locales:
    get:
      tags:
      - 'Custom Speech Transcriptions:'
      summary: Microsoft Azure Gets A List Of Supported Locales For Offline Transcriptions
      operationId: microsoftAzureGetsupportedlocalesfortranscriptions
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Get the supported locales:
          $ref: ./examples/get_supported_transcription_locales.json
      description: Needs a more full description created.
  /transcriptions:
    get:
      tags:
      - 'Custom Speech Transcriptions:'
      summary: Microsoft Azure Gets A List Of Transcriptions For The Authenticated Subscription
      operationId: microsoftAzureGettranscriptions
      parameters:
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/takeQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transcription'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Get all transcriptions:
          $ref: ./examples/get_transcriptions.json
      description: Needs a more full description created.
    post:
      tags:
      - 'Custom Speech Transcriptions:'
      summary: Microsoft Azure Creates A New Transcription
      operationId: microsoftAzureCreatetranscription
      responses:
        '202':
          description: The request was accepted and the response contains the location of the entity.
          headers:
            Retry-After:
              description: The minimum number of seconds to wait before accessing the resource created in this operation.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
            Location:
              description: The location of the created resource.
              schema:
                type: string
                format: uri
            Operation-Location:
              description: The location of the created resource.
              schema:
                type: string
                format: uri
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      x-ms-examples:
        Create a transcription for URIs:
          $ref: ./examples/create_uri_transcription.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptionDefinition'
        description: The details of the new transcription.
        required: true
  /transcriptions/{id}:
    get:
      tags:
      - 'Custom Speech Transcriptions:'
      summary: Microsoft Azure Gets The Transcription Identified By The Given Id
      operationId: microsoftAzureGettranscription
      parameters:
      - in: path
        name: id
        description: The identifier of the transcription.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Get a transcription:
          $ref: ./examples/get_transcription.json
      description: Needs a more full description created.
    patch:
      tags:
      - 'Custom Speech Transcriptions:'
      summary: Microsoft Azure Updates The Mutable Details Of The Transcription Identified By…
      operationId: microsoftAzureUpdatetranscription
      parameters:
      - in: path
        name: id
        description: The identifier of the transcription.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Update a transcription:
          $ref: ./examples/update_transcription.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptionUpdate'
        description: The updated values for the transcription.
        required: true
    delete:
      tags:
      - 'Custom Speech Transcriptions:'
      summary: Microsoft Azure Deletes The Specified Transcription Task
      operationId: microsoftAzureDeletetranscription
      parameters:
      - in: path
        name: id
        description: The identifier of the transcription.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The transcription task was successfully deleted.
          headers:
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Delete a transcription:
          $ref: ./examples/delete_transcription.json
      description: Needs a more full description created.
  /transcriptions/{id}/files:
    get:
      tags:
      - 'Custom Speech Transcriptions:'
      summary: Microsoft Azure Gets The Files Of The Transcription Identified By The Given Id
      operationId: microsoftAzureGettranscriptionfiles
      parameters:
      - in: path
        name: id
        description: The identifier of the transcription.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/sasValidityQueryParameter'
      - $ref: '#/components/parameters/skipQueryParameter_2'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFiles'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_2'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all files:
          $ref: ./examples/get_transcription_files.json
      description: Needs a more full description created.
  /transcriptions/{id}/files/{fileId}:
    get:
      tags:
      - 'Custom Speech Transcriptions:'
      summary: Microsoft Azure Gets One Specific File Identified With Fileid From A…
      operationId: microsoftAzureGettranscriptionfile
      parameters:
      - in: path
        name: id
        description: The identifier of the transcription.
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: fileId
        description: The identifier of the file.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/sasValidityQueryParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_2'
      x-ms-examples:
        Get a file:
          $ref: ./examples/get_transcription_file.json
      description: Needs a more full description created.
components:
  schemas:
    Status:
      title: Status
      description: Describe the current state of the API
      enum:
      - NotStarted
      - Running
      - Succeeded
      - Failed
      type: string
      readOnly: true
      x-ms-enum:
        name: Status
        modelAsString: false
        values:
        - value: NotStarted
          description: The long running operation has not yet started.
        - value: Running
          description: The long running operation is currently processing.
        - value: Succeeded
          description: The long running operation has successfully completed.
        - value: Failed
          description: The long running operation has failed.
    Model:
      title: Model
      required:
      - id
      - locale
      - modelKind
      - name
      type: object
      properties:
        id:
          format: uuid
          description: The identifier of this entity.
          type: string
        name:
          description: The name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        modelKind:
          $ref: '#/components/schemas/ModelKind'
        text:
          description: The text used to adapt this language model.
          type: string
        baseModel:
          $ref: '#/components/schemas/Model'
        datasets:
          description: Datasets used for adaptation.
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        locale:
          description: The locale of the contained data.
          type: string
        properties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
        lastActionDateTime:
          format: date-time
          description: 'The time-stamp when the current status was entered.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status'
        createdDateTime:
          format: date-time
          description: 'The time-stamp when the object was created.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
    Dataset:
      title: Dataset
      required:
      - dataImportKind
      - id
      - locale
      - name
      type: object
      properties:
        id:
          format: uuid
          description: The identifier of this entity.
          type: string
        dataImportKind:
          $ref: '#/components/schemas/DatasetKind'
        name:
          description: The name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        properties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
        locale:
          description: The locale of the contained data.
          type: string
        lastActionDateTime:
          format: date-time
          description: 'The time-stamp when the current status was entered.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status'
        createdDateTime:
          format: date-time
          description: 'The time-stamp when the object was created.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
    TranscriptionDefinition:
      title: TranscriptionDefinition
      required:
      - locale
      - name
      - recordingsUrl
      type: object
      properties:
        recordingsUrl:
          format: uri
          type: string
        models:
          description: The models used in this transcription.
          type: array
          items:
            $ref: '#/components/schemas/ModelIdentity'
        locale:
          description: The locale of the contained data.
          type: string
        name:
          description: The name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        properties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
    ModelKind:
      title: ModelKind
      description: Type of speech model.
      enum:
      - Acoustic
      - Language
      - AcousticAndLanguage
      type: string
      x-ms-enum:
        name: ModelKind
        modelAsString: false
        values:
        - value: Acoustic
          description: An acoustic model.
        - value: Language
          description: A language model.
        - value: AcousticAndLanguage
          description: An acoustic and language model.
    Error:
      title: Error
      description: The interface represents the content of an error response defined in the OneAPI v2.1 documentation.
      required:
      - code
      - message
      type: object
      properties:
        details:
          description: An array of details representing distinct related errors that occurred during the request.
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        innererror:
          $ref: '#/components/schemas/InnerErrorV2'
        code:
          description: 'A service-defined error code that should be human-readable.

            This code serves as a more specific indicator of the error than

