      - locale
      - name
      - recordingsUrl
      type: object
      properties:
        recordingsUrl:
          format: uri
          type: string
        reportFileUrl:
          format: uri
          type: string
          readOnly: true
        id:
          format: uuid
          description: The identifier of this entity.
          type: string
        models:
