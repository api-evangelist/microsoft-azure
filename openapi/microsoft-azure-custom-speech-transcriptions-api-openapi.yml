      title: InnerErrorV2
      description: 'An implementation of this interface represents a stage in a stack trace.

        If the error level is the root, the Microsoft.SpeechServices.Http.Dto.IInnerError.Code and the Microsoft.SpeechServices.Http.Dto.IInnerError.InnerError

        property may be omitted.'
      type: object
      properties:
        code:
          description: 'A service-defined error code that should be human-readable.

            This code serves as a more specific indicator of the error than

            the HTTP error code specified in the response.'
          type: string
        innererror:
          $ref: '#/components/schemas/InnerErrorV2'
    FileLinks:
      title: FileLinks
      type: object
      properties:
        contentUrl:
          format: uri
          description: The url to retrieve the content of this file.
          type: string
          readOnly: true
    ProfanityFilterMode:
      title: ProfanityFilterMode
      description: Mode of profanity filtering.
      enum:
      - None
      - Removed
      - Tags
      - Masked
      type: string
      x-ms-enum:
        name: ProfanityFilterMode
        modelAsString: false
        values:
        - value: None
          description: Disable profanity filtering.
        - value: Removed
          description: Remove profanity.
        - value: Tags
          description: Add "profanity" XML tags&lt;/Profanity&gt;
        - value: Masked
          description: Mask the profanity with * except of the first letter, e.g., f***
