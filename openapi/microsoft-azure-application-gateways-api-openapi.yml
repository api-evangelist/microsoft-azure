    ApplicationGatewaySku:
      properties:
        name:
          type: string
          description: Gets or sets name of application gateway SKU
          enum:
          - Standard_Small
          - Standard_Medium
          - Standard_Large
          x-ms-enum:
            name: ApplicationGatewaySkuName
            modelAsString: true
        tier:
          type: string
          description: Gets or sets tier of application gateway
          enum:
          - Standard
          x-ms-enum:
            name: ApplicationGatewayTier
            modelAsString: true
        capacity:
