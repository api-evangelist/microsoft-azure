    ApplicationGatewayHttpListenerPropertiesFormat:
      properties:
        frontendIPConfiguration:
          $ref: '#/components/schemas/SubResource'
          description: 'Gets or sets frontend IP configuration resource of application gateway '
        frontendPort:
