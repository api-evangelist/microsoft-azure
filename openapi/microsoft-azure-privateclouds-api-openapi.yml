      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        location:
          type: string
          description: Resource location
        tags:
          description: Resource tags
          $ref: '#/components/schemas/ResourceTags'
    Endpoints:
      description: Endpoint addresses
      properties:
        nsxtManager:
          description: Endpoint for the NSX-T Data Center manager
          type: string
          readOnly: true
        vcsa:
          description: Endpoint for Virtual Center Server Appliance
          type: string
          readOnly: true
        hcxCloudManager:
          description: Endpoint for the HCX Cloud Manager
          type: string
          readOnly: true
    ManagementCluster:
      description: The properties of a management cluster
      required:
      - clusterSize
      allOf:
      - $ref: '#/components/schemas/CommonClusterProperties'
    Circuit:
      description: An ExpressRoute Circuit
      properties:
        primarySubnet:
          type: string
          readOnly: true
          description: CIDR of primary subnet
        secondarySubnet:
          type: string
          readOnly: true
          description: CIDR of secondary subnet
        expressRouteID:
          type: string
          readOnly: true
          description: Identifier of the ExpressRoute Circuit (Microsoft Colo only)
        expressRoutePrivatePeeringID:
          type: string
          readOnly: true
          description: ExpressRoute Circuit private peering identifier
    AdminCredentials:
      description: Administrative credentials for accessing vCenter and NSX-T
      properties:
        nsxtUsername:
          description: NSX-T Manager username
          type: string
          readOnly: true
        nsxtPassword:
          description: NSX-T Manager password
          type: string
          readOnly: true
          x-ms-secret: true
        vcenterUsername:
          description: vCenter admin username
          type: string
          readOnly: true
        vcenterPassword:
          description: vCenter admin password
          type: string
          readOnly: true
          x-ms-secret: true
    Sku:
      description: The resource model definition representing SKU
      properties:
        name:
          type: string
          description: The name of the SKU.
      required:
