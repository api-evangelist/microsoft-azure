openapi: 3.2.0
info:
  title: Microsoft Azure CloudNativeTest File API
  version: 2021-07-01-preview
security:
- Bearer: []
tags:
- name: File
paths:
  /file/{fileId}:validate:
    post:
      tags:
      - File
      summary: Microsoft Azure Validate Input File File Name Must Be A Valid Url Character ^[a…
      operationId: microsoftAzureFileFilevalidate
      parameters:
      - in: path
        name: fileId
        description: Unique identifier for test file, must be a valid URL character ^[a-z0-9_-]*$
        required: true
        schema:
          type: string
          maxLength: 50
          minLength: 2
          pattern: ^[a-z0-9_-]*$
      - in: query
        name: api-version
        description: Api version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'The file is validated '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileValidateResponse'
        default:
          description: "*** Error Responses: ***\n\n * \"400\", \"InvalidHostOrResourceName\", \"Host name or domain is not valid\"\n\n * \"400\", RequiredFileId - fileId is required\n\n  * \"400\", \"InvalidFileId\", \"fileId field is not valid\"   \n\n * \"500\", \"InternalServerError\", \"Unable to process the request, please retry\""
          headers:
            x-ms-error-code:
              description: The error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseBody'
      x-ms-examples:
        File_FileValidate_MaximumSet_Gen:
          $ref: ./examples/File_FileValidate_MaximumSet_Gen.json
      description: Needs a more full description created.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Input test file
                  format: binary
              required:
              - file
components:
  schemas:
    DefaultErrorResponseBody:
      description: The definition of an error object.
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponseBody'
    FileValidateResponse:
      description: File validation response
      type: object
      properties:
        valid:
          description: File is valid or not
          type: boolean
        error:
          description: In case file is not valid then error message
          type: string
    ErrorResponseBody:
      description: The error response object.
      type: object
      properties:
        code:
          description: The error code.
          type: string
        message:
          description: The error message.
          type: string
        target:
          description: The error target.
          type: string
        details:
          description: Additional details and inner errors.
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBody'
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: JWT Authorization header using the Bearer scheme.
