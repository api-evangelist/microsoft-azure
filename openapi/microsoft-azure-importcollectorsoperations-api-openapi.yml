components:
  schemas:
    AzureResourceProperties:
      type: object
      description: Common properties for all azure tracked and proxy resources.
      properties:
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: The status of the last operation.
    ProvisioningState:
      type: string
      description: The status of the current operation.
      enum:
      - Succeeded
      - Failed
      - Canceled
      - Provisioning
      - Updating
      - Deleting
      - Accepted
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
        values:
        - name: Succeeded
          value: Succeeded
          description: Resource has been created.
        - name: Failed
          value: Failed
          description: Resource creation failed.
        - name: Canceled
          value: Canceled
          description: Resource creation was canceled.
        - name: Provisioning
          value: Provisioning
          description: Resource is being Provisioned.
        - name: Updating
          value: Updating
          description: Resource is being Updated.
        - name: Deleting
          value: Deleting
          description: Resource is being Deleted.
        - name: Accepted
          value: Accepted
          description: Resource is being Accepted.
    ImportCollectorListResult:
      type: object
      description: The response of a ImportCollector list operation.
      properties:
        value:
          type: array
          description: The ImportCollector items on this page
          items:
            $ref: '#/components/schemas/ImportCollector'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    ImportCollector:
      type: object
      description: Import collector resource.
      properties:
        properties:
          $ref: '#/components/schemas/CollectorPropertiesBase'
          description: The resource-specific properties for this resource.
          x-ms-client-flatten: true
          x-ms-mutability:
          - read
          - create
      allOf:
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/definitions/ProxyResource
    CollectorPropertiesBase:
      type: object
      description: Collector properties class.
      properties:
        discoverySiteId:
          type: string
          description: Gets the discovery site id.
        createdTimestamp:
          type: string
          format: date-time
          description: Gets the Timestamp when collector was created.
          readOnly: true
        updatedTimestamp:
          type: string
          format: date-time
          description: Timestamp when collector was last updated.
          readOnly: true
      allOf:
      - $ref: '#/components/schemas/AzureResourceProperties'
