openapi: 3.2.0
info:
  title: Microsoft Azure Extensions API
  version: '1.0'
  description: 'Operations tagged Extensions across 3 of this provider''s published API definitions: azure-agfoodplatform-rp-service-openapi-original.yml, azure-agrifood-rp-service-openapi-original.yml, visual-studio-resource-provider-client-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
tags:
- name: Extensions
paths:
