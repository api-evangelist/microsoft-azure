        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extension'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v4/types.json#/definitions/ErrorResponse
      x-ms-examples:
        Extensions_CreateOrUpdate:
          $ref: ./examples/Extensions_CreateOrUpdate.json
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups…
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionInstallationRequest'
        description: Extension resource request body.
    get:
      tags:
      - Extensions
      description: Get installed extension details by extension id.
      operationId: microsoftAzureExtensionsGet
