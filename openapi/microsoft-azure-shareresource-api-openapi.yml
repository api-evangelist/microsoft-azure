openapi: 3.2.0
info:
  title: Microsoft Azure Purview Share Client Share Resource API
  description: Creates a data plane client for Purview Share.
  version: 2023-05-30-preview
security:
- azureAuth:
  - https://purview.azure.net/.default
tags:
- name: ShareResource
paths:
  /shareResources:
    get:
      tags:
      - ShareResource
      summary: Microsoft Azure Api Operation To List Shareresources
      description: List share resources
      operationId: microsoftAzureShareresourcesList
      parameters:
      - $ref: '#/components/parameters/api-version'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/orderby'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResourceList'
        default:
          description: Default error response.
          headers:
            x-ms-error-code:
              description: The error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewShareError'
      x-ms-examples:
        ShareResources_List:
          $ref: ./examples/ShareResources_List.json
      x-ms-pageable:
        nextLinkName: nextLink
components:
  schemas:
    PurviewShareError:
      description: The purview share error model.
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/PurviewShareErrorInfo'
    ShareResourceList:
      description: A page of ShareResource results.
      required:
      - value
      type: object
      properties:
        nextLink:
          format: url
          description: The Url of next result page.
          type: string
        value:
          description: Collection of items of type ShareResource
          type: array
          items:
            $ref: '#/components/schemas/ShareResource'
    ProxyResource:
      description: Base data transfer object implementation for proxy resources.
      type: object
      properties:
        id:
          description: The unique id of the resource.
          type: string
          readOnly: true
        type:
          description: Type of the resource.
          type: string
          readOnly: true
    StoreKind:
      description: The types of asset.
      enum:
      - AdlsGen2Account
      - BlobAccount
      type: string
      x-ms-enum:
        name: StoreKind
        modelAsString: true
        values:
        - value: AdlsGen2Account
          description: The store kind is a Adls Gen 2 storage account
          name: Adls gen 2 storage account store kind
        - value: BlobAccount
          description: The store kind is a Blob storage account
          name: Blob storage account store kind
    ShareResource:
      description: A share resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/ProxyResource'
      properties:
        receivedSharesCount:
          format: int32
          description: A count of Received Shares associated with the Microsoft.Azure.Purview.Share.ApiService.V3.DataTransferObjects.ShareResource.
          type: integer
        sentSharesCount:
          format: int32
          description: A count of Sent Shares associated with the Microsoft.Azure.Purview.Share.ApiService.V3.DataTransferObjects.ShareResource.
          type: integer
        storeKind:
          $ref: '#/components/schemas/StoreKind'
        storeReference:
          $ref: '#/components/schemas/StoreReference'
    ReferenceNameType:
      description: Defines the type of resource being shared
      enum:
      - ArmResourceReference
      type: string
      x-ms-enum:
        name: ReferenceNameType
        modelAsString: true
        values:
        - value: ArmResourceReference
          description: The type of reference is an ARM resource
          name: Arm resource reference
    PurviewShareErrorInfo:
      description: The purview share error body model.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Code of the error
          type: string
        details:
          description: Nested details of the error model
          type: array
          items:
            $ref: '#/components/schemas/PurviewShareErrorInfo'
        message:
          description: Message of the error
          type: string
        target:
          description: Target of the error
          type: string
    StoreReference:
      description: A Store Reference for an artifact or sink.
      type: object
      properties:
        referenceName:
          description: Reference name for resource associated with the sink or artifact.
          type: string
        type:
          $ref: '#/components/schemas/ReferenceNameType'
  parameters:
    filter:
      in: query
      name: filter
      description: Filters the results using OData syntax
      x-ms-parameter-location: method
      schema:
        type: string
    api-version:
      in: query
      name: api-version
      description: The api version to use
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    orderby:
      in: query
      name: orderby
      description: Sorts the results using OData syntax
      x-ms-parameter-location: method
      schema:
        type: string
  securitySchemes:
    azureAuth:
      type: oauth2
      flows:
        implicit:
          scopes:
            https://purview.azure.net/.default: Purview service scope
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
      description: Azure Active Directory OAuth2 Flow.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/endpoint'
