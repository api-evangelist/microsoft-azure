        required: false
        schema:
          type: string
      - name: scheduledBefore
        in: query
        description: 'If specified, filter on jobs that was scheduled before or at given timestamp. Range: (-Inf, scheduledBefore].'
        required: false
        schema:
          type: string
          format: date-time
      - name: scheduledAfter
        in: query
