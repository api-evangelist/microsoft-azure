openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector List Management Image Lists API
tags:
- name: ListManagementImageLists
paths:
  /contentmoderator/lists/v1.0/imagelists/{listId}:
    get:
      tags:
      - ListManagementImageLists
      operationId: microsoftAzureListmanagementimagelistsGetdetails
      description: Returns the details of the image list with listId equal to the passed list ID.
      parameters:
      - $ref: '#/components/parameters/listId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Get List Id Details request:
          $ref: ../v1.0/examples/GetImageListIdDetailsResource.JSON
      summary: Microsoft Azure Get Contentmoderator Lists 0 Imagelists Listid
    delete:
      tags:
      - ListManagementImageLists
      operationId: microsoftAzureListmanagementimagelistsDelete
      description: Deletes the image list with listId equal to the passed list ID.
      parameters:
      - $ref: '#/components/parameters/listId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Delete Imagelist request:
          $ref: ../v1.0/examples/DeleteImageListResource.JSON
      summary: Microsoft Azure Delete Contentmoderator Lists 0 Imagelists Listid
    put:
      tags:
      - ListManagementImageLists
      operationId: microsoftAzureListmanagementimagelistsUpdate
      description: Updates an image list with listId equal to the passed list ID.
      parameters:
      - $ref: '#/components/parameters/listId'
      - name: Content-Type
        description: Content type.
        required: true
        in: header
        schema:
          type: string
      - $ref: '#/components/parameters/body'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Update Imagelist request:
          $ref: ../v1.0/examples/UpdateImageListResource.JSON
      summary: Microsoft Azure Put Contentmoderator Lists 0 Imagelists Listid
  /contentmoderator/lists/v1.0/imagelists:
    post:
      tags:
      - ListManagementImageLists
      operationId: microsoftAzureListmanagementimagelistsCreate
      description: Creates an image list.
      parameters:
      - name: Content-Type
        description: Content type.
        required: true
        in: header
        schema:
          type: string
      - $ref: '#/components/parameters/body'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Create Imagelist request:
          $ref: ../v1.0/examples/CreateImageListResource.JSON
      summary: Microsoft Azure Post Contentmoderator Lists 0 Imagelists
    get:
      tags:
      - ListManagementImageLists
      operationId: microsoftAzureListmanagementimagelistsGetallimagelists
      description: Gets all the image lists.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageLists'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Get All Imagelists request:
          $ref: ../v1.0/examples/GetImageListsResource.JSON
      summary: Microsoft Azure Get Contentmoderator Lists 0 Imagelists
  /contentmoderator/lists/v1.0/imagelists/{listId}/RefreshIndex:
    post:
      tags:
      - ListManagementImageLists
      operationId: microsoftAzureListmanagementimagelistsRefreshindex
      description: Refreshes the index of the list with listId equal to the passed list ID.
      parameters:
      - $ref: '#/components/parameters/listId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshIndex'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Refresh Image Index request:
          $ref: ../v1.0/examples/RefreshImageIndexResource.JSON
      summary: Microsoft Azure Post Contentmoderator Lists 0 Imagelists Listid Refreshindex
components:
  schemas:
    APIError:
      type: object
      description: Error information that the API returns.
      properties:
        Error:
          $ref: '#/components/schemas/Error'
    ImageLists:
      type: array
      items:
        $ref: '#/components/schemas/ImageList'
    Error:
      type: object
      description: Error body.
      properties:
        Code:
          type: string
        Message:
          type: string
    ImageList:
      description: Image list properties.
      properties:
        Id:
          description: Image list ID.
          type: integer
        Name:
          description: Image list name.
          type: string
        Description:
          description: Description for the image list.
          type: string
        Metadata:
          description: Image list metadata.
          type: object
          additionalProperties:
            type: string
    RefreshIndex:
      description: Response after you refresh the index.
      properties:
        ContentSourceId:
          description: Content source ID.
          type: string
        IsUpdateSuccess:
          description: Update success status.
          type: boolean
        AdvancedInfo:
          description: Advanced info list.
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        Status:
          description: Status of refreshing the index.
          $ref: '#/components/schemas/Status'
        TrackingId:
          description: Tracking ID.
          type: string
    Status:
      description: Status properties.
      properties:
        Code:
          description: Status code.
          type: integer
        Description:
          description: Status description.
          type: string
        Exception:
          description: Exception status.
          type: string
  parameters:
    listId:
      name: listId
      in: path
      description: List ID of the image list.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    body:
      name: body
      in: body
      description: Schema of the body.
      required: true
      schema:
        type: object
        properties:
          Name:
            description: Name of the list.
            type: string
          Description:
            description: Description of the list.
            type: string
          Metadata:
            description: Metadata of the list.
            type: object
            additionalProperties:
              type: string
      x-ms-parameter-location: method
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
