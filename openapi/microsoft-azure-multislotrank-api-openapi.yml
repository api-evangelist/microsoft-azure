openapi: 3.2.0
info:
  title: Microsoft Azure Multi Slot Rank API
  version: '1.0'
  description: 'Operations tagged MultiSlotRank across 2 of this provider''s published API definitions: personalizer-client-2022-09-01-preview-openapi-original.yml, personalizer-client-v11-preview3-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /personalizer
- url: /personalizer/v1.1-preview.3
tags:
- name: MultiSlotRank
  description: Manages multi-slot ranking operations.
paths:
  /multislot/rank:
    post:
      tags:
      - MultiSlotRank
      summary: Microsoft Azure Post Multi Slot Rank
      description: Submit a Personalizer multi-slot rank request. Receives a context, a list of actions, and a list of slots. Returns which of the provided actions should be used in each slot, in each rewardActionId.
      operationId: microsoftAzureMultislotRank
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiSlotRankResponse'
        default:
          description: Invalid request.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Successful MultiSlot_Rank request:
          $ref: ./examples/MultiSlot_Rank.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiSlotRankRequest'
        description: A Personalizer multi-slot Rank request.
        required: true
      security:
      - {}
    servers:
    - url: /personalizer
components:
