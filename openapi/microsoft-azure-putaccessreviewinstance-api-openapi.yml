openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Put Access Review Instance API
tags:
- name: PutAccessReviewInstance
paths:
  ? /subscriptions/{subscriptionId}/providers/Microsoft.Authorization/accessReviewScheduleDefinitions/{scheduleDefinitionId}/instances/{id}
  : put:
      tags:
      - PutAccessReviewInstance
      operationId: microsoftAzureAccessreviewinstancesCreate
      x-ms-examples:
        PutAccessReviewInstance:
          $ref: ./examples/PutAccessReviewInstance.json
      description: Update access review instance.
      parameters:
      - name: scheduleDefinitionId
        in: path
        required: true
        description: The id of the access review schedule definition.
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: The id of the access review instance.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReviewInstance'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDefinition'
      summary: Microsoft Azure Put Subscriptions Subscriptionid Providers Microsoft Authorization Accessreviewscheduledefinitions Scheduledefinitionid Instances Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessReviewInstanceProperties'
        description: Access review instance properties.
        required: true
components:
  schemas:
    AccessReviewReviewer:
      type: object
      properties:
        principalId:
          type: string
          description: The id of the reviewer(user/servicePrincipal)
        principalType:
          type: string
          readOnly: true
          description: 'The identity type : user/servicePrincipal'
          enum:
          - user
          - servicePrincipal
          x-ms-enum:
            name: AccessReviewReviewerType
            modelAsString: true
      description: Descriptor for what needs to be reviewed
    AccessReviewInstance:
      type: object
      x-ms-azure-resource: true
      properties:
        id:
          type: string
          readOnly: true
          description: The access review instance id.
        name:
          type: string
          readOnly: true
          description: The access review instance name.
        type:
          type: string
          readOnly: true
          description: The resource type.
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/AccessReviewInstanceProperties'
          description: Access Review properties.
      description: Access Review Instance.
    ErrorDefinitionProperties:
      type: object
      title: Error
      description: Error description and code explaining why an operation failed.
      properties:
        message:
          type: string
          readOnly: true
          description: Description of the error.
        code:
          type: string
          description: Error code of list gateway.
    ErrorDefinition:
      type: object
      title: Error
      description: Error description and code explaining why an operation failed.
      properties:
        error:
          $ref: '#/components/schemas/ErrorDefinitionProperties'
          description: Error of the list gateway status.
    AccessReviewInstanceProperties:
      type: object
      properties:
        status:
          type: string
          readOnly: true
          description: This read-only field specifies the status of an access review instance.
          enum:
          - NotStarted
          - InProgress
          - Completed
          - Applied
          - Initializing
          - Applying
          - Completing
          - Scheduled
          - AutoReviewing
          - AutoReviewed
          - Starting
          x-ms-enum:
            name: AccessReviewInstanceStatus
            modelAsString: true
        startDateTime:
          type: string
          format: date-time
          description: The DateTime when the review instance is scheduled to be start.
        endDateTime:
          type: string
          format: date-time
          description: The DateTime when the review instance is scheduled to end.
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/AccessReviewReviewer'
          description: This is the collection of reviewers.
          x-ms-identifiers: []
        backupReviewers:
          type: array
          items:
            $ref: '#/components/schemas/AccessReviewReviewer'
          description: This is the collection of backup reviewers.
          x-ms-identifiers: []
        reviewersType:
          type: string
          readOnly: true
          description: This field specifies the type of reviewers for a review. Usually for a review, reviewers are explicitly assigned. However, in some cases, the reviewers may not be assigned and instead be chosen dynamically. For example managers review or self review.
          enum:
          - Assigned
          - Self
          - Managers
          x-ms-enum:
            name: AccessReviewInstanceReviewersType
            modelAsString: true
      description: Access Review Instance properties.
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to be used with the HTTP request.
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The ID of the target subscription.
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
