components:
  schemas:
    CustomAllocationDefinition:
      description: This tells DPS which webhook to call when using custom allocation.
      required:
      - webhookUrl
      - apiVersion
      type: object
      properties:
        webhookUrl:
          description: The webhook URL used for allocation requests.
          type: string
        apiVersion:
          description: 'The API version of the provisioning service types (such as IndividualEnrollment) sent in the custom allocation request. Minimum supported version: "2018-09-01-preview".'
          type: string
    ReprovisionPolicy:
      description: The behavior of the service when a device is re-provisioned to an IoT hub.
      required:
      - updateHubAssignment
      - migrateDeviceData
      type: object
      properties:
        updateHubAssignment:
          description: When set to true (default), the Device Provisioning Service will evaluate the device's IoT Hub assignment and update it if necessary for any provisioning requests beyond the first from a given device. If set to false, the device will stay assigned to its current IoT hub.
          default: true
          type: boolean
        migrateDeviceData:
          description: When set to true (default), the Device Provisioning Service will migrate the device's data (twin, device capabilities, and device ID) from one IoT hub to another during an IoT hub assignment update. If set to false, the Device Provisioning Service will reset the device's data to the initial desired configuration stored in the corresponding enrollment list.
          default: true
          type: boolean
    Metadata:
      description: Metadata for the TwinCollection
      type: object
      properties:
        lastUpdated:
          format: date-time
          description: Last time the TwinCollection was updated
          type: string
        lastUpdatedVersion:
          format: int64
          description: This is null for reported properties metadata and is not null for desired properties metadata.
          type: integer
    RoutingTwin:
      description: Twin reference input parameter. This is an optional parameter
      type: object
      properties:
        tags:
          description: Twin Tags
          type: object
        properties:
          properties:
            desired:
              description: Twin desired properties
              type: object
            reported:
              description: Twin desired properties
              type: object
    IotHubNameAvailabilityInfo:
      description: The properties indicating whether a given IoT hub name is available.
      type: object
      properties:
        nameAvailable:
          description: The value which indicates whether the provided name is available.
          type: boolean
          readOnly: true
        reason:
          description: The reason for unavailability.
          enum:
          - Invalid
          - AlreadyExists
          type: string
          readOnly: true
          x-ms-enum:
            name: IotHubNameUnavailabilityReason
            modelAsString: false
        message:
          description: The detailed reason message.
          type: string
    RouteErrorRange:
      description: Range of route errors
      type: object
      properties:
        start:
          description: Start where the route error happened
          $ref: '#/components/schemas/RouteErrorPosition'
        end:
          description: End where the route error happened
          $ref: '#/components/schemas/RouteErrorPosition'
    RoutingMessage:
      description: Routing message
      type: object
      properties:
        body:
          description: Body of routing message
          type: string
        appProperties:
          description: App properties
          type: object
          additionalProperties:
            type: string
        systemProperties:
          description: System properties
          type: object
          additionalProperties:
            type: string
    BulkEnrollmentGroupOperation:
      description: Bulk enrollment operation.
      required:
      - enrollmentGroups
      - mode
      type: object
      properties:
        enrollmentGroups:
          description: Enrollment items
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentGroup'
        mode:
          description: Operation mode.
          enum:
          - create
          - update
          - updateIfMatchETag
          - delete
          type: string
    BulkEnrollmentOperationError:
      description: Bulk enrollment operation error
      required:
      - registrationId
      - errorCode
      - errorStatus
      type: object
      properties:
        registrationId:
          description: 'This id is used to uniquely identify a device registration of an enrollment.

            A case-insensitive string (up to 128 characters long) of alphanumeric characters plus certain special characters : . _ -. No special characters allowed at start or end.'
          type: string
        errorCode:
          format: int32
          description: Error code
          type: integer
        errorStatus:
          description: Error status.
          type: string
    BulkEnrollmentGroupOperationResult:
      description: Results of a bulk enrollment group operation.
      required:
      - isSuccessful
      type: object
      properties:
        errors:
          description: Registration errors
          type: array
          items:
            $ref: '#/components/schemas/BulkEnrollmentGroupOperationError'
        isSuccessful:
          description: Indicates if the operation was successful in its entirety.
          type: boolean
    SharedAccessSignatureAuthorizationRuleListResult:
      description: The list of shared access policies with a next link.
      type: object
      properties:
        value:
          description: The list of shared access policies.
          type: array
          items:
            $ref: '#/components/schemas/SharedAccessSignatureAuthorizationRule'
        nextLink:
          description: The next link.
          type: string
          readOnly: true
    TestRouteInput:
      required:
      - route
      description: Input for testing route
      type: object
      properties:
        message:
          description: Routing message
          $ref: '#/components/schemas/RoutingMessage'
        route:
          description: Route properties
          $ref: '#/components/schemas/RouteProperties'
        twin:
          description: Routing Twin Reference
          $ref: '#/components/schemas/RoutingTwin'
    BulkEnrollmentGroupOperationError:
      description: Bulk enrollment operation error.
      required:
      - enrollmentGroupId
      - errorCode
      - errorStatus
      type: object
      properties:
        enrollmentGroupId:
          description: Enrollment group id.
          type: string
        errorCode:
          format: int32
          description: Error code
          type: integer
        errorStatus:
          description: Error status.
          type: string
    TwinCollection:
      description: Represents a collection of properties within a Twin
      type: object
      properties:
        version:
          format: int64
          description: Version of the TwinCollection
          type: integer
        count:
          description: Number of properties in the TwinCollection
          type: integer
        metadata:
          $ref: '#/components/schemas/Metadata'
