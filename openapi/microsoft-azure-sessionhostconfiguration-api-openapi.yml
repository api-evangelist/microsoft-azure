      responses:
        '200':
          description: Successfully initiated SessionHostConfiguration Update validation.
          headers:
            Azure-AsyncOperation:
              description: The URL of the resource used to check the status of the asynchronous operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHostConfiguration'
        '201':
          description: Successfully created Session Host Configuration.
          headers:
            Azure-AsyncOperation:
              description: The URL of the resource used to check the status of the asynchronous operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHostConfiguration'
        default:
          description: Automation error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Desktopvirtualization Hostpools Hostpoolname Sessionhostconfigurations Default
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionHostConfiguration'
        description: Object containing SessionHostConfiguration definitions.
        required: true
    patch:
      tags:
      - SessionHostConfiguration
      operationId: microsoftAzureSessionhostconfigurationsUpdate
      description: Update a SessionHostConfiguration.
      x-ms-examples:
        SessionHostConfigurations_Update:
          $ref: ./examples/SessionHostConfigurations_Update.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/HostPoolNameParameter'
      responses:
        '200':
          description: Successfully created SessionHostConfiguration.
          headers:
            Azure-AsyncOperation:
              description: The URL of the resource used to check the status of the asynchronous operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHostConfiguration'
        '202':
          description: Successfully created SessionHostConfiguration.
          headers:
            Location:
              description: The URL of the resource used to check the status of the asynchronous operation.
              schema:
                type: string
            Azure-AsyncOperation:
              description: The URL of the resource used to check the status of the asynchronous operation.
              schema:
                type: string
            Retry-After:
              description: Suggested delay to check the status of the asynchronous operation. The value is an integer that represents the seconds.
              schema:
                type: integer
                format: int32
        default:
          description: Automation error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      summary: Microsoft Azure Patch Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Desktopvirtualization Hostpools Hostpoolname Sessionhostconfigurations Default
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionHostConfigurationPatch'
        description: Object containing SessionHostConfiguration definitions.
    get:
      tags:
      - SessionHostConfiguration
      operationId: microsoftAzureSessionhostconfigurationsGet
      description: Get a SessionHostConfiguration.
      x-ms-examples:
        SessionHostConfigurations_Get:
          $ref: ./examples/SessionHostConfigurations_Get.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/HostPoolNameParameter'
      responses:
        '200':
          description: Successfully retrieved sessionHostConfiguration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHostConfiguration'
        default:
          description: Automation error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Desktopvirtualization Hostpools Hostpoolname Sessionhostconfigurations Default
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DesktopVirtualization/hostPools/{hostPoolName}/sessionHostConfigurations
  : get:
      tags:
      - SessionHostConfiguration
      operationId: microsoftAzureSessionhostconfigurationsListbyhostpool
      description: List sessionHostConfigurations.
      x-ms-examples:
        SessionHostConfigurations_ListByHostPool:
          $ref: ./examples/SessionHostConfigurations_ListByHostPool.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/HostPoolNameParameter'
      responses:
        '200':
          description: Successfully retrieved sessionHostConfigurations in HostPool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHostConfigurationList'
