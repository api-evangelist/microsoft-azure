openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Registration Definitions API
tags:
- name: RegistrationDefinitions
paths:
  /{scope}/providers/Microsoft.ManagedServices/registrationDefinitions/{registrationDefinitionId}:
    get:
      tags:
      - RegistrationDefinitions
      operationId: microsoftAzureRegistrationdefinitionsGet
      description: Gets the registration definition details.
      parameters:
      - $ref: '#/components/parameters/ScopeParameter'
      - $ref: '#/components/parameters/registrationDefinitionIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK - Returns the complete registration definition with plan details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDefinition'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Get Registration Definition:
          $ref: ./examples/GetRegistrationDefinition.json
      summary: Microsoft Azure Get Scope Providers Microsoft Managedservices Registrationdefinitions Registrationdefinitionid
    delete:
      tags:
      - RegistrationDefinitions
      operationId: microsoftAzureRegistrationdefinitionsDelete
      description: Deletes the registration definition.
      parameters:
      - $ref: '#/components/parameters/registrationDefinitionIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ScopeParameter'
      responses:
        '200':
          description: OK - The registration definition is deleted.
        '204':
          description: No Content- The registration definition does not exist.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Delete Registration Definition:
          $ref: ./examples/DeleteRegistrationDefinition.json
      summary: Microsoft Azure Delete Scope Providers Microsoft Managedservices Registrationdefinitions Registrationdefinitionid
    put:
      tags:
      - RegistrationDefinitions
      operationId: microsoftAzureRegistrationdefinitionsCreateorupdate
      x-ms-long-running-operation: true
      description: Creates or updates a registration definition.
      parameters:
      - $ref: '#/components/parameters/registrationDefinitionIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ScopeParameter'
      responses:
        '200':
          description: Ok - Returns information about the updated registration definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDefinition'
        '201':
          description: Created - Returns information about the created registration definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDefinition'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Put Registration Definition:
          $ref: ./examples/PutRegistrationDefinition.json
      summary: Microsoft Azure Put Scope Providers Microsoft Managedservices Registrationdefinitions Registrationdefinitionid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationDefinition'
        description: The parameters required to create new registration definition.
        required: true
  /{scope}/providers/Microsoft.ManagedServices/registrationDefinitions:
    get:
      tags:
      - RegistrationDefinitions
      operationId: microsoftAzureRegistrationdefinitionsList
      description: Gets a list of the registration definitions.
      parameters:
      - $ref: '#/components/parameters/ScopeParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK - Returns a list of the registration definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDefinitionList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        Get Registration Definitions:
          $ref: ./examples/GetRegistrationDefinitions.json
      summary: Microsoft Azure Get Scope Providers Microsoft Managedservices Registrationdefinitions
components:
  schemas:
    ErrorResponse:
      description: Error response.
      properties:
        error:
          $ref: '#/components/schemas/ErrorDefinition'
          description: The error details.
          type: object
    Authorization:
      properties:
        principalId:
          type: string
          description: Principal Id of the security group/service principal/user that would be assigned permissions to the projected subscription
        principalIdDisplayName:
          type: string
          description: Display name of the principal Id.
        roleDefinitionId:
          type: string
          description: The role definition identifier. This role will define all the permissions that the security group/service principal/user must have on the projected subscription. This role cannot be an owner role.
        delegatedRoleDefinitionIds:
          type: array
          description: The delegatedRoleDefinitionIds field is required when the roleDefinitionId refers to the User Access Administrator Role. It is the list of role definition ids which define all the permissions that the user in the authorization can assign to other security groups/service principals/users.
          items:
            format: uuid
            type: string
      required:
      - principalId
      - roleDefinitionId
      type: object
      description: Authorization tuple containing principal Id (of user/service principal/security group) and role definition id.
    RegistrationDefinitionProperties:
      properties:
        description:
          type: string
          description: Description of the registration definition.
        authorizations:
          type: array
          items:
            $ref: '#/components/schemas/Authorization'
          description: Authorization tuple containing principal id of the user/security group or service principal and id of the build-in role.
        registrationDefinitionName:
          type: string
          description: Name of the registration definition.
        managedByTenantId:
          type: string
          description: Id of the managedBy tenant.
        provisioningState:
          type: string
          readOnly: true
          description: Current state of the registration definition.
          enum:
          - NotSpecified
          - Accepted
          - Running
          - Ready
          - Creating
          - Created
          - Deleting
          - Deleted
          - Canceled
          - Failed
          - Succeeded
          - Updating
          x-ms-enum:
            name: ProvisioningState
            modelAsString: true
        managedByTenantName:
          readOnly: true
          type: string
          description: Name of the managedBy tenant.
      required:
      - managedByTenantId
      - authorizations
      type: object
      description: Properties of a registration definition.
    Plan:
      properties:
        name:
          type: string
          description: The plan name.
        publisher:
          type: string
          description: The publisher ID.
        product:
          type: string
          description: The product code.
        version:
          type: string
          description: The plan's version.
      required:
      - name
      - publisher
      - product
      - version
      type: object
      description: Plan details for the managed services.
    ErrorDefinition:
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Error message indicating why the operation failed.
        details:
          description: Internal error details.
          type: array
          items:
            $ref: '#/components/schemas/ErrorDefinition'
      required:
      - code
      - message
      type: object
      description: Error response indicates Azure Resource Manager is not able to process the incoming request. The reason is provided in the error message.
    RegistrationDefinitionList:
      properties:
        value:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/RegistrationDefinition'
          description: List of registration definitions.
        nextLink:
          description: Link to next page of registration definitions.
          type: string
          readOnly: true
      description: List of registration definitions.
    RegistrationDefinition:
      properties:
        properties:
          description: Properties of a registration definition.
          $ref: '#/components/schemas/RegistrationDefinitionProperties'
        plan:
          description: Plan details for the managed services.
          $ref: '#/components/schemas/Plan'
        id:
          readOnly: true
          type: string
          description: Fully qualified path of the registration definition.
        type:
          readOnly: true
          type: string
          description: Type of the resource.
        name:
          readOnly: true
          type: string
          description: Name of the registration definition.
      x-ms-azure-resource: true
      type: object
      description: Registration definition.
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      x-ms-parameter-location: method
      description: The API version to use for this operation.
      schema:
        type: string
    registrationDefinitionIdParameter:
      name: registrationDefinitionId
      in: path
      required: true
      x-ms-parameter-location: method
      description: Guid of the registration definition.
      schema:
        type: string
    ScopeParameter:
      name: scope
      in: path
      required: true
      x-ms-parameter-location: method
      x-ms-skip-url-encoding: true
      description: Scope of the resource.
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
