components:
  schemas:
    BusinessProcessListResult:
      type: object
      description: The response of a BusinessProcess list operation.
      properties:
        value:
          type: array
          description: The BusinessProcess items on this page
          items:
            $ref: '#/components/schemas/BusinessProcess'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    BusinessProcessUpdateProperties:
      type: object
      description: The updatable properties of the BusinessProcess.
      properties:
        description:
          type: string
          description: The description of the business process.
        tableName:
          type: string
          description: The table name of the business process.
        trackingDataStoreReferenceName:
          type: string
          description: The tracking data store reference name.
        identifier:
          $ref: '#/components/schemas/BusinessProcessIdentifier'
          description: The business process identifier.
        businessProcessStages:
          type: object
          description: The business process stages.
          additionalProperties:
            $ref: '#/components/schemas/BusinessProcessStage'
        businessProcessMapping:
          type: object
          description: The business process mapping.
          additionalProperties:
            $ref: '#/components/schemas/BusinessProcessMappingItem'
    BusinessProcessMappingItem:
      type: object
      description: The properties of business process mapping.
      properties:
        logicAppResourceId:
          type: string
          description: The logic app resource id.
        workflowName:
          type: string
          description: The workflow name within the logic app.
        operationName:
          type: string
          description: The operation name.
        operationType:
          type: string
          description: The mapping item operation type of the business process.
    BusinessProcess:
      type: object
      description: A business process under application.
      properties:
        properties:
          $ref: '#/components/schemas/BusinessProcessProperties'
          description: The resource-specific properties for this resource.
          x-ms-client-flatten: true
          x-ms-mutability:
          - read
          - create
      allOf:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ProxyResource
    BusinessProcessUpdate:
      type: object
      description: The type used for update operations of the BusinessProcess.
      properties:
        properties:
          $ref: '#/components/schemas/BusinessProcessUpdateProperties'
          x-ms-client-flatten: true
    BusinessProcessProperties:
      type: object
      description: The properties of business process.
      properties:
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: The status of the last operation.
          readOnly: true
        version:
          type: string
          description: The version of the business process.
          readOnly: true
        description:
          type: string
          description: The description of the business process.
        tableName:
          type: string
          description: The table name of the business process.
        trackingDataStoreReferenceName:
          type: string
          description: The tracking data store reference name.
        identifier:
          $ref: '#/components/schemas/BusinessProcessIdentifier'
          description: The business process identifier.
        businessProcessStages:
          type: object
          description: The business process stages.
          additionalProperties:
            $ref: '#/components/schemas/BusinessProcessStage'
        businessProcessMapping:
          type: object
          description: The business process mapping.
          additionalProperties:
            $ref: '#/components/schemas/BusinessProcessMappingItem'
    BusinessProcessStage:
      type: object
      description: The properties of business process stage.
      properties:
        description:
          type: string
          description: The description of the business stage.
        properties:
          type: object
          description: The properties within the properties of the business process stage.
          additionalProperties:
            type: string
        stagesBefore:
          type: array
          description: The property to keep track of stages before current in the business process stage.
          items:
            type: string
    ProvisioningState:
      type: string
      description: The status of the current operation.
      enum:
      - Succeeded
      - Failed
      - Canceled
      - Provisioning
      - Updating
      - Deleting
      - Accepted
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
        values:
        - name: Succeeded
          value: Succeeded
          description: Resource has been created.
        - name: Failed
          value: Failed
          description: Resource creation failed.
        - name: Canceled
          value: Canceled
          description: Resource creation was canceled.
        - name: Provisioning
          value: Provisioning
        - name: Updating
          value: Updating
        - name: Deleting
          value: Deleting
        - name: Accepted
          value: Accepted
    BusinessProcessIdentifier:
      type: object
      description: The properties of business process identifier.
      properties:
        propertyName:
          type: string
          description: The property name of the business process identifier.
        propertyType:
          type: string
          description: The property type of the business process identifier.
