openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Evaluated Web Apps Operations API
tags:
- name: EvaluatedWebAppsOperations
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Migrate/assessmentProjects/{projectName}/businessCases/{businessCaseName}/evaluatedWebApps
  : get:
      operationId: microsoftAzureEvaluatedwebappsoperationsListbybusinesscase
      tags:
      - EvaluatedWebAppsOperations
      description: List EvaluatedWebApp resources by BusinessCase
      parameters:
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - name: $filter
        in: query
        description: Filter query.
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Optional parameter for page size.
        required: false
        schema:
          type: integer
          format: int32
      - name: continuationToken
        in: query
        description: Optional parameter for continuation token.
        required: false
        schema:
          type: string
      - name: totalRecordCount
        in: query
        description: Total record count.
        required: false
        schema:
          type: integer
          format: int32
      - name: projectName
        in: path
        description: Assessment Project Name
        required: true
        schema:
          type: string
          pattern: ^[^<>&:\?/#]{1,260}$
      - name: businessCaseName
        in: path
        description: Business case ARM name
        required: true
        schema:
          type: string
          pattern: ^[^<>&:\?/#]{1,260}$
      responses:
        '200':
          description: ARM operation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatedWebAppListResult'
        default:
          description: An unexpected error response.
          content:
