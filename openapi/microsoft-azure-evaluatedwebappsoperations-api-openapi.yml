components:
  schemas:
    EvaluatedWebAppListResult:
      type: object
      description: The response of a EvaluatedWebApp list operation.
      properties:
        value:
          type: array
          description: The EvaluatedWebApp items on this page
          items:
            $ref: '#/components/schemas/EvaluatedWebApp'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    EvaluatedWebApp:
      type: object
      description: Evaluated web app resource.
      properties:
        properties:
          $ref: '#/components/schemas/EvaluatedWebAppProperties'
          description: The resource-specific properties for this resource.
          x-ms-client-flatten: true
          x-ms-mutability:
          - read
          - create
      allOf:
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/definitions/ProxyResource
    EvaluatedWebAppProperties:
      type: object
      description: Evaluated web app properties class.
      properties:
        recommendedAzureTarget:
          type: string
          description: Recommended Azure target.
        recommendedAzureSkuName:
          type: string
          description: Recommended Azure SKU name.
        recommendedAzureSkuSize:
          type: string
          description: Recommended Azure SKU size.
        serverName:
          type: string
          description: The server name.
        workload:
          type: string
          description: The workload.
        activityState:
          type: string
          description: The activity state.
        readyForMigration:
          type: string
          description: Is machine ready for migration.
