          description: Defines configuration of a TLS server certificate. NOTE Enum - Only one TLS Cert method is supported
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: The status of the last operation.
          readOnly: true
      required:
      - brokerRef
      - port
    SanForCert:
