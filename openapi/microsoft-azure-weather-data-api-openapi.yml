openapi: 3.2.0
info:
  title: Microsoft Azure Weather Data API
  version: '1.0'
  description: 'Operations tagged WeatherData across 2 of this provider''s published API definitions: azure-agfoodplatform-data-plane-service-openapi-original.yml, microsoft-azure-data-manager-for-agriculture-data-plane-service-openapi-original.yml. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Weather Data
paths:
  /weather-data/:fetch:
    post:
      tags:
      - Weather Data
      description: Returns a list of WeatherData.
      operationId: microsoftAzureWeatherdataGet
      parameters:
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            x-ms-cache-hit:
              description: Indicate whether the request was cache hit or cache miss.
              schema:
                type: boolean
            x-ms-response-latency-in-milliseconds:
              description: Time taken in milliseconds for processing the request at server side.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherDataProviderResponse'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        WeatherData_Get:
          $ref: ./examples/WeatherData_Get.json
      summary: Microsoft Azure Post Weather Data :fetch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherDataProviderRequest'
        description: Weather data provider request.
        required: true
  /weather-data:fetch:
    post:
      tags:
      - Weather Data
      description: Returns a list of WeatherData.
      operationId: microsoftAzureWeatherdataGet
      parameters:
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
