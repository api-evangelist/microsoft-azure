                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        WeatherData_Get:
          $ref: ./examples/WeatherData_Get.json
      summary: Microsoft Azure Post Weather Data:fetch
      requestBody:
        content:
