openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Supported Operating Systems API
tags:
- name: SupportedOperatingSystems
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.RecoveryServices/vaults/{resourceName}/replicationSupportedOperatingSystems
  : get:
      tags:
      - SupportedOperatingSystems
      summary: Microsoft Azure Gets The Data Of Supported Operating Systems By Srs
      operationId: microsoftAzureSupportedoperatingsystemsGet
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/SubscriptionId'
      - name: instanceType
        in: query
        description: The instance type.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedOperatingSystems'
      x-ms-examples:
        Gets the data of supported operating systems by SRS.:
          $ref: ./examples/SupportedOperatingSystems_Get.json
      description: Needs a more full description created.
components:
  parameters:
    ResourceName:
      name: resourceName
      in: path
      description: The name of the recovery services vault.
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    ResourceGroupName:
      name: resourceGroupName
      in: path
      description: The name of the resource group where the recovery services vault is present.
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    ApiVersion:
      name: api-version
      in: query
      description: Client Api Version.
      required: true
      schema:
        type: string
    SubscriptionId:
      name: subscriptionId
      in: path
      description: The subscription Id.
      required: true
      schema:
        type: string
  schemas:
    SupportedOSDetails:
      description: Supported operating system details.
      type: object
      properties:
        osName:
          description: The name.
          type: string
        osType:
          description: The type.
          type: string
        osVersions:
          description: The list of version for operating system.
          type: array
          items:
            $ref: '#/components/schemas/OSVersionWrapper'
    SupportedOSProperties:
      description: Supported operating systems properties.
      type: object
      properties:
        supportedOsList:
          description: The supported operating systems property list.
          type: array
          items:
            $ref: '#/components/schemas/SupportedOSProperty'
    SupportedOperatingSystems:
      description: Supported operating systems.
      type: object
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        properties:
          $ref: '#/components/schemas/SupportedOSProperties'
          description: The supported operating systems properties.
    Resource:
      description: Azure resource.
      type: object
      properties:
        id:
          description: Resource Id
          type: string
          readOnly: true
        name:
          description: Resource Name
          type: string
          readOnly: true
        type:
          description: Resource Type
          type: string
          readOnly: true
        location:
          description: Resource Location
          type: string
      x-ms-azure-resource: true
    OSVersionWrapper:
      description: Wrapper model for OSVersion to include version and service pack info.
      type: object
      properties:
        version:
          description: The version.
          type: string
        servicePack:
          description: The service pack.
          type: string
    SupportedOSProperty:
      description: Supported operating systems property.
      type: object
      properties:
        instanceType:
          description: The replication provider type.
          type: string
        supportedOs:
          description: The list of supported operating systems.
          type: array
          items:
            $ref: '#/components/schemas/SupportedOSDetails'
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
