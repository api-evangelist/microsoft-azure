openapi: 3.2.0
info:
  title: Microsoft Azure Purview Distribution Service REST API…
  description: Purview distribution service enables various Azure RPs to fetch the policies and attributes for data governance.
  version: '2023-01-01'
servers:
- url: /pds
security:
- azure_auth:
  - user_impersonation
tags:
- name: DatasourcePreferences
paths:
  /datasource-preferences:
    get:
      tags:
      - DatasourcePreferences
      description: Get Datasource Preferences for given scope.
      operationId: microsoftAzureDatasourcepreferencesList
      parameters:
      - in: query
        name: scope
        description: Id for any resource managed by Purview.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourcePreferencesResponseUpdated'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-ms-examples:
        DatasourcePreferences_List:
          $ref: ./examples/DatasourcePreferences_List.json
      summary: Microsoft Azure Get Datasource Preferences
components:
  schemas:
    ErrorModel:
      description: Default error model.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Error code.
          minLength: 1
          type: string
        message:
          description: Error message.
          minLength: 1
          type: string
        target:
          description: Error description.
          type: string
        details:
          description: Error details.
          type: array
          items:
            $ref: '#/components/schemas/ErrorModel'
    AccountModelBase:
      description: Details of the purview account governing the requested resource.
      type: object
      properties:
        id:
          description: Id of the Purview account.
          type: string
        name:
          description: Name of the Purview account.
          type: string
        location:
          description: Location (Region) of the Purview account.
          type: string
        tenantId:
          description: Tenant Id of the Purview account.
          type: string
        gatewayEndpoint:
          description: Endpoint of the Purview account. This will be used by the RPs to call Purview APIs.
          type: string
    TimeSpan:
      description: This is an ISO8601 time span value.
      type: string
    ErrorResponseModel:
      description: Default error response model.
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorModel'
    DatasourcePreferencesResponseUpdated:
      description: Response model for datasource preference API.
      type: object
      properties:
        value:
          description: Consent details.
          type: array
          items:
            $ref: '#/components/schemas/ConsentServiceModelSimplified'
        accountInfo:
          $ref: '#/components/schemas/AccountModelBase'
        frequency:
          $ref: '#/components/schemas/TimeSpan'
    ConsentServiceModelSimplified:
      description: Consent details.
      type: object
      properties:
        kind:
          description: Consent kind.
          type: string
        status:
          description: Consent status.
          type: string
        excludedScopes:
          description: List of scopes opted out of this consent.
          type: array
          items:
            type: string
  parameters:
    api-version:
      in: query
      name: api-version
      description: The api-version of the service.
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      flows:
        implicit:
          scopes:
            user_impersonation: impersonate your user account
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
      description: Azure Active Directory OAuth2 Flow.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/endpoint'
