components:
  schemas:
    HarvestProductDetail:
      description: Schema of product used during harvesting.
      type: object
      properties:
        productName:
          description: Name of the product.
          maxLength: 100
          minLength: 1
          type: string
        area:
          $ref: '#/components/schemas/Measure'
        totalYield:
          $ref: '#/components/schemas/Measure'
        avgYield:
          $ref: '#/components/schemas/Measure'
        avgMoisture:
          $ref: '#/components/schemas/Measure'
        totalWetMass:
          $ref: '#/components/schemas/Measure'
        avgWetMass:
          $ref: '#/components/schemas/Measure'
    CascadeDeleteJob:
      description: Schema of cascade delete job.
      required:
      - partyId
      - resourceId
      - resourceType
      type: object
      properties:
        partyId:
          description: Party Id.
          minLength: 1
          type: string
        resourceId:
          description: The id of the resource.
          minLength: 1
          type: string
        resourceType:
          description: The type of the resource.
          minLength: 1
          type: string
        id:
          description: Unique job id.
          type: string
          readOnly: true
        status:
          description: 'Status of the job.

            Possible values: ''Waiting'', ''Running'', ''Succeeded'', ''Failed'', ''Cancelled''.'
          enum:
          - Waiting
          - Running
          - Succeeded
          - Failed
          - Cancelled
          type: string
          readOnly: true
          x-ms-enum:
            name: JobStatus
            modelAsString: true
        durationInSeconds:
          format: double
          description: Duration of the job in seconds.
          type: number
          readOnly: true
        message:
          description: Status message to capture more details of the job.
          type: string
          readOnly: true
        errorCode:
          description: Error Code when job failed.
          type: string
          readOnly: true
        createdDateTime:
          format: date-time
          description: 'Job created at dateTime. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        lastActionDateTime:
          format: date-time
          description: 'Job was last acted upon at dateTime. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        startTime:
          format: date-time
          description: 'Job start time when available. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        endTime:
          format: date-time
          description: 'Job end time when available. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
    HarvestDataListResponse:
      description: Paged response contains list of requested objects and a URL link to get the next set of results.
      required:
      - value
      type: object
      properties:
        value:
          description: List of requested objects.
          type: array
          items:
            $ref: '#/components/schemas/HarvestData'
        skipToken:
          description: Token used in retrieving the next page. If null, there are no additional pages.
          type: string
        nextLink:
          description: Continuation link (absolute URI) to the next page of results in the list.
          type: string
    Measure:
      description: Schema for storing measurement reading and unit.
      type: object
      properties:
        unit:
          description: Data unit.
          maxLength: 50
          minLength: 1
          type: string
        value:
          format: double
          description: Data value.
          type: number
    Error:
      description: An error from the Azure AgPlatform service.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Server-defined set of error codes.
          minLength: 1
          type: string
        message:
          description: Human-readable representation of the error.
