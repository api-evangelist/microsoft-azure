components:
  schemas:
    ErrorResponse:
      description: An error response from the Azure AgPlatform service. See https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses for ErrorResponse reference document.
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
        traceId:
          description: Unique trace Id.
          type: string
    Error:
      description: An error from the Azure AgPlatform service.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Server-defined set of error codes.
          minLength: 1
          type: string
        message:
          description: Human-readable representation of the error.
          minLength: 1
          type: string
        target:
          description: Target of the error.
          type: string
        details:
          description: Array of details about specific errors that led to this reported error.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        innererror:
          $ref: '#/components/schemas/InnerError'
    SensorDataModelListResponse:
      description: Paged response contains list of requested objects and a URL link to get the next set of results.
      required:
      - value
      type: object
      properties:
        value:
          description: List of requested objects.
          type: array
          items:
            $ref: '#/components/schemas/SensorDataModel'
        skipToken:
          description: Token used in retrieving the next page. If null, there are no additional pages.
          type: string
        nextLink:
          description: Continuation link (absolute URI) to the next page of results in the list.
          type: string
    SensorDataModel:
      description: SensorModel API model.
      required:
      - measures
      type: object
      properties:
        type:
          description: Type of sensor.
          maxLength: 100
          minLength: 0
          type: string
        manufacturer:
          description: Sensor manufacturer.
          maxLength: 100
          minLength: 0
          type: string
        productCode:
          description: Sensor productCode.
          maxLength: 100
          minLength: 0
          type: string
        measures:
          description: Map of sensor type to sensor measures.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SensorDataModelMeasure'
        sensorPartnerId:
          description: Id of the associated sensor partner.
          type: string
          readOnly: true
        id:
          description: Id of the resource.
          type: string
          readOnly: true
        status:
          description: Status of the resource.
          maxLength: 100
          minLength: 0
          type: string
        createdDateTime:
          format: date-time
          description: 'Date-time when resource was created, sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
          example: '2020-12-31T11:10:21Z'
        modifiedDateTime:
          format: date-time
          description: 'Date-time when resource was last modified, sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
          example: '2020-12-31T11:10:21Z'
        eTag:
          description: The ETag value to implement optimistic concurrency.
          type: string
          readOnly: true
        name:
          description: Name to identify resource.
          maxLength: 100
          minLength: 0
          type: string
        description:
          description: Textual description of the resource.
          maxLength: 500
          minLength: 0
          type: string
        createdBy:
          description: Created by user/tenant id.
          type: string
          readOnly: true
        modifiedBy:
          description: Modified by user/tenant id.
          type: string
          readOnly: true
        properties:
          description: 'A collection of key value pairs that belongs to the resource.

            Each pair must not have a key greater than 50 characters

            and must not have a value greater than 150 characters.

            Note: A maximum of 25 key value pairs can be provided for a resource and

            only string, numeral and datetime (yyyy-MM-ddTHH:mm:ssZ) values are supported.'
          type: object
          additionalProperties: {}
          example:
            key1: value1
            key2: 123.45
    SensorDataModelMeasure:
      description: Sensor model measure details.
      required:
      - dataType
      type: object
      properties:
        description:
          description: Description of sensor measure.
          maxLength: 500
          minLength: 0
          type: string
        dataType:
          description: Sensor measure data type.
          maxLength: 100
          minLength: 2
          enum:
          - Bool
          - Double
          - DateTime
          - Long
          - String
          type: string
          x-ms-enum:
            name: SensorDataType
            modelAsString: true
        type:
          description: Measurement type of sensor data.
          maxLength: 100
          minLength: 0
          type: string
        unit:
          description: Unit of sensor measure.
          maxLength: 100
          minLength: 0
          type: string
        properties:
          description: 'A collection of key value pairs for sensor data model.

            Each pair must not have a key greater than 50 characters

            and must not have a value greater than 150 characters.

            Note: A maximum of 25 key value pairs can be provided for a model and

            only string, numeral and datetime (yyyy-MM-ddTHH:mm:ssZ) values are supported.'
          type: object
          additionalProperties: {}
          x-ms-mutability:
          - read
          - create
          - update
    InnerError:
      description: Inner error containing list of errors.See https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#innererror--object for InnerError reference document.
      type: object
      properties:
        code:
          description: Specific error code than was provided by the containing error.
          type: string
        innererror:
          $ref: '#/components/schemas/InnerError'
