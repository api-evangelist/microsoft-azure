      summary: Microsoft Azure Delete Managedvirtualnetworks Managedvirtualnetworkname Managedprivateendpoints Managedprivateendpointname
  /managedVirtualNetworks/{managedVirtualNetworkName}/managedPrivateEndpoints:
    get:
      tags:
      - ManagedPrivateEndpoints
      operationId: microsoftAzureManagedprivateendpointsList
      description: List Managed Private Endpoints
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ManagedVirtualNetworkNameParameter'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedPrivateEndpointListResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        List managed private endpoints:
          $ref: ./examples/ListManagedPrivateEndpoints.json
      summary: Microsoft Azure Get Managedvirtualnetworks Managedvirtualnetworkname Managedprivateendpoints
components:
  parameters:
    ManagedVirtualNetworkNameParameter:
      name: managedVirtualNetworkName
      in: path
      required: true
      x-ms-client-default: default
      description: Managed virtual network name
      x-ms-parameter-location: method
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The Synapse client API Version.
      schema:
        type: string
    ManagedPrivateEndpointNameParameter:
      name: managedPrivateEndpointName
      in: path
      required: true
      description: Managed private endpoint name
      x-ms-parameter-location: method
      schema:
        type: string
  schemas:
    ManagedPrivateEndpointListResponse:
      description: A list of managed private endpoints
      type: object
      properties:
        value:
          type: array
          description: List of managed private endpoints
          items:
            $ref: '#/components/schemas/ManagedPrivateEndpoint'
        nextLink:
          description: The link to the next page of results, if any remaining results exist.
          type: string
          readOnly: true
    ManagedPrivateEndpointProperties:
      description: Properties of a managed private endpoint
      type: object
      properties:
        privateLinkResourceId:
          description: The ARM resource ID of the resource to which the managed private endpoint is created
          type: string
        groupId:
          description: The groupId to which the managed private endpoint is created
          type: string
        provisioningState:
          description: The managed private endpoint provisioning state
          type: string
          readOnly: true
        connectionState:
          description: The managed private endpoint connection state
          $ref: '#/components/schemas/ManagedPrivateEndpointConnectionState'
        isReserved:
          description: Denotes whether the managed private endpoint is reserved
          type: boolean
          readOnly: true
    ManagedPrivateEndpoint:
      description: Managed private endpoint
      type: object
      properties:
        id:
          readOnly: true
          type: string
          description: Fully qualified resource Id for the resource. Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
        name:
          readOnly: true
          type: string
          description: The name of the resource
        type:
          readOnly: true
          type: string
          description: The type of the resource. Ex- Microsoft.Compute/virtualMachines or Microsoft.Storage/storageAccounts.
        properties:
          $ref: '#/components/schemas/ManagedPrivateEndpointProperties'
          description: Managed private endpoint properties
    ManagedPrivateEndpointConnectionState:
      description: The connection state of a managed private endpoint
      type: object
      properties:
        status:
          description: The approval status
          type: string
          readOnly: true
        description:
          description: The managed private endpoint description
          type: string
        actionsRequired:
          description: The actions required on the managed private endpoint
          type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
