      operationId: microsoftAzureManagedprivateendpointsGet
      description: Get Managed Private Endpoints
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ManagedVirtualNetworkNameParameter'
      - $ref: '#/components/parameters/ManagedPrivateEndpointNameParameter'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedPrivateEndpoint'
      x-ms-examples:
        Get a managed private endpoint:
          $ref: ./examples/GetManagedPrivateEndpoint.json
      summary: Microsoft Azure Get Managedvirtualnetworks Managedvirtualnetworkname Managedprivateendpoints Managedprivateendpointname
    put:
      tags:
      - ManagedPrivateEndpoints
      operationId: microsoftAzureManagedprivateendpointsCreate
      description: Create Managed Private Endpoints
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ManagedVirtualNetworkNameParameter'
      - $ref: '#/components/parameters/ManagedPrivateEndpointNameParameter'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedPrivateEndpoint'
      x-ms-examples:
        Create a managed private endpoint:
          $ref: ./examples/CreateManagedPrivateEndpoint.json
      summary: Microsoft Azure Put Managedvirtualnetworks Managedvirtualnetworkname Managedprivateendpoints Managedprivateendpointname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedPrivateEndpoint'
        description: Managed private endpoint properties.
        required: true
    delete:
      tags:
      - ManagedPrivateEndpoints
      operationId: microsoftAzureManagedprivateendpointsDelete
      description: Delete Managed Private Endpoints
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ManagedVirtualNetworkNameParameter'
