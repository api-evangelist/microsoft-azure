      tags:
      - Threads
      summary: Microsoft Azure Gets Chat Message Read Receipts For A Thread
      operationId: microsoftAzureChatthreadListchatreadreceipts
      parameters:
      - in: path
        name: chatThreadId
        description: Thread id to get the chat message read receipts for.
        required: true
        schema:
          type: string
      - in: query
        name: maxPageSize
        description: The maximum number of chat message read receipts to be returned per page.
        schema:
          type: integer
          format: int32
      - in: query
        name: skip
        description: Skips chat message read receipts up to a specified position in response.
        schema:
          type: integer
          format: int32
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. The action returns the requested `ChatMessageReadReceipt` resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageReadReceiptsCollection'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-examples:
        Get thread read receipts with pagination (max page size):
          $ref: ./examples/Conversations_ListChatReadReceiptsWithPageSize.json
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
      description: Needs a more full description created.
    post:
      tags:
      - Threads
      summary: Microsoft Azure Sends A Read Receipt Event To A Thread, On Behalf Of A User
      operationId: microsoftAzureChatthreadSendchatreadreceipt
      parameters:
      - in: path
        name: chatThreadId
        description: Thread id to send the read receipt event to.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful.
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
