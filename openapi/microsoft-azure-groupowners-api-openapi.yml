openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Group Owners API
tags:
- name: GroupOwners
paths:
  /{tenantID}/groups/{objectId}/owners:
    get:
      tags:
      - GroupOwners
      operationId: microsoftAzureGroupsListowners
      summary: Microsoft Azure Directory Objects That Are Owners Of The Group
      description: The owners are a set of non-admin users who are allowed to modify this object.
      parameters:
      - name: objectId
        in: path
        required: true
        description: The object ID of the group for which to get owners.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/tenantIDInPath'
      responses:
        '200':
          description: OK. The operation was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryObjectListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphError'
      x-ms-pageable:
        nextLinkName: odata.nextLink
components:
  schemas:
    OdataError:
