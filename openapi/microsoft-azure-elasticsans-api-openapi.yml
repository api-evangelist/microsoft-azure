paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.ElasticSan/elasticSans:
    get:
      tags:
      - ElasticSans
      operationId: microsoftAzureElasticsansListbysubscription
      description: Gets a list of ElasticSans in a subscription
      parameters:
