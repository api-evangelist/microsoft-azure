          content:
            application/json:
              schema:
                $ref: ../../preview/2022-04-01-preview/databricks.json#/definitions/ErrorResponse
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Databricks Accessconnectors
  /subscriptions/{subscriptionId}/providers/Microsoft.Databricks/accessConnectors:
    get:
      tags:
      - AccessConnector
      operationId: microsoftAzureAccessconnectorsListbysubscription
      description: Gets all the azure databricks accessConnectors within a subscription.
