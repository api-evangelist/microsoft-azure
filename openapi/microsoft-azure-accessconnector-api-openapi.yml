      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Subscriptions Subscriptionid Providers Microsoft Databricks Accessconnectors
components:
  schemas:
    AccessConnectorProperties:
      type: object
      properties:
        provisioningState:
          description: Provisioning status of the accessConnector.
          readOnly: true
          enum:
          - Deleted
          - Failed
          - Succeeded
          type: string
          x-ms-enum:
            name: ProvisioningState
            modelAsString: true
    AccessConnector:
      type: object
      properties:
        identity:
          $ref: ../../../../../common-types/resource-management/v3/managedidentity.json#/definitions/ManagedServiceIdentity
        systemData:
          description: The system metadata relating to this resource
          $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/systemData
        properties:
          description: Azure Databricks accessConnector properties
          $ref: '#/components/schemas/AccessConnectorProperties'
      allOf:
      - $ref: ../../preview/2022-04-01-preview/databricks.json#/definitions/TrackedResource
      description: Information about azure databricks accessConnector.
    AccessConnectorListResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/AccessConnector'
          description: The array of azure databricks accessConnector.
        nextLink:
          type: string
          description: The URL to use for getting the next set of results.
      description: List of azure databricks accessConnector.
    AccessConnectorUpdate:
      description: An update to an azure databricks accessConnector.
      type: object
      properties:
        tags:
          description: Resource tags.
          type: object
          additionalProperties:
            type: string
        identity:
          $ref: ../../../../../common-types/resource-management/v3/managedidentity.json#/definitions/ManagedServiceIdentity
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to use for this operation.
      schema:
        type: string
    ConnectorName:
      name: connectorName
      in: path
      required: true
      description: The name of the azure databricks accessConnector.
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 64
        minLength: 3
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The ID of the target subscription.
      schema:
        type: string
    ResourceGroupName:
      name: resourceGroupName
      in: path
      required: true
      description: The name of the resource group. The name is case insensitive.
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 90
        minLength: 1
        pattern: ^[-\w\._\(\)]+$
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
