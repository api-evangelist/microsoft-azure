openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient Access Connector API
tags:
- name: AccessConnector
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Databricks/accessConnectors/{connectorName}
  : get:
      tags:
      - AccessConnector
      operationId: microsoftAzureAccessconnectorsGet
      description: Gets an azure databricks accessConnector.
      x-ms-examples:
        Get an azure databricks accessConnector:
          $ref: ./examples/AccessConnectorGet.json
      parameters:
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/ConnectorName'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: OK - Returns the accessConnector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessConnector'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../preview/2022-04-01-preview/databricks.json#/definitions/ErrorResponse
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Databricks Accessconnectors Connectorname
    delete:
      tags:
      - AccessConnector
      operationId: microsoftAzureAccessconnectorsDelete
      description: Deletes the azure databricks accessConnector.
      x-ms-examples:
        Delete an azure databricks accessConnector:
          $ref: ./examples/AccessConnectorDelete.json
      parameters:
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/ConnectorName'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: OK. The request has succeeded.
        '202':
          description: Accepted - Returns this status until the asynchronous operation has completed.
        '204':
          description: NoContent
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../preview/2022-04-01-preview/databricks.json#/definitions/ErrorResponse
      x-ms-long-running-operation: true
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Databricks Accessconnectors Connectorname
    put:
      tags:
      - AccessConnector
      operationId: microsoftAzureAccessconnectorsCreateorupdate
      description: Creates or updates azure databricks accessConnector.
      x-ms-examples:
        Create an azure databricks accessConnector with SystemAssigned Identity:
          $ref: ./examples/AccessConnectorCreateOrUpdate.json
        Create an azure databricks accessConnector with UserAssigned Identity:
          $ref: ./examples/AccessConnectorCreateOrUpdateWithUserAssigned.json
      parameters:
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/ConnectorName'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Updated - Returns information about the azure databricks accessConnector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessConnector'
        '201':
          description: Created - Returns information about the azure databricks accessConnector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessConnector'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../preview/2022-04-01-preview/databricks.json#/definitions/ErrorResponse
      x-ms-long-running-operation: true
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Databricks Accessconnectors Connectorname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessConnector'
        description: Parameters supplied to the create or update an azure databricks accessConnector.
        required: true
    patch:
      tags:
      - AccessConnector
      operationId: microsoftAzureAccessconnectorsUpdate
      description: Updates an azure databricks accessConnector.
      x-ms-examples:
        Update an azure databricks accessConnector:
          $ref: ./examples/AccessConnectorPatchUpdate.json
      parameters:
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/ConnectorName'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Successfully updated the azure databricks accessConnector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessConnector'
        '202':
          description: Accepted - Returns this status until the asynchronous operation has completed.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../preview/2022-04-01-preview/databricks.json#/definitions/ErrorResponse
      x-ms-long-running-operation: true
      summary: Microsoft Azure Patch Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Databricks Accessconnectors Connectorname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessConnectorUpdate'
        description: The update to the azure databricks accessConnector.
        required: true
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Databricks/accessConnectors:
    get:
      tags:
      - AccessConnector
      operationId: microsoftAzureAccessconnectorsListbyresourcegroup
      description: Gets all the azure databricks accessConnectors within a resource group.
      x-ms-examples:
