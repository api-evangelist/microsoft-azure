openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Backup Schedules API
tags:
- name: BackupSchedules
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.StorSimple/managers/{managerName}/devices/{deviceName}/backupPolicies/{backupPolicyName}/schedules
  : get:
      tags:
      - BackupSchedules
      description: Gets all the backup schedules in a backup policy.
      operationId: microsoftAzureBackupschedulesListbybackuppolicy
      parameters:
      - $ref: '#/components/parameters/deviceNameParameter'
      - name: backupPolicyName
        in: path
        description: The backup policy name.
        required: true
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/managerNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: The collection of backup schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupScheduleList'
      deprecated: false
      x-ms-pageable:
        nextLinkName: null
      x-ms-examples:
        BackupSchedulesListByBackupPolicy:
          $ref: ./examples/BackupSchedulesListByBackupPolicy.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Storsimple Managers Managername Devices Devicename Backuppolicies Backuppolicyname Schedules
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.StorSimple/managers/{managerName}/devices/{deviceName}/backupPolicies/{backupPolicyName}/schedules/{backupScheduleName}
  : get:
      tags:
      - BackupSchedules
      description: Gets the properties of the specified backup schedule name.
      operationId: microsoftAzureBackupschedulesGet
      parameters:
      - $ref: '#/components/parameters/deviceNameParameter'
      - name: backupPolicyName
        in: path
        description: The backup policy name.
        required: true
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - name: backupScheduleName
        in: path
        description: The name of the backup schedule to be fetched
        required: true
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/managerNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: The backup schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupSchedule'
      deprecated: false
      x-ms-examples:
        BackupSchedulesGet:
          $ref: ./examples/BackupSchedulesGet.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Storsimple Managers Managername Devices Devicename Backuppolicies Backuppolicyname Schedules Backupschedulename
    put:
      tags:
      - BackupSchedules
      description: Creates or updates the backup schedule.
      operationId: microsoftAzureBackupschedulesCreateorupdate
      parameters:
      - $ref: '#/components/parameters/deviceNameParameter'
      - name: backupPolicyName
        in: path
        description: The backup policy name.
        required: true
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - name: backupScheduleName
        in: path
        description: The backup schedule name.
        required: true
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/managerNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: Successfully created or updated the backup schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupSchedule'
        '202':
          description: Accepted the request to create or update the backup schedule.
      deprecated: false
      x-ms-long-running-operation: true
      x-ms-examples:
        BackupSchedulesCreateOrUpdate:
          $ref: ./examples/BackupSchedulesCreateOrUpdate.json
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Storsimple Managers Managername Devices Devicename Backuppolicies Backuppolicyname Schedules Backupschedulename
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupSchedule'
        description: The backup schedule.
        required: true
    delete:
      tags:
      - BackupSchedules
      description: Deletes the backup schedule.
      operationId: microsoftAzureBackupschedulesDelete
      parameters:
      - $ref: '#/components/parameters/deviceNameParameter'
      - name: backupPolicyName
        in: path
        description: The backup policy name.
        required: true
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - name: backupScheduleName
        in: path
        description: The name the backup schedule.
        required: true
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/managerNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '202':
          description: Accepted the request to delete the backup schedule.
        '204':
          description: Successfully deleted the backup schedule.
      deprecated: false
      x-ms-long-running-operation: true
      x-ms-examples:
        BackupSchedulesDelete:
          $ref: ./examples/BackupSchedulesDelete.json
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Storsimple Managers Managername Devices Devicename Backuppolicies Backuppolicyname Schedules Backupschedulename
components:
  parameters:
    apiVersionParameter:
      name: api-version
      in: query
      description: The api version
      required: true
      x-ms-skip-url-encoding: true
      schema:
        type: string
    managerNameParameter:
      name: managerName
      in: path
      description: The manager name
      required: true
      x-ms-parameter-location: method
      x-ms-skip-url-encoding: true
      schema:
        type: string
        maxLength: 50
        minLength: 2
    deviceNameParameter:
      name: deviceName
      in: path
      description: The device name
      required: true
      x-ms-parameter-location: method
      x-ms-skip-url-encoding: true
      schema:
        type: string
    resourceGroupNameParameter:
      name: resourceGroupName
      in: path
      description: The resource group name
      required: true
      x-ms-parameter-location: method
      x-ms-skip-url-encoding: true
      schema:
        type: string
    subscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The subscription id
      required: true
      x-ms-skip-url-encoding: true
      schema:
        type: string
  schemas:
    BackupScheduleList:
      description: The backup schedule list.
      required:
      - value
      type: object
      properties:
        value:
          description: The value.
          type: array
          items:
            $ref: '#/components/schemas/BackupSchedule'
    BackupScheduleProperties:
      description: The properties of the backup schedule.
      required:
      - scheduleRecurrence
      - backupType
      - retentionCount
      - startTime
      - scheduleStatus
      type: object
      properties:
        scheduleRecurrence:
          $ref: '#/components/schemas/ScheduleRecurrence'
          description: The schedule recurrence.
        backupType:
          description: The type of backup which needs to be taken.
          enum:
          - LocalSnapshot
          - CloudSnapshot
          type: string
          x-ms-enum:
            name: BackupType
            modelAsString: false
        retentionCount:
          format: int64
          description: The number of backups to be retained.
          type: integer
        startTime:
          format: date-time
          description: The start time of the schedule.
          type: string
        scheduleStatus:
          description: The schedule status.
          enum:
          - Enabled
          - Disabled
          type: string
          x-ms-enum:
            name: ScheduleStatus
            modelAsString: false
        lastSuccessfulRun:
          format: date-time
          description: The last successful backup run which was triggered for the schedule.
          type: string
          readOnly: true
    BackupSchedule:
      description: The backup schedule.
      required:
      - properties
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseModel'
      properties:
        properties:
          $ref: '#/components/schemas/BackupScheduleProperties'
          description: The properties of the backup schedule.
          x-ms-client-flatten: true
    ScheduleRecurrence:
      description: The schedule recurrence.
      required:
      - recurrenceType
      - recurrenceValue
      type: object
      properties:
        recurrenceType:
          description: The recurrence type.
          enum:
          - Minutes
          - Hourly
          - Daily
          - Weekly
          type: string
          x-ms-enum:
            name: RecurrenceType
            modelAsString: false
        recurrenceValue:
          format: int32
          description: The recurrence value.
          type: integer
        weeklyDaysList:
          description: The week days list. Applicable only for schedules of recurrence type 'weekly'.
          type: array
          items:
            enum:
            - Sunday
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            type: string
            x-ms-enum:
              name: DayOfWeek
              modelAsString: false
    BaseModel:
      description: Represents the base class for all other ARM object models
      type: object
      properties:
        id:
          description: The path ID that uniquely identifies the object.
          type: string
          readOnly: true
        name:
          description: The name of the object.
          type: string
          readOnly: true
        type:
          description: The hierarchical type of the object.
          type: string
          readOnly: true
        kind:
          description: The Kind of the object. Currently only Series8000 is supported
          enum:
          - Series8000
          type: string
          x-ms-enum:
            name: Kind
            modelAsString: false
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
