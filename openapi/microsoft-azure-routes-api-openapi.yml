      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Routetables Routetablename Routes Routename
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
        description: Parameters supplied to the create/update route operation
        required: true
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/routeTables/{routeTableName}/routes
  : get:
      tags:
      - Routes
      operationId: microsoftAzureRoutesList
      description: The List network security rule operation retrieves all the routes in a route table.
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group.
        schema:
          type: string
      - name: routeTableName
        in: path
        required: true
        description: The name of the route table.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListResult'
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Routetables Routetablename Routes
components:
  schemas:
    SubResource:
      properties:
        id:
          type: string
          description: Resource Id
      x-ms-azure-resource: true
    RoutePropertiesFormat:
      properties:
        addressPrefix:
          type: string
          description: Gets or sets the destination CIDR to which the route applies.
        nextHopType:
          type: string
          description: Gets or sets the type of Azure hop the packet should be sent to.
          enum:
          - VirtualNetworkGateway
          - VnetLocal
          - Internet
          - VirtualAppliance
          - None
          x-ms-enum:
            name: RouteNextHopType
            modelAsString: true
        nextHopIpAddress:
          type: string
          description: Gets or sets the IP address packets should be forwarded to. Next hop values are only allowed in routes where the next hop type is VirtualAppliance.
        provisioningState:
          type: string
          description: Gets or sets Provisioning state of the resource Updating/Deleting/Failed
      required:
      - nextHopType
      description: Route resource
    RouteListResult:
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/Route'
          description: Gets List of Routes in a resource group
        nextLink:
          type: string
          description: Gets the URL to get the next set of results.
      description: Response for ListRoute Api service call
    Route:
      properties:
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/RoutePropertiesFormat'
        name:
          type: string
          description: Gets name of the resource that is unique within a resource group. This name can be used to access the resource
        etag:
          type: string
          description: A unique read-only string that changes whenever the resource is updated
      allOf:
      - $ref: '#/components/schemas/SubResource'
      description: Route resource
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: Client Api Version.
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: Gets subscription credentials which uniquely identify Microsoft Azure subscription. The subscription ID forms part of the URI for every service call.
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
