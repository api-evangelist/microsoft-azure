openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Routes API
tags:
- name: Routes
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/routeTables/{routeTableName}/routes/{routeName}
  : delete:
      tags:
      - Routes
      operationId: microsoftAzureRoutesDelete
      description: The delete route operation deletes the specified route from a route table.
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group.
        schema:
          type: string
      - name: routeTableName
        in: path
        required: true
        description: The name of the route table.
        schema:
          type: string
      - name: routeName
        in: path
        required: true
        description: The name of the route.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: ''
        '202':
          description: ''
        '204':
          description: ''
      x-ms-long-running-operation: true
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Routetables Routetablename Routes Routename
    get:
      tags:
      - Routes
      operationId: microsoftAzureRoutesGet
      description: The Get route operation retrieves information about the specified route from the route table.
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group.
        schema:
          type: string
      - name: routeTableName
        in: path
        required: true
        description: The name of the route table.
        schema:
          type: string
      - name: routeName
        in: path
        required: true
        description: The name of the route.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Routetables Routetablename Routes Routename
    put:
      tags:
      - Routes
      operationId: microsoftAzureRoutesCreateorupdate
      description: The Put route operation creates/updates a route in the specified route table
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group.
        schema:
          type: string
      - name: routeTableName
        in: path
        required: true
        description: The name of the route table.
        schema:
          type: string
      - name: routeName
        in: path
        required: true
        description: The name of the route.
        schema:
