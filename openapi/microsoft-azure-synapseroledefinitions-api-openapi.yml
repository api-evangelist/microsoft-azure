openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient Synapse Role…
tags:
- name: SynapseRoleDefinitions
paths:
  /roleDefinitions:
    get:
      tags:
      - SynapseRoleDefinitions
      operationId: microsoftAzureRoledefinitionsListroledefinitions
      description: List role definitions.
      x-ms-examples:
        List role definitions:
          $ref: ./examples/RoleDefinitions_ListRoleDefinitions.json
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/IsBuiltInParameter'
      - $ref: '#/components/parameters/ScopeParameter'
      responses:
        '200':
          description: Success response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionsListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionsListResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ./roleAssignments.json#/definitions/ErrorContract
            text/json:
              schema:
                $ref: ./roleAssignments.json#/definitions/ErrorContract
      summary: Microsoft Azure Get Roledefinitions
  /roleDefinitions/{roleDefinitionId}:
    get:
      tags:
      - SynapseRoleDefinitions
      operationId: microsoftAzureRoledefinitionsGetroledefinitionbyid
      description: Get role definition by role definition Id.
      x-ms-examples:
        Get role definition information:
          $ref: ./examples/RoleDefinitions_GetRoleDefinitionById.json
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/RoleDefinitionIdParameter'
      responses:
        '200':
          description: Success response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SynapseRoleDefinition'
            text/json:
              schema:
                $ref: '#/components/schemas/SynapseRoleDefinition'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ./roleAssignments.json#/definitions/ErrorContract
            text/json:
              schema:
                $ref: ./roleAssignments.json#/definitions/ErrorContract
      summary: Microsoft Azure Get Roledefinitions Roledefinitionid
components:
  schemas:
    SynapseRoleDefinition:
      description: Synapse role definition details
      type: object
      properties:
        id:
          description: Role Definition ID
          format: uuid
          type: string
        name:
          description: Name of the Synapse role
          type: string
        isBuiltIn:
          description: Is a built-in role or not
          type: boolean
        description:
          description: Description for the Synapse role
          type: string
        permissions:
          description: Permissions for the Synapse role
          type: array
          items:
            $ref: '#/components/schemas/SynapseRbacPermission'
        scopes:
          description: Allowed scopes for the Synapse role
          type: array
          items:
            type: string
        availabilityStatus:
          description: Availability of the Synapse role
          type: string
    RoleDefinitionsListResponse:
      description: A list of Synapse roles available.
      type: array
      items:
        $ref: '#/components/schemas/SynapseRoleDefinition'
    SynapseRbacPermission:
      description: Synapse role definition details
      type: object
      properties:
        actions:
          description: List of actions
          type: array
          items:
            type: string
        notActions:
          description: List of Not actions
          type: array
          items:
            type: string
        dataActions:
          description: List of data actions
          type: array
          items:
            type: string
        notDataActions:
          description: List of Not data actions
          type: array
          items:
            type: string
  parameters:
    ScopeParameter:
      name: scope
      in: query
      required: false
      description: Scope of the Synapse Built-in Role.
      x-ms-parameter-location: method
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The Synapse client API Version.
      schema:
        type: string
    RoleDefinitionIdParameter:
      name: roleDefinitionId
      in: path
      required: true
      description: Synapse Built-In Role Definition Id.
      x-ms-parameter-location: method
      schema:
        type: string
    IsBuiltInParameter:
      name: isBuiltIn
      in: query
      required: false
      description: Is a Synapse Built-In Role or not.
      x-ms-parameter-location: method
      schema:
        type: boolean
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
