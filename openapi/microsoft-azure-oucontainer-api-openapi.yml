components:
  parameters:
    OuContainerNameParameter:
      name: ouContainerName
      in: path
      required: true
      description: The name of the OuContainer.
      x-ms-parameter-location: method
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: Client Api Version.
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: Gets subscription credentials which uniquely identify the Microsoft Azure subscription. The subscription ID forms part of the URI for every service call.
      schema:
        type: string
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      description: The name of the resource group within the user's subscription. The name is case insensitive.
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 90
        minLength: 1
        pattern: ^[-\w\._\(\)]+$
    DomainServiceNameParameter:
      name: domainServiceName
      in: path
      required: true
      description: The name of the domain service.
      x-ms-parameter-location: method
      schema:
        type: string
  schemas:
    OperationEntityListResult:
      description: The list of domain service operation response.
      type: object
      properties:
        value:
          description: The list of operations.
          type: array
          items:
            $ref: '#/components/schemas/OperationEntity'
        nextLink:
          type: string
          description: The continuation token for the next page of results.
          readOnly: true
    OperationEntity:
      description: The operation supported by Domain Services.
      type: object
      properties:
        name:
          description: 'Operation name: {provider}/{resource}/{operation}.'
          type: string
        display:
          $ref: '#/components/schemas/OperationDisplayInfo'
          description: The operation supported by Domain Services.
        origin:
          description: The origin of the operation.
          type: string
    OuContainerProperties:
      description: Properties of the OuContainer.
      type: object
      properties:
        tenantId:
          readOnly: true
          type: string
          description: Azure Active Directory tenant id
        domainName:
          readOnly: true
          type: string
          description: The domain name of Domain Services.
        deploymentId:
          readOnly: true
          type: string
          description: The Deployment id
        containerId:
          readOnly: true
          type: string
          description: The OuContainer name
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/ContainerAccount'
            description: Container Account
          description: The list of container accounts
        serviceStatus:
          readOnly: true
          type: string
          description: Status of OuContainer instance
        distinguishedName:
          readOnly: true
          type: string
          description: Distinguished Name of OuContainer instance
        provisioningState:
          readOnly: true
          type: string
          description: The current deployment or provisioning state, which only appears in the response.
    ContainerAccount:
      description: Container Account Description
      type: object
      properties:
        accountName:
          type: string
          description: The account name
        spn:
          type: string
          description: The account spn
        password:
          type: string
          description: The account password
    Resource:
      description: The Resource model definition.
      type: object
      properties:
        id:
          readOnly: true
          type: string
          description: Resource Id
        name:
          readOnly: true
          type: string
          description: Resource name
        type:
          readOnly: true
          type: string
          description: Resource type
        location:
          type: string
          description: Resource location
          x-ms-mutability:
          - read
          - create
        tags:
          type: object
          additionalProperties:
            type: string
          description: Resource tags
        etag:
          type: string
          description: Resource etag
        systemData:
          readOnly: true
          description: The system meta data relating to this resource.
          $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/systemData
      x-ms-azure-resource: true
    OperationDisplayInfo:
      description: The operation supported by Domain Services.
      type: object
      properties:
        description:
          description: The description of the operation.
          type: string
        operation:
          description: The action that users can perform, based on their permission level.
          type: string
        provider:
          description: 'Service provider: Domain Services.'
          type: string
        resource:
          description: Resource on which the operation is performed.
          type: string
    OuContainer:
      description: Resource for OuContainer.
      type: object
      properties:
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/OuContainerProperties'
          description: OuContainer properties
      allOf:
      - $ref: '#/components/schemas/Resource'
    OuContainerListResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/OuContainer'
          description: The list of OuContainer.
        nextLink:
          type: string
          description: The continuation token for the next page of results.
          readOnly: true
      description: The response from the List OuContainer operation.
