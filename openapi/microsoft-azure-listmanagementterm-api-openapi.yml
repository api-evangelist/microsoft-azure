openapi: 3.2.0
info:
  title: Microsoft Azure Content Moderator Client List Management…
  version: '1.0'
  description: You use the API to scan your content as it's generated.
security:
- apim_key: []
tags:
- name: ListManagementTerm
paths:
  /contentmoderator/lists/v1.0/termlists/{listId}/terms/{term}:
    post:
      tags:
      - ListManagementTerm
      operationId: microsoftAzureListmanagementtermAddterm
      description: Adds a term to the term list with listId equal to the passed list ID.
      parameters:
      - $ref: '#/components/parameters/listId'
      - $ref: '#/components/parameters/term'
      - $ref: '#/components/parameters/language'
      responses:
        '201':
          description: Created.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Add Term request:
          $ref: ../v1.0/examples/AddTermResource.JSON
      summary: Microsoft Azure Post Contentmoderator Lists 0 Termlists Listid Terms Term
    delete:
      tags:
      - ListManagementTerm
      operationId: microsoftAzureListmanagementtermDeleteterm
      description: Deletes a term from the list with listId equal to the passed list ID.
      parameters:
      - $ref: '#/components/parameters/listId'
      - $ref: '#/components/parameters/term'
      - $ref: '#/components/parameters/language'
      responses:
        '204':
          description: No content.
          content:
            application/json:
              schema:
                type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Delete Term request:
          $ref: ../v1.0/examples/DeleteTermResource.JSON
      summary: Microsoft Azure Delete Contentmoderator Lists 0 Termlists Listid Terms Term
  /contentmoderator/lists/v1.0/termlists/{listId}/terms:
    get:
      tags:
      - ListManagementTerm
      operationId: microsoftAzureListmanagementtermGetallterms
      description: Gets all terms from the list with listId equal to the passed list ID.
      parameters:
      - $ref: '#/components/parameters/listId'
      - $ref: '#/components/parameters/language'
      - name: offset
        in: query
        description: Pagination start index.
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terms'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Get All Terms request:
          $ref: ../v1.0/examples/GetAllTermsResource.JSON
      summary: Microsoft Azure Get Contentmoderator Lists 0 Termlists Listid Terms
    delete:
      tags:
      - ListManagementTerm
      operationId: microsoftAzureListmanagementtermDeleteallterms
      description: Deletes all terms from the list with listId equal to the passed list ID.
      parameters:
      - $ref: '#/components/parameters/listId'
      - $ref: '#/components/parameters/language'
      responses:
        '204':
          description: No content.
          content:
            application/json:
              schema:
                type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Delete AllTerms request:
          $ref: ../v1.0/examples/DeleteAllTermsResource.JSON
      summary: Microsoft Azure Delete Contentmoderator Lists 0 Termlists Listid Terms
components:
  parameters:
    term:
      name: term
      in: path
      description: Term to be deleted
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    listId:
      name: listId
      in: path
      description: List ID of the image list.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    language:
      name: language
      in: query
      description: Language of the terms.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
  schemas:
    APIError:
      type: object
      description: Error information that the API returns.
      properties:
        Error:
          $ref: '#/components/schemas/Error'
    TermsInList:
      description: Terms in the passed list ID.
      properties:
        Term:
          description: Added term details.
          type: string
    Status:
      description: Status properties.
      properties:
        Code:
          description: Status code.
          type: integer
        Description:
          description: Status description.
          type: string
        Exception:
          description: Exception status.
          type: string
    Terms:
      description: Term properties.
      properties:
        Data:
          description: Term data details.
          $ref: '#/components/schemas/TermsData'
        Paging:
          description: Paging details.
          properties:
            Total:
              description: Total details.
              type: integer
            Limit:
              description: Limit details.
              type: integer
            Offset:
              description: Offset details.
              type: integer
            Returned:
              description: Returned text details.
              type: integer
    TermsData:
      description: All term ID response properties.
      properties:
        Language:
          description: Language of the terms.
          type: string
        Terms:
          description: List of terms.
          type: array
          items:
            $ref: '#/components/schemas/TermsInList'
        Status:
          description: Term status.
          type: object
          $ref: '#/components/schemas/Status'
        TrackingId:
          description: Tracking ID.
          type: string
    Error:
      type: object
      description: Error body.
      properties:
        Code:
          type: string
        Message:
          type: string
  securitySchemes:
    apim_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
x-ms-parameterized-host:
  hostTemplate: '{Endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
x-ms-paths:
  /contentmoderator/moderate/v1.0/ProcessImage/FindFaces?overload=stream:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_FindFacesFileInput
      description: Returns the list of faces found.
      parameters:
      - $ref: '#/components/parameters/CacheImage'
      - $ref: '#/components/parameters/ImageStreamParameter'
      consumes:
      - image/gif
      - image/jpeg
      - image/png
      - image/bmp
      - image/tiff
      responses:
        '200':
          description: List of faces found.
          schema:
            $ref: '#/components/schemas/FoundFaces'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      produces:
      - application/json
  /contentmoderator/moderate/v1.0/ProcessImage/FindFaces?overload=url:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_FindFacesUrlInput
      description: Returns the list of faces found.
      parameters:
      - $ref: '#/components/parameters/CacheImage'
      - name: Content-Type
        description: Content type.
        required: true
        type: string
        in: header
      - $ref: '#/components/parameters/ImageUrlParameter'
      consumes:
      - application/json
      responses:
        '200':
          description: List of faces found.
          schema:
            $ref: '#/components/schemas/FoundFaces'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Find Faces request:
          $ref: ./examples/FindFacesResource.JSON
      produces:
      - application/json
  /contentmoderator/moderate/v1.0/ProcessImage/OCR?overload=url:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_OCRUrlInput
      description: Returns any text found in the image for the specified language. If no language is specified in the input, the detection defaults to English.
      parameters:
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/CacheImage'
      - $ref: '#/components/parameters/enhanced'
      - name: Content-Type
        description: Content type.
        required: true
        type: string
        in: header
      - $ref: '#/components/parameters/ImageUrlParameter'
      consumes:
      - application/json
      responses:
        '200':
          description: Found text and list of candidate text.
          schema:
            $ref: '#/components/schemas/OCR'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Image OCR request:
          $ref: ../v1.0/examples/OCRResource.JSON
      produces:
      - application/json
  /contentmoderator/moderate/v1.0/ProcessImage/OCR?overload=stream:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_OCRFileInput
      description: Returns any text found in the image for the specified language. If no language is specified in the input, the detection defaults to English.
      parameters:
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/CacheImage'
      - $ref: '#/components/parameters/enhanced'
      - $ref: '#/components/parameters/ImageStreamParameter'
      consumes:
      - image/gif
      - image/jpeg
      - image/png
      - image/bmp
      - image/tiff
      responses:
        '200':
          description: Found text and list of candidate text.
          schema:
            $ref: '#/components/schemas/OCR'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      produces:
      - application/json
  /contentmoderator/moderate/v1.0/ProcessImage/Evaluate?overload=stream:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_EvaluateFileInput
      description: Returns probabilities of the image containing racy or adult content.
      parameters:
      - $ref: '#/components/parameters/CacheImage'
      - $ref: '#/components/parameters/ImageStreamParameter'
      consumes:
      - image/gif
      - image/jpeg
      - image/png
      - image/bmp
      - image/tiff
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/components/schemas/Evaluate'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      produces:
      - application/json
  /contentmoderator/moderate/v1.0/ProcessImage/Evaluate?overload=url:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_EvaluateUrlInput
      description: Returns probabilities of the image containing racy or adult content.
      parameters:
      - $ref: '#/components/parameters/CacheImage'
      - name: Content-Type
        description: Content type.
        required: true
        type: string
        in: header
      - $ref: '#/components/parameters/ImageUrlParameter'
      consumes:
      - application/json
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/components/schemas/Evaluate'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Evaluate Image request:
          $ref: ./examples/EvaluateImageResource.JSON
      produces:
      - application/json
  /contentmoderator/moderate/v1.0/ProcessImage/Match?overload=url:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_MatchUrlInput
      description: "Fuzzily match an image against one of your custom image lists. You can create and manage your custom image lists by using <a href=\"/docs/services/578ff44d2703741568569ab9/operations/578ff7b12703741568569abe\">this API</a>. \n\nReturns the ID and tags of a matching image.<br/>\n<br/>\nNote: You must refresh the index on the corresponding image list to ensure that additions and removals are reflected in the response."
      parameters:
      - $ref: '#/components/parameters/listIdQueryParameter'
      - $ref: '#/components/parameters/CacheImage'
      - name: Content-Type
        description: Content type.
        required: true
        type: string
        in: header
      - $ref: '#/components/parameters/ImageUrlParameter'
      consumes:
      - application/json
      responses:
        '200':
          description: 'Supported values for tags are:

            <ul>

            <li>101: Nudity</li>

            <li>102: Sexual Content</li>

            <li>201: Alcohol</li>

            <li>202: Tobacco</li>

            <li>203: Drugs</li>

            <li>301: Child Exploitation</li>

            <li>401: Violence</li>

            <li>402: Weapons</li>

            <li>403: Gore</li>

            <li>501: Profanity</li>

            <li>502: Vulgarity</li>

            </ul>.'
          schema:
            $ref: '#/components/schemas/MatchResponse'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Match Image request:
          $ref: ../v1.0/examples/MatchImageResource.JSON
      produces:
      - application/json
  /contentmoderator/moderate/v1.0/ProcessImage/Match?overload=stream:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_MatchFileInput
      description: "Fuzzily match an image against one of your custom image lists. You can create and manage your custom image lists by using <a href=\"/docs/services/578ff44d2703741568569ab9/operations/578ff7b12703741568569abe\">this API</a>. \n\nReturns the ID and tags of a matching image.<br/>\n<br/>\nNote: You must refresh the index on the corresponding image list to ensure that additions and removals are reflected in the response."
      parameters:
      - $ref: '#/components/parameters/listIdQueryParameter'
      - $ref: '#/components/parameters/CacheImage'
      - $ref: '#/components/parameters/ImageStreamParameter'
      consumes:
      - image/gif
      - image/jpeg
      - image/png
      - image/bmp
      - image/tiff
      responses:
        '200':
          description: 'Supported values for tags are:

            <ul>

            <li>101: Nudity</li>

            <li>102: Sexual Content</li>

            <li>201: Alcohol</li>

            <li>202: Tobacco</li>

            <li>203: Drugs</li>

            <li>301: Child Exploitation</li>

            <li>401: Violence</li>

            <li>402: Weapons</li>

            <li>403: Gore</li>

            <li>501: Profanity</li>

            <li>502: Vulgarity</li>

            </ul>.'
          schema:
            $ref: '#/components/schemas/MatchResponse'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      produces:
      - application/json
  /contentmoderator/lists/v1.0/imagelists/{listId}/images?overload=url:
    post:
      tags:
      - ListManagementImage
      operationId: ListManagementImage_AddImageUrlInput
      description: Add an image to the list with listId equal to the passed list ID.
      parameters:
      - $ref: '#/components/parameters/listId'
      - $ref: '#/components/parameters/tag'
      - $ref: '#/components/parameters/label'
      - name: Content-Type
        description: Content type.
        required: true
        type: string
        in: header
      - $ref: '#/components/parameters/ImageUrlParameter'
      consumes:
      - application/json
      responses:
        '200':
          description: OK.
          schema:
            $ref: '#/components/schemas/Image'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Add Image request:
          $ref: ./examples/AddImageResource.JSON
      produces:
      - application/json
  /contentmoderator/lists/v1.0/imagelists/{listId}/images?overload=stream:
    post:
      tags:
      - ListManagementImage
      operationId: ListManagementImage_AddImageFileInput
      description: Add an image to the list with listId equal to the passed list ID.
      parameters:
      - $ref: '#/components/parameters/listId'
      - $ref: '#/components/parameters/tag'
      - $ref: '#/components/parameters/label'
      - $ref: '#/components/parameters/ImageStreamParameter'
      consumes:
      - image/gif
      - image/jpeg
      - image/png
      - image/bmp
      - image/tiff
      responses:
        '200':
          description: OK.
          schema:
            $ref: '#/components/schemas/Image'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      produces:
      - application/json
  /contentmoderator/review/v1.0/teams/{teamName}/reviews?overload=video:
    post:
      tags:
      - Reviews
      operationId: Reviews_CreateVideoReviews
      description: "The created reviews appear for reviewers on your team. As reviewers finish reviewing, results of the reviews are posted (that is, HTTP POST) on the specified CallBackEndpoint value.\n\n<h3>CallBack Schemas </h3>\n<h4>Review Completion CallBack Sample</h4>\n<p>\n{<br/>\n  \"ReviewId\": \"<Review ID>\",<br/>\n  \"ModifiedOn\": \"2016-10-11T22:36:32.9934851Z\",<br/>\n  \"ModifiedBy\": \"<Name of the reviewer>\",<br/>\n  \"CallBackType\": \"Review\",<br/>\n  \"ContentId\": \"<ContentId that was specified on input>\",<br/>\n  \"Metadata\": {<br/>\n    \"adultscore\": \"0.xxx\",<br/>\n    \"a\": \"False\",<br/>\n    \"racyscore\": \"0.xxx\",<br/>\n    \"r\": \"True\"<br/>\n  },<br/>\n  \"ReviewerResultTags\": {<br/>\n    \"a\": \"False\",<br/>\n    \"r\": \"True\"<br/>\n  }<br/>\n}<br/>\n\n</p>."
      parameters:
      - name: Content-Type
        description: Content type.
        required: true
        type: string
        in: header
      - $ref: '#/components/parameters/teamName'
      - $ref: '#/components/parameters/subTeam'
      - $ref: '#/components/parameters/CreateVideoReviewsBody'
      consumes:
      - application/json
      responses:
        '200':
          description: OK.
          schema:
            $ref: '#/components/schemas/ReviewList'
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Create video review request:
          $ref: ../v1.0/examples/CreateVideoReviewResource.JSON
      produces:
      - application/json
  /contentmoderator/review/v1.0/teams/{teamName}/reviews/{reviewId}/frames?overload=url:
    post:
      tags:
      - Reviews
      operationId: Reviews_AddVideoFrameUrl
      description: Use this method to add frames for a video review. The timescale parameter is a factor that's used to convert the time stamp on a frame into milliseconds. Timescale is provided in the output of the Content Moderator video media processor on the Azure Media Services platform. Timescale in the video moderation output is Ticks/Second.
      parameters:
      - name: Content-Type
        description: Content type.
        required: true
        type: string
        in: header
      - $ref: '#/components/parameters/teamName'
      - $ref: '#/components/parameters/reviewId'
      - $ref: '#/components/parameters/timescale'
      - $ref: '#/components/parameters/videoFrameBody'
      consumes:
      - application/json
      responses:
        '204':
          description: No content.
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      x-ms-examples:
        Add video frame url input request:
          $ref: ./examples/AddFrameResource.JSON
      produces:
      - application/json
  /contentmoderator/review/v1.0/teams/{teamName}/reviews/{reviewId}/frames?overload=stream:
    post:
      tags:
      - Reviews
      operationId: Reviews_AddVideoFrameStream
      description: Use this method to add frames for a video review. The timescale parameter is a factor that's used to convert the timestamp on a frame into milliseconds. Timescale is provided in the output of the Content Moderator video media processor on the Azure Media Services platform. Timescale in the video moderation output is Ticks/Second.
      parameters:
      - name: Content-Type
        description: Content type.
        required: true
        type: string
        in: header
      - name: teamName
        description: Your team name.
        in: path
        required: true
        type: string
      - name: reviewId
        description: ID of the review.
        in: path
        required: true
        type: string
      - name: timescale
        description: Timescale of the video.
        in: query
        required: false
        type: integer
      - name: frameImageZip
        description: Zip file that contains frame images.
        in: formData
        required: true
        type: string
        format: binary
      - name: frameMetadata
        description: Metadata of the frame.
        in: formData
        required: true
        type: string
      consumes:
      - multipart/form-data
      responses:
        '204':
          description: No content.
        default:
          description: Error response.
          schema:
            $ref: '#/components/schemas/APIError'
      produces:
      - application/json
