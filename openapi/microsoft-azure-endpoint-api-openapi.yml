components:
  schemas:
    ThrottlingRule:
      type: object
      properties:
        key:
          type: string
        renewalPeriod:
          type: number
        count:
          type: number
        minCount:
          type: number
        dynamicThrottlingEnabled:
          type: boolean
        matchPatterns:
          type: array
          items:
            $ref: '#/components/schemas/RequestMatchPattern'
          x-ms-identifiers:
          - path
          - method
    EndpointResourcePropertiesBasicResource:
      required:
      - properties
      type: object
      allOf:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/Resource
      properties:
        properties:
          $ref: '#/components/schemas/EndpointResourceProperties'
    Error:
      description: Top-level error follows Microsoft Azure REST API Guidelines which is available at https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md#handling-errors. This contains an top-level error with error code, message, details, target and an inner error with more descriptive details.
      required:
      - code
      - message
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        target:
          description: The source of the error. For example it would be "model" or "model id" in case of invalid model.
          type: string
        message:
          description: Top-level error message.
          type: string
        details:
          description: Additional supportive details regarding the error and/or expected policies.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        innererror:
          $ref: '#/components/schemas/InnerError'
    ResourceId:
      description: Resource id
      type: string
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
      minLength: 3
      maxLength: 64
    ModelDeprecationInfo:
      description: Cognitive Services account ModelDeprecationInfo.
      type: object
      properties:
        fineTune:
          type: string
          description: The datetime of deprecation of the fineTune Model.
        inference:
          type: string
          description: The datetime of deprecation of the inference Model.
    AccountApiKeys:
      type: object
      properties:
        key1:
          type: string
          x-ms-secret: true
        key2:
          type: string
          x-ms-secret: true
    Endpoint:
      description: Endpoint object
      required:
      - projectId
      - modelId
      type: object
      properties:
        id:
          description: Endpoint Id
          type: string
          format: uuid
        displayName:
          description: Endpoint name
          minLength: 1
          type: string
        description:
          description: Endpoint description
          type: string
        projectId:
          $ref: '#/components/schemas/ResourceId'
        modelId:
          $ref: '#/components/schemas/ResourceId'
        properties:
          $ref: '#/components/schemas/EndpointProperties'
        status:
          $ref: '#/components/schemas/Status'
        createdDateTime:
          description: The timestamp when the object was created. The timestamp is encoded as ISO 8601 date and time format ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).
          format: date-time
          type: string
          readOnly: true
        lastActionDateTime:
          description: The timestamp when the current status was entered. The timestamp is encoded as ISO 8601 date and time format ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).
          format: date-time
          type: string
          readOnly: true
    EndpointResourceProperties:
      required:
      - endpointType
      type: object
      properties:
        associatedResourceId:
          description: Byo resource id for creating the built-in model service endpoints.
          type: string
          format: arm-id
        endpointType:
          description: Type of the endpoint.
          type: string
          enum:
          - Azure.OpenAI
          - Azure.Speech
          - Azure.ContentSafety
          - Azure.Llama
          - managedOnlineEndpoint
          x-ms-enum:
            name: endpointType
            modelAsString: true
        endpointUri:
          description: Uri of the endpoint.
          type: string
          format: url
        failureReason:
          description: The failure reason if the creation failed.
          type: string
        name:
          description: Name of the endpoint.
          type: string
        provisioningState:
          description: Read-only provision state status property.
          $ref: '#/components/schemas/DefaultResourceProvisioningState'
      discriminator:
        propertyName: endpointType
    ErrorCode:
      description: Top-level error code
      enum:
