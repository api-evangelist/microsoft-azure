        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    SupportabilityStatus:
      type: string
      description: Supportability Status.
      enum:
      - Unknown
      - Mainstream
      - Extended
      - OutOfSupport
      x-ms-enum:
        name: SupportabilityStatus
        modelAsString: true
        values:
        - name: Unknown
          value: Unknown
          description: Unknown Supportability Status.
        - name: Mainstream
          value: Mainstream
          description: Mainstream Supportability Status.
        - name: Extended
