components:
  schemas:
    StorageSyncInnerErrorDetails:
      type: object
      description: Error Details object.
      properties:
        callStack:
          type: string
          description: Call stack of the error.
        message:
          type: string
          description: Error message of the error.
        innerException:
          type: string
          description: Exception of the inner error.
        innerExceptionCallStack:
          type: string
          description: Call stack of the inner error.
    StorageSyncError:
      type: object
      description: Error type
      properties:
        error:
          $ref: '#/components/schemas/StorageSyncApiError'
          description: Error details of the given entry.
        innererror:
          $ref: '#/components/schemas/StorageSyncApiError'
          description: Error details of the given entry.
    WorkflowStatus:
      type: string
      description: Type of the Workflow Status
      enum:
      - active
      - expired
      - succeeded
      - aborted
      - failed
      x-ms-enum:
        name: WorkflowStatus
        modelAsString: true
    WorkflowArray:
      description: Array of Workflow
      type: object
      properties:
        value:
          type: array
          description: Collection of workflow items.
          items:
            $ref: '#/components/schemas/Workflow'
          x-ms-identifiers:
          - id
    WorkflowProperties:
      type: object
      description: Workflow Properties object.
      properties:
        lastStepName:
          type: string
          description: last step name
        status:
          $ref: '#/components/schemas/WorkflowStatus'
          description: workflow status.
        operation:
          $ref: '#/components/schemas/OperationDirection'
          description: operation direction.
        steps:
          type: string
          description: workflow steps
        lastOperationId:
          type: string
          description: workflow last operation identifier.
        commandName:
          type: string
          description: workflow command name.
          readOnly: true
        createdTimestamp:
          type: string
          format: date-time
          description: workflow created timestamp.
          readOnly: true
        lastStatusTimestamp:
          type: string
          format: date-time
          description: workflow last status timestamp.
          readOnly: true
    OperationDirection:
      type: string
      description: Type of the Operation Direction
      enum:
      - do
      - undo
      - cancel
      x-ms-enum:
        name: OperationDirection
        modelAsString: true
    StorageSyncApiError:
      type: object
      description: Error type
      properties:
        code:
          type: string
          description: Error code of the given entry.
        message:
          type: string
          description: Error message of the given entry.
        target:
          type: string
          description: Target of the given error entry.
        details:
          $ref: '#/components/schemas/StorageSyncErrorDetails'
          description: Error details of the given entry.
        innererror:
          $ref: '#/components/schemas/StorageSyncInnerErrorDetails'
          description: Inner error details of the given entry.
    Workflow:
      type: object
      description: Workflow resource.
      allOf:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ProxyResource
      properties:
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/WorkflowProperties'
          description: Workflow properties.
    StorageSyncErrorDetails:
      type: object
      description: Error Details object.
      properties:
        code:
          type: string
          description: Error code of the given entry.
        message:
          type: string
          description: Error message of the given entry.
        target:
          type: string
          description: Target of the given entry.
        requestUri:
          type: string
          description: Request URI of the given entry.
        exceptionType:
          type: string
          description: Exception type of the given entry.
        httpMethod:
          type: string
          description: HTTP method of the given entry.
        hashedMessage:
          type: string
          description: Hashed message of the given entry.
        httpErrorCode:
          type: string
          description: HTTP error code of the given entry.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
