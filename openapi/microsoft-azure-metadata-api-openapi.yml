openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Metadata API
tags:
- name: Metadata
paths:
  /providers/Microsoft.ResourceHealth/metadata:
    get:
      tags:
      - Metadata
      operationId: microsoftAzureMetadataList
      description: Gets the list of metadata entities.
      parameters:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK. Successfully retrieved metadata entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataEntityListResult'
        default:
          description: DefaultErrorResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        GetMetadata:
          $ref: ./examples/Metadata_List.json
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Providers Microsoft Resourcehealth Metadata
  /providers/Microsoft.ResourceHealth/metadata/{name}:
    get:
      tags:
      - Metadata
      operationId: microsoftAzureMetadataGetentity
      description: Gets the list of metadata entities.
      parameters:
      - name: name
        in: path
        description: Name of metadata entity.
        required: true
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK. Successfully retrieved metadata entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataEntity'
        default:
          description: DefaultErrorResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        GetMetadata:
          $ref: ./examples/Metadata_GetEntity.json
      summary: Microsoft Azure Get Providers Microsoft Resourcehealth Metadata Name
components:
  schemas:
    ErrorResponse:
      description: Error details.
      type: object
      properties:
        code:
          description: The error code.
          type: string
          readOnly: true
        message:
          description: The error message.
          type: string
          readOnly: true
        details:
          description: The error details.
          type: string
          readOnly: true
    MetadataEntityListResult:
      description: The list of metadata entities
      type: object
      properties:
        value:
          description: The list of metadata entities.
          type: array
          items:
            $ref: '#/components/schemas/MetadataEntity'
        nextLink:
          description: The link used to get the next page of metadata.
          type: string
    MetadataEntityProperties:
      description: The metadata entity properties
      type: object
      properties:
        displayName:
          description: The display name.
          type: string
        dependsOn:
          description: The list of keys on which this entity depends on.
          type: array
          items:
            type: string
        applicableScenarios:
          description: The list of scenarios applicable to this metadata entity.
          type: array
          items:
            enum:
            - Alerts
            type: string
            x-ms-enum:
              name: Scenario
              modelAsString: true
        supportedValues:
          description: The list of supported values.
          type: array
          items:
            $ref: '#/components/schemas/MetadataSupportedValueDetail'
    MetadataSupportedValueDetail:
      description: The metadata supported value detail.
      type: object
      properties:
        id:
          description: The id.
          type: string
        displayName:
          description: The display name.
          type: string
        resourceTypes:
          description: The list of associated resource types.
          type: array
          items:
            type: string
    MetadataEntity:
      description: The metadata entity contract.
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/MetadataEntityProperties'
          description: The metadata entity properties.
          x-ms-client-flatten: true
      allOf:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ProxyResource
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
