openapi: 3.2.0
info:
  title: Microsoft Azure Metrics Advisor Hook API
  description: Microsoft Azure Metrics Advisor REST API (OpenAPI v2)
  version: '1.0'
security:
- apim_key: []
  ma_api_key: []
tags:
- name: Hook
paths:
  /hooks:
    get:
      tags:
      - Hook
      summary: Microsoft Azure List All Hooks
      operationId: microsoftAzureListhooks
      parameters:
      - in: query
        name: hookName
        description: filter hook by its name
        schema:
          type: string
      - in: query
        name: $skip
        description: for paging, skipped number
        schema:
          type: integer
          format: int32
      - in: query
        name: $maxpagesize
        description: the maximum number of items in one page
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookList'
        default:
          description: Client error or server error (4xx or 5xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
      x-ms-pageable:
        nextLinkName: '@nextLink'
      x-ms-examples:
        List all hooks:
          $ref: ./examples/listHooks.json
      description: Needs a more full description created.
    post:
      tags:
      - Hook
      summary: Microsoft Azure Create A New Hook
      operationId: microsoftAzureCreatehook
      responses:
        '201':
          description: Success
          headers:
            Location:
              description: Location of the newly created resource.
              schema:
                type: string
        default:
          description: Client error or server error (4xx or 5xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
      x-ms-examples:
        Create a new hook:
          $ref: ./examples/createHook.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookInfo'
        description: Create hook request
        required: true
  /hooks/{hookId}:
    get:
      tags:
      - Hook
      summary: Microsoft Azure Get A Hook By Its Id
      operationId: microsoftAzureGethook
      parameters:
      - in: path
        name: hookId
        description: Hook unique ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookInfo'
        default:
          description: Client error or server error (4xx or 5xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
      x-ms-examples:
        Get a hook by its id:
          $ref: ./examples/getHook.json
      description: Needs a more full description created.
    patch:
      tags:
      - Hook
      summary: Microsoft Azure Update A Hook
      operationId: microsoftAzureUpdatehook
      parameters:
      - in: path
        name: hookId
        description: Hook unique ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookInfo'
        default:
          description: Client error or server error (4xx or 5xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
      x-ms-examples:
        Update a hook:
          $ref: ./examples/updateHook.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/HookInfoPatch'
        description: Update hook request
        required: true
    delete:
      tags:
      - Hook
      summary: Microsoft Azure Delete A Hook
      operationId: microsoftAzureDeletehook
      parameters:
      - in: path
        name: hookId
        description: Hook unique ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The resource is deleted successfully or does not exist.
        default:
          description: Client error or server error (4xx or 5xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
      x-ms-examples:
        Delete a hook:
          $ref: ./examples/deleteHook.json
      description: Needs a more full description created.
components:
  schemas:
    HookInfoPatch:
      required:
      - hookType
      type: object
      properties:
        hookType:
          description: hook type
          enum:
          - Webhook
          - Email
          type: string
          x-ms-enum:
            name: HookType
            modelAsString: true
        hookName:
          description: hook unique name
          type: string
        description:
          description: hook description
          type: string
        externalLink:
          description: hook external link
          type: string
        admins:
          description: hook administrators
          uniqueItems: true
          type: array
          items:
            type: string
      discriminator:
        propertyName: hookType
    HookInfo:
      required:
      - hookName
      - hookType
      type: object
      properties:
        hookType:
          description: hook type
          enum:
          - Webhook
          - Email
          type: string
          x-ms-enum:
            name: HookType
            modelAsString: true
        hookId:
          format: uuid
          description: Hook unique id
          type: string
          readOnly: true
        hookName:
          description: hook unique name
          type: string
        description:
          description: hook description
          default: ''
          type: string
        externalLink:
          description: hook external link
          default: ''
          type: string
        admins:
          description: hook administrators
          uniqueItems: true
          type: array
          items:
            type: string
      discriminator:
        propertyName: hookType
    ErrorCode:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
    HookList:
      type: object
      properties:
        '@nextLink':
          type: string
          readOnly: true
        value:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/HookInfo'
          readOnly: true
  securitySchemes:
    ma_api_key:
      type: apiKey
      name: x-api-key
      in: header
    apim_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
x-ms-parameterized-host:
  hostTemplate: '{endpoint}/metricsadvisor/v1.0'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
