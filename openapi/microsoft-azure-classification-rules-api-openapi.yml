components:
  schemas:
    OperationResponse:
      type: object
      properties:
        scanResultId:
          format: uuid
          type: string
        startTime:
          format: date-time
          type: string
        endTime:
          format: date-time
          type: string
        status:
          enum:
          - Accepted
          - InProgress
          - TransientFailure
          - Succeeded
          - Failed
          - Canceled
          type: string
          x-ms-enum:
            name: OperationStatus
            modelAsString: true
        error:
