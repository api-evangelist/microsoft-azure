openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Models API
  description: Operations for listing available models
tags:
- name: Models
  description: Operations for listing available models
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.CognitiveServices/models:
    get:
      operationId: Models_List
      summary: Microsoft Azure List Available Models
      description: List available models for the subscription.
      tags:
      - Models
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Successfully returned available models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResult'
              examples:
                ModelsList200Example:
                  summary: Default Models_List 200 response
                  x-microcks-default: true
                  value:
                    value:
                    - format: example_value
                      name: Example Title
                      version: example_value
                      source: example_value
                      maxCapacity: 10
                      capabilities: example_value
                      deprecation: {}
                      lifecycleStatus: GenerallyAvailable
                      systemData: {}
                    nextLink: example_value
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ModelsListdefaultExample:
                  summary: Default Models_List default response
                  x-microcks-default: true
                  value:
                    error:
                      code: example_value
                      message: example_value
                      target: example_value
                      details:
                      - code: example_value
                        message: example_value
                        target: example_value
                      additionalInfo:
                      - type: example_value
                        info: example_value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /models:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    post:
      tags:
      - Models
      description: Uploads one or more models. When any error occurs, no models are uploaded.<br>Status codes:<br>* 201 Created<br>* 400 Bad Request<br>  * DTDLParserError - The models provided are not valid DTDL.<br>  * InvalidArgument - The model id is invalid.<br>  * LimitExceeded - The maximum number of model ids allowed in 'dependenciesFor' has been reached.<br>  * ModelVersionNotSupported - The version of DTDL used is not supported.<br>* 409 Conflict<br>  * ModelAlreadyExists - The model provided already exists.
      operationId: microsoftAzureDigitaltwinmodelsAdd
      x-ms-examples:
        Add models:
          $ref: ./examples/ModelAdd.json
      parameters:
      - $ref: '#/components/parameters/api-version'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonPagedDigitalTwinsModelDataCollection'
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
      summary: Microsoft Azure Post Models
      requestBody:
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: object
        description: An array of models to add.
        required: true
    get:
      tags:
      - Models
      description: Retrieves model metadata and, optionally, model definitions.<br>Status codes:<br>* 200 OK<br>* 400 Bad Request<br>  * InvalidArgument - The model id is invalid.<br>  * LimitExceeded - The maximum number of model ids allowed in 'dependenciesFor' has been reached.<br>* 404 Not Found<br>  * ModelNotFound - The model was not found.
      x-ms-pageable:
        nextLinkName: nextLink
      operationId: microsoftAzureDigitaltwinmodelsList
      x-ms-examples:
        List models:
          $ref: ./examples/ModelsGet.json
        List models (include dependencies and definitions):
          $ref: ./examples/ModelsGetWithDependenciesAndIncludeModelDefinition.json
      parameters:
      - name: dependenciesFor
        in: query
        description: If specified, only return the set of the specified models along with their dependencies. If omitted, all models are retrieved.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/includeModelDefinition'
      - $ref: '#/components/parameters/max-items-per-page'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDigitalTwinsModelDataCollection'
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
      summary: Microsoft Azure Get Models
  /models/{id}:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    get:
      tags:
      - Models
      description: Retrieves model metadata and optionally the model definition.<br>Status codes:<br>* 200 OK<br>* 400 Bad Request<br>  * InvalidArgument - The model id is invalid.<br>  * MissingArgument - The model id was not provided.<br>* 404 Not Found<br>  * ModelNotFound - The model was not found.
      operationId: microsoftAzureDigitaltwinmodelsGetbyid
      x-ms-examples:
        Get a model by id:
          $ref: ./examples/ModelGetById.json
        Get a model by id (with definition):
          $ref: ./examples/ModelGetByIdWithIncludeModelDefinition.json
      parameters:
      - $ref: '#/components/parameters/modelId'
      - $ref: '#/components/parameters/includeModelDefinition'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalTwinsModelData'
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
      summary: Microsoft Azure Get Models Id
    patch:
      tags:
      - Models
      description: Updates the metadata for a model.<br>Status codes:<br>* 204 No Content<br>* 400 Bad Request<br>  * InvalidArgument - The model id is invalid.<br>  * JsonPatchInvalid - The JSON Patch provided is invalid.<br>  * MissingArgument - The model id was not provided.<br>* 404 Not Found<br>  * ModelNotFound - The model was not found.<br>* 409 Conflict<br>  * ModelReferencesNotDecommissioned - The model refers to models that are not decommissioned.
      operationId: microsoftAzureDigitaltwinmodelsUpdate
      x-ms-examples:
        Decommission a model:
          $ref: ./examples/ModelUpdateDecommissioned.json
      parameters:
      - $ref: '#/components/parameters/modelId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '204':
          description: Success
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
      summary: Microsoft Azure Patch Models Id
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
        description: An update specification described by JSON Patch. Only the decommissioned property can be replaced.
        required: true
    delete:
      tags:
      - Models
      operationId: microsoftAzureDigitaltwinmodelsDelete
      description: Deletes a model. A model can only be deleted if no other models reference it.<br>Status codes:<br>* 204 No Content<br>* 400 Bad Request<br>  * InvalidArgument - The model id is invalid.<br>  * MissingArgument - The model id was not provided.<br>* 404 Not Found<br>  * ModelNotFound - The model was not found.<br>* 409 Conflict<br>  * ModelReferencesNotDeleted - The model refers to models that are not deleted.
      x-ms-examples:
        Delete a model:
          $ref: ./examples/DeleteModel.json
      parameters:
      - $ref: '#/components/parameters/modelId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '204':
          description: Success
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
      summary: Microsoft Azure Delete Models Id
  /models/{model_id}:
    get:
      tags:
      - Models
      summary: Microsoft Azure Gets Details For The Model Specified By The Given Modelid
      operationId: microsoftAzureModelsGet
      parameters:
      - in: path
        name: model_id
        description: The identifier of the model.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/apiVersionQueryParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
      x-ms-examples:
        Getting a base model.:
          $ref: ./examples/get_model_base.json
        Getting a fine-tuned model.:
          $ref: ./examples/get_model_finetune.json
      description: Needs a more full description created.
  /models/{model-id}:
    get:
      tags:
      - Models
      summary: Microsoft Azure Gets Details For The Model Specified By The Given Modelid
      operationId: microsoftAzureModelsGet
      parameters:
      - in: path
        name: model-id
        description: The identifier of the model.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/apiVersionQueryParameter_3'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model_2'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_4'
      x-ms-examples:
        Getting a base model.:
          $ref: ./examples/get_model_base.json
        Getting a fine-tuned model.:
          $ref: ./examples/get_model_finetune.json
      description: Needs a more full description created.
  /models/{model}/analyze:
    post:
      description: 'This operation recognizes content within an image by applying a domain-specific model.  The list of domain-specific models that are supported by the Computer Vision API can be retrieved using the /models GET request.  Currently, the API only provides a single domain-specific model: celebrities. Two input methods are supported -- (1) Uploading an image or (2) specifying an image URL. A successful response will be returned in JSON.  If the request failed, the response will contain an error code and a message to help understand what went wrong.'
      operationId: microsoftAzureAnalyzeimagebydomain
      parameters:
      - name: model
        in: path
        description: The domain-specific content to recognize.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ServiceLanguage'
      - $ref: ../../../Common/Parameters.json#/parameters/ImageUrl
      responses:
        '200':
          description: Analysis result based on the domain model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainModelResults'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerVisionError'
      x-ms-examples:
        Successful Domain Model analysis request:
          $ref: ./examples/SuccessfulDomainModelWithUrl.json
      summary: Microsoft Azure Post Models Model Analyze
      tags:
      - Models
  /models/{name}:
    put:
      tags:
      - Models
      summary: "Microsoft Azure Start Training A Custom Model \n      \nstatus Codes Returned:\n 201: Operation Completed Successfully \n 400: The Request Was Malformed \n 409: A Model With The Specified Name Already Exists"
      operationId: microsoftAzureModelsCreate
      parameters:
      - in: path
        name: name
        description: A name that can be used to uniquely identify the model after it has been created.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model_14'
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_16'
      x-ms-examples:
        Models_Create:
          $ref: ./examples/Models_Create.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Model_14'
        description: Properties for the model, such as the name of the dataset to use to train the model.
        required: true
    get:
      tags:
      - Models
      summary: "Microsoft Azure Get Information About A Specific Model \n      \nstatus Codes Returned:\n 200: Operation Completed Successfully \n 400: The Request Was Malformed \n 404: A Model With The Specified Name Was Not Found"
      operationId: microsoftAzureModelsGet
      parameters:
      - in: path
        name: name
        description: The name of the model to get.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model_14'
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_16'
      x-ms-examples:
        Models_Get:
          $ref: ./examples/Models_Get.json
      description: Needs a more full description created.
    delete:
      tags:
      - Models
      summary: "Microsoft Azure Delete A Custom Model A Model Can Be Deleted If It Is In One Of The Succeeded , Failed , Or Canceled States \nif A Model Is In The Notstarted Or Training State, Cancel Training And Wait For Cancellation To Finish Before Deleting The Model \n      \nstatus Codes Returned:\n 204: Operation Completed Successfully \n 400: The Request Was Malformed \n 404: A Model With The Specified Name Was Not Found"
      operationId: microsoftAzureModelsDelete
      parameters:
      - in: path
        name: name
        description: The name of the model to delete.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '204':
          description: No Content
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_16'
      x-ms-examples:
        Models_Delete:
          $ref: ./examples/Models_Delete.json
      description: Needs a more full description created.
  /models/{name}:cancel:
    post:
      tags:
      - Models
      summary: "Microsoft Azure Cancel Model Training \n      \nstatus Codes Returned:\n 202: Operation Completed Successfully \n 400: The Request Was Malformed \n 404: A Model With The Specified Name Was Not Found"
      operationId: microsoftAzureModelsCanceltraining
      parameters:
      - in: path
        name: name
        description: The name of the model to cancel training.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '202':
          description: Accepted
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_16'
      x-ms-examples:
        Models_CancelTraining:
          $ref: ./examples/Models_CancelTraining.json
      description: Needs a more full description created.
  /models/{name}/evaluations/{evaluationName}:
    put:
      tags:
      - Models
      summary: "Microsoft Azure Evaluate An Existing Model \n      \nstatus Codes Returned:\n 201: Operation Completed Successfully \n 400: The Request Was Malformed \n 409: An Evaluation With The Specified Name Already Exists"
      operationId: microsoftAzureModelevaluationsCreate
      parameters:
      - in: path
        name: name
        description: The name of the model to evaluate.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - in: path
        name: evaluationName
        description: A name that can be used to uniquely identify the evaluation after it has been created.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEvaluation'
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_16'
      x-ms-examples:
        ModelEvaluations_Create:
          $ref: ./examples/ModelEvaluations_Create.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ModelEvaluation'
        description: Properties for the evaluation, such as the name of the dataset to use to test the model.
        required: true
    get:
      tags:
      - Models
      summary: "Microsoft Azure Get Information About A Specific Model Evaluation \n      \nstatus Codes Returned:\n 200: Operation Completed Successfully \n 400: The Request Was Malformed \n 404: A Model Evaluation With The Specified Name Was Not Found"
      operationId: microsoftAzureModelevaluationsGet
      parameters:
      - in: path
        name: name
        description: The name of the model to get the evaluation for.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - in: path
        name: evaluationName
        description: The name of the model evaluation to get.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEvaluation'
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_16'
      x-ms-examples:
        ModelEvaluations_Get:
          $ref: ./examples/ModelEvaluations_Get.json
      description: Needs a more full description created.
    delete:
      tags:
      - Models
      summary: "Microsoft Azure Delete A Model Evaluation A Model Evaluation Can Be Deleted If It Is In The Succeeded Or Failed States \n      \nstatus Codes Returned:\n 204: Operation Completed Successfully \n 400: The Request Was Malformed \n 404: A Model Evaluation With The Specified Name Was Not Found"
      operationId: microsoftAzureModelevaluationsDelete
      parameters:
      - in: path
        name: name
        description: The name of the model to delete the evaluation for.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - in: path
        name: evaluationName
        description: The name of the model evaluation to delete.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '204':
          description: No Content
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_16'
      x-ms-examples:
        ModelEvaluations_Delete:
          $ref: ./examples/ModelEvaluations_Delete.json
      description: Needs a more full description created.
  /models/{name}/evaluations:
    get:
      tags:
      - Models
      summary: "Microsoft Azure Get A List Of The Available Evaluations For A Model \n      \nstatus Codes Returned:\n 200: Operation Completed Successfully \n 400: The Request Was Malformed"
      operationId: microsoftAzureModelevaluationsList
      parameters:
      - in: path
        name: name
        description: The name of the model to get evaluations for.
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
      - in: query
        name: skip
        description: Number of evaluations to be skipped.
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2147483647
          minimum: 0
      - in: query
        name: top
        description: Number of evaluations to be returned after skipping. The maximum allowed value is 30.
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 30
          minimum: 1
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEvaluationApiModelCollectionApiModel'
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_16'
      x-ms-examples:
        ModelEvaluations_List:
          $ref: ./examples/ModelEvaluations_List.json
      x-ms-pageable:
        nextLinkName: nextLink
      description: Needs a more full description created.
components:
  schemas:
    ModelTagPerformance:
      description: Performance metrics for each tag recognized by a custom trained model.
      type: object
      properties:
        accuracy:
          format: double
          description: Read only. For multiclass models. Tag accuracy.
          type: number
          readOnly: true
        averagePrecision50:
          format: double
          description: Read only. For object detection models. Average precision at a threshold of 50%.
          type: number
          readOnly: true
    ScaleType:
      title: ScaleType
      description: Defines how scaling operations will be executed.
      enum:
      - manual
      - standard
      type: string
      x-ms-enum:
        name: ScaleType
        modelAsString: true
        values:
        - value: manual
          description: Scaling of a deployment will happen by manually specifying the capacity of a model.
        - value: standard
          description: Scaling of a deployment will happen automatically based on usage.
    Error_4:
      title: Error
      description: 'Error content as defined in the Microsoft REST guidelines

        (https://github.com/microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses).'
      required:
      - code
      - message
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode_2'
        message:
          description: The message of this error.
          minLength: 1
          type: string
        target:
          description: The location where the error happened if available.
          type: string
        details:
          description: The error details if available.
          type: array
          items:
            $ref: '#/components/schemas/Error_4'
        innererror:
          $ref: '#/components/schemas/InnerError_4'
    Error:
      description: Error definition.
      properties:
        code:
          description: Service specific error code which serves as the substatus for the HTTP error code.
          type: string
          readOnly: true
        message:
          description: A human-readable representation of the error.
          type: string
          readOnly: true
        details:
          description: Internal error details.
          type: array
          items:
            $ref: '#/components/schemas/Error'
          readOnly: true
        innererror:
          description: An object containing more specific information than the current object about the error.
          $ref: '#/components/schemas/InnerError'
    ErrorResponseInnerError:
      description: Detailed error.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Error code.
          type: string
        message:
          description: Error message.
          type: string
        innererror:
          $ref: '#/components/schemas/ErrorResponseInnerError'
    TrainingParameters:
      description: Parameters for specifying how a training run trains a custom model.
      required:
      - timeBudgetInHours
      - trainingDatasetName
      type: object
      properties:
        trainingDatasetName:
          description: The dataset name used for training.
          maxLength: 255
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
          type: string
        timeBudgetInHours:
          format: int32
          description: 'Time budget for training, in hours. The minimum allowed value is 1, and the maximum allowed value is 336 hours for GenericClassifier, 1344 hours for GenericDetector.

            This is the maximum amount of compute time that will be spent to train the model.'
          maximum: 1344
          minimum: 1
          type: integer
        modelKind:
          description: Model kind.
          enum:
          - Product-Recognizer
          - Generic-Classifier
          - Generic-Detector
          type: string
          x-ms-enum:
            name: ModelKind
            modelAsString: true
    ErrorResponse_2:
      title: ErrorResponse
      description: 'Error response as defined in the Microsoft REST guidelines

        (https://github.com/microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses).'
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error_2'
    InnerErrorCode:
      title: InnerErrorCode
      description: 'Inner error codes as defined in the Microsoft REST guidelines

        (https://github.com/microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses).'
      enum:
      - invalidPayload
      type: string
      x-ms-enum:
        name: InnerErrorCode
        modelAsString: true
        values:
        - value: invalidPayload
