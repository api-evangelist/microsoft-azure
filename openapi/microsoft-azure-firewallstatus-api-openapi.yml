info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Firewall Status API
tags:
- name: FirewallStatus
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/PaloAltoNetworks.Cloudngfw/firewalls/{firewallName}/statuses
  : get:
      tags:
      - FirewallStatus
      operationId: microsoftAzureFirewallstatusListbyfirewalls
      description: List FirewallStatusResource resources by Firewalls
      parameters:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/FirewallResource.firewallName'
      responses:
        '200':
          description: Azure operation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallStatusResourceListResult'
        default:
          description: Common error response for all Azure Resource Manager APIs to return error details for failed operations.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ErrorResponse
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        FirewallStatus_ListByFirewalls_MaximumSet_Gen:
          $ref: ./examples/FirewallStatus_ListByFirewalls_MaximumSet_Gen.json
        FirewallStatus_ListByFirewalls_MinimumSet_Gen:
          $ref: ./examples/FirewallStatus_ListByFirewalls_MinimumSet_Gen.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Paloaltonetworks Cloudngfw Firewalls Firewallname Statuses
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/PaloAltoNetworks.Cloudngfw/firewalls/{firewallName}/statuses/default
  : get:
      tags:
      - FirewallStatus
      operationId: microsoftAzureFirewallstatusGet
      description: Get a FirewallStatusResource
      parameters:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/FirewallResource.firewallName'
      responses:
        '200':
          description: Azure operation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallStatusResource'
        default:
          description: Common error response for all Azure Resource Manager APIs to return error details for failed operations.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ErrorResponse
      x-ms-examples:
        FirewallStatus_Get_MaximumSet_Gen:
          $ref: ./examples/FirewallStatus_Get_MaximumSet_Gen.json
        FirewallStatus_Get_MinimumSet_Gen:
          $ref: ./examples/FirewallStatus_Get_MinimumSet_Gen.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Paloaltonetworks Cloudngfw Firewalls Firewallname Statuses Default
components:
  schemas:
    ServerStatus:
      type: string
      description: Connectivity Status for Panorama Server
      enum:
      - UP
      - DOWN
      x-ms-enum:
        name: ServerStatus
        modelAsString: true
    BooleanEnum:
      type: string
      description: Boolean Enum
      enum:
      - 'TRUE'
      - 'FALSE'
      x-ms-enum:
        name: BooleanEnum
        modelAsString: true
    FirewallStatusProperty:
      type: object
      properties:
        isPanoramaManaged:
          $ref: '#/components/schemas/BooleanEnum'
          description: 'Panorama Managed: Default is False. Default will be CloudSec managed'
          readOnly: true
        healthStatus:
          $ref: '#/components/schemas/HealthStatus'
          description: Current status of the Firewall
          readOnly: true
        healthReason:
          type: string
          description: Detail description of current health of the Firewall
          readOnly: true
        panoramaStatus:
          $ref: '#/components/schemas/PanoramaStatus'
          description: Panorama Status
          readOnly: true
        provisioningState:
          $ref: '#/components/schemas/ReadOnlyProvisioningState'
          description: Provisioning state of the resource.
          readOnly: true
        isStrataCloudManaged:
          $ref: '#/components/schemas/BooleanEnum'
          description: Strata Cloud Manager
          readOnly: true
        strataCloudManagerInfo:
          $ref: '#/components/schemas/StrataCloudManagerInfo'
          description: This field is only present if Strata Cloud Manager is managing the policy for this firewall
      description: Firewall Status
    FirewallStatusResource:
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/FirewallStatusProperty'
          description: The resource-specific properties for this resource.
          x-ms-mutability:
          - read
          - create
          x-ms-client-flatten: true
        systemData:
          $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/systemData
          description: System metadata for this resource.
          readOnly: true
      description: Firewall Status
      required:
      - properties
      allOf:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ProxyResource
    ReadOnlyProvisioningState:
      type: string
      description: Provisioning state of the firewall resource.
      enum:
      - Succeeded
      - Failed
      - Deleted
      x-ms-enum:
        name: ReadOnlyProvisioningState
        modelAsString: true
    HealthStatus:
      type: string
      description: Status Codes for the Firewall
      enum:
      - GREEN
      - YELLOW
      - RED
      - INITIALIZING
      x-ms-enum:
        name: HealthStatus
        modelAsString: true
    StrataCloudManagerInfo:
      type: object
      properties:
        folderName:
          type: string
          description: Strata Cloud Manager folder in which this firewall has been placed
        hubUrl:
          type: string
          description: URL for Strata Cloud Manager
      description: Strata Cloud Manager Info
    PanoramaStatus:
      type: object
      properties:
        panoramaServerStatus:
          $ref: '#/components/schemas/ServerStatus'
          description: Primary Panorama connection status
          readOnly: true
        panoramaServer2Status:
          $ref: '#/components/schemas/ServerStatus'
          description: Secondary Panorama connection status
          readOnly: true
      description: Panorama connectivity information
    FirewallStatusResourceListResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/FirewallStatusResource'
          x-cadl-name: FirewallStatusResource[]
          description: The items on this page
        nextLink:
          type: string
          description: The link to the next page of items
      description: The response of a FirewallStatusResource list operation.
      required:
      - value
  parameters:
    FirewallResource.firewallName:
      name: firewallName
      in: path
      required: true
      description: Firewall resource name
      x-ms-parameter-location: method
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
