openapi: 3.2.0
info:
  title: Microsoft Azure Query API
  version: '1.0'
  description: 'Operations tagged Query across 2 of this provider''s published API definitions: azure-digital-twins-api-openapi-original.yml, azure-iot-central-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://digitaltwins-hostname
- url: /api
tags:
- name: Query
paths:
  /query:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    post:
      tags:
      - Query
      operationId: microsoftAzureQueryQuerytwins
      description: 'Executes a query that allows traversing relationships and filtering by property values.

        Status codes:

        * 200 OK

        * 400 Bad Request

        * BadRequest - The continuation token is invalid.

        * SqlQueryError - The query contains some errors.

        * TimeoutError - The query execution timed out after 60 seconds. Try simplifying the query or adding conditions to reduce the result size.

        * 429 Too Many Requests

        * QuotaReachedError - The maximum query rate limit has been reached.'
      x-ms-examples:
        Query for digital twins:
          $ref: ./examples/QueryFirstPage.json
        Retrieve paged query results:
          $ref: ./examples/QueryNextPage.json
        Query for digital twins through a relationship:
          $ref: ./examples/QueryJoin.json
      parameters:
      - $ref: '#/components/parameters/max-items-per-page'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          headers:
            query-charge:
              description: The query charge.
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Post Query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuerySpecification'
        description: The query specification to execute.
        required: true
      security:
      - oauth2: []
    servers:
    - url: https://digitaltwins-hostname
components:
  parameters:
    api-version:
      name: api-version
      in: query
      description: The requested API version.
      required: true
      schema:
        type: string
        minLength: 1
    tracestate:
      name: tracestate
      in: header
      description: Provides vendor-specific trace identification information and is a companion to traceparent.
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        postfix: Options
      schema:
        type: string
    max-items-per-page:
      name: max-items-per-page
      in: header
      description: The maximum number of items to retrieve per request. The server may choose to return less than the requested number.
      required: false
      x-ms-client-name: MaxItemsPerPage
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        postfix: Options
      schema:
        type: integer
    traceparent:
      name: traceparent
      in: header
      description: Identifies the request in a distributed tracing system.
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        postfix: Options
      schema:
        type: string
    Version:
      in: query
      name: api-version
      description: The version of the API being called.
      x-ms-parameter-location: client
      required: true
      schema:
        type: string
  schemas:
    QueryResult:
      description: The results of a query operation and an optional continuation token.
      type: object
      required:
      - value
      properties:
        value:
          description: The query results.
          type: array
          items:
            type: object
        continuationToken:
          description: A token which can be used to construct a new QuerySpecification to retrieve the next set of results.
          type: string
    Error:
      description: Error definition.
      properties:
        code:
          description: Service specific error code which serves as the substatus for the HTTP error code.
          type: string
          readOnly: true
        message:
          description: A human-readable representation of the error.
          type: string
          readOnly: true
        details:
          description: Internal error details.
          type: array
          items:
            $ref: '#/components/schemas/Error'
          readOnly: true
        innererror:
          description: An object containing more specific information than the current object about the error.
          $ref: '#/components/schemas/InnerError'
    QuerySpecification:
      description: A query specification containing either a query statement or a continuation token from a previous query result.
      type: object
      properties:
        query:
          description: The query to execute. This value is ignored if a continuation token is provided.
          type: string
        continuationToken:
          description: A token which is used to retrieve the next set of results from a previous query.
          type: string
    InnerError:
      description: A more specific error description than was provided by the containing error.
      properties:
        code:
          description: A more specific error code than was provided by the containing error.
          type: string
        innererror:
          description: An object containing more specific information than the current object about the error.
          $ref: '#/components/schemas/InnerError'
    ErrorResponse:
      description: Error response.
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
          description: The error details.
    QueryResponse:
      description: The query response payload definition.
      type: object
      properties:
        results:
          type: array
          items:
            type: object
      required:
      - results
    Error_2:
      description: The response error definition.
      type: object
      properties:
        error:
          description: Error details for current request.
          $ref: '#/components/schemas/ErrorDetails'
      required:
      - error
    QueryRequest:
      description: The query request payload definition.
      type: object
      properties:
        query:
          description: Query to be executed.
          type: string
      required:
      - query
    ErrorDetails:
      description: The detail information of the error.
      type: object
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Error message details.
        requestId:
          type: string
          description: Correlation Id for current request.
        time:
          type: string
          format: date-time-rfc1123
          description: The time that error request failed.
      required:
      - code
      - message
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes: {}
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize?resource=0b07f429-9f4b-4714-9392-cc5e8e80c8b0
    azure_auth:
      type: oauth2
      flows:
        implicit:
          scopes:
            user_impersonation: impersonate your user account
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
      description: Azure Active Directory OAuth2 Flow
