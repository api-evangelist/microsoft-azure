  : get:
      tags:
      - RecoveryPoints
      summary: Microsoft Azure Gets The List Of Recovery Points For A Replication Protected Item
      description: Lists the available recovery points for a replication protected item.
      operationId: microsoftAzureRecoverypointsListbyreplicationprotecteditems
