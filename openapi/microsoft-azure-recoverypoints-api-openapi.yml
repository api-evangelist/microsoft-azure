        description: Fabric name associated with the backed up item.
        required: true
        schema:
          type: string
      - name: containerName
        in: path
        description: Container name associated with the backed up item.
        required: true
        schema:
          type: string
      - name: protectedItemName
        in: path
        description: Backed up item whose backup copies are to be fetched.
        required: true
        schema:
          type: string
      - name: $filter
        in: query
        description: OData filter options.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryPointResourceList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
