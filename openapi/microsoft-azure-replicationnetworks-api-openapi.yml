openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Replication Networks API
tags:
- name: ReplicationNetworks
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.RecoveryServices/vaults/{resourceName}/replicationFabrics/{fabricName}/replicationNetworks
  : get:
      tags:
      - ReplicationNetworks
      summary: Microsoft Azure Gets The List Of Networks Under A Fabric
      description: Lists the networks available for a fabric.
      operationId: microsoftAzureReplicationnetworksListbyreplicationfabrics
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/SubscriptionId'
      - name: fabricName
        in: path
        description: Fabric name.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkCollection'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        Gets the list of networks under a fabric.:
          $ref: ./examples/ReplicationNetworks_ListByReplicationFabrics.json
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.RecoveryServices/vaults/{resourceName}/replicationFabrics/{fabricName}/replicationNetworks/{networkName}
  : get:
      tags:
      - ReplicationNetworks
      summary: Microsoft Azure Gets A Network With Specified Server Id And Network Name
      description: Gets the details of a network.
      operationId: microsoftAzureReplicationnetworksGet
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/SubscriptionId'
      - name: fabricName
        in: path
        description: Server Id.
        required: true
        schema:
          type: string
      - name: networkName
        in: path
        description: Primary network name.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
      x-ms-examples:
        Gets a network with specified server id and network name.:
          $ref: ./examples/ReplicationNetworks_Get.json
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.RecoveryServices/vaults/{resourceName}/replicationNetworks
  : get:
      tags:
      - ReplicationNetworks
      summary: Microsoft Azure Gets The List Of Networks View Only Api
      description: Lists the networks available in a vault.
      operationId: microsoftAzureReplicationnetworksList
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkCollection'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        Gets the list of networks. View-only API.:
          $ref: ./examples/ReplicationNetworks_List.json
components:
  parameters:
    ResourceName:
      name: resourceName
      in: path
      description: The name of the recovery services vault.
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    ResourceGroupName:
      name: resourceGroupName
      in: path
      description: The name of the resource group where the recovery services vault is present.
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    ApiVersion:
      name: api-version
      in: query
      description: Client Api Version.
      required: true
      schema:
        type: string
    SubscriptionId:
      name: subscriptionId
      in: path
      description: The subscription Id.
      required: true
      schema:
        type: string
  schemas:
    Subnet:
      description: Subnets of the network.
      type: object
      properties:
        name:
          description: The subnet name.
          type: string
        friendlyName:
          description: The subnet friendly name.
          type: string
        addressList:
          description: The list of addresses for the subnet.
          type: array
          items:
            type: string
    NetworkProperties:
      description: Network Properties.
      type: object
      properties:
        fabricType:
          description: The Fabric Type.
          type: string
        subnets:
          description: The List of subnets.
          type: array
          items:
            $ref: '#/components/schemas/Subnet'
        friendlyName:
          description: The Friendly Name.
          type: string
        networkType:
          description: The Network Type.
          type: string
    NetworkCollection:
      description: List of networks.
      type: object
      properties:
        value:
          description: The Networks list details.
          type: array
          items:
            $ref: '#/components/schemas/Network'
        nextLink:
          description: The value of next link.
          type: string
    Resource:
      description: Azure resource.
      type: object
      properties:
        id:
          description: Resource Id
          type: string
          readOnly: true
        name:
          description: Resource Name
          type: string
          readOnly: true
        type:
          description: Resource Type
          type: string
          readOnly: true
        location:
          description: Resource Location
          type: string
      x-ms-azure-resource: true
    Network:
      description: Network model.
      type: object
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        properties:
          $ref: '#/components/schemas/NetworkProperties'
          description: The Network Properties.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
