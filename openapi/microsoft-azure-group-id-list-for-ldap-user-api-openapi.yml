openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Group ID List for LDAP User API
tags:
- name: Group ID List for LDAP User
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.NetApp/netAppAccounts/{accountName}/capacityPools/{poolName}/volumes/{volumeName}/getGroupIdListForLdapUser
  : post:
      tags:
      - Group ID List for LDAP User
      summary: Microsoft Azure Get Group Id List For Ldap User
      description: Returns the list of group Ids for a specific LDAP User
      operationId: microsoftAzureVolumesListgetgroupidlistforldapuser
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/AccountName'
      - $ref: '#/components/parameters/PoolName'
      - $ref: '#/components/parameters/VolumeName'
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getGroupIdListForLDAPUserResponse'
        '202':
          description: Accepted
          headers:
            Location:
              schema:
                type: string
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      x-ms-examples:
        GetGroupIdListForUser:
          $ref: examples/GroupIdListForLDAPUser.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getGroupIdListForLDAPUserRequest'
        description: Returns group Id list for a specific LDAP user
        required: true
components:
  parameters:
    PoolName:
      name: poolName
      in: path
      required: true
      description: The name of the capacity pool
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 64
        minLength: 1
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-_]{0,63}$
    VolumeName:
      name: volumeName
      in: path
      required: true
      description: The name of the volume
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 64
        minLength: 1
        pattern: ^[a-zA-Z][a-zA-Z0-9\-_]{0,63}$
    AccountName:
      name: accountName
      in: path
      required: true
      description: The name of the NetApp account
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-_]{0,127}$
  schemas:
    getGroupIdListForLDAPUserResponse:
      description: Group Id list for Ldap user
      type: object
      properties:
        groupIdsForLdapUser:
          description: Group Id list
          type: array
          items:
            type: string
          example:
          - '123'
          - '224'
    getGroupIdListForLDAPUserRequest:
      description: Get group Id list for LDAP User request
      type: object
      required:
      - username
      properties:
        username:
          type: string
          description: username is required to fetch the group to which user is part of
          maxLength: 255
          minLength: 1
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
