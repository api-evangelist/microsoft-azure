openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Inbound Endpoints API
tags:
- name: InboundEndpoints
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/dnsResolvers/{dnsResolverName}/inboundEndpoints/{inboundEndpointName}
  : put:
      tags:
      - InboundEndpoints
      operationId: microsoftAzureInboundendpointsCreateorupdate
      description: Creates or updates an inbound endpoint for a DNS resolver.
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/DnsResolverNameParameter'
      - $ref: '#/components/parameters/InboundEndpointNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      - $ref: '#/components/parameters/IfMatchParameter'
      - $ref: '#/components/parameters/IfNoneMatchParameter'
      responses:
        '200':
          description: The inbound endpoint for the DNS resolver has been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundEndpoint'
        '201':
          description: The inbound endpoint for the DNS resolver has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundEndpoint'
        '202':
          description: The operation to upsert inbound endpoint for the DNS resolver has been accepted and will complete asynchronously.
        default:
          description: Default response. It will be deserialized as per the Error definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-long-running-operation: true
      x-ms-examples:
        Upsert inbound endpoint for DNS resolver:
          $ref: ./examples/InboundEndpoint_Put.json
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Dnsresolvers Dnsresolvername Inboundendpoints Inboundendpointname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundEndpoint'
        description: Parameters supplied to the CreateOrUpdate operation.
        required: true
    patch:
      tags:
      - InboundEndpoints
      operationId: microsoftAzureInboundendpointsUpdate
      description: Updates an inbound endpoint for a DNS resolver.
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/DnsResolverNameParameter'
      - $ref: '#/components/parameters/InboundEndpointNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      - $ref: '#/components/parameters/IfMatchParameter'
      responses:
        '200':
          description: The inbound endpoint for the DNS resolver has been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundEndpoint'
        '202':
          description: The operation to update inbound endpoint for the DNS resolver has been accepted and will complete asynchronously.
        default:
          description: Default response. It will be deserialized as per the Error definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-long-running-operation: true
      x-ms-examples:
        Update inbound endpoint for DNS resolver:
          $ref: ./examples/InboundEndpoint_Patch.json
      summary: Microsoft Azure Patch Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Dnsresolvers Dnsresolvername Inboundendpoints Inboundendpointname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundEndpointPatch'
        description: Parameters supplied to the Update operation.
        required: true
    delete:
      tags:
      - InboundEndpoints
      operationId: microsoftAzureInboundendpointsDelete
      description: 'Deletes an inbound endpoint for a DNS resolver. WARNING: This operation cannot be undone.'
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/DnsResolverNameParameter'
      - $ref: '#/components/parameters/InboundEndpointNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      - $ref: '#/components/parameters/IfMatchParameter'
      responses:
        '200':
          description: The inbound endpoint for the DNS resolver has been deleted.
        '202':
          description: The operation to delete inbound endpoint for the DNS resolver has been accepted and will complete asynchronously.
        '204':
          description: The inbound endpoint for the DNS resolver was not found.
        default:
          description: Default response. It will be deserialized as per the Error definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-long-running-operation: true
      x-ms-examples:
        Delete inbound endpoint for DNS resolver:
          $ref: ./examples/InboundEndpoint_Delete.json
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Dnsresolvers Dnsresolvername Inboundendpoints Inboundendpointname
    get:
      tags:
      - InboundEndpoints
      operationId: microsoftAzureInboundendpointsGet
      description: Gets properties of an inbound endpoint for a DNS resolver.
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/DnsResolverNameParameter'
      - $ref: '#/components/parameters/InboundEndpointNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The inbound endpoint for the DNS resolver was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundEndpoint'
        default:
          description: Default response. It will be deserialized as per the Error definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        Retrieve inbound endpoint for DNS resolver:
          $ref: ./examples/InboundEndpoint_Get.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Dnsresolvers Dnsresolvername Inboundendpoints Inboundendpointname
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/dnsResolvers/{dnsResolverName}/inboundEndpoints
  : get:
