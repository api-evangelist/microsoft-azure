openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Atlas API
tags:
- name: Atlas
paths:
  /atlas/v2/entity:
    post:
      operationId: microsoftAzureEntityCreateorupdate
      description: 'Create or update an entity.<br>Existing entity is matched using its unique guid if<br>supplied or by its unique attributes eg: qualifiedName.<br>Map and array of<br>collections are not well supported. E.g., array>, array>.<br>For each contact type, the maximum number of contacts is 20.'
      parameters:
      - $ref: '#/components/parameters/AtlasApiVersionParameter'
      - name: businessAttributeUpdateBehavior
        in: query
        description: 'Used to define the update behavior for business attributes when updating

          entities.'
        required: false
        x-ms-enum:
          name: BusinessAttributeUpdateBehavior
          modelAsString: true
          values:
          - name: Ignore
            value: ignore
            description: Ignore the business attribute payload for update.
          - name: Replace
            value: replace
            description: Replace all the business attributes using the payload.
          - name: Merge
            value: merge
            description: Merge the business attributes. Business attributes will not be updated if not provided.
        schema:
          type: string
          enum:
          - ignore
          - replace
          - merge
      - name: collectionId
        in: query
        description: 'The collection where entities will be moved to. Only specify a value if you

          need to move an entity to another collection.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Entity_AddCustomAttribute:
          $ref: ./examples/Entity_AddCustomAttribute.json
        Entity_Create:
          $ref: ./examples/Entity_Create.json
        Entity_Update:
          $ref: ./examples/Entity_Update.json
      summary: Microsoft Azure Post Atlas Entity
      tags:
      - Atlas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasEntityWithExtInfo'
        required: true
  /atlas/v2/entity/bulk:
    get:
      operationId: microsoftAzureEntityListbyguids
      description: List entities in bulk identified by its GUIDs.
      parameters:
      - $ref: '#/components/parameters/AtlasApiVersionParameter'
      - name: guid
        in: query
        description: An array of GUIDs of entities to list.
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: minExtInfo
        in: query
        description: Whether to return minimal information for referred entities.
        required: false
        schema:
          type: boolean
      - name: ignoreRelationships
        in: query
        description: Whether to ignore relationship attributes.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Entity_ListByGuids:
          $ref: ./examples/Entity_ListByGuids.json
      summary: Microsoft Azure Get Atlas Entity Bulk
      tags:
      - Atlas
    post:
      operationId: microsoftAzureEntityBulkcreateorupdate
      description: 'Create or update entities in bulk.<br>Existing entity is matched using its unique<br>guid if supplied or by its unique attributes eg: qualifiedName.<br>Map and array<br>of collections are not well supported. E.g., array>,<br>array>.<br>For each contact type, the maximum number of contacts<br>is 20.'
      parameters:
      - $ref: '#/components/parameters/AtlasApiVersionParameter'
      - name: collectionId
        in: query
        description: 'The collection where entities will be moved to. Only specify a value if you

          need to move an entity to another collection.'
        required: false
        schema:
          type: string
      - name: businessAttributeUpdateBehavior
        in: query
        description: 'Used to define the update behavior for business attributes when updating

          entities.'
        required: false
        x-ms-enum:
          name: BusinessAttributeUpdateBehavior
          modelAsString: true
          values:
          - name: Ignore
            value: ignore
            description: Ignore the business attribute payload for update.
          - name: Replace
            value: replace
            description: Replace all the business attributes using the payload.
          - name: Merge
            value: merge
            description: Merge the business attributes. Business attributes will not be updated if not provided.
        schema:
          type: string
          enum:
          - ignore
          - replace
          - merge
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Entity_BulkCreateOrUpdate:
          $ref: ./examples/Entity_BulkCreateOrUpdate.json
      summary: Microsoft Azure Post Atlas Entity Bulk
      tags:
      - Atlas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        required: true
    delete:
      operationId: microsoftAzureEntityBulkdelete
      description: Delete a list of entities in bulk identified by their GUIDs or unique<br>attributes.
      parameters:
      - name: guid
        in: query
        description: An array of GUIDs of entities to delete.
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Entity_BulkDelete:
          $ref: ./examples/Entity_BulkDelete.json
      summary: Microsoft Azure Delete Atlas Entity Bulk
      tags:
      - Atlas
  /atlas/v2/entity/bulk/classification:
    post:
      operationId: microsoftAzureEntityAddclassification
      description: Associate a classification to multiple entities in bulk.
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Entity_AddClassificationToEntityByGuids:
          $ref: ./examples/Entity_AddClassificationToEntityByGuids.json
      summary: Microsoft Azure Post Atlas Entity Bulk Classification
      tags:
      - Atlas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationAssociateOptions'
        required: true
  /atlas/v2/entity/bulk/setClassifications:
    post:
