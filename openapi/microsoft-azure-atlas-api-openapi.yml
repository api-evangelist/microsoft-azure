          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Entity_Get:
          $ref: ./examples/Entity_Get.json
      summary: Microsoft Azure Get Atlas Entity Guid Guid
      tags:
      - Atlas
    put:
      operationId: microsoftAzureEntityPartialupdateattributebyguid
      description: Update entity partially - create or update entity attribute identified by its<br>GUID.<br>Supports only primitive attribute type and entity references.<br>It does not support updating complex types like arrays, and maps.<br>Null updates are not possible.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: The name of the attribute.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Entity_PartialUpdateAttributeByGuid:
          $ref: ./examples/Entity_PartialUpdateAttributeByGuid.json
      summary: Microsoft Azure Put Atlas Entity Guid Guid
      tags:
      - Atlas
      requestBody:
        content:
          application/json:
            schema: {}
        description: The value of the attribute.
        required: true
    delete:
      operationId: microsoftAzureEntityDelete
      description: Delete an entity identified by its GUID.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
