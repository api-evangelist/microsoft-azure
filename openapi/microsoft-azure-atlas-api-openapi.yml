          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Entity_Delete:
          $ref: ./examples/Entity_Delete.json
      summary: Microsoft Azure Delete Atlas Entity Guid Guid
      tags:
      - Atlas
