        required: true
  /atlas/v2/entity/bulk/uniqueAttribute/type/{typeName}:
    get:
      operationId: microsoftAzureEntityListbyuniqueattributes
      description: Bulk API to retrieve list of entities identified by its unique attributes.<br>In<br>addition to the typeName path parameter, attribute key-value pair(s) can be<br>provided in the following<br>format<br><br>typeName=\&attr_1:\=\&attr_2:\=\&attr_3:\=\<br><br>NOTE:<br>The attrName should be an unique attribute for the given entity-type.<br>The REST<br>request would look something like this<br><br>GET<br>/v2/entity/bulk/uniqueAttribute/type/hive_db?attr_1:qualifiedName=db1@cl1&attr_2:qualifiedName=db2@cl1<br><br>Note:<br>at least one unique attribute must be provided.
      parameters:
      - name: typeName
        in: path
        description: The name of the type.
        required: true
        schema:
          type: string
      - name: minExtInfo
        in: query
        description: Whether to return minimal information for referred entities.
        required: false
        schema:
          type: boolean
      - name: ignoreRelationships
        in: query
        description: Whether to ignore relationship attributes.
        required: false
        schema:
          type: boolean
      - name: attr_N:qualifiedName
        in: query
        description: 'Qualified name of an entity. E.g. to find 2 entities you can set

          attrs_1:qualifiedName=db1@cl1&attrs_2:qualifiedName=db2@cl1. (This is only an

          example. qualifiedName can be changed to other unique attributes)'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Entity_ListByUniqueAttributes:
          $ref: ./examples/Entity_ListByUniqueAttributes.json
      summary: Microsoft Azure Get Atlas Entity Bulk Uniqueattribute Type Typename
      tags:
      - Atlas
  /atlas/v2/entity/businessmetadata/import:
    post:
      operationId: microsoftAzureEntityImportbusinessmetadata
      description: Upload the file for creating Business Metadata in BULK
      parameters:
