openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Teams Civic Address API
tags:
- name: TeamsCivicAddress
paths:
  /accounts/{accountName}/teamsCivicAddresses/{civicAddressId}:
    get:
      operationId: microsoftAzureAccountsGetteamscivicaddress
      tags:
      - TeamsCivicAddress
      summary: Microsoft Azure Get Teams Civic Address
      description: Get details of a specific Teams Civic Address using its ID.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: accountName
        in: path
        description: Name of the account.
        required: true
        schema:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^([A-Za-z0-9_-]+)$
      - name: civicAddressId
        in: path
        description: The ID of the civic address.
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifMatch'
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifNoneMatch'
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifUnmodifiedSince'
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifModifiedSince'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            ETag:
              description: The entity tag for the response.
              schema:
                type: string
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsCivicAddressResource'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        Get a Civic Address.:
          $ref: ./examples/GetAccountTeamsCivicAddress.json
