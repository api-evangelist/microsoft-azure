openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector User Solutions API
tags:
- name: UserSolutions
paths:
  /providers/Microsoft.Marketplace/mysolutions:
    parameters:
    - $ref: '#/components/parameters/ApiVersionParameter'
    get:
      tags:
      - UserSolutions
      operationId: microsoftAzureUsersolutionsList
      description: Gets the list of user solutions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSolutions'
        default:
          description: Microsoft.Marketplace error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        GetUserSolutions:
          $ref: ./examples/GetUserSolutions.json
      summary: Microsoft Azure Get Providers Microsoft Marketplace Mysolutions
  /providers/Microsoft.Marketplace/mysolutions/{solutionId}:
    parameters:
    - $ref: '#/components/parameters/ApiVersionParameter'
    - $ref: '#/components/parameters/SolutionIdParameter'
    get:
      tags:
      - UserSolutions
      operationId: microsoftAzureUsersolutionsGet
      description: Get information about the user solution
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solution'
        default:
          description: Microsoft.Marketplace error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        GetUserSolution:
          $ref: ./examples/GetUserSolution.json
      summary: Microsoft Azure Get Providers Microsoft Marketplace Mysolutions Solutionid
    put:
      tags:
      - UserSolutions
      operationId: microsoftAzureUsersolutionsCreateorupdate
      description: Creates or updates a user solutions
      x-ms-examples:
        CreateUserSolution:
          $ref: ./examples/CreateUserSolution.json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solution'
        default:
          description: Microsoft.Marketplace error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Put Providers Microsoft Marketplace Mysolutions Solutionid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Solution'
    delete:
      tags:
      - UserSolutions
      operationId: microsoftAzureUsersolutionsDelete
      description: Deletes a user solution
      responses:
        '200':
          description: Success
        '204':
          description: No Content
        default:
          description: Microsoft.Marketplace error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        RemoveUserSolution:
          $ref: ./examples/RemoveUserSolution.json
      summary: Microsoft Azure Delete Providers Microsoft Marketplace Mysolutions Solutionid
components:
  schemas:
    ErrorResponse:
      description: Error response indicates Microsoft.Marketplace service is not able to process the incoming request. The reason is provided in the error message.
      type: object
      properties:
        error:
          description: The details of the error.
          type: object
          properties:
            code:
              description: Error code.
              type: string
              readOnly: true
            message:
              description: Error message indicating why the operation failed.
              type: string
              readOnly: true
    Solution:
      description: The Solution data structure
      type: object
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        properties:
          $ref: '#/components/schemas/SolutionProperties'
          description: The Solution data structure
          x-ms-client-flatten: true
    SystemData:
      description: Read only system data
      type: object
      readOnly: true
      properties:
        createdBy:
          type: string
          description: The identity that created the resource.
        createdByType:
          $ref: '#/components/schemas/IdentityType'
          description: The type of identity that created the resource
        createdAt:
          type: string
          format: date-time
          description: The timestamp of resource creation (UTC)
        lastModifiedBy:
          type: string
          description: The identity that last modified the resource.
        lastModifiedByType:
          $ref: '#/components/schemas/IdentityType'
          description: The type of identity that last modified the resource
        lastModifiedAt:
          type: string
          format: date-time
          description: The timestamp of resource last modification (UTC)
    UserSolutions:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/Solution'
        nextLink:
          description: URL to get the next set of the user solutions if there are any.
          type: string
    Resource:
      description: An Azure resource.
      type: object
      properties:
        id:
          description: The resource ID.
          type: string
          readOnly: true
        name:
          description: The name of the resource.
          type: string
          readOnly: true
        type:
          description: The type of the resource.
          type: string
          readOnly: true
        systemData:
          $ref: '#/components/schemas/SystemData'
          readOnly: true
          description: Metadata pertaining to creation and last modification of the resource
      x-ms-azure-resource: true
    SolutionProperties:
      description: Describes the json payload for solution operations
      type: object
      properties:
        displayName:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          x-ms-identifiers: []
    IdentityType:
      description: The type of identity that creates/modifies resources
      type: string
      enum:
      - User
      - Application
      - ManagedIdentity
      - Key
      x-ms-enum:
        name: IdentityType
        modelAsString: true
    Product:
      type: object
      properties:
        uniqueProductId:
          type: string
        displayName:
          type: string
        description:
          type: string
        summary:
          type: string
        smallIconUri:
          type: string
        publisherDisplayName:
          type: string
        productType:
          type: string
        pricingTypes:
          type: array
          items:
            type: string
        storeFronts:
          type: array
          items:
            type: string
        ratingAverage:
          type: number
          format: double
      additionalProperties: false
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      x-ms-parameter-location: method
      description: The API version to use for the request.
      schema:
        type: string
    SolutionIdParameter:
      name: solutionId
      in: path
      required: true
      x-ms-parameter-location: method
      description: The solution id
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
