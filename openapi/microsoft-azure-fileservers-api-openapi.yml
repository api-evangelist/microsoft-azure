      x-ms-pageable:
        nextLinkName: null
      x-ms-examples:
        FileServersListMetrics:
          $ref: ./examples/FileServersListMetrics.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Storsimple Managers Managername Devices Devicename Fileservers Fileservername Metrics
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.StorSimple/managers/{managerName}/devices/{deviceName}/fileservers/{fileServerName}/metricsDefinitions
  : get:
      tags:
