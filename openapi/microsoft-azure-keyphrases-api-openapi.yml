openapi: 3.2.0
info:
  version: v3.1-preview.4
  contact:
    name: Microsoft Cognitive Services
    url: https://azure.microsoft.com/en-us/services/cognitive-services/text-analytics/
    email: mlapi@microsoft.com
  title: Microsoft Azure Text Analytics Client Key Phrases API
  description: The Text Analytics API is a suite of natural language processing (NLP) services built with best-in-class Microsoft machine learning algorithms.
security:
- apim_key: []
tags:
- name: keyPhrases
paths:
  /keyPhrases:
    post:
      summary: Microsoft Azure Key Phrases
      description: The API returns a list of strings denoting the key phrases in the input text. See the Supported languages in Text Analytics API for the list of enabled languages.
      operationId: microsoftAzureKeyphrases
      parameters:
      - $ref: '#/components/parameters/ModelVersion'
      - $ref: '#/components/parameters/ShowStats'
      - $ref: '#/components/parameters/MultiLanguageInput'
      responses:
        '200':
          description: A successful response results in 0 or more key phrases identified in each valid document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyPhraseResult'
            text/json:
              schema:
                $ref: '#/components/schemas/KeyPhraseResult'
        '400':
          description: Bad Request.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error response
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Successful Key Phrase request:
          $ref: .//examples//SuccessfulKeyPhrasesRequest.json
      deprecated: false
      tags:
      - keyPhrases
components:
  schemas:
    MultiLanguageInput:
      type: object
      required:
      - id
      - text
      properties:
        id:
          type: string
          description: A unique, non-empty document identifier.
        text:
          type: string
          description: The input text to process.
        language:
          type: string
          description: (Optional) This is the 2 letter ISO 639-1 representation of a language. For example, use "en" for English; "es" for Spanish etc. If not set, use "en" for English as default.
      description: Contains an input document to be analyzed by the service.
    MultiLanguageBatchInput:
      type: object
      required:
      - documents
      properties:
        documents:
          type: array
          description: The set of documents to process as part of this batch.
          items:
            $ref: '#/components/schemas/MultiLanguageInput'
      description: Contains a set of input documents to be analyzed by the service.
    TextAnalyticsWarning:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - LongWordsInDocument
          - DocumentTruncated
          x-ms-enum:
            name: WarningCodeValue
            modelAsString: true
          description: Error code.
        message:
          type: string
          description: Warning message.
        targetRef:
          type: string
          description: A JSON pointer reference indicating the target object.
    RequestStatistics:
      type: object
      required:
      - documentsCount
      - validDocumentsCount
      - erroneousDocumentsCount
      - transactionsCount
      properties:
        documentsCount:
          type: integer
          format: int32
          description: Number of documents submitted in the request.
        validDocumentsCount:
          type: integer
          format: int32
          description: Number of valid documents. This excludes empty, over-size limit or non-supported languages documents.
        erroneousDocumentsCount:
          type: integer
          format: int32
          description: Number of invalid documents. This includes empty, over-size limit or non-supported languages documents.
        transactionsCount:
          type: integer
          format: int64
          description: Number of transactions for the request.
      description: if showStats=true was specified in the request this field will contain information about the request payload.
    KeyPhraseResult:
      type: object
      required:
      - documents
      - errors
      - modelVersion
      properties:
        documents:
          type: array
          description: Response by document
          items:
            $ref: '#/components/schemas/DocumentKeyPhrases'
        errors:
          type: array
          description: Errors by document id.
          items:
            $ref: '#/components/schemas/DocumentError'
        statistics:
          $ref: '#/components/schemas/RequestStatistics'
        modelVersion:
          type: string
          description: This field indicates which model is used for scoring.
    TextAnalyticsError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - InvalidRequest
          - InvalidArgument
          - InternalServerError
          - ServiceUnavailable
          - NotFound
          x-ms-enum:
            name: ErrorCodeValue
            modelAsString: false
          description: Error code.
        message:
          type: string
          description: Error message.
        target:
          type: string
          description: Error target.
        innererror:
          $ref: '#/components/schemas/InnerError'
          description: Inner error contains more specific information.
        details:
          type: array
          description: Details about specific errors that led to this reported error.
          items:
            $ref: '#/components/schemas/TextAnalyticsError'
    DocumentError:
      type: object
      required:
      - id
      - error
      properties:
        id:
          type: string
          description: Document Id.
        error:
          type: object
          description: Document Error.
          $ref: '#/components/schemas/TextAnalyticsError'
    InnerError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - InvalidParameterValue
          - InvalidRequestBodyFormat
          - EmptyRequest
          - MissingInputRecords
          - InvalidDocument
          - ModelVersionIncorrect
          - InvalidDocumentBatch
          - UnsupportedLanguageCode
          - InvalidCountryHint
          x-ms-enum:
            name: InnerErrorCodeValue
            modelAsString: true
          description: Error code.
        message:
          type: string
          description: Error message.
        details:
          type: object
          additionalProperties:
            type: string
          description: Error details.
        target:
          type: string
          description: Error target.
        innererror:
          $ref: '#/components/schemas/InnerError'
          description: Inner error contains more specific information.
    DocumentStatistics:
      type: object
      required:
      - charactersCount
      - transactionsCount
      properties:
        charactersCount:
          type: integer
          format: int32
          description: Number of text elements recognized in the document.
        transactionsCount:
          type: integer
          format: int32
          description: Number of transactions for the document.
      description: if showStats=true was specified in the request this field will contain information about the document payload.
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          description: Document Error.
          $ref: '#/components/schemas/TextAnalyticsError'
    DocumentKeyPhrases:
      type: object
      required:
      - id
      - keyPhrases
      - warnings
      properties:
        id:
          type: string
          description: Unique, non-empty document identifier.
        keyPhrases:
          type: array
          description: A list of representative words or phrases. The number of key phrases returned is proportional to the number of words in the input document.
          items:
            type: string
        warnings:
          type: array
          description: Warnings encountered while processing document.
          items:
            $ref: '#/components/schemas/TextAnalyticsWarning'
        statistics:
          description: if showStats=true was specified in the request this field will contain information about the document payload.
          $ref: '#/components/schemas/DocumentStatistics'
  parameters:
    ShowStats:
      name: showStats
      in: query
      description: (Optional) if set to true, response will contain request and document level statistics.
      required: false
      x-ms-parameter-location: method
      schema:
        type: boolean
    MultiLanguageInput:
      in: body
      name: input
      description: Collection of documents to analyze.
      required: true
      schema:
        $ref: '#/components/schemas/MultiLanguageBatchInput'
      x-ms-parameter-location: method
    ModelVersion:
      name: model-version
      in: query
      description: '(Optional) This value indicates which model will be used for scoring. If a model-version is not specified, the API should default to the latest, non-preview version. '
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
  securitySchemes:
    apim_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
x-ms-parameterized-host:
  hostTemplate: '{Endpoint}/text/analytics/v3.1-preview.4'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
