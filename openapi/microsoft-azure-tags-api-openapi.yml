openapi: 3.2.0
info:
  title: Microsoft Azure Azure Container Registry Tags API
  description: Metadata API definition for the Azure Container Registry runtime
  version: 2019-07-15-preview
security:
- registry_auth: []
  registry_oauth2: []
tags:
- name: Tags
paths:
  /v2/{name}/tags/list:
    get:
      tags:
      - Tags
      description: Fetch the tags under the repository identified by name
      x-ms-examples:
        List tags:
          $ref: ./examples/GetTagList.json
      operationId: microsoftAzureGettaglist
      parameters:
      - $ref: '#/components/parameters/ImageName'
      responses:
        '200':
          description: Gives a list of tags for the names repository.
          headers:
            Link:
              description: next paginated result
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryTags'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get Name Tags List
components:
  schemas:
    AcrErrorInfo:
      description: Error information
      properties:
        code:
          description: Error code
          type: string
        message:
          type: string
          description: Error message
        detail:
          type: object
          description: Error details
    RepositoryTags:
      description: Result of the request to list tags of the image
      properties:
        name:
          type: string
          description: Name of the image
        tags:
          type: array
          description: List of tags
          items:
            type: string
            description: Tag name
      example:
        name: name
        tags:
        - tags
        - tags
    AcrErrors:
      description: Acr error response describing why the operation failed
      properties:
        errors:
          type: array
          description: Array of detailed error
          items:
            $ref: '#/components/schemas/AcrErrorInfo'
  parameters:
    ImageName:
      name: name
      in: path
      description: Name of the image (including the namespace)
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
  securitySchemes:
    registry_auth:
      type: http
      scheme: basic
    registry_oauth2:
      type: apiKey
      in: header
      name: Authorization
x-ms-parameterized-host:
  hostTemplate: '{url}'
  useSchemePrefix: false
  positionInOperation: first
  parameters:
  - $ref: '#/components/parameters/Url'
