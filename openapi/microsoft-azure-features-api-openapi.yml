    post:
      summary: 'Microsoft Azure Use To Create A [feature] Https: Tools Ietf Org Html…'
      description: 'The Features API is a part of Creator, which makes it possible to develop applications based on your private indoor map data using Azure Maps API and SDK. Features GET APIs follow the Open Geospatial Consortium API - Features - Part 1: Core corrigendum standard to query Datasets. Datasets consist of multiple feature collections, which are a grouping of features defined by a common schema.


        ### Submit Create Request


        The `Feature` API is an HTTP `POST` request that allows the caller to create a new feature that conforms with the **drafted** Open Geospatial Consortium API - Features - Part 4: Create, Replace, Update and Delete specification. This API creates a feature with the provided attributes in the given collection.'
      operationId: microsoftAzureFeaturesCreate
      x-ms-examples:
