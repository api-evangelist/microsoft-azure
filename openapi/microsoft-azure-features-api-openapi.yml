      - SharedKey: []
      - SasToken: []
    delete:
      summary: 'Microsoft Azure Use To Delete A [feature] Https: Tools Ietf Org Html…'
      description: 'The Features API is a part of Creator, which makes it possible to develop applications based on your private indoor map data using Azure Maps API and SDK. Features GET APIs follow the Open Geospatial Consortium API - Features - Part 1: Core corrigendum standard to query Datasets. Datasets consist of multiple feature collections, which are a grouping of features defined by a common schema.


        ### Submit Delete Request


        The `Delete` API is an HTTP `DELETE` request that is used to delete a feature specified by its `featureId`. The delete request will fail if the feature has any dependent features, so be sure and delete them first. The features `Delete` API conforms with the **drafted** Open Geospatial Consortium API - Features - Part 4: Create, Replace, Update and Delete specification.'
      operationId: microsoftAzureFeaturesDelete
      x-ms-examples:
