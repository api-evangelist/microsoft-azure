      - $ref: '#/components/parameters/CollectionId'
      - $ref: '#/components/parameters/FeatureBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFeatureResult'
        default:
          $ref: ../../../Common/preview/1.0/common.json#/responses/default
      tags:
