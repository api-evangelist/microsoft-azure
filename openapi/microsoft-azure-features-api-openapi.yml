openapi: 3.2.0
info:
  title: Microsoft Azure Features API
  version: '1.0'
  description: 'Operations tagged Features across 2 of this provider''s published API definitions: azure-maps-features-service-openapi-original.yml, featureclient-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://management.azure.com
tags:
- name: Features
paths:
  /features/datasets/{datasetId}:
    get:
      summary: Microsoft Azure Use To Get Links To The Api Definition, Conformance Statements…
      description: 'The Features API is a part of Creator, which makes it possible to develop applications based on your private indoor map data using Azure Maps API and SDK. Features GET APIs follow the Open Geospatial Consortium API - Features - Part 1: Core corrigendum standard to query Datasets. Datasets consist of multiple feature collections, which are a grouping of features defined by a common schema.


        ### Submit Get Landing Page Request


        The `Get Landing Page` API is an HTTP `GET` request that provides links to the API definition, conformance statements and metadata about the features in the specified dataset.'
      operationId: microsoftAzureFeaturesGetlandingpage
      x-ms-examples:
        GetLandingPage:
          $ref: ./examples/features/Features_GetLandingPage.json
      parameters:
      - $ref: ../../../Common/preview/1.0/common.json#/parameters/ClientId
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: ./dataset.json#/parameters/DatasetId
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPageResult'
        default:
          $ref: ../../../Common/preview/1.0/common.json#/responses/default
      tags:
      - Features
      security:
      - AADToken:
        - https://atlas.microsoft.com/.default
      - SharedKey: []
      - SasToken: []
  /features/datasets/{datasetId}/api:
    get:
      summary: Microsoft Azure Use To Get A Description Of The Capabilities Of The Features…
      description: 'The `Get API Definition` API is an HTTP `GET` request that returns details of the capabilities of each API in the Features service, including the request type (`GET` or `POST`) a `description`, `operationId`, `parameters`, and `responses`. It can be used by developers to understand the API or by development tools to support the implementation of servers and clients.


        The Features API is a part of Creator, which makes it possible to develop applications based on your private indoor map data using Azure Maps API and SDK. Features GET APIs follow the Open Geospatial Consortium API - Features - Part 1: Core corrigendum standard to query Datasets. Datasets consist of multiple feature collections, which are a grouping of features defined by a common schema.'
      operationId: microsoftAzureFeaturesGetapidefinition
      x-ms-examples:
        GetApiDefinition:
          $ref: ./examples/features/Features_GetApiDefinition.json
      parameters:
      - $ref: ../../../Common/preview/1.0/common.json#/parameters/ClientId
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: ./dataset.json#/parameters/DatasetId
      responses:
        '200':
