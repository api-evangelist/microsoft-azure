    put:
      summary: Microsoft Azure Use To Overwrite All Existing Attributes Of A [feature] Https…
      description: 'The `Replace` API conforms to the **drafted** Open Geospatial Consortium API - Features - Part 4: Create, Replace, Update and Delete specification.


        This is a part of Creator, which makes it possible to develop applications based on your private indoor map data using Azure Maps API and SDK. Features GET APIs follow the Open Geospatial Consortium API - Features - Part 1: Core corrigendum standard to query Datasets. Datasets consist of multiple feature collections, which are a grouping of features defined by a common schema.


        ### Submit Replace Request


        The `Replace` API is an HTTP `PUT` request that **replaces** the feature identified by the provided `featureId` in the specified collection, meaning the data supplied in the request body overwrites all attributes of the feature.'
      operationId: microsoftAzureFeaturesReplace
      x-ms-examples:
