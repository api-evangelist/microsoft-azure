      - SasToken: []
    patch:
      summary: 'Microsoft Azure Use To Modify Individual Attributes Of A [feature] Https: Tools…'
      description: 'The `Update` API conforms with the **drafted** Open Geospatial Consortium API - Features - Part 4: Create, Replace, Update and Delete specification.


        The Features API is a part of Creator, which makes it possible to develop applications based on your private indoor map data using Azure Maps API and SDK. Features GET APIs follow the Open Geospatial Consortium API - Features - Part 1: Core corrigendum standard to query Datasets. Datasets consist of multiple feature collections, which are a grouping of features defined by a common schema.


        ### Submit Update Request


        The `Update` API is an HTTP `PATCH` request that is used to change individual attributes of a feature as specified by the `featureId`. The only attributes that will be updated are those explicitly included in the request body.'
      operationId: microsoftAzureFeaturesUpdate
      x-ms-examples:
