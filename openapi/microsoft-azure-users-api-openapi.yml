components:
  schemas:
    RoleAssignment:
      description: The role assignment definition.
      type: object
      properties:
        role:
          description: ID of the role for this role assignment.
          type: string
        organization:
          description: ID of the organization for this role assignment.
          type: string
      required:
      - role
    UserProperties:
      description: The user properties.
      required:
      - userType
      type: object
      properties:
        encryptedPassword:
          $ref: '#/components/schemas/AsymmetricEncryptedSecret'
          description: The password details.
        shareAccessRights:
          description: List of shares that the user has rights on. This field should not be specified during user creation.
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/ShareAccessRight'
          x-ms-identifiers:
          - shareId
          readOnly: true
        userType:
          description: Type of the user.
          enum:
          - Share
          - LocalManagement
          - ARM
          type: string
          x-ms-enum:
            name: UserType
            modelAsString: true
    User:
      description: The user definition.
      allOf:
      - $ref: '#/components/schemas/Permission'
      type: object
      properties:
        id:
          description: Unique ID of the user.
          type: string
          readOnly: true
