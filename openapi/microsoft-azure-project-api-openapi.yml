openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Project API
tags:
- name: Project
paths:
  /projects:
    get:
      tags:
      - Project
      description: Gets a list of projects for the authenticated Speech service resource.
      operationId: microsoftAzureProjectsList
      parameters:
      - $ref: '#/components/parameters/QuerySkip'
      - $ref: '#/components/parameters/QueryMaxPageSize'
      - $ref: '#/components/parameters/QueryFilter'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
      x-ms-examples:
        Get all projects:
          $ref: ./examples/get_projects.json
      summary: Microsoft Azure Get Projects
  /projects/{id}:
    get:
      tags:
      - Project
      description: Gets the project identified by the given ID.
      operationId: microsoftAzureProjectsGet
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Get a project:
          $ref: ./examples/get_project.json
      summary: Microsoft Azure Get Projects Id
    delete:
      tags:
      - Project
      description: Deletes the project identified by the given ID. All data (like consent, training set) in this project will be deleted automatically.
      operationId: microsoftAzureProjectsDelete
      parameters:
      - $ref: '#/components/parameters/PathId'
      - in: query
        name: forceDelete
        description: Set this to true if you want to delete a project with model and endpoint. Otherwise, the delete operation will fail.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '204':
          description: No Content
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Delete a project:
          $ref: ./examples/delete_project.json
      summary: Microsoft Azure Delete Projects Id
    put:
      tags:
      - Project
      description: Creates a new project.
      operationId: microsoftAzureProjectsCreate
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Create a project:
          $ref: ./examples/create_project.json
      summary: Microsoft Azure Put Projects Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
        description: project definition
        required: true
components:
  schemas:
    ErrorResponse:
      description: Error response follows Microsoft Azure REST API Guidelines which is available at https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md#handling-errors.
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
    ProjectKind:
      description: Project kind
      enum:
      - ProfessionalVoice
      - PersonalVoice
      type: string
      x-ms-enum:
        name: ProjectKind
        modelAsString: true
    Error:
      description: Top-level error follows Microsoft Azure REST API Guidelines which is available at https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md#handling-errors. This contains an top-level error with error code, message, details, target and an inner error with more descriptive details.
      required:
      - code
      - message
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        target:
          description: The source of the error. For example it would be "model" or "model id" in case of invalid model.
          type: string
        message:
          description: Top-level error message.
          type: string
        details:
          description: Additional supportive details regarding the error and/or expected policies.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        innererror:
          $ref: '#/components/schemas/InnerError'
    ResourceId:
      description: Resource id
      type: string
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
      minLength: 3
      maxLength: 64
    Project:
      description: Project object. Consents, training sets, models, and endpoints are organized in a project.
      required:
      - kind
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        displayName:
          description: Project name
          minLength: 1
          type: string
        description:
          description: Project description
          type: string
        kind:
          $ref: '#/components/schemas/ProjectKind'
        createdDateTime:
          description: The timestamp when the object was created. The timestamp is encoded as ISO 8601 date and time format ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).
          format: date-time
          type: string
          readOnly: true
    ErrorCode:
      description: Top-level error code
      enum:
      - BadRequest
      - BadArgument
      - Unauthorized
      - Forbidden
      - NotFound
      - UnsupportedMediaType
      - TooManyRequests
      - InternalServerError
      - ServiceUnavailable
      type: string
      x-ms-enum:
        name: ErrorCode
        modelAsString: true
    PaginatedProjects:
      description: Paginated project list
      required:
      - value
      type: object
      properties:
        value:
          description: Project list
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextLink:
          description: Link to next page.
          format: uri
          type: string
    InnerError:
      description: Inner error follows Microsoft Azure REST API Guidelines which is available at https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md#handling-errors. This contains required properties error code, message and optional properties target, inner error(this can be nested).
      type: object
      properties:
        code:
          description: Detailed error code to help diagnostic.
          type: string
        target:
          description: The source of the error. For example it would be "model" or "model id" in case of invalid model.
          type: string
        message:
          description: Detailed error message.
          type: string
        innererror:
          $ref: '#/components/schemas/InnerError'
  parameters:
    QuerySkip:
      name: skip
      in: query
      description: The number of result items to skip.
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        default: 0
    QueryApiVersion:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      x-ms-parameter-location: method
      x-ms-client-name: apiVersion
      schema:
        type: string
        minLength: 1
    PathId:
      name: id
      in: path
      description: The ID of the resource.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 64
        minLength: 3
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
    QueryMaxPageSize:
      name: maxpagesize
      in: query
      description: The maximum number of items to include in a single response.
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        default: 100
    QueryFilter:
      name: filter
      in: query
      description: "Filter condition.\n  - **Supported properties:** projectId, createdDateTime, locale, kind\n  - **Operators:**\n    - eq, ne are supported for all properties.\n    - gt, ge, lt, le are supported for createdDateTime.\n  - **Example:**\n    - ```filter=projectId eq 'Jessica'``` (filter by project ID)\n    - ```filter=kind eq 'ProfessionalVoice'``` (filter project by kind)\n    - ```filter=locale eq 'en-US'``` (filter training set and model by locale)\n    - ```filter=createdDateTime gt 2022-12-30T23:59:59.99Z``` (filter resource created time after 2023-11-01)"
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
