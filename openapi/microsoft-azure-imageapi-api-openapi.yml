  /projects/{projectId}/images/suggested/count:
    post:
      tags:
      - ImageApi
      summary: Microsoft Azure Get Count Of Images Whose Suggested Tags Match Given Tags And Their Probabilities Are Greater Than Or Equal To The Given Threshold Returns Count As 0 If None Found
      description: This API takes in tagIds to get count of untagged images per suggested tags for a given threshold.
      operationId: microsoftAzureQuerysuggestedimagecount
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: iterationId
        in: query
        description: IterationId to use for the suggested tags and regions.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  format: int32
                  type: integer
            application/xml:
              schema:
                type: object
                additionalProperties:
                  format: int32
                  type: integer
            text/xml:
              schema:
                type: object
                additionalProperties:
                  format: int32
                  type: integer
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful QuerySuggestedImageCount request:
          $ref: ./examples/QuerySuggestedImageCount.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagFilter'
          application/xml:
            schema:
              $ref: '#/components/schemas/TagFilter'
          text/xml:
            schema:
              $ref: '#/components/schemas/TagFilter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TagFilter'
