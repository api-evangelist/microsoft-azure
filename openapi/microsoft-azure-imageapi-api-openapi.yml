openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Image API
tags:
- name: ImageApi
paths:
  /projects/{projectId}/images:
    get:
      tags:
      - ImageApi
      summary: Microsoft Azure Get Images For A Given Project Iteration Or Workspace
      description: This API supports batching and range selection. By default it will only return first 50 images matching images.<br>Use the {take} and {skip} parameters to control how many images to return in a given batch.<br>The filtering is on an and/or relationship. For example, if the provided tag ids are for the "Dog" and<br>"Cat" tags, then only images tagged with Dog and/or Cat will be returned
      operationId: microsoftAzureGetimages
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: iterationId
        in: query
        description: The iteration id. Defaults to workspace.
        required: false
        schema:
          type: string
          format: uuid
      - name: tagIds
        in: query
        description: A list of tags ids to filter the images. Defaults to all tagged images when null. Limited to 20.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
          minItems: 0
      - name: taggingStatus
        in: query
        description: The tagging status filter. It can be 'All', 'Tagged', or 'Untagged'. Defaults to 'All'.
        required: false
        schema:
          type: string
          enum:
          - All
          - Tagged
          - Untagged
      - name: $filter
        in: query
        description: 'An expression to filter the images against image metadata. Only images where the expression evaluates to true are included in the response.

          The expression supports eq (Equal), ne (Not equal), and (Logical and), or (Logical or) operators.

          Here is an example, metadata=key1 eq ''value1'' and key2 ne ''value2''.'
        required: false
        schema:
          type: string
      - name: orderBy
        in: query
        description: The ordering. Defaults to newest.
        required: false
        schema:
          type: string
          enum:
          - Newest
          - Oldest
      - name: take
        in: query
        description: Maximum number of images to return. Defaults to 50, limited to 256.
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 256
          minimum: 0
      - name: skip
        in: query
        description: Number of images to skip before beginning the image batch. Defaults to 0.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful GetImages request:
          $ref: ./examples/GetImages.json
    post:
      tags:
      - ImageApi
      summary: Microsoft Azure Add The Provided Images To The Set Of Training Images
      description: This API accepts body content as multipart/form-data and application/octet-stream. When using multipart<br>multiple image files can be sent at once, with a maximum of 64 files.<br>If all images are successful created, 200(OK) status code will be returned.<br>Otherwise, 207 (Multi-Status) status code will be returned and detail status for each image will be listed in the response payload.
      operationId: microsoftAzureCreateimagesfromdata
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: tagIds
        in: query
        description: The tags ids with which to tag each image. Limited to 20.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
          minItems: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
            application/xml:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
            text/xml:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
        '207':
          description: '207'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
            application/xml:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
            text/xml:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful CreateImagesFromData request:
          $ref: ./examples/CreateImagesFromData.json
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageData:
                  type: string
                  description: Binary image data. Supported formats are JPEG, GIF, PNG, and BMP. Supports images up to 6MB.
                  format: binary
              required:
              - imageData
          application/octet-stream:
            schema:
              type: object
              properties:
                imageData:
                  type: string
                  description: Binary image data. Supported formats are JPEG, GIF, PNG, and BMP. Supports images up to 6MB.
                  format: binary
              required:
              - imageData
    delete:
      tags:
      - ImageApi
      summary: Microsoft Azure Delete Images From The Set Of Training Images
      operationId: microsoftAzureDeleteimages
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: imageIds
        in: query
        description: Ids of the images to be deleted. Limited to 256 images per batch.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 256
          minItems: 0
      - name: allImages
        in: query
        description: Flag to specify delete all images, specify this flag or a list of images. Using this flag will return a 202 response to indicate the images are being deleted.
        required: false
        schema:
          type: boolean
      - name: allIterations
        in: query
        description: Removes these images from all iterations, not just the current workspace. Using this flag will return a 202 response to indicate the images are being deleted.
        required: false
        schema:
          type: boolean
      responses:
        '202':
          description: Accepted
        '204':
          description: No Content
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful DeleteImages request:
          $ref: ./examples/DeleteImages.json
      description: Needs a more full description created.
  /projects/{projectId}/images/count:
    get:
      tags:
      - ImageApi
      summary: Microsoft Azure Get The Number Of Images
      description: The filtering is on an and/or relationship. For example, if the provided tag ids are for the "Dog" and<br>"Cat" tags, then only images tagged with Dog and/or Cat will be returned
      operationId: microsoftAzureGetimagecount
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: iterationId
        in: query
        description: The iteration id. Defaults to workspace.
        required: false
        schema:
          type: string
          format: uuid
      - name: taggingStatus
        in: query
        description: The tagging status filter. It can be 'All', 'Tagged', or 'Untagged'. Defaults to 'All'.
        required: false
        schema:
          type: string
          enum:
          - All
          - Tagged
          - Untagged
      - name: $filter
        in: query
        description: 'An expression to filter the images against image metadata. Only images where the expression evaluates to true are included in the response.

          The expression supports eq (Equal), ne (Not equal), and (Logical and), or (Logical or) operators.

          Here is an example, metadata=key1 eq ''value1'' and key2 ne ''value2''.'
        required: false
        schema:
          type: string
      - name: tagIds
        in: query
        description: A list of tags ids to filter the images to count. Defaults to all tags when null.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                format: int32
                type: integer
            application/xml:
              schema:
                format: int32
                type: integer
            text/xml:
              schema:
                format: int32
                type: integer
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful GetImageCount request:
          $ref: ./examples/GetImageCount.json
  /projects/{projectId}/images/files:
    post:
      tags:
      - ImageApi
      summary: Microsoft Azure Add The Provided Batch Of Images To The Set Of Training Images
      description: This API accepts a batch of files, and optionally tags, to create images. There is a limit of 64 images and 20 tags.<br>If all images are successful created, 200(OK) status code will be returned.<br>Otherwise, 207 (Multi-Status) status code will be returned and detail status for each image will be listed in the response payload.
      operationId: microsoftAzureCreateimagesfromfiles
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
            application/xml:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
            text/xml:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
        '207':
          description: '207'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
            application/xml:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
            text/xml:
              schema:
                $ref: '#/components/schemas/ImageCreateSummary'
        default:
