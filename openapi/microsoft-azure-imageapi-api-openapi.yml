      - left
      - top
      - width
      - height
      type: object
      properties:
        imageId:
          format: uuid
          type: string
          readOnly: true
        regionId:
          format: uuid
          type: string
          readOnly: true
        tagName:
          type: string
          readOnly: true
        created:
          format: date-time
          type: string
          readOnly: true
        tagId:
          format: uuid
          description: Id of the tag associated with this region.
          type: string
          readOnly: false
        left:
          format: float
          description: Coordinate of the left boundary.
          type: number
          readOnly: false
        top:
          format: float
          description: Coordinate of the top boundary.
          type: number
          readOnly: false
        width:
          format: float
          description: Width.
          type: number
          readOnly: false
        height:
          format: float
          description: Height.
          type: number
          readOnly: false
    ImageIdCreateEntry:
      type: object
      properties:
        id:
          format: uuid
          description: Id of the image.
          type: string
          readOnly: false
        tagIds:
          type: array
          items:
            format: uuid
            type: string
          readOnly: false
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
          readOnly: false
    ImageRegionCreateEntry:
      description: Entry associating a region to an image.
