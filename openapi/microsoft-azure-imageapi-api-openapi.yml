      - left
      - top
      - width
      - height
      type: object
      properties:
        imageId:
          format: uuid
          description: Id of the image.
          type: string
          readOnly: false
        tagId:
          format: uuid
          description: Id of the tag associated with this region.
          type: string
          readOnly: false
        left:
          format: float
          description: Coordinate of the left boundary.
          type: number
          readOnly: false
        top:
          format: float
          description: Coordinate of the top boundary.
          type: number
          readOnly: false
        width:
          format: float
          description: Width.
          type: number
          readOnly: false
        height:
          format: float
          description: Height.
