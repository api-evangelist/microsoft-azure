          text/xml:
            schema:
              $ref: '#/components/schemas/ImageRegionCreateBatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageRegionCreateBatch'
        description: Batch of image regions which include a tag and bounding box. Limited to 64.
        required: true
    delete:
      tags:
      - ImageApi
      summary: Microsoft Azure Delete A Set Of Image Regions
      operationId: microsoftAzureDeleteimageregions
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: regionIds
        in: query
        description: Regions to delete. Limited to 64.
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 64
          minItems: 0
      responses:
        '204':
          description: No Content
        default:
          description: Error response
          content:
            application/json:
