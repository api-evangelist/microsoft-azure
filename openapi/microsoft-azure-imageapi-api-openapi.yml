        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: imageIds
        in: query
        description: The list of image ids to retrieve. Limited to 256.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 256
          minItems: 0
      - name: iterationId
        in: query
        description: The iteration id. Defaults to workspace.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
        default:
