components:
  schemas:
    ImageIdCreateBatch:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageIdCreateEntry'
          readOnly: false
        tagIds:
          type: array
          items:
            format: uuid
            type: string
          readOnly: false
        metadata:
          description: The metadata of image. Limited to 50 key-value pairs per image. The length of key is limited to 256. The length of value is limited to 512.
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          readOnly: false
    ImageCreateResult:
      type: object
      properties:
        sourceUrl:
          description: Source URL of the image.
          type: string
          readOnly: true
        status:
          description: Status of the image creation.
          enum:
          - OK
          - OKDuplicate
          - ErrorSource
          - ErrorImageFormat
          - ErrorImageSize
          - ErrorStorage
          - ErrorLimitExceed
          - ErrorTagLimitExceed
          - ErrorRegionLimitExceed
          - ErrorUnknown
          - ErrorNegativeAndRegularTagOnSameImage
          type: string
          readOnly: true
          x-ms-enum:
            name: ImageCreateStatus
            modelAsString: true
        image:
          $ref: '#/components/schemas/Image'
          description: The image.
          readOnly: true
    ImageFileCreateEntry:
      type: object
      properties:
        name:
          type: string
          readOnly: false
        contents:
          format: byte
          type: string
          readOnly: false
        tagIds:
          type: array
          items:
            format: uuid
            type: string
            example: 00000000-0000-0000-0000-000000000000
          readOnly: false
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
          readOnly: false
    ImageUrlCreateBatch:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageUrlCreateEntry'
          readOnly: false
        tagIds:
          type: array
          items:
            format: uuid
            type: string
          readOnly: false
        metadata:
          description: The metadata of image. Limited to 50 key-value pairs per image. The length of key is limited to 256. The length of value is limited to 512.
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          readOnly: false
    Prediction:
      description: Prediction result.
      type: object
      properties:
        probability:
          format: float
          description: Probability of the tag.
          type: number
          readOnly: true
        tagId:
          format: uuid
          description: Id of the predicted tag.
          type: string
          readOnly: true
        tagName:
          description: Name of the predicted tag.
          type:
          - string
          - 'null'
          readOnly: true
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
          description: Bounding box of the prediction.
          readOnly: true
        tagType:
          description: Type of the predicted tag.
          enum:
          - Regular
          - Negative
          - GeneralProduct
          type:
          - string
          - 'null'
          readOnly: true
          x-ms-enum:
            name: TagType
            modelAsString: true
    BoundingBox:
      description: Bounding box that defines a region of an image.
      required:
      - left
      - top
      - width
      - height
      type: object
      properties:
        left:
          format: float
          description: Coordinate of the left boundary.
          type: number
          readOnly: false
        top:
          format: float
          description: Coordinate of the top boundary.
          type: number
          readOnly: false
        width:
          format: float
          description: Width.
          type: number
          readOnly: false
        height:
          format: float
          description: Height.
          type: number
          readOnly: false
    SuggestedTagAndRegionQueryToken:
      description: 'Contains properties we need to fetch suggested tags for. For the first call, Session and continuation set to null.

        Then on subsequent calls, uses the session/continuation from the previous SuggestedTagAndRegionQuery result to fetch additional results.'
      type: object
      properties:
        tagIds:
          description: Existing TagIds in project to filter suggested tags on.
          type: array
          items:
            format: uuid
            type: string
          readOnly: false
        threshold:
          format: double
          description: Confidence threshold to filter suggested tags on.
          type: number
          readOnly: false
        session:
          description: SessionId for database query. Initially set to null but later used to paginate.
          type: string
          readOnly: false
        continuation:
          description: Continuation Id for database pagination. Initially null but later used to paginate.
          type: string
          readOnly: false
        maxCount:
          format: int32
          description: Maximum number of results you want to be returned in the response.
          type: integer
          readOnly: false
        sortBy:
          description: OrderBy. Ordering mechanism for your results.
          enum:
          - UncertaintyAscending
          - UncertaintyDescending
          type: string
          readOnly: false
          x-ms-enum:
            name: SortBy
            modelAsString: true
    ImageCreateSummary:
      type: object
      properties:
        isBatchSuccessful:
          description: True if all of the images in the batch were created successfully, otherwise false.
          type: boolean
          readOnly: true
        images:
          description: List of the image creation results.
          type: array
          items:
            $ref: '#/components/schemas/ImageCreateResult'
          readOnly: true
    ImageRegionCreateResult:
      required:
