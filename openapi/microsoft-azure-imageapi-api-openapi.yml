      - ImageApi
      summary: Microsoft Azure Update Metadata Of Images
      description: This API accepts a batch of image Ids, and metadata, to update images. There is a limit of 64 images.
      operationId: microsoftAzureUpdateimagemetadata
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: imageIds
        in: query
        description: The list of image ids to update. Limited to 64.
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 256
          minItems: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageMetadataUpdateSummary'
            application/xml:
              schema:
                $ref: '#/components/schemas/ImageMetadataUpdateSummary'
            text/xml:
              schema:
