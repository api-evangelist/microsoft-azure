        duplicated:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImageRegionCreateEntry'
          readOnly: false
        exceeded:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImageRegionCreateEntry'
          readOnly: false
    ImageTag:
      type: object
      properties:
        tagId:
          format: uuid
          type: string
          readOnly: true
        tagName:
          type: string
          readOnly: true
        created:
          format: date-time
          type: string
          readOnly: true
    TagFilter:
      description: Model that query for counting of images whose suggested tags match given tags and their probability are greater than or equal to the given threshold.
      type: object
      properties:
        tagIds:
          description: Existing TagIds in project to get suggested tags count for.
          type: array
          items:
            format: uuid
            type: string
          readOnly: false
        threshold:
