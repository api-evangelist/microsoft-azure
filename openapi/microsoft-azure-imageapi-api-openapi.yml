        duplicated:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImageTagCreateEntry'
          readOnly: false
        exceeded:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImageTagCreateEntry'
          readOnly: false
