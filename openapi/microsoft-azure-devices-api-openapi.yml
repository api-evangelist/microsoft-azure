components:
  schemas:
    DeviceListResponse:
      description: Paged response contains list of requested objects and a URL link to get the next set of results.
      required:
      - value
      type: object
      properties:
        value:
          description: List of requested objects.
          type: array
          items:
            $ref: '#/components/schemas/Device'
        skipToken:
          description: Token used in retrieving the next page. If null, there are no additional pages.
          type: string
        nextLink:
          description: Continuation link (absolute URI) to the next page of results in the list.
          type: string
    Device:
      description: Device API model.
      type: object
      properties:
        deviceDataModelId:
          description: Id of the associated device data model.
          type: string
        integrationId:
          description: Integration id for the device.
          type: string
        type:
          description: Type of device.
          maxLength: 100
          minLength: 0
          type: string
        hardwareId:
          description: Device hardwareId.
          maxLength: 100
          minLength: 0
          type: string
        reportingIntervalInSeconds:
          format: int32
          description: Interval at which the device sends data in seconds.
          type: integer
        parentDeviceId:
          description: Parent device Id for this device.
          type: string
        location:
          $ref: '#/components/schemas/Location'
        sensorPartnerId:
          description: Id of the associated sensor partner.
          type: string
          readOnly: true
        id:
          description: Id of the resource.
          type: string
          readOnly: true
        status:
          description: Status of the resource.
          maxLength: 100
          minLength: 0
          type: string
        createdDateTime:
          format: date-time
          description: 'Date-time when resource was created, sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
          example: '2020-12-31T11:10:21Z'
        modifiedDateTime:
          format: date-time
          description: 'Date-time when resource was last modified, sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
          example: '2020-12-31T11:10:21Z'
        eTag:
          description: The ETag value to implement optimistic concurrency.
          type: string
          readOnly: true
        name:
          description: Name to identify resource.
          maxLength: 100
          minLength: 0
          type: string
        description:
          description: Textual description of the resource.
          maxLength: 500
          minLength: 0
          type: string
        createdBy:
          description: Created by user/tenant id.
          type: string
          readOnly: true
        modifiedBy:
          description: Modified by user/tenant id.
          type: string
          readOnly: true
        properties:
          description: 'A collection of key value pairs that belongs to the resource.

            Each pair must not have a key greater than 50 characters

            and must not have a value greater than 150 characters.

            Note: A maximum of 25 key value pairs can be provided for a resource and

            only string, numeral and datetime (yyyy-MM-ddTHH:mm:ssZ) values are supported.'
          type: object
          additionalProperties: {}
          example:
            key1: value1
            key2: 123.45
    Location:
      description: Location model class.
      required:
      - latitude
      - longitude
      type: object
      properties:
        latitude:
          format: double
          description: Latitude of the location.
          maximum: 90
          minimum: -90
          type: number
        longitude:
          format: double
          description: Longitude of the location.
          maximum: 180
          minimum: -180
          type: number
    Error:
      description: An error from the Azure AgPlatform service.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Server-defined set of error codes.
          minLength: 1
          type: string
        message:
          description: Human-readable representation of the error.
          minLength: 1
          type: string
        target:
          description: Target of the error.
          type: string
        details:
          description: Array of details about specific errors that led to this reported error.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        innererror:
          $ref: '#/components/schemas/InnerError'
