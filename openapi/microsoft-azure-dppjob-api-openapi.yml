openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Dpp Job API
tags:
- name: DppJob
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataProtection/locations/{location}/fetchCrossRegionRestoreJob
  : post:
      tags:
      - DppJob
      description: Fetches the Cross Region Restore Job
      operationId: microsoftAzureFetchcrossregionrestorejobGet
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/LocationParameter
      responses:
        '200':
          description: Details about a Cross Region Restore Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureBackupJobResource'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        Get Cross Region Restore Job:
          $ref: ./examples/CrossRegionRestore/FetchCrossRegionRestoreJob.json
      summary: Microsoft Azure Post Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Dataprotection Locations Location Fetchcrossregionrestorejob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossRegionRestoreJobRequest'
        description: Request body for operation
        required: true
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataProtection/locations/{location}/fetchCrossRegionRestoreJobs
  : post:
      tags:
      - DppJob
      description: Fetches list of Cross Region Restore job belonging to the vault
      operationId: microsoftAzureFetchcrossregionrestorejobsList
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/LocationParameter
      - name: $filter
        in: query
        description: OData filter options.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of Cross Region Restore Jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureBackupJobResourceList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        List Cross Region Restore Jobs:
          $ref: ./examples/CrossRegionRestore/FetchCrossRegionRestoreJobs.json
      summary: Microsoft Azure Post Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Dataprotection Locations Location Fetchcrossregionrestorejobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossRegionRestoreJobsRequest'
        description: Request body for operation
        required: true
components:
  schemas:
    DppResourceList:
      description: ListResource
      properties:
        nextLink:
          description: The uri to fetch the next page of resources. Call ListNext() fetches next page of resources.
          type: string
      title: List Resource
      type: object
    UserFacingError:
      description: Error object used by layers that have access to localized content, and propagate that to user
      properties:
        code:
          description: Unique code for this error
          type: string
        details:
          description: Additional related Errors
          items:
            $ref: '#/components/schemas/UserFacingError'
          x-ms-identifiers: []
          type: array
        innerError:
          $ref: '#/components/schemas/InnerError'
          description: Inner Error
        isRetryable:
          description: Whether the operation will be retryable or not
          type: boolean
        isUserError:
          description: Whether the operation is due to a user error or service error
          type: boolean
        properties:
          description: Any key value pairs that can be injected inside error object
          type: object
          additionalProperties:
            type: string
        message:
          type: string
        recommendedAction:
          description: RecommendedAction � localized.
          items:
            type: string
          type: array
        target:
          description: Target of the error.
          type: string
      type: object
    AzureBackupJob:
      description: AzureBackup Job Class
      properties:
        activityID:
          description: Job Activity Id
          type: string
        backupInstanceFriendlyName:
          description: Name of the Backup Instance
          type: string
        backupInstanceId:
          description: ARM ID of the Backup Instance
          readOnly: true
          type: string
        dataSourceId:
          description: ARM ID of the DataSource
          type: string
        dataSourceLocation:
          description: Location of the DataSource
          type: string
        dataSourceName:
          description: User Friendly Name of the DataSource
          type: string
        dataSourceSetName:
          description: Data Source Set Name of the DataSource
          type: string
        dataSourceType:
          description: Type of DataSource
          type: string
        duration:
          description: Total run time of the job. ISO 8601 format.
          type: string
        endTime:
          description: EndTime of the job(in UTC)
          format: date-time
          readOnly: true
          type: string
        errorDetails:
          description: A List, detailing the errors related to the job
          items:
            $ref: '#/components/schemas/UserFacingError'
          x-ms-identifiers: []
          readOnly: true
          type: array
        extendedInfo:
          $ref: '#/components/schemas/JobExtendedInfo'
          description: Extended Information about the job
          readOnly: true
        isUserTriggered:
          description: Indicated that whether the job is adhoc(true) or scheduled(false)
          type: boolean
        operation:
          description: It indicates the type of Job i.e. Backup:full/log/diff ;Restore:ALR/OLR; Tiering:Backup/Archive ; Management:ConfigureProtection/UnConfigure
          type: string
        operationCategory:
          description: It indicates the type of Job i.e. Backup/Restore/Tiering/Management
          type: string
        policyId:
          description: ARM ID of the policy
          readOnly: true
          type: string
        policyName:
          description: Name of the policy
          readOnly: true
          type: string
        progressEnabled:
          description: Indicated whether progress is enabled for the job
          type: boolean
        progressUrl:
          description: Url which contains job's progress
          readOnly: true
          type: string
        rehydrationPriority:
          description: Priority to be used for rehydration
          readOnly: true
          type: string
        restoreType:
          description: It indicates the sub type of operation i.e. in case of Restore it can be ALR/OLR
          readOnly: true
          type: string
        sourceDataStoreType:
          description: The type of the source data store.
          readOnly: true
          type: string
        sourceResourceGroup:
          description: Resource Group Name of the Datasource
          type: string
        sourceSubscriptionID:
          description: SubscriptionId corresponding to the DataSource
          type: string
        startTime:
          description: StartTime of the job(in UTC)
          format: date-time
          type: string
        status:
          description: Status of the job like InProgress/Success/Failed/Cancelled/SuccessWithWarning
          type: string
        subscriptionId:
          description: Subscription Id of the corresponding backup vault
          type: string
        supportedActions:
          description: List of supported actions
          items:
            type: string
          type: array
        vaultName:
          description: Name of the vault
          type: string
        etag:
          type: string
        sourceDataStoreName:
          type: string
        destinationDataStoreName:
          type: string
      required:
      - activityID
      - subscriptionId
      - dataSourceId
      - vaultName
      - backupInstanceFriendlyName
      - sourceResourceGroup
      - dataSourceName
      - progressEnabled
      - sourceSubscriptionID
      - dataSourceLocation
      - startTime
      - dataSourceType
      - operationCategory
      - operation
      - status
      - isUserTriggered
      - supportedActions
      type: object
    DppResource:
      description: Resource class
      properties:
        id:
          description: Resource Id represents the complete path to the resource.
          readOnly: true
          type: string
        name:
          description: Resource name associated with the resource.
          readOnly: true
          type: string
        type:
          description: Resource type represents the complete path of the form Namespace/ResourceType/ResourceType/...
          readOnly: true
          type: string
        systemData:
          $ref: ../../../../../common-types/resource-management/v4/types.json#/definitions/systemData
      title: DppResource
      type: object
      x-ms-azure-resource: true
    CloudError:
      description: An error response from Azure Backup.
      properties:
        error:
          $ref: '#/components/schemas/Error'
      title: CloudError
      x-ms-external: true
    Error:
      description: The resource management error response.
      properties:
        additionalInfo:
          description: The error additional info.
          items:
            $ref: '#/components/schemas/ErrorAdditionalInfo'
          x-ms-identifiers: []
          readOnly: true
          type: array
        code:
          description: The error code.
          readOnly: true
          type: string
        details:
          description: The error details.
          items:
            $ref: '#/components/schemas/Error'
          x-ms-identifiers: []
          readOnly: true
          type: array
        message:
          description: The error message.
          readOnly: true
          type: string
        target:
          description: The error target.
          readOnly: true
          type: string
    AzureBackupJobResource:
      allOf:
      - $ref: '#/components/schemas/DppResource'
      description: AzureBackup Job Resource Class
      properties:
        properties:
          $ref: '#/components/schemas/AzureBackupJob'
          description: AzureBackupJobResource properties
          type: object
      type: object
    JobSubTask:
      description: Details of Job's Sub Task
      properties:
        additionalDetails:
          additionalProperties:
            readOnly: true
            type: string
          description: Additional details of Sub Tasks
        taskId:
          description: Task Id of the Sub Task
          format: int32
          type: integer
        taskName:
          description: Name of the Sub Task
          type: string
        taskProgress:
          description: Progress of the Sub Task
          readOnly: true
          type: string
        taskStatus:
          description: Status of the Sub Task
          type: string
      required:
      - taskId
      - taskName
      - taskStatus
      type: object
    CrossRegionRestoreJobsRequest:
      description: Details of Backup Vault for which CRR Jobs are to be fetched
      required:
      - sourceRegion
      - sourceBackupVaultId
      type: object
      properties:
        sourceRegion:
          type: string
        sourceBackupVaultId:
          type: string
    UserFacingWarningDetail:
      description: Warning object used by layers that have access to localized content, and propagate that to user
      properties:
        resourceName:
          description: Name of resource for which warning is raised.
          type: string
        warning:
          $ref: '#/components/schemas/UserFacingError'
          description: Error details for the warning.
      required:
      - warning
      type: object
    AzureBackupJobResourceList:
      allOf:
      - $ref: '#/components/schemas/DppResourceList'
      description: List of AzureBackup Job resources
      properties:
        value:
          description: List of resources.
          items:
            $ref: '#/components/schemas/AzureBackupJobResource'
          type: array
      type: object
    RestoreJobRecoveryPointDetails:
      properties:
        recoveryPointID:
          type: string
        recoveryPointTime:
          format: date-time
          type: string
      type: object
    CrossRegionRestoreJobRequest:
      description: Details of CRR Job to be fetched
      required:
      - sourceRegion
      - sourceBackupVaultId
      - jobId
      type: object
      properties:
        sourceRegion:
          type: string
        sourceBackupVaultId:
          type: string
        jobId:
          type: string
    ErrorAdditionalInfo:
      description: The resource management error additional info.
      properties:
        info:
          description: The additional info.
          readOnly: true
          type: object
        type:
          description: The additional info type.
          readOnly: true
          type: string
    JobExtendedInfo:
      description: Extended Information about the job
      properties:
        additionalDetails:
          additionalProperties:
            readOnly: true
            type: string
          description: Job's Additional Details
        backupInstanceState:
          description: State of the Backup Instance
          readOnly: true
          type: string
        dataTransferredInBytes:
          description: Number of bytes transferred
          format: double
          readOnly: true
          type: number
        recoveryDestination:
          description: Destination where restore is done
          readOnly: true
          type: string
        sourceRecoverPoint:
          $ref: '#/components/schemas/RestoreJobRecoveryPointDetails'
          description: Details of the Source Recovery Point
          readOnly: true
        subTasks:
          description: List of Sub Tasks of the job
          items:
            $ref: '#/components/schemas/JobSubTask'
          x-ms-identifiers: []
          readOnly: true
          type: array
        targetRecoverPoint:
          $ref: '#/components/schemas/RestoreJobRecoveryPointDetails'
          description: Details of the Target Recovery Point
          readOnly: true
        warningDetails:
          description: A List, detailing the warnings related to the job
          items:
            $ref: '#/components/schemas/UserFacingWarningDetail'
          x-ms-identifiers: []
          readOnly: true
          type: array
      type: object
    InnerError:
      description: Inner Error
      properties:
        additionalInfo:
          additionalProperties:
            type: string
          description: Any Key value pairs that can be provided to the client for additional  verbose information.
          type: object
        code:
          description: Unique code for this error
          type: string
        embeddedInnerError:
          $ref: '#/components/schemas/InnerError'
          description: Child Inner Error, to allow Nesting.
      title: InnerError
      type: object
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
