      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Collection'
        required: true
    delete:
      tags:
      - Collection
      description: Deletes a Collection entity.
      operationId: microsoftAzureCollectionsDeletecollection
