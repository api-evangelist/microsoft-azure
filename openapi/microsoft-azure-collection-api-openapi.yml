  /collections/{collection}/entity:
    post:
      tags:
      - Collection
      description: 'Creates or updates an entity to a collection.<br>Existing entity is matched using its unique guid if supplied or by its unique attributes eg: qualifiedName.<br>Map and array of collections are not well supported. E.g., array>, array>.'
      operationId: microsoftAzureCollectionCreateorupdate
      x-ms-examples:
        Collection_CreateOrUpdate:
          $ref: ./examples/Collection_CreateOrUpdate.json
      parameters:
      - $ref: '#/components/parameters/collection'
      - $ref: '#/components/parameters/purviewAPIVersion'
      responses:
        '200':
          description: Created with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Post Collections Collection Entity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasEntityWithExtInfo'
        description: Atlas entity with extended information.
        required: true
  /collections/{collection}/entity/bulk:
    post:
      tags:
      - Collection
      description: 'Creates or updates entities in bulk to a collection.<br>Existing entity is matched using its unique guid if supplied or by its unique attributes eg: qualifiedName.<br>Map and array of collections are not well supported. E.g., array>, array>.'
      operationId: microsoftAzureCollectionCreateorupdatebulk
      x-ms-examples:
        Collection_CreateOrUpdateBulk:
          $ref: ./examples/Collection_CreateOrUpdateBulk.json
      parameters:
      - $ref: '#/components/parameters/collection'
      - $ref: '#/components/parameters/purviewAPIVersion'
      responses:
