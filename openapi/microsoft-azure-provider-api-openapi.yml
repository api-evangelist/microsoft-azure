components:
  schemas:
    FunctionAppStack:
      description: Function App Stack.
      type: object
      allOf:
      - $ref: ./CommonDefinitions.json#/definitions/ProxyOnlyResource
      properties:
        location:
          description: Function App stack location.
          type: string
          readOnly: true
        properties:
          description: FunctionAppStack resource specific properties
          type: object
          properties:
            displayText:
              description: Function App stack (display only).
              type: string
              readOnly: true
            value:
              description: Function App stack name.
              type: string
              readOnly: true
            majorVersions:
              description: List of major versions available.
              type: array
              items:
                $ref: '#/components/schemas/FunctionAppMajorVersion'
              readOnly: true
              x-ms-identifiers:
              - value
            preferredOs:
              description: Function App stack preferred OS.
              enum:
              - Windows
              - Linux
              type: string
              readOnly: true
              x-ms-enum:
                name: StackPreferredOs
                modelAsString: false
          x-ms-client-flatten: true
    User:
      description: Represents user credentials used for publishing activity
      type: object
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        properties:
          properties:
            name:
              description: Username (internal)
              type: string
            publishingUserName:
              description: Username used for publishing
              type: string
            publishingPassword:
              description: Password used for publishing
              type: string
            scmUri:
              description: Service Control Manager URI, including username and password
              type: string
          x-ms-client-flatten: true
    SourceControlCollection:
      description: Collection of source controls
      type: object
      properties:
        value:
          description: Collection of resources
          type: array
          items:
            $ref: '#/components/schemas/SourceControl'
        nextLink:
          description: Link to next page of resources
          type: string
    ApplicationStackResource:
      description: ARM resource for a ApplicationStack.
      type: object
      allOf:
      - $ref: ./CommonDefinitions.json#/definitions/ProxyOnlyResource
      properties:
        properties:
          $ref: '#/components/schemas/ApplicationStack'
          description: Core resource properties
          type: object
          x-ms-client-flatten: true
    WindowsJavaContainerSettings:
      description: Windows Java Container settings.
      type: object
      properties:
        javaContainer:
          description: Java container (runtime only).
          type: string
          readOnly: true
        javaContainerVersion:
          description: Java container version (runtime only).
          type: string
          readOnly: true
        isPreview:
          description: <code>true</code> if the stack is in preview; otherwise, <code>false</code>.
          type: boolean
          readOnly: true
        isDeprecated:
          description: <code>true</code> if the stack is deprecated; otherwise, <code>false</code>.
          type: boolean
          readOnly: true
        isHidden:
          description: <code>true</code> if the stack should be hidden; otherwise, <code>false</code>.
          type: boolean
          readOnly: true
        endOfLifeDate:
          format: date-time
          description: End-of-life date for the minor version.
          type: string
          readOnly: true
        isAutoUpdate:
          description: <code>true</code> if the stack version is auto-updated; otherwise, <code>false</code>.
          type: boolean
          readOnly: true
        isEarlyAccess:
          description: <code>true</code> if the minor version is early-access; otherwise, <code>false</code>.
          type: boolean
          readOnly: true
    GitHubActionWebAppStackSettings:
      description: GitHub Actions Web App stack settings.
      type: object
      properties:
        isSupported:
          description: <code>true</code> if GitHub Actions is supported for the stack; otherwise, <code>false</code>.
          type: boolean
          readOnly: true
        supportedVersion:
          description: The minor version that is supported for GitHub Actions.
          type: string
          readOnly: true
    AppInsightsWebAppStackSettings:
      description: App Insights Web App stack settings.
      type: object
      properties:
        isSupported:
          description: <code>true</code> if remote Application Insights is supported for the stack; otherwise, <code>false</code>.
          type: boolean
          readOnly: true
        isDefaultOff:
          description: <code>true</code> if Application Insights is disabled by default for the stack; otherwise, <code>false</code>.
          type: boolean
          readOnly: true
    ApplicationStackCollection:
      description: Collection of Application Stacks
      required:
      - value
      type: object
      properties:
        value:
          description: Collection of resources.
          type: array
          items:
            $ref: '#/components/schemas/ApplicationStackResource'
        nextLink:
          description: Link to next page of resources.
          type: string
          readOnly: true
    ErrorModel:
      description: Default error model
      type: object
      properties:
        code:
          description: Gets or sets the code.
          type: string
          readOnly: true
        details:
          description: Gets or sets the details.
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/ErrorModel'
          readOnly: true
        message:
          description: Gets or sets the messages.
          type: string
          readOnly: true
        target:
          description: Gets or sets the target.
          type: string
          readOnly: true
