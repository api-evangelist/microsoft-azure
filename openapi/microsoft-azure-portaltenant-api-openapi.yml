openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Portal Tenant API
tags:
- name: PortalTenant
paths:
  /providers/Microsoft.PortalServices/compilefile:
    post:
      tags:
      - PortalTenant
      operationId: microsoftAzurePortaltenantCompilefile
      x-ms-examples:
        Compile single file using inline content:
          $ref: examples/portalTenantCompileFile.json
      description: compiles a file using inline content.
      parameters:
      - $ref: ../../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK - Returns the runtime configuration of the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalTenantCompileFileResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../../common-types/resource-management/v3/types.json#/definitions/ErrorResponse
      summary: Microsoft Azure Post Providers Microsoft Portalservices Compilefile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalTenantCompileFile'
        description: The parameters required to compile a file.
        required: true
components:
  schemas:
    PortalTenantCompileFile:
      type: object
      description: The contents of the file to compile.
      properties:
        contents:
          type: object
          description: The contents of the file.
        stringSource:
          type: object
          description: The contents of the string source.
        files:
          type: object
          description: The contents of referenced files. The property name is the relative file path and the value is its contents.
      required:
      - contents
    PortalTenantCompileFileResult:
      type: object
      description: The runtime result of source compilation
      additionalProperties: true
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
