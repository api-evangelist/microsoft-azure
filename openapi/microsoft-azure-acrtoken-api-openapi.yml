openapi: 3.2.0
info:
  title: Microsoft Azure Azure Container Registry Acr Token API
  description: Metadata API definition for the Azure Container Registry runtime
  version: 2019-07-15-preview
security:
- registry_auth: []
  registry_oauth2: []
tags:
- name: AcrToken
paths:
  /oauth2/exchange:
    post:
      tags:
      - AcrToken
      description: Exchange AAD tokens for an ACR refresh Token
      operationId: microsoftAzureGetacrrefreshtokenfromexchange
      parameters:
      - $ref: '#/components/parameters/Grant_type'
      - $ref: '#/components/parameters/Service'
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/RefreshToken'
      - $ref: '#/components/parameters/AccessToken'
      responses:
        '200':
          description: Refresh token acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshToken'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      security: []
      x-ms-examples:
        Exchange AAD Token for ACR Refresh:
          $ref: ./examples/PostRefreshToken.json
      summary: Microsoft Azure Post Oauth2 Exchange
components:
  schemas:
    AcrErrorInfo:
      description: Error information
      properties:
        code:
          description: Error code
          type: string
        message:
          type: string
          description: Error message
        detail:
          type: object
          description: Error details
    RefreshToken:
      type: object
      properties:
        refresh_token:
          description: The refresh token to be used for generating access tokens
          type: string
    AcrErrors:
      description: Acr error response describing why the operation failed
      properties:
        errors:
          type: array
          description: Array of detailed error
          items:
            $ref: '#/components/schemas/AcrErrorInfo'
  parameters:
    Grant_type:
      name: grant_type
      description: Can take a value of access_token_refresh_token, or access_token, or refresh_token
      type: string
      in: formData
      required: true
      enum:
      - access_token_refresh_token
      - access_token
      - refresh_token
      x-ms-parameter-location: method
    RefreshToken:
      name: refresh_token
      in: formData
      required: false
      description: AAD refresh token, mandatory when grant_type is access_token_refresh_token or refresh_token
      type: string
      x-ms-parameter-location: method
    Service:
      name: service
      in: formData
      required: true
      description: Indicates the name of your Azure container registry.
      type: string
      x-ms-parameter-location: method
    AccessToken:
      name: access_token
      in: formData
      required: false
      description: AAD access token, mandatory when grant_type is access_token_refresh_token or access_token.
      type: string
      x-ms-parameter-location: method
    Tenant:
      name: tenant
      in: formData
      required: false
      description: AAD tenant associated to the AAD credentials.
      type: string
      x-ms-parameter-location: method
  securitySchemes:
    registry_auth:
      type: http
      scheme: basic
    registry_oauth2:
      type: apiKey
      in: header
      name: Authorization
x-ms-parameterized-host:
  hostTemplate: '{url}'
  useSchemePrefix: false
  positionInOperation: first
  parameters:
  - $ref: '#/components/parameters/Url'
