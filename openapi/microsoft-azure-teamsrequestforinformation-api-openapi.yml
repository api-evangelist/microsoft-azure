openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Teams Request For Information API
tags:
- name: TeamsRequestForInformation
paths:
  /teamsRequestsForInformation:
    get:
      operationId: microsoftAzureTeamsrequestsforinformationList
      tags:
      - TeamsRequestForInformation
      summary: Microsoft Azure Get List Of Requests For Information
      description: Get list of Requests for Information with details.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.TopQueryParameter'
      - $ref: '#/components/parameters/Azure.Core.SkipQueryParameter'
      - $ref: '#/components/parameters/Azure.Core.MaxPageSizeQueryParameter'
      - $ref: '#/components/parameters/FilterQueryParameter'
      - $ref: '#/components/parameters/RecordCountQueryParameter'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier for the request.
              schema:
                type: string
                format: uuid
            x-ms-record-count:
              description: The total number of records available for this request.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRequestForInformationResource'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        Get list of Requests for Information (Consents).:
          $ref: ./examples/ListRequestsForInformation.json
      x-ms-pageable:
        nextLinkName: nextLink
  /teamsRequestsForInformation/{tenantId}:
    get:
      operationId: microsoftAzureTeamsrequestsforinformationGetrequestforinformation
      tags:
      - TeamsRequestForInformation
      summary: Microsoft Azure Get Request For Information
      description: Get details of a specific Request for Information using its ID.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: tenantId
        in: path
        description: The Teams tenant ID which generated this Request for Information.
        required: true
        schema:
          type: string
          maxLength: 36
          minLength: 1
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifMatch'
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifNoneMatch'
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifUnmodifiedSince'
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifModifiedSince'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            ETag:
              description: The entity tag for the response.
              schema:
                type: string
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestForInformationResource'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        Get an RFI by tenant ID.:
          $ref: ./examples/GetRequestForInformation.json
    patch:
      operationId: microsoftAzureTeamsrequestsforinformationCreateorupdaterequestforinformation
      tags:
      - TeamsRequestForInformation
      summary: Microsoft Azure Create Or Update Request For Information
      description: Create of update the details of a Request for Information.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: tenantId
        in: path
        description: The Teams tenant ID which generated this Request for Information.
        required: true
        schema:
          type: string
          maxLength: 36
          minLength: 1
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - $ref: '#/components/parameters/Azure.Core.RepeatabilityRequestHeaders.repeatabilityRequestId'
      - $ref: '#/components/parameters/Azure.Core.RepeatabilityRequestHeaders.repeatabilityFirstSent'
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifMatch'
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifNoneMatch'
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifUnmodifiedSince'
      - $ref: '#/components/parameters/Azure.Core.ConditionalRequestHeaders.ifModifiedSince'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            ETag:
              description: The entity tag for the response.
              schema:
                type: string
            Repeatability-Result:
              description: Indicates whether the repeatable request was accepted or rejected.
              x-ms-enum:
                name: RepeatabilityResult
                modelAsString: false
                values:
                - name: accepted
                  value: accepted
                  description: If the request was accepted and the server guarantees that the server state reflects a single execution of the operation.
                - name: rejected
                  value: rejected
                  description: 'If the request was rejected because the combination of Repeatability-First-Sent and Repeatability-Request-ID were invalid

                    or because the Repeatability-First-Sent value was outside the range of values held by the server.'
              schema:
                type: string
                enum:
                - accepted
                - rejected
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestForInformationResource'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            ETag:
              description: The entity tag for the response.
              schema:
                type: string
            Repeatability-Result:
              description: Indicates whether the repeatable request was accepted or rejected.
              x-ms-enum:
                name: RepeatabilityResult
                modelAsString: false
                values:
                - name: accepted
                  value: accepted
                  description: If the request was accepted and the server guarantees that the server state reflects a single execution of the operation.
                - name: rejected
                  value: rejected
                  description: 'If the request was rejected because the combination of Repeatability-First-Sent and Repeatability-Request-ID were invalid

                    or because the Repeatability-First-Sent value was outside the range of values held by the server.'
              schema:
                type: string
                enum:
                - accepted
                - rejected
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestForInformationResource'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        Create or update a Teams request for information.:
          $ref: ./examples/PatchRequestForInformationCustomerRelationship.json
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/RequestForInformationResourceCreateOrUpdate'
        description: The resource instance.
        required: true
components:
  parameters:
    Azure.Core.TopQueryParameter:
      name: top
      in: query
      description: The number of result items to return.
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
    Azure.Core.ClientRequestIdHeader:
      name: x-ms-client-request-id
      in: header
      description: An opaque, globally-unique, client-generated string identifier for the request.
      required: false
      x-ms-parameter-location: method
      x-ms-client-name: clientRequestId
      schema:
        type: string
        format: uuid
    Azure.Core.ConditionalRequestHeaders.ifModifiedSince:
      name: If-Modified-Since
      in: header
      description: The request should only proceed if the entity was modified after this time.
      required: false
      x-ms-parameter-location: method
      x-ms-client-name: ifModifiedSince
      schema:
        type: string
        format: date-time
    Azure.Core.ConditionalRequestHeaders.ifMatch:
      name: If-Match
      in: header
      description: The request should only proceed if an entity matches this string.
      required: false
      x-ms-parameter-location: method
      x-ms-client-name: ifMatch
      schema:
        type: string
    RecordCountQueryParameter:
