openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: 'Microsoft Azure AccessControlClient AccessConnector Custom Speech Datasets for Model Adaptation: Custom Speech Datasets for Model Adaptation: API'
tags:
- name: 'Custom Speech Datasets for Model Adaptation:'
paths:
  /datasets/locales:
    get:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Gets A List Of Supported Locales For Datasets
      operationId: microsoftAzureGetsupportedlocalesfordatasets
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetLocales'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Get the supported locales:
          $ref: ./examples/get_supported_dataset_locales.json
      description: Needs a more full description created.
  /datasets:
    get:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Gets A List Of Datasets For The Authenticated Subscription
      operationId: microsoftAzureGetdatasets
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dataset'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Get all datasets:
          $ref: ./examples/get_datasets.json
      description: Needs a more full description created.
    post:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Uploads And Creates A New Dataset By Getting The Data From A Specified Url
      operationId: microsoftAzureCreatedataset
      responses:
        '201':
          description: The response contains information about the entity as payload and its location as header.
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset_2'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_2'
      x-ms-examples:
        Create a dataset:
          $ref: ./examples/create_dataset.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dataset_2'
        description: Definition for the new dataset.
        required: true
  /datasets/{id}:
    get:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Gets The Dataset Identified By The Given Id
      operationId: microsoftAzureGetdataset
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Get a dataset:
          $ref: ./examples/get_dataset.json
      description: Needs a more full description created.
    patch:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Updates The Mutable Details Of The Dataset Identified By Its Id
      operationId: microsoftAzureUpdatedataset
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Update a dataset:
          $ref: ./examples/update_dataset.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetUpdate'
        description: The updated values for the dataset.
        required: true
    delete:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Deletes The Specified Dataset
      operationId: microsoftAzureDeletedataset
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The dataset was successfully deleted.
          headers:
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Delete a dataset:
          $ref: ./examples/delete_dataset.json
      description: Needs a more full description created.
  /datasets/upload:
    post:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Uploads Data And Creates A New Dataset
      operationId: microsoftAzureUploaddataset
      responses:
        '202':
          description: The request was accepted and the response contains the location of the entity.
          headers:
            Retry-After:
              description: The minimum number of seconds to wait before accessing the resource created in this operation.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The limit of requests for the resource.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: The remaining number of requests until the rate limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The timestamp when the rate limit will be reset formatted as ISO 8601 combined date and time in UTC.
              schema:
                type: string
            Location:
              description: The location of the created resource.
              schema:
                type: string
                format: uri
            Operation-Location:
              description: The location of the created resource.
              schema:
                type: string
                format: uri
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      x-ms-examples:
        Upload a dataset:
          $ref: ./examples/upload_dataset.json
      description: Needs a more full description created.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of this dataset (always add this string for any dataset).
                description:
                  type: string
                  description: Optional description of this dataset.
                locale:
                  type: string
                  description: The locale of this dataset (always add this string for any dataset).
                dataImportKind:
                  type: string
                  description: The kind of the dataset (always add this string for any dataset). Possible values are "Language", "Acoustic", "Pronunciation".
                properties:
                  type: string
                  description: Optional properties of this dataset (json serialized object with key/values, where all values must be strings)
                audiodata:
                  type: string
                  description: A zip file containing the audio data (this and the audio archive file for acoustic datasets).
                  format: binary
                transcriptions:
                  type: string
                  description: A text file containing the transcriptions for the audio data (this and the transcriptions file for acoustic datasets).
                  format: binary
                languagedata:
                  type: string
                  description: A text file containing the language or pronunciation data (only this file for language datasets).
                  format: binary
  /datasets/{id}/files:
    get:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Gets The Files Of The Dataset Identified By The Given Id
      operationId: microsoftAzureGetdatasetfiles
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/sasValidityQueryParameter'
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFiles'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_2'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all files:
          $ref: ./examples/get_dataset_files.json
      description: Needs a more full description created.
  /datasets/{id}/files/{fileId}:
    get:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Gets One Specific File Identified With Fileid From A Dataset Identified With Id
      operationId: microsoftAzureGetdatasetfile
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: fileId
        description: The identifier of the file.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/sasValidityQueryParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_2'
      x-ms-examples:
        Get a file:
          $ref: ./examples/get_dataset_file.json
      description: Needs a more full description created.
  /datasets/{id}/blocks:
    get:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Gets The List Of Uploaded Blocks For This Dataset
      operationId: microsoftAzureDatasetsGetblocks
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedBlocks'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_3'
      x-ms-examples:
        Get uploaded blocks for dataset:
          $ref: ./examples/get_dataset_blocks.json
      description: Needs a more full description created.
    put:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Upload A Block Of Data For The Dataset The Maximum Size Of The Block Is 8mib
      operationId: microsoftAzureDatasetsUploadblock
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: blockid
        description: A valid Base64 string value that identifies the block. Prior to encoding, the string must be less than or equal to 64 bytes in size. For a given blob, the length of the value specified for the blockid parameter must be the same size for each block. Note that the Base64 string must be URL-encoded.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: The data block was uploaded successfully.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_3'
      x-ms-examples:
        Upload a block for a dataset:
          $ref: ./examples/upload_block.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
  /datasets/{id}/blocks:commit:
    post:
      tags:
      - 'Custom Speech Datasets for Model Adaptation:'
      summary: Microsoft Azure Commit Block List To Complete The Upload Of The Dataset
      operationId: microsoftAzureDatasetsCommitblocks
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The block list is accepted and the data import process can continue.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_3'
      x-ms-examples:
        Commit uploaded blocks to dataset:
          $ref: ./examples/commit_block_list.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CommitBlocksEntry'
        description: The list of blocks that compile the dataset.
        required: true
components:
  schemas:
    FileKind:
      title: FileKind
      description: Type of data.
      enum:
      - DatasetReport
      - Audio
      - LanguageData
      - PronunciationData
      - AcousticDataArchive
      - AcousticDataTranscriptionV2
      - Transcription
      - TranscriptionReport
      - EvaluationDetails
      type: string
      readOnly: true
      x-ms-enum:
        name: FileKind
        modelAsString: true
        values:
        - value: DatasetReport
          description: Type of data is dataset report.
        - value: Audio
          description: Type of data is audio.
        - value: LanguageData
          description: Type of data is language data.
        - value: PronunciationData
          description: Type of data is pronunciation data.
        - value: AcousticDataArchive
          description: Type of data is acoustic data archive.
        - value: AcousticDataTranscriptionV2
          description: Type of data is acoustic data transcription v2.
        - value: Transcription
          description: Type of data is transcription.
        - value: TranscriptionReport
          description: Type of data is transcription report.
        - value: EvaluationDetails
          description: Type of data is evaluation details.
    Error:
      title: Error
      description: The interface represents the content of an error response defined in the OneAPI v2.1 documentation.
      required:
      - code
      - message
      type: object
      properties:
        details:
          description: An array of details representing distinct related errors that occurred during the request.
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        innererror:
          $ref: '#/components/schemas/InnerErrorV2'
        code:
          description: 'A service-defined error code that should be human-readable.

            This code serves as a more specific indicator of the error than

            the HTTP error code specified in the response.'
          type: string
        message:
          description: 'A human-readable representation of the error. It is intended as

            an aid to developers and is not suitable for exposure to end users.'
          type: string
        target:
          description: The target of the particular error (e.g., the name of the property in error).
          type: string
    DatasetKind:
      title: DatasetKind
      description: Kind of data import.
      enum:
      - Language
      - Acoustic
      - Pronunciation
      type: string
      x-ms-enum:
        name: DatasetKind
        modelAsString: false
        values:
        - value: Language
          description: A language dataset.
        - value: Acoustic
          description: An acoustic dataset.
        - value: Pronunciation
          description: A pronunciation dataset.
    PaginatedFiles:
      title: PaginatedFiles
      type: object
      properties:
        values:
          description: "A list of entities limited by either the passed query parameters 'skip' and 'top' or their default values.\n            \nWhen iterating through a list using pagination and deleting entities in parallel, some entities will be skipped in the results.\nIt's recommended to build a list on the client and delete after the fetching of the complete list."
          type: array
          items:
            $ref: '#/components/schemas/File'
          readOnly: true
        '@nextLink':
          format: uri
          description: A link to the next set of paginated results if there are more entities available; otherwise null.
          type: string
          readOnly: true
    FileProperties:
      title: FileProperties
      type: object
      properties:
        size:
          format: int64
          description: The size of the data in bytes.
          type: integer
          readOnly: true
        duration:
          description: 'The duration in case this file is an audio file. The duration is encoded as ISO 8601

            duration ("PnYnMnDTnHnMnS", see https://en.wikipedia.org/wiki/ISO_8601#Durations).'
          type: string
          readOnly: true
    Dataset:
      title: Dataset
      required:
      - dataImportKind
      - id
      - locale
      - name
      type: object
      properties:
        id:
          format: uuid
          description: The identifier of this entity.
          type: string
        dataImportKind:
          $ref: '#/components/schemas/DatasetKind'
        name:
          description: The name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        properties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
        locale:
          description: The locale of the contained data.
          type: string
        lastActionDateTime:
          format: date-time
          description: 'The time-stamp when the current status was entered.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status'
        createdDateTime:
          format: date-time
          description: 'The time-stamp when the object was created.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
    ErrorCode:
      title: ErrorCode
      description: High level error codes.
      enum:
      - InvalidRequest
      - InvalidArgument
      - InternalServerError
      - ServiceUnavailable
      - NotFound
      - PipelineError
      - Conflict
      - InternalCommunicationFailed
      - Forbidden
      - NotAllowed
      - Unauthorized
      - UnsupportedMediaType
      - TooManyRequests
      - UnprocessableEntity
      type: string
      x-ms-enum:
        name: ErrorCode
        modelAsString: true
        values:
        - value: InvalidRequest
          description: Representing the invalid request error code.
        - value: InvalidArgument
          description: Representing the invalid argument error code.
        - value: InternalServerError
          description: Representing the internal server error error code.
        - value: ServiceUnavailable
          description: Representing the service unavailable error code.
        - value: NotFound
          description: Representing the not found error code.
        - value: PipelineError
          description: Representing the pipeline error error code.
        - value: Conflict
          description: Representing the conflict error code.
        - value: InternalCommunicationFailed
          description: Representing the internal communication failed error code.
        - value: Forbidden
          description: Representing the forbidden error code.
        - value: NotAllowed
          description: Representing the not allowed error code.
        - value: Unauthorized
          description: Representing the unauthorized error code.
        - value: UnsupportedMediaType
          description: Representing the unsupported media type error code.
        - value: TooManyRequests
          description: Representing the too many requests error code.
        - value: UnprocessableEntity
          description: Representing the unprocessable entity error code.
    InnerError:
      title: InnerError
      description: 'New Inner Error format which conforms to Cognitive Services API Guidelines which is available at https://microsoft.sharepoint.com/%3Aw%3A/t/CognitiveServicesPMO/EUoytcrjuJdKpeOKIK_QRC8BPtUYQpKBi8JsWyeDMRsWlQ?e=CPq8ow.

        This contains required properties ErrorCode, message and optional properties target, details(key value pair), inner error(this can be nested).'
      type: object
      properties:
        code:
          $ref: '#/components/schemas/DetailedErrorCode'
        details:
          description: Additional supportive details regarding the error and/or expected policies.
          type: object
          additionalProperties:
            type: string
        message:
          description: High level error message.
          type: string
        target:
          description: 'The source of the error.

            For example it would be "documents" or "document id" in case of invalid document.'
          type: string
        innerError:
          $ref: '#/components/schemas/InnerError'
    CommitBlocksEntry:
      title: CommitBlocksEntry
      description: Entry of the commit block list.
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/BlockKind'
        id:
          type: string
    DatasetUpdate:
      title: DatasetUpdate
      required:
      - name
      type: object
      properties:
        name:
          description: The name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
    EntityReference:
      title: EntityReference
      required:
      - self
      type: object
      properties:
        self:
          format: uri
          description: The location of the referenced entity.
          type: string
    EntityError:
      title: EntityError
      type: object
      properties:
        code:
          description: The code of this error.
          type: string
          readOnly: true
        message:
          description: The message for this error.
          type: string
          readOnly: true
    DetailedErrorCode:
      title: DetailedErrorCode
      description: Detailed error code enum.
      enum:
      - InvalidParameterValue
      - InvalidRequestBodyFormat
      - EmptyRequest
      - MissingInputRecords
      - InvalidDocument
      - ModelVersionIncorrect
      - InvalidDocumentBatch
      - UnsupportedLanguageCode
      - DataImportFailed
      - InUseViolation
      - InvalidLocale
      - InvalidBaseModel
      - InvalidAdaptationMapping
      - InvalidDataset
      - InvalidTest
      - FailedDataset
      - InvalidModel
      - InvalidTranscription
      - InvalidPayload
      - InvalidParameter
      - EndpointWithoutLogging
      - InvalidPermissions
      - InvalidPrerequisite
      - InvalidProductId
      - InvalidSubscription
      - InvalidProject
      - InvalidProjectKind
      - InvalidRecordingsUri
      - OnlyOneOfUrlsOrContainerOrDataset
      - ExceededNumberOfRecordingsUris
      - ModelMismatch
      - ProjectGenderMismatch
      - ModelDeprecated
      - ModelExists
      - ModelNotDeployable
      - EndpointNotUpdatable
      - SingleDefaultEndpoint
      - EndpointCannotBeDefault
      - InvalidModelUri
      - SubscriptionNotFound
      - QuotaViolation
      - UnsupportedDelta
      - UnsupportedFilter
      - UnsupportedPagination
      - UnsupportedDynamicConfiguration
      - UnsupportedOrderBy
      - NoUtf8WithBom
      - ModelDeploymentNotCompleteState
      - SkuLimitsExist
      - DeployingFailedModel
      - UnsupportedTimeRange
      - InvalidLogDate
      - InvalidLogId
      - InvalidLogStartTime
      - InvalidLogEndTime
      - InvalidTopForLogs
      - InvalidSkipTokenForLogs
      - DeleteNotAllowed
      - Forbidden
      - DeployNotAllowed
      - UnexpectedError
      - InvalidCollection
      - InvalidCallbackUri
      - InvalidSasValidityDuration
      - InaccessibleCustomerStorage
      - UnsupportedClassBasedAdaptation
      - InvalidWebHookEventKind
      - InvalidTimeToLive
      type: string
      x-ms-enum:
        name: DetailedErrorCode
        modelAsString: true
        values:
        - value: InvalidParameterValue
          description: Invalid parameter value.
        - value: InvalidRequestBodyFormat
          description: Invalid request body format.
        - value: EmptyRequest
          description: Empty Request.
        - value: MissingInputRecords
          description: Missing Input Records.
        - value: InvalidDocument
          description: Invalid Document.
        - value: ModelVersionIncorrect
          description: Model Version Incorrect.
        - value: InvalidDocumentBatch
          description: Invalid Document Batch.
        - value: UnsupportedLanguageCode
