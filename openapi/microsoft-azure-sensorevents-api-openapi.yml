openapi: 3.2.0
info:
  title: Microsoft Azure Sensor Events API
  version: '1.0'
  description: 'Operations tagged SensorEvents across 2 of this provider''s published API definitions: azure-agfoodplatform-data-plane-service-openapi-original.yml, microsoft-azure-data-manager-for-agriculture-data-plane-service-openapi-original.yml. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: SensorEvents
paths:
  /sensor-events:
    get:
      tags:
      - SensorEvents
      description: 'Returns a list of sensor events data. Time span for query is limited to 90 days at a time.

        Returns last 90 days events when startDateTime and endDateTime are not provided.'
      operationId: microsoftAzureSensoreventsList
      parameters:
      - in: query
        name: sensorId
        description: Id of the associated sensor.
        required: true
        schema:
          type: string
      - in: query
        name: sensorPartnerId
        description: Id of the associated sensor partner.
        required: true
        schema:
          type: string
      - in: query
        name: startDateTime
        description: 'Search span start time of sensor events (inclusive), sample format: yyyy-MM-ddTHH:mm:ssZ.

          It is truncated upto seconds if fraction is provided.'
        schema:
          type: string
          format: date-time
      - in: query
        name: endDateTime
        description: 'Search span end time of sensor events (inclusive), sample format: yyyy-MM-ddTHH:mm:ssZ.

          It is truncated upto seconds if fraction is provided.'
        schema:
          type: string
          format: date-time
      - in: query
        name: excludeDuplicateEvents
        description: 'Flag to exclude duplicate events and take the latest ones only (Default: true).'
        schema:
          type: boolean
          default: true
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorEventListResponse'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        SensorEvents_List:
          $ref: ./examples/SensorEvents_List.json
      summary: Microsoft Azure Get Sensor Events
