openapi: 3.2.0
info:
  title: Microsoft Azure Storage API
  version: '1.0'
  description: 'Operations tagged Storage across 2 of this provider''s published API definitions: aoa-front-end-apis-openapi-original.yml, keyvaultclient-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Storage
paths:
  /accounts/{accountId}/blobUploadEndpoint:
    get:
      tags:
      - Storage
      summary: Microsoft Azure Gets A Blob Upload Uri
      operationId: microsoftAzureBlobuploadendpointGet
      parameters:
      - $ref: '#/components/parameters/AccountIdParameter'
      - $ref: '#/components/parameters/ClientRequestCorrelationVectorParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          headers:
            ms-cv:
              description: The service response correlation vector, which will be a new value for every response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLocation'
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        BlobUploadEndpoint_Get:
          $ref: examples/GetBlobUploadEndpoint.json
      description: Needs a more full description created.
  /storage:
    get:
      tags:
      - Storage
      operationId: microsoftAzureGetstorageaccounts
      description: List storage accounts managed by the specified key vault. This operation requires the storage/list permission.
      parameters:
      - name: maxresults
        in: query
        required: false
        description: Maximum number of results to return in a page. If not specified the service will return up to 25 results.
        schema:
          type: integer
          format: int32
          maximum: 25
          minimum: 1
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: A response message containing a list of storage accounts along with a link to the next page of storage accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageListResult'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        List Storage account:
          $ref: ./examples/listStorageAccount.json
      summary: Microsoft Azure Get Storage
  /storage/{storage-account-name}/backup:
    post:
      tags:
      - Storage
      operationId: microsoftAzureBackupstorageaccount
      summary: Microsoft Azure Backs Up The Specified Storage Account
      description: Requests that a backup of the specified storage account be downloaded to the client. This operation requires the storage/backup permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The backup blob containing the backed up storage account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupStorageResult'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Backup Storage Account:
          $ref: ./examples/backupStorageAccount.json
  /storage/restore:
    post:
      tags:
      - Storage
      operationId: microsoftAzureRestorestorageaccount
      summary: Microsoft Azure Restores A Backed Up Storage Account To A Vault
      description: Restores a backed up storage account to a vault. This operation requires the storage/restore permission.
      parameters:
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Restored storage account bundle in the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBundle'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Restore Storage Account:
          $ref: ./examples/restoreStorageAccount.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageRestoreParameters'
        description: The parameters to restore the storage account.
        required: true
  /storage/{storage-account-name}:
    delete:
      tags:
      - Storage
      operationId: microsoftAzureDeletestorageaccount
      description: Deletes a storage account. This operation requires the storage/delete permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The deleted storage account and information on when the storage account will be deleted, and how to recover the deleted storage account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedStorageBundle'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Delete Storage account:
          $ref: ./examples/deleteStorageAccount.json
      summary: Microsoft Azure Delete Storage Storage Account Name
    get:
      tags:
      - Storage
      operationId: microsoftAzureGetstorageaccount
      description: Gets information about a specified storage account. This operation requires the storage/get permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The retrieved storage account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBundle'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Get Storage account:
          $ref: ./examples/getStorageAccount.json
      summary: Microsoft Azure Get Storage Storage Account Name
    put:
      tags:
      - Storage
      operationId: microsoftAzureSetstorageaccount
      description: Creates or updates a new storage account. This operation requires the storage/set permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account. The value you provide may be copied globally for the purpose of running the service. The value provided should not include personally identifiable or sensitive information.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The created storage account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBundle'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Set Storage account:
          $ref: ./examples/setStorageAccount.json
      summary: Microsoft Azure Put Storage Storage Account Name
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageAccountCreateParameters'
        description: The parameters to create a storage account.
        required: true
    patch:
      tags:
      - Storage
      operationId: microsoftAzureUpdatestorageaccount
      description: Updates the specified attributes associated with the given storage account. This operation requires the storage/set/update permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The updated storage account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBundle'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Update Storage account:
          $ref: ./examples/updateStorageAccount.json
      summary: Microsoft Azure Patch Storage Storage Account Name
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageAccountUpdateParameters'
        description: The parameters to update a storage account.
        required: true
  /storage/{storage-account-name}/regeneratekey:
    post:
      tags:
      - Storage
      operationId: microsoftAzureRegeneratestorageaccountkey
      description: Regenerates the specified key value for the given storage account. This operation requires the storage/regeneratekey permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The updated storage account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBundle'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Regenerate Storage account key:
          $ref: ./examples/regenerateStorageAccountKey.json
      summary: Microsoft Azure Post Storage Storage Account Name Regeneratekey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageAccountRegenerteKeyParameters'
        description: The parameters to regenerate storage account key.
        required: true
  /storage/{storage-account-name}/sas:
    get:
      tags:
      - Storage
      operationId: microsoftAzureGetsasdefinitions
      description: List storage SAS definitions for the given storage account. This operation requires the storage/listsas permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - name: maxresults
        in: query
        required: false
        description: Maximum number of results to return in a page. If not specified the service will return up to 25 results.
        schema:
          type: integer
          format: int32
          maximum: 25
          minimum: 1
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: A response message containing a list of SAS definitions along with a link to the next page of SAS definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SasDefinitionListResult'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        List Storage Sas Definition:
          $ref: ./examples/listStorageSasDefinition.json
      summary: Microsoft Azure Get Storage Storage Account Name Sas
  /storage/{storage-account-name}/sas/{sas-definition-name}:
    delete:
      tags:
      - Storage
      operationId: microsoftAzureDeletesasdefinition
      description: Deletes a SAS definition from a specified storage account. This operation requires the storage/deletesas permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - name: sas-definition-name
        in: path
        required: true
        description: The name of the SAS definition.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The deleted SAS definition and information on when the SAS definition will be deleted, and how to recover the deleted SAS definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedSasDefinitionBundle'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Delete Storage Sas Definition:
          $ref: ./examples/deleteStorageSasDefinition.json
      summary: Microsoft Azure Delete Storage Storage Account Name Sas Sas Definition Name
    get:
      tags:
      - Storage
      operationId: microsoftAzureGetsasdefinition
      description: Gets information about a SAS definition for the specified storage account. This operation requires the storage/getsas permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - name: sas-definition-name
        in: path
        required: true
        description: The name of the SAS definition.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The retrieved SAS definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SasDefinitionBundle'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Get Storage Sas Definition:
          $ref: ./examples/getStorageSasDefinition.json
      summary: Microsoft Azure Get Storage Storage Account Name Sas Sas Definition Name
    put:
      tags:
      - Storage
      operationId: microsoftAzureSetsasdefinition
      description: Creates or updates a new SAS definition for the specified storage account. This operation requires the storage/setsas permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - name: sas-definition-name
        in: path
        required: true
        description: The name of the SAS definition. The value you provide may be copied globally for the purpose of running the service. The value provided should not include personally identifiable or sensitive information.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The created SAS definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SasDefinitionBundle'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Set Storage Sas definition:
          $ref: ./examples/setStorageSasDefinition.json
      summary: Microsoft Azure Put Storage Storage Account Name Sas Sas Definition Name
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SasDefinitionCreateParameters'
        description: The parameters to create a SAS definition.
        required: true
    patch:
      tags:
      - Storage
      operationId: microsoftAzureUpdatesasdefinition
      description: Updates the specified attributes associated with the given SAS definition. This operation requires the storage/setsas permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - name: sas-definition-name
        in: path
        required: true
        description: The name of the SAS definition.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - $ref: common.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The updated SAS definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SasDefinitionBundle'
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: common.json#/definitions/KeyVaultError
      x-ms-examples:
        Update Storage Sas definition:
          $ref: ./examples/updateStorageSasDefinition.json
      summary: Microsoft Azure Patch Storage Storage Account Name Sas Sas Definition Name
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SasDefinitionUpdateParameters'
        description: The parameters to update a SAS definition.
        required: true
components:
  parameters:
    AccountIdParameter:
      in: path
      name: accountId
      description: Identifier for the Azure Object Anchors account.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        format: uuid
    ApiVersionParameter:
      in: query
      name: api-version
      description: The API version.
      required: true
      schema:
        type: string
    ClientRequestCorrelationVectorParameter:
      in: header
      name: x-mrc-cv
      description: The client request correlation vector, which should be set to a new value for each request.
      x-ms-parameter-location: method
      schema:
        type: string
  schemas:
    UploadLocation:
      description: Represents an upload location for model ingestion.
      required:
      - inputAssetUri
      type: object
      properties:
        inputAssetUri:
          format: uri
          description: The blob upload URI where a model should be uploaded to the service for ingestion.
          type: string
    InnerError:
      description: Inner error.
      type: object
      properties:
        code:
          description: A more specific error code than was provided by the containing error.
          type: string
        innererror:
          description: An object containing more specific information than the current object about the error.
          $ref: '#/components/schemas/InnerError'
    ErrorResponse:
      description: Represents an error response.
      required:
      - error
      type: object
      properties:
        error:
          description: The Error object.
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      description: Represents an error.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: The error code.
          type: string
        message:
          description: The error message.
          type: string
        target:
          description: The target of the error.
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        innererror:
          description: An object containing more specific information than the current object about the error.
          $ref: '#/components/schemas/InnerError'
    StorageAccountCreateParameters:
      properties:
        resourceId:
          type: string
          description: Storage account resource id.
        activeKeyName:
          type: string
          description: Current active storage account key name.
        autoRegenerateKey:
          type: boolean
          description: whether keyvault should manage the storage account for the user.
        regenerationPeriod:
          type: string
          description: The key regeneration time duration specified in ISO-8601 format.
        attributes:
          x-ms-client-name: StorageAccountAttributes
          $ref: '#/components/schemas/StorageAccountAttributes'
          description: The attributes of the storage account.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Application specific metadata in the form of key-value pairs.
      description: The storage account create parameters.
      required:
      - resourceId
      - activeKeyName
      - autoRegenerateKey
    StorageAccountRegenerteKeyParameters:
      properties:
        keyName:
          type: string
          description: The storage account key name.
      description: The storage account key regenerate parameters.
      required:
      - keyName
    SasDefinitionUpdateParameters:
      properties:
        templateUri:
          type: string
          description: The SAS definition token template signed with an arbitrary key.  Tokens created according to the SAS definition will have the same properties as the template.
        sasType:
          type: string
          description: The type of SAS token the SAS definition will create.
          enum:
          - account
          - service
          x-ms-enum:
            name: SasTokenType
            modelAsString: true
        validityPeriod:
          type: string
          description: The validity period of SAS tokens created according to the SAS definition.
        attributes:
          x-ms-client-name: SasDefinitionAttributes
          $ref: '#/components/schemas/SasDefinitionAttributes'
          description: The attributes of the SAS definition.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Application specific metadata in the form of key-value pairs.
      description: The SAS definition update parameters.
    SasDefinitionCreateParameters:
      properties:
        templateUri:
          type: string
          description: The SAS definition token template signed with an arbitrary key.  Tokens created according to the SAS definition will have the same properties as the template.
        sasType:
          type: string
          description: The type of SAS token the SAS definition will create.
          enum:
          - account
          - service
          x-ms-enum:
            name: SasTokenType
            modelAsString: true
        validityPeriod:
          type: string
          description: The validity period of SAS tokens created according to the SAS definition.
        attributes:
          x-ms-client-name: SasDefinitionAttributes
          $ref: '#/components/schemas/SasDefinitionAttributes'
          description: The attributes of the SAS definition.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Application specific metadata in the form of key-value pairs.
      description: The SAS definition create parameters.
      required:
      - templateUri
      - sasType
      - validityPeriod
    StorageBundle:
      properties:
        id:
          type: string
          description: The storage account id.
          readOnly: true
        resourceId:
          type: string
          description: The storage account resource id.
          readOnly: true
        activeKeyName:
          type: string
          description: The current active storage account key name.
          readOnly: true
        autoRegenerateKey:
          type: boolean
          description: whether keyvault should manage the storage account for the user.
          readOnly: true
        regenerationPeriod:
          type: string
          description: The key regeneration time duration specified in ISO-8601 format.
          readOnly: true
        attributes:
          $ref: '#/components/schemas/StorageAccountAttributes'
          description: The storage account attributes.
          readOnly: true
        tags:
          type: object
          additionalProperties:
            type: string
          description: Application specific metadata in the form of key-value pairs
          readOnly: true
      description: A Storage account bundle consists of key vault storage account details plus its attributes.
    DeletedSasDefinitionBundle:
      allOf:
      - $ref: '#/components/schemas/SasDefinitionBundle'
      properties:
        recoveryId:
          type: string
          description: The url of the recovery object, used to identify and recover the deleted SAS definition.
        scheduledPurgeDate:
          type: integer
          format: unixtime
          readOnly: true
          description: The time when the SAS definition is scheduled to be purged, in UTC
        deletedDate:
          type: integer
          format: unixtime
          readOnly: true
          description: The time when the SAS definition was deleted, in UTC
      description: A deleted SAS definition bundle consisting of its previous id, attributes and its tags, as well as information on when it will be purged.
    StorageRestoreParameters:
      properties:
        value:
          type: string
          x-ms-client-name: storageBundleBackup
          format: base64url
          description: The backup blob associated with a storage account.
      description: The secret restore parameters.
      required:
      - value
    BackupStorageResult:
      properties:
        value:
          type: string
          format: base64url
          readOnly: true
          description: The backup blob containing the backed up storage account.
      description: The backup storage result, containing the backup blob.
    StorageAccountItem:
      properties:
        id:
          type: string
          description: Storage identifier.
          readOnly: true
        resourceId:
          type: string
          description: Storage account resource Id.
          readOnly: true
        attributes:
          $ref: '#/components/schemas/StorageAccountAttributes'
          description: The storage account management attributes.
          readOnly: true
        tags:
          type: object
          additionalProperties:
            type: string
          description: Application specific metadata in the form of key-value pairs.
          readOnly: true
      description: The storage account item containing storage account metadata.
    SasDefinitionBundle:
      properties:
        id:
          type: string
          description: The SAS definition id.
          readOnly: true
        sid:
          x-ms-client-name: SecretId
          type: string
          description: Storage account SAS definition secret id.
          readOnly: true
        templateUri:
          type: string
          description: The SAS definition token template signed with an arbitrary key.  Tokens created according to the SAS definition will have the same properties as the template.
          readOnly: true
        sasType:
          type: string
          description: The type of SAS token the SAS definition will create.
          enum:
          - account
          - service
          x-ms-enum:
            name: SasTokenType
            modelAsString: true
          readOnly: true
        validityPeriod:
          type: string
          description: The validity period of SAS tokens created according to the SAS definition.
          readOnly: true
        attributes:
          $ref: '#/components/schemas/SasDefinitionAttributes'
          description: The SAS definition attributes.
          readOnly: true
        tags:
          type: object
          additionalProperties:
            type: string
          description: Application specific metadata in the form of key-value pairs
          readOnly: true
      description: A SAS definition bundle consists of key vault SAS definition details plus its attributes.
    SasDefinitionListResult:
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/SasDefinitionItem'
          readOnly: true
          description: A response message containing a list of SAS definitions along with a link to the next page of SAS definitions.
        nextLink:
          type: string
          readOnly: true
          description: The URL to get the next set of SAS definitions.
      description: The storage account SAS definition list result.
    StorageListResult:
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/StorageAccountItem'
          readOnly: true
          description: A response message containing a list of storage accounts in the key vault along with a link to the next page of storage accounts.
        nextLink:
          type: string
          readOnly: true
          description: The URL to get the next set of storage accounts.
      description: The storage accounts list result.
    SasDefinitionAttributes:
      properties:
        enabled:
          type: boolean
          description: the enabled state of the object.
        created:
          type: integer
          format: unixtime
          readOnly: true
          description: Creation time in UTC.
        updated:
          type: integer
          format: unixtime
          readOnly: true
