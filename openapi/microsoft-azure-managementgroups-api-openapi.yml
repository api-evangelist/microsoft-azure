openapi: 3.2.0
info:
  version: 2018-01-01-preview
  title: Microsoft Azure Management Groups API
  description: 'The Azure Management Groups API enables consolidation of multiple

    subscriptions/resources into an organizational hierarchy and centrally

    manage access control, policies, alerting and reporting for those resources.'
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
tags:
- name: ManagementGroups
  description: 'A Management Group is a customer defined scope (grouping mechanism) that

    provides access control (authorization), policy management and reporting.

    Management Groups are organized in a strictly tree-based hierarchy.'
paths:
  /providers/Microsoft.Management/managementGroups:
    get:
      tags:
      - ManagementGroups
      operationId: microsoftAzureManagementgroupsList
      description: List management groups for the authenticated user.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/CacheControlHeader'
      - $ref: '#/components/parameters/SkipTokenParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementGroupListResult'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        ListManagementGroups:
          $ref: ./examples/ListManagementGroups.json
      summary: Microsoft Azure Get Providers Microsoft Management Managementgroups
  /providers/Microsoft.Management/managementGroups/{groupId}:
    get:
      tags:
      - ManagementGroups
      operationId: microsoftAzureManagementgroupsGet
      description: Get the details of the management group.
      parameters:
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ExpandParameter'
      - $ref: '#/components/parameters/RecurseParameter'
      - $ref: '#/components/parameters/FilterParameter'
      - $ref: '#/components/parameters/CacheControlHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementGroup'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        GetManagementGroup:
          $ref: ./examples/GetManagementGroup.json
        GetManagementGroupWithExpand:
          $ref: ./examples/GetManagementGroupWithExpand.json
        GetManagementGroupsWithExpandAndRecurse:
          $ref: ./examples/GetManagementGroupWithExpandAndRecurse.json
      summary: Microsoft Azure Get Providers Microsoft Management Managementgroups Groupid
    put:
      tags:
      - ManagementGroups
      operationId: microsoftAzureManagementgroupsCreateorupdate
      description: 'Create or update a management group.

        If a management group is already created and a subsequent create request is issued with different properties, the management group properties will be updated.'
      parameters:
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/CacheControlHeader'
      - $ref: '#/components/parameters/CreateManagementGroupRequestParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementGroup'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResults'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        PutManagementGroup:
          $ref: ./examples/PutManagementGroup.json
      x-ms-long-running-operation: true
      summary: Microsoft Azure Put Providers Microsoft Management Managementgroups Groupid
    patch:
      tags:
      - ManagementGroups
      operationId: microsoftAzureManagementgroupsUpdate
      description: Update a management group.
      parameters:
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/CacheControlHeader'
      - $ref: '#/components/parameters/PatchGroupRequestParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementGroup'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        PatchManagementGroup:
          $ref: ./examples/PatchManagementGroup.json
      summary: Microsoft Azure Patch Providers Microsoft Management Managementgroups Groupid
    delete:
      tags:
      - ManagementGroups
      operationId: microsoftAzureManagementgroupsDelete
      description: 'Delete management group.

        If a management group contains child resources, the request will fail.'
      parameters:
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/CacheControlHeader'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResults'
        '204':
          description: NoContent
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        DeleteManagementGroup:
          $ref: ./examples/DeleteManagementGroup.json
      x-ms-long-running-operation: true
      summary: Microsoft Azure Delete Providers Microsoft Management Managementgroups Groupid
  /providers/Microsoft.Management/managementGroups/{groupId}/subscriptions/{subscriptionId}:
    put:
      tags:
      - ManagementGroups
      operationId: microsoftAzureManagementgroupsubscriptionsCreate
      description: Associates existing subscription with the management group.
      parameters:
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/CacheControlHeader'
      responses:
        '204':
          description: NoContent
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        AddSubscriptionToManagementGroup:
          $ref: ./examples/AddManagementGroupSubscription.json
      summary: Microsoft Azure Put Providers Microsoft Management Managementgroups Groupid…
    delete:
      tags:
      - ManagementGroups
      operationId: microsoftAzureManagementgroupsubscriptionsDelete
      description: De-associates subscription from the management group.
      parameters:
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/CacheControlHeader'
      responses:
        '204':
          description: NoContent
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        DeleteSubscriptionFromManagementGroup:
          $ref: ./examples/RemoveManagementGroupSubscription.json
      summary: Microsoft Azure Delete Providers Microsoft Management Managementgroups Groupid…
