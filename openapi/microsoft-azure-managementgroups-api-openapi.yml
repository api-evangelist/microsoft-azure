          readOnly: true
        type:
          type: string
          description: The type of the resource.  For example, /providers/Microsoft.Management/managementGroups
          readOnly: true
        name:
          type: string
          description: The name of the management group. For example, 00000000-0000-0000-0000-000000000000
        properties:
