openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Availability Sets API
tags:
- name: AvailabilitySets
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ScVmm/availabilitySets/{availabilitySetName}
  : get:
      tags:
      - AvailabilitySets
      operationId: microsoftAzureAvailabilitysetsGet
      summary: Microsoft Azure Gets An Availabilityset
      description: Implements AvailabilitySet GET method.
      x-ms-examples:
        GetAvailabilitySet:
          $ref: ./examples/GetAvailabilitySet.json
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - in: path
        name: availabilitySetName
        required: true
        description: Name of the AvailabilitySet.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Retrieves the AvailabilitySet resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySet'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - AvailabilitySets
      operationId: microsoftAzureAvailabilitysetsCreateorupdate
      description: Onboards the ScVmm availability set as an Azure resource.
      summary: Microsoft Azure Implements Availabilitysets Put Method
      x-ms-examples:
        CreateAvailabilitySet:
          $ref: ./examples/CreateAvailabilitySet.json
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - in: path
        name: availabilitySetName
        required: true
        description: Name of the AvailabilitySet.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Creates or Updates the AvailabilitySets resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySet'
        '201':
          description: Creates or Updates the AvailabilitySets resource.
          headers:
            Azure-AsyncOperation:
              description: Tracking URL for long running operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySet'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilitySet'
        description: Request payload.
        required: true
    delete:
      tags:
      - AvailabilitySets
      operationId: microsoftAzureAvailabilitysetsDelete
      description: Deregisters the ScVmm availability set from Azure.
      summary: Microsoft Azure Implements Availabilityset Delete Method
      x-ms-examples:
        DeleteAvailabilitySet:
          $ref: ./examples/DeleteAvailabilitySet.json
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - in: path
        name: availabilitySetName
        required: true
        description: Name of the AvailabilitySet.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - in: query
        name: force
        description: Forces the resource to be deleted from azure. The corresponding CR would be attempted to be deleted too.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Deletes the AvailabilitySets resource.
        '202':
          description: Accepted
          headers:
            Azure-AsyncOperation:
              description: Tracking URL for long running operation.
              schema:
                type: string
        '204':
          description: No Content
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
    patch:
      tags:
      - AvailabilitySets
      operationId: microsoftAzureAvailabilitysetsUpdate
      summary: Microsoft Azure Implements The Availabilitysets Patch Method
      description: Updates the AvailabilitySets resource.
      x-ms-examples:
        UpdateAvailabilitySet:
          $ref: ./examples/UpdateAvailabilitySet.json
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - in: path
        name: availabilitySetName
        required: true
        description: Name of the AvailabilitySet.
        schema:
          type: string
      responses:
        '200':
          description: Successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySet'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySet'
        '202':
          description: Accepted
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePatch'
        description: AvailabilitySets patch payload.
        required: true
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ScVmm/availabilitySets:
    get:
      tags:
      - AvailabilitySets
      operationId: microsoftAzureAvailabilitysetsListbyresourcegroup
      summary: Microsoft Azure Implements Get Availabilitysets In A Resource Group
      description: List of AvailabilitySets in a resource group.
      x-ms-examples:
        ListAvailabilitySetsByResourceGroup:
          $ref: ./examples/ListAvailabilitySetsByResourceGroup.json
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Lists all AvailabilitySets under the resource group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySetListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/providers/Microsoft.ScVmm/availabilitySets:
    get:
      tags:
      - AvailabilitySets
      operationId: microsoftAzureAvailabilitysetsListbysubscription
      summary: Microsoft Azure Implements Get Availabilitysets In A Subscription
      description: List of AvailabilitySets in a subscription.
      x-ms-examples:
        ListAvailabilitySetsBySubscription:
          $ref: ./examples/ListAvailabilitySetsBySubscription.json
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Lists all AvailabilitySets under the subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySetListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
components:
  schemas:
    ErrorResponse:
      description: Error response.
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDefinition'
          description: The error details.
    AvailabilitySetProperties:
      description: Defines the resource properties.
      type: object
      properties:
        availabilitySetName:
          type: string
          description: Name of the availability set.
          minLength: 1
        vmmServerId:
          type: string
          description: ARM Id of the vmmServer resource in which this resource resides.
        provisioningState:
          type: string
          description: Gets or sets the provisioning state.
          readOnly: true
    AvailabilitySetListResult:
      type: object
      description: List of AvailabilitySets.
      properties:
        value:
          type: array
          description: List of AvailabilitySets.
          items:
            $ref: '#/components/schemas/AvailabilitySet'
        nextLink:
          type: string
          description: Url to follow for getting next page of resources.
    ResourcePatch:
      type: object
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
          description: Resource tags.
      description: Object containing tags updates for patch operations.
    ErrorDefinition:
      description: Error definition.
      type: object
      properties:
        code:
          description: Service specific error code which serves as the substatus for the HTTP error code.
          type: string
          readOnly: true
        message:
          description: Description of the error.
          type: string
          readOnly: true
        details:
          description: Internal error details.
          type: array
          items:
            $ref: '#/components/schemas/ErrorDefinition'
          x-ms-identifiers: []
          readOnly: true
    AvailabilitySet:
      type: object
      x-ms-azure-resource: true
      properties:
        properties:
          x-ms-client-flatten: true
          description: Resource properties.
          $ref: '#/components/schemas/AvailabilitySetProperties'
        id:
          type: string
          readOnly: true
          description: Resource Id
        name:
          type: string
          readOnly: true
          description: Resource Name
        type:
          type: string
          readOnly: true
          description: Resource Type
        location:
          description: Gets or sets the location.
          type: string
          x-ms-mutability:
          - read
          - create
        tags:
          type: object
          additionalProperties:
            type: string
          description: Resource tags
        systemData:
          $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/systemData
          description: The system data.
        extendedLocation:
          $ref: '#/components/schemas/ExtendedLocation'
          description: The extended location.
      description: The AvailabilitySets resource definition.
    ExtendedLocation:
      type: object
      description: The extended location.
      properties:
        type:
          type: string
          description: The extended location type.
        name:
          type: string
          description: The extended location name.
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to be used with the HTTP request (e.g. YYYY-MM-DD).
      schema:
        type: string
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      description: The name of the resource group.
      x-ms-parameter-location: method
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The Azure subscription ID. This is a GUID-formatted string (e.g. 00000000-0000-0000-0000-000000000000).
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
