openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Get Metadata Information API
tags:
- name: Get Metadata Information
paths:
  /identity/info:
    get:
      tags:
      - Get Metadata Information
      description: Get information about AAD Metadata
      operationId: microsoftAzureIdentityGetinfo
      parameters:
      - $ref: '#/components/parameters/MetadataParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityInfoResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityErrorResponse'
      x-ms-examples:
        Get Identity Info for the VM:
          $ref: ./examples/GetIdentityInfo.json
      summary: Microsoft Azure Get Identity Info
components:
