      properties:
        tenantId:
          type: string
          description: This is the AAD tenantId of the identity of the system assigned managed identity.
    IdentityErrorResponse:
      type: object
      description: This is the response from an Identity operation in the case an error occurs.
      properties:
        error:
          type: string
          description: Error code
          enum:
          - invalid_request
          - unauthorized_client
          - access_denied
          - unsupported_response_type
          - invalid_scope
          - server_error
          - service_unavailable
          - bad_request
          - forbidden
          - not_found
          - method_not_allowed
          - too_many_requests
          x-ms-enum:
            name: Error
            modelAsString: true
        error_description:
          type: string
          description: Error message indicating why the operation failed.
  parameters:
    MetadataParameter:
      name: Metadata
      in: header
      description: This must be set to 'true'.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
