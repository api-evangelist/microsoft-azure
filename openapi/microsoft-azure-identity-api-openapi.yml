openapi: 3.2.0
info:
  title: Microsoft Azure CommunicationIdentityClient Identity API
  description: Azure Communication Identity Service
  version: 2021-02-22-preview1
tags:
- name: Identity
paths:
  /identities:
    post:
      tags:
      - Identity
      summary: Microsoft Azure Create A New Identity
      operationId: microsoftAzureCommunicationidentityCreate
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '201':
          description: Created - Returns the created identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationIdentityAccessTokenResult'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../Common/stable/2021-03-07/common.json#/definitions/CommunicationErrorResponse
      x-ms-examples:
        Create an Identity:
          $ref: ./examples/CreateIdentity.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunicationIdentityCreateRequest'
  /identities/{id}:
    delete:
      tags:
      - Identity
      summary: Microsoft Azure Delete The Identity, Revoke All Tokens For The Identity And…
      operationId: microsoftAzureCommunicationidentityDelete
      parameters:
      - in: path
        name: id
        description: Identifier of the identity to be deleted.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '204':
          description: Success
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../Common/stable/2021-03-07/common.json#/definitions/CommunicationErrorResponse
      x-ms-examples:
        Delete an identity:
          $ref: ./examples/DeleteIdentity.json
      description: Needs a more full description created.
  /identities/{id}/:revokeAccessTokens:
    post:
      tags:
      - Identity
      summary: Microsoft Azure Revoke All Access Tokens For The Specific Identity
      operationId: microsoftAzureCommunicationidentityRevokeaccesstokens
      parameters:
      - in: path
        name: id
        description: Identifier of the identity.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '204':
          description: Success
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../Common/stable/2021-03-07/common.json#/definitions/CommunicationErrorResponse
      x-ms-examples:
        Revoke access tokens:
          $ref: ./examples/RevokeAccessTokens.json
      description: Needs a more full description created.
components:
  schemas:
    CommunicationIdentityAccessTokenResult:
      description: A communication identity with access token.
      required:
      - identity
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/CommunicationIdentity'
        accessToken:
          $ref: '#/components/schemas/CommunicationIdentityAccessToken'
    CommunicationIdentityAccessToken:
      description: An access token.
      required:
      - expiresOn
      - token
      type: object
      properties:
        token:
          description: The access token issued for the identity.
          type: string
        expiresOn:
          format: date-time
          description: The expiry time of the token.
          type: string
    CommunicationIdentityTokenScope:
      description: List of scopes for an access token.
      enum:
      - chat
      - voip
      type: string
      x-ms-enum:
        name: CommunicationIdentityTokenScope
        modelAsString: true
    CommunicationIdentity:
      description: A communication identity.
      required:
      - id
      type: object
      properties:
        id:
          description: Identifier of the identity.
          type: string
    CommunicationIdentityCreateRequest:
      type: object
      properties:
        createTokenWithScopes:
          description: Also create access token for the created identity.
          type: array
          items:
            $ref: '#/components/schemas/CommunicationIdentityTokenScope'
  parameters:
    ApiVersionParameter:
      in: query
      name: api-version
      description: Version of API to invoke.
      required: true
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      flows:
        implicit:
          scopes:
            user_impersonation: impersonate your user account
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - name: endpoint
    description: The communication resource, for example https://my-resource.communication.azure.com
    required: true
    type: string
    in: path
    x-ms-skip-url-encoding: true
    x-ms-parameter-location: client
