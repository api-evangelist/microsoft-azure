openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Azureaccounts API
tags:
- name: Azureaccounts
paths:
  /azureaccounts:
    get:
      description: Gets the LUIS Azure accounts for the user using his ARM token.
      operationId: microsoftAzureAzureaccountsListuserluisaccounts
      summary: Microsoft Azure User  Get Luis Azure Accounts
      parameters:
      - $ref: '#/components/parameters/BearerAuthPath'
      - $ref: '#/components/parameters/ArmTokenParameter'
      responses:
        '200':
          description: A list of Azure account information objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureAccountInfoList'
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Successful Get azure accounts request:
          $ref: ./examples/stats/SuccessfulGetAzureAccountsRequest.json
      tags:
      - Azureaccounts
components:
  schemas:
    AzureAccountInfoObject:
      description: Defines the Azure account information object.
      type: object
      required:
      - azureSubscriptionId
      - resourceGroup
      - accountName
      properties:
        azureSubscriptionId:
          description: The id for the Azure subscription.
          type: string
        resourceGroup:
          description: The Azure resource group name.
          type: string
        accountName:
          description: The Azure account name.
          type: string
    ErrorResponse:
      description: Error response when invoking an operation on the API.
      type: object
      properties:
        errorType:
          type: string
      additionalProperties:
        type: object
    AzureAccountInfoList:
      description: List of Azure account info objects.
      type: array
      items:
        $ref: '#/components/schemas/AzureAccountInfoObject'
  parameters:
    BearerAuthPath:
      name: Authorization
      in: header
      description: The bearer authorization header to use; containing the user's ARM token used to validate Azure accounts information.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ArmTokenParameter:
      in: header
      name: ArmToken
      required: false
      description: The custom arm token header to use; containing the user's ARM token used to validate azure accounts information.
      x-ms-parameter-location: method
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
