            <li>102: Sexual Content</li>

            <li>201: Alcohol</li>

            <li>202: Tobacco</li>

            <li>203: Drugs</li>

            <li>301: Child Exploitation</li>

            <li>401: Violence</li>

            <li>402: Weapons</li>

            <li>403: Gore</li>

            <li>501: Profanity</li>

            <li>502: Vulgarity</li>

            </ul>.'
