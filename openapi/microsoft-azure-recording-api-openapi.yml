openapi: 3.2.0
info:
  version: 2021-06-15-preview
  title: Microsoft Azure Azure Communication CallingServer Service…
  description: Azure Communication CallingServer Service
tags:
- name: Recording
paths:
  /calling/serverCalls/{serverCallId}/recordings:
    post:
      tags:
      - Recording
      summary: Microsoft Azure Start Recording Of The Call
      operationId: microsoftAzureServercallsStartrecording
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Returns the start call recording response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartCallRecordingResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-ms-examples:
        Start recording of the call.:
          $ref: ./examples/ServerCalls_StartRecording.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCallRecordingRequest'
        description: The request body of start call recording request.
        required: true
  /calling/serverCalls/{serverCallId}/recordings/{recordingId}:
    get:
      tags:
      - Recording
      summary: Microsoft Azure Get Call Recording Properties
      operationId: microsoftAzureServercallsGetrecordingproperties
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - name: recordingId
        in: path
        description: The recording id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Returns the recording state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRecordingProperties'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-ms-examples:
        Get call recording properties.:
          $ref: ./examples/ServerCalls_GetRecordingProperties.json
      description: Needs a more full description created.
    delete:
      tags:
      - Recording
      summary: Microsoft Azure Stop Recording The Call
      operationId: microsoftAzureServercallsStoprecording
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - name: recordingId
        in: path
        description: The recording id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Returns the stop call recording response.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-ms-examples:
        Stop recording the call.:
          $ref: ./examples/ServerCalls_StopRecording.json
      description: Needs a more full description created.
  /calling/serverCalls/{serverCallId}/recordings/{recordingId}/:pause:
    post:
      tags:
      - Recording
      summary: Microsoft Azure Pause Recording The Call
      operationId: microsoftAzureServercallsPauserecording
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - name: recordingId
        in: path
        description: The recording id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Returns the pause call recording response.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-ms-examples:
        Pause recording the call.:
          $ref: ./examples/ServerCalls_PauseRecording.json
      description: Needs a more full description created.
  /calling/serverCalls/{serverCallId}/recordings/{recordingId}/:resume:
    post:
      tags:
      - Recording
      summary: Microsoft Azure Resume Recording The Call
      operationId: microsoftAzureServercallsResumerecording
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - name: recordingId
        in: path
        description: The recording id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Returns the resume call recording response.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-ms-examples:
        Resume recording the call.:
          $ref: ./examples/ServerCalls_ResumeRecording.json
      description: Needs a more full description created.
components:
  schemas:
    CallRecordingProperties:
      description: The response payload of get call recording properties operation.
      required:
      - recordingState
      type: object
      properties:
        recordingState:
          $ref: '#/components/schemas/CallRecordingState'
    CallRecordingState:
      description: The state of the recording
      enum:
      - active
      - inactive
      type: string
      x-ms-enum:
        name: CallRecordingState
        modelAsString: true
    StartCallRecordingRequest:
      description: The request payload start call recording operation.
      type: object
      properties:
        recordingStateCallbackUri:
          description: The uri to send notifications to.
          type: string
    StartCallRecordingResult:
      description: The response payload of start call recording operation.
      type: object
      properties:
        recordingId:
          description: The recording id of the started recording
          type: string
    CommunicationErrorResponse:
      $ref: ../../../Common/stable/2021-03-07/common.json#/definitions/CommunicationErrorResponse
  responses:
    '500':
      description: InternalServerError
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '403':
      description: Forbidden
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '401':
      description: Unauthorized
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '400':
      description: BadRequest
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '404':
      description: NotFound
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      description: Version of API to invoke.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
