components:
  schemas:
    AssociationProperties:
      type: object
      description: Association Properties.
      properties:
        associationType:
          $ref: '#/components/schemas/AssociationType'
          description: Association Type
        subnet:
          $ref: '#/components/schemas/AssociationSubnet'
          description: Association Subnet
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: Provisioning State of Traffic Controller Association Resource
          readOnly: true
      required:
      - associationType
    AssociationSubnetUpdate:
      type: object
      description: Association Subnet.
      properties:
        id:
          type: string
          description: Association ID.
    Association:
      type: object
      description: Association Subresource of Traffic Controller
      properties:
        properties:
          $ref: '#/components/schemas/AssociationProperties'
          description: The resource-specific properties for this resource.
          x-ms-client-flatten: true
          x-ms-mutability:
          - read
          - create
      allOf:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/TrackedResource
    AssociationSubnet:
      type: object
      description: Association Subnet.
      properties:
        id:
          type: string
          description: Association ID.
      required:
      - id
    AssociationType:
      type: string
      enum:
      - subnets
      x-ms-enum:
        name: AssociationType
        modelAsString: true
    AssociationUpdate:
      type: object
      description: The type used for update operations of the Association.
      properties:
        tags:
          type: object
          description: Resource tags.
          additionalProperties:
            type: string
        properties:
          $ref: '#/components/schemas/AssociationUpdateProperties'
          x-ms-client-flatten: true
    ProvisioningState:
      type: string
      enum:
      - Provisioning
      - Updating
      - Deleting
      - Accepted
      - Succeeded
      - Failed
      - Canceled
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
    AssociationListResult:
      type: object
      description: The response of a Association list operation.
      properties:
        value:
          type: array
          description: The Association items on this page
          items:
            $ref: '#/components/schemas/Association'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    AssociationUpdateProperties:
      type: object
      description: The updatable properties of the Association.
      properties:
        associationType:
          $ref: '#/components/schemas/AssociationType'
          description: Association Type
        subnet:
