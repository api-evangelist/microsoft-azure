openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Spark Session API
tags:
- name: SparkSession
paths:
  /sessions:
    get:
      tags:
      - SparkSession
      description: List all spark sessions which are running under a particular spark pool.
      operationId: microsoftAzureSparksessionGetsparksessions
      x-ms-examples:
        List all spark session jobs:
          $ref: ./examples/SparkFrontend_SparkSession_List.json
      parameters:
      - name: from
        in: query
        description: Optional param specifying which index the list should begin from.
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: "Optional param specifying the size of the returned list.\n            By default it is 20 and that is the maximum."
        required: false
        schema:
          type: integer
          format: int32
      - name: detailed
        in: query
        description: Optional query param specifying whether detailed response is returned beyond plain livy.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkSessionCollection'
      summary: Microsoft Azure Get Sessions
    post:
      tags:
      - SparkSession
      description: Create new spark session.
      operationId: microsoftAzureSparksessionCreatesparksession
      x-ms-examples:
        Create new spark session.:
          $ref: ./examples/SparkFrontend_SparkSession_Create.json
      parameters:
      - name: detailed
        in: query
        description: Optional query param specifying whether detailed response is returned beyond plain livy.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkSession'
      summary: Microsoft Azure Post Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SparkSessionOptions'
        description: Livy compatible batch job request payload.
        required: true
  /sessions/{sessionId}:
    get:
      tags:
      - SparkSession
      description: Gets a single spark session.
      operationId: microsoftAzureSparksessionGetsparksession
      x-ms-examples:
        Gets a single spark session.:
          $ref: ./examples/SparkFrontend_SparkSession_Get.json
      parameters:
      - name: sessionId
        in: path
        description: Identifier for the session.
        required: true
        schema:
          type: integer
          format: int32
      - name: detailed
        in: query
        description: Optional query param specifying whether detailed response is returned beyond plain livy.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkSession'
      summary: Microsoft Azure Get Sessions Sessionid
    delete:
      tags:
      - SparkSession
      description: Cancels a running spark session.
      operationId: microsoftAzureSparksessionCancelsparksession
      x-ms-examples:
        Cancels a running spark session.:
          $ref: ./examples/SparkFrontend_SparkSession_Delete.json
      parameters:
      - name: sessionId
        in: path
        description: Identifier for the session.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
      summary: Microsoft Azure Delete Sessions Sessionid
  /sessions/{sessionId}/reset-timeout:
    put:
      tags:
      - SparkSession
      description: Sends a keep alive call to the current session to reset the session timeout.
      operationId: microsoftAzureSparksessionResetsparksessiontimeout
      x-ms-examples:
        Reset the session timeout.:
          $ref: ./examples/SparkFrontend_SparkSession_ResetTimeout.json
      parameters:
      - name: sessionId
        in: path
        description: Identifier for the session.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
      summary: Microsoft Azure Put Sessions Sessionid Reset Timeout
  /sessions/{sessionId}/statements:
    get:
      tags:
      - SparkSession
      description: Gets a list of statements within a spark session.
      operationId: microsoftAzureSparksessionGetsparkstatements
      x-ms-examples:
        Gets a list of statements within a spark session.:
          $ref: ./examples/SparkFrontend_SparkSession_ListStatements.json
      parameters:
      - name: sessionId
        in: path
        description: Identifier for the session.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkStatementCollection'
      summary: Microsoft Azure Get Sessions Sessionid Statements
    post:
      tags:
      - SparkSession
      description: Create statement within a spark session.
      operationId: microsoftAzureSparksessionCreatesparkstatement
      x-ms-examples:
        Create statement within a spark session.:
          $ref: ./examples/SparkFrontend_SparkSession_CreateStatement.json
      parameters:
      - name: sessionId
        in: path
        description: Identifier for the session.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkStatement'
      summary: Microsoft Azure Post Sessions Sessionid Statements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SparkStatementOptions'
        description: Livy compatible batch job request payload.
        required: true
  /sessions/{sessionId}/statements/{statementId}:
    get:
      tags:
      - SparkSession
      description: Gets a single statement within a spark session.
      operationId: microsoftAzureSparksessionGetsparkstatement
      x-ms-examples:
        Gets a single statement within a spark session.:
          $ref: ./examples/SparkFrontend_SparkSession_GetStatement.json
      parameters:
      - name: sessionId
        in: path
        description: Identifier for the session.
        required: true
        schema:
          type: integer
          format: int32
      - name: statementId
        in: path
        description: Identifier for the statement.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkStatement'
      summary: Microsoft Azure Get Sessions Sessionid Statements Statementid
  /sessions/{sessionId}/statements/{statementId}/cancel:
    post:
      tags:
      - SparkSession
      description: Kill a statement within a session.
      operationId: microsoftAzureSparksessionCancelsparkstatement
      x-ms-examples:
        Kill a statement within a session.:
          $ref: ./examples/SparkFrontend_SparkSession_DeleteStatement.json
      parameters:
      - name: sessionId
        in: path
        description: Identifier for the session.
        required: true
        schema:
          type: integer
          format: int32
      - name: statementId
        in: path
        description: Identifier for the statement.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkStatementCancellationResult'
      summary: Microsoft Azure Post Sessions Sessionid Statements Statementid Cancel
components:
  schemas:
    SparkSessionOptions:
      type: object
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
        artifactId:
          type: string
        name:
          type: string
        file:
          type: string
        className:
          type: string
        args:
          x-ms-client-name: arguments
          uniqueItems: false
          type: array
          items:
            type: string
        jars:
          uniqueItems: false
          type: array
          items:
            type: string
        pyFiles:
          x-ms-client-name: pythonFiles
          uniqueItems: false
          type: array
          items:
            type: string
        files:
          uniqueItems: false
          type: array
          items:
            type: string
        archives:
          uniqueItems: false
          type: array
          items:
            type: string
        conf:
          x-ms-client-name: configuration
          type: object
          additionalProperties:
            type: string
        driverMemory:
          type: string
        driverCores:
          format: int32
          type: integer
        executorMemory:
          type: string
        executorCores:
          format: int32
          type: integer
        numExecutors:
          x-ms-client-name: executorCount
          format: int32
          type: integer
      required:
      - name
    SparkScheduler:
      type: object
      properties:
        submittedAt:
          format: date-time
          type:
          - string
          - 'null'
        scheduledAt:
          format: date-time
          type:
          - string
          - 'null'
        endedAt:
          format: date-time
          type:
          - string
          - 'null'
        cancellationRequestedAt:
          format: date-time
          type:
          - string
          - 'null'
        currentState:
          enum:
          - Queued
          - Scheduled
          - Ended
          x-ms-enum:
            name: SchedulerCurrentState
            modelAsString: true
          type: string
    SparkSessionState:
      type: object
      properties:
        notStartedAt:
          format: date-time
          type:
          - string
          - 'null'
        startingAt:
          format: date-time
          type:
          - string
          - 'null'
        idleAt:
          format: date-time
          type:
          - string
          - 'null'
        deadAt:
          format: date-time
          type:
          - string
          - 'null'
        shuttingDownAt:
          format: date-time
          type:
          - string
          - 'null'
        killedAt:
          x-ms-client-name: terminatedAt
          format: date-time
          type:
          - string
          - 'null'
        recoveringAt:
          format: date-time
          type:
          - string
          - 'null'
        busyAt:
          format: date-time
          type:
          - string
          - 'null'
        errorAt:
          format: date-time
          type:
          - string
          - 'null'
        currentState:
          type: string
        jobCreationRequest:
          $ref: '#/components/schemas/SparkRequest'
    SparkStatementOptions:
      type: object
      properties:
        code:
          type: string
        kind:
          enum:
          - spark
          - pyspark
          - dotnetspark
          - sql
          x-ms-enum:
            name: SparkStatementLanguageType
            modelAsString: true
            values:
            - name: Spark
              value: spark
            - name: PySpark
              value: pyspark
            - name: DotNetSpark
              value: dotnetspark
            - name: Sql
              value: sql
          type: string
    SparkServiceError:
      type: object
      properties:
        message:
          type: string
        errorCode:
          type: string
        source:
          enum:
          - System
          - User
          - Unknown
          - Dependency
          x-ms-enum:
            name: SparkErrorSource
            modelAsString: true
          type: string
    SparkStatementCollection:
      type: object
      properties:
        total_statements:
          x-ms-client-name: total
          format: int32
          type: integer
        statements:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/SparkStatement'
      required:
      - total_statements
    SparkServicePlugin:
      type: object
      properties:
        preparationStartedAt:
          format: date-time
          type:
          - string
          - 'null'
        resourceAcquisitionStartedAt:
          format: date-time
          type:
          - string
          - 'null'
        submissionStartedAt:
          format: date-time
          type:
          - string
          - 'null'
        monitoringStartedAt:
          format: date-time
          type:
          - string
          - 'null'
        cleanupStartedAt:
          format: date-time
          type:
          - string
          - 'null'
        currentState:
          enum:
          - Preparation
          - ResourceAcquisition
          - Queued
          - Submission
          - Monitoring
          - Cleanup
          - Ended
          x-ms-enum:
            name: PluginCurrentState
            modelAsString: true
          type: string
    SparkSessionCollection:
      type: object
      properties:
        from:
          format: int32
          type: integer
        total:
          format: int32
          type: integer
        sessions:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/SparkSession'
      required:
      - from
      - total
    SparkStatement:
      type: object
      properties:
        id:
          format: int32
          type: integer
        code:
          type: string
        state:
          type: string
        output:
          $ref: '#/components/schemas/SparkStatementOutput'
      required:
      - id
    SparkRequest:
      type: object
      properties:
        name:
          type: string
        file:
          type: string
        className:
          type: string
        args:
          x-ms-client-name: arguments
          uniqueItems: false
          type: array
          items:
            type: string
        jars:
          uniqueItems: false
          type: array
          items:
            type: string
        pyFiles:
          x-ms-client-name: pythonFiles
          uniqueItems: false
          type: array
          items:
            type: string
        files:
          uniqueItems: false
          type: array
          items:
            type: string
        archives:
          uniqueItems: false
          type: array
          items:
            type: string
        conf:
          x-ms-client-name: configuration
          type: object
          additionalProperties:
            type: string
        driverMemory:
          type: string
        driverCores:
          format: int32
          type: integer
        executorMemory:
          type: string
        executorCores:
          format: int32
          type: integer
        numExecutors:
          x-ms-client-name: executorCount
          format: int32
          type: integer
    SparkSession:
      type: object
      properties:
        livyInfo:
          $ref: '#/components/schemas/SparkSessionState'
        name:
          type: string
        workspaceName:
          type: string
        sparkPoolName:
          type: string
        submitterName:
          type: string
        submitterId:
          type: string
        artifactId:
          type: string
        jobType:
          enum:
          - SparkBatch
          - SparkSession
          x-ms-enum:
            name: SparkJobType
            modelAsString: true
          type: string
        result:
          enum:
          - Uncertain
          - Succeeded
          - Failed
          - Cancelled
          x-ms-enum:
            name: SparkSessionResultType
            modelAsString: true
          type: string
        schedulerInfo:
          x-ms-client-name: scheduler
          $ref: '#/components/schemas/SparkScheduler'
        pluginInfo:
          x-ms-client-name: plugin
          $ref: '#/components/schemas/SparkServicePlugin'
        errorInfo:
          x-ms-client-name: errors
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/SparkServiceError'
        tags:
          type: object
          additionalProperties:
            type: string
        id:
          format: int32
          type: integer
        appId:
          type:
          - string
          - 'null'
        appInfo:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        state:
          type: string
        log:
          x-ms-client-name: logLines
          uniqueItems: false
          type:
          - array
          - 'null'
          items:
            type: string
      required:
      - id
    SparkStatementCancellationResult:
      type: object
      properties:
        msg:
          type: string
          x-ms-client-name: message
          description: The msg property from the Livy API. The value is always "canceled".
    SparkStatementOutput:
      type: object
      properties:
        status:
          type: string
        execution_count:
          format: int32
          type: integer
        data:
          type: object
        ename:
          x-ms-client-name: errorName
          type:
          - string
          - 'null'
        evalue:
          x-ms-client-name: errorValue
          type:
          - string
          - 'null'
        traceback:
          uniqueItems: false
          type:
          - array
          - 'null'
          items:
            type: string
      required:
      - execution_count
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
