openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Data Connectors API
tags:
- name: DataConnectors
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.AgFoodPlatform/farmBeats/{dataManagerForAgricultureResourceName}/dataConnectors/{dataConnectorName}
  : get:
      tags:
      - DataConnectors
      description: Get specific Data Connector resource by DataConnectorName.
      operationId: microsoftAzureDataconnectorsGet
      parameters:
      - $ref: ../../../../../common-types/resource-management/v4/types.json#/parameters/ResourceGroupNameParameter
      - $ref: ../../../../../common-types/resource-management/v4/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/DataManagerForAgricultureResourceNameParameter'
      - in: path
        name: dataConnectorName
        description: Connector name.
        required: true
        schema:
          type: string
          maxLength: 63
          minLength: 1
      - $ref: ../../../../../common-types/resource-management/v4/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataConnector'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v4/types.json#/definitions/ErrorResponse
      x-ms-examples:
        DataConnectors_Get:
          $ref: ./examples/DataConnectors_Get.json
