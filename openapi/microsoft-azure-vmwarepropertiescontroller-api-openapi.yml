components:
  schemas:
    TagsMachineInput:
      type: object
      description: Machine class.
      properties:
        machineId:
          type: string
          description: Gets or sets the ARM id of the machine.
        tags:
          type: object
          description: run as AccountId
          additionalProperties:
            type: string
    DependencyMapMachineInput:
      type: object
      description: Machine class.
      properties:
        machineId:
          type: string
          description: Gets or sets the ARM id of the machine.
        isDependencyMapToBeEnabled:
          type: boolean
          description: "Gets or sets a value indicating whether\n            dependency mapping is to\nbe enabled or not."
    UpdateMachineTags:
      type: object
      description: "Defines class that represents input to update Tags on machine\n      \n      for cosmos entity operation."
      properties:
        machines:
          type: array
          description: Gets or sets the machine collection.
          items:
            $ref: '#/components/schemas/TagsMachineInput'
          x-ms-identifiers: []
    MachineMetadata:
      type: object
      description: The properties of Machine MetaData
      properties:
        machineArmId:
          type: string
          description: arm id of the machine.
        dependencyMapping:
          type: string
          description: value representing state of dependency mapping (enabled/disabled).
        tags:
          type: object
          description: machine tags
          additionalProperties:
            type: string
      required:
      - machineArmId
      - dependencyMapping
      - tags
    UpdateMachineRunAsAccount:
      type: object
      description: "Defines class that represents input to update RunAsAccount on machine\n      \n      for cosmos entity operation."
      properties:
        machines:
          type: array
          description: Gets or sets the machine collection.
          items:
            $ref: '#/components/schemas/RunAsAccountMachineInput'
          x-ms-identifiers: []
    MachineMetadataCollection:
      type: object
      description: The list of Machine MetaData.
      properties:
        value:
          type: array
          description: The list of Machine MetaData.
          items:
            $ref: '#/components/schemas/MachineMetadata'
          x-ms-identifiers: []
      required:
      - value
    RunAsAccountMachineInput:
      type: object
      description: Machine class.
      properties:
        machineId:
          type: string
          description: Gets or sets the ARM id of the machine.
        runAsAccountId:
          type: string
          description: run as AccountId
    UpdateMachineDepMapStatus:
      type: object
      description: "Defines class that represents input to enable or disable DMP on machine\n      \n      for cosmos entity operation."
      properties:
        machines:
          type: array
          description: Gets or sets the machine collection.
          items:
            $ref: '#/components/schemas/DependencyMapMachineInput'
          x-ms-identifiers: []
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
