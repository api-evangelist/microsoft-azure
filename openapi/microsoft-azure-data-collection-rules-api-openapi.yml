openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Data Collection Rules API
tags:
- name: Data Collection Rules
paths:
  /dataCollectionRules/{ruleId}/streams/{stream}:
    post:
      tags:
      - Data Collection Rules
      summary: Microsoft Azure Ingestion Api Used To Directly Ingest Data Using Data Collection Rules
      description: See error response code and error response message for more detail.
      operationId: microsoftAzureUpload
      parameters:
      - in: path
        name: ruleId
        description: The immutable Id of the Data Collection Rule resource.
        required: true
        schema:
          type: string
      - in: path
        name: stream
        description: The streamDeclaration name as defined in the Data Collection Rule.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
      - in: header
        name: Content-Encoding
        description: gzip
        schema:
          type: string
      - in: header
        name: x-ms-client-request-id
        description: Client request Id
        schema:
          type: string
      x-ms-examples:
        postIngestUsingDataCollectionRule:
          $ref: ./examples/post_IngestUsingDataCollectionRule.json
      responses:
        '204':
          description: Ingestion request accepted
        default:
          description: An error response object.
          headers:
            x-ms-error-code:
              description: A value that indicates the ingestion service error code.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/data-plane/v1/types.json#/definitions/ErrorResponse
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
        description: An array of objects matching the schema defined by the provided stream.
        required: true
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
