openapi: 3.2.0
info:
  title: Microsoft Azure Purview self-service Policies REST API…
  version: 2022-12-01-preview
servers:
- url: /policyStore
security:
- azure_auth:
  - user_impersonation
tags:
- name: SelfServicePolicies
paths:
  /self-service-policies:
    get:
      tags:
      - SelfServicePolicies
      description: List Self-service policies
      operationId: microsoftAzureSelfservicepoliciesList
      parameters:
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfServicePoliciesList'
        default:
          description: An error response received from the Policy Service
          headers:
            x-ms-error-code:
              description: The error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
      x-ms-examples:
        SelfServicePolicy_List:
          $ref: ./examples/SelfServicePolicy_List.json
      summary: Microsoft Azure Get Self Service Policies
  /self-service-policies/{policyId}:
    get:
      tags:
      - SelfServicePolicies
      description: Get Self-service policy
      operationId: microsoftAzureSelfservicepoliciesGet
      parameters:
      - in: path
        name: policyId
        description: The policyId of the self-service policy.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfServicePolicy'
        default:
          description: An error response received from the Policy Service
          headers:
            x-ms-error-code:
              description: The error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-ms-examples:
        SelfServicePolicy_Get:
          $ref: ./examples/SelfServicePolicy_Get.json
      summary: Microsoft Azure Get Self Service Policies Policyid
    delete:
      tags:
      - SelfServicePolicies
      description: Delete a Self-service policy
      operationId: microsoftAzureSelfservicepoliciesDelete
      parameters:
      - in: path
        name: policyId
        description: The policyId of the self-service policy.
        required: true
        schema:
          type: string
          maxLength: 100
      - $ref: '#/components/parameters/api-version'
      responses:
        '204':
          description: No Content
        default:
          description: An error response received from the Policy Service
          headers:
            x-ms-error-code:
              description: The error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-ms-examples:
        SelfServicePolicy_Delete:
          $ref: ./examples/SelfServicePolicy_Delete.json
      summary: Microsoft Azure Delete Self Service Policies Policyid
components:
  schemas:
    SystemData:
      type: object
      description: The system data
      properties:
        createdBy:
          type: string
          description: Created by
        createdAt:
          format: date-time
          type: string
          description: Created at
        lastModifiedBy:
          type: string
          description: last modified by
        lastModifiedAt:
          format: date-time
          type: string
          description: last modified at
    ErrorModel:
      description: The error model for policy
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: The error code
          minLength: 1
          type: string
        message:
          description: The error message
          minLength: 1
          type: string
        details:
          description: The error details
          type: array
          items:
            $ref: '#/components/schemas/ErrorModel'
    SelfServicePolicy:
      description: The Self-service policy model
      required:
      - decisionRule
      - policyId
      type: object
      properties:
        policyId:
          type: string
          description: The policyId of the self-service policy
        requestor:
          type: string
          description: The requestor of the self-service policy
        expiresAt:
          format: date-time
          type: string
          description: Expiry Date of the policy
        decisionRule:
          $ref: '#/components/schemas/SelfServicePolicyDecisionRule'
        systemData:
          $ref: '#/components/schemas/SystemData'
    ErrorResponseModel:
      description: The error response model for policy
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorModel'
    SelfServicePolicyDecisionRule:
      type: object
      description: The decision rule of a SelfServicePolicy
      required:
      - effect
      - purviewRoleName
      - resourceAzurePath
      properties:
        effect:
          description: The effect for rule
          enum:
          - Permit
          type: string
          x-ms-enum:
            name: Decision
            modelAsString: true
        purviewRoleName:
          type: string
          description: This is field will indicate the role of a self service policy.
        principals:
          type: array
          description: Azure Active Directory Ids for users
          items:
            type: string
            description: Azure Active Directory Id
        principalGroups:
          type: array
          description: Azure Active Directory Ids for groups
          items:
            type: string
            description: Azure Active Directory Id
        resourceAzurePath:
          type: string
          description: The resource path of the azure resource
    SelfServicePoliciesList:
      description: List of Self-service policies
      required:
      - value
      type: object
      properties:
        value:
          type: array
          description: List of policies
          items:
            $ref: '#/components/schemas/SelfServicePolicy'
        nextLink:
          type: string
          description: Pagination link
  parameters:
    api-version:
      in: query
      name: api-version
      description: The api version to use.
      required: true
      x-ms-client-name: ApiVersion
      x-ms-parameter-location: client
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      flows:
        implicit:
          scopes:
            user_impersonation: impersonate your user account
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
      description: Azure Active Directory OAuth2 Flow.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/endpoint'
