          type: string
      - name: networkName
        in: path
        description: Primary network name.
        required: true
        schema:
          type: string
      - name: networkMappingName
        in: path
        description: Network mapping name.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkMapping'
        '202':
          description: Accepted
      x-ms-long-running-operation: true
      x-ms-examples:
        Creates network mapping.:
          $ref: ./examples/ReplicationNetworkMappings_Create.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNetworkMappingInput'
