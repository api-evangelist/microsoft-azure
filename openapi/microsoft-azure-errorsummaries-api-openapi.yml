openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Error Summaries API
tags:
- name: ErrorSummaries
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.OffAzureSpringBoot/springbootsites/{siteName}/errorSummaries/{errorSummaryName}
  : get:
      tags:
      - ErrorSummaries
      operationId: microsoftAzureErrorsummariesGet
      summary: Microsoft Azure Implements Errorsummaries Get Method
      description: Gets the ErrorSummaries resource.
      x-ms-examples:
        ErrorSummaries_Get_MaximumSet_Gen:
          $ref: ./examples/ErrorSummaries_Get_MaximumSet_Gen.json
        ErrorSummaries_Get_MinimumSet_Gen:
          $ref: ./examples/ErrorSummaries_Get_MinimumSet_Gen.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/SiteNameParameter'
      - $ref: '#/components/parameters/errorSummaryNameParameter'
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Retrieves the ErrorSummaries resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSummary'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ErrorResponse
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.OffAzureSpringBoot/springbootsites/{siteName}/errorSummaries
  : get:
      tags:
      - ErrorSummaries
      operationId: microsoftAzureErrorsummariesListbysite
      summary: Microsoft Azure Implements Errorsummaries Get Method
      description: Lists the ErrorSummaries resource in springbootsites.
      x-ms-examples:
        ErrorSummaries_ListBySite_MaximumSet_Gen:
          $ref: ./examples/ErrorSummaries_ListBySite_MaximumSet_Gen.json
        ErrorSummaries_ListBySite_MinimumSet_Gen:
          $ref: ./examples/ErrorSummaries_ListBySite_MinimumSet_Gen.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/SiteNameParameter'
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Retrieves the ErrorSummaries resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSummaryList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ErrorResponse
      x-ms-pageable:
        nextLinkName: nextLink
components:
  parameters:
    SiteNameParameter:
      x-ms-parameter-location: method
      name: siteName
      in: path
      required: true
      description: The springbootsites name.
      schema:
        type: string
        maxLength: 64
        minLength: 3
        pattern: ^[a-z][a-z0-9-]*$
    errorSummaryNameParameter:
      x-ms-parameter-location: method
      name: errorSummaryName
      in: path
      required: true
      description: The name of error summary
      schema:
        type: string
        maxLength: 63
        minLength: 3
        pattern: ^[A-Za-z][A-Za-z0-9]*$
  schemas:
    Error:
      type: object
      description: Defines the error.
      properties:
        id:
          description: The error ID.
          type: integer
          format: int64
        code:
          description: The error code.
          type: string
        summaryMessage:
          description: The summarized error message.
          type: string
        runAsAccountId:
          description: The account ID used to login.
          type: string
        message:
          description: The detailed error message.
          type: string
        possibleCauses:
          description: The error possible causes.
          type: string
        recommendedAction:
          description: The error recommended action
          type: string
        severity:
          description: The error severity
          type: string
        updatedTimeStamp:
          description: Time when this error was last updated.
          type: string
          format: date-time
    ErrorSummariesProperties:
      type: object
      description: Error summary properties
      properties:
        discoveryScopeErrorSummaries:
          description: The list of ErrorSummary.
          type: array
          x-ms-identifiers: []
          items:
            description: The error
            $ref: '#/components/schemas/ErrorSummaryModel'
        errors:
          description: The list of errors.
          type: array
          items:
            description: The error
            $ref: '#/components/schemas/Error'
        provisioningState:
          type: string
          description: The resource provisioning state.
          enum:
          - Unknown
          - Succeeded
          - Failed
          - Canceled
          - Accepted
          - Provisioning
          - Deleting
          x-ms-enum:
            name: ProvisioningState
            modelAsString: true
    ErrorSummaryModel:
      type: object
      description: ErrorSummary model.
      properties:
        affectedResourceType:
          type: string
          description: The type of Object.
        affectedObjectsCount:
          type: integer
          description: The count.
          format: int64
    ErrorSummary:
      type: object
      x-ms-azure-resource: true
      allOf:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ProxyResource
      properties:
        properties:
          description: Resource properties.
          $ref: '#/components/schemas/ErrorSummariesProperties'
        tags:
          type: object
          additionalProperties:
            type: string
          description: Resource tags
      description: The error summary resource definition.
    ErrorSummaryList:
      type: object
      description: The list of ErrorSummary.
      properties:
        value:
          type: array
          description: The list of ErrorSummary.
          items:
            $ref: '#/components/schemas/ErrorSummary'
        nextLink:
          type: string
          description: Url to follow for getting next page of resources.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
