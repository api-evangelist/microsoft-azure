      x-ms-examples:
        ShareSubscriptions_Delete:
          $ref: ./examples/ShareSubscriptions_Delete.json
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataShare/accounts/{accountName}/shareSubscriptions
  : get:
