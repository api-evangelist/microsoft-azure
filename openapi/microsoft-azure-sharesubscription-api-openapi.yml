          $ref: ./examples/ShareSubscriptions_Get.json
    put:
      tags:
      - ShareSubscription
      summary: Microsoft Azure Create Sharesubscription In An Account
      description: Create a shareSubscription in an account
      operationId: microsoftAzureSharesubscriptionsCreate
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      - $ref: '#/components/parameters/resourceGroupName'
      - $ref: '#/components/parameters/accountName'
      - name: shareSubscriptionName
        in: path
        description: The name of the shareSubscription.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareSubscription'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareSubscription'
        default:
          description: An error response received from the Microsoft.DataShare resource provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataShareError'
      x-ms-examples:
        ShareSubscriptions_Create:
          $ref: ./examples/ShareSubscriptions_Create.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareSubscription'
        description: create parameters for shareSubscription
        required: true
    delete:
      tags:
      - ShareSubscription
      summary: Microsoft Azure Delete Sharesubscription In An Account
      description: Delete a shareSubscription in an account
      operationId: microsoftAzureSharesubscriptionsDelete
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      - $ref: '#/components/parameters/resourceGroupName'
      - $ref: '#/components/parameters/accountName'
      - name: shareSubscriptionName
        in: path
        description: The name of the shareSubscription.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '202':
          description: Accepted
        '204':
          description: Success
        default:
          description: An error response received from the Microsoft.DataShare resource provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataShareError'
