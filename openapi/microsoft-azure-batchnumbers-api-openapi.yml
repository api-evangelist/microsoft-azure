                - rejected
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchNumbers_2'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        Create or update Numbers.:
          $ref: ./examples/PostAccountNumbersBatch.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchNumbers_2'
        required: true
      security:
      - OAuth2Auth:
        - https://func-voiceservice-rp-prod-eastuseuap.azurewebsites.net/.default
