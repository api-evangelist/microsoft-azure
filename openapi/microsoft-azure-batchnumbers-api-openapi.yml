info:
  title: Microsoft Azure Batch Numbers API
  x-refined-note:
  - x-typespec-generated differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged BatchNumbers across 2 of this provider''s published API definitions: microsoftvoiceservicesacgprovisioningplatformapi-openapi-original.yml, microsoftvoiceservicesprovisioning-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: BatchNumbers
paths:
  /account/{accountName}/numbers:batch:
    post:
      operationId: microsoftAzureAccountCreateorreplacenumbers
      parameters:
      - in: path
        name: accountName
        required: true
        description: Name of the account. Can only contain letters, numbers, underscores and dashes, and is case-sensitive. Can be up to 100 characters in length.
        schema:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^([A-Za-z0-9_-]+)$
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchNumbersResponse'
        default:
          description: An error response object.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Batch put numbers.:
          $ref: ./examples/BatchPutNumbers.json
      tags:
      - BatchNumbers
      description: Adds or replaces between 1 and 100 numbers (inclusive) in the specified account. In the body, specify a list of phone numbers and and the corresponding details (for example, the services to enable) for each number. This operation is atomic; if any item fails, then all items fail.
      summary: Microsoft Azure Post Account Accountname Numbers:batch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchNumbers'
        description: Batch of numbers to create or replace.
        required: true
      security:
      - OAuth2:
        - https://func-voiceservice-rp-prod-eastuseuap.azurewebsites.net/.default
  /accounts/{accountName}:createOrUpdateNumbers:
    post:
      operationId: microsoftAzureAccountsCreateorupdatenumbers
      tags:
      - BatchNumbers
      summary: Microsoft Azure Create Or Update Numbers
      description: Create or update up to 100 Numbers on the specified account.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: accountName
        in: path
        description: Name of the account.
        required: true
        schema:
