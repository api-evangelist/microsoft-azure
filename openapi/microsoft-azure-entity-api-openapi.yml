  /atlas/v2/entity/uniqueAttribute/type/{typeName}:
    get:
      tags:
      - Entity
      description: 'Get complete definition of an entity given its type and unique attribute.

        In addition to the typeName path parameter, attribute key-value pair(s) can be provided in the following format:

        attr:\=.

        NOTE: The attrName and attrValue should be unique across entities, eg. qualifiedName.

        The REST request would look something like this:

        GET /v2/entity/uniqueAttribute/type/aType?attr:aTypeAttribute=someValue.'
      operationId: microsoftAzureEntityGetbyuniqueattributes
      x-ms-examples:
        Entity_GetByUniqueAttributes:
          $ref: ./examples/Entity_GetByUniqueAttributes.json
      parameters:
      - $ref: '#/components/parameters/typeName'
      - $ref: '#/components/parameters/minExtInfo'
      - $ref: '#/components/parameters/ignoreRelationships'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName can be changed to other unique attributes)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: AtlasEntityWithExtInfo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntityWithExtInfo'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Get Atlas Entity Uniqueattribute Type Typename
      security:
      - azure_auth:
        - user_impersonation
    put:
      tags:
      - Entity
      description: 'Update entity partially - Allow a subset of attributes to be updated on

        an entity which is identified by its type and unique attribute eg: Referenceable.qualifiedName.

        Null updates are not possible.

        In addition to the typeName path parameter, attribute key-value pair(s) can be provided in the following format:

        attr:=.

        NOTE: The attrName and attrValue should be unique across entities, eg. qualifiedName.

        The REST request would look something like this:

        PUT /v2/entity/uniqueAttribute/type/aType?attr:aTypeAttribute=someValue.'
      operationId: microsoftAzureEntityPartialupdateentitybyuniqueattributes
      x-ms-examples:
        Entity_PartialUpdateEntityByUniqueAttributes:
          $ref: ./examples/Entity_PartialUpdateEntityByUniqueAttributes.json
      parameters:
      - $ref: '#/components/parameters/typeName'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName can be changed to other unique attributes)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Updated with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Put Atlas Entity Uniqueattribute Type Typename
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasEntityWithExtInfo'
        description: Atlas entity with extended information.
        required: true
      security:
      - azure_auth:
        - user_impersonation
    delete:
      tags:
      - Entity
      description: 'Delete an entity identified by its type and unique attributes.

        In addition to the typeName path parameter, attribute key-value pair(s) can be provided in the following format:

        attr:\=\.

        NOTE: The attrName and attrValue should be unique across entities, eg. qualifiedName.

        The REST request would look something like this:

        DELETE /v2/entity/uniqueAttribute/type/aType?attr:aTypeAttribute=someValue.'
      operationId: microsoftAzureEntityDeletebyuniqueattribute
      x-ms-examples:
        Entity_DeleteByUniqueAttribute:
          $ref: ./examples/Entity_DeleteByUniqueAttribute.json
      parameters:
      - $ref: '#/components/parameters/typeName'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName can be changed to other unique attributes)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Deleted with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Delete Atlas Entity Uniqueattribute Type Typename
