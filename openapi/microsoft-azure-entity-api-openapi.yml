openapi: 3.2.0
info:
  title: Microsoft Azure Entity API
  x-refined-note:
  - x-typespec-generated differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Entity across 3 of this provider''s published API definitions: azure-analytics-purview-data-map-openapi-original.yml, purview-catalog-service-rest-api-document-openapi-original.yml, purview-data-map-service-rest-api-document-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /catalog/api
- url: /datamap/api
tags:
- name: Entity
paths:
  /entity/moveTo:
    post:
      operationId: microsoftAzureEntityMoveentitiestocollection
      description: Move existing entities to the target collection.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: collectionId
        in: query
        description: The collection where entities will be moved to.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Entity_MoveEntitiesToCollection:
          $ref: ./examples/Entity_MoveEntitiesToCollection.json
      summary: Microsoft Azure Post Entity Moveto
      tags:
      - Entity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveEntitiesOptions'
        required: true
      security:
      - OAuth2Auth:
        - https://purview.azure.net/.default
  /atlas/v2/entity:
    post:
      tags:
      - Entity
      description: 'Create or update an entity in Atlas.

        Existing entity is matched using its unique guid if supplied or by its unique attributes eg: qualifiedName.

        Map and array of collections are not well supported. E.g., array>, array>.

        For each contact type, the maximum number of contacts is 20.'
      operationId: microsoftAzureEntityCreateorupdate
      x-ms-examples:
        Entity_Create:
          $ref: ./examples/Entity_Create.json
        Entity_Update:
          $ref: ./examples/Entity_Update.json
        Entity_AddCustomAttribute:
          $ref: ./examples/Entity_CustomAttribute.json
      parameters:
      - $ref: '#/components/parameters/businessAttributeUpdateBehavior'
      responses:
        '200':
          description: Created with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Post Atlas Entity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasEntityWithExtInfo'
        description: Atlas entity with extended information.
        required: true
      security:
      - azure_auth:
        - user_impersonation
    servers:
    - url: /catalog/api
  /atlas/v2/entity/bulk:
    get:
      tags:
      - Entity
      description: List entities in bulk identified by its GUIDs.
      operationId: microsoftAzureEntityListbyguids
      x-ms-examples:
        Entity_ListByGuids:
          $ref: ./examples/Entity_ListByGuids.json
      parameters:
      - name: guid
        in: query
        description: An array of GUIDs of entities to list.
        required: true
        x-ms-client-name: guids
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/minExtInfo'
      - $ref: '#/components/parameters/ignoreRelationships'
      - $ref: '#/components/parameters/excludeRelationshipTypes'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Get Atlas Entity Bulk
      security:
      - azure_auth:
        - user_impersonation
    post:
      tags:
      - Entity
      description: 'Create or update entities in Atlas in bulk.

        Existing entity is matched using its unique guid if supplied or by its unique attributes eg: qualifiedName.

        Map and array of collections are not well supported. E.g., array>, array>.

        For each contact type, the maximum number of contacts is 20.'
      operationId: microsoftAzureEntityCreateorupdateentities
      x-ms-examples:
        Entity_CreateOrUpdateEntities:
          $ref: ./examples/Entity_CreateOrUpdateEntities.json
      parameters:
      - $ref: '#/components/parameters/businessAttributeUpdateBehavior'
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Post Atlas Entity Bulk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        description: An array of entities to create or update.
        required: true
      security:
      - azure_auth:
        - user_impersonation
    delete:
      tags:
      - Entity
      description: Delete a list of entities in bulk identified by their GUIDs or unique attributes.
      operationId: microsoftAzureEntityDeletebyguids
      x-ms-examples:
        Entity_DeleteByGuids:
          $ref: ./examples/Entity_DeleteByGuids.json
      parameters:
      - name: guid
        in: query
        description: An array of GUIDs of entities to delete.
        required: true
        x-ms-client-name: guids
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Deleted with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Delete Atlas Entity Bulk
      security:
      - azure_auth:
        - user_impersonation
    servers:
    - url: /catalog/api
  /atlas/v2/entity/bulk/classification:
    post:
      tags:
