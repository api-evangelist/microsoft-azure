      - azure_auth:
        - user_impersonation
    put:
      tags:
      - Entity
      description: 'Update entity partially - create or update entity attribute identified by its GUID.

        Supports only primitive attribute type and entity references.

        It does not support updating complex types like arrays, and maps.

        Null updates are not possible.'
      operationId: microsoftAzureEntityPartialupdateentityattributebyguid
      x-ms-examples:
        Entity_PartialUpdateEntityAttributeByGuid:
          $ref: ./examples/Entity_PartialUpdateEntityAttributeByGuid.json
      parameters:
      - $ref: '#/components/parameters/guid'
      - name: name
