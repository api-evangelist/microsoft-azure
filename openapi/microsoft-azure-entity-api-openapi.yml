          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Delete Atlas Entity Guid Guid
      security:
      - azure_auth:
        - user_impersonation
    servers:
    - url: /catalog/api
