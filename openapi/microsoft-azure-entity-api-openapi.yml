        description: The name of the attribute.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Put Atlas Entity Guid Guid
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: The value of the attribute.
        required: true
      security:
      - azure_auth:
        - user_impersonation
    delete:
      tags:
      - Entity
      description: Delete an entity identified by its GUID.
      operationId: microsoftAzureEntityDeletebyguid
      x-ms-examples:
        Entity_DeleteByGuid:
          $ref: ./examples/Entity_DeleteByGuid.json
      parameters:
      - $ref: '#/components/parameters/guid'
      responses:
        '200':
          description: Deleted with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
