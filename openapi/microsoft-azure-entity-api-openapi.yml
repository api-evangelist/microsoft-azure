  /atlas/v2/entity/bulk/uniqueAttribute/type/{typeName}:
    get:
      tags:
      - Entity
      description: 'Bulk API to retrieve list of entities identified by its unique attributes.


        In addition to the typeName path parameter, attribute key-value pair(s) can be provided in the following format


        typeName=\&attr_1:\=\&attr_2:\=\&attr_3:\=\


        NOTE: The attrName should be an unique attribute for the given entity-type


        The REST request would look something like this


        GET /v2/entity/bulk/uniqueAttribute/type/hive_db?attr_1:qualifiedName=db1@cl1&attr_2:qualifiedName=db2@cl1

        Note: at least one unique attribute must be provided.'
      operationId: microsoftAzureEntityGetentitiesbyuniqueattributes
      x-ms-examples:
        Entity_GetEntitiesByUniqueAttributes:
          $ref: ./examples/Entity_GetEntitiesByUniqueAttributes.json
      parameters:
      - $ref: '#/components/parameters/typeName'
      - $ref: '#/components/parameters/minExtInfo'
      - $ref: '#/components/parameters/ignoreRelationships'
      - name: attr_N:qualifiedName
        in: query
        description: Qualified name of an entity. E.g. to find 2 entities you can set attrs_1:qualifiedName=db1@cl1&attrs_2:qualifiedName=db2@cl1. (This is only an example. qualifiedName can be changed to other unique attributes)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Get Atlas Entity Bulk Uniqueattribute Type Typename
      security:
      - azure_auth:
        - user_impersonation
    servers:
    - url: /catalog/api
  /atlas/v2/entity/guid/{guid}/header:
    get:
      tags:
      - Entity
      description: Get entity header given its GUID.
      operationId: microsoftAzureEntityGetheader
      x-ms-examples:
        Entity_GetHeader:
          $ref: ./examples/Entity_GetHeader.json
      parameters:
      - $ref: '#/components/parameters/guid'
      responses:
        '200':
          description: AtlasEntityHeader
