openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Saa S Resources API
tags:
- name: SaaSResources
paths:
  /providers/Microsoft.SaaS/operations:
    get:
      tags:
      - SaaSResources
      operationId: microsoftAzureOperationsList
      description: Gets all SaaS app operations.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaasAppOperationsResponseWithContinuation'
        default:
          description: A response indicating an error.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-examples:
        Get saas operations:
          $ref: ./examples/saasV1/SaaSGetOperations.json
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Providers Microsoft Saas Operations
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.SaaS/applications:
    get:
      tags:
      - SaaSResources
      operationId: microsoftAzureApplicationsList
      description: Gets all SaaS resources by subscription id and resource group name.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaasAppResponseWithContinuation'
        default:
          description: A response indicating an error.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-examples:
        Get saas application:
          $ref: ./examples/saasV1/SaaSGetApplications.json
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Saas Applications
  /providers/Microsoft.SaaS/saasresources/{resourceId}:
    delete:
      tags:
      - SaaSResources
      operationId: microsoftAzureSaasDelete
      description: Deletes the specified SaaS.
      parameters:
      - $ref: '#/components/parameters/SaasResourceIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful.
        '204':
          description: Request successful.
        default:
          description: A response indicating an error.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-examples:
        Delete SaaS resource:
          $ref: ./examples/saasV2/SaasDelete.json
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      summary: Microsoft Azure Delete Providers Microsoft Saas Saasresources Resourceid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deleteOptions'
        description: Parameters supplied to delete saas operation.
        required: true
    get:
      tags:
      - SaaSResources
      operationId: microsoftAzureSaasGetresource
      description: Gets information about the specified SaaS.
      parameters:
      - $ref: '#/components/parameters/SaasResourceIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. The request returns the resulting SaaS resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaasResource'
        default:
          description: A response indicating an error.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-examples:
        Get SaaS resource:
          $ref: ./examples/saasV2/SaasGet.json
      summary: Microsoft Azure Get Providers Microsoft Saas Saasresources Resourceid
    patch:
      tags:
      - SaaSResources
      operationId: microsoftAzureSaasUpdateresource
      description: Updates a SaaS resource.
      parameters:
      - $ref: '#/components/parameters/SaasResourceIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Resource change has completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaasResource'
        '202':
          description: Accepted and the operation will complete asynchronously.
          headers:
            Location:
              description: The URL to check the status of the asynchronous operation.
              schema:
                type: string
            Retry-After:
              description: The amount of delay to use while the status of the operation is checked. The value is expressed in seconds.
              schema:
                type: integer
                format: int32
        default:
          description: A response indicating an error.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-examples:
        Update SaaS resource:
          $ref: ./examples/saasV2/SaasPatch.json
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      summary: Microsoft Azure Patch Providers Microsoft Saas Saasresources Resourceid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaasResourceCreation'
        description: Parameters supplied to the update saas operation.
        required: true
  /providers/Microsoft.SaaS/saasresources:
    put:
      tags:
      - SaaSResources
      operationId: microsoftAzureSaasCreateresource
      description: Creates a SaaS resource.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: SaaS creation completed successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaasResource'
        '202':
          description: Accepted and the operation will complete asynchronously.
          headers:
            Location:
              description: The URL to check the status of the asynchronous operation.
              schema:
                type: string
            Retry-After:
              description: The amount of delay to use while the status of the operation is checked. The value is expressed in seconds.
              schema:
                type: integer
                format: int32
        default:
          description: A response indicating an error.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-examples:
        Create SaaS resource:
          $ref: ./examples/saasV2/SaasPut.json
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      summary: Microsoft Azure Put Providers Microsoft Saas Saasresources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaasResourceCreation'
        description: Parameters supplied to the create saas operation.
        required: true
    get:
      tags:
      - SaaSResources
      operationId: microsoftAzureSaasresourcesList
      description: Get All Resources
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaasResourceResponseWithContinuation'
        default:
          description: A response indicating an error.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-examples:
        Get all SaaS resources:
          $ref: ./examples/saasV2/SaaSGetAllResources.json
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Providers Microsoft Saas Saasresources
  /providers/Microsoft.SaaS/saasresources/{resourceId}/listAccessToken:
    post:
      tags:
      - SaaSResources
      operationId: microsoftAzureSaasresourceListaccesstoken
      description: Gets the ISV access token for a SaaS resource.
      parameters:
      - $ref: '#/components/parameters/SaasResourceIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. The request returns the generated access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResult'
        default:
          description: A response indicating an error.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-examples:
        generated SaaS resource token:
          $ref: ./examples/saasV2/ListAccessTokenPost.json
      summary: Microsoft Azure Post Providers Microsoft Saas Saasresources Resourceid Listaccesstoken
components:
  schemas:
    SaasAppProperties:
      description: Saas resource properties.
      type: object
      properties:
        status:
          type: string
          description: the Saas resource status.
          enum:
          - Pending
          - Subscribed
          - Unsubscribed
          - Suspended
          - Deactivated
          x-ms-enum:
            name: SaasAppStatus
            modelAsString: true
        saasAppPlan:
          description: the resource plan details.
          $ref: '#/components/schemas/SaasAppPlan'
    SaasResourceCreation:
      description: SaaS REST API resource definition for creation.
      type: object
      properties:
        id:
          description: The resource uri
          type: string
          readOnly: true
        name:
          description: The resource name
          type: string
        type:
          readOnly: true
          type: string
          description: Resource type.
        tags:
          description: the resource tags.
          $ref: '#/components/schemas/Tags'
        location:
          type: string
          description: Resource location. Only value allowed for SaaS is 'global'
        properties:
          $ref: '#/components/schemas/SaasCreationProperties'
          description: Properties of the SaaS resource that are relevant for creation.
    AccessTokenResult:
      description: the ISV access token result response.
      type: object
      properties:
        publisherOfferBaseUri:
          description: The Publisher Offer Base Uri
          type: string
        token:
          description: The generated token
          type: string
    deleteOptions:
      description: delete Options
      type: object
      properties:
        unsubscribeOnly:
          type: boolean
          description: whether it is unsubscribeOnly
        reasonCode:
          type: number
          description: The reasonCode
        feedback:
          type: string
          description: the feedback
    SaasApp:
      description: the saasApp resource.
      type: object
      properties:
        id:
          description: the resource Id.
          type: string
          readOnly: true
        location:
          description: the resource location.
          type: string
        name:
          description: the resource name.
          type: string
        type:
          description: the resource type.
          type: string
        properties:
          description: the resource properties.
          $ref: '#/components/schemas/SaasAppProperties'
        tags:
          description: the resource tags.
          $ref: '#/components/schemas/Tags'
    SaasAppOperation:
      description: saas app operations
      type: object
      properties:
        name:
          description: the operation name
          type: string
        display:
          description: the operation display
          $ref: '#/components/schemas/SaasAppOperationDisplay'
        origin:
          description: the operation origin
          type: string
        isDataAction:
          description: whether the operation is a data action or not.
          type: boolean
    SaasAppOperationsResponseWithContinuation:
      description: saas app operation response with continuation.
      type: object
      properties:
        nextLink:
          description: the next link to query to get the remaining results.
          type: string
        value:
          description: the value of response.
          type: array
          items:
            $ref: '#/components/schemas/SaasAppOperation'
    SaasResource:
      description: SaaS REST API resource definition.
      type: object
      x-ms-azure-resource: true
      properties:
        properties:
          description: saas properties
          type: object
          allOf:
          - $ref: '#/components/schemas/SaasProperties'
          - $ref: '#/components/schemas/SaasCreationProperties'
        name:
          type: string
          description: The name of the resource
          readOnly: true
        id:
          description: The resource uri
          type: string
          readOnly: true
        type:
          readOnly: true
          type: string
          description: Resource type.
        tags:
          description: the resource tags.
          $ref: '#/components/schemas/Tags'
    SaasProperties:
      type: object
      description: saas resource properties
      properties:
        status:
          type: string
          description: The SaaS Subscription Status.
          enum:
          - NotStarted
          - PendingFulfillmentStart
          - Subscribed
          - Unsubscribed
          - Suspended
          x-ms-enum:
            name: SaasResourceStatus
            modelAsString: true
        term:
          type: object
          description: The current Term object.
          properties:
            termUnit:
              type: string
              description: The unit indicating Monthly / Yearly
            startDate:
              type: string
              description: The start date of the current term
            endDate:
              type: string
              description: The end date of the current term
        isFreeTrial:
          type: boolean
          description: Whether the current term is a Free Trial term
        created:
          type: string
          description: The created date of this resource.
          readOnly: true
        lastModified:
          type: string
          description: The last modifier date if this resource.
    SaasResourceResponseWithContinuation:
      description: saas resources response with continuation.
      type: object
      properties:
        nextLink:
          description: the next link to query to get the remaining results.
          type: string
        value:
          description: the value of response.
          type: array
          items:
            $ref: '#/components/schemas/SaasResource'
    SaasAppResponseWithContinuation:
      description: saas app response with continuation.
      type: object
      properties:
        nextLink:
          description: the next link to query to get the remaining results.
          type: string
        value:
          description: the value of response.
          type: array
          items:
            $ref: '#/components/schemas/SaasApp'
    Tags:
      type: object
      description: the resource tags.
      additionalProperties:
        type: string
    SaasCreationProperties:
      type: object
      description: properties for creation saas
      properties:
        offerId:
          type: string
          description: The offer id.
        publisherId:
          type: string
          description: The publisher id.
        quantity:
          type: number
          description: The seat count.
        skuId:
          type: string
          description: The plan id.
        paymentChannelType:
          type: string
          description: The Payment channel for the SaasSubscription.
          enum:
          - SubscriptionDelegated
          - CustomerDelegated
          x-ms-enum:
            name: paymentChannelType
            modelAsString: true
        paymentChannelMetadata:
          type: object
          description: The metadata about the SaaS subscription such as the AzureSubscriptionId and ResourceUri.
          additionalProperties:
            type: string
        saasResourceName:
          type: string
          description: The SaaS resource name.
        termId:
          type: string
          description: The current Term id.
        autoRenew:
          type: boolean
          description: Whether the SaaS subscription will auto renew upon term end.
        publisherTestEnvironment:
          type: string
          description: The environment in the publisher side for this resource.
        saasSubscriptionId:
          type: string
          description: The saas subscription id used for tenant to subscription level migration request.
        saasSessionId:
          type: string
          description: The saas session id used for dev service migration request.
    SaasAppPlan:
      description: Saas resource plan.
      type: object
      properties:
        publisher:
          description: the publisher id.
          type: string
        product:
          description: the offer id.
          type: string
        name:
          description: the plan id.
          type: string
    SaasAppOperationDisplay:
      description: Saas app operation display
      type: object
      properties:
        provider:
          description: Name of the provider for display purposes
          type: string
        resource:
          description: Name of the resource type for display purposes
          type: string
        operation:
          description: Name of the operation for display purposes
          type: string
        description:
          description: Description of the operation for display purposes
          type: string
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to be used with the HTTP request.
      schema:
        type: string
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      description: The name of the resource group.
      x-ms-parameter-location: method
      schema:
        type: string
    SaasResourceIdParameter:
      name: resourceId
      in: path
      required: true
      description: The Saas resource ID. This is a GUID-formatted string (e.g. 00000000-0000-0000-0000-000000000000)
      x-ms-parameter-location: method
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The Azure subscription ID. This is a GUID-formatted string (e.g. 00000000-0000-0000-0000-000000000000)
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
