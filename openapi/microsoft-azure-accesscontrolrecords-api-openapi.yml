openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Access Control Records API
tags:
- name: AccessControlRecords
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.StorSimple/managers/{managerName}/accessControlRecords
  : get:
      tags:
      - AccessControlRecords
      description: Retrieves all the access control records in a manager.
      operationId: microsoftAzureAccesscontrolrecordsListbymanager
      parameters:
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/managerNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: The collection of access control records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlRecordList'
      deprecated: false
      x-ms-pageable:
        nextLinkName: null
      x-ms-examples:
        AccessControlRecordsListByManager:
          $ref: ./examples/AccessControlRecordsListByManager.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Storsimple Managers Managername Accesscontrolrecords
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.StorSimple/managers/{managerName}/accessControlRecords/{accessControlRecordName}
  : get:
      tags:
      - AccessControlRecords
      description: Returns the properties of the specified access control record name.
      operationId: microsoftAzureAccesscontrolrecordsGet
      parameters:
      - name: accessControlRecordName
        in: path
        description: Name of access control record to be fetched.
        required: true
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/managerNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: The access control record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlRecord'
      deprecated: false
      x-ms-examples:
        AccessControlRecordsGet:
          $ref: ./examples/AccessControlRecordsGet.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Storsimple Managers Managername Accesscontrolrecords Accesscontrolrecordname
    put:
      tags:
      - AccessControlRecords
      description: Creates or Updates an access control record.
      operationId: microsoftAzureAccesscontrolrecordsCreateorupdate
      parameters:
      - name: accessControlRecordName
        in: path
        description: The name of the access control record.
        required: true
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/managerNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: Successfully created or updated the access control record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlRecord'
        '202':
          description: Accepted the request to create or update the access control record.
      deprecated: false
      x-ms-long-running-operation: true
      x-ms-examples:
        AccessControlRecordsCreateOrUpdate:
          $ref: ./examples/AccessControlRecordsCreateOrUpdate.json
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Storsimple Managers Managername Accesscontrolrecords Accesscontrolrecordname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessControlRecord'
        description: The access control record to be added or updated.
        required: true
    delete:
      tags:
      - AccessControlRecords
      description: Deletes the access control record.
      operationId: microsoftAzureAccesscontrolrecordsDelete
      parameters:
      - name: accessControlRecordName
        in: path
        description: The name of the access control record to delete.
        required: true
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/managerNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '202':
          description: Accepted the request to delete the access control record.
        '204':
          description: Successfully deleted the access control record.
      deprecated: false
      x-ms-long-running-operation: true
      x-ms-examples:
        AccessControlRecordsDelete:
          $ref: ./examples/AccessControlRecordsDelete.json
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Storsimple Managers Managername Accesscontrolrecords Accesscontrolrecordname
components:
  parameters:
    apiVersionParameter:
      name: api-version
      in: query
      description: The api version
      required: true
      x-ms-skip-url-encoding: true
      schema:
        type: string
    managerNameParameter:
      name: managerName
      in: path
      description: The manager name
      required: true
      x-ms-parameter-location: method
      x-ms-skip-url-encoding: true
      schema:
        type: string
        maxLength: 50
        minLength: 2
    resourceGroupNameParameter:
      name: resourceGroupName
      in: path
      description: The resource group name
      required: true
      x-ms-parameter-location: method
      x-ms-skip-url-encoding: true
      schema:
        type: string
    subscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The subscription id
      required: true
      x-ms-skip-url-encoding: true
      schema:
        type: string
  schemas:
    AccessControlRecord:
      description: The access control record.
      required:
      - properties
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseModel'
      properties:
        properties:
          $ref: '#/components/schemas/AccessControlRecordProperties'
          description: The properties of access control record.
          x-ms-client-flatten: true
    AccessControlRecordList:
      description: The collection of access control records.
      required:
      - value
      type: object
      properties:
        value:
          description: The value.
          type: array
          items:
            $ref: '#/components/schemas/AccessControlRecord'
    AccessControlRecordProperties:
      description: The properties of access control record.
      required:
      - initiatorName
      type: object
      properties:
        initiatorName:
          description: The iSCSI initiator name (IQN).
          type: string
        volumeCount:
          format: int32
          description: The number of volumes using the access control record.
          type: integer
          readOnly: true
    BaseModel:
      description: Represents the base class for all other ARM object models
      type: object
      properties:
        id:
          description: The path ID that uniquely identifies the object.
          type: string
          readOnly: true
        name:
          description: The name of the object.
          type: string
          readOnly: true
        type:
          description: The hierarchical type of the object.
          type: string
          readOnly: true
        kind:
          description: The Kind of the object. Currently only Series8000 is supported
          enum:
          - Series8000
          type: string
          x-ms-enum:
            name: Kind
            modelAsString: false
