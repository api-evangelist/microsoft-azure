components:
  schemas:
    CloudSuitability:
      type: string
      description: Cloud Suitability for Azure.
      enum:
      - Unknown
      - NotSuitable
      - Suitable
      - ConditionallySuitable
      - ReadinessUnknown
      x-ms-enum:
        name: CloudSuitability
        modelAsString: true
        values:
        - name: Unknown
          value: Unknown
          description: Unknown. Indicates missing data.
        - name: NotSuitable
          value: NotSuitable
          description: Not Suitable for Azure.
        - name: Suitable
          value: Suitable
          description: Suitable for Azure.
        - name: ConditionallySuitable
          value: ConditionallySuitable
          description: Conditionally Suitable for Azure.
        - name: ReadinessUnknown
          value: ReadinessUnknown
          description: Unknown Readiness for Azure.
    AssessedWebAppV2Properties:
      type: object
      description: Assessed Web app database properties web model.
      properties:
        webAppType:
          $ref: '#/components/schemas/WebAppType'
          description: Gets or sets the web app type.
          readOnly: true
        targetSpecificResult:
          type: object
          description: Gets or sets the target specific result.
          additionalProperties:
            $ref: '#/components/schemas/TargetSpecificResult'
          readOnly: true
        appServicePlanName:
          type: string
          description: Gets or sets the app service plan name.
          readOnly: true
        machineName:
          type: string
          description: Gets the machine name.
          readOnly: true
        serverArmId:
          type: string
          description: Gets or sets the server ARM Id.
          readOnly: true
        webServerName:
          type: string
          description: Gets or sets the web server name.
          readOnly: true
        webAppName:
          type: string
          description: Gets or sets web app name.
          readOnly: true
        discoveredWebAppId:
          type: string
          description: Gets the discovered web app ID.
          readOnly: true
        discoveredMachineId:
          type: string
          description: Machine arm id.
          readOnly: true
        confidenceRatingInPercentage:
          type: number
          format: float
          description: Confidence Rating in Percentage.
          readOnly: true
        createdTimestamp:
          type: string
          format: date-time
          description: When was assessed SQL database first created.
          readOnly: true
        updatedTimestamp:
          type: string
          format: date-time
          description: When was assessed Web app database last updated.
          readOnly: true
      required:
      - appServicePlanName
      - machineName
    AzureWebAppSuitabilityIssueCategory:
      type: string
      enum:
      - Unknown
      - Issue
      - Info
      x-ms-enum:
        name: AzureWebAppSuitabilityIssueCategory
        modelAsString: true
    WebAppMigrationIssues:
      type: object
      description: Web app migration issues.
      properties:
        issueId:
          type: string
          description: Gets or sets the issue Id.
        issueCategory:
          $ref: '#/components/schemas/AzureWebAppSuitabilityIssueCategory'
          description: Gets or sets the issue category.
        issueDescriptionList:
          type: array
          description: Gets or sets the issue description list.
          items:
            type: string
      required:
      - issueId
      - issueCategory
      - issueDescriptionList
    AssessedWebAppV2ListResult:
      type: object
      description: The response of a AssessedWebAppV2 list operation.
      properties:
        value:
          type: array
          description: The AssessedWebAppV2 items on this page
          items:
            $ref: '#/components/schemas/AssessedWebAppV2'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    TargetSpecificResult:
      type: object
      description: Target specific result.
      properties:
        assessmentResult:
          $ref: '#/components/schemas/AssessmentResult'
          description: Gets or sets the assessment result.
        migrationIssues:
          type: array
          description: Gets or sets the web app migration issues.
          items:
            $ref: '#/components/schemas/WebAppMigrationIssues'
          x-ms-identifiers: []
      required:
      - assessmentResult
      - migrationIssues
    AssessmentResult:
      type: object
      description: Assessment results.
      properties:
        appServicePlanName:
          type: string
          description: Gets or sets the app service plan name.
        suitability:
          $ref: '#/components/schemas/CloudSuitability'
          description: Gets or sets the suitability.
        securitySuitability:
          $ref: '#/components/schemas/CloudSuitability'
          description: Gets or sets the security suitability.
        webAppSkuName:
          type: string
          description: Gets or sets the web app sku name.
        webAppSkuSize:
          type: string
          description: Gets or sets the web app sku size.
      required:
      - appServicePlanName
      - suitability
      - securitySuitability
      - webAppSkuName
      - webAppSkuSize
    WebAppType:
      type: string
      description: Web App Type.
      enum:
      - Unknown
      - IIS
      - Tomcat
      x-ms-enum:
        name: WebAppType
        modelAsString: true
        values:
        - name: Unknown
          value: Unknown
          description: Unknown. Indicates Missing Data.
        - name: IIS
          value: IIS
          description: ASP.NET Web App.
        - name: Tomcat
          value: Tomcat
          description: Java Web App.
    AssessedWebAppV2:
      type: object
      description: Assessed Web app web model class.
      properties:
        properties:
          $ref: '#/components/schemas/AssessedWebAppV2Properties'
          description: The resource-specific properties for this resource.
          x-ms-client-flatten: true
          x-ms-mutability:
          - read
          - create
      allOf:
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/definitions/ProxyResource
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
