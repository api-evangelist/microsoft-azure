paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Migrate/assessmentProjects/{projectName}/groups/{groupName}/webAppAssessments/{assessmentName}/assessedWebApps
  : get:
      operationId: microsoftAzureAssessedwebappv2operationsListbywebappassessmentv2
      tags:
      - AssessedWebAppV2Operations
      description: List AssessedWebAppV2 resources by WebAppAssessmentV2
      parameters:
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - name: $filter
        in: query
        description: Filter query.
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Optional parameter for page size.
        required: false
        schema:
          type: integer
          format: int32
      - name: continuationToken
        in: query
        description: Optional parameter for continuation token.
        required: false
        schema:
          type: string
      - name: totalRecordCount
        in: query
        description: Total record count.
        required: false
        schema:
          type: integer
          format: int32
