components:
  schemas:
    OSFeedType:
      type: string
      description: OS feed type values.
      enum:
      - Retail
      - RetailEval
      x-ms-enum:
        name: OSFeedType
        modelAsString: true
        values:
        - name: Retail
          value: Retail
          description: Retail OS feed type.
        - name: RetailEval
          value: RetailEval
          description: Retail evaluation OS feed type.
    Error:
      description: The response error definition.
      type: object
      properties:
        error:
          description: Error details for current request.
          $ref: '#/components/schemas/ErrorDetails'
      required:
      - error
    ClaimDevicesRequest:
      type: object
      description: Request to the action call to bulk claim devices.
      properties:
        deviceIdentifiers:
          type: array
          description: Device identifiers of the devices to be claimed.
          items:
            type: string
      required:
      - deviceIdentifiers
    DeviceGroup_2:
      type: object
      description: An device group resource belonging to a product resource.
      properties:
        properties:
          $ref: '#/components/schemas/DeviceGroupProperties'
          description: The resource-specific properties for this resource.
          x-ms-client-flatten: true
          x-ms-mutability:
          - read
          - create
      allOf:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ProxyResource
    RegionalDataBoundary:
      type: string
      description: Regional data boundary values.
      enum:
      - None
      - EU
      x-ms-enum:
        name: RegionalDataBoundary
        modelAsString: true
        values:
        - name: None
          value: None
          description: No data boundary
        - name: EU
          value: EU
          description: EU data boundary
    CountElementsResponse:
      type: object
      description: Response of the count for elements.
      properties:
        value:
          type: integer
          format: int32
          description: Number of children resources in parent resource.
      required:
      - value
    Device:
      description: The device definition.
      type: object
      properties:
        id:
          description: Unique ID of the device.
          type: string
          readOnly: true
        etag:
          description: ETag used to prevent conflict in device updates.
          type: string
        displayName:
          description: Display name of the device.
          type: string
        template:
          description: The device template definition for the device.
          type: string
        enabled:
          description: Whether the device connection to IoT Central has been enabled.
          type: boolean
        provisioned:
          description: Whether resources have been allocated for the device.
          type: boolean
          readOnly: true
        simulated:
          description: Whether the device is simulated.
          type: boolean
        organizations:
          description: List of organization IDs that the device is a part of, only one organization is supported today, multiple organizations will be supported soon.
          type: array
          items:
            type: string
        type:
          description: The type of the device.
          type: array
          items:
            type: string
            enum:
            - iotEdge
            x-ms-enum:
              name: DeviceType
              modelAsString: true
              values:
              - value: iotEdge
                name: IotEdge
                description: The edge device type
        deploymentManifest:
          description: The deployment manifest assigned to the device.
          $ref: '#/components/schemas/DeploymentManifest'
    DeviceGroupDeviceCollection:
      description: The paged results of devices belonging to the device group.
      type: object
      properties:
        value:
          description: The collection of devices belonging to the device group.
          type: array
          items:
            $ref: '#/components/schemas/Device'
        nextLink:
          description: URL to get the next page of devices in the group.
          type: string
      required:
      - value
    DeviceGroupUpdate:
      type: object
      description: The type used for update operations of the DeviceGroup.
      properties:
        properties:
          $ref: '#/components/schemas/DeviceGroupUpdateProperties'
          x-ms-client-flatten: true
    DeviceGroup:
      description: The device group definition.
      type: object
      properties:
        id:
          description: Unique ID of the device group.
          type: string
          readOnly: true
        displayName:
          description: Display name of the device group.
          type: string
        filter:
          description: Query defining which devices should be in this group, [Query Language Reference](https://aka.ms/iotcquery).
          type: string
        description:
          description: Short summary of device group.
          type: string
        etag:
          description: ETag used to prevent conflict in device group updates.
