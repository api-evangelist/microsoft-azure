      type: object
      properties:
        instanceType:
          description: Gets the class type. Overridden in derived classes.
          type: string
      discriminator:
        propertyName: instanceType
      required:
      - instanceType
    ApplianceCollection:
      description: Collection of appliance details.
      type: object
      properties:
        value:
          description: The appliance details.
          type: array
          items:
            $ref: '#/components/schemas/ReplicationAppliance'
        nextLink:
          description: The value of next link.
          type: string
    ReplicationAppliance:
      description: Replication appliance definition.
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/ReplicationApplianceProperties'
          description: Appliance related data.
    ReplicationApplianceProperties:
      description: Replication appliance properties.
      type: object
      properties:
        providerSpecificDetails:
          $ref: '#/components/schemas/ApplianceSpecificDetails'
          description: Provider specific settings.
