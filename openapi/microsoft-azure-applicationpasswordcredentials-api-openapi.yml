openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Application Password Credentials API
tags:
- name: ApplicationPasswordCredentials
paths:
  /{tenantID}/applications/{applicationObjectId}/passwordCredentials:
    get:
      tags:
      - ApplicationPasswordCredentials
      operationId: microsoftAzureApplicationsListpasswordcredentials
      description: Get the passwordCredentials associated with an application.
      parameters:
      - name: applicationObjectId
        in: path
        required: true
        description: Application object ID.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/tenantIDInPath'
      responses:
        '200':
          description: OK. The operation was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordCredentialListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphError'
      x-ms-pageable:
        nextLinkName: null
      summary: Microsoft Azure Get Tenantid Applications Applicationobjectid Passwordcredentials
    patch:
      tags:
      - ApplicationPasswordCredentials
      operationId: microsoftAzureApplicationsUpdatepasswordcredentials
      description: Update passwordCredentials associated with an application.
      parameters:
      - name: applicationObjectId
        in: path
        required: true
        description: Application object ID.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/tenantIDInPath'
      responses:
        '204':
          description: No Content
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphError'
      summary: Microsoft Azure Patch Tenantid Applications Applicationobjectid Passwordcredentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordCredentialsUpdateParameters'
        description: Parameters to update passwordCredentials of an existing application.
        required: true
components:
  schemas:
    OdataError:
      type: object
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: object
          x-ms-client-flatten: true
          $ref: '#/components/schemas/ErrorMessage'
          description: Error Message.
      description: Active Directory OData error information.
    ErrorMessage:
      type: object
      properties:
        value:
          type: string
          x-ms-client-name: message
          description: Error message value.
      description: Active Directory error message.
    PasswordCredential:
      type: object
      properties:
        startDate:
          type: string
          format: date-time
          description: Start date.
        endDate:
          type: string
          format: date-time
          description: End date.
        keyId:
          type: string
          description: Key ID.
        value:
          type: string
          description: Key value.
        customKeyIdentifier:
          type: string
          format: byte
          description: Custom Key Identifier
      additionalProperties:
        type: object
      description: Active Directory Password Credential information.
    PasswordCredentialListResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/PasswordCredential'
          description: A collection of PasswordCredentials.
      description: PasswordCredential list operation result.
    GraphError:
      type: object
      properties:
        odata.error:
          type: object
          x-ms-client-flatten: true
          $ref: '#/components/schemas/OdataError'
          description: A Graph API error.
      description: Active Directory error information.
    PasswordCredentialsUpdateParameters:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/PasswordCredential'
          description: A collection of PasswordCredentials.
      required:
      - value
      description: Request parameters for a PasswordCredentials update operation.
  parameters:
    tenantIDInPath:
      name: tenantID
