openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Commitment Associations API
tags:
- name: CommitmentAssociations
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.MachineLearning/commitmentPlans/{commitmentPlanName}/commitmentAssociations/{commitmentAssociationName}
  : get:
      tags:
      - CommitmentAssociations
      operationId: microsoftAzureCommitmentassociationsGet
      description: Get a commitment association.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/CommitmentPlanNameParameter'
      - $ref: '#/components/parameters/CommitmentAssociationNameParameter'
      - $ref: '#/components/parameters/APIVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentAssociation'
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Machinelearning Commitmentplans Commitmentplanname Commitmentassociations Commitmentassociationname
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.MachineLearning/commitmentPlans/{commitmentPlanName}/commitmentAssociations
  : get:
      tags:
      - CommitmentAssociations
      operationId: microsoftAzureCommitmentassociationsList
      description: Get all commitment associations for a parent commitment plan.
      x-ms-pageable:
        nextLinkName: nextLink
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/CommitmentPlanNameParameter'
      - $ref: '#/components/parameters/SkipTokenParameter'
      - $ref: '#/components/parameters/APIVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentAssociationListResult'
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Machinelearning Commitmentplans Commitmentplanname Commitmentassociations
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.MachineLearning/commitmentPlans/{commitmentPlanName}/commitmentAssociations/{commitmentAssociationName}/move
  : post:
      tags:
      - CommitmentAssociations
      operationId: microsoftAzureCommitmentassociationsMove
      description: Re-parent a commitment association from one commitment plan to another.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/CommitmentPlanNameParameter'
      - $ref: '#/components/parameters/CommitmentAssociationNameParameter'
      - $ref: '#/components/parameters/APIVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentAssociation'
      summary: Microsoft Azure Post Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Machinelearning Commitmentplans Commitmentplanname Commitmentassociations Commitmentassociationname Move
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCommitmentAssociationRequest'
        description: The move request payload.
        required: true
components:
  parameters:
    CommitmentAssociationNameParameter:
      x-ms-parameter-location: method
      name: commitmentAssociationName
      description: The commitment association name.
      in: path
      required: true
      schema:
        type: string
    CommitmentPlanNameParameter:
      x-ms-parameter-location: method
      name: commitmentPlanName
      description: The Azure ML commitment plan name.
      in: path
      required: true
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      description: Azure Subscription ID.
      in: path
      required: true
      schema:
        type: string
    ResourceGroupNameParameter:
      x-ms-parameter-location: method
      name: resourceGroupName
      description: The resource group name.
      in: path
      required: true
      schema:
        type: string
    SkipTokenParameter:
      x-ms-parameter-location: method
      name: $skipToken
      description: Continuation token for pagination.
      in: query
      required: false
      schema:
        type: string
    APIVersionParameter:
      name: api-version
      description: The version of the Microsoft.MachineLearning resource provider API to use.
      in: query
      required: true
      schema:
        type: string
  schemas:
    MoveCommitmentAssociationRequest:
      type: object
      description: Specifies the destination Azure ML commitment plan for a move operation.
      properties:
        destinationPlanId:
          type: string
          description: The ARM ID of the commitment plan to re-parent the commitment association to.
    Tags:
      type: object
      description: Resource tags
      additionalProperties:
        type: string
    CommitmentAssociationListResult:
      type: object
      description: A page of commitment association resources.
      properties:
        nextLink:
          type: string
          description: A URI to retrieve the next page of results.
        value:
          type: array
          description: The set of results for this page.
          items:
            $ref: '#/components/schemas/CommitmentAssociation'
    Resource:
      x-ms-azure-resource: true
      description: Common properties of an ARM resource.
      required:
      - location
      properties:
        id:
          description: Resource Id.
          type: string
          readOnly: true
        name:
          description: Resource name.
          type: string
          readOnly: true
        location:
          description: Resource location.
          type: string
        type:
          description: Resource type.
          type: string
          readOnly: true
        tags:
          description: User-defined tags for the resource.
          $ref: '#/components/schemas/Tags'
    CommitmentAssociation:
      type: object
      description: Represents the association between a commitment plan and some other resource, such as a Machine Learning web service.
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        etag:
          type: string
          description: An entity tag used to enforce optimistic concurrency.
        properties:
          description: The properties of the commitment association resource.
          $ref: '#/components/schemas/CommitmentAssociationProperties'
    CommitmentAssociationProperties:
      type: object
      description: Properties of an Azure ML commitment association.
      properties:
        associatedResourceId:
          type: string
          description: The ID of the resource this association points to, such as the ARM ID of an Azure ML web service.
          readOnly: true
        commitmentPlanId:
          type: string
          description: The ARM ID of the parent Azure ML commitment plan.
          readOnly: true
        creationDate:
          format: date-time
          type: string
          description: The date at which this commitment association was created, in ISO 8601 format.
          readOnly: true
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
