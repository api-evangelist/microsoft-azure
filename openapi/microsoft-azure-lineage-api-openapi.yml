openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Lineage API
tags:
- name: Lineage
paths:
  /lineage/{guid}/next:
    get:
      operationId: microsoftAzureLineageGetnextpage
      description: Return immediate next page lineage info about entity with pagination
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      - name: direction
        in: query
        description: The direction of the lineage, which could be INPUT, OUTPUT or BOTH.
        required: true
        x-ms-enum:
          name: LineageDirection
          modelAsString: true
          values:
          - name: Input
            value: INPUT
            description: input
          - name: Output
            value: OUTPUT
            description: output
          - name: Both
            value: BOTH
            description: both
        schema:
          type: string
          enum:
          - INPUT
          - OUTPUT
          - BOTH
      - name: offset
        in: query
        description: The offset for pagination purpose.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The page size - by default there is no paging.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasLineageInfo'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
      x-ms-examples:
        Lineage_GetNextPage:
          $ref: ./examples/Lineage_GetNextPage.json
      summary: Microsoft Azure Get Lineage Guid Next
      tags:
      - Lineage
  /atlas/v2/lineage/{guid}:
    get:
      tags:
      - Lineage
      description: Get lineage info of the entity specified by GUID.
      operationId: microsoftAzureLineageGetlineagegraph
      x-ms-examples:
        Lineage_GetLineageGraph:
          $ref: ./examples/Lineage_GetLineageGraph.json
      parameters:
      - $ref: '#/components/parameters/guid'
      - $ref: '#/components/parameters/depth'
      - $ref: '#/components/parameters/width'
      - $ref: '#/components/parameters/direction'
      - $ref: '#/components/parameters/includeParent'
      - $ref: '#/components/parameters/getDerivedLineage'
      responses:
        '200':
          description: OK. If the request is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasLineageInfo_2'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Get Atlas Lineage Guid
  /lineage/{guid}/next/:
    get:
      tags:
      - Lineage
      description: Return immediate next page lineage info about entity with pagination
      operationId: microsoftAzureLineageNextpagelineage
      x-ms-examples:
        Lineage_NextPageLineage:
          $ref: ./examples/Lineage_NextPageLineage.json
      parameters:
      - $ref: '#/components/parameters/guid'
      - $ref: '#/components/parameters/direction'
      - $ref: '#/components/parameters/getDerivedLineage'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/purviewAPIVersion'
      responses:
        '200':
          description: OK. If the input is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasLineageInfo_2'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Get Lineage Guid Next
  /atlas/v2/lineage/uniqueAttribute/type/{typeName}:
    get:
      tags:
      - Lineage
      description: 'Returns lineage info about entity.<br><br>In addition to the typeName path parameter, attribute key-value pair(s) can be provided in the following format<br><br>attr:[attrName]=[attrValue]<br><br>NOTE: The attrName and attrValue should be unique across entities, eg. qualifiedName.<br>The REST request would look something like this:<br>GET /v2/lineage/uniqueAttribute/type/aType?attr:aTypeAttribute=someValue.'
      operationId: microsoftAzureLineageGetlineagebyuniqueattribute
      x-ms-examples:
        Lineage_GetLineageByUniqueAttribute:
          $ref: ./examples/Lineage_GetLineageByUniqueAttribute.json
