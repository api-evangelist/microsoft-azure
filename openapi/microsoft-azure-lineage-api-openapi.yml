      - $ref: '#/components/parameters/typeName'
      - $ref: '#/components/parameters/depth'
      - $ref: '#/components/parameters/width'
      - $ref: '#/components/parameters/direction'
      - $ref: '#/components/parameters/includeParent'
      - $ref: '#/components/parameters/getDerivedLineage'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName can be changed to other unique attributes)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: If Lineage exists for the given entity
