                      description: '...'
                      displayText: '...'
                      expression: '...'
                      relationGuid: '...'
                      source: '...'
                      status: DISCOVERED
                      steward: '...'
                      termGuid: '...'
                    - confidence: 12345
                      createdBy: '...'
                      description: '...'
                      displayText: '...'
                      expression: '...'
                      relationGuid: '...'
                      source: '...'
                      status: DISCOVERED
                      steward: '...'
                      termGuid: '...'
                    status: PURGED
                    attributes:
                      property1: {}
