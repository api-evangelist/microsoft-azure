      name: width
      description: The number of max expanding width in lineage.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        default: 10
    getDerivedLineage:
      name: getDerivedLineage
      description: True to include derived lineage in the response
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: boolean
    offset:
      name: offset
      description: The offset for pagination purpose.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
    purviewAPIVersion:
      name: api-version
      description: Version of Purview APIs
      in: query
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    depth:
      name: depth
      description: The number of hops for lineage.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        default: 3
    direction:
      name: direction
      description: The direction of the lineage, which could be INPUT, OUTPUT or BOTH.
      in: query
      required: true
      x-ms-enum:
        name: direction
        modelAsString: true
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - BOTH
        - INPUT
        - OUTPUT
    includeParent:
      name: includeParent
      description: True to include the parent chain in the response.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: boolean
    Azure.Core.Foundations.ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      x-ms-parameter-location: method
      x-ms-client-name: apiVersion
      schema:
        type: string
        minLength: 1
    typeName:
      name: typeName
      description: The name of the type.
      in: path
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 4096
        minLength: 1
    limit:
      name: limit
      description: The page size - by default there is no paging.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
    guid:
      name: guid
      description: The globally unique identifier of the entity.
      in: path
      required: true
      x-ms-parameter-location: method
