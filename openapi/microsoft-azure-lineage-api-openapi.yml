                    typeName: '...'
                  property2:
                    classificationNames:
                    - '...'
                    - '...'
                    classifications:
                    - entityGuid: '...'
                      entityStatus: ACTIVE
                      validityPeriods:
                      - {}
                      - {}
                      attributes:
                        property1: {}
                        property2: {}
                      typeName: '...'
                    - entityGuid: '...'
                      entityStatus: ACTIVE
                      validityPeriods:
                      - {}
                      - {}
                      attributes:
                        property1: {}
                        property2: {}
                      typeName: '...'
                    displayText: '...'
                    guid: '...'
                    isIncomplete: true
                    labels:
                    - '...'
                    - '...'
                    meaningNames:
                    - '...'
                    - '...'
                    meanings:
                    - confidence: 12345
                      createdBy: '...'
                      description: '...'
                      displayText: '...'
                      expression: '...'
                      relationGuid: '...'
                      source: '...'
                      status: DEPRECATED
