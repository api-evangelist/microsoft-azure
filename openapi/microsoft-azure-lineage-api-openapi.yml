                  toEntityId: '...'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Get Atlas Lineage Uniqueattribute Type Typename
components:
  schemas:
    LastModifiedTS:
      type: string
      title: lastModifiedTS
      description: ETag for concurrency control.
    Azure.Core.uuid:
      type: string
      format: uuid
      description: Universally Unique Identifier
    ParentRelation:
      type: object
      description: The lineage parents relation with GUID of the parent entity and to child entity.
      properties:
        childEntityId:
          type: string
          description: The GUID of child entity.
        relationshipId:
          type: string
          description: The GUID of relationship.
        parentEntityId:
          type: string
          description: The GUID of parent entity.
    AtlasErrorResponse:
      type: object
      description: An error response from the service
      properties:
        requestId:
          $ref: '#/components/schemas/Azure.Core.uuid'
          description: The request ID.
        errorCode:
          type: string
          description: The error code.
        errorMessage:
          type: string
          description: The error message.
    AtlasClassification:
      type: object
      description: 'An instance of a classification; it doesn''t have an identity, this object

        exists only when associated with an entity.'
      properties:
        attributes:
          type: object
          description: The attributes of the struct.
          additionalProperties: {}
        typeName:
          type: string
          description: The name of the type.
        lastModifiedTS:
          type: string
          description: ETag for concurrency control.
        entityGuid:
          type: string
          description: The GUID of the entity.
        entityStatus:
          $ref: '#/components/schemas/EntityStatus'
          description: 'Status of the entity - can be active or deleted. Deleted entities are not

            removed.'
        removePropagationsOnEntityDelete:
          type: boolean
          description: Determines if propagations will be removed on entity deletion.
        validityPeriods:
          type: array
          description: An array of time boundaries indicating validity periods.
          items:
            $ref: '#/components/schemas/TimeBoundary'
          x-ms-identifiers: []
    AtlasLineageInfoExtraProperties:
      type: object
      description: The lineage direction
      additionalProperties:
        description: The entity guid.
    AtlasEntityHeader_2:
      type: object
      title: AtlasEntityHeader
      allOf:
      - $ref: '#/components/schemas/AtlasStruct'
      - properties:
          classificationNames:
            type: array
            description: An array of classification names.
            items:
              type: string
          classifications:
            type: array
            description: An array of classifications.
            items:
              $ref: '#/components/schemas/AtlasClassification_2'
          displayText:
            type: string
            description: The display text.
          guid:
            type: string
            description: The GUID of the record.
          isIncomplete:
            readOnly: false
            description: Whether it is a shell entity
            type: boolean
          labels:
            readOnly: false
            description: labels
            type: array
            items:
              type: string
          meaningNames:
            type: array
            description: An array of meanings.
            items:
              type: string
          meanings:
            type: array
            description: An array of term assignment headers.
            items:
              $ref: '#/components/schemas/AtlasTermAssignmentHeader_2'
          status:
            $ref: '#/components/schemas/Status'
      description: An instance of an entity - like hive_table, hive_database.
    AtlasStruct:
      type: object
      properties:
        attributes:
          type: object
          description: The attributes of the struct.
          additionalProperties: {}
        typeName:
          type: string
          description: The name of the type.
        lastModifiedTS:
          $ref: '#/components/schemas/LastModifiedTS'
      title: AtlasStruct
      description: Captures details of struct contents. Not instantiated directly, used only via AtlasEntity, AtlasClassification.
    LineageRelation:
      type: object
      description: The lineage relation with GUID of the from and to entity.
      properties:
        fromEntityId:
          type: string
          description: The GUID of from-entity.
        relationshipId:
          type: string
          description: The GUID of relationship.
        toEntityId:
          type: string
          description: The GUID of to-entity.
    AtlasClassification_2:
      type: object
      title: AtlasClassification
      allOf:
      - $ref: '#/components/schemas/AtlasStruct'
      - properties:
          entityGuid:
            type: string
            description: The GUID of the entity.
          entityStatus:
            $ref: '#/components/schemas/Status'
          removePropagationsOnEntityDelete:
            type: boolean
            description: Determines if propagations will be removed on entity deletion.
          validityPeriods:
            type: array
            description: An array of time boundaries indicating validity periods.
            items:
              $ref: '#/components/schemas/TimeBoundary_2'
          source:
            type: string
            description: indicate the source who create the classification detail
          sourceDetails:
            type: object
            additionalProperties:
              type: object
              properties: {}
            description: more detail on source information
      description: An instance of a classification; it doesn't have an identity, this object exists only when associated with an entity.
    LineageDirection_2:
      type: string
      title: LineageDirection
      description: The enum of lineage direction.
      enum:
      - INPUT
      - OUTPUT
      - BOTH
      x-ms-enum:
        name: LineageDirection
        modelAsString: true
    AtlasTermAssignmentHeader:
      type: object
      description: The header for term assignment.
      properties:
        confidence:
          type: integer
          format: int32
          description: The confidence of the term assignment.
        createdBy:
          type: string
          description: The user who created the record.
        description:
          type: string
          description: The description of the term assignment.
        displayText:
          type: string
          description: The display text.
        expression:
          type: string
          description: The expression of the term assignment.
        relationGuid:
          $ref: '#/components/schemas/Azure.Core.uuid'
          description: The GUID of the relationship.
        status:
          $ref: '#/components/schemas/AtlasTermAssignmentStatus'
          description: The status of terms assignment.
        steward:
          type: string
          description: The steward of the term.
        termGuid:
          $ref: '#/components/schemas/Azure.Core.uuid'
          description: The GUID of the term.
    TimeBoundary_2:
      type: object
      properties:
        endTime:
          type: string
          description: The end of the time boundary.
        startTime:
          type: string
          description: The start of the time boundary.
        timeZone:
          type: string
          description: The timezone of the time boundary.
      title: TimeBoundary
      description: Captures time-boundary details
    ParentRelation_2:
      type: object
      properties:
        childEntityId:
          type: string
          description: The GUID of child entity.
        relationshipId:
          type: string
          description: The GUID of relationship.
        parentEntityId:
          type: string
          description: The GUID of parent entity.
      title: ParentRelation
      description: The lineage parents relation with GUID of the parent entity and to child entity.
    AtlasLineageInfo:
      type: object
      description: The lineage information.
      properties:
        baseEntityGuid:
          type: string
          description: The GUID of the base entity.
        guidEntityMap:
          type: object
          description: The GUID entity map.
          additionalProperties:
            $ref: '#/components/schemas/AtlasEntityHeader'
        widthCounts:
          type: object
          description: The entity count in specific direction.
          additionalProperties:
            additionalProperties: {}
            type: object
        lineageDepth:
          type: integer
          format: int32
          description: The depth of lineage.
        lineageWidth:
          type: integer
          format: int32
          description: The width of lineage.
        childrenCount:
          type: integer
          format: int32
          description: The number of children node.
        lineageDirection:
          $ref: '#/components/schemas/LineageDirection'
          description: The enum of lineage direction.
        parentRelations:
          type: array
          description: An array of parentRelations relations.
          items:
            $ref: '#/components/schemas/ParentRelation'
          x-ms-identifiers: []
        relations:
          type: array
          description: An array of lineage relations.
          items:
            $ref: '#/components/schemas/LineageRelation'
          x-ms-identifiers: []
    TimeBoundary:
      type: object
      description: Captures time-boundary details
      properties:
        endTime:
          type: string
          description: The end of the time boundary.
        startTime:
          type: string
          description: The start of the time boundary.
        timeZone:
          type: string
          description: The timezone of the time boundary.
    AtlasTermAssignmentHeader_2:
      type: object
      properties:
        confidence:
          type: integer
          format: int32
          description: The confidence of the term assignment.
        createdBy:
          type: string
          description: The user who created the record.
        description:
          type: string
          description: The description of the term assignment.
        displayText:
          type: string
          description: The display text.
        expression:
          type: string
          description: The expression of the term assignment.
        relationGuid:
          type: string
          description: The GUID of the relationship.
        source:
          type: string
          description: The source of the term.
        status:
          $ref: '#/components/schemas/AtlasTermAssignmentStatus_2'
        steward:
          type: string
          description: The steward of the term.
        termGuid:
          type: string
          description: The GUID of the term.
      title: AtlasTermAssignmentHeader
      description: The header for term assignment.
    LineageDirection:
      type: string
      description: Lineage direction
      enum:
      - INPUT
      - OUTPUT
      - BOTH
      x-ms-enum:
        name: LineageDirection
        modelAsString: true
        values:
        - name: Input
          value: INPUT
          description: input
        - name: Output
          value: OUTPUT
          description: output
        - name: Both
          value: BOTH
          description: both
    AtlasLineageInfo_2:
      type: object
      properties:
        baseEntityGuid:
          type: string
          description: The GUID of the base entity.
        guidEntityMap:
          type: object
          description: The GUID entity map.
          additionalProperties:
            $ref: '#/components/schemas/AtlasEntityHeader_2'
        widthCounts:
          type: object
          description: The entity count in specific direction.
          additionalProperties:
            $ref: '#/components/schemas/AtlasLineageInfoExtraProperties'
        lineageDepth:
          type: integer
          format: int32
          description: The depth of lineage.
        lineageWidth:
          type: integer
          format: int32
          description: The width of lineage.
        includeParent:
          type: boolean
          description: True to return the parent of the base entity.
        childrenCount:
          type: integer
          format: int32
          description: The number of children node.
        lineageDirection:
          $ref: '#/components/schemas/LineageDirection_2'
        parentRelations:
          type: array
          description: An array of parentRelations relations.
          items:
            $ref: '#/components/schemas/ParentRelation_2'
        relations:
          type: array
          description: An array of lineage relations.
          items:
            $ref: '#/components/schemas/LineageRelation_2'
      title: AtlasLineageInfo
      description: The lineage information.
    LineageRelation_2:
      type: object
      properties:
        fromEntityId:
          type: string
          description: The GUID of from-entity.
        relationshipId:
          type: string
          description: The GUID of relationship.
        toEntityId:
          type: string
          description: The GUID of to-entity.
      title: LineageRelation
      description: The lineage relation with GUID of the from and to entity.
    AtlasTermAssignmentStatus_2:
      type: string
      title: AtlasTermAssignmentStatus
      description: The status of terms assignment.
      enum:
      - DISCOVERED
      - PROPOSED
      - IMPORTED
      - VALIDATED
      - DEPRECATED
      - OBSOLETE
      - OTHER
      x-ms-enum:
        name: AtlasTermAssignmentStatus
        modelAsString: true
    EntityStatus:
      type: string
      description: Status - can be active or deleted
      enum:
      - ACTIVE
      - DELETED
      x-ms-enum:
        name: EntityStatus
        modelAsString: true
        values:
        - name: Active
          value: ACTIVE
          description: The status is active.
        - name: Deleted
          value: DELETED
          description: The status is deleted.
    ErrorResponse:
      description: An error response from the service
      type: object
      properties:
        requestId:
          type: string
          description: The request ID.
        errorCode:
          type: string
          description: The error code.
        errorMessage:
          type: string
          description: The error message.
    AtlasEntityHeader:
      type: object
      description: An instance of an entity - like hive_table, hive_database.
      properties:
        attributes:
          type: object
          description: The attributes of the struct.
          additionalProperties: {}
        typeName:
          type: string
          description: The name of the type.
        lastModifiedTS:
          type: string
          description: ETag for concurrency control.
        classificationNames:
          type: array
          description: An array of classification names.
          items:
            type: string
        classifications:
          type: array
          description: An array of classifications.
          items:
            $ref: '#/components/schemas/AtlasClassification'
          x-ms-identifiers: []
        displayText:
          type: string
          description: The display text.
        guid:
          type: string
          description: The GUID of the record.
        isIncomplete:
          type: boolean
          description: Whether it is a shell entity
        labels:
          type: array
          description: labels
          items:
            type: string
        meaningNames:
          type: array
          description: An array of meanings.
          items:
            type: string
        meanings:
          type: array
          description: An array of term assignment headers.
          items:
            $ref: '#/components/schemas/AtlasTermAssignmentHeader'
          x-ms-identifiers: []
        status:
          $ref: '#/components/schemas/EntityStatus'
          description: 'Status of the entity - can be active or deleted. Deleted entities are not

            removed.'
    Status:
      type: string
      title: Status
      description: Status of the entity - can be active or deleted. Deleted entities are not removed from Atlas store.
      enum:
      - ACTIVE
      - DELETED
      x-ms-enum:
        name: Status
        modelAsString: true
    AtlasTermAssignmentStatus:
      type: string
      description: Status for term assignment
      enum:
      - DISCOVERED
      - PROPOSED
      - IMPORTED
      - VALIDATED
      - DEPRECATED
      - OBSOLETE
      - OTHER
      x-ms-enum:
        name: AtlasTermAssignmentStatus
        modelAsString: true
        values:
        - name: Discovered
          value: DISCOVERED
          description: The status is discovered.
        - name: Proposed
          value: PROPOSED
          description: The status is proposed.
        - name: Imported
          value: IMPORTED
          description: The status is imported.
        - name: Validated
          value: VALIDATED
          description: The status is validated.
        - name: Deprecated
          value: DEPRECATED
          description: The status is deprecated.
        - name: Obsolete
          value: OBSOLETE
          description: The status is obsolete.
        - name: Other
          value: OTHER
          description: Other status.
  parameters:
