              example: "{\n  \"error\": {\n    \"code\": \"ServiceUnavailable\",\n    \"message\": \"Service is temporary unavailable\",\n    \"target\": \"batch\",\n    \"innerError\": {\n      \"code\": \"ServiceTemporaryUnavailable\",\n      \"message\": \"Service is currently unavailable.  Please try again later\"\n    }\n  }\n}"
