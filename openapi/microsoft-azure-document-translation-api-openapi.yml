          $ref: ./examples/operation.json
    delete:
      tags:
      - Document Translation
      summary: Microsoft Azure Cancel A Currently Processing Or Queued Translation
      description: 'Cancel a currently processing or queued translation.

        A translation will not be cancelled if it is already completed or failed or cancelling. A bad request will be returned.

        All documents that have completed translation will not be cancelled and will be charged.

        All pending documents will be cancelled if possible.'
      operationId: microsoftAzureDocumenttranslationCanceltranslation
      parameters:
      - in: path
        name: id
        description: Format - uuid.  The operation-id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cancel request has been submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationStatus'
        '401':
          description: Unauthorized.  Please check your credentials
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"Unauthorized\",\n    \"message\": \"User is not authorized\",\n    \"target\": \"batch\",\n    \"innerError\": {\n      \"code\": \"Unauthorized\",\n      \"message\": \"Operation is not authorized\"\n    }\n  }\n}"
