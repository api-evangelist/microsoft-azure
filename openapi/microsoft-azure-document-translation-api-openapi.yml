openapi: 3.2.0
info:
  title: Microsoft Azure Batch Client Document Translation API
  version: v1.1
security:
- subscription_key: []
tags:
- name: Document Translation
paths:
  /batches:
    post:
      tags:
      - Document Translation
      summary: Microsoft Azure Submit A Document Translation Request To The Document…
      description: 'Use this API to submit a bulk (batch) translation request to the Document Translation service.

        Each request can contain multiple documents and must contain a source and destination container for each document.


        The prefix and suffix filter (if supplied) are used to filter folders. The prefix is applied to the subpath after the container name.


        Glossaries / Translation memory can be included in the request and are applied by the service when the document is translated.


        If the glossary is invalid or unreachable during translation, an error is indicated in the document status.

        If a file with the same name already exists at the destination, it will be overwritten. The targetUrl for each target language must be unique.'
      operationId: microsoftAzureDocumenttranslationStarttranslation
      responses:
        '202':
          description: Successful request and the batch request is created by the service.  The header Operation-Location will indicate a status url with the operation id.
          headers:
            Operation-Location:
              description: Location of batch the operation
              schema:
                type: string
                format: ''
        default:
          description: Internal Server Error
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"InternalServerError\",\n    \"message\": \"Internal Server Error\",\n    \"target\": \"batch\",\n    \"innerError\": {\n      \"code\": \"InternalServerError\",\n      \"message\": \"Unexpected internal server error has occurred\"\n    }\n  }\n}"
      x-ms-examples:
        Batch Submit:
          $ref: ./examples/batch.json
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTranslationDetails'
          text/json:
            schema:
              $ref: '#/components/schemas/StartTranslationDetails'
          application/*+json:
            schema:
              $ref: '#/components/schemas/StartTranslationDetails'
        description: request details
        required: true
    get:
      tags:
      - Document Translation
      summary: Microsoft Azure Returns A List Of Batch Requests Submitted And The Status For…
      description: 'Returns a list of batch requests submitted and the status for each request.

        This list only contains batch requests submitted by the user (based on the resource).


        If the number of requests exceeds our paging limit, server-side paging is used. Paginated responses indicate a partial result and include a continuation token in the response.

        The absence of a continuation token means that no additional pages are available.


        $top, $skip and $maxpagesize query parameters can be used to specify a number of results to return and an offset for the collection.


        $top indicates the total number of records the user wants to be returned across all pages.

        $skip indicates the number of records to skip from the list of batches based on the sorting method specified. By default, we sort by descending start time.

        $maxpagesize is the maximum items returned in a page. If more items are requested via $top (or $top is not specified and there are more items to be returned), @nextLink will contain the link to the next page.


        $orderBy query parameter can be used to sort the returned list (ex "$orderBy=createdDateTimeUtc asc" or "$orderBy=createdDateTimeUtc desc").

        The default sorting is descending by createdDateTimeUtc.

        Some query parameters can be used to filter the returned list (ex: "status=Succeeded,Cancelled") will only return succeeded and cancelled operations.

        createdDateTimeUtcStart and createdDateTimeUtcEnd can be used combined or separately to specify a range of datetime to filter the returned list by.

        The supported filtering query parameters are (status, ids, createdDateTimeUtcStart, createdDateTimeUtcEnd).


        The server honors the values specified by the client. However, clients must be prepared to handle responses that contain a different page size or contain a continuation token.


        When both $top and $skip are included, the server should first apply $skip and then $top on the collection.

        Note: If the server can''t honor $top and/or $skip, the server must return an error to the client informing about it instead of just ignoring the query options.

        This reduces the risk of the client making assumptions about the data returned.'
      operationId: microsoftAzureDocumenttranslationGettranslationsstatus
      parameters:
      - in: query
        name: $top
        description: "$top indicates the total number of records the user wants to be returned across all pages.\n            \nClients MAY use $top and $skip query parameters to specify a number of results to return and an offset into the collection.\nWhen both $top and $skip are given by a client, the server SHOULD first apply $skip and then $top on the collection.\n            \nNote: If the server can't honor $top and/or $skip, the server MUST return an error to the client informing about it instead of just ignoring the query options."
        schema:
          type: integer
          format: int32
          maximum: 2147483647
          minimum: 0
      - in: query
        name: $skip
        description: "$skip indicates the number of records to skip from the list of records held by the server based on the sorting method specified.  By default, we sort by descending start time.\n            \nClients MAY use $top and $skip query parameters to specify a number of results to return and an offset into the collection.\nWhen both $top and $skip are given by a client, the server SHOULD first apply $skip and then $top on the collection.\n            \nNote: If the server can't honor $top and/or $skip, the server MUST return an error to the client informing about it instead of just ignoring the query options."
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2147483647
          minimum: 0
      - in: query
        name: $maxpagesize
        description: "$maxpagesize is the maximum items returned in a page.  If more items are requested via $top (or $top is not specified and there are more items to be returned), @nextLink will contain the link to the next page.\n            \nClients MAY request server-driven paging with a specific page size by specifying a $maxpagesize preference. The server SHOULD honor this preference if the specified page size is smaller than the server's default page size."
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 100
          minimum: 1
      - in: query
        name: ids
        description: Ids to use in filtering
        style: form
        explode: false
        schema:
          type: array
          items:
            format: uuid
            type: string
          maxLength: 25
      - in: query
        name: statuses
        description: Statuses to use in filtering
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          maxLength: 5
      - in: query
        name: createdDateTimeUtcStart
        description: the start datetime to get items after
        schema:
          type: string
          format: date-time
      - in: query
        name: createdDateTimeUtcEnd
        description: the end datetime to get items before
        schema:
          type: string
          format: date-time
      - in: query
        name: $orderBy
        description: 'the sorting query for the collection (ex: ''CreatedDateTimeUtc asc'', ''CreatedDateTimeUtc desc'')'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          maxLength: 1
      responses:
        '200':
          description: Successful request and returns the status of the all the operations
          headers:
            Retry-After:
              description: Indicates how long to wait before making a new request.
              schema:
                type: integer
                format: int32
            ETag:
              description: The ETag response-header field provides the current value of the entity tag for the requested variant. Used with If-Match, If-None-Match and If-Range to implement optimistic concurrency control.
              schema:
                type: string
                format: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationsStatus'
        '400':
          description: Invalid request.  Check input parameters
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"InvalidRequest\",\n    \"message\": \"Some argument is incorrect\",\n    \"target\": \"batch\",\n    \"innerError\": {\n      \"code\": \"SASTokenInvalid\",\n      \"message\": \"SAS token for storage is invalid\"\n    }\n  }\n}"
        '401':
          description: Unauthorized.  Please check your credentials
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"Unauthorized\",\n    \"message\": \"User is not authorized\",\n    \"target\": \"batch\",\n    \"innerError\": {\n      \"code\": \"Unauthorized\",\n      \"message\": \"Operation is not authorized\"\n    }\n  }\n}"
        '429':
          description: Too many requests
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"RequestRateTooHigh\",\n    \"message\": \"User's request rate is too high\",\n    \"target\": \"batch\",\n    \"innerError\": {\n      \"code\": \"RateTooHigh\",\n      \"message\": \"Request rate is too high\"\n    }\n  }\n}"
        '500':
          description: Internal Server Error
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"InternalServerError\",\n    \"message\": \"Internal Server Error\",\n    \"target\": \"batch\",\n    \"innerError\": {\n      \"code\": \"InternalServerError\",\n      \"message\": \"Unexpected internal server error has occurred\"\n    }\n  }\n}"
        '503':
          description: Server temporary unavailable
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"ServiceUnavailable\",\n    \"message\": \"Service is temporary unavailable\",\n    \"target\": \"batch\",\n    \"innerError\": {\n      \"code\": \"ServiceTemporaryUnavailable\",\n      \"message\": \"Service is currently unavailable.  Please try again later\"\n    }\n  }\n}"
      x-ms-examples:
        Get status for batch operations:
          $ref: ./examples/operations.json
      x-ms-pageable:
        nextLinkName: '@nextLink'
  /batches/{id}/documents/{documentId}:
    get:
      tags:
      - Document Translation
      summary: Microsoft Azure Returns The Status For A Specific Document
      description: Returns the translation status for a specific document based on the request Id and document Id.
      operationId: microsoftAzureDocumenttranslationGetdocumentstatus
      parameters:
      - in: path
        name: id
        description: Format - uuid.  The batch id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: documentId
        description: Format - uuid.  The document id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful request and it is accepted by the service.  The operation details are returned
          headers:
            Retry-After:
              description: Indicates how long to wait before making a new request.
              schema:
                type: integer
                format: int32
            ETag:
              description: The ETag response-header field provides the current value of the entity tag for the requested variant. Used with If-Match, If-None-Match and If-Range to implement optimistic concurrency control.
              schema:
                type: string
                format: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatus'
        '401':
          description: Unauthorized.  Please check your credentials
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"Unauthorized\",\n    \"message\": \"User is not authorized\",\n    \"target\": \"document\",\n    \"innerError\": {\n      \"code\": \"Unauthorized\",\n      \"message\": \"Operation is not authorized\"\n    }\n  }\n}"
        '404':
          description: Resource is not found
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"ResourceNotFound\",\n    \"message\": \"id not found\",\n    \"target\": \"document\",\n    \"innerError\": {\n      \"code\": \"ResourceNotFound\",\n      \"message\": \"Resource requested is not found\"\n    }\n  }\n}"
        '429':
          description: Too many requests
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"RequestRateTooHigh\",\n    \"message\": \"User's request rate is too high\",\n    \"target\": \"document\",\n    \"innerError\": {\n      \"code\": \"RateTooHigh\",\n      \"message\": \"Request rate is too high\"\n    }\n  }\n}"
        '500':
          description: Internal Server Error
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"InternalServerError\",\n    \"message\": \"Internal Server Error\",\n    \"target\": \"document\",\n    \"innerError\": {\n      \"code\": \"InternalServerError\",\n      \"message\": \"Unexpected internal server error has occurred\"\n    }\n  }\n}"
        '503':
          description: Server temporary unavailable
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorResponse'
              example: "{\n  \"error\": {\n    \"code\": \"ServiceUnavailable\",\n    \"message\": \"Service is temporary unavailable\",\n    \"target\": \"document\",\n    \"innerError\": {\n      \"code\": \"ServiceTemporaryUnavailable\",\n      \"message\": \"Service is currently unavailable.  Please try again later\"\n    }\n  }\n}"
      x-ms-examples:
        Get Document Status:
          $ref: ./examples/document.json
