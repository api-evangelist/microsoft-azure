components:
  schemas:
    TranslationError:
      description: This contains an outer error with error code, message, details, target and an inner error with more descriptive details.
      required:
      - code
      - message
      type: object
      properties:
        code:
          $ref: '#/components/schemas/TranslationErrorCode'
        message:
          description: Gets high level error message.
          type: string
        target:
          description: "Gets the source of the error. \nFor example it would be \"documents\" or \"document id\" in case of invalid document."
          type: string
          readOnly: true
        innerError:
          $ref: '#/components/schemas/InnerTranslationError'
    SupportedStorageSources:
      description: List of supported storage sources
      required:
      - value
      type: object
      properties:
        value:
          description: list of objects
          type: array
          items:
            $ref: '#/components/schemas/StorageSource'
    Status:
      description: List of possible statuses for job or document
      enum:
      - NotStarted
      - Running
      - Succeeded
      - Failed
      - Cancelled
      - Cancelling
      - ValidationFailed
      type: string
      x-ms-enum:
        name: Status
        modelAsString: true
        values:
        - value: NotStarted
        - value: Running
        - value: Succeeded
        - value: Failed
        - value: Cancelled
        - value: Cancelling
        - value: ValidationFailed
    StatusSummary:
      required:
      - cancelled
      - failed
      - inProgress
      - notYetStarted
      - success
      - total
      - totalCharacterCharged
      type: object
      properties:
        total:
          format: int32
          description: Total count
          type: integer
          example: 1
        failed:
          format: int32
          description: Failed count
          type: integer
          example: 0
        success:
          format: int32
          description: Number of Success
          type: integer
          example: 1
        inProgress:
          format: int32
          description: Number of in progress
          type: integer
          example: 0
        notYetStarted:
          format: int32
          description: Count of not yet started
          type: integer
          example: 0
        cancelled:
          format: int32
          description: Number of cancelled
          type: integer
          example: 0
        totalCharacterCharged:
          format: int64
          description: Total characters charged by the API
          type: integer
    TranslationErrorCode:
      description: Enums containing high level error codes.
      enum:
      - InvalidRequest
      - InvalidArgument
      - InternalServerError
      - ServiceUnavailable
      - ResourceNotFound
      - Unauthorized
      - RequestRateTooHigh
      type: string
      x-ms-enum:
        name: TranslationErrorCode
        modelAsString: true
        values:
        - value: InvalidRequest
        - value: InvalidArgument
        - value: InternalServerError
        - value: ServiceUnavailable
        - value: ResourceNotFound
        - value: Unauthorized
        - value: RequestRateTooHigh
    TargetInput:
      description: Destination for the finished translated documents
      required:
      - language
      - targetUrl
      type: object
      properties:
        targetUrl:
          description: Location of the folder / container with your documents
          type: string
          example: https://myblob.blob.core.windows.net/TargetUrl/
        category:
          description: Category / custom system for translation request
          type: string
          example: general
        language:
          description: Target Language
          type: string
          example: fr
        glossaries:
          description: List of Glossary
          type: array
          items:
            $ref: '#/components/schemas/Glossary'
        options:
          $ref: '#/components/schemas/BatchRequestOptions'
        storageSource:
          $ref: '#/components/schemas/StorageSource'
    BatchRequest:
      description: Definition for the input batch translation request
      required:
      - source
      - targets
      type: object
      properties:
        source:
          $ref: '#/components/schemas/SourceInput'
        targets:
          description: Location of the destination for the output
          type: array
          items:
            $ref: '#/components/schemas/TargetInput'
        storageType:
          $ref: '#/components/schemas/StorageInputType'
    Glossary:
      description: Glossary / translation memory for the request
      required:
      - format
      - glossaryUrl
      type: object
      properties:
        glossaryUrl:
          description: "Location of the glossary. \nWe will use the file extension to extract the formatting if the format parameter is not supplied.\n\nIf the translation language pair is not present in the glossary, it will not be applied"
          type: string
          example: https://myblob.blob.core.windows.net/Container/myglossary.tsv
        format:
          description: Format
          type: string
          example: XLIFF
        version:
          description: Optional Version.  If not specified, default is used.
          type: string
          example: '2.0'
        storageSource:
          $ref: '#/components/schemas/StorageSource'
    SourceInput:
      description: Source of the input documents
      required:
      - sourceUrl
      type: object
      properties:
        sourceUrl:
          description: Location of the folder / container or single file with your documents
          type: string
          example: https://myblob.blob.core.windows.net/Container/
        filter:
          $ref: '#/components/schemas/DocumentFilter'
        language:
          description: 'Language code

            If none is specified, we will perform auto detect on the document'
          type: string
          example: en
        storageSource:
          $ref: '#/components/schemas/StorageSource'
    StorageInputType:
      description: Storage type of the input documents source string
      enum:
      - Folder
      - File
      type: string
      x-ms-enum:
        name: StorageInputType
        modelAsString: true
        values:
        - value: Folder
        - value: File
    StorageSource:
      description: Storage Source
      enum:
      - AzureBlob
      type: string
      x-ms-enum:
        name: StorageSource
        modelAsString: true
        values:
        - value: AzureBlob
    DocumentFilter:
      type: object
      properties:
        prefix:
          description: "A case-sensitive prefix string to filter documents in the source path for translation. \nFor example, when using a Azure storage blob Uri, use the prefix to restrict sub folders for translation."
          type: string
          example: FolderA
        suffix:
          description: "A case-sensitive suffix string to filter documents in the source path for translation. \nThis is most often use for file extensions"
          type: string
          example: .txt
    FileFormat:
      required:
      - contentTypes
      - fileExtensions
      - format
      type: object
      properties:
        format:
          description: Name of the format
          type: string
          example: PlainText
        fileExtensions:
          description: Supported file extension for this format
          type: array
          items:
            type: string
        contentTypes:
          description: Supported Content-Types for this format
          type: array
          items:
            type: string
        defaultVersion:
          description: Default version if none is specified
          type: string
        versions:
          description: Supported Version
          type: array
          items:
            type: string
    DocumentsStatus:
      description: Documents Status Response
      required:
      - value
      type: object
      properties:
        value:
          description: The detail status of individual documents
          type: array
          items:
            $ref: '#/components/schemas/DocumentStatus'
        '@nextLink':
          description: Url for the next page.  Null if no more pages available
          type: string
          example: https://westus.cognitiveservices.azure.com/translator/text/batch/v1.1/operations/727BF148-F327-47A0-9481-ABAE6362F11E/documents?$top=5&$skip=15
    AdditionalOutputFileFormat:
      description: List of possible additional output formats
      enum:
      - None
      - OpenXmlWord
      type: string
      x-ms-enum:
        name: AdditionalOutputFileFormat
        modelAsString: true
        values:
        - value: None
        - value: OpenXmlWord
    BatchRequestOptions:
      type: object
      properties:
        pdfOutputAdditionalFormat:
          $ref: '#/components/schemas/AdditionalOutputFileFormat'
    TranslationErrorResponse:
      description: 'Contains unified error information used for HTTP responses across any Cognitive Service. Instances

        can be created either through Microsoft.CloudAI.Containers.HttpStatusExceptionV2 or by returning it directly from

        a controller.'
      type: object
      properties:
        error:
          $ref: '#/components/schemas/TranslationError'
    TranslationStatus:
      description: Translation job status response
      required:
      - createdDateTimeUtc
      - id
      - lastActionDateTimeUtc
      - status
      - summary
      type: object
      properties:
        id:
          format: uuid
          description: Id of the operation.
          type: string
          example: 36724748-f7a0-4db7-b7fd-f041ddc75033
        createdDateTimeUtc:
          format: date-time
          description: Operation created date time
          type: string
          example: '2020-01-20T11:40:07.7010000-08:00'
        lastActionDateTimeUtc:
          format: date-time
          description: Date time in which the operation's status has been updated
          type: string
          example: '2020-01-20T11:41:07.7010000-08:00'
        status:
          $ref: '#/components/schemas/Status'
        error:
          $ref: '#/components/schemas/TranslationError'
        summary:
          $ref: '#/components/schemas/StatusSummary'
    StartTranslationDetails:
      description: Translation job submission batch request
      required:
      - inputs
      type: object
      properties:
        inputs:
          description: The input list of documents or folders containing documents
          type: array
          items:
            $ref: '#/components/schemas/BatchRequest'
    TranslationsStatus:
      description: Translation job Status Response
      required:
      - value
      type: object
      properties:
        value:
          description: The summary status of individual operation
          type: array
          items:
            $ref: '#/components/schemas/TranslationStatus'
        '@nextLink':
          description: Url for the next page.  Null if no more pages available
          type: string
          example: https://westus.cognitiveservices.azure.com/translator/text/batch/v1.1/operations?$top=5&$skip=15
    DocumentStatus:
      description: Document Status Response
      required:
      - createdDateTimeUtc
      - id
      - lastActionDateTimeUtc
      - progress
      - sourcePath
      - status
      - to
      type: object
      properties:
        path:
          description: Location of the document or folder
          type: string
          example: https://myblob.blob.core.windows.net/mycontainer/fr/mydoc.txt
        sourcePath:
          description: Location of the source document
          type: string
          example: https://myblob.blob.core.windows.net/mycontainer/fr/mydoc.txt
        createdDateTimeUtc:
          format: date-time
          description: Operation created date time
          type: string
          example: '2020-01-20T11:40:07.7010000-08:00'
        lastActionDateTimeUtc:
          format: date-time
          description: Date time in which the operation's status has been updated
          type: string
          example: '2020-01-20T11:41:07.7010000-08:00'
        status:
          $ref: '#/components/schemas/Status'
        to:
          description: To language
          type: string
        error:
          $ref: '#/components/schemas/TranslationError'
        progress:
          format: float
          description: Progress of the translation if available
          maximum: 1
          minimum: 0
          type: number
          example: 0.5
        id:
          format: uuid
          description: Document Id
          type: string
          example: 1c7399a7-6913-4f20-bb43-e2fe2ba1a67d
        characterCharged:
          format: int64
          description: Character charged by the API
          type: integer
    SupportedFileFormats:
      description: List of supported file formats
      required:
      - value
      type: object
      properties:
        value:
          description: list of objects
          type: array
          items:
            $ref: '#/components/schemas/FileFormat'
    InnerTranslationError:
      description: 'New Inner Error format which conforms to Cognitive Services API Guidelines which is available at https://microsoft.sharepoint.com/%3Aw%3A/t/CognitiveServicesPMO/EUoytcrjuJdKpeOKIK_QRC8BPtUYQpKBi8JsWyeDMRsWlQ?e=CPq8ow.

        This contains required properties ErrorCode, message and optional properties target, details(key value pair), inner error(this can be nested).'
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Gets code error string.
          type: string
        message:
          description: Gets high level error message.
          type: string
        target:
          description: "Gets the source of the error. \nFor example it would be \"documents\" or \"document id\" in case of invalid document."
          type: string
          readOnly: true
        innerError:
          $ref: '#/components/schemas/InnerTranslationError'
  securitySchemes:
    subscription_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: Provide your cognitive services subscription key here.
