              example: "{\n  \"error\": {\n    \"code\": \"InternalServerError\",\n    \"message\": \"Internal Server Error\",\n    \"target\": \"batch\",\n    \"innerError\": {\n      \"code\": \"InternalServerError\",\n      \"message\": \"Unexpected internal server error has occurred\"\n    }\n  }\n}"
        '503':
          description: Server temporary unavailable
          x-ms-error-response: true
