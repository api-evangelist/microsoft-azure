  /api/hubs/{hub}/:generateToken:
    post:
      tags:
      - Webpubsub
      summary: Microsoft Azure Generate Token For The Client To Connect Azure Web Pubsub Service
      operationId: microsoftAzureWebpubsubGenerateclienttoken
      parameters:
      - in: path
        name: hub
        description: Target hub name, which should start with alphabetic characters and only contain alpha-numeric characters or underscore.
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_`,.[\]]{0,127}$
      - in: query
        name: userId
        description: User Id.
        schema:
          type: string
          default: ''
      - in: query
        name: role
        description: Roles that the connection with the generated token will have.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: minutesToExpire
        description: The expire time of the generated token.
        schema:
          type: integer
          format: int32
          default: 60
      - in: query
        name: api-version
        description: The version of the REST APIs.
        schema:
          type: string
          default: 2021-05-01-preview
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ClientTokenResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTokenResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ClientTokenResponse'
        default:
          description: Error response
          x-ms-error-response: true
      description: Needs a more full description created.
