openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Available Provider Operations API
tags:
- name: AvailableProviderOperations
paths:
  /providers/Microsoft.StorSimple/operations:
    get:
      tags:
      - AvailableProviderOperations
      description: List of AvailableProviderOperations
      operationId: microsoftAzureAvailableprovideroperationsList
      parameters:
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableProviderOperations'
        default:
          description: Default Response. It will be deserialized as per the Error definition specified in the schema. Exception will be thrown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        OperationsList:
          $ref: ./examples/OperationsList.json
      summary: Microsoft Azure Get Providers Microsoft Storsimple Operations
components:
  schemas:
    AvailableProviderOperation:
      description: Class represents provider operation
      type: object
      properties:
        name:
          description: "Gets or sets the name of the operation being performed on this particular object\nReturn value format: \"{resourceProviderNamespace}/{resourceType}/{read|write|deletion|action}\"\nEg: Microsoft.StorSimple/managers/devices/fileServers/read\n    Microsoft.StorSimple/managers/devices/alerts/clearAlerts/action"
          type: string
        display:
          $ref: '#/components/schemas/AvailableProviderOperationDisplay'
          description: 'Gets or sets Display information

            Contains the localized display information for this particular operation/action'
        origin:
          description: 'Gets or sets Origin

            The intended executor of the operation; governs the display of the operation in the RBAC UX and the audit logs UX.

            Default value is “user,system”'
          type: string
        properties:
          $ref: '#/components/schemas/AvailableProviderOperationProperties'
          description: 'Gets or sets Properties

            Reserved for future use'
          x-ms-client-flatten: true
    Error:
      required:
      - errorCode
      - message
      type: object
      properties:
        errorCode:
          type: string
        message:
          $ref: '#/components/schemas/Message'
        values:
          type: array
          items:
            $ref: '#/components/schemas/Item'
          x-ms-identifiers:
          - key
    AvailableProviderOperationProperties:
      description: Class represents Properties in AvailableProviderOperations
      type: object
      properties: {}
    AvailableProviderOperationDisplay:
      description: "Contains the localized display information for this particular operation / action. \nThese value will be used by several clients for \n(1) custom role definitions for RBAC; \n(2) complex query filters for the event service; and (3) audit history / records for management operations."
      type: object
      properties:
        provider:
          description: "Gets or sets Provider\nThe localized friendly form of the resource provider name – it is expected to also include the publisher/company responsible. \nIt should use Title Casing and begin with “Microsoft” for 1st party services."
          type: string
        resource:
          description: "Gets or sets Resource\nThe localized friendly form of the resource type related to this action/operation – it should match the public documentation for the resource provider. \nIt should use Title Casing – for examples, please refer to the “name” section."
          type: string
        operation:
          description: "Gets or sets Operation\nThe localized friendly name for the operation, as it should be shown to the user. \nIt should be concise (to fit in drop downs) but clear (i.e. self-documenting). It should use Title Casing and include the entity/resource to which it applies."
          type: string
        description:
          description: "Gets or sets Description\nThe localized friendly description for the operation, as it should be shown to the user. \nIt should be thorough, yet concise – it will be used in tool tips and detailed views."
          type: string
    Message:
      type: object
      properties:
        language:
          type: string
        value:
          type: string
    AvailableProviderOperations:
      description: Class for set of operations used for discovery of available provider operations.
      required:
      - value
      type: object
      properties:
        value:
          description: The value.
          type: array
          items:
            $ref: '#/components/schemas/AvailableProviderOperation'
          x-ms-identifiers:
          - name
        nextLink:
          description: The NextLink.
          type: string
    Item:
      required:
      - key
      - value
      type: object
      properties:
        key:
          type: string
        value:
          type: string
  parameters:
    apiVersionParameter:
      name: api-version
      in: query
      description: The api version
      required: true
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
