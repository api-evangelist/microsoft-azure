openapi: 3.2.0
info:
  title: Microsoft Azure Content Moderator Client Image Moderation…
  version: '1.0'
  description: You use the API to scan your content as it's generated.
security:
- apim_key: []
tags:
- name: ImageModeration
paths:
  /contentmoderator/moderate/v1.0/ProcessImage/FindFaces:
    post:
      tags:
      - ImageModeration
      operationId: microsoftAzureImagemoderationFindfaces
      description: Returns the list of faces found.
      parameters:
      - $ref: '#/components/parameters/CacheImage'
      responses:
        '200':
          description: List of faces found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundFaces'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      summary: Microsoft Azure Post Contentmoderator Moderate 0 Processimage Findfaces
  /contentmoderator/moderate/v1.0/ProcessImage/OCR:
    post:
      tags:
      - ImageModeration
      operationId: microsoftAzureImagemoderationOcr
      description: Returns any text found in the image for the specified language. If no language is specified in the input, the detection defaults to English.
      parameters:
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/CacheImage'
      - $ref: '#/components/parameters/enhanced'
      responses:
        '200':
          description: Text found and list of candidate text details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCR'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      summary: Microsoft Azure Post Contentmoderator Moderate 0 Processimage Ocr
  /contentmoderator/moderate/v1.0/ProcessImage/Evaluate:
    post:
      tags:
      - ImageModeration
      operationId: microsoftAzureImagemoderationEvaluate
      description: Returns probabilities of the image containing racy or adult content.
      parameters:
      - $ref: '#/components/parameters/CacheImage'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluate'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      summary: Microsoft Azure Post Contentmoderator Moderate 0 Processimage Evaluate
  /contentmoderator/moderate/v1.0/ProcessImage/Match:
    post:
      tags:
      - ImageModeration
      operationId: microsoftAzureImagemoderationMatch
      description: 'Fuzzily match an image against one of your custom image lists. You can create and manage your custom image lists by using this API.


        Returns the ID and tags of a matching image.


        Note: You must refresh the index on the corresponding image list to ensure that additions and removals are reflected in the response.'
      parameters:
      - $ref: '#/components/parameters/listIdQueryParameter'
      - $ref: '#/components/parameters/CacheImage'
      responses:
        '200':
          description: 'Supported values for tags are:

            <ul>

            <li>101: Nudity</li>

            <li>102: Sexual Content</li>

            <li>201: Alcohol</li>

            <li>202: Tobacco</li>

            <li>203: Drugs</li>

            <li>301: Child Exploitation</li>

            <li>401: Violence</li>

            <li>402: Weapons</li>

            <li>403: Gore</li>

            <li>501: Profanity</li>

            <li>502: Vulgarity</li>

            </ul>.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      summary: Microsoft Azure Post Contentmoderator Moderate 0 Processimage Match
components:
  schemas:
    APIError:
      type: object
      description: Error information that the API returns.
      properties:
        Error:
          $ref: '#/components/schemas/Error'
    Status:
      description: Status properties.
      properties:
        Code:
          description: Status code.
          type: integer
        Description:
          description: Status description.
          type: string
        Exception:
          description: Exception status.
          type: string
    KeyValuePair:
      description: Key/value pair object properties.
      properties:
        Key:
          description: Key parameter.
          type: string
        Value:
          description: Value parameter.
          type: string
    MatchResponse:
      description: Response for a match request.
      properties:
        TrackingId:
          description: Tracking ID.
          type: string
        CacheID:
          description: Cache ID.
          type: string
        IsMatch:
          description: Indicates if there is a match.
          type: boolean
        Matches:
          description: Match details.
          type: array
          items:
            $ref: '#/components/schemas/Match'
        Status:
          description: Evaluation status.
          $ref: '#/components/schemas/Status'
    Candidate:
      description: Optical character recognition (OCR) candidate text.
      properties:
        Text:
          description: Text found.
          type: string
        Confidence:
          description: Confidence level.
          type: number
    Evaluate:
      description: Evaluation response object.
      properties:
        CacheID:
          description: Cache ID.
          type: string
        Result:
          description: Evaluation result.
          type: boolean
        TrackingId:
          description: Tracking ID.
          type: string
        AdultClassificationScore:
          description: Adult classification score.
          type: number
        IsImageAdultClassified:
          description: Indicates if an image is classified as adult.
          type: boolean
        RacyClassificationScore:
          description: Racy classification score.
          type: number
        IsImageRacyClassified:
          description: Indicates if the image is classified as racy.
          type: boolean
        AdvancedInfo:
          description: Advanced info.
          type: array
          items:
            $ref: '#/components/schemas/KeyValuePair'
        Status:
          description: Evaluation status.
          $ref: '#/components/schemas/Status'
    OCR:
      description: Contains the text found in an image for the specified language.
      properties:
        Status:
          description: Evaluation status.
          $ref: '#/components/schemas/Status'
        Metadata:
          description: Array of key/value pairs.
          type: array
          items:
            $ref: '#/components/schemas/KeyValuePair'
        TrackingId:
          description: Tracking ID.
          type: string
        CacheId:
          description: Cache ID.
          type: string
        Language:
          description: ISO 639-3 code.
          type: string
        Text:
          description: Found text.
          type: string
        Candidates:
          description: List of candidate text.
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
    FoundFaces:
      description: Request object that contains found faces.
      properties:
        Status:
          description: Evaluation status.
          $ref: '#/components/schemas/Status'
        TrackingId:
          description: Tracking ID.
          type: string
        CacheId:
          description: Cache ID.
          type: string
        Result:
          description: True if a result was found.
          type: boolean
        Count:
          description: Number of faces found.
          type: integer
        AdvancedInfo:
          description: Advanced info.
          type: array
          items:
            $ref: '#/components/schemas/KeyValuePair'
        Faces:
          description: List of faces.
          type: array
          items:
            $ref: '#/components/schemas/Face'
    Error:
      type: object
      description: Error body.
      properties:
        Code:
          type: string
        Message:
          type: string
    Face:
      description: Coordinates to the found face.
      properties:
        Bottom:
          description: Bottom coordinate.
          type: integer
        Left:
          description: Left coordinate.
          type: integer
        Right:
          description: Right coordinate.
          type: integer
        Top:
          description: Top coordinate.
          type: integer
    Match:
      description: Match details.
      properties:
        Score:
          description: Confidence score of the image match.
          type: number
        MatchId:
          description: Match ID.
          type: integer
        Source:
          description: Source.
          type: string
        Tags:
          description: Tags for match details.
          type: array
          items:
            type: integer
        Label:
          description: Label.
          type: string
  parameters:
    enhanced:
      name: enhanced
      in: query
      description: 'When it''s set to true, the image goes through additional processing to come with additional candidates.


        The image or TIFF file is not supported when enhanced is set to true.


        Note: This affects the response time.'
      x-ms-parameter-location: method
      schema:
        type: boolean
        default: false
    language:
      name: language
      in: query
      description: Language of the terms.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    listIdQueryParameter:
      name: listId
      in: query
      description: List ID.
      x-ms-parameter-location: method
      schema:
        type: string
    CacheImage:
      name: CacheImage
      in: query
      description: Whether to retain the submitted image for future use. If it's omitted, the default is false.
      x-ms-parameter-location: method
      schema:
        type: boolean
  securitySchemes:
    apim_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
x-ms-parameterized-host:
  hostTemplate: '{Endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
