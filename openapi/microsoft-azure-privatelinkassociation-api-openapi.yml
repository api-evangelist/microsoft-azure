openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Private Link Association API
tags:
- name: PrivateLinkAssociation
paths:
  ? /providers/Microsoft.Management/managementGroups/{groupId}/providers/Microsoft.Authorization/privateLinkAssociations/{plaId}
  : put:
      tags:
      - PrivateLinkAssociation
      operationId: microsoftAzurePrivatelinkassociationPut
      description: Create a PrivateLinkAssociation
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/PrivateLinkAssociationIdParameter'
      responses:
        '200':
          description: Ok - Returns information about the new private link association.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkAssociation'
        '201':
          description: Created - Returns information about the new private link association.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkAssociation'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        Create a private link association, associate scope to rmpl.:
          $ref: ./examples/PutPrivateLinkAssociation.json
      summary: Microsoft Azure Put Providers Microsoft Management Managementgroups Groupid Providers Microsoft Authorization Privatelinkassociations Plaid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateLinkAssociationObject'
        description: Parameters supplied to create the private link association.
        required: true
    get:
      tags:
      - PrivateLinkAssociation
      operationId: microsoftAzurePrivatelinkassociationGet
      description: Get a single private link association
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/PrivateLinkAssociationIdParameter'
      responses:
        '200':
          description: Ok. The request has succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkAssociation'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        Get a single private link association.:
          $ref: ./examples/GetPrivateLinkAssociation.json
      summary: Microsoft Azure Get Providers Microsoft Management Managementgroups Groupid Providers Microsoft Authorization Privatelinkassociations Plaid
    delete:
      tags:
      - PrivateLinkAssociation
      operationId: microsoftAzurePrivatelinkassociationDelete
      description: Delete a PrivateLinkAssociation
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/PrivateLinkAssociationIdParameter'
      responses:
        '200':
          description: OK
        '204':
          description: ''
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        Delete a private link association.:
          $ref: ./examples/DeletePrivateLinkAssociation.json
      summary: Microsoft Azure Delete Providers Microsoft Management Managementgroups Groupid Providers Microsoft Authorization Privatelinkassociations Plaid
  /providers/Microsoft.Management/managementGroups/{groupId}/providers/Microsoft.Authorization/privateLinkAssociations:
    get:
      tags:
      - PrivateLinkAssociation
      operationId: microsoftAzurePrivatelinkassociationList
      description: Get a private link association for a management group scope
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/GroupIdParameter'
      responses:
        '200':
          description: Ok. The request has succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkAssociationGetResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        Get a private link association for a MG scope.:
          $ref: ./examples/ListPrivateLinkAssociation.json
      summary: Microsoft Azure Get Providers Microsoft Management Managementgroups Groupid Providers Microsoft Authorization Privatelinkassociations
