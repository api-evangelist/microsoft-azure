    TranscriptionProperties_2:
      title: TranscriptionProperties
      type: object
      properties:
        wordLevelTimestampsEnabled:
          description: 'A value indicating whether word level timestamps are requested. The default value is

            `false`.'
          type: boolean
        displayFormWordLevelTimestampsEnabled:
          description: A value indicating whether word level timestamps for the display form are requested. The default value is `false`.
          type: boolean
        duration:
          description: 'The duration of the transcription. The duration is encoded as ISO 8601 duration

            ("PnYnMnDTnHnMnS", see https://en.wikipedia.org/wiki/ISO_8601#Durations).'
          type: string
          readOnly: true
        channels:
          description: 'A collection of the requested channel numbers.

            In the default case, the channels 0 and 1 are considered.'
          type: array
          items:
            format: int32
            type: integer
        destinationContainerUrl:
          format: uri
          description: 'The requested destination container.

            ### Remarks ###

            When a destination container is used in combination with a `timeToLive`, the metadata of a

            transcription will be deleted normally, but the data stored in the destination container, including

            transcription results, will remain untouched, because no delete permissions are required for this

            container.<br />

            To support automatic cleanup, either configure blob lifetimes on the container, or use "Bring your own Storage (BYOS)"

            instead of `destinationContainerUrl`, where blobs can be cleaned up.'
          type: string
        punctuationMode:
          $ref: '#/components/schemas/PunctuationMode'
        profanityFilterMode:
          $ref: '#/components/schemas/ProfanityFilterMode'
        timeToLive:
          description: 'How long the transcription will be kept in the system after it has completed. Once the

            transcription reaches the time to live after completion (successful or failed) it will be automatically

            deleted. Not setting this value or setting it to 0 will disable automatic deletion. The longest supported

            duration is 31 days.

            The duration is encoded as ISO 8601 duration ("PnYnMnDTnHnMnS", see https://en.wikipedia.org/wiki/ISO_8601#Durations).'
          type: string
        email:
          description: 'The email address to send email notifications to in case the operation completes.

            The value will be removed after successfully sending the email.'
          type: string
        error:
          $ref: '#/components/schemas/EntityError_2'
        diarizationEnabled:
          description: "A value indicating whether diarization (speaker identification) is requested. The default value\nis `false`.\nIf this field is set to true and the improved diarization system is configured by specifying\n`DiarizationProperties`, the improved diarization system will provide diarization for a configurable\nrange of speakers.\nIf this field is set to true and the improved diarization system is not enabled (not specifying\n`DiarizationProperties`), the basic diarization system will distinguish between up to two speakers.\nNo extra charges are applied for the basic diarization.\n            \nThe basic diarization system is deprecated and will be removed in the next major version of the API.\nThis `diarizationEnabled` setting will also be removed."
          type: boolean
        diarization:
          $ref: '#/components/schemas/DiarizationProperties'
        languageIdentification:
          $ref: '#/components/schemas/LanguageIdentificationProperties'
