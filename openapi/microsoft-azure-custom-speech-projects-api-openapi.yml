    ProjectProperties:
      title: ProjectProperties
      type: object
      properties:
        datasetCount:
          format: int32
          description: The number of datasets associated to this project.
          type: integer
          readOnly: true
        evaluationCount:
          format: int32
          description: The number of evaluations associated to this project.
          type: integer
          readOnly: true
        modelCount:
          format: int32
          description: The number of models associated to this project.
          type: integer
          readOnly: true
        transcriptionCount:
          format: int32
          description: The number of transcriptions associated to this project.
          type: integer
          readOnly: true
        endpointCount:
          format: int32
          description: The number of endpoints associated to this project.
          type: integer
          readOnly: true
    Status:
      title: Status
      description: Describe the current state of the API
      enum:
      - NotStarted
      - Running
      - Succeeded
      - Failed
      type: string
      readOnly: true
      x-ms-enum:
        name: Status
        modelAsString: false
        values:
        - value: NotStarted
          description: The long running operation has not yet started.
        - value: Running
          description: The long running operation is currently processing.
        - value: Succeeded
          description: The long running operation has successfully completed.
        - value: Failed
          description: The long running operation has failed.
    Model:
      title: Model
      required:
      - displayName
      - locale
      type: object
      properties:
        project:
          $ref: '#/components/schemas/EntityReference'
        links:
          $ref: '#/components/schemas/ModelLinks'
        properties:
          $ref: '#/components/schemas/ModelProperties'
        self:
          format: uri
          description: The location of this entity.
          type: string
          readOnly: true
        displayName:
          description: The display name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        text:
          description: The text used to adapt this language model.
          type: string
        baseModel:
          $ref: '#/components/schemas/EntityReference'
        datasets:
          description: Datasets used for adaptation.
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        locale:
          description: The locale of the contained data.
          type: string
        lastActionDateTime:
          format: date-time
          description: 'The time-stamp when the current status was entered.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status'
        createdDateTime:
          format: date-time
          description: 'The time-stamp when the object was created.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
        customProperties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
    EndpointProperties:
      title: EndpointProperties
      type: object
      properties:
        loggingEnabled:
          description: A value indicating whether content logging (audio & transcriptions) is being used for a deployment.
          type: boolean
        timeToLive:
          description: 'How long the endpoint will be kept in the system. Once the endpoint reaches the time to live

            after completion (successful or failed) it will be automatically deleted. Not setting this value or setting

            to 0 will disable automatic deletion. The longest supported duration is 31 days.

            The duration is encoded as ISO 8601 duration ("PnYnMnDTnHnMnS", see https://en.wikipedia.org/wiki/ISO_8601#Durations).'
          type: string
        email:
          description: 'The email address to send email notifications to in case the operation completes.

            The value will be removed after successfully sending the email.'
          type: string
        error:
          $ref: '#/components/schemas/EntityError'
    Dataset:
      title: Dataset
      required:
      - displayName
      - kind
      - locale
      type: object
      properties:
        links:
          $ref: '#/components/schemas/Links'
        properties:
          $ref: '#/components/schemas/DatasetProperties'
        kind:
          $ref: '#/components/schemas/DatasetKind'
        self:
          format: uri
          description: The location of this entity.
          type: string
          readOnly: true
        displayName:
          description: The display name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        project:
          $ref: '#/components/schemas/EntityReference'
        contentUrl:
          format: uri
          description: The URL of the data for the dataset.
          type: string
        customProperties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
        locale:
          description: The locale of the contained data.
          type: string
        lastActionDateTime:
          format: date-time
          description: 'The time-stamp when the current status was entered.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status'
        createdDateTime:
          format: date-time
          description: 'The time-stamp when the object was created.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
    Links:
      title: Links
      type: object
      properties:
        files:
          format: uri
          description: The location to get all files of this entity.
          type: string
          readOnly: true
    EvaluationProperties:
      title: EvaluationProperties
      type: object
      properties:
        wordErrorRate2:
          format: double
          description: The word error rate of recognition with model2.
          type: number
          readOnly: true
        wordErrorRate1:
          format: double
          description: The word error rate of recognition with model1.
          type: number
          readOnly: true
