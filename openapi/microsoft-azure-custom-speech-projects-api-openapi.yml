openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: 'Microsoft Azure AccessControlClient AccessConnector Custom Speech Projects: Custom Speech Projects: API'
tags:
- name: 'Custom Speech Projects:'
paths:
  /projects/locales:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Supported Locales
      operationId: microsoftAzureGetsupportedprojectlocales
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Get the supported locales:
          $ref: ./examples/get_supported_project_locales.json
      description: Needs a more full description created.
  /projects:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Projects For The Authenticated Subscription
      operationId: microsoftAzureGetprojects
      parameters:
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all projects:
          $ref: ./examples/get_projects.json
      description: Needs a more full description created.
    post:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Creates A New Project
      operationId: microsoftAzureCreateproject
      responses:
        '201':
          description: The response contains information about the entity as payload and its location as header.
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Create a project:
          $ref: ./examples/create_project.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
        description: The details of the project.
        required: true
  /projects/{id}:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The Project Identified By The Given Id
      operationId: microsoftAzureGetproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Get a project:
          $ref: ./examples/get_project.json
      description: Needs a more full description created.
    patch:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Updates The Project Identified By The Given Id
      operationId: microsoftAzureUpdateproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Update a project:
          $ref: ./examples/update_project.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
        description: The updated values for the project.
        required: true
    delete:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Deletes The Project Identified By The Given Id
      operationId: microsoftAzureDeleteproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The project was successfully deleted or did not exist.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Delete a project:
          $ref: ./examples/delete_project.json
      description: Needs a more full description created.
  /projects/{id}/evaluations:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Evaluations For Specified Project
      operationId: microsoftAzureGetevaluationsforproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvaluations'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all evaluations:
          $ref: ./examples/get_project_evaluations.json
      description: Needs a more full description created.
  /projects/{id}/datasets:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Datasets For Specified Project
      operationId: microsoftAzureGetdatasetsforproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatasets'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all datasets:
          $ref: ./examples/get_project_datasets.json
      description: Needs a more full description created.
  /projects/{id}/endpoints:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Endpoints For Specified Project
      operationId: microsoftAzureGetendpointsforproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEndpoints'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all endpoints:
          $ref: ./examples/get_project_endpoints.json
      description: Needs a more full description created.
  /projects/{id}/models:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Models For Specified Project
      operationId: microsoftAzureGetmodelsforproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedModels'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all models:
          $ref: ./examples/get_project_models.json
      description: Needs a more full description created.
  /projects/{id}/transcriptions:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Transcriptions For Specified Project
      operationId: microsoftAzureGettranscriptionsforproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTranscriptions'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all transcriptions:
          $ref: ./examples/get_project_transcriptions.json
      description: Needs a more full description created.
components:
  schemas:
    ModelLinks:
      title: ModelLinks
      type: object
      properties:
        manifest:
          format: uri
          description: The location to get a manifest for this model to be used in the on-prem container.
          type: string
          readOnly: true
        copyTo:
          format: uri
          description: The location to the model copy action.
          type: string
          readOnly: true
    DatasetKind:
      title: DatasetKind
      description: Type of data import.
      enum:
      - Language
      - Acoustic
      - Pronunciation
      - AudioFiles
      type: string
      x-ms-enum:
        name: DatasetKind
        modelAsString: false
        values:
        - value: Language
          description: A language data import.
        - value: Acoustic
          description: An acoustic data import.
        - value: Pronunciation
          description: A pronunciation data import.
        - value: AudioFiles
          description: An audio files data import.
    Transcription:
      title: Transcription
      required:
      - displayName
      - locale
      type: object
      properties:
        links:
          $ref: '#/components/schemas/Links'
        properties:
          $ref: '#/components/schemas/TranscriptionProperties'
        self:
          format: uri
          description: The location of this entity.
          type: string
          readOnly: true
        model:
          $ref: '#/components/schemas/EntityReference'
        project:
          $ref: '#/components/schemas/EntityReference'
        dataset:
          $ref: '#/components/schemas/EntityReference'
        contentUrls:
          description: 'A list of content urls to get audio files to transcribe. Up to 1000 urls are allowed.

            This property will not be returned in a response.'
          type: array
          items:
            format: uri
            type: string
        contentContainerUrl:
          format: uri
          description: 'A URL for an Azure blob container that contains the audio files. A container is allowed to have a maximum size of 5GB and a maximum number of 10000 blobs.

            The maximum size for a blob is 2.5GB.

            Container SAS should contain ''r'' (read) and ''l'' (list) permissions.

            This property will not be returned in a response.'
          type: string
        displayName:
          description: The display name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        customProperties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
        locale:
          description: The locale of the contained data.
          type: string
        lastActionDateTime:
          format: date-time
          description: 'The time-stamp when the current status was entered.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status'
        createdDateTime:
          format: date-time
          description: 'The time-stamp when the object was created.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
    Error:
      title: Error
      description: 'New format which conforms to the new Cognitive Services API guidelines which is available at https://microsoft.sharepoint.com/%3Aw%3A/t/CognitiveServicesPMO/EUoytcrjuJdKpeOKIK_QRC8BPtUYQpKBi8JsWyeDMRsWlQ?e=CPq8ow.

        This contains an outer error with error code, message, details, target and an inner error with more descriptive details.'
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          description: Additional supportive details regarding the error and/or expected policies.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          description: High level error message.
          type: string
        target:
          description: 'The source of the error.

            For example it would be "documents" or "document id" in case of invalid document.'
          type: string
        innerError:
          $ref: '#/components/schemas/InnerError'
    Endpoint:
      title: Endpoint
      required:
      - displayName
      - locale
      type: object
      properties:
        project:
          $ref: '#/components/schemas/EntityReference'
        links:
          $ref: '#/components/schemas/EndpointLinks'
        properties:
          $ref: '#/components/schemas/EndpointProperties'
        self:
          format: uri
          description: The location of this entity.
          type: string
          readOnly: true
        displayName:
          description: The display name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        text:
          description: The text used to adapt a language model for this endpoint.
          type: string
        model:
          $ref: '#/components/schemas/EntityReference'
        locale:
          description: The locale of the contained data.
          type: string
        customProperties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
        lastActionDateTime:
          format: date-time
          description: 'The time-stamp when the current status was entered.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status'
        createdDateTime:
          format: date-time
          description: 'The time-stamp when the object was created.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
    ModelDeprecationDates:
      title: ModelDeprecationDates
      type: object
      properties:
        adaptationDateTime:
          format: date-time
          type: string
          readOnly: true
        transcriptionDateTime:
          format: date-time
          type: string
          readOnly: true
    ProjectUpdate:
      title: ProjectUpdate
      type: object
      properties:
        displayName:
          description: The name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        customProperties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
    Dataset:
      title: Dataset
      required:
      - displayName
      - kind
      - locale
      type: object
      properties:
        links:
          $ref: '#/components/schemas/Links'
        properties:
          $ref: '#/components/schemas/DatasetProperties'
        kind:
          $ref: '#/components/schemas/DatasetKind'
        self:
          format: uri
          description: The location of this entity.
          type: string
          readOnly: true
        displayName:
          description: The display name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        project:
          $ref: '#/components/schemas/EntityReference'
        contentUrl:
          format: uri
          description: The URL of the data for the dataset.
          type: string
        customProperties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
        locale:
          description: The locale of the contained data.
          type: string
        lastActionDateTime:
          format: date-time
          description: 'The time-stamp when the current status was entered.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status'
        createdDateTime:
          format: date-time
          description: 'The time-stamp when the object was created.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
    PunctuationMode:
      title: PunctuationMode
      description: The mode used for punctuation.
      enum:
      - None
      - Dictated
      - Automatic
      - DictatedAndAutomatic
      type: string
      x-ms-enum:
        name: PunctuationMode
        modelAsString: false
        values:
        - value: None
          description: No punctuation.
        - value: Dictated
          description: Dictated punctuation marks only, i.e., explicit punctuation.
        - value: Automatic
          description: Automatic punctuation.
        - value: DictatedAndAutomatic
          description: Dictated punctuation marks or automatic punctuation.
    ErrorCode:
      title: ErrorCode
      description: High level error codes.
      enum:
      - InvalidRequest
      - InvalidArgument
      - InternalServerError
      - ServiceUnavailable
      - NotFound
      - PipelineError
      - Conflict
      - InternalCommunicationFailed
      - Forbidden
      - NotAllowed
      - Unauthorized
      - UnsupportedMediaType
      - TooManyRequests
      - UnprocessableEntity
      type: string
      x-ms-enum:
        name: ErrorCode
        modelAsString: true
        values:
        - value: InvalidRequest
          description: Representing the invalid request error code.
        - value: InvalidArgument
          description: Representing the invalid argument error code.
        - value: InternalServerError
          description: Representing the internal server error error code.
        - value: ServiceUnavailable
          description: Representing the service unavailable error code.
        - value: NotFound
          description: Representing the not found error code.
        - value: PipelineError
          description: Representing the pipeline error error code.
        - value: Conflict
          description: Representing the conflict error code.
        - value: InternalCommunicationFailed
          description: Representing the internal communication failed error code.
        - value: Forbidden
          description: Representing the forbidden error code.
        - value: NotAllowed
          description: Representing the not allowed error code.
        - value: Unauthorized
          description: Representing the unauthorized error code.
        - value: UnsupportedMediaType
          description: Representing the unsupported media type error code.
        - value: TooManyRequests
          description: Representing the too many requests error code.
        - value: UnprocessableEntity
          description: Representing the unprocessable entity error code.
    InnerError:
      title: InnerError
      description: 'New Inner Error format which conforms to Cognitive Services API Guidelines which is available at https://microsoft.sharepoint.com/%3Aw%3A/t/CognitiveServicesPMO/EUoytcrjuJdKpeOKIK_QRC8BPtUYQpKBi8JsWyeDMRsWlQ?e=CPq8ow.

        This contains required properties ErrorCode, message and optional properties target, details(key value pair), inner error(this can be nested).'
      type: object
      properties:
        code:
          $ref: '#/components/schemas/DetailedErrorCode'
        details:
          description: Additional supportive details regarding the error and/or expected policies.
          type: object
          additionalProperties:
            type: string
        message:
          description: High level error message.
          type: string
        target:
          description: 'The source of the error.

            For example it would be "documents" or "document id" in case of invalid document.'
          type: string
        innerError:
          $ref: '#/components/schemas/InnerError'
    EndpointProperties:
      title: EndpointProperties
      type: object
      properties:
        loggingEnabled:
          description: A value indicating whether content logging (audio & transcriptions) is being used for a deployment.
          type: boolean
        timeToLive:
          description: 'How long the endpoint will be kept in the system. Once the endpoint reaches the time to live

            after completion (successful or failed) it will be automatically deleted. Not setting this value or setting

            to 0 will disable automatic deletion. The longest supported duration is 31 days.

            The duration is encoded as ISO 8601 duration ("PnYnMnDTnHnMnS", see https://en.wikipedia.org/wiki/ISO_8601#Durations).'
          type: string
        email:
          description: 'The email address to send email notifications to in case the operation completes.

            The value will be removed after successfully sending the email.'
          type: string
        error:
          $ref: '#/components/schemas/EntityError'
    Project:
      title: Project
      required:
      - displayName
      - locale
      type: object
      properties:
        links:
          $ref: '#/components/schemas/ProjectLinks'
        properties:
          $ref: '#/components/schemas/ProjectProperties'
        self:
          format: uri
          description: The location of this entity.
          type: string
          readOnly: true
        displayName:
          description: The display name of the object.
          type: string
        description:
          description: The description of the object.
          type: string
        locale:
          description: The locale of the contained data.
          type: string
        customProperties:
          description: 'The custom properties of this entity. The maximum allowed key length is 64 characters, the maximum

            allowed value length is 256 characters and the count of allowed entries is 10.'
          type: object
          additionalProperties:
            type: string
        createdDateTime:
          format: date-time
          description: 'The time-stamp when the object was created.

            The time stamp is encoded as ISO 8601 date and time format

            ("YYYY-MM-DDThh:mm:ssZ", see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).'
          type: string
          readOnly: true
    ProjectProperties:
      title: ProjectProperties
      type: object
      properties:
        datasetCount:
          format: int32
          description: The number of datasets associated to this project.
          type: integer
          readOnly: true
        evaluationCount:
          format: int32
          description: The number of evaluations associated to this project.
          type: integer
          readOnly: true
        modelCount:
          format: int32
          description: The number of models associated to this project.
          type: integer
          readOnly: true
        transcriptionCount:
          format: int32
          description: The number of transcriptions associated to this project.
          type: integer
          readOnly: true
        endpointCount:
          format: int32
          description: The number of endpoints associated to this project.
          type: integer
          readOnly: true
    EntityReference:
      title: EntityReference
      required:
      - self
      type: object
      properties:
        self:
          format: uri
          description: The location of the referenced entity.
          type: string
    EntityError:
      title: EntityError
      type: object
      properties:
        code:
          description: The code of this error.
          type: string
          readOnly: true
        message:
          description: The message for this error.
          type: string
          readOnly: true
    Links:
      title: Links
      type: object
      properties:
        files:
          format: uri
          description: The location to get all files of this entity.
          type: string
          readOnly: true
    DetailedErrorCode:
      title: DetailedErrorCode
      description: Detailed error code enum.
      enum:
      - InvalidParameterValue
      - InvalidRequestBodyFormat
      - EmptyRequest
      - MissingInputRecords
      - InvalidDocument
      - ModelVersionIncorrect
      - InvalidDocumentBatch
      - UnsupportedLanguageCode
      - DataImportFailed
      - InUseViolation
      - InvalidLocale
      - InvalidBaseModel
      - InvalidAdaptationMapping
      - InvalidDataset
