openapi: 3.2.0
info:
  title: 'Microsoft Azure Custom Speech Projects: API'
  version: '1.0'
  description: 'Operations tagged Custom Speech Projects: across 2 of this provider''s published API definitions: speech-services-api-v30-openapi-original.yml, speech-services-api-v32-preview2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
security:
- api_key: []
- token: []
tags:
- name: 'Custom Speech Projects:'
paths:
  /projects/locales:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Supported Locales
      operationId: microsoftAzureGetsupportedprojectlocales
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Get the supported locales:
          $ref: ./examples/get_supported_project_locales.json
      description: Needs a more full description created.
  /projects:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Projects For The Authenticated Subscription
      operationId: microsoftAzureGetprojects
      parameters:
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all projects:
          $ref: ./examples/get_projects.json
      description: Needs a more full description created.
    post:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Creates A New Project
      operationId: microsoftAzureCreateproject
      responses:
        '201':
          description: The response contains information about the entity as payload and its location as header.
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Create a project:
          $ref: ./examples/create_project.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
        description: The details of the project.
        required: true
  /projects/{id}:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The Project Identified By The Given Id
      operationId: microsoftAzureGetproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Get a project:
          $ref: ./examples/get_project.json
      description: Needs a more full description created.
    patch:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Updates The Project Identified By The Given Id
      operationId: microsoftAzureUpdateproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Update a project:
          $ref: ./examples/update_project.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
        description: The updated values for the project.
        required: true
    delete:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Deletes The Project Identified By The Given Id
      operationId: microsoftAzureDeleteproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The project was successfully deleted or did not exist.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        Delete a project:
          $ref: ./examples/delete_project.json
      description: Needs a more full description created.
  /projects/{id}/evaluations:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Evaluations For Specified Project
      operationId: microsoftAzureGetevaluationsforproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvaluations'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all evaluations:
          $ref: ./examples/get_project_evaluations.json
      description: Needs a more full description created.
  /projects/{id}/datasets:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Datasets For Specified Project
      operationId: microsoftAzureGetdatasetsforproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatasets'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all datasets:
          $ref: ./examples/get_project_datasets.json
      description: Needs a more full description created.
  /projects/{id}/endpoints:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Endpoints For Specified Project
      operationId: microsoftAzureGetendpointsforproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEndpoints'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all endpoints:
          $ref: ./examples/get_project_endpoints.json
      description: Needs a more full description created.
  /projects/{id}/models:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Models For Specified Project
      operationId: microsoftAzureGetmodelsforproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedModels'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all models:
          $ref: ./examples/get_project_models.json
      description: Needs a more full description created.
  /projects/{id}/transcriptions:
    get:
      tags:
      - 'Custom Speech Projects:'
      summary: Microsoft Azure Gets The List Of Transcriptions For Specified Project
      operationId: microsoftAzureGettranscriptionsforproject
      parameters:
      - in: path
        name: id
        description: The identifier of the project.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal operation to complete.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTranscriptions'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
      x-ms-examples:
        Get all transcriptions:
          $ref: ./examples/get_project_transcriptions.json
      description: Needs a more full description created.
components:
  schemas:
    ModelProperties:
      title: ModelProperties
      type: object
      properties:
        deprecationDates:
          $ref: '#/components/schemas/ModelDeprecationDates'
        email:
          description: 'The email address to send email notifications to in case the operation completes.

            The value will be removed after successfully sending the email.'
          type: string
        error:
          $ref: '#/components/schemas/EntityError'
    DatasetProperties:
      title: DatasetProperties
      type: object
      properties:
        acceptedLineCount:
          format: int32
          description: The number of lines accepted for this data set.
          type: integer
          readOnly: true
        rejectedLineCount:
          format: int32
          description: The number of lines rejected for this data set.
          type: integer
          readOnly: true
        duration:
          description: 'The total duration of the datasets if it contains audio files. The duration is encoded as ISO 8601 duration

            ("PnYnMnDTnHnMnS", see https://en.wikipedia.org/wiki/ISO_8601#Durations).'
          type: string
          readOnly: true
        email:
          description: 'The email address to send email notifications to in case the operation completes.

            The value will be removed after successfully sending the email.'
          type: string
        error:
          $ref: '#/components/schemas/EntityError'
    ProfanityFilterMode:
      title: ProfanityFilterMode
      description: Mode of profanity filtering.
      enum:
      - None
      - Removed
      - Tags
      - Masked
      type: string
      x-ms-enum:
        name: ProfanityFilterMode
        modelAsString: false
        values:
        - value: None
          description: Disable profanity filtering.
        - value: Removed
          description: Remove profanity.
        - value: Tags
          description: Add "profanity" XML tags&lt;/Profanity&gt;
        - value: Masked
          description: Mask the profanity with * except of the first letter, e.g., f***
    PaginatedProjects:
      title: PaginatedProjects
      type: object
      properties:
        values:
          description: "A list of entities limited by either the passed query parameters 'skip' and 'top' or their default values.\n            \nWhen iterating through a list using pagination and deleting entities in parallel, some entities will be skipped in the results.\nIt's recommended to build a list on the client and delete after the fetching of the complete list."
          type: array
          items:
            $ref: '#/components/schemas/Project'
          readOnly: true
        '@nextLink':
          format: uri
          description: A link to the next set of paginated results if there are more entities available; otherwise null.
          type: string
          readOnly: true
