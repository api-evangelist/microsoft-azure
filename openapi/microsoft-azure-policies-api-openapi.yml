                $ref: '#/components/schemas/Policy'
        default:
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        Policies_Update:
          $ref: ./examples/Policies_Update.json
      summary: Microsoft Azure Patch Subscriptions Subscriptionid Resourcegroups…
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyFragment'
        description: A Policy.
        required: true
components:
  schemas:
    PolicyProperties:
      description: Properties of a Policy.
      type: object
      properties:
        description:
          description: The description of the policy.
          type: string
        status:
          description: The status of the policy.
          enum:
          - Enabled
          - Disabled
          type: string
          x-ms-enum:
            name: PolicyStatus
            modelAsString: true
        factName:
          description: The fact name of the policy (e.g. LabVmCount, LabVmSize, MaxVmsAllowedPerLab, etc.
          enum:
          - UserOwnedLabVmCount
          - UserOwnedLabPremiumVmCount
          - LabVmCount
          - LabPremiumVmCount
          - LabVmSize
          - GalleryImage
          - UserOwnedLabVmCountInSubnet
          - LabTargetCost
          - EnvironmentTemplate
          - ScheduleEditPermission
          type: string
          x-ms-enum:
            name: PolicyFactName
            modelAsString: true
        factData:
          description: The fact data of the policy.
          type: string
        threshold:
          description: The threshold of the policy (i.e. a number for MaxValuePolicy, and a JSON array of values for AllowedValuesPolicy).
          type: string
        evaluatorType:
          description: The evaluator type of the policy (i.e. AllowedValuesPolicy, MaxValuePolicy).
          enum:
          - AllowedValuesPolicy
          - MaxValuePolicy
          type: string
          x-ms-enum:
            name: PolicyEvaluatorType
            modelAsString: true
        createdDate:
          format: date-time
          description: The creation date of the policy.
          type: string
          readOnly: true
        provisioningState:
          description: The provisioning status of the resource.
          type: string
          readOnly: true
        uniqueIdentifier:
          description: The unique immutable identifier of a resource (Guid).
          type: string
          readOnly: true
    Policy:
      description: A Policy.
      required:
      - properties
      type: object
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        properties:
          $ref: '#/components/schemas/PolicyProperties'
          description: The properties of the resource.
          x-ms-client-flatten: true
    CloudError:
      description: Error from a REST request.
      type: object
      properties:
        error:
          $ref: '#/components/schemas/CloudErrorBody'
          description: The cloud error that occurred
      x-ms-external: true
    PolicyFragment:
      description: A Policy.
      type: object
      allOf:
      - $ref: '#/components/schemas/UpdateResource'
      properties: {}
    UpdateResource:
      description: Represents an update resource
      type: object
      properties:
        tags:
          description: The tags of the resource.
          type: object
          additionalProperties:
            type: string
    PolicyList:
      description: The response of a list operation.
      type: object
      properties:
        value:
          description: Results of the list operation.
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        nextLink:
          description: Link for next set of results.
          type: string
    CloudErrorBody:
      description: Body of an error from a REST request.
      type: object
      properties:
        code:
          description: The error code.
          type: string
        message:
          description: The error message.
          type: string
        target:
          description: The error target.
          type: string
        details:
          description: Inner errors.
          type: array
          items:
            $ref: '#/components/schemas/CloudErrorBody'
      x-ms-external: true
    Resource:
      description: An Azure resource.
      type: object
      properties:
        id:
          description: The identifier of the resource.
          type: string
          readOnly: true
        name:
          description: The name of the resource.
          type: string
          readOnly: true
        type:
          description: The type of the resource.
          type: string
          readOnly: true
        location:
          description: The location of the resource.
          type: string
        tags:
          description: The tags of the resource.
          type: object
          additionalProperties:
            type: string
      x-ms-azure-resource: true
  parameters:
    api-version:
      name: api-version
      in: query
      description: Client API version.
      required: true
      schema:
        type: string
        default: '2018-09-15'
    resourceGroupName:
      name: resourceGroupName
      in: path
      description: The name of the resource group.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    subscriptionId:
      name: subscriptionId
      in: path
      description: The subscription ID.
      required: true
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      flows:
        implicit:
          scopes:
            user_impersonation: Access Microsoft Azure
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
      description: OAuth2 Implicit Grant
