openapi: 3.2.0
info:
  title: Microsoft Azure Metrics Advisor Admin API
  description: Microsoft Azure Metrics Advisor REST API (OpenAPI v2)
  version: '1.0'
security:
- apim_key: []
  ma_api_key: []
tags:
- name: Admin
paths:
  /stats/latest:
    get:
      tags:
      - Admin
      summary: Microsoft Azure Get Latest Usage Stats
      operationId: microsoftAzureGetactiveseriescount
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStats'
        default:
          description: Client error or server error (4xx or 5xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
      x-ms-examples:
        Get latest usage stats:
          $ref: ./examples/getActiveSeriesCount.json
      description: Needs a more full description created.
components:
  schemas:
    ErrorCode:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
    UsageStats:
      type: object
      properties:
        timestamp:
          format: date-time
          description: The timestamp of the stats
          type: string
          readOnly: true
        activeSeriesCount:
          format: int32
          description: The active series count
          type: integer
          readOnly: true
        allSeriesCount:
          format: int32
          description: All series count under non deleted data feed
          type: integer
          readOnly: true
        metricsCount:
          format: int32
          description: The metrics count under non deleted data feed
          type: integer
          readOnly: true
        dataFeedCount:
          format: int32
          description: The count of non deleted data feed
          type: integer
          readOnly: true
  securitySchemes:
    ma_api_key:
      type: apiKey
      name: x-api-key
      in: header
    apim_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
x-ms-parameterized-host:
  hostTemplate: '{endpoint}/metricsadvisor/v1.0'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
