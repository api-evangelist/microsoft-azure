          readOnly: true
          type: array
        message:
          description: The error message.
          readOnly: true
          type: string
        target:
          description: The error target.
          readOnly: true
          type: string
    ResourceGuardProxyBaseResourceList:
      description: List of ResourceGuardProxyBase resources
