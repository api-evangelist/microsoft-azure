      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceGuardProxyBaseResource'
        description: Request body for operation
        required: true
    delete:
      tags:
      - DppResourceGuardProxies
      summary: Microsoft Azure Deletes The Resourceguardproxy
      operationId: microsoftAzureDppresourceguardproxyDelete
      parameters:
      - $ref: ../../../../../common-types/resource-management/v4/types.json#/parameters/SubscriptionIdParameter
