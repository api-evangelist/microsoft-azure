      - $ref: '#/components/parameters/VaultName'
      - name: resourceGuardProxyName
        description: name of the resource guard proxy
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9]*$
      - $ref: ../../../../../common-types/resource-management/v4/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceGuardProxyBaseResource'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
