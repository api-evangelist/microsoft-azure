openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Vault API
  description: Vault Controller.
tags:
- name: Vault
  description: Vault Controller.
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataReplication/replicationVaults/{vaultName}
  : get:
      tags:
      - Vault
      summary: Microsoft Azure Gets The Vault
      description: Gets the details of the vault.
      operationId: microsoftAzureVaultGet
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/VaultNameParameter'
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Returns Vault Model on success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultModel'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-examples:
        Vault_Get:
          $ref: ./examples/Vault_Get.json
    put:
      tags:
      - Vault
      summary: Microsoft Azure Puts The Vault
      description: Creates the vault.
      operationId: microsoftAzureVaultCreate
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/VaultNameParameter'
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultModel'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultModel'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      x-ms-examples:
        Vault_Create:
          $ref: ./examples/Vault_Create.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultModel'
        description: Vault properties.
    patch:
      tags:
      - Vault
      summary: Microsoft Azure Updates The Vault
      description: Performs update on the vault.
      operationId: microsoftAzureVaultUpdate
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/VaultNameParameter'
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultModel'
        '202':
          description: Returns success on update.
          headers:
            Azure-AsyncOperation:
              description: Tracking URL for long running operation.
              schema:
                type: string
            Location:
              schema:
                type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      x-ms-examples:
        Vault_Update:
          $ref: ./examples/Vault_Update.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultModelUpdate'
        description: Vault properties.
    delete:
      tags:
      - Vault
      summary: Microsoft Azure Deletes The Vault
      description: Removes the vault.
      operationId: microsoftAzureVaultDelete
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/VaultNameParameter'
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      responses:
        '202':
          description: Returns success on deletion.
          headers:
            Azure-AsyncOperation:
              description: Tracking URL for long running operation.
              schema:
                type: string
            Location:
              schema:
                type: string
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      x-ms-examples:
        Vault_Delete:
          $ref: ./examples/Vault_Delete.json
  /subscriptions/{subscriptionId}/providers/Microsoft.DataReplication/replicationVaults:
    get:
      tags:
      - Vault
      summary: Microsoft Azure Lists The Vaults
      description: Gets the list of vaults in the given subscription.
      operationId: microsoftAzureVaultListbysubscription
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - in: query
        name: continuationToken
        description: Continuation token from the previous call.
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Returns Vault Model Collection on success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultModelCollection'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        Vault_ListBySubscription:
          $ref: ./examples/Vault_ListBySubscription.json
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataReplication/replicationVaults:
    get:
      tags:
      - Vault
      summary: Microsoft Azure Lists The Vaults
      description: Gets the list of vaults in the given subscription and resource group.
      operationId: microsoftAzureVaultList
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - in: query
        name: continuationToken
        description: Continuation token from the previous call.
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Returns Vault Model Collection on success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultModelCollection'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        Vault_List:
          $ref: ./examples/Vault_List.json
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataReplication/replicationVaults/{vaultName}/operations/{operationId}
  : get:
      tags:
      - Vault
      summary: Microsoft Azure Gets The Vault Operation Status
      description: Tracks the results of an asynchronous operation on the vault.
      operationId: microsoftAzureVaultoperationstatusGet
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/VaultNameParameter'
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/OperationIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      x-ms-examples:
        VaultOperationStatus_Get:
          $ref: ./examples/VaultOperationStatus_Get.json
components:
  schemas:
    OperationStatus:
      description: Defines the operation status.
      type: object
      properties:
        id:
          description: Gets or sets the Id.
          type: string
        name:
          description: Gets or sets the operation name.
          type: string
        status:
          description: 'Gets or sets the status of the operation. ARM expects the terminal status to be one of

            Succeeded/ Failed/ Canceled. All other values imply that the operation is still running.'
          type: string
        startTime:
          description: Gets or sets the start time.
          type: string
        endTime:
          description: Gets or sets the end time.
          type: string
    VaultModelCollection:
      description: Vault model collection.
      type: object
      properties:
        value:
          description: Gets or sets the list of vaults.
          type: array
          items:
            $ref: '#/components/schemas/VaultModel'
          x-ms-identifiers: []
        nextLink:
          description: Gets or sets the value of next link.
          type: string
    VaultModel:
      description: Vault model.
      required:
      - location
      type: object
      properties:
        location:
          description: Gets or sets the location of the vault.
          minLength: 1
          type: string
          x-ms-mutability:
          - create
          - read
        tags:
          description: Gets or sets the resource tags.
          maxLength: 15
          type: object
          additionalProperties:
            type: string
        properties:
          $ref: '#/components/schemas/VaultModelProperties'
        id:
          description: Gets or sets the Id of the resource.
          type: string
          readOnly: true
        name:
          description: Gets or sets the name of the resource.
          type: string
          readOnly: true
        type:
          description: Gets or sets the type of the resource.
          type: string
          readOnly: true
        systemData:
          allOf:
          - $ref: '#/components/schemas/SystemDataModel'
          readOnly: true
      x-ms-azure-resource: true
    SystemDataModel:
      description: System data required to be defined for Azure resources.
      type: object
      properties:
        createdBy:
          description: Gets or sets identity that created the resource.
          type: string
        createdByType:
          description: 'Gets or sets the type of identity that created the resource: user, application,

            managedIdentity.'
          type: string
        createdAt:
          format: date-time
          description: Gets or sets the timestamp of resource creation (UTC).
          type: string
        lastModifiedBy:
          description: Gets or sets the identity that last modified the resource.
          type: string
        lastModifiedByType:
          description: 'Gets or sets the type of identity that last modified the resource: user, application,

            managedIdentity.'
          type: string
        lastModifiedAt:
          format: date-time
          description: Gets or sets the timestamp of resource last modification (UTC).
          type: string
    VaultModelProperties:
      description: Vault properties.
      type: object
      properties:
        provisioningState:
          description: Gets or sets the provisioning state of the vault.
          enum:
          - Canceled
          - Creating
          - Deleting
          - Deleted
          - Failed
          - Succeeded
          - Updating
          type: string
          readOnly: true
          x-ms-enum:
            name: ProvisioningState
            modelAsString: true
        serviceResourceId:
          description: Gets or sets the service resource Id.
          type: string
          readOnly: true
        vaultType:
          description: Gets or sets the type of vault.
          enum:
          - DisasterRecovery
          - Migrate
          type: string
          x-ms-enum:
            name: ReplicationVaultType
            modelAsString: true
    VaultModelUpdate:
      description: Vault model for update.
      type: object
      properties:
        tags:
          description: Gets or sets the resource tags.
          maxLength: 15
          type: object
          additionalProperties:
            type: string
        properties:
          $ref: '#/components/schemas/VaultModelProperties'
        id:
          description: Gets or sets the Id of the resource.
          type: string
          readOnly: true
        name:
          description: Gets or sets the name of the resource.
          type: string
          readOnly: true
        type:
          description: Gets or sets the type of the resource.
          type: string
          readOnly: true
        systemData:
          allOf:
          - $ref: '#/components/schemas/SystemDataModel'
          readOnly: true
      x-ms-azure-resource: true
  parameters:
    VaultNameParameter:
      in: path
      name: vaultName
      description: The vault name.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z0-9]*$
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
