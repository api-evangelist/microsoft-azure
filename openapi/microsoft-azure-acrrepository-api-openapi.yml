openapi: 3.2.0
info:
  title: Microsoft Azure Azure Container Registry Acr Repository API
  description: Metadata API definition for the Azure Container Registry runtime
  version: 2019-07-15-preview
security:
- registry_auth: []
  registry_oauth2: []
tags:
- name: AcrRepository
  description: ACR APIs related to repositories
paths:
  /acr/v1/_catalog:
    get:
      tags:
      - AcrRepository
      description: List repositories
      operationId: microsoftAzureGetacrrepositories
      x-ms-examples:
        Get repositories in a registry:
          $ref: ./examples/GetRepositories.json
      parameters:
      - $ref: '#/components/parameters/QueryLast'
      - $ref: '#/components/parameters/QueryNum'
      responses:
        '200':
          description: Returns a list of repositories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repositories'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get Acr Catalog
  /acr/v1/{name}:
    delete:
      tags:
      - AcrRepository
      description: Delete the repository identified by `name`
      operationId: microsoftAzureDeleteacrrepository
      x-ms-examples:
        Delete a repository:
          $ref: ./examples/DeleteAcrRepository.json
      parameters:
      - $ref: '#/components/parameters/ImageName'
      responses:
        '202':
          description: The repository is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedRepository'
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Delete Acr Name
components:
  schemas:
    AcrErrorInfo:
      description: Error information
      properties:
        code:
          description: Error code
          type: string
        message:
          type: string
          description: Error message
        detail:
          type: object
          description: Error details
    Repositories:
      description: List of repositories
      properties:
        repositories:
          type: array
          x-ms-client-name: Names
          description: Repository names
          items:
            type: string
      example:
        repositories:
        - production/alpine
        - testing/alpine
    DeletedRepository:
      description: Deleted repository
      properties:
        manifestsDeleted:
          type: array
          description: SHA of the deleted image
          items:
            type: string
        tagsDeleted:
          type: array
          description: Tag of the deleted image
          items:
            type: string
    AcrErrors:
      description: Acr error response describing why the operation failed
      properties:
        errors:
          type: array
          description: Array of detailed error
          items:
            $ref: '#/components/schemas/AcrErrorInfo'
  parameters:
    ImageName:
      name: name
      in: path
      description: Name of the image (including the namespace)
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    QueryNum:
      name: n
      in: query
      description: query parameter for max number of items
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
    QueryLast:
      name: last
      in: query
      description: Query parameter for the last item in previous query. Result set will include values lexically after last.
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
  securitySchemes:
    registry_auth:
      type: http
      scheme: basic
    registry_oauth2:
      type: apiKey
      in: header
      name: Authorization
x-ms-parameterized-host:
  hostTemplate: '{url}'
  useSchemePrefix: false
  positionInOperation: first
  parameters:
  - $ref: '#/components/parameters/Url'
