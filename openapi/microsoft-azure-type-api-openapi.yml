openapi: 3.2.0
info:
  title: Microsoft Azure Purview Data Map Service REST API Document…
  description: Purview Data Map Service is a fully managed cloud service whose users can discover the data sources they need and understand the data sources they find. At the same time, Data Map helps organizations get more value from their existing investments. This spec defines REST API of Purview Data Map Service.
  version: 2023-10-01-preview
servers:
- url: /datamap/api
security:
- azure_auth:
  - user_impersonation
tags:
- name: Type
paths:
  /atlas/v2/types/businessmetadatadef/guid/{guid}:
    get:
      tags:
      - Type
      description: Get the businessMetadata definition for the given guid
      operationId: microsoftAzureTypeGetbusinessmetadatadefbyguid
      x-ms-examples:
        Type_GetBusinessMetadataDefByGuid:
          $ref: ./examples/Type_GetBusinessMetadataDefByGuid.json
      parameters:
      - name: guid
        in: path
        description: businessMetadata guid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: On successful lookup of the the businessMetadata definition by it's guid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasBusinessMetadataDef'
                description: On successful lookup of the the businessMetadata definition by it's guid
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Get Atlas Types Businessmetadatadef Guid Guid
