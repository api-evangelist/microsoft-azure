components:
  schemas:
    NumberFormat:
      type: object
      title: NumberFormat
      properties:
        availableLocales:
          type: array
          description: The number format.
          items:
            type: string
        currency:
          type: string
          description: The currency.
        currencyInstance:
          $ref: '#/components/schemas/NumberFormat'
        groupingUsed:
          type: boolean
          description: Determines if grouping is used.
        instance:
          $ref: '#/components/schemas/NumberFormat'
        integerInstance:
          $ref: '#/components/schemas/NumberFormat'
        maximumFractionDigits:
          type: integer
          format: int32
          description: The maximum of fraction digits.
        maximumIntegerDigits:
          type: integer
          format: int32
          description: The maximum of integer digits.
        minimumFractionDigits:
          type: integer
          format: int32
          description: The minimum of fraction digits.
        minimumIntegerDigits:
          type: integer
          format: int32
          description: The minimum of integer digits.
        numberInstance:
          $ref: '#/components/schemas/NumberFormat'
        parseIntegerOnly:
          type: boolean
          description: Determines if only integer is parsed.
        percentInstance:
          $ref: '#/components/schemas/NumberFormat'
        roundingMode:
          $ref: '#/components/schemas/RoundingMode'
      description: The number format.
    TypeCategory:
      type: string
      title: TypeCategory
      description: The enum of type category.
      enum:
      - PRIMITIVE
      - OBJECT_ID_TYPE
      - ENUM
      - STRUCT
      - CLASSIFICATION
      - ENTITY
      - ARRAY
      - MAP
      - RELATIONSHIP
      - TERM_TEMPLATE
      x-ms-enum:
        name: TypeCategory
        modelAsString: true
    AtlasTypeDefHeader:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/TypeCategory'
        guid:
          type: string
          description: The GUID of the type definition.
        name:
          type: string
          description: The name of the type definition.
      title: AtlasTypeDefHeader
      description: The basic information of the type definition.
    LastModifiedTS:
      type: string
      title: lastModifiedTS
      description: ETag for concurrency control.
    Cardinality:
      type: string
      title: Cardinality
      description: single-valued attribute or multi-valued attribute.
      enum:
      - SINGLE
      - LIST
      - SET
      x-ms-enum:
        name: Cardinality
        modelAsString: true
    AtlasEnumElementDef:
      type: object
      properties:
        description:
          type: string
          description: The description of the enum element definition.
        ordinal:
          type: number
          description: The ordinal of the enum element definition.
        value:
          type: string
          description: The value of the enum element definition.
      title: AtlasEnumElementDef
      description: class that captures details of an enum-element.
    RoundingMode:
      type: string
      title: RoundingMode
      description: The enum of rounding mode.
      enum:
      - UP
      - DOWN
      - CEILING
      - FLOOR
      - HALF_UP
      - HALF_DOWN
      - HALF_EVEN
      - UNNECESSARY
      x-ms-enum:
        name: RoundingMode
        modelAsString: true
    AtlasRelationshipAttributeDef:
      type: object
      properties:
        isLegacyAttribute:
          type: boolean
          description: Determines if it is a legacy attribute.
        relationshipTypeName:
          type: string
          description: The name of the relationship type.
      allOf:
      - $ref: '#/components/schemas/AtlasAttributeDef'
      title: AtlasRelationshipEndDef
      description: 'The relationshipEndDef represents an end of the relationship. The end of the relationship is defined by a type, an

        attribute name, cardinality and whether it  is the container end of the relationship.'
    AtlasConstraintDef:
      type: object
      properties:
        params:
          type: object
          description: The parameters of the constraint definition.
          additionalProperties: {}
        type:
          type: string
          description: The type of the constraint.
      title: AtlasConstraintDef
      description: class that captures details of a constraint.
    AtlasEntityDef:
      type: object
      title: AtlasEntityDef
      properties:
        subTypes:
          type: array
          description: An array of sub types.
          items:
            type: string
        superTypes:
          type: array
          description: An array of super types.
          items:
            type: string
        relationshipAttributeDefs:
          type: array
          description: An array of relationship attributes.
          items:
            $ref: '#/components/schemas/AtlasRelationshipAttributeDef'
      allOf:
      - $ref: '#/components/schemas/AtlasStructDef'
      description: class that captures details of a entity-type.
    AtlasExtraTypeDef:
      type: object
      properties:
        entityTypes:
          type: array
          description: 'Specifying a list of entityType names in the classificationDef, ensures that classifications can

            only be applied to those entityTypes.

            <ul>

            <li>Any subtypes of the entity types inherit the restriction</li>

            <li>Any classificationDef subtypes inherit the parents entityTypes restrictions</li>

            <li>Any classificationDef subtypes can further restrict the parents entityTypes restrictions by specifying a subset of the entityTypes</li>

            <li>An empty entityTypes list when there are no parent restrictions means there are no restrictions</li>

            <li>An empty entityTypes list when there are parent restrictions means that the subtype picks up the parents restrictions</li>

            <li>If a list of entityTypes are supplied, where one inherits from another, this will be rejected. This should encourage cleaner classificationsDefs</li>

            </ul>'
          items:
            type: string
        subTypes:
          type: array
          description: An array of sub types.
          items:
            type: string
        superTypes:
          type: array
          description: An array of super types.
          items:
            type: string
        relationshipAttributeDefs:
          type: array
          description: An array of relationship attributes.
          items:
            $ref: '#/components/schemas/AtlasRelationshipAttributeDef'
        defaultValue:
          type: string
          description: The default value.
        elementDefs:
          type: array
          description: An array of enum element definitions.
          items:
            $ref: '#/components/schemas/AtlasEnumElementDef'
        endDef1:
          $ref: '#/components/schemas/AtlasRelationshipEndDef'
        endDef2:
          $ref: '#/components/schemas/AtlasRelationshipEndDef'
        relationshipCategory:
          $ref: '#/components/schemas/RelationshipCategory'
        relationshipLabel:
          type: string
          description: The label of the relationship.
        attributeDefs:
          type: array
          description: An array of attribute definitions.
          items:
            $ref: '#/components/schemas/AtlasAttributeDef'
      title: AtlasExtraTypeDef
      description: Extra properties for a type.
    ErrorResponse:
      description: An error response from the service
      type: object
      properties:
        requestId:
          type: string
          description: The request ID.
        errorCode:
          type: string
          description: The error code.
        errorMessage:
          type: string
          description: The error message.
    AtlasTypesDef:
      type: object
      properties:
        businessMetadataDefs:
          readOnly: false
          description: businessMetadataDefs
          type: array
          items:
