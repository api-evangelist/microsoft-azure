  /atlas/v2/types/typedefs:
    get:
      tags:
      - Type
      description: List all type definitions in bulk.
      operationId: microsoftAzureTypeList
      x-ms-examples:
        Type_List:
          $ref: ./examples/Type_List.json
        Type_ListEnumDefs:
          $ref: ./examples/Type_ListEnumDefs.json
        Type_ListTermTemplateDefs:
          $ref: ./examples/Type_ListTermTemplateDefs.json
      parameters:
      - $ref: '#/components/parameters/includeTermTemplate'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/purviewAPIVersion'
      responses:
        '200':
          description: OK. AtlasTypesDef with type definitions matching the search criteria or else returns empty list of type definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasTypesDef'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Get Atlas Types Typedefs
    post:
      tags:
      - Type
      description: 'Create all atlas type definitions in bulk, only new definitions will be created.

        Any changes to the existing definitions will be discarded.'
      operationId: microsoftAzureTypeBulkcreate
      x-ms-examples:
        Type_BulkCreate:
          $ref: ./examples/Type_BulkCreate.json
        Type_BulkCreateBusinessMetadataDefs:
          $ref: ./examples/Type_BulkCreateBusinessMetadataDefs.json
      responses:
        '200':
          description: OK. On successful update of requested type definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasTypesDef'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Post Atlas Types Typedefs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasTypesDef'
        description: A composite wrapper object with corresponding lists of the type definition.
        required: true
    put:
      tags:
      - Type
      description: Update all types in bulk, changes detected in the type definitions would be persisted.
      operationId: microsoftAzureTypeBulkupdate
      x-ms-examples:
        Type_BulkUpdate:
          $ref: ./examples/Type_BulkUpdate.json
      responses:
        '200':
          description: OK. On successful update of requested type definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasTypesDef'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Put Atlas Types Typedefs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasTypesDef'
        description: A composite object that captures all type definition changes.
        required: true
    delete:
      tags:
      - Type
      description: Delete API for all types in bulk.
      operationId: microsoftAzureTypeBulkdelete
      x-ms-examples:
        Type_BulkDelete:
          $ref: ./examples/Type_BulkDelete.json
      responses:
        '204':
          description: OK. On successful deletion of the requested type definitions.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Delete Atlas Types Typedefs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasTypesDef'
        description: A composite object that captures all types to be deleted
        required: true
  /atlas/v2/types/typedefs/headers:
