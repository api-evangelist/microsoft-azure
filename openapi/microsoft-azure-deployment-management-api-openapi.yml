openapi: 3.2.0
info:
  title: Microsoft Azure DeviceUpdateClient Deployment Management API
  description: Device Update for IoT Hub is an Azure service that enables customers to publish update for their IoT devices to the cloud, and then deploy that update to their devices (approve updates to groups of devices managed and provisioned in IoT Hub).
  version: 2022-07-01-preview
security:
- azure_auth:
  - https://api.adu.microsoft.com/.default
tags:
- name: Deployment Management
paths:
  /deviceUpdate/{instanceId}/management/groups/{groupId}/deployments/{deploymentId}:
    delete:
      tags:
      - Deployment Management
      description: Deletes a deployment.
      operationId: microsoftAzureDevicemanagementDeletedeployment
      x-ms-examples:
        DeviceManagement_DeleteDeployment:
          $ref: ./examples/DeviceManagement_DeleteDeployment.json
      parameters:
      - $ref: '#/components/parameters/InstanceIdParameter'
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/DeploymentIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '204':
          description: No content.
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Delete Deviceupdate Instanceid Management Groups Groupid…
  /deviceUpdate/{instanceId}/management/groups/{groupId}/deviceClassSubgroups/{deviceClassId}/deployments/{deploymentId}:
    delete:
      tags:
      - Deployment Management
      description: Deletes a device class subgroup deployment.
      operationId: microsoftAzureDevicemanagementDeletedeploymentfordeviceclasssubgroup
      x-ms-examples:
        DeviceManagement_DeleteDeploymentForDeviceClassSubgroup:
          $ref: ./examples/DeviceManagement_DeleteDeploymentForDeviceClassSubgroup.json
      parameters:
      - $ref: '#/components/parameters/InstanceIdParameter'
      - $ref: '#/components/parameters/GroupIdParameter'
      - $ref: '#/components/parameters/DeviceClassIdParameter'
      - $ref: '#/components/parameters/DeploymentIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '204':
          description: No content.
        default:
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Delete Deviceupdate Instanceid Management Groups Groupid…
components:
  parameters:
    InstanceIdParameter:
      name: instanceId
      in: path
      required: true
      x-ms-skip-url-encoding: true
      description: Account instance identifier.
      x-ms-parameter-location: client
      x-ms-parameter-grouping:
        name: account-options
      schema:
        type: string
    DeploymentIdParameter:
      name: deploymentId
      in: path
      description: Deployment identifier.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: Version of the API to be used with the client request.
      schema:
        type: string
    GroupIdParameter:
      name: groupId
      in: path
      description: Group identity.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    DeviceClassIdParameter:
      name: deviceClassId
      in: path
      description: Device class identifier.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: Server defined error code.
        message:
          type: string
          description: A human-readable representation of the error.
        target:
          type: string
          description: The target of the error.
        details:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: An array of errors that led to the reported error.
        innererror:
          $ref: '#/components/schemas/InnerError'
          description: An object containing more specific information than the current object about the error.
        occurredDateTime:
          type: string
          description: Date and time in UTC when the error occurred.
          format: date-time
      required:
      - code
      - message
      description: Error details.
    InnerError:
      type: object
      properties:
        code:
          type: string
          description: A more specific error code than what was provided by the containing error.
        message:
          type: string
          description: A human-readable representation of the error.
        errorDetail:
          type: string
          description: The internal error or exception message.
        innerError:
          $ref: '#/components/schemas/InnerError'
          description: An object containing more specific information than the current object about the error.
      required:
      - code
      description: An object containing more specific information than the current object about the error.
    ErrorResponse:
      description: Common error response.
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
          description: The error details.
      required:
      - error
  securitySchemes:
    azure_auth:
      type: oauth2
      flows:
        implicit:
          scopes:
            https://api.adu.microsoft.com/.default: Default authorization scope.
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
      description: Azure Active Directory OAuth2 Flow
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: true
  parameters:
  - $ref: '#/components/parameters/EndpointParameter'
