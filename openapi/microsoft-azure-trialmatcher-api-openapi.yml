components:
  schemas:
    Fhir.R4.DomainResource:
      type: object
      description: 'A resource with narrative, extensions, and contained resources

        Based on [FHIR DomainResource](https://www.hl7.org/fhir/domainresource.html)'
      properties:
        resourceType:
          type: string
          description: Discriminator property for DomainResource.
        text:
          $ref: '#/components/schemas/Fhir.R4.Narrative'
          description: Text summary of the resource, for human interpretation
        contained:
          type: array
          description: Contained, inline Resources
          items:
            $ref: '#/components/schemas/Fhir.R4.Resource'
        extension:
          type: array
          description: Additional Content defined by implementations
          items:
            $ref: '#/components/schemas/Fhir.R4.Extension'
        modifierExtension:
          type: array
          description: Extensions that cannot be ignored
          items:
            $ref: '#/components/schemas/Fhir.R4.Extension'
      discriminator:
        propertyName: resourceType
      required:
      - resourceType
      allOf:
      - $ref: '#/components/schemas/Fhir.R4.Resource'
    Fhir.R4.Quantity:
      type: object
      description: 'A measured or measurable amount

        Based on [FHIR Quantity](https://www.hl7.org/fhir/R4/datatypes.html#Quantity)'
      properties:
        value:
          type: number
          format: double
          description: Numerical value (with implicit precision)
        comparator:
          type: string
          description: < | <= | >= | > - how to understand the value
        unit:
          type: string
          description: Unit representation
        system:
          $ref: '#/components/schemas/Fhir.R4.fhirUri'
          description: System that defines coded unit form
        code:
          type: string
          description: Coded form of the unit
      allOf:
      - $ref: '#/components/schemas/Fhir.R4.Element'
    GeoJsonGeometryType:
      type: string
      description: '`GeoJSON` geometry type.'
      enum:
      - Point
      x-ms-enum:
        name: GeoJsonGeometryType
        modelAsString: true
        values:
        - name: Point
          value: Point
    OrderedProcedure:
      type: object
      description: Procedure information
      properties:
        extension:
          type: array
          description: Additional Content defined by implementations
          items:
            $ref: '#/components/schemas/Fhir.R4.Extension'
        code:
          $ref: '#/components/schemas/Fhir.R4.CodeableConcept'
          description: Procedure code
        description:
          type: string
          description: Procedure description
    PatientRecord:
      type: object
      description: A patient record, including their clinical information and data.
      properties:
        id:
          type: string
          description: A given identifier for the patient. Has to be unique across all patients in a single request.
          minLength: 1
        info:
          $ref: '#/components/schemas/PatientInfo'
          description: Patient structured information, including demographics and known structured clinical information.
        encounters:
          type: array
          description: Patient encounters/visits.
          items:
            $ref: '#/components/schemas/Encounter'
        patientDocuments:
          type: array
          description: Patient unstructured clinical data, given as documents.
          items:
            $ref: '#/components/schemas/PatientDocument'
      required:
      - id
    Fhir.R4.Meta:
      type: object
      description: 'Metadata about a resource

        Based on [FHIR Meta](https://www.hl7.org/fhir/R4/resource.html#Meta)'
      properties:
        versionId:
          type: string
          description: The version specific identifier, as it appears in the version portion of the URL. This value changes when the resource is created, updated, or deleted.
        lastUpdated:
          $ref: '#/components/schemas/Fhir.R4.fhirInstant'
          description: When the resource last changed - e.g. when the version changed.
        source:
          $ref: '#/components/schemas/Fhir.R4.fhirUri'
          description: A uri that identifies the source system of the resource. This provides a minimal amount of Provenance information that can be used to track or differentiate the source of information in the resource. The source may identify another FHIR server, document, message, database, etc.
        profile:
          type: array
          description: A list of profiles (references to [StructureDefinition](https://www.hl7.org/fhir/structuredefinition.html) resources) that this resource claims to conform to. The URL is a reference to [StructureDefinition.url](https://www.hl7.org/fhir/structuredefinition-definitions.html#StructureDefinition.url).
          items:
            $ref: '#/components/schemas/Fhir.R4.fhirUri'
        security:
          type: array
          description: Security labels applied to this resource. These tags connect specific resources to the overall security policy and infrastructure.
          items:
            $ref: '#/components/schemas/Fhir.R4.Coding'
        tag:
          type: array
          description: Tags applied to this resource. Tags are intended to be used to identify and relate resources to process and workflow, and applications are not required to consider the tags when interpreting the meaning of a resource.
          items:
            $ref: '#/components/schemas/Fhir.R4.Coding'
    ClinicalTrialPhase:
      type: string
      description: Possible phases of a clinical trial.
      enum:
      - notApplicable
      - earlyPhase1
      - phase1
      - phase2
      - phase3
      - phase4
      x-ms-enum:
        name: ClinicalTrialPhase
        modelAsString: true
        values:
        - name: NotApplicable
          value: notApplicable
        - name: EarlyPhase1
          value: earlyPhase1
        - name: Phase1
          value: phase1
        - name: Phase2
          value: phase2
        - name: Phase3
          value: phase3
        - name: Phase4
          value: phase4
    Fhir.R4.Resource:
      type: object
      description: 'Resource is the ancestor of DomainResource from which most resources are derived. Bundle, Parameters, and Binary extend Resource directly.

        Based on [FHIR Resource](https://www.hl7.org/fhir/r4/resource.html'
      properties:
        resourceType:
          type: string
          description: The type of resource
        id:
          type: string
          description: Resource Id
        meta:
          $ref: '#/components/schemas/Fhir.R4.Meta'
          description: Metadata about the resource
        implicitRules:
          $ref: '#/components/schemas/Fhir.R4.fhirUri'
          description: A set of rules under which this content was created
        language:
          type: string
          description: Language of the resource content
      required:
      - resourceType
      additionalProperties: {}
    DocumentAuthor:
      type: object
      description: Document author
      properties:
        id:
          type: string
          description: author id
        fullName:
          type: string
          description: Text representation of the full name
    Fhir.R4.ContactDetail:
      type: object
      description: 'Contact details (See: https://www.hl7.org/fhir/R4/metadatatypes.html#ContactDetail)'
      properties:
        name:
          type: string
          description: Name of an individual to contact
        telecom:
          type: array
          description: Contact details for individual or organization
          items:
            $ref: '#/components/schemas/Fhir.R4.ContactPoint'
          x-ms-identifiers: []
      allOf:
      - $ref: '#/components/schemas/Fhir.R4.Element'
    Azure.Core.Foundations.InnerError:
      type: object
      description: An object containing more specific information about the error. As per Microsoft One API guidelines - https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        innererror:
          $ref: '#/components/schemas/Azure.Core.Foundations.InnerError'
          description: Inner error.
    TrialMatcherModelConfiguration:
      type: object
      description: Configuration affecting the Trial Matcher model's inference.
      properties:
        verbose:
          type: boolean
          description: An indication whether the model should produce verbose output.
          default: false
        includeEvidence:
          type: boolean
          description: An indication whether the model's output should include evidence for the inferences.
          default: true
        clinicalTrials:
          $ref: '#/components/schemas/ClinicalTrials'
          description: 'The clinical trials that the patient(s) should be matched to. <br />The trial

            selection can be given as a list of custom clinical trials and/or a list of

            filters to known clinical trial registries. In case both are given, the

            resulting trial set is a union of the two sets.'
      required:
      - clinicalTrials
    ClinicalTrialRegistryFilter:
      type: object
      description: A filter defining a subset of clinical trials from a given clinical trial registry (e.g. clinicaltrials.gov).
      properties:
        conditions:
          type: array
          description: 'Trials with any of the given medical conditions will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the medical conditions.'
          items:
            type: string
        studyTypes:
          type: array
          description: 'Trials with any of the given study types will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the study types.'
          items:
            $ref: '#/components/schemas/ClinicalTrialStudyType'
        recruitmentStatuses:
          type: array
          description: 'Trials with any of the given recruitment statuses will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the recruitment statuses.'
          items:
            $ref: '#/components/schemas/ClinicalTrialRecruitmentStatus'
        sponsors:
          type: array
          description: 'Trials with any of the given sponsors will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the sponsors.'
          items:
            type: string
        phases:
          type: array
          description: 'Trials with any of the given phases will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the phases.'
          items:
            $ref: '#/components/schemas/ClinicalTrialPhase'
        purposes:
          type: array
          description: 'Trials with any of the given purposes will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the purposes.'
          items:
            $ref: '#/components/schemas/ClinicalTrialPurpose'
        ids:
          type: array
          description: 'Trials with any of the given identifiers will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the trial identifiers.'
          items:
            type: string
        sources:
          type: array
          description: 'Trials with any of the given sources will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the sources.'
          items:
            $ref: '#/components/schemas/ClinicalTrialSource'
        facilityNames:
          type: array
          description: 'Trials with any of the given facility names will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the trial facility names.'
          items:
            type: string
        facilityLocations:
          type: array
          description: 'Trials with any of the given facility locations will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the trial facility locations.'
          items:
            $ref: '#/components/schemas/GeographicLocation'
          x-ms-identifiers: []
        facilityAreas:
          type: array
          description: 'Trials with any of the given facility area boundaries will be included in the selection (provided that other limitations are satisfied).

            Leaving this list empty will not limit the trial facility area boundaries.'
          items:
            $ref: '#/components/schemas/GeographicArea'
          x-ms-identifiers: []
    GeoJsonType:
      type: string
      description: '`GeoJSON` type.'
      enum:
      - Feature
      x-ms-enum:
        name: GeoJsonType
        modelAsString: true
        values:
        - name: Feature
          value: Feature
    Fhir.R4.Identifier:
      type: object
      description: 'An identifier intended for computation

        Based on [FHIR Identifier](https://www.hl7.org/fhir/R4/identifier.html)'
      properties:
        use:
          type: string
          description: usual | official | temp | secondary | old (If known)
        type:
          $ref: '#/components/schemas/Fhir.R4.CodeableConcept'
          description: Description of identifier
        system:
          $ref: '#/components/schemas/Fhir.R4.fhirUri'
          description: The namespace for the identifier value
        value:
          type: string
          description: The value that is unique
        period:
          $ref: '#/components/schemas/Fhir.R4.Period'
          description: Time period when id is/was valid for use
        assigner:
          $ref: '#/components/schemas/Fhir.R4.Reference'
          description: Organization that issued id (may be just text)
      allOf:
      - $ref: '#/components/schemas/Fhir.R4.Element'
    Fhir.R4.fhirInstant:
      type: string
      pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]{1,9})?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))
    PatientDocument:
      type: object
      description: A clinical document related to a patient. Document here is in the wide sense - not just a text document (note).
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
          description: The type of the patient document, such as 'note' (text document) or 'fhirBundle' (FHIR JSON document).
        clinicalType:
          $ref: '#/components/schemas/ClinicalDocumentType'
          description: The type of the clinical document.
        id:
          type: string
          description: A given identifier for the document. Has to be unique across all documents for a single patient.
          minLength: 1
        language:
          type: string
          description: A 2 letter ISO 639-1 representation of the language of the document.
        createdDateTime:
          type: string
          format: date-time
          description: The date and time when the document was created.
        authors:
          type: array
          description: Document author(s)
          items:
            $ref: '#/components/schemas/DocumentAuthor'
        specialtyType:
          $ref: '#/components/schemas/SpecialtyType'
          description: specialty type the document
        administrativeMetadata:
          $ref: '#/components/schemas/DocumentAdministrativeMetadata'
          description: Administrative metadata for the document.
        content:
          $ref: '#/components/schemas/DocumentContent'
          description: The content of the patient document.
      required:
      - type
      - id
      - content
    TrialMatcherInferenceType:
      type: string
      description: The type of the Trial Matcher inference.
      enum:
      - trialEligibility
      x-ms-enum:
        name: TrialMatcherInferenceType
        modelAsString: true
        values:
        - name: TrialEligibility
          value: trialEligibility
    ClinicalTrialResearchFacility:
      type: object
      description: Details of a research facility where a clinical trial is conducted.
      properties:
        name:
          type: string
          description: The facility's name.
        city:
          type: string
          description: City name.
        state:
          type: string
          description: State name.
        countryOrRegion:
          type: string
          description: Country/region name.
      required:
      - name
      - countryOrRegion
    ClinicalTrials:
      type: object
      description: 'The clinical trials that the patient(s) should be matched to.

        The trial selection can be given as a list of custom clinical trials and/or a list of filters to known clinical trial registries.

        In case both are given, the resulting trial set is a union of the two sets.'
      properties:
        customTrials:
          type: array
          description: A list of clinical trials.
          minItems: 1
          items:
            $ref: '#/components/schemas/Fhir.R4.ResearchStudy'
        registryFilters:
          type: array
          description: 'A list of filters, each one creating a selection of trials from a given

            clinical trial registry.'
          minItems: 1
          items:
            $ref: '#/components/schemas/ClinicalTrialRegistryFilter'
          x-ms-identifiers: []
    ClinicalTrialStudyType:
      type: string
      description: Possible study types of a clinical trial.
      enum:
      - interventional
      - observational
      - expandedAccess
      - patientRegistries
      x-ms-enum:
        name: ClinicalTrialStudyType
        modelAsString: true
        values:
        - name: Interventional
          value: interventional
        - name: Observational
          value: observational
        - name: ExpandedAccess
          value: expandedAccess
        - name: PatientRegistries
          value: patientRegistries
    ModelVersion:
      type: string
      description: The version of the model used for inference, expressed as the model date.
    ExtendedClinicalCodedElement:
      type: object
      description: A piece of clinical information, expressed as a code in a clinical coding system, extended by semantic information.
      properties:
        system:
          type: string
          description: The clinical coding system, e.g. ICD-10, SNOMED-CT, UMLS.
        code:
          type: string
          description: The code within the given clinical coding system.
        name:
          type: string
          description: The name of this coded concept in the coding system.
        value:
          type: string
          description: A value associated with the code within the given clinical coding system.
        semanticType:
          type: string
          description: The [UMLS semantic type](https://www.nlm.nih.gov/research/umls/META3_current_semantic_types.html) associated with the coded concept.
        category:
          type: string
          description: The bio-medical category related to the coded concept, e.g. Diagnosis, Symptom, Medication, Examination.
      required:
      - system
      - code
    ClinicalTrialMetadata:
      type: object
      description: Trial data which is of interest to the potential participant.
      properties:
        phases:
          type: array
          description: 'Phases which are relevant for the clinical trial.

            Each clinical trial can be in a certain phase or in multiple phases.'
          items:
            $ref: '#/components/schemas/ClinicalTrialPhase'
        studyType:
          $ref: '#/components/schemas/ClinicalTrialStudyType'
          description: Possible study types of a clinical trial.
        recruitmentStatus:
          $ref: '#/components/schemas/ClinicalTrialRecruitmentStatus'
          description: Possible recruitment status of a clinical trial.
        conditions:
          type: array
          description: Medical conditions and their synonyms which are relevant for the clinical trial, given as strings.
          minItems: 1
          items:
            type: string
        sponsors:
          type: array
          description: Sponsors/collaborators involved with the trial.
          items:
            type: string
