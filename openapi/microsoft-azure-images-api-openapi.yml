openapi: 3.2.0
info:
  title: Microsoft Azure Images API
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  - x-ms-code-generation-settings differs across the merged source definitions and was not carried
  - x-typespec-generated differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Images across 5 of this provider''s published API definitions: azure-communication-chat-service-openapi-original.yml, azure-openai-api-version-2023-10-01-preview-openapi-original.yml, azure-openai-service-openapi.yml, azuresphereproviderclient-openapi-original.yml, customerinsightsmanagementclient-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{endpoint}/openai
  description: Azure OpenAI Service endpoint
  variables:
    endpoint:
      default: your-resource-name.openai.azure.com
      description: 'The Azure OpenAI resource endpoint. Format: https://{resource-name}.openai.azure.com'
- url: https://management.azure.com
tags:
- name: Images
paths:
  /chat/threads/{chatThreadId}/images:
    post:
      tags:
      - Images
      summary: Microsoft Azure Upload An Image In A Thread, On Behalf Of A User
      operationId: microsoftAzureChatthreadUploadchatimage
      parameters:
      - in: header
        name: image-filename
        description: The file name of the image.
        required: false
        schema:
          type: string
      - in: path
        name: chatThreadId
        description: Thread id where the uploaded image belongs to. (Teams meeting only)
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '201':
          description: Uploaded successfully, the `Location` header contains the URL for the newly uploaded image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadChatImageResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Upload Image:
          $ref: ./examples/Images_UploadChatImage.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/ChatImageFile'
        description: 'Image binary data, allowed image formats: jpeg, png, gif, heic, webp'
        required: true
      security:
      - Authorization: []
  /chat/threads/{chatThreadId}/images/{imageId}/view/{imageViewType}:
    get:
      tags:
      - Images
      summary: Microsoft Azure Get An Image By View Type
      operationId: microsoftAzureChatthreadGetchatimage
      parameters:
      - in: path
        name: chatThreadId
        description: The thread id to which the message was sent.
        required: true
        schema:
          type: string
      - in: path
        name: imageId
        description: The image id.
        required: true
        schema:
          type: string
      - in: path
        name: imageViewType
        description: The view type of image.
        required: true
        x-ms-enum:
          name: ImageViewType
          modelAsString: true
        schema:
          type: string
          enum:
          - original
          - small
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Image binary data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatImageFile'
            image/gif:
              schema:
                $ref: '#/components/schemas/ChatImageFile'
            image/jpeg:
              schema:
                $ref: '#/components/schemas/ChatImageFile'
            image/png:
              schema:
                $ref: '#/components/schemas/ChatImageFile'
            image/bmp:
              schema:
                $ref: '#/components/schemas/ChatImageFile'
            image/tiff:
              schema:
                $ref: '#/components/schemas/ChatImageFile'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            image/gif:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            image/jpeg:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            image/png:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            image/bmp:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            image/tiff:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Delete message:
          $ref: ./examples/Images_GetChatImage.json
      description: Needs a more full description created.
      security:
      - Authorization: []
  /chat/threads/{chatThreadId}/images/{imageId}:
