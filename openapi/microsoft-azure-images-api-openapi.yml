components:
  schemas:
    ErrorResponse:
      type: object
      description: Wrapper for error response to follow ARM guidelines.
      properties:
        error:
          description: The error response.
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      description: Error response information.
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Error message.
        details:
          type: array
          description: An array of error detail objects.
          items:
            $ref: '#/components/schemas/ErrorDetail'
          x-ms-identifiers:
          - code
      required:
      - code
      - message
    UploadChatImageResult:
      description: Result payload for uploading an image.
      required:
      - id
      type: object
      properties:
        id:
          description: A server-generated image id.
          type: string
          example: 0-eus-d2-fb42e272282ebb6ef76a3aedd1974433
        attachmentType:
          $ref: '#/components/schemas/ChatAttachmentType'
        name:
          description: The name including file extension type of the attachment.
          type: string
          example: SomeImage.png
    ChatImageFile:
      description: The image binary data.
      type: string
      format: binary
      x-ms-media-kind: image
    ChatAttachmentType:
      description: The type of attachment.
      enum:
      - image
      - file
      type: string
      x-ms-enum:
        name: ChatAttachmentType
        modelAsString: true
    ErrorDetail:
      type: object
      description: Error detail information.
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Error message.
      required:
      - code
      - message
    ImageResult:
      title: ImageResult
      type: object
      description: The image url if successful, and an error otherwise.
      properties:
        url:
          type: string
          format: url
          description: The URL that provides temporary access to download the generated image.
        error:
          $ref: '#/components/schemas/Error_2'
    OperationResponse:
      title: OperationResponse
      description: The operation response containing the id and the status of the operation. If successful, it contains data with the generated images and an error otherwise.
      type: object
      properties:
        id:
          format: uuid
          description: The ID of the operation.
          type: string
        created:
          format: unixtime
          description: A timestamp when this job or item was created (in unix epochs).
          type: integer
        expires:
          format: unixtime
          description: A timestamp when this operation and its associated images expire and will be deleted (in unix epochs).
          type: integer
        result:
          type: object
          description: The result of the operation if the operation succeeded.
          properties:
            created:
              format: unixtime
              description: A timestamp when this job or item was created (in unix epochs).
              type: integer
            data:
              $ref: '#/components/schemas/ImageResults'
          required:
          - created
          - data
        status:
          $ref: '#/components/schemas/OperationState'
        error:
          $ref: '#/components/schemas/Error_2'
      required:
      - id
      - status
      - created
    ErrorCode:
      title: ErrorCode
      description: 'Error codes as defined in the Microsoft REST guidelines

        (https://github.com/microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses).'
      enum:
      - conflict
      - invalidPayload
      - forbidden
      - notFound
      - unexpectedEntityState
      - itemDoesAlreadyExist
      - serviceUnavailable
      - internalFailure
      - quotaExceeded
      - jsonlValidationFailed
      - fileImportFailed
      - tooManyRequests
      - unauthorized
      - contentFilter
      type: string
      x-ms-enum:
        name: ErrorCode
        modelAsString: true
