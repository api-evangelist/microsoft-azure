components:
  schemas:
    LabelPatchResource:
      type: object
      description: Label patch properties
      allOf:
      - $ref: '#/components/schemas/LabelResource'
    Label:
      type: object
      properties:
        name:
          type: string
          readOnly: true
          description: The name of the label.
    LabelListResult:
      description: The result of a list request.
      type: object
      properties:
        items:
          description: The collection value.
          type: array
          items:
            $ref: '#/components/schemas/Label'
        '@nextLink':
          description: The URI that can be used to request the next set of paged results.
          type: string
    LabelResource:
      type: object
      description: Label details
      properties:
        properties:
          description: Label properties
          $ref: '#/components/schemas/LabelResourceProperties'
          x-ms-client-flatten: true
      allOf:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ProxyResource
      x-ms-azure-resource: true
    Error:
      description: Azure App Configuration error object.
      type: object
      properties:
        type:
          description: The type of the error.
          type: string
        title:
          description: A brief summary of the error.
          type: string
        name:
          description: The name of the parameter that resulted in the error.
          type: string
        detail:
          description: A detailed description of the error.
          type: string
        status:
          description: The HTTP status code that the error maps to.
          type: integer
      readOnly: true
    LabelResourceProperties:
      description: Label properties.
      type: object
      properties:
        displayName:
          description: Label display name.
          type: string
        color:
          description: Label color.
          type: string
      allOf:
      - $ref: '#/components/schemas/ResourceBaseProperties'
    ResourceBaseProperties:
      description: Resource base properties.
      type: object
      properties:
        provisioningState:
          description: Resource provisioning state.
          $ref: '#/components/schemas/ResourceState'
          readOnly: true
    LabelResourceList:
      type: object
      description: The list of labels.
      properties:
        value:
          type: array
          description: The list of labels.
          items:
            $ref: '#/components/schemas/LabelResource'
        nextLink:
          type: string
          description: The link used to get the next page of Label list.
    ResourceState:
      description: Resources provisioning states.
      enum:
      - NotSpecified
      - Accepted
      - Creating
      - Succeeded
      - Failed
      - Canceled
      - ProvisioningResources
      - InstallingApplication
      - ConfiguringApplication
      - MigratingApplicationData
      - RunningValidations
      - CreatingArtifacts
      - DeletingArtifacts
      type: string
      x-ms-enum:
        name: ResourceState
        modelAsString: true
  parameters:
    WorkspaceNameParameter:
      name: workspaceName
      in: path
      required: true
      description: The name of the Workspace.
      x-ms-parameter-location: method
      schema:
        type: string
    LabelNameParameter:
      name: labelName
      in: path
      required: true
      description: The name of the Label.
      x-ms-parameter-location: method
      schema:
        type: string
    ApiVersion:
      name: api-version
      in: query
      description: The API version to be used with the HTTP request.
      required: true
      schema:
        type: string
    SyncTokens:
      name: Sync-Token
      in: header
      description: Used to guarantee real-time consistency between requests.
      schema:
        type: string
    LabelFields:
      name: $Select
      in: query
      description: Used to select what fields are present in the returned resource(s).
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - name
          x-ms-enum:
            name: LabelFields
            modelAsString: true
