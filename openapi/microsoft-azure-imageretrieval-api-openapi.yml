openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Image Retrieval API
tags:
- name: ImageRetrieval
paths:
  /retrieval:vectorizeText:
    post:
      tags:
      - ImageRetrieval
      summary: Microsoft Azure Return Vector From A Text
      operationId: microsoftAzureImageretrievalVectorizetext
      parameters:
      - in: query
        name: model-version
        description: Model version.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleVectorResultApiModel'
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        ImageRetrieval_VectorizeText:
          $ref: ./examples/ImageRetrieval_VectorizeText.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorizeTextRequestApiModel'
        description: Request of VectorizeText.
  /retrieval:vectorizeImage:
    post:
      tags:
      - ImageRetrieval
      summary: Microsoft Azure Return Vector From An Image
      operationId: microsoftAzureImageretrievalVectorizeimage
      parameters:
      - in: query
        name: model-version
        description: Model version.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleVectorResultApiModel'
        default:
          description: Error
          headers:
            x-ms-error-code:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        ImageRetrieval_VectorizeImage:
          $ref: ./examples/ImageRetrieval_VectorizeImage.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUrl'
        description: A JSON document with a URL pointing to the image that is to be analyzed.
        required: true
components:
  schemas:
    ErrorResponse:
      description: Response returned when an error occurs.
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponseDetails'
    ImageUrl:
      description: A JSON document with a URL pointing to the image that is to be analyzed.
      required:
      - url
      type: object
      properties:
        url:
          description: Publicly reachable URL of an image.
          type: string
    SingleVectorResultApiModel:
      description: Results of image vectorization.
      type: object
      properties:
        vector:
          description: Vector of the image.
          type: array
          items:
            format: float
            type: number
        modelVersion:
          description: Model version.
          type: string
    ErrorResponseDetails:
      description: Error info.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Error code.
          type: string
        message:
          description: Error message.
          type: string
        target:
          description: Target of the error.
          type: string
        details:
          description: List of detailed errors.
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetails'
        innererror:
          $ref: '#/components/schemas/ErrorResponseInnerError'
    ErrorResponseInnerError:
      description: Detailed error.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Error code.
          type: string
        message:
          description: Error message.
          type: string
        innererror:
          $ref: '#/components/schemas/ErrorResponseInnerError'
    VectorizeTextRequestApiModel:
      description: Model for VectorizeText request.
      required:
      - text
      type: object
      properties:
        text:
          description: Text for vectorization.
          minLength: 1
          type: string
  parameters:
    ApiVersion:
      in: query
      name: api-version
      description: Requested API version.
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
