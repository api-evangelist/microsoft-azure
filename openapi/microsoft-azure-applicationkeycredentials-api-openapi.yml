openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Application Key Credentials API
tags:
- name: ApplicationKeyCredentials
paths:
  /{tenantID}/applications/{applicationObjectId}/keyCredentials:
    get:
      tags:
      - ApplicationKeyCredentials
      operationId: microsoftAzureApplicationsListkeycredentials
      description: Get the keyCredentials associated with an application.
      parameters:
      - name: applicationObjectId
        in: path
        required: true
        description: Application object ID.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/tenantIDInPath'
      responses:
        '200':
          description: OK. The operation was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyCredentialListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphError'
      x-ms-pageable:
        nextLinkName: null
      summary: Microsoft Azure Get Tenantid Applications Applicationobjectid Keycredentials
    patch:
      tags:
      - ApplicationKeyCredentials
      operationId: microsoftAzureApplicationsUpdatekeycredentials
      description: Update the keyCredentials associated with an application.
      parameters:
      - name: applicationObjectId
        in: path
        required: true
        description: Application object ID.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/tenantIDInPath'
      responses:
        '204':
          description: No Content
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphError'
      summary: Microsoft Azure Patch Tenantid Applications Applicationobjectid Keycredentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCredentialsUpdateParameters'
        description: Parameters to update the keyCredentials of an existing application.
        required: true
components:
  schemas:
    OdataError:
      type: object
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: object
          x-ms-client-flatten: true
          $ref: '#/components/schemas/ErrorMessage'
          description: Error Message.
      description: Active Directory OData error information.
    ErrorMessage:
      type: object
      properties:
        value:
          type: string
          x-ms-client-name: message
          description: Error message value.
      description: Active Directory error message.
    KeyCredentialListResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/KeyCredential'
          description: A collection of KeyCredentials.
      description: KeyCredential list operation result.
    KeyCredential:
      type: object
      properties:
        startDate:
          type: string
          format: date-time
          description: Start date.
        endDate:
          type: string
          format: date-time
          description: End date.
        value:
          type: string
          description: Key value.
        keyId:
          type: string
          description: Key ID.
        usage:
          type: string
          description: Usage. Acceptable values are 'Verify' and 'Sign'.
        type:
          type: string
          description: Type. Acceptable values are 'AsymmetricX509Cert' and 'Symmetric'.
        customKeyIdentifier:
          type: string
          description: Custom Key Identifier
      additionalProperties:
        type: object
      description: Active Directory Key Credential information.
    KeyCredentialsUpdateParameters:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/KeyCredential'
          description: A collection of KeyCredentials.
      required:
      - value
      description: Request parameters for a KeyCredentials update operation
    GraphError:
      type: object
      properties:
        odata.error:
          type: object
          x-ms-client-flatten: true
          $ref: '#/components/schemas/OdataError'
          description: A Graph API error.
      description: Active Directory error information.
  parameters:
    tenantIDInPath:
      name: tenantID
      in: path
      required: true
      description: The tenant ID.
      x-ms-parameter-location: client
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: Client API version.
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
