  /search/polygon/{format}:
    get:
      x-publish: true
      description: '**Get Polygon**


        **Applies to**: S1 pricing tier.


        The Get Polygon service allows you to request the geometry data such as a city or country outline for a set of entities, previously retrieved from an Online Search request in GeoJSON format. The geometry ID is returned in the dataSources object under "geometry" and "id" in either a Search Address or Search Fuzzy call.


        Please note that any geometry ID retrieved from an Online Search endpoint has a limited lifetime. The client should not store geometry IDs in persistent storage for later referral, as the stability of these identifiers is not guaranteed for a long period of time. It is expected that a request to the Polygon method is made within a few minutes of the request to the Online Search method that provided the ID. The service allows for batch requests up to 20 identifiers.'
      operationId: microsoftAzureSearchGetsearchpolygon
      x-ms-examples:
        Get the Geometry using the geometry id returned by the previous Search:
          $ref: ./examples/GetSearchPolygon.json
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SubscriptionKey'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/JsonFormat'
      - name: geometries
        in: query
        description: Comma separated list of geometry UUIDs, previously retrieved from an Online Search request.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPolygonResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: Microsoft Azure Get Search Polygon Format
      tags:
      - Search
      security:
      - AADToken:
        - https://atlas.microsoft.com/.default
      - SharedKey: []
      - SasToken: []
    servers:
    - url: https://atlas.microsoft.com
  /search/fuzzy/{format}:
    get:
      x-publish: true
      description: '**Free Form Search**


        **Applies to**: S0 and S1 pricing tiers.


        The basic default API is Free Form Search which handles the most fuzzy of inputs handling any combination of address or POI tokens. This search API is the canonical ''single line search''. The Free Form Search API is a seamless combination of POI search and geocoding. The API can also be weighted with a contextual position (lat./lon. pair), or fully constrained by a coordinate and radius, or it can be executed more generally without any geo biasing anchor point.We strongly advise you to use the ''countrySet'' parameter to specify only the countries for which your application needs coverage, as the default behavior will be to search the entire world, potentially returning unnecessary results. E.g.: `countrySet`=US,FR Please see Search Coverage for a complete list of all the supported countries.Most Search queries default to `maxFuzzyLevel`=2 to gain performance and also reduce unusual results. This new default can be overridden as needed per request by passing in the query param `maxFuzzyLevel`=3 or 4.'
      operationId: microsoftAzureSearchGetsearchfuzzy
      x-ms-examples:
        Search City Seattle:
          $ref: ./examples/GetSearchFuzzy.json
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SubscriptionKey'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/TextFormat'
      - name: query
        in: query
        description: The applicable query string (e.g., "seattle", "pizza"). Can _also_ be specified as a comma separated string composed by latitude followed by longitude (e.g., "47.641268, -122.125679"). Must be properly URL encoded.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - $ref: '#/components/parameters/Typeahead'
      - $ref: '#/components/parameters/LimitSearch'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/CategorySet'
      - $ref: '#/components/parameters/CountrySet'
      - $ref: '#/components/parameters/OptionalBiasLat'
      - $ref: '#/components/parameters/OptionalBiasLon'
      - $ref: '#/components/parameters/Radius'
      - $ref: '#/components/parameters/BoundingBoxTopLeft'
      - $ref: '#/components/parameters/BoundingBoxBottomRight'
      - $ref: '#/components/parameters/Language'
      - $ref: '#/components/parameters/ExtendedPostalCodesFor'
      - name: minFuzzyLevel
        in: query
        description: 'Minimum fuzziness level to be used. Default: 1, minimum: 1 and maximum: 4


          * Level 1 has no spell checking.


          * Level 2 uses normal n-gram spell checking. For example, query "restrant" can be matched to "restaurant."


          * Level 3 uses sound-like spell checking, and shingle spell checking. Sound-like spell checking is for "rstrnt" to "restaurant" matching. Shingle spell checking is for "mountainview" to "mountain view" matching.


          * Level 4 doesn’t add any more spell checking functions.




          The search engine will start looking for a match on the level defined by minFuzzyLevel, and will stop searching at the level specified by maxFuzzyLevel.'
        required: false
        schema:
          type: integer
          default: 1
          maximum: 4
          minimum: 1
      - name: maxFuzzyLevel
        in: query
        description: 'Maximum fuzziness level to be used. Default: 2, minimum: 1 and maximum: 4


          * Level 1 has no spell checking.


          * Level 2 uses normal n-gram spell checking. For example, query "restrant" can be matched to "restaurant."


          * Level 3 uses sound-like spell checking, and shingle spell checking. Sound-like spell checking is for "rstrnt" to "restaurant" matching. Shingle spell checking is for "mountainview" to "mountain view" matching.


          * Level 4 doesn’t add any more spell checking functions.




          The search engine will start looking for a match on the level defined by minFuzzyLevel, and will stop searching at the level specified by maxFuzzyLevel.'
        required: false
        schema:
          type: integer
          default: 2
          maximum: 4
          minimum: 1
      - $ref: '#/components/parameters/SearchIndexSet'
      - $ref: '#/components/parameters/BrandSet'
      - $ref: '#/components/parameters/ConnectorSet'
      - $ref: '#/components/parameters/View'
      - $ref: '#/components/parameters/OpeningHours'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFuzzyResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SearchFuzzyResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: Microsoft Azure Get Search Fuzzy Format
      tags:
      - Search
      security:
      - AADToken:
        - https://atlas.microsoft.com/.default
      - SharedKey: []
      - SasToken: []
    servers:
    - url: https://atlas.microsoft.com
  /search/poi/{format}:
    get:
      x-publish: true
      description: '**Get POI by Name**


        **Applies to**: S0 and S1 pricing tiers.


        Points of Interest (POI) Search allows you to request POI results by name. Search supports additional query parameters such as language and filtering results by area of interest driven by country or bounding box. Endpoint will return only POI results matching the query string. Response includes POI details such as address, coordinate location and category.'
      operationId: microsoftAzureSearchGetsearchpoi
      x-ms-examples:
        Search for juice bars within 5 miles of Seattle Downtown and limit the response to 5 results:
          $ref: ./examples/GetSearchPOI.json
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SubscriptionKey'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/TextFormat'
      - name: query
        in: query
        description: The POI name to search for (e.g., "statue of liberty", "starbucks"), must be properly URL encoded.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - $ref: '#/components/parameters/Typeahead'
      - $ref: '#/components/parameters/LimitSearch'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/CategorySet'
      - $ref: '#/components/parameters/CountrySet'
      - $ref: '#/components/parameters/OptionalBiasLat'
      - $ref: '#/components/parameters/OptionalBiasLon'
      - $ref: '#/components/parameters/Radius'
      - $ref: '#/components/parameters/BoundingBoxTopLeft'
      - $ref: '#/components/parameters/BoundingBoxBottomRight'
      - $ref: '#/components/parameters/Language'
      - $ref: '#/components/parameters/ExtendedPostalCodesForPoi'
      - $ref: '#/components/parameters/BrandSet'
      - $ref: '#/components/parameters/ConnectorSet'
      - $ref: '#/components/parameters/View'
      - $ref: '#/components/parameters/OpeningHours'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPoiResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SearchPoiResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: Microsoft Azure Get Search Poi Format
      tags:
      - Search
      security:
      - AADToken:
        - https://atlas.microsoft.com/.default
      - SharedKey: []
      - SasToken: []
    servers:
    - url: https://atlas.microsoft.com
  /search/nearby/{format}:
    get:
      x-publish: true
      description: '**Nearby Search**


        **Applies to**: S0 and S1 pricing tiers.


        If you have a use case for only retrieving POI results around a specific location, the nearby search method may be the right choice. This endpoint will only return POI results, and does not take in a search query parameter.'
      operationId: microsoftAzureSearchGetsearchnearby
      x-ms-examples:
        Search for any points of interest (POI) within 5 miles of Manhattan NY and return the top 10 results:
          $ref: ./examples/GetSearchNearby.json
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SubscriptionKey'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/TextFormat'
      - $ref: '#/components/parameters/RequiredBiasLat'
      - $ref: '#/components/parameters/RequiredBiasLon'
      - $ref: '#/components/parameters/LimitSearch'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/CategorySet'
      - $ref: '#/components/parameters/CountrySet'
      - name: radius
        in: query
        description: The radius in meters to for the results to be constrained to the defined area, Min value is 1, Max Value is 50000.
        required: false
        schema:
          type: number
      - $ref: '#/components/parameters/Language'
      - $ref: '#/components/parameters/ExtendedPostalCodesFor'
      - $ref: '#/components/parameters/BrandSet'
      - $ref: '#/components/parameters/ConnectorSet'
      - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchNearbyResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SearchNearbyResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: Microsoft Azure Get Search Nearby Format
      tags:
      - Search
      security:
      - AADToken:
        - https://atlas.microsoft.com/.default
      - SharedKey: []
      - SasToken: []
    servers:
    - url: https://atlas.microsoft.com
  /search/poi/category/{format}:
    get:
      x-publish: true
      description: '**Get POI by Category**


        **Applies to**: S0 and S1 pricing tiers.


        Points of Interest (POI) Category Search allows you to request POI results from given category. Search allows to query POIs from one category at a time. Endpoint will only return POI results which are categorized as specified. Response includes POI details such as address, coordinate location and classification.'
      operationId: microsoftAzureSearchGetsearchpoicategory
      x-ms-examples:
        Search for atm's within 2 miles of Times Square NY and return the top 3 results:
          $ref: ./examples/GetSearchPOICategory.json
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SubscriptionKey'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/TextFormat'
      - name: query
        in: query
        description: The POI category to search for (e.g., "AIRPORT", "RESTAURANT"), must be properly URL encoded. Supported main categories can be requested by calling [Get Search POI Category Tree API](https://aka.ms/AzureMapsPOICategoryTree). List of available categories can also be found [here](https://docs.microsoft.com/azure/azure-maps/supported-search-categories). We recommend to use POI Search Category Tree API to request the supported categories.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - $ref: '#/components/parameters/Typeahead'
      - $ref: '#/components/parameters/LimitSearch'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/CategorySet'
      - $ref: '#/components/parameters/CountrySet'
      - $ref: '#/components/parameters/OptionalBiasLat'
      - $ref: '#/components/parameters/OptionalBiasLon'
      - $ref: '#/components/parameters/Radius'
      - $ref: '#/components/parameters/BoundingBoxTopLeft'
      - $ref: '#/components/parameters/BoundingBoxBottomRight'
      - $ref: '#/components/parameters/Language'
      - $ref: '#/components/parameters/ExtendedPostalCodesFor'
      - $ref: '#/components/parameters/BrandSet'
      - $ref: '#/components/parameters/ConnectorSet'
      - $ref: '#/components/parameters/View'
      - $ref: '#/components/parameters/OpeningHours'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPoiCategoryResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SearchPoiCategoryResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: Microsoft Azure Get Search Poi Category Format
      tags:
      - Search
      security:
      - AADToken:
        - https://atlas.microsoft.com/.default
      - SharedKey: []
      - SasToken: []
    servers:
    - url: https://atlas.microsoft.com
  /search/poi/category/tree/{format}:
    get:
      x-publish: true
      description: '**Get POI Category Tree**


        **Applies to**: S0 and S1 pricing tiers.


        POI Category API provides a full list of supported Points of Interest (POI) categories and subcategories together with their translations and synonyms. The returned content can be used to provide more meaningful results through other Search Service APIs, like Get Search POI.'
      operationId: microsoftAzureSearchGetsearchpoicategorytreepreview
      x-ms-examples:
        Get the POI Category Tree (only partial response shown below):
          $ref: ./examples/GetPOICategoryTree.json
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SubscriptionKey'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/JsonFormat'
      - name: language
        in: query
        description: 'Language in which search results should be returned. Should be one of supported IETF language tags, except NGT and NGT-Latn. Language tag is case insensitive. When data in specified language is not available for a specific field, default language is used (English).


          Please refer to [Supported Languages](https://docs.microsoft.com/azure/azure-maps/supported-languages) for details.'
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoiCategoryResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/PoiCategoryResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: Microsoft Azure Get Search Poi Category Tree Format
      tags:
      - Search
      security:
      - AADToken:
        - https://atlas.microsoft.com/.default
      - SharedKey: []
      - SasToken: []
    servers:
    - url: https://atlas.microsoft.com
  /search/address/{format}:
    get:
      x-publish: true
      description: '**Address Geocoding**


        **Applies to**: S0 and S1 pricing tiers.


        In many cases, the complete search service might be too much, for instance if you are only interested in traditional geocoding. Search can also be accessed for address look up exclusively. The geocoding is performed by hitting the geocode endpoint with just the address or partial address in question. The geocoding search index will be queried for everything above the street level data. No POIs will be returned. Note that the geocoder is very tolerant of typos and incomplete addresses. It will also handle everything from exact street addresses or street or intersections as well as higher level geographies such as city centers, counties, states etc.'
      operationId: microsoftAzureSearchGetsearchaddress
      x-ms-examples:
        Search detail address 15127 NE 24th Street, Redmond, WA 98052:
          $ref: ./examples/GetSearchAddress.json
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SubscriptionKey'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/TextFormat'
      - name: query
        in: query
        description: The address to search for (e.g., "1 Microsoft way, Redmond, WA"), must be properly URL encoded.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - $ref: '#/components/parameters/Typeahead'
      - $ref: '#/components/parameters/LimitSearch'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/CountrySet'
      - $ref: '#/components/parameters/OptionalBiasLat'
      - $ref: '#/components/parameters/OptionalBiasLon'
      - $ref: '#/components/parameters/Radius'
      - $ref: '#/components/parameters/BoundingBoxTopLeft'
      - $ref: '#/components/parameters/BoundingBoxBottomRight'
      - $ref: '#/components/parameters/Language'
      - $ref: '#/components/parameters/ExtendedPostalCodesFor'
      - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAddressResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SearchAddressResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: Microsoft Azure Get Search Address Format
      tags:
      - Search
      security:
      - AADToken:
        - https://atlas.microsoft.com/.default
      - SharedKey: []
      - SasToken: []
    servers:
    - url: https://atlas.microsoft.com
  /search/address/reverse/{format}:
    get:
      x-publish: true
      description: '**Reverse Geocode to an Address**


        **Applies to**: S0 and S1 pricing tiers.


        There may be times when you need to translate a coordinate (example: 37.786505, -122.3862) into a human understandable street address. Most often this is needed in tracking applications where you receive a GPS feed from the device or asset and wish to know what address where the coordinate is located. This endpoint will return address information for a given coordinate.'
      operationId: microsoftAzureSearchGetsearchaddressreverse
      x-ms-examples:
        GetSearchAddressReverse:
          $ref: ./examples/GetSearchAddressReverse.json
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SubscriptionKey'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/TextFormat'
      - $ref: '#/components/parameters/Position'
      - $ref: '#/components/parameters/Language'
      - name: returnSpeedLimit
        in: query
