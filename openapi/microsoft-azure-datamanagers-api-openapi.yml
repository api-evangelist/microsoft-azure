components:
  parameters:
    dataManagerNameParameter:
      name: dataManagerName
      in: path
      description: The name of the DataManager Resource within the specified resource group. DataManager names must be between 3 and 24 characters in length and use any alphanumeric and underscore only
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 24
        minLength: 3
        pattern: ^[-\w\.]+$
    apiVersionParameter:
      name: api-version
      in: query
      description: The API Version
      required: true
      schema:
        type: string
    resourceGroupNameParameter:
      name: resourceGroupName
      in: path
      description: The Resource Group Name
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    subscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The Subscription Id
      required: true
      schema:
        type: string
  schemas:
    DataManagerUpdateParameter:
      description: The DataManagerUpdateParameter.
      type: object
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
          description: The sku type.
        tags:
          description: 'The list of key value pairs that describe the resource. These tags can be used in viewing and grouping this resource

            (across resource groups).'
          type: object
          additionalProperties:
            type: string
    Sku:
      description: The sku type.
      type: object
      properties:
        name:
          description: The sku name. Required for data manager creation, optional for update.
          type: string
        tier:
          description: The sku tier. This is based on the SKU name.
          type: string
    DataManagerList:
      description: DataManager resources Collection.
      type: object
      properties:
        value:
          description: List of data manager resources.
          type: array
          items:
            $ref: '#/components/schemas/DataManager'
        nextLink:
          description: Link for the next set of data stores.
          type: string
    Resource:
      description: Model of the Resource.
      required:
      - location
      type: object
      properties:
        id:
          description: The Resource Id.
          type: string
          readOnly: true
        name:
          description: The Resource Name.
          type: string
          readOnly: true
        type:
          description: The Resource type.
          type: string
          readOnly: true
        location:
          description: 'The location of the resource. This will be one of the supported and registered Azure Geo Regions (e.g. West US, East

            US, Southeast Asia, etc.). The geo region of a resource cannot be changed once it is created, but if an identical geo

            region is specified on update the request will succeed.'
          type: string
          x-ms-mutability:
          - read
          - create
        tags:
          description: 'The list of key value pairs that describe the resource. These tags can be used in viewing and grouping this resource

            (across resource groups).'
          type: object
          additionalProperties:
            type: string
        sku:
          $ref: '#/components/schemas/Sku'
          description: The sku type.
      x-ms-azure-resource: true
    DataManager:
      description: The DataManager resource.
      type: object
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        etag:
          description: Etag of the Resource.
          type: string
