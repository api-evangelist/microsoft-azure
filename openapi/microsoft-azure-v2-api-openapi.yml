openapi: 3.2.0
info:
  title: Microsoft Azure Azure Container Registry V2 API
  description: Metadata API definition for the Azure Container Registry runtime
  version: 2019-07-15-preview
security:
- registry_auth: []
  registry_oauth2: []
tags:
- name: v2
  description: Root API
paths:
  /v2/:
    get:
      tags:
      - v2
      description: Tells whether this Docker Registry instance supports Docker Registry HTTP API v2
      x-ms-examples:
        Check Docker Registry V2 Support:
          $ref: ./examples/GetDockerRegistryV2Support.json
      operationId: microsoftAzureGetdockerregistryv2support
      responses:
        '200':
          description: Successful response. API v2 supported
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcrErrors'
      summary: Microsoft Azure Get
components:
  schemas:
    AcrErrors:
      description: Acr error response describing why the operation failed
      properties:
        errors:
          type: array
          description: Array of detailed error
          items:
            $ref: '#/components/schemas/AcrErrorInfo'
    AcrErrorInfo:
      description: Error information
      properties:
        code:
          description: Error code
          type: string
        message:
          type: string
          description: Error message
        detail:
          type: object
          description: Error details
  securitySchemes:
    registry_auth:
      type: http
      scheme: basic
    registry_oauth2:
      type: apiKey
      in: header
      name: Authorization
x-ms-parameterized-host:
  hostTemplate: '{url}'
  useSchemePrefix: false
  positionInOperation: first
  parameters:
  - $ref: '#/components/parameters/Url'
