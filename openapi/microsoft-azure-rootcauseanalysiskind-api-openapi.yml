openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Root Cause Analysis Kind API
tags:
- name: RootCauseAnalysisKind
paths:
  /rootCauseAnalysis/kinds:
    get:
      tags:
      - RootCauseAnalysisKind
      summary: Microsoft Azure Get Kind List For Root Cause Analysis
      operationId: microsoftAzureListrootcauseanalysiskinds
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootCauseAnalysisKindList'
        default:
          description: Client error or server error (4xx or 5xx)
          headers:
            x-ms-error-code:
              description: error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-ms-examples:
        Get kind list for root cause analysis:
          $ref: ./examples/ListRootCauseAnalysisKinds.json
      description: Needs a more full description created.
components:
  schemas:
    ErrorDetail:
      type: object
      properties:
        message:
          description: Human-readable error message
          type: string
        code:
          description: Error code
          type: string
    RootCauseAnalysisKindList:
      required:
      - kinds
      type: object
      properties:
        kinds:
          description: Root cause analysis kind list
          type: array
          items:
            enum:
            - multidimensional
            type: string
            x-ms-enum:
              name: RootCauseAnalysisType
              modelAsString: true
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
