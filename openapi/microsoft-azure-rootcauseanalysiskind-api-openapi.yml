openapi: 3.2.0
info:
  title: Microsoft Azure Anomaly Detector Client Root Cause Analysis…
  description: Root cause analysis(RCA) helps drill down the crucial dimension combinations that contribute most to the given anomaly point. By learning the relationship among metrics, our algorithm supports finding root cause from both single and multiple measures, as well as providing reasonable interpretation.
  version: 1.1-preview.2
security:
- apiKeyHeader: []
tags:
- name: RootCauseAnalysisKind
paths:
  /rootCauseAnalysis/kinds:
    get:
      tags:
      - RootCauseAnalysisKind
      summary: Microsoft Azure Get Kind List For Root Cause Analysis
      operationId: microsoftAzureListrootcauseanalysiskinds
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootCauseAnalysisKindList'
        default:
          description: Client error or server error (4xx or 5xx)
          headers:
            x-ms-error-code:
              description: error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-ms-examples:
        Get kind list for root cause analysis:
          $ref: ./examples/ListRootCauseAnalysisKinds.json
      description: Needs a more full description created.
components:
  schemas:
    RootCauseAnalysisKindList:
      required:
      - kinds
      type: object
      properties:
        kinds:
          description: Root cause analysis kind list
          type: array
          items:
            enum:
            - multidimensional
            type: string
            x-ms-enum:
              name: RootCauseAnalysisType
              modelAsString: true
    ErrorDetail:
      type: object
      properties:
        message:
          description: Human-readable error message
          type: string
        code:
          description: Error code
          type: string
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: The secret key for your Azure Cognitive Services subscription.
x-ms-parameterized-host:
  hostTemplate: '{Endpoint}/anomalydetector/{ApiVersion}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
  - $ref: '#/components/parameters/ApiVersion'
