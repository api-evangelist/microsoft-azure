          format: date-time
          description: Gets or sets time when resource was last checked.
          type: string
          readOnly: true
        provisioningState:
          $ref: '#/components/schemas/DevOpsProvisioningState'
        fullyQualifiedName:
          description: 'Gets or sets the fully-qualified name of the project object.


            This contains the entire hierarchy where entities are separated by the ''$'' character.'
          type: string
          readOnly: true
        fullyQualifiedFriendlyName:
          description: 'Gets or sets the human readable fully-qualified name of the Project object.


            This contains the entire namespace hierarchy as seen on GitLab UI where entities are separated by the ''/'' character.'
          type: string
          readOnly: true
        fullyQualifiedParentGroupName:
          description: 'Gets or sets the fully-qualified name of the project''s parent group object.


            This contains the entire hierarchy where namespaces are separated by the ''$'' character.'
          type: string
          readOnly: true
        url:
          description: Gets or sets the url of the GitLab Project.
          type: string
          readOnly: true
        onboardingState:
          $ref: '#/components/schemas/OnboardingState'
    TargetBranchConfiguration:
      description: Repository branch configuration for PR Annotations.
      type: object
      properties:
        branchNames:
          description: Gets or sets branches that should have annotations.
          type: array
          items:
            type: string
          x-ms-identifiers: []
        annotateDefaultBranch:
          $ref: '#/components/schemas/AnnotateDefaultBranchState'
    GitLabProject:
      description: GitLab Project resource.
      type: object
      allOf:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ProxyResource
      properties:
        systemData:
