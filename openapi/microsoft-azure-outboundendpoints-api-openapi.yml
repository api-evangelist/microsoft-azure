      x-ms-examples:
        Update outbound endpoint for DNS resolver:
          $ref: ./examples/OutboundEndpoint_Patch.json
      summary: Microsoft Azure Patch Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Dnsresolvers Dnsresolvername Outboundendpoints Outboundendpointname
      requestBody:
        content:
          application/json:
