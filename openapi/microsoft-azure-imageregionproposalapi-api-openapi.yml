paths:
  /projects/{projectId}/images/{imageId}/regionproposals:
    post:
      tags:
      - ImageRegionProposalApi
      summary: Microsoft Azure Get Region Proposals For An Image Returns Empty Array If No…
      description: This API will get region proposals for an image along with confidences for the region. It returns an empty array if no proposals are found.
      operationId: microsoftAzureGetimageregionproposals
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        description: The image id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageRegionProposal'
            application/xml:
              schema:
                $ref: '#/components/schemas/ImageRegionProposal'
            text/xml:
              schema:
                $ref: '#/components/schemas/ImageRegionProposal'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful GetImageRegionProposals request:
          $ref: ./examples/GetImageRegionProposals.json
      security:
      - apim_key: []
    servers:
    - url: https://southcentralus.api.cognitive.microsoft.com/customvision/v3.3/training
  /{projectId}/images/{imageId}/regionproposals:
    post:
      tags:
      - ImageRegionProposalApi
      summary: Microsoft Azure Get Region Proposals For An Image Returns Empty Array If No…
      description: This API will get region proposals for an image along with confidences for the region. It returns an empty array if no proposals are found.
      operationId: microsoftAzureGetimageregionproposals
      parameters:
      - name: projectId
        in: path
        description: The project id
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        description: The image id
        required: true
        schema:
          type: string
          format: uuid
