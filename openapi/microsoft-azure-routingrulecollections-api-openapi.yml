openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Routing Rule Collections API
tags:
- name: RoutingRuleCollections
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/networkManagers/{networkManagerName}/routingConfigurations/{configurationName}/ruleCollections
  : get:
      tags:
      - RoutingRuleCollections
      operationId: microsoftAzureRoutingrulecollectionsList
      description: Lists all the rule collections in a routing configuration, in a paginated format.
      parameters:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/NetworkManagerNameParameter'
      - $ref: '#/components/parameters/RoutingConfigurationParameter'
      - $ref: '#/components/parameters/ListTopParameter'
      - $ref: '#/components/parameters/ListSkipTokenParameter'
      responses:
        '200':
          description: Get successful. The operation returns all ruleCollections in the specified routing configuration, in a paginated format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingRuleCollectionListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ./network.json#/definitions/CloudError
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        List routing rule collections:
          $ref: ./examples/NetworkManagerRoutingRuleCollectionList.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Networkmanagers Networkmanagername Routingconfigurations Configurationname Rulecollections
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/networkManagers/{networkManagerName}/routingConfigurations/{configurationName}/ruleCollections/{ruleCollectionName}
  : parameters:
    - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
    - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
    - $ref: ../../../../../common-types/resource-management/v5/types.json#/parameters/ResourceGroupNameParameter
    - $ref: '#/components/parameters/NetworkManagerNameParameter'
    - $ref: '#/components/parameters/RoutingConfigurationParameter'
    - $ref: '#/components/parameters/RuleCollectionParameter'
    get:
      tags:
      - RoutingRuleCollections
      description: Gets a network manager routing configuration rule collection.
      operationId: microsoftAzureRoutingrulecollectionsGet
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingRuleCollection'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ./network.json#/definitions/CloudError
      x-ms-examples:
        Gets routing rule collection:
          $ref: ./examples/NetworkManagerRoutingRuleCollectionGet.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Networkmanagers Networkmanagername Routingconfigurations Configurationname Rulecollections Rulecollectionname
    put:
      tags:
      - RoutingRuleCollections
      description: Creates or updates a routing rule collection.
      operationId: microsoftAzureRoutingrulecollectionsCreateorupdate
      responses:
        '200':
          description: Updated Rule Collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingRuleCollection'
        '201':
          description: Created Rule Collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingRuleCollection'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ./network.json#/definitions/CloudError
      x-ms-examples:
        Create or Update a routing rule collection:
          $ref: ./examples/NetworkManagerRoutingRuleCollectionPut.json
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Networkmanagers Networkmanagername Routingconfigurations Configurationname Rulecollections Rulecollectionname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingRuleCollection'
        description: The Rule Collection to create or update
        required: true
    delete:
      tags:
      - RoutingRuleCollections
      description: Deletes an routing rule collection.
      operationId: microsoftAzureRoutingrulecollectionsDelete
      responses:
        '202':
          description: Accepted and will complete asynchronously.
          headers:
            Location:
              description: The URL of the resource used to check the status of the asynchronous operation.
              schema:
                type: string
        '204':
          description: Request successful. Resource does not exist.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ./network.json#/definitions/CloudError
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      x-ms-examples:
        Deletes an routing rule collection:
          $ref: ./examples/NetworkManagerRoutingRuleCollectionDelete.json
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Network Networkmanagers Networkmanagername Routingconfigurations Configurationname Rulecollections Rulecollectionname
components:
  parameters:
    ListSkipTokenParameter:
      name: $skipToken
      description: SkipToken is only used if a previous operation returned a partial result. If a previous response contains a nextLink element, the value of the nextLink element will include a skipToken parameter that specifies a starting point to use for subsequent calls.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    RoutingConfigurationParameter:
      name: configurationName
      in: path
      description: The name of the network manager Routing Configuration.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_.-]*$
    NetworkManagerNameParameter:
      name: networkManagerName
      in: path
      required: true
      description: The name of the network manager.
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_.-]*$
    RuleCollectionParameter:
      name: ruleCollectionName
      in: path
      description: The name of the network manager routing Configuration rule collection.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_.-]*$
    ListTopParameter:
      name: $top
      description: An optional query parameter which specifies the maximum number of records to be returned by the server.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        maximum: 20
        minimum: 1
  schemas:
    RoutingRuleCollection:
      type: object
      properties:
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/RoutingRuleCollectionPropertiesFormat'
          description: Indicates the properties for the network manager routing rule collection.
        systemData:
          readOnly: true
          description: The system metadata related to this resource.
          $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/systemData
      allOf:
      - $ref: ./network.json#/definitions/ProxyResource
      description: Defines the routing rule collection.
    RoutingRuleCollectionPropertiesFormat:
      type: object
      properties:
        description:
          type: string
          description: A description of the routing rule collection.
        provisioningState:
          readOnly: true
          $ref: ./network.json#/definitions/ProvisioningState
          description: The provisioning state of the resource.
        resourceGuid:
          type: string
          readOnly: true
          description: Unique identifier for this resource.
        appliesTo:
          type: array
          x-ms-identifiers:
          - networkGroupId
          items:
            $ref: '#/components/schemas/NetworkManagerRoutingGroupItem'
          description: Groups for configuration
        disableBgpRoutePropagation:
          type: boolean
          default: true
          description: Determines whether BGP route propagation is enabled. Defaults to true.
        localRouteSetting:
          $ref: '#/components/schemas/RoutingRuleCollectionLocalRouteSetting'
          description: Indicates local route setting for this particular rule collection.
      required:
      - appliesTo
      - localRouteSetting
      description: Defines the routing rule collection properties.
    NetworkManagerRoutingGroupItem:
      type: object
      properties:
        networkGroupId:
          type: string
          description: Network manager group Id.
      required:
      - networkGroupId
      description: Network manager routing group item.
    RoutingRuleCollectionListResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/RoutingRuleCollection'
          description: A list of network manager routing configuration rule collections
        nextLink:
          type: string
          description: Gets the URL to get the next set of results.
      description: Routing configuration rule collection list result.
    RoutingRuleCollectionLocalRouteSetting:
      type: string
      description: Routing rule collection local route setting.
      enum:
      - NotSpecified
      - DirectRoutingWithinVNet
      - DirectRoutingWithinSubnet
      x-ms-enum:
        name: RoutingRuleCollectionLocalRouteSetting
        modelAsString: true
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
