        minLength: 1
        pattern: ^[-\w\._\(\)]+$
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: Client Api Version.
      schema:
        type: string
    ProviderNameParameter:
      name: providerName
      in: path
      required: true
      description: Provider name for the parent resource.
      x-ms-parameter-location: method
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: Gets subscription credentials which uniquely identify Microsoft Azure subscription. The subscription ID forms part of the URI for every service call.
      schema:
        type: string
    ResourceNameParameter:
      name: resourceName
      in: path
      required: true
      description: Parent resource name.
      x-ms-parameter-location: method
      schema:
        type: string
    ManagementAssociationNameParameter:
      x-ms-parameter-location: method
      name: managementAssociationName
      in: path
      required: true
      description: User ManagementAssociation Name.
      schema:
        type: string
    ResourceTypeParameter:
      name: resourceType
      in: path
      required: true
      description: Resource type for the parent resource
      x-ms-parameter-location: method
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      flows:
        implicit:
          scopes:
            user_impersonation: impersonate your user account
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
      description: Azure Active Directory OAuth2 Flow
