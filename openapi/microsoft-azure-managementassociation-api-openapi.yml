      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ProviderNameParameter'
      - $ref: '#/components/parameters/ResourceTypeParameter'
