components:
  schemas:
    NrfDeploymentResourceTagsUpdate:
      type: object
      description: The type used for updating tags in NrfDeploymentResource resources.
      properties:
        tags:
          type: object
          description: Resource tags.
          additionalProperties:
            type: string
    NrfDeploymentResource:
      type: object
      description: Azure for Operators 5G Core Network Repository Function (NRF) Deployment Resource
      properties:
        properties:
          $ref: '#/components/schemas/NrfDeploymentResourceProperties'
          description: The resource-specific properties for this resource.
          x-ms-client-flatten: true
          x-ms-mutability:
          - read
          - create
      allOf:
      - $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/TrackedResource
    ComponentDeploymentParameters:
      type: string
      description: Containerized Network Function (CNF) Component Deployment Parameters
    ClusterServiceIdProperty:
      type: string
      format: arm-id
      description: ARM resource ID of a cluster.
      x-ms-arm-id-details:
        allowedResources:
        - type: Microsoft.MobilePacketCore/clusterServices
    NrfDeploymentResourceProperties:
      type: object
      description: NRF Deployment Properties.
      properties:
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: The status of the last operation.
          readOnly: true
        componentParameters:
          $ref: '#/components/schemas/ComponentDeploymentParameters'
          description: Azure for Operators 5G Core NRF component parameters
        secretsParameters:
          $ref: '#/components/schemas/ComponentDeploymentSecrets'
          format: password
          description: Azure for Operators 5G Core NRF secrets parameters
          x-ms-secret: true
        clusterService:
          $ref: '#/components/schemas/ClusterServiceIdProperty'
          description: Reference to cluster where the Network Function is deployed
          x-ms-mutability:
          - read
          - create
        releaseVersion:
          $ref: '#/components/schemas/ReleaseVersion'
          description: Release version. This is inherited from the cluster
          readOnly: true
        operationalStatus:
          $ref: '#/components/schemas/OperationalStatus'
          description: Operational status
          readOnly: true
      required:
      - clusterService
    ProvisioningState:
      type: string
      description: Provisioning state of the resource
      enum:
      - Succeeded
      - Failed
      - Canceled
      - Provisioning
      - Updating
      - Deleting
      - Accepted
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
        values:
        - name: Succeeded
          value: Succeeded
          description: Resource has been created.
        - name: Failed
          value: Failed
          description: Resource creation failed.
        - name: Canceled
          value: Canceled
          description: Resource creation was canceled.
        - name: Provisioning
          value: Provisioning
          description: Resource is getting provisioned
        - name: Updating
          value: Updating
          description: Resource is updating
        - name: Deleting
          value: Deleting
          description: Resource is getting deleted
        - name: Accepted
          value: Accepted
          description: Resource has been accepted
      readOnly: true
    ReleaseVersion:
      type: string
      description: Azure for Operators 5G Core Release Version.
    OperationalStatus:
      type: object
      description: Operational Status of the resource
      properties:
        workload:
          type: string
          description: Status of the deployed workload
          readOnly: true
        healthCheck:
          type: string
          description: Health check results
          readOnly: true
    NrfDeploymentResourceListResult:
      type: object
      description: The response of a NrfDeploymentResource list operation.
      properties:
        value:
          type: array
          description: The NrfDeploymentResource items on this page
          items:
            $ref: '#/components/schemas/NrfDeploymentResource'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
