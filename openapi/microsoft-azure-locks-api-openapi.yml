openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Locks API
tags:
- name: Locks
paths:
  /locks/{key}:
    put:
      tags:
      - Locks
      summary: Microsoft Azure Locks A Key Value
      operationId: microsoftAzurePutlock
      parameters:
      - name: key
        in: path
        description: The key of the key-value to lock.
        required: true
        schema:
          type: string
      - name: label
        in: query
        description: The label, if any, of the key-value to lock.
        schema:
          type: string
      - $ref: '#/components/parameters/SyncTokens'
      - $ref: '#/components/parameters/ApiVersion'
      - name: If-Match
        in: header
        description: Used to perform an operation only if the targeted resource's etag matches the value provided.
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Used to perform an operation only if the targeted resource's etag does not match the value provided.
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            Sync-Token:
              description: Enables real-time consistency between requests by providing the returned value in the next request made to the server.
              schema:
                type: string
            ETag:
              description: An identifier representing the returned state of the resource.
              schema:
                type: string
          content:
            application/vnd.microsoft.appconfig.kv+json:
              schema:
                $ref: '#/components/schemas/KeyValue'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/KeyValue'
        default:
          description: Error response describing why the operation failed
          content:
            application/vnd.microsoft.appconfig.kv+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        PutLock:
          $ref: ./examples/PutLock.json
        PutLock_IfMatch:
          $ref: ./examples/PutLock_IfMatch.json
      description: Needs a more full description created.
    delete:
      tags:
      - Locks
      summary: Microsoft Azure Unlocks A Key Value
      operationId: microsoftAzureDeletelock
      parameters:
      - name: key
        in: path
        description: The key of the key-value to unlock.
        required: true
        schema:
          type: string
      - name: label
        in: query
        description: The label, if any, of the key-value to unlock.
        schema:
          type: string
      - $ref: '#/components/parameters/SyncTokens'
      - $ref: '#/components/parameters/ApiVersion'
      - name: If-Match
        in: header
        description: Used to perform an operation only if the targeted resource's etag matches the value provided.
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Used to perform an operation only if the targeted resource's etag does not match the value provided.
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            Sync-Token:
              description: Enables real-time consistency between requests by providing the returned value in the next request made to the server.
              schema:
                type: string
            ETag:
              description: An identifier representing the returned state of the resource.
              schema:
                type: string
          content:
            application/vnd.microsoft.appconfig.kv+json:
              schema:
                $ref: '#/components/schemas/KeyValue'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/KeyValue'
        default:
          description: Error response describing why the operation failed
          content:
            application/vnd.microsoft.appconfig.kv+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-examples:
        DeleteLock:
          $ref: ./examples/DeleteLock.json
        DeleteLock_IfMatch:
          $ref: ./examples/DeleteLock_IfMatch.json
      description: Needs a more full description created.
components:
  parameters:
    ApiVersion:
      name: api-version
      in: query
      description: The API version to be used with the HTTP request.
      required: true
      schema:
        type: string
    SyncTokens:
      name: Sync-Token
      in: header
      description: Used to guarantee real-time consistency between requests.
      schema:
        type: string
  schemas:
    KeyValue:
      type: object
      properties:
        key:
          type: string
          description: The key of the key-value.
        label:
          type: string
          description: The label the key-value belongs to.
        content_type:
          type: string
          description: The content type of the value stored within the key-value.
        value:
          type: string
          description: The value of the key-value.
        last_modified:
          format: date-time
          type: string
          description: A date representing the last time the key-value was modified.
        tags:
          type: object
          additionalProperties:
            type: string
          description: The tags of the key-value
        locked:
          type: boolean
          description: Indicates whether the key-value is locked.
        etag:
          type: string
          description: A value representing the current state of the resource.
    Error:
      description: Azure App Configuration error object.
      type: object
      properties:
        type:
          description: The type of the error.
          type: string
        title:
          description: A brief summary of the error.
          type: string
        name:
          description: The name of the parameter that resulted in the error.
          type: string
        detail:
          description: A detailed description of the error.
          type: string
        status:
          description: The HTTP status code that the error maps to.
          type: integer
      readOnly: true
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
