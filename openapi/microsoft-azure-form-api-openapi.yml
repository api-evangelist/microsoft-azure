openapi: 3.2.0
info:
  version: 2.1-preview.3
  title: Microsoft Azure Recognizer Client Form API
  description: Extracts information from forms and images into structured data.
security:
- apim_key: []
tags:
- name: Form
paths:
  /custom/models/compose:
    post:
      tags:
      - Form
      summary: Microsoft Azure Compose Trained With Labels Models Into One Composed Model
      description: 'Compose request would include list of models ids.

        It would validate what all models either trained with labels model or composed model.

        It would validate limit of models put together.'
      operationId: microsoftAzureComposecustommodelsasync
      responses:
        '201':
          description: Request is queued successfully.
          headers:
            Location:
              description: Location and ID of the composed model. The status of composed model is specified in the status property at the model location.
              schema:
                type: string
        default:
          description: Response entity accompanying non-successful responses containing additional details about the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Compose custom models:
          $ref: ./examples/ComposeModels.json
      x-ms-long-running-operation: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeRequest'
        description: Compose models
        required: true
components:
  schemas:
    ModelName:
      description: 'Optional user defined model name (max length: 1024).'
      type: string
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorInformation'
    ErrorInformation:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    ComposeRequest:
      description: Request contract for compose operation.
      required:
      - modelIds
      type: object
      properties:
        modelIds:
          description: List of model ids to compose.
          uniqueItems: false
          type: array
          items:
            type: string
            format: uuid
        modelName:
          $ref: '#/components/schemas/ModelName'
  securitySchemes:
    apim_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
x-ms-parameterized-host:
  hostTemplate: '{endpoint}/formrecognizer/v2.1-preview.3'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
x-ms-paths:
  /custom/models?op=full:
    get:
      summary: List Custom Models
      description: Get information about all custom models
      operationId: ListCustomModels
      consumes: []
      produces:
      - application/json
      parameters:
      - name: op
        in: query
        description: Specify whether to return summary or full list of models.
        required: true
        type: string
        enum:
        - full
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/components/schemas/Models'
        default:
          description: Response entity accompanying non-successful responses containing additional details about the error.
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: modelList
      x-ms-examples:
        List custom models:
          $ref: ./examples/GetModels.json
  /custom/models?op=summary:
    get:
      summary: Get Custom Models
      description: Get information about all custom models
      operationId: GetCustomModels
      consumes: []
      produces:
      - application/json
      parameters:
      - name: op
        in: query
        description: Specify whether to return summary or full list of models.
        required: true
        type: string
        enum:
        - summary
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/components/schemas/Models'
        default:
          description: Response entity accompanying non-successful responses containing additional details about the error.
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Get models summary:
          $ref: ./examples/GetModelsSummary.json
