components:
  parameters:
    TestLine.testLineName:
      name: testLineName
      in: path
      required: true
      description: Unique identifier for this test line
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{3,24}$
    CommunicationsGateway.communicationsGatewayName:
      name: communicationsGatewayName
      in: path
      required: true
      description: Unique identifier for this deployment
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{3,24}$
  schemas:
    ProvisioningState:
      type: string
      description: Provisioning state of the resource.
      enum:
      - Succeeded
      - Failed
      - Canceled
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
    TestLineProperties:
      type: object
      properties:
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: Resource provisioning state.
          readOnly: true
        phoneNumber:
          type: string
          description: The phone number
          x-ms-mutability:
          - read
          - update
          - create
        purpose:
          $ref: '#/components/schemas/TestLinePurpose'
          description: Purpose of this test line, e.g. automated or manual testing
          x-ms-mutability:
          - read
          - update
          - create
      description: Details of the TestLine resource.
      required:
      - phoneNumber
      - purpose
    TestLine:
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/TestLineProperties'
          description: The resource-specific properties for this resource.
          x-ms-mutability:
          - read
          - create
          x-ms-client-flatten: true
      description: A TestLine resource
      allOf:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/TrackedResource
    TestLineUpdate:
      type: object
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
          x-cadl-name: Record<string>
          description: Resource tags.
      description: The type used for update operations of the TestLine.
    TestLineListResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/TestLine'
          x-cadl-name: TestLine[]
          description: The TestLine items on this page
        nextLink:
          type: string
          description: The link to the next page of items
          x-cadl-name: Rest.ResourceLocation<TestLine>
      description: The response of a TestLine list operation.
      required:
