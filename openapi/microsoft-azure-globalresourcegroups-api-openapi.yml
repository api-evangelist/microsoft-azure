openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Global Resource Groups API
tags:
- name: GlobalResourceGroups
paths:
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/moveResources:
    post:
      tags:
      - GlobalResourceGroups
      operationId: microsoftAzureGlobalresourcegroupsMoveresources
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '204':
          description: No Content
      deprecated: false
      summary: Microsoft Azure Post Subscriptions Subscriptionid Resourcegroups Resourcegroupname Moveresources
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsmMoveResourceEnvelope'
          text/json:
            schema:
              $ref: '#/components/schemas/CsmMoveResourceEnvelope'
          application/xml:
            schema:
              $ref: '#/components/schemas/CsmMoveResourceEnvelope'
          text/xml:
            schema:
              $ref: '#/components/schemas/CsmMoveResourceEnvelope'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CsmMoveResourceEnvelope'
        required: true
components:
  parameters:
    subscriptionIdParameter:
      name: subscriptionId
      in: path
      description: Subscription Id
      required: true
      schema:
        type: string
    apiVersionParameter:
      name: api-version
      in: query
      description: API Version
      required: true
      schema:
        type: string
  schemas:
    CsmMoveResourceEnvelope:
      description: Class containing a list of the resources that need to be moved and the resource group they should be moved to
      type: object
      properties:
        targetResourceGroup:
          type: string
        resources:
          type: array
          items:
            type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
