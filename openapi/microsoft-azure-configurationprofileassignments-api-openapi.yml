openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Configuration Profile Assignments API
tags:
- name: ConfigurationProfileAssignments
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines/{vmName}/providers/Microsoft.Automanage/configurationProfileAssignments/{configurationProfileAssignmentName}
  : put:
      tags:
      - ConfigurationProfileAssignments
      operationId: microsoftAzureConfigurationprofileassignmentsCreateorupdate
      description: Creates an association between a VM and Automanage configuration profile
      x-ms-examples:
        Create or update configuration profile assignment:
          $ref: ./examples/createOrUpdateConfigurationProfileAssignment.json
      parameters:
      - name: configurationProfileAssignmentName
        in: path
        required: true
        description: Name of the configuration profile assignment. Only default is supported.
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/VmNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK. The configuration profile assignment for the VM was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationProfileAssignment'
        '201':
          description: Created. The Automanage configuration profile assignment for the VM was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationProfileAssignment'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: false
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Compute Virtualmachines Vmname Providers Microsoft Automanage Configurationprofileassignments Configurationprofileassignmentname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationProfileAssignment'
        description: Parameters supplied to the create or update configuration profile assignment.
        required: true
    get:
      tags:
      - ConfigurationProfileAssignments
      operationId: microsoftAzureConfigurationprofileassignmentsGet
      description: Get information about a configuration profile assignment
      x-ms-examples:
        Get a configuration profile assignment:
          $ref: ./examples/getConfigurationProfileAssignment.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
      - name: configurationProfileAssignmentName
        in: path
        required: true
        description: The configuration profile assignment name.
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/VmNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK. The configuration profile assignment was returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationProfileAssignment'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Compute Virtualmachines Vmname Providers Microsoft Automanage Configurationprofileassignments Configurationprofileassignmentname
    delete:
      tags:
      - ConfigurationProfileAssignments
      operationId: microsoftAzureConfigurationprofileassignmentsDelete
      description: Delete a configuration profile assignment
      x-ms-examples:
        Delete an configuration profile assignment:
          $ref: ./examples/deleteConfigurationProfileAssignment.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
      - name: configurationProfileAssignmentName
        in: path
        required: true
        description: Name of the configuration profile assignment
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/VmNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK
        '204':
          description: OK
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: false
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Compute Virtualmachines Vmname Providers Microsoft Automanage Configurationprofileassignments Configurationprofileassignmentname
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines/{vmName}/providers/Microsoft.Automanage/configurationProfileAssignments
