    CheckNameAvailabilitySpecifications:
      type: object
      properties:
        enableDefaultValidation:
          type: boolean
        resourceTypesWithCustomValidation:
          type: array
          items:
            type: string
    ResourceTypeExtensionOptions:
      type: object
      properties:
        resourceCreationBegin:
          allOf:
          - $ref: '#/components/schemas/ExtensionOptions'
    SubscriptionStateOverrideAction:
      required:
      - action
      - state
      type: object
      properties:
        state:
          enum:
          - Registered
          - Unregistered
          - Warned
          - Suspended
          - Deleted
          - WarnedToRegistered
          - WarnedToSuspended
          - WarnedToDeleted
          - WarnedToUnregistered
          - SuspendedToRegistered
          - SuspendedToWarned
          - SuspendedToDeleted
          - SuspendedToUnregistered
          type: string
          x-ms-enum:
            name: SubscriptionTransitioningState
            modelAsString: true
        action:
          enum:
          - NotDefined
          - DeleteAllResources
          - SoftDeleteAllResources
          - NoOp
          - BillingCancellation
          - UndoSoftDelete
          type: string
          x-ms-enum:
            name: SubscriptionNotificationOperation
            modelAsString: true
    ErrorResponse:
      description: Standard error response.
      type: object
      properties:
        error:
          description: Standard error object.
          allOf:
          - $ref: '#/components/schemas/Error'
    ExtendedLocationOptions:
      type: object
      properties:
        type:
          type: string
        supportedPolicy:
          type: string
    ServiceTreeInfo:
      type: object
      properties:
        serviceId:
          type: string
        componentId:
          type: string
        readiness:
          enum:
          - ClosingDown
          - Deprecated
          - GA
          - InDevelopment
          - InternalOnly
          - PrivatePreview
          - PublicPreview
          - RemovedFromARM
