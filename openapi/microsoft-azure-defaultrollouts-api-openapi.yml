openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Default Rollouts API
tags:
- name: DefaultRollouts
paths:
  ? /subscriptions/{subscriptionId}/providers/Microsoft.ProviderHub/providerRegistrations/{providerNamespace}/defaultRollouts/{rolloutName}
  : get:
      tags:
      - DefaultRollouts
      description: Gets the default rollout details.
      operationId: microsoftAzureDefaultrolloutsGet
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/ProviderNamespaceParameter'
      - $ref: '#/components/parameters/GetRolloutNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Successfully retrieved the default rollout details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultRollout'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        DefaultRollouts_Get:
          $ref: ./examples/DefaultRollouts_Get.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Providers Microsoft Providerhub Providerregistrations Providernamespace Defaultrollouts Rolloutname
    delete:
      tags:
      - DefaultRollouts
      description: Deletes the rollout resource. Rollout must be in terminal state.
      operationId: microsoftAzureDefaultrolloutsDelete
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/ProviderNamespaceParameter'
      - $ref: '#/components/parameters/GetRolloutNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Successfully deleted the default rollout resource.
        '204':
          description: Resource does not exist.
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        DefaultRollouts_Delete:
          $ref: ./examples/DefaultRollouts_Delete.json
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Providers Microsoft Providerhub Providerregistrations Providernamespace Defaultrollouts Rolloutname
    put:
      tags:
      - DefaultRollouts
      description: Creates or updates the rollout details.
      operationId: microsoftAzureDefaultrolloutsCreateorupdate
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/ProviderNamespaceParameter'
      - $ref: '#/components/parameters/GetRolloutNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Default rollout started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultRollout'
        '201':
          description: Default rollout completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultRollout'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        DefaultRollouts_CreateOrUpdate:
          $ref: ./examples/DefaultRollouts_CreateOrUpdate.json
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      summary: Microsoft Azure Put Subscriptions Subscriptionid Providers Microsoft Providerhub Providerregistrations Providernamespace Defaultrollouts Rolloutname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultRollout'
        description: The Default rollout properties supplied to the CreateOrUpdate operation.
        required: true
  /subscriptions/{subscriptionId}/providers/Microsoft.ProviderHub/providerRegistrations/{providerNamespace}/defaultRollouts:
    get:
      tags:
      - DefaultRollouts
      description: Gets the list of the rollouts for the given provider.
      operationId: microsoftAzureDefaultrolloutsListbyproviderregistration
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/ProviderNamespaceParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Successfully retrieved the list of default rollouts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultRolloutArrayResponseWithContinuation'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        DefaultRollouts_ListByProviderRegistration:
          $ref: ./examples/DefaultRollouts_ListByProviderRegistration.json
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Subscriptions Subscriptionid Providers Microsoft Providerhub Providerregistrations Providernamespace Defaultrollouts
  ? /subscriptions/{subscriptionId}/providers/Microsoft.ProviderHub/providerRegistrations/{providerNamespace}/defaultRollouts/{rolloutName}/stop
  : post:
      tags:
      - DefaultRollouts
      description: Stops or cancels the rollout, if in progress.
      operationId: microsoftAzureDefaultrolloutsStop
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/ProviderNamespaceParameter'
      - $ref: '#/components/parameters/GetRolloutNameParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Successfully cancelled the default rollout.
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        DefaultRollouts_Stop:
          $ref: ./examples/DefaultRollouts_Stop.json
      summary: Microsoft Azure Post Subscriptions Subscriptionid Providers Microsoft Providerhub Providerregistrations Providernamespace Defaultrollouts Rolloutname Stop
components:
  schemas:
    ThrottlingRule:
      required:
      - action
      - metrics
      type: object
      properties:
        action:
          type: string
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ThrottlingMetric'
        requiredFeatures:
          type: array
          items:
            type: string
    DefaultRolloutArrayResponseWithContinuation:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/DefaultRollout'
        nextLink:
          description: The URL to get to the next set of results, if there are any.
          type: string
    ResourceProviderAuthentication:
      required:
      - allowedAudiences
      type: object
      properties:
        allowedAudiences:
          type: array
          items:
            type: string
    Error:
      description: Standard error object.
      type: object
      properties:
        code:
          description: Server-defined set of error codes.
          type: string
          readOnly: true
        message:
          description: Human-readable representation of the error.
          type: string
          readOnly: true
        target:
          description: Target of the error.
          type: string
          readOnly: true
        details:
          description: Array of details about specific errors that led to this reported error.
          type: array
          items:
            $ref: '#/components/schemas/Error'
          readOnly: true
        innerError:
          description: Object containing more specific information than  the current object about the error.
          allOf:
          - $ref: '#/components/schemas/InnerError'
          readOnly: true
    ResourceTypeRegistration:
      type: object
      allOf:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ProxyResource
      properties:
        properties:
          allOf:
          - $ref: '#/components/schemas/ResourceTypeRegistrationProperties'
        systemData:
          $ref: ../../../../../common-types/resource-management/v1/types.json#/definitions/systemData
          readOnly: true
      x-ms-azure-resource: true
    OpenApiConfiguration:
      type: object
      properties:
        validation:
          $ref: '#/components/schemas/OpenApiValidation'
    ProviderHubMetadata:
      type: object
      properties:
        providerAuthorizations:
          type: array
          items:
            $ref: '#/components/schemas/ResourceProviderAuthorization'
        providerAuthentication:
          allOf:
          - $ref: '#/components/schemas/ResourceProviderAuthentication'
        thirdPartyProviderAuthorization:
          allOf:
          - $ref: '#/components/schemas/ThirdPartyProviderAuthorization'
    LoggingHiddenPropertyPath:
      type: object
      properties:
        hiddenPathsOnRequest:
          type: array
          items:
            type: string
        hiddenPathsOnResponse:
          type: array
          items:
            type: string
    RequestHeaderOptions:
      type: object
      properties:
        optInHeaders:
          enum:
          - NotSpecified
          - SignedUserToken
          - ClientGroupMembership
          - SignedAuxiliaryTokens
          - UnboundedClientGroupMembership
          type: string
          x-ms-enum:
            name: OptInHeaderType
            modelAsString: true
    SubscriptionLifecycleNotificationSpecifications:
      type: object
      properties:
        subscriptionStateOverrideActions:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionStateOverrideAction'
        softDeleteTTL:
          format: duration
          type: string
    ResourceConcurrencyControlOption:
      type: object
      properties:
        policy:
          enum:
          - NotSpecified
          - SynchronizeBeginExtension
          type: string
          x-ms-enum:
            name: Policy
            modelAsString: true
    ResourceTypeEndpoint:
      type: object
      properties:
        enabled:
          type: boolean
        apiVersions:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            type: string
        requiredFeatures:
          type: array
          items:
            type: string
        featuresRule:
          allOf:
          - $ref: '#/components/schemas/FeaturesRule'
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTypeExtension'
        timeout:
          format: duration
          type: string
        endpointType:
          enum:
          - NotSpecified
          - Canary
          - Production
          - TestInProduction
          type: string
          x-ms-enum:
            name: EndpointType
            modelAsString: true
    ExpeditedRolloutDefinition:
      description: Expedited rollout configuration.
      type: object
      properties:
        enabled:
          description: Indicates whether expedited rollout is enabled/disabled
          type: boolean
    InnerError:
      description: Inner error containing list of errors.
      type: object
      properties:
        code:
          description: Specific error code than was provided by the containing error.
          type: string
          readOnly: true
        innerError:
          description: Object containing more specific information than the current object about the error.
          type: object
          readOnly: true
      additionalProperties:
        type: object
    LinkedAccessCheck:
      type: object
      properties:
        actionName:
          type: string
        linkedProperty:
          type: string
        linkedAction:
          type: string
        linkedActionVerb:
          type: string
        linkedType:
          type: string
    ResourceMovePolicy:
      type: object
      properties:
        validationRequired:
          type: boolean
        crossResourceGroupMoveEnabled:
          type: boolean
        crossSubscriptionMoveEnabled:
          type: boolean
    ResourceProviderManagement:
      type: object
      properties:
        schemaOwners:
          type: array
          items:
            type: string
        manifestOwners:
          type: array
          items:
            type: string
        incidentRoutingService:
          type: string
        incidentRoutingTeam:
          type: string
        incidentContactEmail:
          type: string
        serviceTreeInfos:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTreeInfo'
        resourceAccessPolicy:
          enum:
          - NotSpecified
          - AcisReadAllowed
          - AcisActionAllowed
          type: string
        resourceAccessRoles:
          type: array
          items: {}
    ResourceGraphConfiguration:
      type: object
      properties:
        enabled:
          type: boolean
        apiVersion:
          type: string
    FeaturesRule:
      required:
      - requiredFeaturesPolicy
      type: object
      properties:
        requiredFeaturesPolicy:
          enum:
          - Any
          - All
          type: string
          x-ms-enum:
            name: FeaturesPolicy
            modelAsString: true
    ThrottlingMetric:
      required:
      - limit
      - type
      type: object
      properties:
        type:
          enum:
          - NotSpecified
          - NumberOfRequests
          - NumberOfResources
          type: string
          x-ms-enum:
            name: ThrottlingMetricType
            modelAsString: true
        limit:
          format: int64
          type: integer
        interval:
          format: duration
          type: string
    ExtensionOptions:
      type: object
      properties:
        request:
          type: array
          items:
            enum:
            - NotSpecified
            - DoNotMergeExistingReadOnlyAndSecretProperties
            - IncludeInternalMetadata
            type: string
            x-ms-enum:
              name: ExtensionOptionType
              modelAsString: true
        response:
          type: array
          items:
            enum:
            - NotSpecified
            - DoNotMergeExistingReadOnlyAndSecretProperties
            - IncludeInternalMetadata
            type: string
            x-ms-enum:
              name: ExtensionOptionType
              modelAsString: true
    OpenApiValidation:
      type: object
      properties:
        allowNoncompliantCollectionResponse:
          description: Indicates whether a non compliance response is allowed for a LIST call
          type: boolean
    ResourceProviderManifestProperties:
      type: object
      properties:
        providerAuthentication:
          allOf:
          - $ref: '#/components/schemas/ResourceProviderAuthentication'
        providerAuthorizations:
          type: array
          items:
            $ref: '#/components/schemas/ResourceProviderAuthorization'
        namespace:
          type: string
        providerVersion:
          type: string
        providerType:
          enum:
          - NotSpecified
          - Internal
          - External
          - Hidden
          - RegistrationFree
          - LegacyRegistrationRequired
          - TenantOnly
          - AuthorizationFree
          type: string
          x-ms-enum:
            name: ResourceProviderType
            modelAsString: true
        requiredFeatures:
          type: array
          items:
            type: string
        featuresRule:
          allOf:
          - $ref: '#/components/schemas/FeaturesRule'
        requestHeaderOptions:
          allOf:
          - $ref: '#/components/schemas/RequestHeaderOptions'
        management:
          allOf:
          - $ref: '#/components/schemas/ResourceProviderManagement'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/ResourceProviderCapabilities'
        metadata: {}
        templateDeploymentOptions:
          allOf:
          - $ref: '#/components/schemas/TemplateDeploymentOptions'
    ProviderRegistration:
      type: object
      allOf:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ProxyResource
      properties:
        properties:
          allOf:
          - $ref: '#/components/schemas/ProviderRegistrationProperties'
        systemData:
          $ref: ../../../../../common-types/resource-management/v1/types.json#/definitions/systemData
          readOnly: true
      x-ms-azure-resource: true
    ResourceProviderAuthorization:
      type: object
      properties:
        applicationId:
          type: string
        roleDefinitionId:
          type: string
        managedByRoleDefinitionId:
          type: string
    LightHouseAuthorization:
      required:
      - principalId
      - roleDefinitionId
      type: object
      properties:
        principalId:
          type: string
        roleDefinitionId:
          type: string
    CanaryTrafficRegionRolloutConfiguration:
      type: object
      properties:
        skipRegions:
          type: array
          items:
            type: string
        regions:
          type: array
          items:
            type: string
    ResourceTypeExtension:
      type: object
      properties:
        endpointUri:
          type: string
        extensionCategories:
          type: array
          items:
            enum:
            - NotSpecified
            - ResourceCreationValidate
            - ResourceCreationBegin
            - ResourceCreationCompleted
            - ResourceReadValidate
            - ResourceReadBegin
            - ResourcePatchValidate
            - ResourcePatchCompleted
            - ResourceDeletionValidate
            - ResourceDeletionBegin
            - ResourceDeletionCompleted
            - ResourcePostAction
            - SubscriptionLifecycleNotification
            - ResourcePatchBegin
            - ResourceMoveBegin
            - ResourceMoveCompleted
            type: string
            x-ms-enum:
              name: ExtensionCategory
              modelAsString: true
        timeout:
          format: duration
          type: string
    ResourceTypeRegistrationProperties:
      type: object
      properties:
        routingType:
          enum:
          - Default
          - ProxyOnly
          - HostBased
          - Extension
          - Tenant
          - Fanout
          - LocationBased
          - Failover
          - CascadeExtension
          type: string
          x-ms-enum:
            name: RoutingType
            modelAsString: true
        regionality:
          enum:
          - NotSpecified
          - Global
          - Regional
          type: string
          x-ms-enum:
            name: Regionality
            modelAsString: true
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTypeEndpoint'
        extensionOptions:
          allOf:
          - $ref: '#/components/schemas/ResourceTypeExtensionOptions'
        marketplaceType:
          enum:
          - NotSpecified
          - AddOn
          - Bypass
          - Store
          type: string
        swaggerSpecifications:
          type: array
          items:
            $ref: '#/components/schemas/SwaggerSpecification'
        allowedUnauthorizedActions:
          type: array
          items:
            type: string
        authorizationActionMappings:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationActionMapping'
        linkedAccessChecks:
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccessCheck'
        defaultApiVersion:
          type: string
        loggingRules:
          type: array
          items:
            $ref: '#/components/schemas/LoggingRule'
        throttlingRules:
          type: array
          items:
            $ref: '#/components/schemas/ThrottlingRule'
        requiredFeatures:
          type: array
          items:
            type: string
        featuresRule:
          allOf:
          - $ref: '#/components/schemas/FeaturesRule'
        enableAsyncOperation:
          type: boolean
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: The provisioned state of the resource.
        enableThirdPartyS2S:
          type: boolean
        subscriptionLifecycleNotificationSpecifications:
          allOf:
          - $ref: '#/components/schemas/SubscriptionLifecycleNotificationSpecifications'
        isPureProxy:
          type: boolean
        identityManagement:
          allOf:
          - $ref: '#/components/schemas/IdentityManagementProperties'
        checkNameAvailabilitySpecifications:
          allOf:
          - $ref: '#/components/schemas/CheckNameAvailabilitySpecifications'
        disallowedActionVerbs:
          type: array
          items:
            type: string
        serviceTreeInfos:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTreeInfo'
        requestHeaderOptions:
          allOf:
          - $ref: '#/components/schemas/RequestHeaderOptions'
        subscriptionStateRules:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionStateRule'
        templateDeploymentOptions:
          allOf:
          - $ref: '#/components/schemas/TemplateDeploymentOptions'
        extendedLocations:
          type: array
          items:
            $ref: '#/components/schemas/ExtendedLocationOptions'
        resourceMovePolicy:
          allOf:
          - $ref: '#/components/schemas/ResourceMovePolicy'
        resourceDeletionPolicy:
          enum:
          - NotSpecified
          - CascadeDeleteAll
          - CascadeDeleteProxyOnlyChildren
          type: string
          x-ms-enum:
            name: ResourceDeletionPolicy
            modelAsString: true
        resourceConcurrencyControlOptions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResourceConcurrencyControlOption'
        resourceGraphConfiguration:
          allOf:
          - $ref: '#/components/schemas/ResourceGraphConfiguration'
        management:
          allOf:
          - $ref: '#/components/schemas/ResourceProviderManagement'
        openApiConfiguration:
          $ref: '#/components/schemas/OpenApiConfiguration'
    ProvisioningState:
      enum:
      - NotSpecified
      - Accepted
      - Running
      - Creating
      - Created
      - Deleting
      - Deleted
      - Canceled
      - Failed
      - Succeeded
      - MovingResources
      - TransientFailure
      - RolloutInProgress
      type: string
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
    IdentityManagementProperties:
      type: object
      properties:
        type:
          enum:
          - NotSpecified
          - SystemAssigned
          - UserAssigned
          - Actor
          - DelegatedResourceIdentity
          type: string
          x-ms-enum:
            name: IdentityManagementTypes
            modelAsString: true
        applicationId:
          type: string
    ProviderRegistrationProperties:
      type: object
      allOf:
      - $ref: '#/components/schemas/ResourceProviderManifestProperties'
      properties:
        providerHubMetadata:
          allOf:
          - $ref: '#/components/schemas/ProviderHubMetadata'
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: The provisioned state of the resource.
        subscriptionLifecycleNotificationSpecifications:
          allOf:
          - $ref: '#/components/schemas/SubscriptionLifecycleNotificationSpecifications'
    DefaultRollout:
      description: Default rollout definition.
      type: object
      allOf:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ProxyResource
      properties:
        properties:
          allOf:
          - $ref: '#/components/schemas/DefaultRolloutProperties'
          description: Properties of the rollout.
        systemData:
          $ref: ../../../../../common-types/resource-management/v1/types.json#/definitions/systemData
          readOnly: true
      x-ms-azure-resource: true
    ExtendedErrorInfo:
      type: object
      properties:
        code:
          type: string
        target:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ExtendedErrorInfo'
        additionalInfo:
          type: array
          items:
            $ref: '#/components/schemas/TypedErrorInfo'
    DefaultRolloutSpecification:
      type: object
      properties:
        expeditedRollout:
          allOf:
          - $ref: '#/components/schemas/ExpeditedRolloutDefinition'
        canary:
          allOf:
          - $ref: '#/components/schemas/CanaryTrafficRegionRolloutConfiguration'
        lowTraffic:
          allOf:
          - $ref: '#/components/schemas/TrafficRegionRolloutConfiguration'
        mediumTraffic:
          allOf:
          - $ref: '#/components/schemas/TrafficRegionRolloutConfiguration'
        highTraffic:
          allOf:
          - $ref: '#/components/schemas/TrafficRegionRolloutConfiguration'
        restOfTheWorldGroupOne:
          allOf:
          - $ref: '#/components/schemas/TrafficRegionRolloutConfiguration'
        restOfTheWorldGroupTwo:
          allOf:
          - $ref: '#/components/schemas/TrafficRegionRolloutConfiguration'
        providerRegistration:
          allOf:
          - $ref: '#/components/schemas/ProviderRegistration'
        resourceTypeRegistrations:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTypeRegistration'
    ResourceProviderCapabilities:
      required:
      - effect
      - quotaId
      type: object
      properties:
        quotaId:
          type: string
        effect:
          enum:
          - NotSpecified
          - Allow
          - Disallow
          type: string
          x-ms-enum:
            name: ResourceProviderCapabilitiesEffect
            modelAsString: true
        requiredFeatures:
          type: array
          items:
            type: string
    DefaultRolloutProperties:
      type: object
      properties:
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: The provisioned state of the resource.
        specification:
          allOf:
          - $ref: '#/components/schemas/DefaultRolloutSpecification'
        status:
          allOf:
          - $ref: '#/components/schemas/DefaultRolloutStatus'
    ThirdPartyProviderAuthorization:
      type: object
      properties:
        authorizations:
          type: array
