openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Resource Type Registration API
tags:
- name: ResourceTypeRegistration
paths:
  ? /subscriptions/{subscriptionId}/providers/Microsoft.ProviderHub/providerRegistrations/{providerNamespace}/resourcetypeRegistrations/{resourceType}
  : get:
      tags:
      - ResourceTypeRegistration
      description: Gets a resource type details in the given subscription and provider.
      operationId: microsoftAzureResourcetyperegistrationsGet
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/ProviderNamespaceParameter'
      - $ref: '#/components/parameters/GetResourceTypeParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      x-ms-examples:
        ResourceTypeRegistrations_Get:
          $ref: ./examples/ResourceTypeRegistrations_Get.json
      responses:
        '200':
          description: Successfully retrieved the resource type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTypeRegistration'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Get Subscriptions Subscriptionid Providers Microsoft Providerhub Providerregistrations Providernamespace Resourcetyperegistrations Resourcetype
    put:
      tags:
      - ResourceTypeRegistration
      description: Creates or updates a resource type.
      operationId: microsoftAzureResourcetyperegistrationsCreateorupdate
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/ProviderNamespaceParameter'
      - $ref: '#/components/parameters/GetResourceTypeParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      x-ms-examples:
        ResourceTypeRegistrations_CreateOrUpdate:
          $ref: ./examples/ResourceTypeRegistrations_CreateOrUpdate.json
      responses:
        '200':
          description: Successfully updated the resource type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTypeRegistration'
        '201':
          description: Successfully created the resource type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTypeRegistration'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      summary: Microsoft Azure Put Subscriptions Subscriptionid Providers Microsoft Providerhub Providerregistrations Providernamespace Resourcetyperegistrations Resourcetype
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceTypeRegistration'
        description: The required request body parameters supplied to the resource type registration CreateOrUpdate operation.
        required: true
    delete:
      tags:
      - ResourceTypeRegistration
      description: Deletes a resource type
      operationId: microsoftAzureResourcetyperegistrationsDelete
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/ProviderNamespaceParameter'
      - $ref: '#/components/parameters/GetResourceTypeParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      x-ms-examples:
        ResourceTypeRegistrations_Delete:
          $ref: ./examples/ResourceTypeRegistrations_Delete.json
      responses:
        '200':
          description: Successfully deleted the resource type.
        '204':
          description: Resource does not exist.
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Providers Microsoft Providerhub Providerregistrations Providernamespace Resourcetyperegistrations Resourcetype
  ? /subscriptions/{subscriptionId}/providers/Microsoft.ProviderHub/providerRegistrations/{providerNamespace}/resourcetypeRegistrations
  : get:
      tags:
      - ResourceTypeRegistration
      description: Gets the list of the resource types for the given provider.
      operationId: microsoftAzureResourcetyperegistrationsListbyproviderregistration
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/ProviderNamespaceParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      x-ms-examples:
        ResourceTypeRegistrations_ListByProviderRegistration:
          $ref: ./examples/ResourceTypeRegistrations_ListByProviderRegistration.json
      responses:
        '200':
          description: Successfully retrieved the resource types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTypeRegistrationArrayResponseWithContinuation'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Subscriptions Subscriptionid Providers Microsoft Providerhub Providerregistrations Providernamespace Resourcetyperegistrations
components:
  schemas:
    ThrottlingRule:
      required:
      - action
      - metrics
      type: object
      properties:
        action:
          type: string
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ThrottlingMetric'
        requiredFeatures:
          type: array
          items:
            type: string
    Error:
      description: Standard error object.
      type: object
      properties:
        code:
          description: Server-defined set of error codes.
          type: string
          readOnly: true
        message:
          description: Human-readable representation of the error.
          type: string
          readOnly: true
        target:
          description: Target of the error.
          type: string
          readOnly: true
        details:
          description: Array of details about specific errors that led to this reported error.
          type: array
          items:
            $ref: '#/components/schemas/Error'
          readOnly: true
        innerError:
          description: Object containing more specific information than  the current object about the error.
          allOf:
          - $ref: '#/components/schemas/InnerError'
          readOnly: true
    ResourceTypeRegistration:
      type: object
      allOf:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ProxyResource
      properties:
        properties:
          allOf:
          - $ref: '#/components/schemas/ResourceTypeRegistrationProperties'
        systemData:
          $ref: ../../../../../common-types/resource-management/v1/types.json#/definitions/systemData
          readOnly: true
      x-ms-azure-resource: true
    OpenApiConfiguration:
      type: object
      properties:
        validation:
          $ref: '#/components/schemas/OpenApiValidation'
    LoggingHiddenPropertyPath:
      type: object
      properties:
        hiddenPathsOnRequest:
          type: array
          items:
            type: string
        hiddenPathsOnResponse:
          type: array
          items:
            type: string
    RequestHeaderOptions:
      type: object
      properties:
        optInHeaders:
          enum:
          - NotSpecified
          - SignedUserToken
          - ClientGroupMembership
          - SignedAuxiliaryTokens
          - UnboundedClientGroupMembership
          type: string
          x-ms-enum:
            name: OptInHeaderType
            modelAsString: true
    SubscriptionLifecycleNotificationSpecifications:
      type: object
      properties:
        subscriptionStateOverrideActions:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionStateOverrideAction'
        softDeleteTTL:
          format: duration
          type: string
    ResourceConcurrencyControlOption:
      type: object
      properties:
        policy:
          enum:
          - NotSpecified
          - SynchronizeBeginExtension
          type: string
          x-ms-enum:
            name: Policy
            modelAsString: true
    ResourceTypeEndpoint:
      type: object
      properties:
        enabled:
          type: boolean
        apiVersions:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            type: string
        requiredFeatures:
          type: array
          items:
            type: string
        featuresRule:
          allOf:
          - $ref: '#/components/schemas/FeaturesRule'
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTypeExtension'
        timeout:
          format: duration
          type: string
        endpointType:
          enum:
          - NotSpecified
          - Canary
          - Production
          - TestInProduction
          type: string
          x-ms-enum:
            name: EndpointType
            modelAsString: true
    InnerError:
      description: Inner error containing list of errors.
      type: object
      properties:
        code:
          description: Specific error code than was provided by the containing error.
          type: string
          readOnly: true
        innerError:
          description: Object containing more specific information than the current object about the error.
          type: object
          readOnly: true
      additionalProperties:
        type: object
    LinkedAccessCheck:
      type: object
      properties:
        actionName:
          type: string
        linkedProperty:
          type: string
        linkedAction:
          type: string
        linkedActionVerb:
          type: string
        linkedType:
          type: string
    ResourceTypeRegistrationArrayResponseWithContinuation:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTypeRegistration'
        nextLink:
          description: The URL to get to the next set of results, if there are any.
          type: string
    ResourceMovePolicy:
      type: object
      properties:
        validationRequired:
          type: boolean
        crossResourceGroupMoveEnabled:
          type: boolean
        crossSubscriptionMoveEnabled:
          type: boolean
    ResourceProviderManagement:
      type: object
      properties:
        schemaOwners:
          type: array
          items:
            type: string
        manifestOwners:
          type: array
          items:
            type: string
        incidentRoutingService:
          type: string
        incidentRoutingTeam:
          type: string
        incidentContactEmail:
          type: string
        serviceTreeInfos:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTreeInfo'
        resourceAccessPolicy:
          enum:
          - NotSpecified
          - AcisReadAllowed
          - AcisActionAllowed
          type: string
        resourceAccessRoles:
          type: array
          items: {}
    ResourceGraphConfiguration:
      type: object
      properties:
        enabled:
          type: boolean
        apiVersion:
          type: string
    FeaturesRule:
      required:
      - requiredFeaturesPolicy
      type: object
      properties:
        requiredFeaturesPolicy:
          enum:
          - Any
          - All
          type: string
          x-ms-enum:
            name: FeaturesPolicy
            modelAsString: true
    ThrottlingMetric:
      required:
      - limit
      - type
      type: object
      properties:
        type:
          enum:
          - NotSpecified
          - NumberOfRequests
          - NumberOfResources
          type: string
          x-ms-enum:
            name: ThrottlingMetricType
            modelAsString: true
        limit:
          format: int64
          type: integer
        interval:
          format: duration
          type: string
    ExtensionOptions:
      type: object
      properties:
        request:
          type: array
          items:
            enum:
            - NotSpecified
            - DoNotMergeExistingReadOnlyAndSecretProperties
            - IncludeInternalMetadata
            type: string
            x-ms-enum:
              name: ExtensionOptionType
              modelAsString: true
        response:
          type: array
          items:
            enum:
            - NotSpecified
            - DoNotMergeExistingReadOnlyAndSecretProperties
            - IncludeInternalMetadata
            type: string
            x-ms-enum:
              name: ExtensionOptionType
              modelAsString: true
    OpenApiValidation:
      type: object
      properties:
        allowNoncompliantCollectionResponse:
          description: Indicates whether a non compliance response is allowed for a LIST call
          type: boolean
    ResourceTypeExtension:
      type: object
      properties:
        endpointUri:
          type: string
        extensionCategories:
          type: array
          items:
            enum:
            - NotSpecified
            - ResourceCreationValidate
            - ResourceCreationBegin
            - ResourceCreationCompleted
            - ResourceReadValidate
            - ResourceReadBegin
            - ResourcePatchValidate
            - ResourcePatchCompleted
            - ResourceDeletionValidate
            - ResourceDeletionBegin
            - ResourceDeletionCompleted
            - ResourcePostAction
            - SubscriptionLifecycleNotification
            - ResourcePatchBegin
            - ResourceMoveBegin
            - ResourceMoveCompleted
            type: string
            x-ms-enum:
              name: ExtensionCategory
              modelAsString: true
        timeout:
          format: duration
          type: string
    ResourceTypeRegistrationProperties:
      type: object
      properties:
        routingType:
          enum:
          - Default
          - ProxyOnly
          - HostBased
          - Extension
          - Tenant
          - Fanout
          - LocationBased
          - Failover
          - CascadeExtension
          type: string
          x-ms-enum:
            name: RoutingType
            modelAsString: true
        regionality:
          enum:
          - NotSpecified
          - Global
          - Regional
          type: string
          x-ms-enum:
            name: Regionality
            modelAsString: true
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTypeEndpoint'
        extensionOptions:
          allOf:
          - $ref: '#/components/schemas/ResourceTypeExtensionOptions'
        marketplaceType:
          enum:
          - NotSpecified
          - AddOn
          - Bypass
          - Store
          type: string
        swaggerSpecifications:
          type: array
          items:
            $ref: '#/components/schemas/SwaggerSpecification'
        allowedUnauthorizedActions:
          type: array
          items:
            type: string
        authorizationActionMappings:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationActionMapping'
        linkedAccessChecks:
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccessCheck'
        defaultApiVersion:
          type: string
        loggingRules:
          type: array
          items:
            $ref: '#/components/schemas/LoggingRule'
        throttlingRules:
          type: array
          items:
            $ref: '#/components/schemas/ThrottlingRule'
        requiredFeatures:
          type: array
          items:
            type: string
        featuresRule:
          allOf:
          - $ref: '#/components/schemas/FeaturesRule'
        enableAsyncOperation:
          type: boolean
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: The provisioned state of the resource.
        enableThirdPartyS2S:
          type: boolean
        subscriptionLifecycleNotificationSpecifications:
          allOf:
          - $ref: '#/components/schemas/SubscriptionLifecycleNotificationSpecifications'
        isPureProxy:
          type: boolean
        identityManagement:
          allOf:
          - $ref: '#/components/schemas/IdentityManagementProperties'
        checkNameAvailabilitySpecifications:
          allOf:
          - $ref: '#/components/schemas/CheckNameAvailabilitySpecifications'
        disallowedActionVerbs:
          type: array
          items:
            type: string
        serviceTreeInfos:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTreeInfo'
        requestHeaderOptions:
          allOf:
          - $ref: '#/components/schemas/RequestHeaderOptions'
        subscriptionStateRules:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionStateRule'
        templateDeploymentOptions:
          allOf:
          - $ref: '#/components/schemas/TemplateDeploymentOptions'
        extendedLocations:
          type: array
          items:
            $ref: '#/components/schemas/ExtendedLocationOptions'
        resourceMovePolicy:
          allOf:
          - $ref: '#/components/schemas/ResourceMovePolicy'
        resourceDeletionPolicy:
          enum:
          - NotSpecified
          - CascadeDeleteAll
          - CascadeDeleteProxyOnlyChildren
          type: string
          x-ms-enum:
            name: ResourceDeletionPolicy
            modelAsString: true
        resourceConcurrencyControlOptions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResourceConcurrencyControlOption'
        resourceGraphConfiguration:
          allOf:
          - $ref: '#/components/schemas/ResourceGraphConfiguration'
        management:
          allOf:
          - $ref: '#/components/schemas/ResourceProviderManagement'
        openApiConfiguration:
          $ref: '#/components/schemas/OpenApiConfiguration'
    ProvisioningState:
      enum:
      - NotSpecified
      - Accepted
      - Running
      - Creating
      - Created
      - Deleting
      - Deleted
      - Canceled
      - Failed
      - Succeeded
      - MovingResources
      - TransientFailure
      - RolloutInProgress
      type: string
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
    IdentityManagementProperties:
      type: object
      properties:
        type:
          enum:
          - NotSpecified
          - SystemAssigned
          - UserAssigned
          - Actor
          - DelegatedResourceIdentity
          type: string
          x-ms-enum:
            name: IdentityManagementTypes
            modelAsString: true
        applicationId:
          type: string
    CheckNameAvailabilitySpecifications:
      type: object
      properties:
        enableDefaultValidation:
          type: boolean
        resourceTypesWithCustomValidation:
          type: array
          items:
            type: string
    ResourceTypeExtensionOptions:
      type: object
      properties:
        resourceCreationBegin:
          allOf:
          - $ref: '#/components/schemas/ExtensionOptions'
    SubscriptionStateOverrideAction:
      required:
      - action
      - state
      type: object
      properties:
        state:
          enum:
          - Registered
          - Unregistered
          - Warned
          - Suspended
          - Deleted
          - WarnedToRegistered
          - WarnedToSuspended
          - WarnedToDeleted
          - WarnedToUnregistered
          - SuspendedToRegistered
          - SuspendedToWarned
          - SuspendedToDeleted
          - SuspendedToUnregistered
          type: string
          x-ms-enum:
            name: SubscriptionTransitioningState
            modelAsString: true
        action:
          enum:
          - NotDefined
          - DeleteAllResources
          - SoftDeleteAllResources
          - NoOp
          - BillingCancellation
          - UndoSoftDelete
          type: string
          x-ms-enum:
            name: SubscriptionNotificationOperation
            modelAsString: true
    ErrorResponse:
      description: Standard error response.
      type: object
      properties:
        error:
          description: Standard error object.
          allOf:
          - $ref: '#/components/schemas/Error'
    ExtendedLocationOptions:
      type: object
      properties:
        type:
          type: string
        supportedPolicy:
          type: string
    ServiceTreeInfo:
      type: object
      properties:
        serviceId:
          type: string
        componentId:
          type: string
        readiness:
          enum:
          - ClosingDown
          - Deprecated
          - GA
          - InDevelopment
          - InternalOnly
          - PrivatePreview
          - PublicPreview
          - RemovedFromARM
          - Retired
          type: string
          x-ms-enum:
            name: Readiness
            modelAsString: true
    TemplateDeploymentOptions:
      type: object
      properties:
        preflightSupported:
          type: boolean
        preflightOptions:
          type: array
          items:
            enum:
            - None
            - ContinueDeploymentOnFailure
            - DefaultValidationOnly
            type: string
            x-ms-enum:
              name: PreflightOption
              modelAsString: true
    SubscriptionStateRule:
      type: object
      properties:
        state:
          enum:
          - NotDefined
          - Enabled
          - Warned
          - PastDue
          - Disabled
          - Deleted
          type: string
          x-ms-enum:
            name: SubscriptionState
            modelAsString: true
        allowedActions:
          type: array
          items:
            type: string
    SwaggerSpecification:
      type: object
      properties:
        apiVersions:
          type: array
          items:
            type: string
        swaggerSpecFolderUri:
          type: string
    AuthorizationActionMapping:
      type: object
      properties:
        original:
          type: string
        desired:
          type: string
    LoggingRule:
      required:
      - action
      - detailLevel
      - direction
      type: object
      properties:
        action:
          type: string
        direction:
          enum:
          - None
          - Request
          - Response
          type: string
          x-ms-enum:
            name: LoggingDirections
            modelAsString: true
        detailLevel:
          enum:
          - None
          - Body
          type: string
          x-ms-enum:
            name: LoggingDetails
            modelAsString: true
        hiddenPropertyPaths:
          allOf:
          - $ref: '#/components/schemas/LoggingHiddenPropertyPath'
  parameters:
    ProviderNamespaceParameter:
      in: path
      name: providerNamespace
      description: The name of the resource provider hosted within ProviderHub.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    GetResourceTypeParameter:
      in: path
      name: resourceType
      description: The resource type.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
