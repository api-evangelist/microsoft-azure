openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Pre Connections API
tags:
- name: PreConnections
paths:
  /calling/callConnections:
    post:
      tags:
      - PreConnections
      summary: Microsoft Azure Create An Outbound Call
      description: Create an outbound call.
      operationId: microsoftAzureServercallingCreatecall
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - name: Repeatability-Request-ID
        in: header
        description: If specified, the client directs that the request is repeatable; that is, that the client can make the request multiple times with the same Repeatability-Request-Id and get back an appropriate response without the server executing the request multiple times. The value of the Repeatability-Request-Id is an opaque string representing a client-generated unique identifier for the request. It is a version 4 (random) UUID.
        schema:
          type: string
          format: uuid
      - name: Repeatability-First-Sent
        in: header
        description: 'If Repeatability-Request-ID header is specified, then Repeatability-First-Sent header must also be specified. The value should be the date and time at which the request was first created, expressed using the IMF-fixdate form of HTTP-date. Example: Sun, 06 Nov 1994 08:49:37 GMT.'
        schema:
          type: string
      responses:
        '201':
          description: Returns the create call response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallConnectionProperties'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-examples:
        Create an outbound call.:
          $ref: ./examples/ServerCalling_CreateCall.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCallRequest'
        description: The create call request.
        required: true
  /calling/callConnections:answer:
    post:
      tags:
      - PreConnections
      summary: Microsoft Azure Answer A Call
      description: Answer a call using the IncomingCallContext from Event Grid.
      operationId: microsoftAzureServercallingAnswercall
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - name: Repeatability-Request-ID
        in: header
        description: If specified, the client directs that the request is repeatable; that is, that the client can make the request multiple times with the same Repeatability-Request-Id and get back an appropriate response without the server executing the request multiple times. The value of the Repeatability-Request-Id is an opaque string representing a client-generated unique identifier for the request. It is a version 4 (random) UUID.
        schema:
          type: string
          format: uuid
      - name: Repeatability-First-Sent
        in: header
        description: 'If Repeatability-Request-ID header is specified, then Repeatability-First-Sent header must also be specified. The value should be the date and time at which the request was first created, expressed using the IMF-fixdate form of HTTP-date. Example: Sun, 06 Nov 1994 08:49:37 GMT.'
        schema:
          type: string
      responses:
        '200':
          description: Returns the answer call response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallConnectionProperties'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-examples:
        Answer a Call.:
          $ref: ./examples/ServerCalling_AnswerCall.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerCallRequest'
        description: The answer call request.
        required: true
  /calling/callConnections:redirect:
    post:
      tags:
      - PreConnections
      summary: Microsoft Azure Redirect A Call
      description: Redirect a call.
      operationId: microsoftAzureServercallingRedirectcall
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - name: Repeatability-Request-ID
        in: header
        description: If specified, the client directs that the request is repeatable; that is, that the client can make the request multiple times with the same Repeatability-Request-Id and get back an appropriate response without the server executing the request multiple times. The value of the Repeatability-Request-Id is an opaque string representing a client-generated unique identifier for the request. It is a version 4 (random) UUID.
        schema:
          type: string
          format: uuid
      - name: Repeatability-First-Sent
        in: header
        description: 'If Repeatability-Request-ID header is specified, then Repeatability-First-Sent header must also be specified. The value should be the date and time at which the request was first created, expressed using the IMF-fixdate form of HTTP-date. Example: Sun, 06 Nov 1994 08:49:37 GMT.'
        schema:
          type: string
      responses:
        '204':
          description: Returns the redirect call response.
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-examples:
        Redirect a call.:
          $ref: ./examples/ServerCalling_RedirectCall.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedirectCallRequest'
        description: The redirect call request.
        required: true
  /calling/callConnections:reject:
    post:
      tags:
      - PreConnections
      summary: Microsoft Azure Reject The Call
      description: Reject the call.
      operationId: microsoftAzureServercallingRejectcall
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - name: Repeatability-Request-ID
        in: header
        description: If specified, the client directs that the request is repeatable; that is, that the client can make the request multiple times with the same Repeatability-Request-Id and get back an appropriate response without the server executing the request multiple times. The value of the Repeatability-Request-Id is an opaque string representing a client-generated unique identifier for the request. It is a version 4 (random) UUID.
        schema:
          type: string
          format: uuid
      - name: Repeatability-First-Sent
        in: header
        description: 'If Repeatability-Request-ID header is specified, then Repeatability-First-Sent header must also be specified. The value should be the date and time at which the request was first created, expressed using the IMF-fixdate form of HTTP-date. Example: Sun, 06 Nov 1994 08:49:37 GMT.'
        schema:
          type: string
      responses:
        '204':
          description: Returns the reject call response.
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-examples:
        Reject the call.:
          $ref: ./examples/ServerCalling_RejectCall.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCallRequest'
        description: The reject call request.
        required: true
components:
  schemas:
    CommunicationIdentifierModelKind:
      description: Type of CommunicationIdentifierModel.
      enum:
      - unknown
      - communicationUser
      - phoneNumber
      - microsoftTeamsUser
      type: string
      x-ms-enum:
        name: CommunicationIdentifierModelKind
        modelAsString: true
    CreateCallRequest:
      description: The request payload for creating the call.
      required:
      - targets
      - source
      - callbackUri
      type: object
      properties:
        targets:
          description: The targets of the call.
          type: array
          items:
            $ref: '#/components/schemas/CommunicationIdentifierModel'
        source:
          $ref: '#/components/schemas/CallSource'
          description: The source of the call.
        operationContext:
          description: A customer set value used to track the answering of a call.
          type: string
        callbackUri:
          description: The callback URI.
          type: string
        mediaStreamingConfiguration:
          $ref: '#/components/schemas/MediaStreamingConfiguration'
          description: Media Streaming Configuration.
    CallConnectionProperties:
      description: Properties of a call connection
      type: object
      properties:
        callConnectionId:
          description: The call connection id.
          type: string
        serverCallId:
          description: The server call id.
          type: string
        source:
          $ref: '#/components/schemas/CallSource'
          description: The source of the call, which is the caller.
        targets:
          description: The targets of the call.
          type: array
          items:
            $ref: '#/components/schemas/CommunicationIdentifierModel'
        callConnectionState:
          $ref: '#/components/schemas/CallConnectionStateModel'
        callbackUri:
          description: The callback URI.
          type: string
        mediaSubscriptionId:
          description: SubscriptionId for media streaming
          type: string
    CommunicationIdentifierModel:
      type: object
      properties:
        rawId:
          description: Full ID of the identifier.
          type: string
        kind:
          $ref: '#/components/schemas/CommunicationIdentifierModelKind'
        communicationUser:
          $ref: '#/components/schemas/CommunicationUserIdentifierModel'
          description: The communication user.
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumberIdentifierModel'
          description: The phone number.
        microsoftTeamsUser:
          $ref: '#/components/schemas/MicrosoftTeamsUserIdentifierModel'
          description: The Microsoft Teams user.
    AnswerCallRequest:
      description: The request payload for answering the call.
      required:
      - incomingCallContext
      - callbackUri
      type: object
      properties:
        incomingCallContext:
          description: The context associated with the call.
          type: string
        callbackUri:
          description: The callback uri.
          type: string
        mediaStreamingConfiguration:
          $ref: '#/components/schemas/MediaStreamingConfiguration'
          description: Media Streaming Configuration.
    MediaStreamingTransportType:
      description: The type of transport to be used for media streaming, eg. Websocket
      enum:
      - websocket
      type: string
      x-ms-enum:
        name: MediaStreamingTransportType
        modelAsString: true
    MediaStreamingAudioChannelType:
      description: Audio channel type to stream, eg. unmixed audio, mixed audio
      enum:
      - mixed
      - unmixed
      type: string
      x-ms-enum:
        name: MediaStreamingAudioChannelType
        modelAsString: true
    CommunicationError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationError'
        innererror:
          $ref: '#/components/schemas/CommunicationError'
    CommunicationUserIdentifierModel:
      required:
      - id
      type: object
      properties:
        id:
          type: string
    RedirectCallRequest:
      description: The request payload for redirecting the call.
      required:
      - incomingCallContext
      - target
      type: object
      properties:
        incomingCallContext:
          description: The context associated with the call.
          type: string
        target:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
          description: The target identity to redirect the call to.
    MicrosoftTeamsUserIdentifierModel:
      required:
      - userId
      type: object
      properties:
        userId:
          type: string
        isAnonymous:
          type: boolean
        cloud:
          $ref: '#/components/schemas/CommunicationCloudEnvironmentModel'
    CommunicationCloudEnvironmentModel:
      enum:
      - public
      - dod
      - gcch
      type: string
      x-ms-enum:
        name: CommunicationCloudEnvironmentModel
        modelAsString: true
    CallSource:
      description: The caller.
      required:
      - identifier
      type: object
      properties:
        callerId:
          $ref: '#/components/schemas/PhoneNumberIdentifierModel'
          description: "The source caller Id, a phone number, that's shown to the PSTN participant being invited. \nRequired only when calling a PSTN callee."
        displayName:
          description: Display name of the call if dialing out to a pstn number
          type: string
        identifier:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
          description: The identifier of the source of the call
    MediaStreamingConfiguration:
      description: Configuration of Media streaming.
      required:
      - transportUrl
      - transportType
      - contentType
      - audioChannelType
      type: object
      properties:
        transportUrl:
          description: Transport URL for media streaming
          type: string
        transportType:
          $ref: '#/components/schemas/MediaStreamingTransportType'
        contentType:
          $ref: '#/components/schemas/MediaStreamingContentType'
        audioChannelType:
          $ref: '#/components/schemas/MediaStreamingAudioChannelType'
    CallRejectReason:
      description: The rejection reason.
      enum:
      - none
      - busy
      - forbidden
      type: string
      x-ms-enum:
        name: CallRejectReason
        modelAsString: true
    PhoneNumberIdentifierModel:
      required:
      - value
      type: object
      properties:
        value:
          type: string
    CallConnectionStateModel:
      description: The state of the call connection.
      enum:
      - unknown
      - connecting
      - connected
      - transferring
      - transferAccepted
      - disconnecting
      - disconnected
      type: string
      x-ms-enum:
        name: CallConnectionStateModel
        modelAsString: true
    CommunicationErrorResponse:
      description: The Communication Services error response
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/CommunicationError'
    MediaStreamingContentType:
      description: Content type to stream, eg. audio, audio/video
      enum:
      - audio
      type: string
      x-ms-enum:
        name: MediaStreamingContentType
        modelAsString: true
    RejectCallRequest:
      description: The request payload for rejecting the call.
      required:
      - incomingCallContext
      type: object
      properties:
        incomingCallContext:
          description: The context associated with the call.
          type: string
        callRejectReason:
          $ref: '#/components/schemas/CallRejectReason'
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      description: Version of API to invoke.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
