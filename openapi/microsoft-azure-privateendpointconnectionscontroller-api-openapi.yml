openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Private Endpoint Connections Controller API
tags:
- name: PrivateEndpointConnectionsController
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Migrate/migrateProjects/{migrateProjectName}/privateEndpointConnections
  : get:
      tags:
      - PrivateEndpointConnectionsController
      summary: Microsoft Azure Get The Private Endpoint Connections
      description: Get all the private endpoint connections under a migrate project.
      operationId: microsoftAzurePrivateendpointconnectionscontrollerGetprivateendpointconnections
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      - $ref: '#/components/parameters/resourceGroupName'
      - $ref: '#/components/parameters/migrateProjectName'
      - name: api-version
        description: The API version to use for this operation.
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateEndpointConnectionCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/PrivateEndpointConnectionCollection'
            application/xml:
              schema:
                $ref: '#/components/schemas/PrivateEndpointConnectionCollection'
            text/xml:
              schema:
                $ref: '#/components/schemas/PrivateEndpointConnectionCollection'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
            text/json:
              schema:
                $ref: '#/components/schemas/CloudError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CloudError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        PrivateEndpointConnections_ListByProject:
          $ref: ./examples/PrivateEndpointConnections_ListByProject.json
      deprecated: false
components:
  parameters:
    migrateProjectName:
      name: migrateProjectName
      description: Migrate project name.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    subscriptionId:
      name: subscriptionId
      description: Azure Subscription Id in which project was created.
      in: path
      required: true
      schema:
        type: string
    resourceGroupName:
      name: resourceGroupName
      description: Name of the Azure Resource Group that project is part of.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
  schemas:
    PrivateEndpointConnectionProperties:
      type: object
      description: Properties of a private endpoint connection.
      properties:
        provisioningState:
          enum:
          - Accepted
          - InProgress
          - Succeeded
          - Failed
          type: string
          description: Provisioning state.
          readOnly: true
        privateEndpoint:
          $ref: '#/components/schemas/ResourceId'
          readOnly: true
        privateLinkServiceConnectionState:
          $ref: '#/components/schemas/PrivateLinkServiceConnectionState'
          description: Gets the properties of the object.
    PrivateEndpointConnectionCollection:
      description: Collection of PrivateLink resources.
      type: object
      properties:
        value:
          description: Gets the list of machines.
          type: array
          items:
            $ref: '#/components/schemas/PrivateEndpointConnection'
          readOnly: true
        nextLink:
          description: Gets the value of next link.
          type: string
          readOnly: true
    CloudError:
      x-ms-external: true
      type: object
      properties:
        error:
          $ref: '#/components/schemas/CloudErrorBody'
      description: An error response from the Azure Migrate service.
    ResourceId:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    PrivateLinkServiceConnectionState:
      type: object
      description: Private endpoint connection state.
      properties:
        status:
          enum:
          - Approved
          - Pending
          - Rejected
          - Disconnected
          type: string
          description: Private link connection state.
          x-ms-enum:
            name: status
            modelAsString: true
        description:
          type: string
          description: Description of the object.
        actionsRequired:
          type: string
          description: Action required.
    PrivateEndpointConnection:
      description: REST model used to encapsulate the user visible state of a PrivateEndpoint.
      type: object
      x-ms-azure-resource: true
      properties:
        id:
          description: Relative URL to get this Sites.
          type: string
          readOnly: true
        name:
          description: Gets the name of the resource.
          type: string
          readOnly: true
        type:
          description: Gets the resource type.
          type: string
          readOnly: true
        eTag:
          description: Gets the tag for optimistic concurrency control.
          type: string
          readOnly: true
        properties:
          $ref: '#/components/schemas/PrivateEndpointConnectionProperties'
          description: Gets the properties of the object.
          readOnly: true
        systemData:
          $ref: '#/components/schemas/systemData'
          readOnly: true
    CloudErrorBody:
      x-ms-external: true
      type: object
      properties:
        code:
          type: string
          description: An identifier for the error. Codes are invariant and are intended to be consumed programmatically.
        message:
          type: string
          description: A message describing the error, intended to be suitable for display in a user interface.
        target:
          type: string
          description: The target of the particular error. For example, the name of the property in error.
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudErrorBody'
          description: A list of additional details about the error.
      description: An error response from the Azure Migrate service.
    systemData:
      description: Metadata pertaining to creation and last modification of the resource.
      type: object
      readOnly: true
      properties:
        createdBy:
          type: string
          description: The identity that created the resource.
        createdByType:
          type: string
          description: The type of identity that created the resource.
          enum:
          - User
          - Application
          - ManagedIdentity
          - Key
          x-ms-enum:
            name: createdByType
            modelAsString: true
        createdAt:
          type: string
          format: date-time
          description: The timestamp of resource creation (UTC).
        lastModifiedBy:
          type: string
          description: The identity that last modified the resource.
        lastModifiedByType:
          type: string
          description: The type of identity that last modified the resource.
          enum:
          - User
          - Application
          - ManagedIdentity
          - Key
          x-ms-enum:
            name: createdByType
            modelAsString: true
        lastModifiedAt:
          type: string
          format: date-time
          description: The type of identity that last modified the resource.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
