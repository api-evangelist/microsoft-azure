components:
  schemas:
    AppSkuInfo:
      description: Information about the SKU of the IoT Central application.
      type: object
      properties:
        name:
          description: The name of the SKU.
          enum:
          - ST0
          - ST1
          - ST2
          type: string
          x-ms-enum:
            name: AppSku
            modelAsString: true
      required:
      - name
    AppListResult:
      description: A list of IoT Central Applications with a next link.
      type: object
      properties:
        nextLink:
          description: The link used to get the next page of IoT Central Applications.
          type: string
        value:
          description: A list of IoT Central Applications.
          type: array
          items:
            $ref: '#/components/schemas/App'
    CloudError:
      description: Error details.
      x-ms-external: true
      properties:
        error:
          description: Error response body.
          x-ms-client-flatten: true
          $ref: '#/components/schemas/CloudErrorBody'
    AppTemplatesResult:
      description: A list of IoT Central Application Templates with a next link.
      type: object
      properties:
        nextLink:
          description: The link used to get the next page of IoT Central application templates.
          type: string
        value:
          description: A list of IoT Central Application Templates.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/AppTemplate'
    AppState:
      description: The current state of the application.
      type: string
      enum:
      - created
      - suspended
      x-ms-enum:
        name: AppState
        modelAsString: true
      readOnly: true
    AppTemplate:
      description: IoT Central Application Template.
      type: object
      properties:
        manifestId:
          description: The ID of the template.
          type: string
          readOnly: true
        manifestVersion:
          description: The version of the template.
          type: string
          readOnly: true
        name:
          description: The name of the template.
          type: string
          readOnly: true
        title:
          description: The title of the template.
          type: string
          readOnly: true
        order:
          description: The order of the template in the templates list.
          type: number
          readOnly: true
        description:
          description: The description of the template.
          type: string
          readOnly: true
        industry:
          description: The industry of the template.
          type: string
          readOnly: true
        locations:
          description: A list of locations that support the template.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/AppTemplateLocations'
    App:
      description: The IoT Central application.
      type: object
      properties:
        properties:
          description: The common properties of an IoT Central application.
          x-ms-client-flatten: true
          $ref: '#/components/schemas/AppProperties'
        sku:
          description: A valid instance SKU.
          $ref: '#/components/schemas/AppSkuInfo'
        identity:
          description: The managed identities for the IoT Central application.
          $ref: ../../../../../common-types/resource-management/v3/managedidentity.json#/definitions/SystemAssignedServiceIdentity
      allOf:
      - $ref: '#/components/schemas/Resource'
      required:
      - sku
    AppProperties:
      description: The properties of an IoT Central application.
      type: object
      properties:
        applicationId:
          description: The ID of the application.
          type: string
          readOnly: true
        displayName:
          description: The display name of the application.
          type: string
        subdomain:
          description: The subdomain of the application.
          type: string
        template:
          description: The ID of the application template, which is a blueprint that defines the characteristics and behaviors of an application. Optional; if not specified, defaults to a blank blueprint and allows the application to be defined from scratch.
          type: string
          x-ms-mutability:
          - create
          - read
        state:
          description: The current state of the application.
          $ref: '#/components/schemas/AppState'
    CloudErrorBody:
      description: Details of error response.
      type: object
      properties:
        code:
          type: string
          description: The error code.
          readOnly: true
        message:
          type: string
          description: The error message.
          readOnly: true
        target:
          type: string
          description: The target of the particular error.
          readOnly: true
        details:
          type: array
          description: A list of additional details about the error.
          items:
            $ref: '#/components/schemas/CloudErrorBody'
    AppTemplateLocations:
      description: IoT Central Application Template Locations.
      type: object
      properties:
        id:
          description: The ID of the location.
          type: string
          readOnly: true
        displayName:
          description: The display name of the location.
          type: string
          readOnly: true
    AppPatch:
      description: The description of the IoT Central application.
      type: object
      properties:
        tags:
          description: Instance tags
          type: object
          additionalProperties:
            type: string
        sku:
          description: A valid instance SKU.
          $ref: '#/components/schemas/AppSkuInfo'
        properties:
          description: The common properties of an IoT Central application.
          x-ms-client-flatten: true
          $ref: '#/components/schemas/AppProperties'
        identity:
          description: The managed identities for the IoT Central application.
          $ref: ../../../../../common-types/resource-management/v3/managedidentity.json#/definitions/SystemAssignedServiceIdentity
    AppAvailabilityInfo:
      description: The properties indicating whether a given IoT Central application name or subdomain is available.
      type: object
      properties:
        nameAvailable:
          description: The value which indicates whether the provided name is available.
          type: boolean
          readOnly: true
        reason:
          description: The reason for unavailability.
          type: string
          readOnly: true
        message:
          description: The detailed reason message.
          type: string
          readOnly: true
    Resource:
      description: The common properties of an ARM resource.
      properties:
        id:
          readOnly: true
          type: string
          description: The ARM resource identifier.
        name:
          readOnly: true
          type: string
          description: The ARM resource name.
          pattern: ^(?![0-9]+$)(?!-)[a-zA-Z0-9-]{2,99}[a-zA-Z0-9]$
          x-comment: 'pattern must match #/parameters/resourceName'
        type:
          readOnly: true
          type: string
          description: The resource type.
        location:
          type: string
          description: The resource location.
          x-ms-mutability:
          - create
          - read
        tags:
          type: object
          additionalProperties:
            type: string
          description: The resource tags.
      x-ms-azure-resource: true
      required:
      - location
    OperationInputs:
      description: Input values.
      type: object
      properties:
        name:
          description: The name of the IoT Central application instance to check.
          type: string
        type:
          description: The type of the IoT Central resource to query.
          type: string
          default: IoTApps
      required:
      - name
    HierarchicalChildEntity:
      description: A Hierarchical Child Entity.
      type: object
      properties:
        typeId:
          description: The type ID of the Entity Model.
          type: integer
        readableType:
          $ref: '#/components/schemas/ReadableType'
      allOf:
      - $ref: '#/components/schemas/ChildEntity'
    PhraseListFeatureInfo:
      description: Phraselist Feature.
      type: object
      properties:
        phrases:
          type: string
          description: A list of comma-separated values.
        isExchangeable:
          description: An exchangeable phrase list feature are serves as single feature to the LUIS underlying training algorithm. It is used as a lexicon lookup feature where its value is 1 if the lexicon contains a given word or 0 if it doesn’t. Think of an exchangeable as a synonyms list. A non-exchangeable phrase list feature has all the phrases in the list serve as separate features to the underlying training algorithm. So, if you your phrase list feature contains 5 phrases, they will be mapped to 5 separate features. You can think of the non-exchangeable phrase list feature as an additional bag of words that you are willing to add to LUIS existing vocabulary features. Think of a non-exchangeable as set of different words. Default value is true.
          type: boolean
      allOf:
      - $ref: '#/components/schemas/FeatureInfoObject'
    WordListObject:
      description: Sublist of items for a list entity.
      type: object
      properties:
        canonicalForm:
          description: The standard form that the list represents.
          type: string
        list:
          description: List of synonym words.
          items:
            type: string
          type: array
    NDepthEntityExtractor:
      description: N-Depth Entity Extractor.
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelInfo'
      - $ref: '#/components/schemas/EntityModelInfo'
      properties:
        customPrebuiltDomainName:
          description: The domain name.
          type: string
        customPrebuiltModelName:
          description: The intent name or entity name.
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildEntity'
    EntityModelInfo:
      description: An Entity Extractor model info.
      type: object
      properties:
        roles:
          $ref: '#/components/schemas/EntityRoleList'
      allOf:
      - $ref: '#/components/schemas/ModelInfo'
    PatternAnyEntityExtractor:
      description: Pattern.Any Entity Extractor.
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelInfo'
      - $ref: '#/components/schemas/EntityModelInfo'
      properties:
        explicitList:
          $ref: '#/components/schemas/ExplicitListItemList'
    ModelTrainingDetails:
      description: Model Training Details.
      type: object
      properties:
        statusId:
          description: The train request status ID.
          type: integer
        status:
          $ref: '#/components/schemas/TrainingStatus'
        exampleCount:
          description: The count of examples used to train the model.
          type: integer
        trainingDateTime:
          description: When the model was trained.
          type: string
          format: date-time
        failureReason:
          description: Reason for the training failure.
          type: string
    ApplicationInfoResponse:
      description: Response containing the Application Info.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The ID (GUID) of the application.
        name:
          description: The name of the application.
          type: string
        description:
          description: The description of the application.
          type: string
        culture:
          description: The culture of the application. For example, "en-us".
          type: string
        usageScenario:
          description: Defines the scenario for the new application. Optional. For example, IoT.
          type: string
        domain:
          description: The domain for the new application. Optional. For example, Comics.
          type: string
        versionsCount:
          description: Amount of model versions within the application.
          type: integer
        createdDateTime:
          description: The version's creation timestamp.
          type: string
        endpoints:
          description: The Runtime endpoint URL for this model version.
          type: object
        endpointHitsCount:
          description: Number of calls made to this endpoint.
          type: integer
        activeVersion:
          description: The version ID currently marked as active.
          type: string
    PrebuiltDomainsList:
      description: List of Prebuilt Domains.
      type: array
      items:
        $ref: '#/components/schemas/PrebuiltDomain'
    ApplicationPublishObject:
      description: Object model for publishing a specific application version.
      type: object
      properties:
        versionId:
          description: The version ID to publish.
