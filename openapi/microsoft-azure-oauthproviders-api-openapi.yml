openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector O Auth Providers API
tags:
- name: OAuthProviders
paths:
  /oauth/providers:
    get:
      tags:
      - OAuthProviders
      description: Returns a paginated list of oauthProvider resources.
      operationId: microsoftAzureOauthprovidersList
      parameters:
      - in: query
        name: ids
        description: Ids of the resource.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: names
        description: Names of the resource.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: propertyFilters
        description: 'Filters on key-value pairs within the Properties object.

          eg. "{testKey} eq {testValue}".'
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: statuses
        description: Statuses of the resource.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: minCreatedDateTime
        description: Minimum creation date of resource (inclusive).
        schema:
          type: string
          format: date-time
      - in: query
        name: maxCreatedDateTime
        description: Maximum creation date of resource (inclusive).
        schema:
          type: string
          format: date-time
      - in: query
        name: minLastModifiedDateTime
        description: Minimum last modified date of resource (inclusive).
        schema:
          type: string
          format: date-time
      - in: query
        name: maxLastModifiedDateTime
        description: Maximum last modified date of resource (inclusive).
        schema:
          type: string
          format: date-time
      - in: query
        name: maxPageSize
        description: 'Maximum number of items needed (inclusive).

          Minimum = 10, Maximum = 1000, Default value = 50.'
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 1000
          minimum: 10
      - in: query
        name: skipToken
        description: Skip token for getting next set of results.
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderListResponse'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        OAuthProviders_List:
          $ref: ./examples/OAuthProviders_List.json
      summary: Microsoft Azure Get Oauth Providers
  /oauth/providers/{oauthProviderId}:
    get:
      tags:
      - OAuthProviders
      description: Get a specified oauthProvider resource.
      operationId: microsoftAzureOauthprovidersGet
      parameters:
      - in: path
        name: oauthProviderId
        description: ID of the oauthProvider resource.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProvider'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        OAuthProviders_Get:
          $ref: ./examples/OAuthProviders_Get.json
      summary: Microsoft Azure Get Oauth Providers Oauthproviderid
    patch:
      tags:
      - OAuthProviders
      description: Creates or updates an oauthProvider resource.
      operationId: microsoftAzureOauthprovidersCreateorupdate
      parameters:
      - in: path
        name: oauthProviderId
        description: ID of oauthProvider resource.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProvider'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProvider'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        OAuthProviders_CreateOrUpdate:
          $ref: ./examples/OAuthProviders_CreateOrUpdate.json
      summary: Microsoft Azure Patch Oauth Providers Oauthproviderid
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/OAuthProvider'
        description: OauthProvider resource payload to create or update.
        required: true
    delete:
      tags:
      - OAuthProviders
      description: Deletes an specified oauthProvider resource.
      operationId: microsoftAzureOauthprovidersDelete
      parameters:
      - in: path
        name: oauthProviderId
        description: ID of oauthProvider.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        OAuthProviders_Delete:
          $ref: ./examples/OAuthProviders_Delete.json
      summary: Microsoft Azure Delete Oauth Providers Oauthproviderid
  /oauth/providers/cascade-delete/{jobId}:
    get:
      tags:
      - OAuthProviders
      description: Get cascade delete job for oauthProvider resource.
      operationId: microsoftAzureOauthprovidersGetcascadedeletejobdetails
      parameters:
      - in: path
        name: jobId
        description: Id of the job.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderCascadeDeleteJob'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        OAuthProviders_GetCascadeDeleteJobDetails:
          $ref: ./examples/OAuthProviders_GetCascadeDeleteJobDetails.json
      summary: Microsoft Azure Get Oauth Providers Cascade Delete Jobid
    put:
      tags:
      - OAuthProviders
      description: Create cascade delete job for oauthProvider resource.
      operationId: microsoftAzureOauthprovidersCreatecascadedeletejob
      parameters:
      - in: path
        name: jobId
        description: Job Id supplied by end user.
        required: true
        schema:
          type: string
      - in: query
        name: oauthProviderId
        description: Id of the application data.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderCascadeDeleteJob'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      x-ms-examples:
        OAuthProviders_CreateCascadeDeleteJob:
          $ref: ./examples/OAuthProviders_CreateCascadeDeleteJob.json
      summary: Microsoft Azure Put Oauth Providers Cascade Delete Jobid
components:
  schemas:
    ErrorResponse:
      description: An error response from the Azure AgPlatform service. See https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses for ErrorResponse reference document.
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
        traceId:
          description: Unique trace Id.
          type: string
    OAuthProviderListResponse:
      description: Paged response contains list of requested objects and a URL link to get the next set of results.
      required:
      - value
      type: object
      properties:
        value:
          description: List of requested objects.
          type: array
          items:
            $ref: '#/components/schemas/OAuthProvider'
        skipToken:
          description: Token used in retrieving the next page. If null, there are no additional pages.
          type: string
        nextLink:
          description: Continuation link (absolute URI) to the next page of results in the list.
          type: string
    Error:
      description: An error from the Azure AgPlatform service.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Server-defined set of error codes.
          minLength: 1
          type: string
        message:
          description: Human-readable representation of the error.
          minLength: 1
          type: string
        target:
          description: Target of the error.
          type: string
        details:
          description: Array of details about specific errors that led to this reported error.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        innererror:
          $ref: '#/components/schemas/InnerError'
    OAuthProviderCascadeDeleteJob:
      description: Schema of oauth provider cascade delete job.
      required:
      - oauthProviderId
      type: object
      properties:
        oauthProviderId:
          description: The id of the oauth provider.
          minLength: 1
          type: string
        id:
          description: Unique job id.
          type: string
          readOnly: true
        status:
          description: 'Status of the job.

            Possible values: ''Waiting'', ''Running'', ''Succeeded'', ''Failed'', ''Cancelled''.'
          type: string
          readOnly: true
        durationInSeconds:
          format: double
          description: Duration of the job in seconds.
          type: number
          readOnly: true
        message:
          description: Status message to capture more details of the job.
          type: string
          readOnly: true
        errorCode:
          description: Error Code when job failed.
          type: string
          readOnly: true
        createdDateTime:
          format: date-time
          description: 'Job created at dateTime. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        lastActionDateTime:
          format: date-time
          description: 'Job was last acted upon at dateTime. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        startTime:
          format: date-time
          description: 'Job start time when available. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        endTime:
          format: date-time
          description: 'Job end time when available. Sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
        name:
          description: Name to identify resource.
          maxLength: 100
          minLength: 0
          type: string
        description:
          description: Textual description of the resource.
          maxLength: 500
          minLength: 0
          type: string
        createdBy:
          description: Created by user/tenant id.
          type: string
          readOnly: true
        modifiedBy:
          description: Modified by user/tenant id.
          type: string
          readOnly: true
        properties:
          description: 'A collection of key value pairs that belongs to the resource.

            Each pair must not have a key greater than 50 characters

            and must not have a value greater than 150 characters.

            Note: A maximum of 25 key value pairs can be provided for a resource and only string,

            numeral and datetime (yyyy-MM-ddTHH:mm:ssZ) values are supported.'
          type: object
          additionalProperties: {}
          example:
            key1: value1
            key2: 123.45
    OAuthProvider:
      description: Schema of OAuth provider resource.
      type: object
      properties:
        appId:
          description: OAuth App Id for given OAuth Provider.
          maxLength: 200
          minLength: 2
          type: string
        appSecret:
          description: 'OAuth App secret for given Provider.

            Note: Won''t be sent in response.'
          maxLength: 200
          minLength: 2
          type: string
        apiKey:
          description: 'OAuth Api key for given Provider.

            Note: currently Applicable to Climate provider. Won''t be sent in response.'
          maxLength: 200
          minLength: 2
          type: string
        isProductionApp:
          description: 'An optional flag to determine if the App is ready to be used for Production scenarios in the provider side or not. (Default value: false)

            Note: Currently applicable for JohnDeere.'
          default: false
          type: boolean
        id:
          description: Unique OAuth provider ID.
          type: string
          readOnly: true
        eTag:
          description: The ETag value to implement optimistic concurrency.
          type: string
          readOnly: true
        createdDateTime:
          format: date-time
          description: 'Date-time when resource was created, sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
          example: '2020-12-31T11:10:21Z'
        modifiedDateTime:
          format: date-time
          description: 'Date-time when resource was last modified, sample format: yyyy-MM-ddTHH:mm:ssZ.'
          type: string
          readOnly: true
          example: '2020-12-31T11:10:21Z'
        name:
          description: Name to identify resource.
          maxLength: 100
          minLength: 0
          type: string
        description:
          description: Textual description of the resource.
          maxLength: 500
          minLength: 0
          type: string
        createdBy:
          description: Created by user/tenant id.
          type: string
          readOnly: true
        modifiedBy:
          description: Modified by user/tenant id.
          type: string
          readOnly: true
        properties:
          description: 'A collection of key value pairs that belongs to the resource.

            Each pair must not have a key greater than 50 characters

            and must not have a value greater than 150 characters.

            Note: A maximum of 25 key value pairs can be provided for a resource and

            only string, numeral and datetime (yyyy-MM-ddTHH:mm:ssZ) values are supported.'
          type: object
          additionalProperties: {}
          example:
            key1: value1
            key2: 123.45
    InnerError:
      description: Inner error containing list of errors.See https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#innererror--object for InnerError reference document.
      type: object
      properties:
        code:
          description: Specific error code than was provided by the containing error.
          type: string
        innererror:
          $ref: '#/components/schemas/InnerError'
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
