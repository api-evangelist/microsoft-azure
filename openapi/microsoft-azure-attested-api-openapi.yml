openapi: 3.2.0
info:
  title: Microsoft Azure InstanceMetadataClient Attested API
  description: The Azure Instance Metadata Client
  version: '2020-09-01'
servers:
- url: http://169.254.169.254/metadata
- url: https://169.254.169.254/metadata
tags:
- name: Attested
paths:
  /attested/document:
    get:
      operationId: microsoftAzureAttestedGetdocument
      description: Get Attested Data for the Virtual Machine.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - name: nonce
        in: query
        required: false
        description: This is a string of up to 32 random alphanumeric characters.
        schema:
          type: string
      - $ref: '#/components/parameters/MetadataParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestedData'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Get Attested Data for the VM:
          $ref: ./examples/GetAttestedData.json
      summary: Microsoft Azure Get Attested Document
      tags:
      - Attested
components:
  schemas:
    ErrorResponse:
      description: This is the response from an operation in the case an error occurs.
      type: object
      properties:
        error:
          description: Error message indicating why the operation failed.
          type: string
    AttestedData:
      type: object
      description: This is the response from the Attested_GetDocument operation.
      properties:
        signature:
          type: string
          description: This is the encoded string containing the VM ID, SKU, plan information, public key, timestamp, and nonce value.
        encoding:
          type: string
          description: This is the encoding scheme of the signature.
  parameters:
    MetadataParameter:
      name: Metadata
      in: header
      description: This must be set to 'true'.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - 'true'
    ApiVersionParameter:
      name: api-version
      in: query
      description: This is the API version to use.
      required: true
      x-ms-enum:
        name: ApiVersion
        modelAsString: true
      schema:
        type: string
        enum:
        - '2018-10-01'
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
      description: A Basic authentication flow
