openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Nginx Certificate API
tags:
- name: NginxCertificate
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Nginx.NginxPlus/nginxDeployments/{deploymentName}/certificates/{certificateName}
  : get:
      tags:
      - NginxCertificate
      summary: Microsoft Azure Get A Certificate Of Given Nginx Deployment
      operationId: microsoftAzureCertificatesGet
      parameters:
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/DeploymentNameParameter'
      - in: path
        name: certificateName
        description: The name of certificate
        required: true
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NginxCertificate'
        default:
          description: Default error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceProviderDefaultErrorResponse'
      x-ms-examples:
        Certificates_Get:
          $ref: ./examples/Certificates_Get.json
      description: Needs a more full description created.
    put:
      tags:
      - NginxCertificate
      summary: Microsoft Azure Create Or Update The Nginx Certificates For Given Nginx Deployment
      operationId: microsoftAzureCertificatesCreate
      parameters:
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/DeploymentNameParameter'
      - in: path
        name: certificateName
        description: The name of certificate
        required: true
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NginxCertificate'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NginxCertificate'
        default:
          description: Default error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceProviderDefaultErrorResponse'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      x-ms-examples:
        Certificates_CreateOrUpdate:
          $ref: ./examples/Certificates_CreateOrUpdate.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NginxCertificate'
        description: The certificate
    delete:
      tags:
      - NginxCertificate
      summary: Microsoft Azure Deletes A Certificate From The Nginx Deployment
      operationId: microsoftAzureCertificatesDelete
      parameters:
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/DeploymentNameParameter'
      - in: path
        name: certificateName
        description: The name of certificate
        required: true
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Success
        '202':
          description: Success
        '204':
          description: Success
        default:
          description: Default error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceProviderDefaultErrorResponse'
      x-ms-long-running-operation: true
      x-ms-examples:
        Certificates_Delete:
          $ref: ./examples/Certificates_Delete.json
      description: Needs a more full description created.
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Nginx.NginxPlus/nginxDeployments/{deploymentName}/certificates
  : get:
      tags:
      - NginxCertificate
      summary: Microsoft Azure List All Certificates Of Given Nginx Deployment
      operationId: microsoftAzureCertificatesList
      parameters:
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/DeploymentNameParameter'
      - $ref: ../../../../../common-types/resource-management/v1/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NginxCertificateListResponse'
        default:
          description: Default error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceProviderDefaultErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        Certificates_List:
          $ref: ./examples/Certificates_List.json
      description: Needs a more full description created.
components:
  schemas:
    NginxCertificateListResponse:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/NginxCertificate'
        nextLink:
          type: string
    ErrorResponseBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBody'
          x-ms-identifiers: []
    ResourceProviderDefaultErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponseBody'
    ProvisioningState:
      enum:
      - Accepted
      - Creating
      - Updating
      - Deleting
      - Succeeded
      - Failed
      - Canceled
      - Deleted
      - NotSpecified
      type: string
      readOnly: true
      x-ms-enum:
        modelAsString: true
        name: ProvisioningState
    NginxCertificateProperties:
      type: object
      properties:
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
        keyVirtualPath:
          type: string
        certificateVirtualPath:
          type: string
        keyVaultSecretId:
          type: string
    NginxCertificate:
      type: object
      x-ms-azure-resource: true
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
        properties:
          $ref: '#/components/schemas/NginxCertificateProperties'
        tags:
          type: object
          additionalProperties:
            type: string
        location:
          type: string
        systemData:
          $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/systemData
          readOnly: true
  parameters:
    DeploymentNameParameter:
      in: path
      name: deploymentName
      description: The name of targeted Nginx deployment
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
