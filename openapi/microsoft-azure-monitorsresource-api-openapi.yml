          description: List of operations supported by the Microsoft.Elastic provider.
          type: array
          x-ms-identifiers: []
          items:
            $ref: '#/components/schemas/OperationResult_2'
        nextLink:
          description: URL to get the next set of operation list results if there are any.
          type: string
    DatadogMonitorResourceUpdateParameters:
      description: The parameters for a PATCH request to a monitor resource.
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/MonitorUpdateProperties'
        tags:
          description: The new tags of the monitor resource.
          type: object
          additionalProperties:
            type: string
        sku:
          $ref: '#/components/schemas/ResourceSku'
    ElasticMonitorResourceListResponse:
      description: Response of a list operation.
      type: object
      properties:
        value:
          description: Results of a list operation.
          type: array
          x-ms-identifiers: []
          items:
            $ref: '#/components/schemas/ElasticMonitorResource'
        nextLink:
          description: Link to the next set of results, if any.
          type: string
    MonitoringStatus:
      description: Flag specifying if the resource monitoring is enabled or disabled.
      enum:
      - Enabled
      - Disabled
      default: Enabled
      type: string
      x-ms-enum:
        modelAsString: true
        name: MonitoringStatus
    CompanyInfo:
      description: Company information of the user to be passed to partners.
      type: object
      properties:
        domain:
          description: Domain of the company
          maxLength: 250
          type: string
        business:
          description: Business of the company
          maxLength: 64
          type: string
        employeesNumber:
          description: Number of employees in the company
          maxLength: 20
          type: string
        state:
          description: State of the company location.
          maxLength: 64
          type: string
        country:
          description: Country of the company location.
          maxLength: 64
          type: string
    ErrorResponseBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBody'
    ElasticCloudUser:
      description: Details of the user's elastic account.
      type: object
      properties:
        emailAddress:
          description: Email of the Elastic User Account.
          type: string
          readOnly: true
        id:
          description: User Id of the elastic account of the User.
          type: string
          readOnly: true
        elasticCloudSsoDefaultUrl:
          description: Elastic cloud default dashboard sso URL of the Elastic user account.
          type: string
          readOnly: true
    DatadogOrganizationProperties:
      description: Datadog organization properties
      type: object
      properties:
        name:
          description: Name of the Datadog organization.
          type: string
          readOnly: true
        id:
          description: Id of the Datadog organization.
          type: string
          readOnly: true
        linkingAuthCode:
          description: The auth code used to linking to an existing datadog organization.
          type: string
          x-ms-mutability:
          - create
          x-ms-secret: true
        linkingClientId:
          description: The client_id from an existing in exchange for an auth token to link organization.
          type: string
          x-ms-mutability:
          - create
          x-ms-secret: true
        redirectUri:
          description: The redirect uri for linking.
          type: string
          x-ms-mutability:
          - create
        apiKey:
          description: Api key associated to the Datadog organization.
          type: string
          x-ms-mutability:
          - create
          x-ms-secret: true
        applicationKey:
          description: Application key associated to the Datadog organization.
          type: string
          x-ms-mutability:
          - create
          x-ms-secret: true
        enterpriseAppId:
          description: The Id of the Enterprise App used for Single sign on.
          type: string
          x-ms-mutability:
          - create
    ResourceProviderDefaultErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponseBody'
    ErrorResponseBody_2:
      description: Error response body.
      title: ErrorResponseBody
      type: object
      properties:
        code:
          description: Error code.
          type: string
        message:
          description: Error message.
          type: string
        target:
          description: Error target.
          type: string
        details:
          description: Error details.
          type: array
          x-ms-identifiers: []
          items:
            $ref: '#/components/schemas/ErrorResponseBody_2'
    PlanDetails:
      description: Plan details of the monitor resource.
      type: object
      properties:
        offerID:
          description: Offer ID of the plan
          type: string
        publisherID:
          description: Publisher ID of the plan
          type: string
        termID:
          description: Term ID of the plan
          type: string
        planID:
          description: Plan ID
          type: string
        planName:
          description: Plan Name
          type: string
    ManagedIdentityTypes:
      enum:
      - SystemAssigned
      - UserAssigned
      type: string
      description: Identity type
      x-ms-enum:
        modelAsString: true
        name: ManagedIdentityTypes
    OperationResult_2:
      description: A Microsoft.Elastic REST API operation.
      type: object
      properties:
        name:
          description: Operation name, i.e., {provider}/{resource}/{operation}.
          type: string
        isDataAction:
          description: Indicates whether the operation is a data action
          type: boolean
        display:
          description: The object that represents the operation.
          $ref: '#/components/schemas/OperationDisplay_2'
        origin:
          description: Origin of the operation
          type: string
    MarketplaceSubscriptionStatus:
      description: Flag specifying the Marketplace Subscription Status of the resource. If payment is not made in time, the resource will go in Suspended state.
      enum:
      - Provisioning
      - Active
      - Suspended
      - Unsubscribed
      type: string
      x-ms-enum:
        modelAsString: true
        name: MarketplaceSubscriptionStatus
      readOnly: true
    OperationDisplay_2:
      description: The object that represents the operation.
      type: object
      properties:
        provider:
          description: Service provider, i.e., Microsoft.Elastic.
          type: string
        resource:
          description: Type on which the operation is performed, e.g., 'monitors'.
          type: string
        operation:
          description: Operation type, e.g., read, write, delete, etc.
          type: string
        description:
          description: Description of the operation, e.g., 'Write monitors'.
          type: string
    UserInfo_2:
      description: User Information to be passed to partners.
      type: object
      properties:
        firstName:
          description: First name of the user
          maxLength: 50
          type: string
        lastName:
          description: Last name of the user
          maxLength: 50
          type: string
        companyName:
          description: Company name of the user
          maxLength: 64
          type: string
        emailAddress:
          description: Email of the user used by Elastic for contacting them if needed
          pattern: ^([^<>()\[\]\.,;:\s@"]+(\.[^<>()\[\]\.,;:\s@"]+)*)@(([a-zA-Z-_0-9]+\.)+[a-zA-Z]{2,})$
          type: string
        companyInfo:
          description: Company information of the user to be passed to partners.
          $ref: '#/components/schemas/CompanyInfo'
