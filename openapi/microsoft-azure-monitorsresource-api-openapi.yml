      type: object
      properties:
        monitoringStatus:
          $ref: '#/components/schemas/MonitoringStatus'
    DatadogMonitorResourceListResponse:
      description: Response of a list operation.
      type: object
      properties:
        value:
          description: Results of a list operation.
          type: array
          items:
            $ref: '#/components/schemas/DatadogMonitorResource'
        nextLink:
          description: Link to the next set of results, if any.
          type: string
    ResourceProviderDefaultErrorResponse_2:
