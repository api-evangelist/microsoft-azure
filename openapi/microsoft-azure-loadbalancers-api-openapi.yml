          description: Advertise Mode
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
          description: Resource provision state
          readOnly: true
      required:
      - addresses
      - advertiseMode
    AdvertiseMode:
      type: string
      description: Enum of advertise mode
      enum:
      - ARP
      - BGP
      - Both
      x-ms-enum:
        name: AdvertiseMode
        modelAsString: true
        values:
        - name: ARP
          value: ARP
          description: ARP advertise mode
        - name: BGP
          value: BGP
          description: BGP advertise mode
        - name: Both
          value: Both
          description: both ARP and BGP advertise mode
    ProbePropertiesFormat:
      properties:
        loadBalancingRules:
          type: array
          items:
            $ref: '#/components/schemas/SubResource'
          description: Gets Load balancer rules that use this probe
        protocol:
          type: string
          description: Gets or sets the protocol of the end point. Possible values are http pr Tcp. If Tcp is specified, a received ACK is required for the probe to be successful. If http is specified,a 200 OK response from the specifies URI is required for the probe to be successful
          enum:
