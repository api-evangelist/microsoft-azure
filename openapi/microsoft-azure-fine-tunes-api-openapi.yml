openapi: 3.2.0
info:
  title: 'Microsoft Azure Fine Tunes: API'
  version: '1.0'
  description: 'Operations tagged Fine-Tunes: across 3 of this provider''s published API definitions: azure-openai-api-version-2022-03-01-preview-openapi-original.yml, azure-openai-api-version-2022-12-01-openapi-original.yml, azure-openai-api-version-2023-10-01-preview-openapi-original.yml. Each path carries the servers of the definition it was published in.'
security:
- api-key: []
tags:
- name: 'Fine Tunes:'
paths:
  /fine-tunes:
    get:
      tags:
      - 'Fine Tunes:'
      summary: Microsoft Azure Gets A List Of All Fine Tune Jobs Owned By The Azure Openai…
      operationId: microsoftAzureFinetunesList
      parameters:
      - $ref: '#/components/parameters/apiVersionQueryParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTuneList'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Getting all fine tune jobs owned by this account.:
          $ref: ./examples/get_finetunes.json
      description: Needs a more full description created.
    post:
      tags:
      - 'Fine Tunes:'
      summary: Microsoft Azure Creates A Job That Fine Tunes A Specified Model From A Given…
      operationId: microsoftAzureFinetunesCreate
      parameters:
      - $ref: '#/components/parameters/apiVersionQueryParameter'
      responses:
        '201':
          description: The fine tune has been successfully created.
          headers:
            Location:
              description: The location of the newly created item.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTune'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Creating a fine tune job.:
          $ref: ./examples/post_finetune.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FineTuneCreation'
        description: 'The specification of the fine-tuned model to create.

          Required parameters are the base model and the training file to use.

          Optionally a validation file can be specified to compute validation metrics during training.

          Hyper parameters will be set to default values or can by optionally specified.

          These include batch size, learning rate multiplier, number of epochs and others.'
  /fine-tunes/{fine_tune_id}:
    get:
      tags:
      - 'Fine Tunes:'
      summary: Microsoft Azure Gets Details For A Single Fine Tune Job Specified By The Given…
      operationId: microsoftAzureFinetunesGet
      parameters:
      - in: path
        name: fine_tune_id
        description: The identifier of the fine-tune job.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/apiVersionQueryParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTune'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Getting a fine tune job.:
          $ref: ./examples/get_finetune.json
      description: Needs a more full description created.
    delete:
      tags:
      - 'Fine Tunes:'
      summary: Microsoft Azure Deletes The Fine Tune Job Specified By The Given Fine Tune Id
      operationId: microsoftAzureFinetunesDelete
      parameters:
      - in: path
        name: fine_tune_id
        description: The identifier of the fine-tune job.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/apiVersionQueryParameter'
      responses:
        '204':
          description: The fine tune was successfully deleted.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Deleting a fine tune job.:
          $ref: ./examples/delete_finetune.json
      description: Needs a more full description created.
  /fine-tunes/{fine_tune_id}/events:
    get:
      tags:
      - 'Fine Tunes:'
      summary: Microsoft Azure Gets The Events For The Fine Tune Job Specified By The Given…
      operationId: microsoftAzureFinetunesGetevents
      parameters:
      - in: path
        name: fine_tune_id
        description: The identifier of the fine-tune job.
        required: true
        schema:
          type: string
      - in: query
        name: stream
        description: "A flag indicating whether to stream events for the fine-tune job. If set to true,\n            events will be sent as data-only server-sent events as they become available. The stream will terminate with\n            a data: [DONE] message when the job is finished (succeeded, cancelled, or failed).\n            If set to false, only events generated so far will be returned.."
        schema:
          type: boolean
      - $ref: '#/components/parameters/apiVersionQueryParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventList'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Getting events of a fine tune job.:
          $ref: ./examples/get_finetune_events.json
      description: Needs a more full description created.
