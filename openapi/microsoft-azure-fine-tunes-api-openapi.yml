components:
  schemas:
    FineTuneCreation:
      title: FineTuneCreation
      description: Defines the values of a fine tune job.
      required:
      - model
      - training_file
      type: object
      properties:
        model:
          description: The identifier of the base model used for this fine-tune.
          minLength: 1
          type: string
        training_file:
          description: The file that is used for training this fine tuned model.
          minLength: 1
          type: string
        validation_file:
          description: The file that is used to evaluate the fine tuned model during training.
          type: string
        hyperparams:
          $ref: '#/components/schemas/HyperParameters'
    File_2:
      title: File
      description: A file is a document usable for training and validation. It can also be a service generated document with result details.
      required:
      - filename
      - purpose
      type: object
      properties:
        object:
          $ref: '#/components/schemas/TypeDiscriminator'
        status:
          $ref: '#/components/schemas/State_2'
        created_at:
          format: unixtime
          description: A timestamp when this job or item was created (in unix epochs).
          type: integer
          readOnly: true
        updated_at:
          format: unixtime
          description: A timestamp when this job or item was modified last (in unix epochs).
          type: integer
          readOnly: true
        id:
          description: The identity of this item.
          type: string
          readOnly: true
        bytes:
          format: int64
          description: 'The size of this file when available (can be null). File sizes larger than 2^53-1 are not supported to ensure compatibility

            with JavaScript integers.'
          type: integer
          readOnly: true
        purpose:
          $ref: '#/components/schemas/Purpose'
        filename:
          description: The name of the file.
          minLength: 1
          type: string
        statistics:
          $ref: '#/components/schemas/FileStatistics'
        error:
          $ref: '#/components/schemas/Error'
    Error:
      title: Error
      description: 'Error content as defined in the Microsoft REST guidelines

        (https://github.com/microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses).'
      required:
      - code
      - message
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: The message of this error.
          minLength: 1
          type: string
        target:
          description: The location where the error happened if available.
          type: string
        details:
          description: The error details if available.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        innererror:
          $ref: '#/components/schemas/InnerError'
    HyperParameters:
      title: HyperParameters
      description: The hyper parameter settings used in a fine tune job.
      type: object
      properties:
        batch_size:
          format: int32
          description: 'The batch size to use for training. The batch size is the number of training examples used to train a single forward and backward pass.

            In general, we''ve found that larger batch sizes tend to work better for larger datasets.

            The default value as well as the maximum value for this property are specific to a base model.'
          type: integer
        learning_rate_multiplier:
          format: double
          description: 'The learning rate multiplier to use for training. The fine-tuning learning rate is the original learning rate used for pre-training multiplied by this value.

            Larger learning rates tend to perform better with larger batch sizes.

            We recommend experimenting with values in the range 0.02 to 0.2 to see what produces the best results.'
          type: number
        n_epochs:
          format: int32
          description: The number of epochs to train the model for. An epoch refers to one full cycle through the training dataset.
          type: integer
        prompt_loss_weight:
          format: double
          description: 'The weight to use for loss on the prompt tokens. This controls how much the model tries to learn to generate the prompt

            (as compared to the completion which always has a weight of 1.0), and can add a stabilizing effect to training when completions are short.

            If prompts are extremely long (relative to completions), it may make sense to reduce this weight so as to avoid over-prioritizing learning the prompt.'
          type: number
    ErrorResponse_2:
      title: ErrorResponse
      description: 'Error response as defined in the Microsoft REST guidelines

        (https://github.com/microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses).'
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
    InnerErrorCode:
      title: InnerErrorCode
      description: 'Inner error codes as defined in the Microsoft REST guidelines

        (https://github.com/microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses).'
      enum:
      - invalidPayload
      type: string
      x-ms-enum:
        name: InnerErrorCode
        modelAsString: true
        values:
        - value: invalidPayload
          description: The request data is invalid for this operation.
    EventList:
      title: EventList
      description: Represents a list of events.
      type: object
      properties:
        object:
          $ref: '#/components/schemas/TypeDiscriminator'
        data:
          description: The list of items.
          type: array
          items:
            $ref: '#/components/schemas/Event'
          readOnly: true
    ErrorCode:
      title: ErrorCode
      description: 'Error codes as defined in the Microsoft REST guidelines

        (https://github.com/microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses).'
      enum:
      - conflict
      - invalidPayload
      - forbidden
      - notFound
      - unexpectedEntityState
      - itemDoesAlreadyExist
      - serviceUnavailable
      - internalFailure
      - quotaExceeded
      type: string
      x-ms-enum:
        name: ErrorCode
        modelAsString: true
        values:
        - value: conflict
          description: The requested operation conflicts with the current resource state.
        - value: invalidPayload
          description: The request data is invalid for this operation.
        - value: forbidden
          description: The operation is forbidden for the current user/api key.
        - value: notFound
          description: The resource is not found.
        - value: unexpectedEntityState
          description: The operation cannot be executed in the current resource's state.
        - value: itemDoesAlreadyExist
          description: The item does already exist.
        - value: serviceUnavailable
          description: The service is currently not available.
        - value: internalFailure
          description: Internal error. Please retry.
        - value: quotaExceeded
          description: Quota exceeded.
    InnerError:
      title: InnerError
      description: 'Inner error as defined in the Microsoft REST guidelines

        (https://github.com/microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses).'
      type: object
      properties:
        code:
          $ref: '#/components/schemas/InnerErrorCode'
        innererror:
          $ref: '#/components/schemas/InnerError'
    LogLevel_2:
      title: LogLevel
      description: The verbosity level of an event.
      enum:
      - info
      - warning
      - error
      type: string
      x-ms-enum:
        name: LogLevel
        modelAsString: true
        values:
        - value: info
          description: This event is for information only.
        - value: warning
          description: This event represents a mitigated issue.
        - value: error
          description: This message represents a non recoverable issue.
    Event_2:
      title: Event
      required:
      - created_at
      - level
      - message
      type: object
      properties:
        object:
          $ref: '#/components/schemas/TypeDiscriminator'
        created_at:
          format: unixtime
          description: A timestamp when this event was created (in unix epochs).
          type: integer
        level:
          $ref: '#/components/schemas/LogLevel_2'
        message:
          description: The message describing the event. This can be a change of state, e.g., enqueued, started, failed or completed, or other events like uploaded results.
          minLength: 1
          type: string
    LogLevel:
      title: LogLevel
      description: The verbosity level of an event.
      enum:
      - info
      - warning
      - error
      type: string
      readOnly: true
      x-ms-enum:
        name: LogLevel
        modelAsString: false
        values:
        - value: info
          description: This event is for information only.
        - value: warning
          description: This event represents a mitigated issue.
        - value: error
          description: This message represents a non recoverable issue.
    State_2:
      title: State
      description: The state of a job or item.
      enum:
      - notRunning
      - running
      - succeeded
      - canceled
      - failed
      - deleted
      type: string
      readOnly: true
      x-ms-enum:
        name: State
        modelAsString: true
        values:
        - value: notRunning
          description: The operation was created and is not queued to be processed in the future.
        - value: running
          description: The operation has started to be processed.
        - value: succeeded
          description: The operation has successfully be processed and is ready for consumption.
        - value: canceled
          description: The operation has been canceled and is incomplete.
        - value: failed
          description: The operation has completed processing with a failure and cannot be further consumed.
        - value: deleted
          description: The entity has been deleted but may still be referenced by other entities predating the deletion.
    Purpose:
      title: Purpose
      description: The intended purpose of the uploaded documents. Use "fine-tune" for fine-tuning. This allows us to validate the format of the uploaded file.
      enum:
      - fine-tune
      - fine-tune-results
      type: string
      x-ms-enum:
        name: Purpose
        modelAsString: true
        values:
        - value: fine-tune
          description: This file contains training data for a fine tune job.
        - value: fine-tune-results
          description: This file contains the results of a fine tune job.
    Event:
      title: Event
      type: object
      properties:
        object:
          $ref: '#/components/schemas/TypeDiscriminator'
        created_at:
          format: int32
          description: A timestamp when this event was created (in unix epochs).
          type: integer
          readOnly: true
        level:
          $ref: '#/components/schemas/LogLevel'
        message:
          description: The message describing the event. This can be a change of state, e.g., enqueued, started, failed or completed, or other events like uploaded results.
          type: string
          readOnly: true
    HyperParameters_3:
      title: HyperParameters
      description: The hyper parameter settings used in a fine tune job.
      type: object
      properties:
        batch_size:
          format: int32
          description: 'The batch size to use for training. The batch size is the number of training examples used to train a single forward and backward pass.

            In general, we''ve found that larger batch sizes tend to work better for larger datasets.

            The default value as well as the maximum value for this property are specific to a base model.'
          type: integer
        learning_rate_multiplier:
          format: double
          description: 'The learning rate multiplier to use for training. The fine-tuning learning rate is the original learning rate used for pre-training multiplied by this value.

            Larger learning rates tend to perform better with larger batch sizes.

            We recommend experimenting with values in the range 0.02 to 0.2 to see what produces the best results.'
          type: number
        n_epochs:
          format: int32
          description: The number of epochs to train the model for. An epoch refers to one full cycle through the training dataset.
          type: integer
        prompt_loss_weight:
          format: double
          description: 'The weight to use for loss on the prompt tokens. This controls how much the model tries to learn to generate the prompt

            (as compared to the completion which always has a weight of 1.0), and can add a stabilizing effect to training when completions are short.

            If prompts are extremely long (relative to completions), it may make sense to reduce this weight so as to avoid over-prioritizing learning the prompt.'
          type: number
        compute_classification_metrics:
          description: 'A value indicating whether to compute classification metrics.

            If set, we calculate classification-specific metrics such as accuracy and F-1 score using the validation set at the end of every epoch.

            These metrics can be viewed in the results file. In order to compute classification metrics, you must provide a validation_file.Additionally,

            you must specify classification_n_classes for multiclass classification or classification_positive_class for binary classification.'
          type: boolean
        classification_n_classes:
          format: int32
          description: 'The number of classes in a classification task.

            This parameter is required for multiclass classification.'
          type: integer
        classification_positive_class:
          description: 'The positive class in binary classification.

            This parameter is needed to generate precision, recall, and F1 metrics when doing binary classification.'
          type: string
        classification_betas:
          description: 'The classification beta values. If this is provided, we calculate F-beta scores at the specified beta values.

            The F-beta score is a generalization of F-1 score. This is only used for binary classification.

            With a beta of 1 (i.e.the F-1 score), precision and recall are given the same weight.

            A larger beta score puts more weight on recall and less on precision. A smaller beta score puts more weight on precision and less on recall.'
          type: array
          items:
            format: double
            type: number
    FineTune:
      title: FineTune
      description: Fine tuning is a job to tailor a model to specific training data.
      required:
      - model
      - training_files
      type: object
      properties:
        object:
          $ref: '#/components/schemas/TypeDiscriminator'
        status:
          $ref: '#/components/schemas/State'
        created_at:
          format: int32
          description: A timestamp when this job or item was created (in unix epochs).
          type: integer
          readOnly: true
        updated_at:
          format: int32
          description: A timestamp when this job or item was modified last (in unix epochs).
          type: integer
          readOnly: true
        id:
          description: The identity of this item.
          type: string
          readOnly: true
        model:
          description: The identifier of the base model used for the fine-tune.
          minLength: 1
          type: string
        fine_tuned_model:
          description: 'The identifier of the resulting fine tuned model. This property is only populated for successfully completed fine-tune runs.

            Use this identifier to create a deployment for inferencing.'
          type: string
          readOnly: true
        training_files:
          description: The files that are used for training the fine tuned model.
          type: array
          items:
            $ref: '#/components/schemas/File'
        validation_files:
          description: The files that are used to evaluate the fine tuned model during training.
          type: array
          items:
            $ref: '#/components/schemas/File'
        result_files:
          description: 'The result files containing training and evaluation metrics in csv format.

            The file is only available for successfully completed fine-tune runs.'
          type: array
          items:
            $ref: '#/components/schemas/File'
          readOnly: true
        events:
          description: The events that show the progress of the fine-tune run including queued, running and completed.
          type: array
          items:
            $ref: '#/components/schemas/Event'
          readOnly: true
        organisation_id:
          description: The organisation id of this fine tune job. Unused on Azure OpenAI; compatibility for OpenAI only.
          type: string
          readOnly: true
        user_id:
          description: The user id of this fine tune job. Unused on Azure OpenAI; compatibility for OpenAI only.
          type: string
          readOnly: true
        hyperparams:
          $ref: '#/components/schemas/HyperParameters'
    State:
      title: State
