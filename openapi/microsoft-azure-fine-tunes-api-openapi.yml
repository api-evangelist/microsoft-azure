      operationId: microsoftAzureFinetunesDelete
      parameters:
      - in: path
        name: fine-tune-id
        description: The identifier of the fine-tune job.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/apiVersionQueryParameter_3'
      responses:
        '204':
          description: The fine tune was successfully deleted.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
      x-ms-examples:
        Deleting a fine tune job.:
          $ref: ./examples/delete_finetune.json
      description: Needs a more full description created.
  /fine-tunes/{fine-tune-id}/events:
    get:
      tags:
      - 'Fine-Tunes:'
      summary: "Microsoft Azure Gets The Events For The Fine Tune Job Specified By The Given Fine Tune Id \nevents Are Created When The Job Status Changes, E G Running Or Complete, And When Results Are Uploaded"
      operationId: microsoftAzureFinetunesGetevents
      parameters:
