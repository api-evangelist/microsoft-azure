components:
  schemas:
    OpenAIIntegrationStatusResponse:
      description: Status of the OpenAI Integration
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/OpenAIIntegrationStatusResponseProperties'
    ErrorResponseBody:
      description: Error response body.
      title: ErrorResponseBody
      type: object
      properties:
        code:
          description: Error code.
          type: string
        message:
          description: Error message.
          type: string
        target:
          description: Error target.
          type: string
        details:
          description: Error details.
          type: array
          x-ms-identifiers: []
          items:
            $ref: '#/components/schemas/ErrorResponseBody'
    ResourceProviderDefaultErrorResponse:
      description: RP default error response.
      type: object
      properties:
        error:
          description: Response body of Error
          readOnly: true
          $ref: '#/components/schemas/ErrorResponseBody'
    OpenAIIntegrationRPModel:
      description: Capture properties of Open AI resource Integration.
      type: object
      x-ms-azure-resource: true
      properties:
        name:
          description: Name of the integration.
          type: string
          readOnly: true
        id:
          description: The id of the integration.
          type: string
          readOnly: true
        type:
          description: The type of the integration.
          type: string
          readOnly: true
        properties:
          $ref: '#/components/schemas/OpenAIIntegrationProperties'
    OpenAIIntegrationRPModelListResponse:
      description: Response of a list operation.
      type: object
      properties:
        value:
          description: Results of a list operation.
          type: array
          items:
            $ref: '#/components/schemas/OpenAIIntegrationRPModel'
        nextLink:
          description: Link to the next set of results, if any.
          type: string
    OpenAIIntegrationStatusResponseProperties:
      description: Status of the OpenAI Integration
      type: object
      properties:
        status:
          description: Status of the OpenAI Integration
          type: string
    OpenAIIntegrationProperties:
      description: Open AI Integration details.
      type: object
      properties:
        openAIResourceId:
          description: The resource id of Open AI resource
          type: string
          format: arm-id
        openAIResourceEndpoint:
          description: The API endpoint for Open AI resource
          type: string
        key:
          description: Value of API key for Open AI resource
          type: string
          x-ms-secret: true
        lastRefreshAt:
          format: date-time
          description: Last Update Timestamp for key updation
          type: string
          readOnly: true
  parameters:
    MonitorNameParameter:
      in: path
      name: monitorName
      description: Monitor resource name
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    OpenAIIntegrationNameParameter:
      in: path
      name: integrationName
      description: OpenAI Integration name
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-z][a-z0-9]*$
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
