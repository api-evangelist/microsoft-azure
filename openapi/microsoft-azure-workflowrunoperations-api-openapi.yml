openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Workflow Run Operations API
tags:
- name: WorkflowRunOperations
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Logic/workflows/{workflowName}/runs/{runName}/operations/{operationId}
  : get:
      tags:
      - WorkflowRunOperations
      operationId: microsoftAzureWorkflowrunoperationsGet
      description: Gets an operation for a run.
      x-ms-examples:
        Get a run operation:
          $ref: ./examples/WorkflowRunOperations_Get.json
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      - name: resourceGroupName
        description: The resource group name.
        in: path
        required: true
        schema:
          type: string
      - name: workflowName
        description: The workflow name.
        in: path
        required: true
        schema:
          type: string
      - name: runName
        description: The workflow run name.
        in: path
        required: true
        schema:
          type: string
      - name: operationId
        description: The workflow operation id.
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Logic Workflows Workflowname Runs Runname Operations Operationid
