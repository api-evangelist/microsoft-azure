openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Rating and Reviews Public API
tags:
- name: Rating and Reviews Public API
paths:
  /products/{uniqueProductId}/reviews:
    get:
      tags:
      - Rating and Reviews Public API
      summary: Microsoft Azure Get A List Of Reviews By Unique Product Id
      operationId: microsoftAzureReviewsGet
      x-ms-examples:
        GetReviews:
          $ref: ./examples/GetProductReviews.json
      parameters:
      - name: uniqueProductId
        in: path
        required: true
        description: Unique Product Id
        schema:
          type: string
      - name: maxpagesize
        in: query
        description: Maximum number of reviews to return
        schema:
          type: integer
          format: int32
          default: 50
      - name: api-version
        in: query
        required: true
        description: Version of the REST API used for the request.
        schema:
          type: string
      - name: X-API-Key
        in: header
        required: true
        description: Api Key parameter from header
        schema:
          type: string
      responses:
        '200':
          description: Returns a list of reviews for the given unique product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResultOfReviewDto'
        default:
          description: "*** Error Responses: ***\n\n * 400 - In case request malformed.\n\n * 500 - In case internal error."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Needs a more full description created.
components:
  schemas:
    ErrorResponse:
      description: The Rating and Reviews error response object
      type: object
      required:
      - error
      properties:
        error:
          description: The search error response details
          $ref: '#/components/schemas/ErrorResponseDetails'
    PageResultOfReviewDto:
      type: object
      required:
      - count
      properties:
        value:
          type: array
          description: List of items in the current page
          items:
            $ref: '#/components/schemas/ReviewDto'
        count:
          type: integer
          description: Total count of items
          format: int32
        nextLink:
          type: string
          description: Url to get the next page of items
          format: uri
    IsvReplyDto:
      type: object
      required:
      - repliedDateTime
      properties:
        content:
          type: string
          description: ISV Reply Content
        repliedDateTime:
          type: string
          description: Reply Date
          format: date-time
    ReviewDto:
      type: object
      required:
      - rating
      - createdDateTime
      - lastModifiedDateTime
      - commentsCount
      - helpfulCount
      properties:
        id:
          type: string
          description: Review Id
        uniqueProductId:
          type: string
          description: Unique Product Id
        rating:
          type: number
          description: Review Rating
        title:
          type: string
          description: Review Title
        content:
          type: string
          description: Review Content
        source:
          type: string
          description: 'Review Source (possible values: AppSource, Ibiza, G2, ect.)'
          x-ms-enum:
            name: source
            modelAsString: true
            values:
            - value: AppSource
              description: AppSource
            - value: Amp
              description: Azure MarketPlace
            - value: Ibiza
              description: Azure Portal
        reviewerName:
          type: string
          description: Reviewer Full Name. Empty if it is an anonymous review
        externalReviewUrl:
          type: string
          description: External Review Url (only for external review, i.e. G2 review)
        isvReply:
          description: ISV Reply for this review
          allOf:
          - $ref: '#/components/schemas/IsvReplyDto'
        createdDateTime:
          type: string
          description: Created Date
          format: date-time
        lastModifiedDateTime:
          type: string
          description: Last Updated Date
          format: date-time
        commentsCount:
          type: integer
          description: Number of comments for this review
          format: int32
        helpfulCount:
          type: integer
          description: Number of marked as helpful for this review
          format: int32
    ErrorResponseDetails:
      description: The Rating and Reviews error response details object
      type: object
      required:
      - code
      - message
      properties:
        code:
          description: The error code description. Such as code=InternalError
          type: string
        message:
          description: The error message. Such as message=Internal server error
          type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
