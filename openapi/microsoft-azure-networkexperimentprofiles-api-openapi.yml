openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Network Experiment Profiles API
  description: The configuration of Network Experiment profiles
tags:
- name: NetworkExperimentProfiles
  description: The configuration of Network Experiment profiles
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Network/NetworkExperimentProfiles:
    get:
      tags:
      - NetworkExperimentProfiles
      summary: Microsoft Azure Gets A List Of Network Experiment Profiles Under A Subscription
      operationId: microsoftAzureNetworkexperimentprofilesList
      parameters:
      - $ref: ./network.json#/parameters/SubscriptionIdParameter
      - $ref: ./network.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        List NetworkExperiment Profiles in a Resource Group:
          $ref: ./examples/NetworkExperimentListProfiles.json
      description: Needs a more full description created.
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/NetworkExperimentProfiles:
    get:
      tags:
      - NetworkExperimentProfiles
      summary: Microsoft Azure Gets A List Of Network Experiment Profiles Within A Resource Group Under A Subscription
      operationId: microsoftAzureNetworkexperimentprofilesListbyresourcegroup
      parameters:
      - $ref: ./network.json#/parameters/SubscriptionIdParameter
      - $ref: ./network.json#/parameters/ApiVersionParameter
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        List NetworkExperiment Profiles in a Resource Group:
          $ref: ./examples/NetworkExperimentListProfiles.json
      description: Needs a more full description created.
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/NetworkExperimentProfiles/{profileName}
  : get:
      tags:
      - NetworkExperimentProfiles
      summary: Microsoft Azure Gets An Networkexperiment Profile By Profilename
      operationId: microsoftAzureNetworkexperimentprofilesGet
      parameters:
      - $ref: ./network.json#/parameters/SubscriptionIdParameter
      - $ref: ./network.json#/parameters/ApiVersionParameter
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ProfileNameParameter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Gets an NetworkExperiment Profile by Profile Id:
          $ref: ./examples/NetworkExperimentGetProfile.json
      description: Needs a more full description created.
    put:
      tags:
      - NetworkExperimentProfiles
      summary: Microsoft Azure Creates An Networkexperiment Profile
      operationId: microsoftAzureNetworkexperimentprofilesCreateorupdate
      parameters:
      - $ref: '#/components/parameters/ProfileNameParameter'
      - $ref: ./network.json#/parameters/SubscriptionIdParameter
      - $ref: ./network.json#/parameters/ApiVersionParameter
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '201':
          description: Created. The request has been fulfilled and a new protection policy has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '202':
          description: Accepted. The request has been accepted for processing and the operation will complete asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
      x-ms-examples:
        Creates an NetworkExperiment Profile in a Resource Group:
          $ref: ./examples/NetworkExperimentCreateProfile.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
        description: An Network Experiment Profile
        required: true
    patch:
      tags:
      - NetworkExperimentProfiles
      description: Updates an NetworkExperimentProfiles
      summary: Microsoft Azure Updates An Networkexperimentprofiles By Networkexperimentprofile Name
      operationId: microsoftAzureNetworkexperimentprofilesUpdate
      parameters:
      - $ref: ./network.json#/parameters/SubscriptionIdParameter
      - $ref: ./network.json#/parameters/ApiVersionParameter
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ProfileNameParameter'
      responses:
        '200':
          description: OK. successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '202':
          description: Accepted. The request has been accepted for processing and the operation will complete asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
      x-ms-examples:
        Updates an Experiment:
          $ref: ./examples/NetworkExperimentUpdateProfile.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateModel'
        description: The Profile Update Model
        required: true
    delete:
      tags:
      - NetworkExperimentProfiles
      summary: Microsoft Azure Deletes An Networkexperiment Profile By Profilename
      operationId: microsoftAzureNetworkexperimentprofilesDelete
      parameters:
      - $ref: ./network.json#/parameters/SubscriptionIdParameter
      - $ref: ./network.json#/parameters/ApiVersionParameter
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ProfileNameParameter'
      responses:
        '200':
          description: Delete successful.
        '202':
          description: Accepted. The request has been accepted for processing and the operation will complete asynchronously.
        '204':
          description: No Content. The request has been accepted but the profile was not found.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Deletes an NetworkExperiment Profile by ProfileName:
          $ref: ./examples/NetworkExperimentDeleteProfile.json
      x-ms-long-running-operation: true
      description: Needs a more full description created.
components:
  schemas:
    ProfileProperties:
      description: Defines the properties of an experiment
      type: object
      properties:
        resourceState:
          description: Resource status.
          $ref: '#/components/schemas/NetworkExperimentResourceState'
        enabledState:
          type: string
          description: The state of the Experiment
          enum:
          - Enabled
          - Disabled
          x-ms-enum:
            name: state
            modelAsString: true
    ErrorResponse:
      description: Error response indicates Front Door service is not able to process the incoming request. The reason is provided in the error message.
      type: object
      properties:
        code:
          description: Error code.
          readOnly: true
          type: string
        message:
          description: Error message indicating why the operation failed.
          readOnly: true
          type: string
    Profile:
      description: Defines an Network Experiment Profile and lists of Experiments
      properties:
        name:
          description: The name of the Profile
          type: string
        properties:
          description: The properties of a Profile
          $ref: '#/components/schemas/ProfileProperties'
          x-ms-client-flatten: true
        etag:
          type: string
          description: Gets a unique read-only string that changes whenever the resource is updated.
      allOf:
      - $ref: ./network.json#/definitions/Resource
    NetworkExperimentResourceState:
      description: Defines the server side resource status
      readOnly: true
      enum:
      - Creating
      - Enabling
      - Enabled
      - Disabling
      - Disabled
      - Deleting
      type: string
      x-ms-enum:
        name: NetworkExperimentResourceState
        modelAsString: true
    ProfileUpdateProperties:
      description: Defines the properties of an experiment
      type: object
      properties:
        enabledState:
          type: string
          description: The enabled state of the Profile
          enum:
          - Enabled
          - Disabled
          x-ms-enum:
            name: state
            modelAsString: true
    ProfileList:
      description: Defines a list of Profiles. It contains a list of Profile objects and a URL link to get the next set of results.
      properties:
        value:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Profile'
          description: List of Profiles within a resource group.
        nextLink:
          type: string
          description: URL to get the next set of Profile objects if there are any.
    ProfileUpdateModel:
      description: Defines modifiable attributes of a Profile
      type: object
      properties:
        properties:
          description: The properties of a Profile
          $ref: '#/components/schemas/ProfileUpdateProperties'
          x-ms-client-flatten: true
        tags:
          type: object
          additionalProperties:
            type: string
          description: Resource tags.
  parameters:
    ProfileNameParameter:
      name: profileName
      in: path
      required: true
      x-ms-parameter-location: method
      description: The Profile identifier associated with the Tenant and Partner
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_\-\(\)\.]*[^\.]$
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      x-ms-parameter-location: method
      description: Name of the Resource group within the Azure subscription.
      schema:
        type: string
        maxLength: 80
        minLength: 1
        pattern: ^[a-zA-Z0-9_\-\(\)\.]*[^\.]$
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
