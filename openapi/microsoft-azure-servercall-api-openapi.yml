openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Server Call API
tags:
- name: ServerCall
paths:
  /calling/serverCalls/{serverCallId}/participants:
    post:
      tags:
      - ServerCall
      summary: Microsoft Azure Add A Participant To The Call
      description: Add a participant to the call.
      operationId: microsoftAzureServercallsAddparticipant
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '202':
          description: Returns the add participant response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddParticipantResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-ms-examples:
        Add a participant to the call.:
          $ref: ./examples/ServerCalls_AddParticipant.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantRequest'
        description: The add participant request.
        required: true
  /calling/serverCalls/{serverCallId}/participants/{participantId}:
    delete:
      tags:
      - ServerCall
      summary: Microsoft Azure Remove Participant From The Call
      description: Remove participant from the call.
      operationId: microsoftAzureServercallsRemoveparticipant
      parameters:
      - name: serverCallId
        in: path
        description: Server call id.
        required: true
        schema:
          type: string
      - name: participantId
        in: path
        description: Participant id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '202':
          description: Returns the remove participant response.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-ms-examples:
        Remove participant from the call.:
          $ref: ./examples/ServerCalls_RemoveParticipant.json
  /calling/serverCalls/{serverCallId}/:join:
    post:
      tags:
      - ServerCall
      summary: Microsoft Azure Join A Call
      description: Join a call.
      operationId: microsoftAzureServercallsJoincall
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '202':
          description: Returns the join call response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinCallResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
      x-ms-examples:
        Join a call.:
          $ref: ./examples/ServerCalls_JoinCall.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinCallRequest'
        description: The join call request.
        required: true
  /calling/serverCalls/{serverCallId}/:playAudio:
    post:
      tags:
      - ServerCall
      summary: Microsoft Azure Play Audio In The Call
      description: Play audio in the call.
      operationId: microsoftAzureServercallsPlayaudio
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '202':
          description: Returns the play audio response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayAudioResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-ms-examples:
        Play audio in the call.:
          $ref: ./examples/ServerCalls_PlayAudio.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayAudioRequest'
        description: Play audio request.
        required: true
components:
  schemas:
    JoinCallRequest:
      description: The request payload for join call.
      required:
      - source
      - callbackUri
      type: object
      properties:
        source:
          $ref: '#/components/schemas/CommunicationIdentifier'
          description: The source of the call.
        subject:
          description: The subject.
          type: string
        callbackUri:
          description: The callback URI.
          type: string
        requestedMediaTypes:
          description: The requested modalities.
          type: array
          items:
            $ref: '#/components/schemas/MediaType'
        requestedCallEvents:
          description: The requested call events to subscribe to.
          type: array
          items:
            $ref: '#/components/schemas/EventSubscriptionType'
    PlayAudioRequest:
      description: The request payload for playing audio.
      type: object
      properties:
        audioFileUri:
          description: "The media resource uri of the play audio request. \nCurrently only Wave file (.wav) format audio prompts are supported.\nMore specifically, the audio content in the wave file must be mono (single-channel),\n16-bit samples with a 16,000 (16KHz) sampling rate."
          type: string
        loop:
          description: The flag indicating whether audio file needs to be played in loop or not.
          type: boolean
        operationContext:
          description: The value to identify context of the operation.
          type: string
        audioFileId:
          description: An id for the media in the AudioFileUri, using which we cache the media resource.
          type: string
        callbackUri:
          description: The callback Uri to receive PlayAudio status notifications.
          type: string
    AddParticipantResult:
      description: The add participant result
      type: object
      properties:
        participantId:
          description: The id of the added participant.
          type: string
    AddParticipantRequest:
      description: The add participant request.
      type: object
      properties:
        alternateCallerId:
          $ref: '#/components/schemas/PhoneNumberIdentifier'
          description: The alternate identity of source participant.
        participant:
          $ref: '#/components/schemas/CommunicationIdentifier'
          description: The participant to be added to the call.
        operationContext:
          description: The operation context.
          type: string
        callbackUri:
          description: The callback URI.
          type: string
    JoinCallResult:
      description: The response payload of the join call operation.
      type: object
      properties:
        callConnectionId:
          description: The call connection id.
          type: string
    PhoneNumberIdentifier:
      $ref: ../../../Common/stable/2021-03-07/common.json#/definitions/PhoneNumberIdentifierModel
    EventSubscriptionType:
      enum:
      - participantsUpdated
      - dtmfReceived
      type: string
      x-ms-enum:
        name: EventSubscriptionType
        modelAsString: true
    OperationStatus:
      description: The status of the operation
      enum:
      - notStarted
      - running
      - completed
      - failed
      type: string
      x-ms-enum:
        name: OperationStatus
        modelAsString: true
    ResultInfo:
      description: Result info class to be used to report result status for actions/operations.
      required:
      - code
      - subcode
      type: object
      properties:
        code:
          format: int32
          description: The result code associated with the operation.
          type: integer
        subcode:
          format: int32
          description: The subcode that further classifies the result.
          type: integer
        message:
          description: The message is a detail explanation of subcode.
          type: string
    CommunicationIdentifier:
      $ref: ../../../Common/stable/2021-03-07/common.json#/definitions/CommunicationIdentifierModel
    MediaType:
      enum:
      - audio
      - video
      type: string
      x-ms-enum:
        name: MediaType
        modelAsString: true
    CommunicationErrorResponse:
      $ref: ../../../Common/stable/2021-03-07/common.json#/definitions/CommunicationErrorResponse
    PlayAudioResult:
      description: The response payload for play audio operation.
      required:
      - status
      type: object
      properties:
        operationId:
          description: The operation id.
          type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
        operationContext:
          description: The operation context provided by client.
          type: string
        resultInfo:
          $ref: '#/components/schemas/ResultInfo'
          description: The result info for the operation.
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      description: Version of API to invoke.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
  responses:
    '404':
      description: NotFound
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '400':
      description: BadRequest
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '403':
      description: Forbidden
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '401':
      description: Unauthorized
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '500':
      description: InternalServerError
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
