openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Filters API
tags:
- name: Filters
paths:
  /datasources/{dataSourceName}/scans/{scanName}/filters/custom:
    get:
      tags:
      - Filters
      description: Get a filter
      operationId: microsoftAzureFiltersGet
      parameters:
      - in: path
        name: dataSourceName
        required: true
        schema:
          type: string
      - in: path
        name: scanName
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        default:
          description: An error response received from the Scanning Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-ms-examples:
        Filters_Get:
          $ref: ./examples/Filters_Get.json
      summary: Microsoft Azure Get Datasources Datasourcename Scans Scanname Filters Custom
    put:
      tags:
      - Filters
      description: Creates or updates a filter
      operationId: microsoftAzureFiltersCreateorupdate
      parameters:
      - in: path
        name: dataSourceName
        required: true
        schema:
          type: string
      - in: path
        name: scanName
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        default:
          description: An error response received from the Scanning Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-ms-examples:
        Filters_CreateOrUpdate:
          $ref: ./examples/Filters_CreateOrUpdate.json
      summary: Microsoft Azure Put Datasources Datasourcename Scans Scanname Filters Custom
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filter'
components:
  schemas:
    ErrorResponseModel:
      type: object
      properties:
        error:
          allOf:
          - $ref: '#/components/schemas/ErrorModel'
    FilterProperties:
      required:
      - excludeUriPrefixes
      - includeUriPrefixes
      type: object
      properties:
        excludeUriPrefixes:
          uniqueItems: true
          type: array
          items:
            type: string
        includeUriPrefixes:
          uniqueItems: true
          type: array
          items:
            type: string
        excludeRegexes:
          uniqueItems: true
          type: array
          items:
            type: string
        includeRegexes:
          uniqueItems: true
          type: array
          items:
            type: string
    Filter:
      type: object
      allOf:
      - $ref: '#/components/schemas/ProxyResource'
      properties:
        properties:
          allOf:
          - $ref: '#/components/schemas/FilterProperties'
    ErrorModel:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorModel'
    ProxyResource:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
  parameters:
    api-version:
      in: query
      name: api-version
      description: The api version to use.
      required: true
      x-ms-client-name: ApiVersion
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
