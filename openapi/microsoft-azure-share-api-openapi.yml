openapi: 3.2.0
info:
  version: 2018-11-01-preview
  title: Microsoft Azure DataShareManagementClient Share API
  description: Creates a Microsoft.DataShare management client.
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
tags:
- name: Share
paths:
