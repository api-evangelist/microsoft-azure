info:
  title: Microsoft Azure Microsoft.Logz Sub Account API
  version: 2020-10-01-preview
servers:
- url: https://management.azure.com
tags:
- name: Sub Account
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Logz/monitors/{monitorName}/accounts
  : get:
      tags:
      - Sub Account
      summary: Microsoft Azure List The Sub Account Under A Given Monitor Resource
      operationId: microsoftAzureSubaccountList
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
