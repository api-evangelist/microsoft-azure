        failed:
          type: integer
          format: int32
          title: The number of Tasks which failed. A Task fails if its result (found in the executionInfo property) is 'failure'.
      required:
      - active
      - running
      - completed
      - succeeded
      - failed
      title: The Task counts for a Job.
    JobSchedulingError:
      properties:
