openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Trusted ID Providers API
tags:
- name: TrustedIdProviders
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataLakeStore/accounts/{accountName}/trustedIdProviders
  : get:
      tags:
      - TrustedIdProviders
      operationId: microsoftAzureTrustedidprovidersListbyaccount
      description: Lists the Data Lake Store trusted identity providers within the specified Data Lake Store account.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/AccountNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Successfully retrieved the list of trusted identity providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedIdProviderListResult'
      x-ms-examples:
        Lists the Data Lake Store trusted identity providers within the specified Data Lake Store account:
          $ref: ./examples/TrustedIdProviders_ListByAccount.json
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Datalakestore Accounts Accountname Trustedidproviders
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataLakeStore/accounts/{accountName}/trustedIdProviders/{trustedIdProviderName}
  : put:
      tags:
      - TrustedIdProviders
      operationId: microsoftAzureTrustedidprovidersCreateorupdate
      description: Creates or updates the specified trusted identity provider. During update, the trusted identity provider with the specified name will be replaced with this new provider
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/AccountNameParameter'
      - name: trustedIdProviderName
        in: path
        required: true
        description: The name of the trusted identity provider. This is used for differentiation of providers in the account.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Successfully added the trusted identity provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedIdProvider'
      x-ms-examples:
        ? Creates or updates the specified trusted identity provider. During update, the trusted identity provider with the specified name will be replaced with this new provider
        : $ref: ./examples/TrustedIdProviders_CreateOrUpdate.json
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Datalakestore Accounts Accountname Trustedidproviders Trustedidprovidername
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateTrustedIdProviderParameters'
        description: Parameters supplied to create or replace the trusted identity provider.
        required: true
    get:
      tags:
      - TrustedIdProviders
      operationId: microsoftAzureTrustedidprovidersGet
      description: Gets the specified Data Lake Store trusted identity provider.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/AccountNameParameter'
      - name: trustedIdProviderName
        in: path
        required: true
        description: The name of the trusted identity provider to retrieve.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Successfully retrieved details of the specified trusted identity provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedIdProvider'
      x-ms-examples:
        Gets the specified Data Lake Store trusted identity provider:
          $ref: ./examples/TrustedIdProviders_Get.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Datalakestore Accounts Accountname Trustedidproviders Trustedidprovidername
    patch:
      tags:
      - TrustedIdProviders
      operationId: microsoftAzureTrustedidprovidersUpdate
      description: Updates the specified trusted identity provider.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/AccountNameParameter'
      - name: trustedIdProviderName
        in: path
        required: true
        description: The name of the trusted identity provider. This is used for differentiation of providers in the account.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Successfully added the trusted identity provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedIdProvider'
      x-ms-examples:
        Updates the specified trusted identity provider:
          $ref: ./examples/TrustedIdProviders_Update.json
      summary: Microsoft Azure Patch Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Datalakestore Accounts Accountname Trustedidproviders Trustedidprovidername
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrustedIdProviderParameters'
        description: Parameters supplied to update the trusted identity provider.
    delete:
      tags:
      - TrustedIdProviders
      operationId: microsoftAzureTrustedidprovidersDelete
      description: Deletes the specified trusted identity provider from the specified Data Lake Store account
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/AccountNameParameter'
      - name: trustedIdProviderName
        in: path
        required: true
        description: The name of the trusted identity provider to delete.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Successfully deleted the specified trusted identity provider details.
        '204':
          description: The specified trusted identity provider was not found.
      x-ms-examples:
        Deletes the specified trusted identity provider from the specified Data Lake Store account:
          $ref: ./examples/TrustedIdProviders_Delete.json
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Datalakestore Accounts Accountname Trustedidproviders Trustedidprovidername
