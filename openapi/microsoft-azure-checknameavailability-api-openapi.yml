            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v4/types.json#/definitions/CheckNameAvailabilityResponse
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v4/types.json#/definitions/ErrorResponse
