components:
  schemas:
    CheckNameRequest:
      type: object
      properties:
        name:
          type: string
          description: Resource name.
        type:
          type: string
          enum:
          - Microsoft.DigitalTwins/digitalTwinsInstances
          x-ms-enum:
            name: Type
            modelAsString: false
          description: The type of resource, for instance Microsoft.DigitalTwins/digitalTwinsInstances.
      required:
      - name
      - type
      description: The result returned from a database check name availability request.
    NameAvailabilityRequest_2:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Resource name to verify.
        type:
          type: string
          description: Resource type used for verification.
      description: Request from client to check resource name availability.
    CheckNameResult:
      type: object
      properties:
        nameAvailable:
          type: boolean
          description: Specifies a Boolean value that indicates if the name is available.
        name:
          type: string
          description: The name that was checked.
        message:
          type: string
          description: Message indicating an unavailable name due to a conflict, or a description of the naming rules that are violated.
        reason:
          type: string
          enum:
          - Invalid
          - AlreadyExists
          x-ms-enum:
            name: reason
            modelAsString: true
          description: Message providing the reason why the given name is invalid.
      description: The result returned from a check name availability request.
    ErrorResponse_2:
      title: Error response
      description: Error response indicates Azure Front Door Standard or Azure Front Door Premium or CDN service is not able to process the incoming request. The reason is provided in the error message.
      type: object
      properties:
        error:
          $ref: ../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorDetail
    NameAvailability_2:
      type: object
      properties:
        message:
          type: string
          description: Error Message.
        nameAvailable:
          type: boolean
          description: Indicates whether the resource name is available.
        reason:
          type: string
          description: Reason for name being unavailable.
      description: Represents a resource name availability.
    CheckNameAvailabilityResponse:
      description: Response for whether the requested resource name is available or not.
      type: object
      properties:
        nameAvailable:
          description: Returns true or false depending on the availability of the name
          type: boolean
        reason:
          description: Reason for why value is not available. This field is returned if nameAvailable is false.
          type: string
        message:
          description: Gets an error message explaining the 'reason' value with more details. This field is returned iif nameAvailable is false.
          type: string
    ResourceType:
      description: Type of CDN resource used in CheckNameAvailability.
      enum:
      - Microsoft.Cdn/Profiles/Endpoints
      - Microsoft.Cdn/Profiles/AfdEndpoints
      type: string
      x-ms-enum:
        name: ResourceType
        modelAsString: true
    ErrorDetails:
      description: The details of the error.
      properties:
        code:
          description: One of a server-defined set of error codes.
          type: string
        message:
          description: A human-readable representation of the error.
          type: string
        details:
          description: A human-readable representation of the error's details.
          type: string
    ErrorResponse_3:
      description: The error object.
      properties:
        error:
          title: Error
          $ref: '#/components/schemas/ErrorDetails'
    CheckNameAvailabilityResult:
      description: Describes the result of the request to check management group name availability.
      properties:
        nameAvailable:
          description: Required. True indicates name is valid and available. False indicates the name is invalid, unavailable, or both.
          type: boolean
          readOnly: true
        reason:
          description: Required if nameAvailable == false. Invalid indicates the name provided does not match the resource provider's naming requirements (incorrect length, unsupported characters, etc.) AlreadyExists indicates that the name is already in use and is therefore unavailable.
          type: string
          enum:
          - Invalid
          - AlreadyExists
          x-ms-enum:
            name: Reason
            modelAsString: false
            values:
            - value: Invalid
            - value: AlreadyExists
          readOnly: true
        message:
          description: Required if nameAvailable == false. Localized. If reason == invalid, provide the user with the reason why the given name is invalid, and provide the resource naming requirements so that the user can select a valid name. If reason == AlreadyExists, explain that is already in use, and direct them to select a different name.
          type: string
          readOnly: true
    NameAvailabilityRequest:
      required:
      - name
      properties:
        name:
          type: string
          description: Resource name to verify.
        type:
          type: string
          description: Resource type used for verification.
      description: Request from client to check resource name availability.
    NameAvailability:
      properties:
        message:
          type: string
          description: Error Message.
        nameAvailable:
          type: boolean
          description: Indicates whether the resource name is available.
        reason:
          type: string
          description: Reason for name being unavailable.
      description: Represents a resource name availability.
    CheckNameAvailabilityInput:
      description: Input of CheckNameAvailability API.
      type: object
      required:
      - name
      - type
      properties:
        name:
          description: The resource name to validate.
          type: string
        type:
          description: The type of the resource whose name is to be validated.
          $ref: '#/components/schemas/ResourceType'
    ErrorDefinition:
      description: Error definition.
      properties:
        code:
          description: Service specific error code which serves as the substatus for the HTTP error code.
          type: string
          readOnly: true
        message:
          description: Description of the error.
          type: string
          readOnly: true
        details:
          description: Internal error details.
          type: array
          items:
            $ref: '#/components/schemas/ErrorDefinition'
          readOnly: true
    ErrorResponse:
      description: Error response.
      properties:
        error:
          description: Error description
          $ref: '#/components/schemas/ErrorDefinition'
    CheckNameAvailabilityOutput:
      description: Output of check name availability API.
      type: object
      properties:
        nameAvailable:
          description: Indicates whether the name is available.
          readOnly: true
          type: boolean
        reason:
          description: The reason why the name is not available.
          readOnly: true
          type: string
        message:
          description: The detailed error message describing why the name is not available.
          readOnly: true
          type: string
    CheckNameAvailabilityRequest:
      description: Management group name availability check parameters.
      type: object
      properties:
        name:
          type: string
          description: the name to check for availability
        type:
          type: string
          enum:
          - /providers/Microsoft.Management/managementGroups
          x-ms-enum:
            name: Type
            modelAsString: false
            values:
            - value: /providers/Microsoft.Management/managementGroups
          description: fully qualified resource type which includes provider namespace
