openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Shared Gallery Image Versions API
tags:
- name: SharedGalleryImageVersions
paths:
  ? /subscriptions/{subscriptionId}/providers/Microsoft.Compute/locations/{location}/sharedGalleries/{galleryUniqueName}/images/{galleryImageName}/versions
  : get:
      tags:
      - SharedGalleryImageVersions
      operationId: microsoftAzureSharedgalleryimageversionsList
      description: List shared gallery image versions by subscription id or tenant id.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/LocationNameParamter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - name: galleryUniqueName
        in: path
        required: true
        description: The unique name of the Shared Gallery.
        schema:
          type: string
      - name: galleryImageName
        in: path
        required: true
        description: The name of the Shared Gallery Image Definition from which the Image Versions are to be listed.
        schema:
          type: string
      - name: sharedTo
        in: query
        required: false
        description: The query parameter to decide what shared galleries to fetch when doing listing operations.
        x-ms-enum:
          name: SharedToValues
          modelAsString: true
        schema:
          type: string
          enum:
          - tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedGalleryImageVersionList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        Get a gallery.:
          $ref: ./examples/ListSharedGalleryImageVersions.json
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Subscriptions Subscriptionid Providers Microsoft Compute Locations Location Sharedgalleries Galleryuniquename Images Galleryimagename Versions
  ? /subscriptions/{subscriptionId}/providers/Microsoft.Compute/locations/{location}/sharedGalleries/{galleryUniqueName}/images/{galleryImageName}/versions/{galleryImageVersionName}
  : get:
      tags:
      - SharedGalleryImageVersions
      operationId: microsoftAzureSharedgalleryimageversionsGet
      description: Get a shared gallery image version by subscription id or tenant id.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/LocationNameParamter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - name: galleryUniqueName
        in: path
        required: true
        description: The unique name of the Shared Gallery.
        schema:
          type: string
      - name: galleryImageName
        in: path
        required: true
        description: The name of the Shared Gallery Image Definition from which the Image Versions are to be listed.
        schema:
          type: string
      - name: galleryImageVersionName
        in: path
        required: true
        description: 'The name of the gallery image version to be created. Needs to follow semantic version name pattern: The allowed characters are digit and period. Digits must be within the range of a 32-bit integer. Format: <MajorVersion>.<MinorVersion>.<Patch>'
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedGalleryImageVersion'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        Get a gallery.:
          $ref: ./examples/GetASharedGalleryImageVersion.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Providers Microsoft Compute Locations Location Sharedgalleries Galleryuniquename Images Galleryimagename Versions Galleryimageversionname
