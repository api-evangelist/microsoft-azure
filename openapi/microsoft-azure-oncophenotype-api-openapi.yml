openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Onco Phenotype API
tags:
- name: OncoPhenotype
paths:
  /onco-phenotype/jobs:
    post:
      operationId: microsoftAzureOncophenotypeCreatejob
      tags:
      - OncoPhenotype
      summary: Microsoft Azure Create Onco Phenotype Job
      description: Creates an Onco Phenotype job with the given request body.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.RepeatabilityRequestHeaders.repeatabilityRequestId'
      - $ref: '#/components/parameters/Azure.Core.RepeatabilityRequestHeaders.repeatabilityFirstSent'
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          headers:
            Operation-Location:
              description: The location for monitoring the operation state.
              schema:
                type: string
                format: uri
            Repeatability-Result:
              description: Indicates whether the repeatable request was accepted or rejected.
              x-ms-enum:
                name: RepeatabilityResult
                modelAsString: false
                values:
                - name: accepted
                  value: accepted
                  description: If the request was accepted and the server guarantees that the server state reflects a single execution of the operation.
                - name: rejected
                  value: rejected
                  description: 'If the request was rejected because the combination of Repeatability-First-Sent and Repeatability-Request-ID were invalid

                    or because the Repeatability-First-Sent value was outside the range of values held by the server.'
              schema:
                type: string
                enum:
                - accepted
                - rejected
            Retry-After:
              description: The Retry-After header can indicate how long the client should wait before polling the operation status.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                type: object
                description: Provides status details for long running operations.
                properties:
                  id:
                    $ref: '#/components/schemas/Azure.Core.uuid'
                    description: The unique ID of the operation.
                    readOnly: true
                  status:
                    $ref: '#/components/schemas/JobStatus'
                    description: The status of the operation
                    readOnly: true
                  createdDateTime:
                    type: string
                    format: date-time
                    description: The date and time when the processing job was created.
                    readOnly: true
                  expirationDateTime:
                    type: string
                    format: date-time
                    description: The date and time when the processing job is set to expire.
                    readOnly: true
                  lastUpdateDateTime:
                    type: string
                    format: date-time
                    description: The date and time when the processing job was last updated.
                    readOnly: true
                  error:
                    $ref: '#/components/schemas/Azure.Core.Foundations.Error'
                    description: Error object that describes the error when status is "Failed".
                  result:
                    $ref: '#/components/schemas/OncoPhenotypeInferenceResult'
                    description: The result of the operation.
                required:
                - id
                - status
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        Creates an Onco Phenotype job with the given request body.:
          $ref: ./examples/SuccessfulOncoPhenotypeRequest.json
      x-ms-long-running-operation: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OncoPhenotypeData'
        required: true
  /onco-phenotype/jobs/{id}:
    get:
      operationId: microsoftAzureOncophenotypeGetjob
      tags:
      - OncoPhenotype
      summary: Microsoft Azure Get Onco Phenotype Job Details
      description: Gets the status and details of the Onco Phenotype job.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: id
        in: path
        description: A processing job identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Retry-After:
              description: The Retry-After header can indicate how long the client should wait before polling the operation status.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OncoPhenotypeResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        Gets the status and details of the Onco Phenotype job.:
          $ref: ./examples/SuccessfulOncoPhenotypeResponse.json
  /oncophenotype/jobs:
    post:
      operationId: microsoftAzureOncophenotypeCreatejob
      tags:
      - OncoPhenotype
      summary: Microsoft Azure Create Onco Phenotype Job
      description: Creates an Onco Phenotype job with the given request body.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.RepeatabilityRequestHeaders.repeatabilityRequestId'
      - $ref: '#/components/parameters/Azure.Core.RepeatabilityRequestHeaders.repeatabilityFirstSent'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OncoPhenotypeResult_2'
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          headers:
            Operation-Location:
              description: The location for monitoring the operation state.
              schema:
                type: string
                format: uri
            Retry-After:
              description: The Retry-After header can indicate how long the client should wait before polling the operation status.
              schema:
                type: integer
                format: int32
            Repeatability-Result:
              description: Indicates whether the repeatable request was accepted or rejected.
              x-ms-enum:
                name: RepeatabilityResult
                modelAsString: false
                values:
                - name: accepted
                  value: accepted
                  description: If the request was accepted and the server guarantees that the server state reflects a single execution of the operation.
                - name: rejected
                  value: rejected
                  description: 'If the request was rejected because the combination of Repeatability-First-Sent and Repeatability-Request-ID were invalid

                    or because the Repeatability-First-Sent value was outside the range of values held by the server.'
              schema:
                type: string
                enum:
                - accepted
                - rejected
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        Creates an Onco Phenotype job with the given request body.:
          $ref: ./examples/SuccessfulOncoPhenotypeRequest.json
      x-ms-long-running-operation: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OncoPhenotypeData'
        required: true
  /oncophenotype/jobs/{jobId}:
    get:
      operationId: microsoftAzureOncophenotypeGetjob
      tags:
      - OncoPhenotype
      summary: Microsoft Azure Get Onco Phenotype Job Details
      description: Gets the status and details of the Onco Phenotype job.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: jobId
        in: path
        description: A processing job identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OncoPhenotypeResult_2'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        Gets the status and details of the Onco Phenotype job.:
          $ref: ./examples/SuccessfulOncoPhenotypeResponse.json
components:
  schemas:
    DocumentContent:
      type: object
      description: The content of the patient document.
      properties:
        sourceType:
          $ref: '#/components/schemas/DocumentContentSourceType'
          description: 'The type of the content''s source.

            In case the source type is ''inline'', the content is given as a string (for instance, text).

            In case the source type is ''reference'', the content is given as a URI.'
        value:
          type: string
          description: The content of the document, given either inline (as a string) or as a reference (URI).
      required:
      - sourceType
      - value
    OrderedProcedure:
      type: object
      description: Procedure information
      properties:
        extension:
          type: array
          description: Additional Content defined by implementations
          items:
            $ref: '#/components/schemas/Fhir.R4.Extension'
        code:
          $ref: '#/components/schemas/Fhir.R4.CodeableConcept'
          description: Procedure code
        description:
          type: string
          description: Procedure description
    Fhir.R4.fhirUri:
      type: string
    OncoPhenotypePatientResult_2:
      type: object
      description: The results of the model's work for a single patient.
      properties:
        id:
          type: string
          description: The identifier given for the patient in the request.
        inferences:
          type: array
          description: The model's inferences for the given patient.
          items:
            $ref: '#/components/schemas/OncoPhenotypeInference'
          x-ms-identifiers: []
      required:
      - id
      - inferences
    InferenceEvidence:
      type: object
      description: A piece of evidence corresponding to an inference.
      properties:
        patientDataEvidence:
          $ref: '#/components/schemas/ClinicalNoteEvidence'
          description: A piece of evidence from a clinical note (text document).
        patientInfoEvidence:
          $ref: '#/components/schemas/ClinicalCodedElement'
          description: 'A piece of clinical information, expressed as a code in a clinical coding

            system.'
        importance:
          type: number
          format: float
          description: A value indicating how important this piece of evidence is for the inference.
          minimum: 0
          maximum: 1
    Azure.Core.uuid:
      type: string
      format: uuid
      description: Universally Unique Identifier
    PatientInfoSex:
      type: string
      description: The patient's sex.
      enum:
      - female
      - male
      - unspecified
      x-ms-enum:
        name: PatientInfoSex
        modelAsString: true
        values:
        - name: Female
          value: female
        - name: Male
          value: male
        - name: Unspecified
          value: unspecified
    Fhir.R4.Quantity:
      type: object
      description: 'A measured or measurable amount

        Based on [FHIR Quantity](https://www.hl7.org/fhir/R4/datatypes.html#Quantity)'
      properties:
        value:
          type: number
          format: double
          description: Numerical value (with implicit precision)
        comparator:
          type: string
          description: < | <= | >= | > - how to understand the value
        unit:
          type: string
          description: Unit representation
        system:
          $ref: '#/components/schemas/Fhir.R4.fhirUri'
          description: System that defines coded unit form
        code:
          type: string
          description: Coded form of the unit
      allOf:
      - $ref: '#/components/schemas/Fhir.R4.Element'
    Azure.Core.Foundations.Error:
      type: object
      description: The error object.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        message:
          type: string
          description: A human-readable representation of the error.
        target:
          type: string
          description: The target of the error.
        details:
          type: array
          description: An array of details about specific errors that led to this reported error.
          items:
            $ref: '#/components/schemas/Azure.Core.Foundations.Error'
          x-ms-identifiers: []
        innererror:
          $ref: '#/components/schemas/Azure.Core.Foundations.InnerError'
          description: An object containing more specific information than the current object about the error.
      required:
      - code
      - message
    PatientInfo:
      type: object
      description: Patient structured information, including demographics and known structured clinical information.
      properties:
        sex:
          $ref: '#/components/schemas/PatientInfoSex'
          description: The patient's sex.
        birthDate:
          type: string
          format: date
          description: The patient's date of birth.
        clinicalInfo:
          type: array
          description: Known clinical information for the patient, structured.
          items:
            $ref: '#/components/schemas/Fhir.R4.Resource'
    Fhir.R4.Resource:
      type: object
      description: 'Resource is the ancestor of DomainResource from which most resources are derived. Bundle, Parameters, and Binary extend Resource directly.

        Based on [FHIR Resource](https://www.hl7.org/fhir/r4/resource.html'
      properties:
        resourceType:
          type: string
          description: The type of resource
        id:
          type: string
          description: Resource Id
        meta:
          $ref: '#/components/schemas/Fhir.R4.Meta'
          description: Metadata about the resource
        implicitRules:
          $ref: '#/components/schemas/Fhir.R4.fhirUri'
          description: A set of rules under which this content was created
        language:
          type: string
          description: Language of the resource content
      required:
      - resourceType
      additionalProperties: {}
    Fhir.R4.fhirDateTime:
      type: string
      pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]{1,9})?)?)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)?)?)?
    OncoPhenotypeResult_2:
      type: object
      description: The response for the Onco Phenotype request.
      properties:
        jobId:
          $ref: '#/components/schemas/Azure.Core.uuid'
          description: A processing job identifier.
          readOnly: true
        createdDateTime:
          type: string
          format: date-time
          description: The date and time when the processing job was created.
          readOnly: true
        expirationDateTime:
          type: string
          format: date-time
          description: The date and time when the processing job is set to expire.
          readOnly: true
        lastUpdateDateTime:
          type: string
          format: date-time
          description: The date and time when the processing job was last updated.
          readOnly: true
        status:
          $ref: '#/components/schemas/JobStatus_2'
          description: The status of the processing job.
          readOnly: true
        errors:
          type: array
          description: An array of errors, if any errors occurred during the processing job.
          items:
            $ref: '#/components/schemas/Azure.Core.Foundations.Error'
          readOnly: true
          x-ms-identifiers: []
        results:
          $ref: '#/components/schemas/OncoPhenotypeResults'
          description: The inference results for the Onco Phenotype request.
          readOnly: true
      required:
      - jobId
      - createdDateTime
      - expirationDateTime
      - lastUpdateDateTime
      - status
    OncoPhenotypeResults:
      type: object
      description: The inference results for the Onco Phenotype request.
      properties:
        patients:
          type: array
          description: Results for the patients given in the request.
          items:
            $ref: '#/components/schemas/OncoPhenotypePatientResult_2'
        modelVersion:
          $ref: '#/components/schemas/ModelVersion'
          description: The version of the model used for inference, expressed as the model date.
      required:
      - patients
      - modelVersion
    Fhir.R4.Meta:
      type: object
      description: 'Metadata about a resource

        Based on [FHIR Meta](https://www.hl7.org/fhir/R4/resource.html#Meta)'
      properties:
        versionId:
          type: string
          description: The version specific identifier, as it appears in the version portion of the URL. This value changes when the resource is created, updated, or deleted.
        lastUpdated:
          $ref: '#/components/schemas/Fhir.R4.fhirInstant'
          description: When the resource last changed - e.g. when the version changed.
        source:
          $ref: '#/components/schemas/Fhir.R4.fhirUri'
          description: A uri that identifies the source system of the resource. This provides a minimal amount of Provenance information that can be used to track or differentiate the source of information in the resource. The source may identify another FHIR server, document, message, database, etc.
        profile:
          type: array
          description: A list of profiles (references to [StructureDefinition](https://www.hl7.org/fhir/structuredefinition.html) resources) that this resource claims to conform to. The URL is a reference to [StructureDefinition.url](https://www.hl7.org/fhir/structuredefinition-definitions.html#StructureDefinition.url).
          items:
            $ref: '#/components/schemas/Fhir.R4.fhirUri'
        security:
          type: array
          description: Security labels applied to this resource. These tags connect specific resources to the overall security policy and infrastructure.
          items:
            $ref: '#/components/schemas/Fhir.R4.Coding'
        tag:
          type: array
          description: Tags applied to this resource. Tags are intended to be used to identify and relate resources to process and workflow, and applications are not required to consider the tags when interpreting the meaning of a resource.
          items:
            $ref: '#/components/schemas/Fhir.R4.Coding'
    OncoPhenotypeData:
      type: object
      description: The body of the Onco Phenotype request.
      properties:
        patients:
          type: array
          description: The list of patients, including their clinical information and data.
          items:
            $ref: '#/components/schemas/PatientRecord'
        configuration:
          $ref: '#/components/schemas/OncoPhenotypeModelConfiguration'
          description: Configuration affecting the Onco Phenotype model's inference.
      required:
      - patients
    Fhir.R4.Identifier:
      type: object
      description: 'An identifier intended for computation

        Based on [FHIR Identifier](https://www.hl7.org/fhir/R4/identifier.html)'
      properties:
        use:
          type: string
          description: usual | official | temp | secondary | old (If known)
        type:
          $ref: '#/components/schemas/Fhir.R4.CodeableConcept'
          description: Description of identifier
        system:
          $ref: '#/components/schemas/Fhir.R4.fhirUri'
          description: The namespace for the identifier value
        value:
          type: string
          description: The value that is unique
        period:
          $ref: '#/components/schemas/Fhir.R4.Period'
          description: Time period when id is/was valid for use
        assigner:
          $ref: '#/components/schemas/Fhir.R4.Reference'
          description: Organization that issued id (may be just text)
      allOf:
      - $ref: '#/components/schemas/Fhir.R4.Element'
    DocumentType:
      type: string
      description: The type of the patient document, such as 'note' (text document) or 'fhirBundle' (FHIR JSON document).
      enum:
      - note
      - fhirBundle
      - dicom
      - genomicSequencing
      x-ms-enum:
        name: DocumentType
        modelAsString: true
        values:
        - name: Note
          value: note
        - name: FhirBundle
          value: fhirBundle
        - name: Dicom
          value: dicom
        - name: GenomicSequencing
          value: genomicSequencing
    PatientRecord:
      type: object
      description: A patient record, including their clinical information and data.
      properties:
        id:
          type: string
          description: A given identifier for the patient. Has to be unique across all patients in a single request.
          minLength: 1
        info:
          $ref: '#/components/schemas/PatientInfo'
          description: Patient structured information, including demographics and known structured clinical information.
        encounters:
          type: array
          description: Patient encounters/visits.
          items:
            $ref: '#/components/schemas/Encounter'
        patientDocuments:
          type: array
          description: Patient unstructured clinical data, given as documents.
          items:
            $ref: '#/components/schemas/PatientDocument'
      required:
      - id
    TimePeriod:
      type: object
      description: A duration of time during which an event is happening
      properties:
        start:
          type: string
          format: date-time
          description: Starting time with inclusive boundary
        end:
          type: string
          format: date-time
          description: End time with inclusive boundary, if not ongoing
    Fhir.R4.Coding:
      type: object
      description: 'A Coding is a representation of a defined concept using a symbol from a defined "code system".

        Based on [FHIR Coding](https://www.hl7.org/fhir/R4/datatypes.html#Coding)'
      properties:
        system:
          $ref: '#/components/schemas/Fhir.R4.fhirUri'
          description: Identity of the terminology system
        version:
          type: string
          description: Version of the system - if relevant
        code:
          type: string
          description: Symbol in syntax defined by the system
        display:
          type: string
          description: Representation defined by the system
      allOf:
      - $ref: '#/components/schemas/Fhir.R4.Element'
    JobStatus:
      type: string
      description: The status of the processing job.
      enum:
      - notStarted
      - running
      - succeeded
      - failed
      - canceled
      x-ms-enum:
        name: JobStatus
        modelAsString: true
        values:
        - name: NotStarted
          value: notStarted
        - name: Running
          value: running
        - name: Succeeded
          value: succeeded
        - name: Failed
          value: failed
        - name: Canceled
          value: canceled
    OncoPhenotypePatientResult:
      type: object
      description: The results of the model's work for a single patient.
      properties:
        patientId:
          type: string
          description: The identifier given for the patient in the request.
        inferences:
          type: array
          description: The model's inferences for the given patient.
          items:
            $ref: '#/components/schemas/OncoPhenotypeInference'
          x-ms-identifiers: []
      required:
      - patientId
      - inferences
    SpecialtyType:
      type: string
      description: Known values codes that can be used to indicate the type of the Specialty.
      enum:
      - pathology
      - radiology
      x-ms-enum:
        name: SpecialtyType
        modelAsString: true
        values:
        - name: Pathology
          value: pathology
          description: pathology
        - name: Radiology
          value: radiology
          description: radiology
    EncounterClass:
      type: string
      description: Known values codes that can be used to indicate the class of encounter (TODO://Based on FHIR value set--http://....).
      enum:
      - inpatient
      - ambulatory
      - observation
      - emergency
      - virtual
      - healthHome
      x-ms-enum:
        name: EncounterClass
        modelAsString: true
        values:
        - name: InPatient
          value: inpatient
          description: A patient encounter where a patient is admitted by a hospital or equivalent facility, assigned to a location where patients generally stay at least overnight and provided with room, board, and continuous nursing service.
        - name: Ambulatory
          value: ambulatory
          description: The term ambulatory usually implies that the patient has come to the location and is not assigned to a bed. Sometimes referred to as an outpatient encounter.
        - name: Observation
          value: observation
          description: An encounter where the patient usually will start in different encounter, such as one in the emergency department but then transition to this type of encounter because they require a significant period of treatment and monitoring to determine whether or not their condition warrants an inpatient admission or discharge.
        - name: Emergency
          value: emergency
          description: A patient encounter that takes place at a dedicated healthcare service delivery location where the patient receives immediate evaluation and treatment, provided until the patient can be discharged or responsibility for the patient's care is transferred elsewhere (for example, the patient could be admitted as an inpatient or transferred to another facility.
        - name: Virtual
          value: virtual
          description: A patient encounter where the patient is not physically present for the encounter, such as in a telehealth encounter, phone call, or electronic communication.
        - name: HealthHome
          value: healthHome
          description: Healthcare encounter that takes place in the residence of the patient or a designee
    Azure.Core.Foundations.InnerError:
      type: object
      description: An object containing more specific information about the error. As per Microsoft One API guidelines - https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        innererror:
          $ref: '#/components/schemas/Azure.Core.Foundations.InnerError'
          description: Inner error.
    ClinicalCodedElement:
      type: object
      description: A piece of clinical information, expressed as a code in a clinical coding system.
      properties:
        system:
          type: string
          description: The clinical coding system, e.g. ICD-10, SNOMED-CT, UMLS.
        code:
          type: string
          description: The code within the given clinical coding system.
        name:
          type: string
          description: The name of this coded concept in the coding system.
        value:
          type: string
          description: A value associated with the code within the given clinical coding system.
      required:
      - system
      - code
    Fhir.R4.CodeableConcept:
      type: object
      description: 'Concept - reference to a terminology or just text

        Based on [FHIR CodeableConcept](https://www.hl7.org/fhir/R4/datatypes.html#CodeableConcept)'
      properties:
        coding:
          type: array
          description: Code defined by a terminology system
          items:
            $ref: '#/components/schemas/Fhir.R4.Coding'
        text:
          type: string
          description: Plain text representation of the concept
      allOf:
      - $ref: '#/components/schemas/Fhir.R4.Element'
    ClinicalDocumentType:
      type: string
      description: The type of the clinical document.
      enum:
      - consultation
      - dischargeSummary
      - historyAndPhysical
      - radiologyReport
      - procedure
      - progress
      - laboratory
      - pathologyReport
      x-ms-enum:
        name: ClinicalDocumentType
        modelAsString: true
        values:
        - name: Consultation
          value: consultation
        - name: DischargeSummary
          value: dischargeSummary
        - name: HistoryAndPhysical
          value: historyAndPhysical
        - name: RadiologyReport
          value: radiologyReport
        - name: Procedure
          value: procedure
        - name: Progress
          value: progress
        - name: Laboratory
          value: laboratory
        - name: PathologyReport
          value: pathologyReport
