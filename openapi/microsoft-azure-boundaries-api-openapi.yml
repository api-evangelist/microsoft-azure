      type: object
      properties:
        unit:
          description: Data unit.
          maxLength: 50
          minLength: 1
          type: string
        value:
          format: double
          description: Data value.
          type: number
    SearchBoundaryQuery:
      description: SearchAllBoundaries and SearchBoundaries parameters.
      type: object
      properties:
        ids:
          description: Ids of the resource.
          type: array
          items:
