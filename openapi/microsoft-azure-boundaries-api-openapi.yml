      - Polygon
      - MultiPolygon
      type: string
      x-ms-enum:
        name: GeoJsonObjectType
        modelAsString: true
    Boundary:
      description: Schema of boundary resource.
      type: object
      properties:
        geometry:
          $ref: '#/components/schemas/GeoJsonObject'
        type:
