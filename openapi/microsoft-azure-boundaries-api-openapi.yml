          maxLength: 100
          minLength: 2
          type: string
        name:
          description: Name to identify resource.
          maxLength: 100
          minLength: 0
          type: string
        description:
          description: Textual description of the resource.
          maxLength: 500
          minLength: 0
          type: string
        createdBy:
          description: Created by user/tenant id.
          type: string
          readOnly: true
        modifiedBy:
          description: Modified by user/tenant id.
          type: string
          readOnly: true
        properties:
          description: 'A collection of key value pairs that belongs to the resource.

            Each pair must not have a key greater than 50 characters

            and must not have a value greater than 150 characters.

            Note: A maximum of 25 key value pairs can be provided for a resource and only string,

            numeral and datetime (yyyy-MM-ddTHH:mm:ssZ) values are supported.'
          type: object
          additionalProperties: {}
      example:
        name: string
        description: string
        source: string
        parentId: string
        parentType: Field
        type: string
        geometry:
          type: Polygon
          coordinates:
          - - - 73.70457172393799
              - 20.545385304358106
            - - 73.70457172393799
              - 20.545385304358106
            - - 73.70448589324951
              - 20.542411534243367
            - - 73.70877742767334
              - 20.541688176010233
            - - 73.71023654937744
              - 20.545083911372505
            - - 73.70663166046143
              - 20.546992723579137
            - - 73.70457172393799
              - 20.545385304358106
