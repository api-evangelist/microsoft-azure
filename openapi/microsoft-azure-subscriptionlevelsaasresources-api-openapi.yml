            application/json:
              schema:
                $ref: '#/components/schemas/SaasResourceResponseWithContinuation'
        default:
          description: A response indicating an error.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        Get subscription level saas resources in Azure subscription:
          $ref: ./examples/saasSubscriptionLevel/SaasGetAllInAzureSubscription.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Providers Microsoft Saas…
