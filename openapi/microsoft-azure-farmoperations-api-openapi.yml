        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmOperationDataIngestionJob'
        default:
          description: Error
          headers:
            x-ms-error-code:
