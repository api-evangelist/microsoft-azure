openapi: 3.2.0
info:
  title: Microsoft Azure Azure Communication Chat Service Typing…
  description: Azure Communication Chat Service
  version: 2024-03-15-preview
security:
- Authorization: []
tags:
- name: TypingNotifications
paths:
  /chat/threads/{chatThreadId}/typing:
    post:
      tags:
      - TypingNotifications
      summary: Microsoft Azure Posts A Typing Event To A Thread, On Behalf Of A User
      operationId: microsoftAzureChatthreadSendtypingnotification
      parameters:
      - in: path
        name: chatThreadId
        description: Id of the thread.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful.
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-examples:
        Post typing event to a thread:
          $ref: ./examples/Messages_SendTypingNotification.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTypingNotificationRequest'
        description: Details of the typing notification request.
components:
  schemas:
    CommunicationErrorResponse:
      $ref: ../../../Common/stable/2023-11-15/common.json#/definitions/CommunicationErrorResponse
    SendTypingNotificationRequest:
      description: Request payload for typing notifications.
      type: object
      properties:
        senderDisplayName:
          description: The display name of the typing notification sender. This property is used to populate sender name for push notifications.
          type: string
          example: Bob Admin
  parameters:
    ApiVersionParameter:
      in: query
      name: api-version
      description: Version of API to invoke.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
  securitySchemes:
    Authorization:
      type: apiKey
      name: Authorization
      in: header
      description: An ACS (Azure Communication Services) user access token.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
