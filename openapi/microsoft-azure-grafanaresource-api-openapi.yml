      description: Needs a more full description created.
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Dashboard/grafana:
    get:
      tags:
      - GrafanaResource
      summary: Microsoft Azure List All Resources Of Workspaces For Grafana Under The…
      operationId: microsoftAzureGrafanaListbyresourcegroup
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK. Return all resources of workspaces for Grafana under the given resource group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedGrafanaListResponse'
        default:
          description: Common error response for all Azure Resource Manager APIs to return error details for failed operations.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        Grafana_ListByResourceGroup:
          $ref: ./examples/Grafana_ListByResourceGroup.json
      description: Needs a more full description created.
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Dashboard/grafana/{workspaceName}:
    get:
      tags:
      - GrafanaResource
      summary: Microsoft Azure Get The Properties Of A Specific Workspace For Grafana Resource
      operationId: microsoftAzureGrafanaGet
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/WorkspaceNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK. Return the properties of the required workspace for Grafana resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedGrafana'
        default:
          description: Common error response for all Azure Resource Manager APIs to return error details for failed operations.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-examples:
        Grafana_Get:
          $ref: ./examples/Grafana_Get.json
      description: Needs a more full description created.
    put:
      tags:
      - GrafanaResource
      summary: Microsoft Azure Create Or Update A Workspace For Grafana Resource This Api Is…
      operationId: microsoftAzureGrafanaCreate
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/WorkspaceNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK. Successfully create a workspace for Grafana resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedGrafana'
        '201':
          description: Created. The operation was successfully started and will complete asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedGrafana'
        default:
          description: Common error response for all Azure Resource Manager APIs to return error details for failed operations.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      x-ms-examples:
        Grafana_Create:
          $ref: ./examples/Grafana_Create.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedGrafana'
        required: true
    patch:
      tags:
      - GrafanaResource
      summary: Microsoft Azure Update A Workspace For Grafana Resource
      operationId: microsoftAzureGrafanaUpdate
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/WorkspaceNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK. Successfully update the workspace for Grafana resource.
