openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Extension Type API
tags:
- name: ExtensionType
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.KubernetesConfiguration/locations/{location}/extensionTypes:
    get:
      tags:
      - ExtensionType
      description: List all Extension Types
      operationId: microsoftAzureLocationextensiontypesList
      x-ms-examples:
        LocationExtensionTypes_List_MaximumSet_Gen:
          $ref: ./examples/LocationExtensionTypes_List.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/ExtensionLocationParameter'
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionTypeList'
        default:
          description: Error response describing why the operation failed
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Subscriptions Subscriptionid Providers Microsoft Kubernetesconfiguration Locations Location Extensiontypes
components:
  schemas:
    ExtensionType:
      type: object
      description: Represents an Extension Type.
      required:
      - properties
      properties:
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/ExtensionTypeProperties'
          description: Describes the Resource Type properties.
        systemData:
          $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/systemData
          readOnly: true
          description: Metadata pertaining to creation and last modification of the resource.
    ExtensionTypeProperties:
      description: Properties of the connected cluster.
      type: object
      properties:
        releaseTrains:
          readOnly: true
          type: array
          items:
            type: string
          description: 'Extension release train: preview or stable'
        clusterTypes:
          description: Cluster types
          readOnly: true
          type: string
          enum:
          - connectedClusters
          - managedClusters
          x-ms-enum:
            name: clusterTypes
            modelAsString: false
        supportedScopes:
          readOnly: true
          type: object
          description: Extension scopes
          $ref: '#/components/schemas/SupportedScopes'
    ClusterScopeSettings:
      type: object
      description: Extension scope settings
      properties:
        properties:
          type: object
          x-ms-client-flatten: true
          description: Extension scope settings
          properties:
            allowMultipleInstances:
              type: boolean
              description: Describes if multiple instances of the extension are allowed
            defaultReleaseNamespace:
              type: string
              description: Default extension release namespace
      allOf:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ProxyResource
    SupportedScopes:
      type: object
      description: Extension scopes
      properties:
        defaultScope:
          type: string
          description: 'Default extension scopes: cluster or namespace'
        clusterScopeSettings:
          description: Scope settings
          $ref: '#/components/schemas/ClusterScopeSettings'
    ExtensionTypeList:
      description: List Extension Types
      type: object
      properties:
        value:
          description: The list of Extension Types
          type: array
          items:
            $ref: '#/components/schemas/ExtensionType'
        nextLink:
          description: The link to fetch the next page of Extension Types
          type: string
  parameters:
    ExtensionLocationParameter:
      name: location
      in: path
      description: extension location
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
