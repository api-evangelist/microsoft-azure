openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Participants API
tags:
- name: Participants
paths:
  /chat/threads/{chatThreadId}/participants:
    get:
      tags:
      - Participants
      summary: Microsoft Azure Gets The Participants Of A Thread
      operationId: microsoftAzureChatthreadListchatparticipants
      parameters:
      - in: path
        name: chatThreadId
        description: Thread id to get participants for.
        required: true
        schema:
          type: string
      - in: query
        name: maxPageSize
        description: The maximum number of participants to be returned per page.
        schema:
          type: integer
          format: int32
      - in: query
        name: skip
        description: Skips participants up to a specified position in response.
        schema:
          type: integer
          format: int32
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. The action returns the participants of a thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatParticipantsCollection'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-examples:
        Get participants with pagination (max page size):
          $ref: ./examples/Participants_ListChatParticipantsWithPageSize.json
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
      description: Needs a more full description created.
  /chat/threads/{chatThreadId}/participants/:remove:
    post:
      tags:
      - Participants
      summary: Microsoft Azure Remove A Participant From A Thread
      operationId: microsoftAzureChatthreadRemovechatparticipant
      parameters:
      - in: path
        name: chatThreadId
        description: Thread id to remove the participant from.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '204':
          description: Request successful.
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-examples:
        Remove participant:
          $ref: ./examples/Participants_RemoveChatParticipant.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunicationIdentifierModel'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CommunicationIdentifierModel'
        description: Id of the thread participant to remove from the thread.
        required: true
  /chat/threads/{chatThreadId}/participants/:add:
    post:
      tags:
      - Participants
      summary: Microsoft Azure Adds Thread Participants To A Thread If Participants Already Exist, No Change Occurs
      operationId: microsoftAzureChatthreadAddchatparticipants
      parameters:
      - in: path
        name: chatThreadId
        description: Id of the thread to add participants to.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '201':
          description: The participants were successfully added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddChatParticipantsResult'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-examples:
        Add participants:
          $ref: ./examples/Participants_AddChatParticipants.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChatParticipantsRequest'
        description: Thread participants to be added to the thread.
        required: true
  /rooms/{roomId}/participants:
    get:
      tags:
      - Participants
      summary: Microsoft Azure Get Participants In A Room
      operationId: microsoftAzureParticipantsList
      parameters:
      - in: path
        name: roomId
        description: The id of the room to get participants from.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. The action returns the participants of the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantsCollection'
        default:
          description: Error response
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse_2'
      x-ms-examples:
        Get participants:
          $ref: ./examples/Participants_List.json
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
      description: Needs a more full description created.
    patch:
      tags:
      - Participants
      summary: Microsoft Azure Update Participants In A Room
      operationId: microsoftAzureParticipantsUpdate
      parameters:
      - in: path
        name: roomId
        description: The id of the room to update the participants in.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: The participants were successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateParticipantsResult'
        default:
          description: Error response
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse_2'
      x-ms-examples:
        Update participants:
          $ref: ./examples/Participants_Update.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateParticipantsRequest'
        description: An updated set of participants of the room.
        required: true
components:
  schemas:
    Role:
      description: The role of a room participant. The default value is Attendee.
      enum:
      - Presenter
      - Attendee
      - Consumer
      type: string
      x-ms-enum:
        name: Role
        modelAsString: true
    CommunicationErrorResponse_2:
      $ref: ../../../Common/stable/2022-07-13/common.json#/definitions/CommunicationErrorResponse
    CommunicationError:
      $ref: ../../../Common/stable/2023-11-15/common.json#/definitions/CommunicationError
    UpdateParticipantsRequest:
      description: Participants to be updated in the room.
      type: object
      properties:
        participants:
          description: Participants to be updated.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ParticipantProperties'
          example:
            rawId1:
              role: Presenter
            rawId2:
              role: Attendee
            rawId3: null
    ParticipantProperties:
      required:
      - role
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
    ParticipantsCollection:
      description: A collection of participants in a room.
      required:
      - value
      type: object
      properties:
        value:
          description: A collection of participants.
          type: array
          items:
            $ref: '#/components/schemas/RoomParticipant'
        nextLink:
          description: If there are more participants that can be retrieved, the next link will be populated.
          type: string
    ChatParticipantsCollection:
      description: Collection of participants belong to a particular thread.
      required:
      - value
      type: object
      properties:
        value:
          description: Chat participants.
          type: array
          items:
            $ref: '#/components/schemas/ChatParticipant'
        nextLink:
          description: If there are more chat participants that can be retrieved, the next link will be populated.
          type: string
          readOnly: true
    CommunicationIdentifierModel:
      $ref: ../../../Common/stable/2023-11-15/common.json#/definitions/CommunicationIdentifierModel
    UpdateParticipantsResult:
      description: Request response for updating participants.
      type: object
    CommunicationErrorResponse:
      $ref: ../../../Common/stable/2023-11-15/common.json#/definitions/CommunicationErrorResponse
    ChatParticipant:
      description: A participant of the chat thread.
      required:
      - communicationIdentifier
      type: object
      properties:
        communicationIdentifier:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
        displayName:
          description: Display name for the chat participant.
          type: string
          example: Bob
        shareHistoryTime:
          format: date-time
          description: 'Time from which the chat history is shared with the participant. The timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
          example: '2020-10-30T10:50:50Z'
        metadata:
          description: Contextual metadata for the chat participant. The metadata consists of name/value pairs. The total size of all metadata pairs can be up to 1KB in size.
          type: object
          additionalProperties:
            type: string
    RoomParticipant:
      description: A participant of the room.
      required:
      - rawId
      - role
      type: object
      properties:
        rawId:
          description: Raw ID representation of the communication identifier. Please refer to the following document for additional information on Raw ID. <br> https://learn.microsoft.com/azure/communication-services/concepts/identifiers?pivots=programming-language-rest#raw-id-representation
          type: string
        role:
          $ref: '#/components/schemas/Role'
    AddChatParticipantsResult:
      description: Result of the add chat participants operation.
      type: object
      properties:
        invalidParticipants:
          description: The participants that failed to be added to the chat thread.
          type: array
          items:
            $ref: '#/components/schemas/CommunicationError'
          readOnly: true
    AddChatParticipantsRequest:
      description: Participants to be added to the thread.
      required:
      - participants
      type: object
      properties:
        participants:
          description: Participants to add to a chat thread.
          type: array
          items:
            $ref: '#/components/schemas/ChatParticipant'
  parameters:
    ApiVersionParameter:
      in: query
      name: api-version
      description: Version of API to invoke.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
