openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Workspace Private Link Resources API
tags:
- name: WorkspacePrivateLinkResources
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.MachineLearningServices/workspaces/{workspaceName}/privateLinkResources
  : get:
      tags:
      - WorkspacePrivateLinkResources
      summary: "Microsoft Azure Called By Client Portal, Cli, Etc To Get Available \"private Link Resources\" For The Workspace \neach \"private Link Resource\" Is A Connection Endpoint Ip Address To The Resource \npre Single Connection Endpoint Per Workspace: The Data Plane Ip Address, Returned By Dns Resolution \nother Rps, Such As Azure Storage, Have Multiple  One For Blobs, Other For Queues, Etc \ndefined In The \"[nrp] Private Endpoint Design\" Doc, Topic \"get Api For Groupids\""
      operationId: microsoftAzurePrivatelinkresourcesList
      parameters:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/WorkspaceNameParameter'
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: The request was successful; the request was well-formed and received properly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkResourceListResult'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/ErrorResponse
      x-ms-examples:
        WorkspaceListPrivateLinkResources:
          $ref: ./examples/PrivateLinkResource/list.json
      x-ms-pageable:
        nextLinkName: null
      description: Needs a more full description created.
components:
  schemas:
    PrivateLinkResource:
      description: A private link resource
      type: object
      allOf:
      - $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/Resource
      properties:
        identity:
          $ref: ../../../../../common-types/resource-management/v3/managedidentity.json#/definitions/ManagedServiceIdentity
        location:
          description: Same as workspace location.
          type: string
        properties:
          description: Properties of a private link resource.
          $ref: '#/components/schemas/PrivateLinkResourceProperties'
          x-ms-client-flatten: true
        sku:
          description: Optional. This field is required to be implemented by the RP because AML is supporting more than one tier
          $ref: ../../../../../common-types/resource-management/v3/types.json#/definitions/Sku
        tags:
          type: object
          additionalProperties:
            type: string
    PrivateLinkResourceProperties:
      description: Properties of a private link resource.
      type: object
      properties:
        groupId:
          description: The private link resource group id.
          type: string
        requiredMembers:
          description: The private link resource required member names.
          type: array
          items:
            type: string
        requiredZoneNames:
          description: The private link resource Private link DNS zone name.
          type: array
          items:
            type: string
    PrivateLinkResourceListResult:
      description: A list of private link resources
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/PrivateLinkResource'
  parameters:
    WorkspaceNameParameter:
      in: path
      name: workspaceName
      description: Azure Machine Learning Workspace Name
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{2,32}$
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
