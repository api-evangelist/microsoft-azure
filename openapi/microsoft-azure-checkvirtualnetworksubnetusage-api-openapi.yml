openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Check Virtual Network Subnet Usage API
tags:
- name: CheckVirtualNetworkSubnetUsage
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.DBforMySQL/locations/{locationName}/checkVirtualNetworkSubnetUsage:
    post:
      tags:
      - CheckVirtualNetworkSubnetUsage
      operationId: microsoftAzureCheckvirtualnetworksubnetusageExecute
      x-ms-examples:
        CheckVirtualNetworkSubnetUsage:
          $ref: ./examples/CheckVirtualNetworkSubnetUsage.json
      description: Get virtual network subnet usage for a given vNet resource id.
      parameters:
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../../common-types/resource-management/v5/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../common-types/v1/common-types.json#/parameters/LocationNameParameter
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualNetworkSubnetUsageResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../../common-types/resource-management/v5/types.json#/definitions/ErrorResponse
      summary: Microsoft Azure Post Subscriptions Subscriptionid Providers Microsoft Dbformysql Locations Locationname Checkvirtualnetworksubnetusage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualNetworkSubnetUsageParameter'
        description: The required parameters for creating or updating a server.
        required: true
components:
  schemas:
    DelegatedSubnetUsage:
      type: object
      properties:
        subnetName:
          type: string
          readOnly: true
          description: name of the subnet
        usage:
          type: integer
          format: int64
          readOnly: true
          description: Number of used delegated subnets
      description: Delegated subnet usage data.
    VirtualNetworkSubnetUsageResult:
      type: object
      properties:
        location:
          type: string
          readOnly: true
          description: The location name.
        subscriptionId:
          type: string
          readOnly: true
          description: The subscription id.
        delegatedSubnetsUsage:
          description: A list of delegated subnet usage
          type: array
          items:
            $ref: '#/components/schemas/DelegatedSubnetUsage'
          x-ms-identifiers: []
          readOnly: true
      description: Virtual network subnet usage data.
    VirtualNetworkSubnetUsageParameter:
      type: object
      properties:
        virtualNetworkResourceId:
          type: string
          description: Virtual network resource id.
      description: Virtual network subnet usage parameter
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
