openapi: 3.2.0
info:
  title: Microsoft Azure Token API
  version: '1.0'
  description: 'Operations tagged Token across 2 of this provider''s published API definitions: azure-machine-learning-model-management-service-openapi-original.yml, communicationidentityclient-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Token
paths:
  ? /modelmanagement/v1.0/subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.MachineLearningServices/workspaces/{workspace}/services/{id}/token
  : post:
      tags:
      - Token
      summary: Microsoft Azure Generate Service Access Token
      description: Gets access token that can be used for calling service.
      operationId: microsoftAzureServicesGetservicetoken
      parameters:
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupParameter'
      - $ref: '#/components/parameters/workspaceParameter'
      - name: id
        in: path
        description: The Service Id.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelErrorResponse'
      security:
      - azure_auth:
        - user_impersonation
  /identities/{id}/:issueAccessToken:
    post:
      tags:
      - Token
      summary: Microsoft Azure Issue A New Token For An Identity
      operationId: microsoftAzureCommunicationidentityIssueaccesstoken
      parameters:
      - in: path
        name: id
        description: Identifier of the identity to issue token for.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationIdentityAccessToken'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../../Common/stable/2021-03-07/common.json#/definitions/CommunicationErrorResponse
      x-ms-examples:
        Issue an access token:
          $ref: ./examples/IssueAccessToken.json
      description: Needs a more full description created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunicationIdentityAccessTokenRequest'
        description: Requesting scopes for the new token.
        required: true
components:
  schemas:
    ModelErrorResponse:
      description: The Model Management Service Error object.
      type: object
      properties:
        code:
          description: The error code.
          type: string
        statusCode:
          format: int32
          description: The HTTP status code.
          type: integer
        message:
          description: The error message.
          type: string
        details:
          description: An array of error detail objects.
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
    AuthToken:
      description: Service Token
      type: object
      properties:
        accessToken:
          description: Access token.
          type: string
        tokenType:
          description: Access token type.
          type: string
        expiryOn:
          format: int64
          description: Access token expiry time (UTC).
          type: integer
        refreshAfter:
          format: int64
          description: Refresh access token after time (UTC).
          type: integer
    ErrorDetails:
      description: The error details.
      type: object
      properties:
        code:
          description: The error code.
          type: string
        message:
          description: The error message.
          type: string
        target:
          description: The target of the error (e.g., the name of the property in error).
          type: string
    CommunicationIdentityTokenScope:
      description: List of scopes for an access token.
      enum:
      - chat
      - voip
      type: string
      x-ms-enum:
        name: CommunicationIdentityTokenScope
        modelAsString: true
    CommunicationIdentityAccessTokenRequest:
      required:
      - scopes
      type: object
      properties:
        scopes:
          description: List of scopes attached to the token.
          type: array
          items:
            $ref: '#/components/schemas/CommunicationIdentityTokenScope'
    CommunicationIdentityAccessToken:
      description: An access token.
      required:
      - expiresOn
      - token
      type: object
      properties:
        token:
          description: The access token issued for the identity.
          type: string
        expiresOn:
          format: date-time
          description: The expiry time of the token.
          type: string
  parameters:
    subscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The Azure Subscription ID.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        format: uuid
    resourceGroupParameter:
      name: resourceGroup
      in: path
      description: The Name of the resource group in which the workspace is located.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    workspaceParameter:
      name: workspace
      in: path
      description: The name of the workspace.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ApiVersionParameter:
      in: query
      name: api-version
      description: Version of API to invoke.
      required: true
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      flows:
        implicit:
          scopes:
            user_impersonation: impersonate your user account
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
x-refined-from:
- azure-machine-learning-model-management-service-openapi-original.yml
- communicationidentityclient-openapi-original.yml
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
