openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Discovery Templates API
tags:
- name: Discovery Templates
paths:
  /discoTemplates:
    get:
      operationId: microsoftAzureDiscoverytemplatesListdiscotemplate
      tags:
      - Discovery Templates
      description: Retrieve a list of disco templates for the provided search parameters.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.FilterQueryParameter'
      - $ref: '#/components/parameters/Azure.Core.SkipQueryParameter'
      - $ref: '#/components/parameters/Azure.Core.MaxPageSizeQueryParameter'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDiscoTemplate'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        DiscoveryTemplates_ListDiscoTemplate:
          $ref: ./examples/DiscoveryTemplates_ListDiscoTemplate_MaximumSet_Gen.json
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Microsoft Azure Get Discotemplates
  /discoTemplates/{templateId}:
    get:
      operationId: microsoftAzureDiscoverytemplatesGetdiscotemplate
      tags:
      - Discovery Templates
      description: Retrieve a disco template with a given templateId.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: templateId
        in: path
        description: The system generated unique id for the resource.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoTemplate'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        DiscoveryTemplates_GetDiscoTemplate:
          $ref: ./examples/DiscoveryTemplates_GetDiscoTemplate_MaximumSet_Gen.json
      summary: Microsoft Azure Get Discotemplates Templateid
components:
  schemas:
    DiscoSource:
      type: object
      description: Source entity used to drive discovery.
      properties:
        kind:
          $ref: '#/components/schemas/DiscoSourceKind'
          description: The kind of disco source.
        name:
          type: string
          description: The name for the disco source.
    Azure.Core.Foundations.Error:
      type: object
      description: The error object.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        message:
          type: string
          description: A human-readable representation of the error.
        target:
          type: string
          description: The target of the error.
        details:
          type: array
          description: An array of details about specific errors that led to this reported error.
          items:
            $ref: '#/components/schemas/Azure.Core.Foundations.Error'
          x-ms-identifiers: []
        innererror:
          $ref: '#/components/schemas/Azure.Core.Foundations.InnerError'
          description: An object containing more specific information than the current object about the error.
      required:
      - code
      - message
    Azure.Core.Foundations.InnerError:
      type: object
      description: An object containing more specific information about the error. As per Microsoft One API guidelines - https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        innererror:
          $ref: '#/components/schemas/Azure.Core.Foundations.InnerError'
          description: Inner error.
    PagedDiscoTemplate:
      type: object
      description: Paged collection of DiscoTemplate items
      properties:
        value:
          type: array
          description: The DiscoTemplate items on this page
          items:
            $ref: '#/components/schemas/DiscoTemplate'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
        totalElements:
          type: integer
          format: int64
          description: The total number of items available in the full result set.
      required:
      - value
    Azure.Core.Foundations.ErrorResponse:
      type: object
      description: A response containing error details.
      properties:
        error:
          $ref: '#/components/schemas/Azure.Core.Foundations.Error'
          description: The error object.
      required:
      - error
    DiscoTemplate:
      type: object
      description: The items in the current page of results.
      properties:
        id:
          type: string
          description: The system generated unique id for the resource.
          readOnly: true
        name:
          type: string
          description: The caller provided unique name for the resource.
        displayName:
          type: string
          description: The name that can be used for display purposes.
        industry:
          type: string
          description: The name of the industry.
        region:
          type: string
          description: The name of the region.
        countryCode:
          type: string
          description: The country code.
        stateCode:
          type: string
          description: The state code.
        city:
          type: string
          description: The name of the city.
        seeds:
          type: array
          description: The list of disco template seeds.
          items:
            $ref: '#/components/schemas/DiscoSource'
          x-ms-identifiers: []
        names:
          type: array
          description: The list of disco template names.
          items:
            type: string
      required:
      - id
    DiscoSourceKind:
      type: string
      description: The kind of disco source.
      enum:
      - as
      - attribute
      - contact
      - domain
      - host
      - ipBlock
      x-ms-enum:
        name: DiscoSourceKind
        modelAsString: true
  parameters:
    Azure.Core.MaxPageSizeQueryParameter:
      name: maxpagesize
      in: query
      description: The maximum number of result items per page.
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
    Azure.Core.FilterQueryParameter:
      name: filter
      in: query
      description: Filter the result list using the given expression.
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    Azure.Core.Foundations.ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      x-ms-parameter-location: method
      x-ms-client-name: apiVersion
      schema:
        type: string
        minLength: 1
    Azure.Core.SkipQueryParameter:
      name: skip
      in: query
      description: The number of result items to skip.
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        default: 0
