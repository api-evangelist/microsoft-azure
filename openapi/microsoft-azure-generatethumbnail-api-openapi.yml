openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Generate Thumbnail API
tags:
- name: generateThumbnail
paths:
  /generateThumbnail:
    post:
      description: This operation generates a thumbnail image with the user-specified width and height. By default, the service analyzes the image, identifies the region of interest (ROI), and generates smart cropping coordinates based on the ROI. Smart cropping helps when you specify an aspect ratio that differs from that of the input image. A successful response contains the thumbnail image binary. If the request failed, the response contains an error code and a message to help determine what went wrong.
      operationId: microsoftAzureGeneratethumbnail
      parameters:
      - name: width
        in: query
        required: true
        description: Width of the thumbnail. It must be between 1 and 1024. Recommended minimum of 50.
        schema:
          type: integer
          maximum: 1023
          minimum: 1
      - name: height
        in: query
        required: true
        description: Height of the thumbnail. It must be between 1 and 1024. Recommended minimum of 50.
        schema:
          type: integer
          maximum: 1023
          minimum: 1
      - $ref: ../../../Common/Parameters.json#/parameters/ImageUrl
      - name: smartCropping
        in: query
        required: false
        description: Boolean flag for enabling smart cropping.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The generated thumbnail in binary format.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: Error response.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ComputerVisionError'
      x-ms-examples:
        Successful Generate Thumbnail request:
          $ref: ./examples/SuccessfulGenerateThumbnailWithUrl.json
      summary: Microsoft Azure Post Generatethumbnail
      tags:
      - generateThumbnail
components:
  schemas:
    ComputerVisionError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: The error code.
          enum:
          - InvalidImageUrl
          - InvalidImageFormat
          - InvalidImageSize
          - NotSupportedVisualFeature
          - NotSupportedImage
          - InvalidDetails
          - NotSupportedLanguage
          - BadArgument
          - FailedToProcess
          - Timeout
          - InternalServerError
          - Unspecified
          - StorageException
          x-ms-enum:
            name: ComputerVisionErrorCodes
            modelAsString: false
        message:
          type: string
          description: A message explaining the error reported by the service.
        requestId:
          type: string
          description: A unique request identifier.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
