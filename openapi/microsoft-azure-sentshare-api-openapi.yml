openapi: 3.2.0
info:
  title: Microsoft Azure Purview Share Client Sent Share API
  description: Creates a data plane client for Purview Share.
  version: 2023-05-30-preview
security:
- azureAuth:
  - https://purview.azure.net/.default
tags:
- name: SentShare
paths:
  /sentShares:
    get:
      tags:
      - SentShare
      summary: Microsoft Azure Get A List Of Sent Shares
      description: List sent shares
      operationId: microsoftAzureSentsharesList
      parameters:
      - $ref: '#/components/parameters/referenceName'
      - $ref: '#/components/parameters/api-version'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/orderby'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentShareList'
        default:
          description: Default error response.
          headers:
            x-ms-error-code:
              description: The error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewShareError'
      x-ms-examples:
        SentShares_List:
          $ref: ./examples/SentShares_List.json
      x-ms-pageable:
        nextLinkName: nextLink
  /sentShares/{sentShareId}:
    get:
      tags:
      - SentShare
      summary: Microsoft Azure Get A Sent Share By Guid
      description: Get a sent share
      operationId: microsoftAzureSentsharesGet
      parameters:
      - $ref: '#/components/parameters/sentShareId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentShare'
        default:
          description: Default error response.
          headers:
            x-ms-error-code:
              description: The error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewShareError'
      x-ms-examples:
        SentShares_Get:
          $ref: ./examples/SentShares_Get.json
        SentShares_GetAdlsGen2Account:
          $ref: ./examples/SentShares_GetAdlsGen2Account.json
        SentShares_GetBlobAccount:
          $ref: ./examples/SentShares_GetBlobAccount.json
    put:
      tags:
      - SentShare
      summary: Microsoft Azure Create Or Replace A Sent Share
      description: Create or replace a sent share
      operationId: microsoftAzureSentsharesCreateorreplace
      parameters:
      - $ref: '#/components/parameters/sentShareId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          headers:
            Operation-Location:
              description: The URL to track the status of the long running operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentShare'
        '201':
          description: Success
          headers:
            Operation-Location:
              description: The URL to track the status of the long running operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentShare'
        default:
          description: Default error response.
          headers:
            x-ms-error-code:
              description: The error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewShareError'
      x-ms-examples:
        SentShares_CreateOrReplace:
          $ref: ./examples/SentShares_CreateOrReplace.json
        SentShares_CreateOrReplaceAdlsGen2Account:
          $ref: ./examples/SentShares_CreateOrReplaceAdlsGen2Account.json
        SentShares_CreateOrReplaceBlobAccount:
          $ref: ./examples/SentShares_CreateOrReplaceBlobAccount.json
      x-ms-long-running-operation: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SentShare'
        description: The sent share to create or replace.
        required: true
    delete:
      tags:
      - SentShare
      summary: Microsoft Azure Deletes A Sent Share
      description: Delete a sent share
      operationId: microsoftAzureSentsharesDelete
      parameters:
      - $ref: '#/components/parameters/sentShareId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '202':
          description: Accepted
          headers:
            Operation-Location:
              description: The URL to track the status of the long running operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        default:
          description: Default error response.
          headers:
            x-ms-error-code:
              description: The error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewShareError'
      x-ms-examples:
        SentShares_Delete:
          $ref: ./examples/SentShares_Delete.json
      x-ms-long-running-operation: true
components:
  schemas:
    OperationResponse:
      description: Response for long running operation.
      required:
      - status
      type: object
      properties:
        endTime:
          format: date-time
          description: End time of the long running operation. Represented in the standard date-time format as defined by [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339)
          type: string
        error:
          $ref: '#/components/schemas/PurviewShareErrorInfo'
        id:
          description: Job id of the long running operation
          type: string
        startTime:
          format: date-time
          description: Start time of the long running operation. Represented in the standard date-time format as defined by [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339)
          type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
    ShareKind:
      description: Defines the supported types for share.
      enum:
      - InPlace
      type: string
      x-ms-enum:
        name: ShareKind
        modelAsString: true
        values:
        - value: InPlace
          description: The type of share is in-place sharing
          name: In place share kind
    ProxyResource:
      description: Base data transfer object implementation for proxy resources.
      type: object
      properties:
        id:
          description: The unique id of the resource.
          type: string
          readOnly: true
        type:
          description: Type of the resource.
          type: string
          readOnly: true
    SentShareList:
      description: List of sent shares.
      required:
      - value
      type: object
      properties:
        nextLink:
          format: url
          description: The Url of next result page.
          type: string
        value:
          description: Collection of items of type SentShare
          type: array
          items:
            $ref: '#/components/schemas/SentShare'
    OperationStatus:
      description: States for long running operations.
      enum:
      - Running
      - TransientFailure
      - Succeeded
      - Failed
      - NotStarted
      type: string
      x-ms-enum:
        name: OperationStatus
        modelAsString: true
        values:
        - value: Running
          description: The long running operation is in 'Running' state
          name: Long running operation state is 'Running'
        - value: TransientFailure
          description: The long running operation hit a transient failure
          name: Long running operation state is 'TransientFailure'
        - value: Succeeded
          description: The long running operation is in 'Succeeded' state
          name: Long running operation state is 'Succeeded'
        - value: Failed
          description: The long running operation is in 'Failed' state
          name: Long running operation state is 'Failed'
        - value: NotStarted
          description: The long running operation has not started
          name: Long running operation state is 'NotStarted'
    PurviewShareError:
      description: The purview share error model.
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/PurviewShareErrorInfo'
    PurviewShareErrorInfo:
      description: The purview share error body model.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Code of the error
          type: string
        details:
          description: Nested details of the error model
          type: array
          items:
            $ref: '#/components/schemas/PurviewShareErrorInfo'
        message:
          description: Message of the error
          type: string
        target:
          description: Target of the error
          type: string
    SentShare:
      description: A sent share data transfer object.
      required:
      - shareKind
      type: object
      allOf:
      - $ref: '#/components/schemas/ProxyResource'
      properties:
        shareKind:
          $ref: '#/components/schemas/ShareKind'
      discriminator:
        propertyName: shareKind
  parameters:
    filter:
      in: query
      name: filter
      description: Filters the results using OData syntax
      x-ms-parameter-location: method
      schema:
        type: string
    referenceName:
      in: query
      name: referenceName
      description: A name that references a data store.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    api-version:
      in: query
      name: api-version
      description: The api version to use
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    orderby:
      in: query
      name: orderby
      description: Sorts the results using OData syntax
      x-ms-parameter-location: method
      schema:
        type: string
    sentShareId:
      in: path
      name: sentShareId
      description: Id of the sent share
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 36
        pattern: ^(?:\{{0,1}(?:[0-9a-fA-F]){8}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){12}\}{0,1})$
  securitySchemes:
    azureAuth:
      type: oauth2
      flows:
        implicit:
          scopes:
            https://purview.azure.net/.default: Purview service scope
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
      description: Azure Active Directory OAuth2 Flow.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/endpoint'
