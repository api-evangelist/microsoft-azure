openapi: 3.2.0
info:
  title: Microsoft Azure Multi Slot Events API
  version: '1.0'
  description: 'Operations tagged MultiSlotEvents across 2 of this provider''s published API definitions: personalizer-client-2022-09-01-preview-openapi-original.yml, personalizer-client-v11-preview3-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /personalizer
- url: /personalizer/v1.1-preview.3
tags:
- name: MultiSlotEvents
  description: Manages multi-slot event operations.
paths:
  /multislot/events/{eventId}/reward:
    post:
      tags:
      - MultiSlotEvents
      summary: Microsoft Azure Post Multi Slot Rewards
      description: Report reward that resulted from using the action specified in rewardActionId for the slot.
      operationId: microsoftAzureMultisloteventsReward
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      - in: path
        name: eventId
        description: The event id this reward applies to.
        required: true
        schema:
          type: string
          maxLength: 256
      responses:
        '204':
          description: No Content
        default:
          description: Invalid reward request.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Successful MultiSlotEvents_Reward request:
          $ref: ./examples/MultiSlotEvents_Reward.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiSlotRewardRequest'
        description: List of slot id and reward values. The reward should be a floating point number, typically between 0 and 1.
        required: true
      security:
      - {}
    servers:
    - url: /personalizer
  /multislot/events/{eventId}/activate:
    post:
      tags:
      - MultiSlotEvents
      summary: Microsoft Azure Activate Multi Slot Event
      description: Report that the specified event was actually used or displayed to the user and a rewards should be expected for it.
      operationId: microsoftAzureMultisloteventsActivate
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      - in: path
        name: eventId
        description: The event ID this activation applies to.
        required: true
        schema:
          type: string
          maxLength: 256
      responses:
        '204':
          description: No Content
        default:
          description: Invalid activate event request.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        Successful MultiSlotEvents_Activate request:
          $ref: ./examples/MultiSlotEvents_Activate.json
      security:
      - {}
    servers:
    - url: /personalizer
