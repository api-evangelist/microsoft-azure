openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Configuration Profile HCRP Assignments API
tags:
- name: ConfigurationProfileHCRPAssignments
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.HybridCompute/machines/{machineName}/providers/Microsoft.Automanage/configurationProfileAssignments/{configurationProfileAssignmentName}
  : put:
      tags:
      - ConfigurationProfileHCRPAssignments
      operationId: microsoftAzureConfigurationprofilehcrpassignmentsCreateorupdate
      description: Creates an association between a ARC machine and Automanage configuration profile
      x-ms-examples:
        Create or update HCRP configuration profile assignment:
          $ref: ./examples/createOrUpdateConfigurationProfileHCRPAssignment.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
      - $ref: '#/components/parameters/MachineNameParameter'
      - name: configurationProfileAssignmentName
        in: path
        required: true
        description: Name of the configuration profile assignment. Only default is supported.
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK. The configuration profile assignment for the ARC machine was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationProfileAssignment'
        '201':
          description: Created. The Automanage configuration profile assignment for the ARC machine was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationProfileAssignment'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: false
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Hybridcompute Machines Machinename Providers Microsoft Automanage Configurationprofileassignments Configurationprofileassignmentname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationProfileAssignment'
        description: Parameters supplied to the create or update configuration profile assignment.
        required: true
    get:
      tags:
      - ConfigurationProfileHCRPAssignments
      operationId: microsoftAzureConfigurationprofilehcrpassignmentsGet
      description: Get information about a configuration profile assignment
      x-ms-examples:
        Get a HCRP configuration profile assignment:
          $ref: ./examples/getConfigurationProfileHCRPAssignment.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/MachineNameParameter'
      - name: configurationProfileAssignmentName
        in: path
        required: true
        description: The configuration profile assignment name.
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK. The configuration profile assignment was returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationProfileAssignment'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Hybridcompute Machines Machinename Providers Microsoft Automanage Configurationprofileassignments Configurationprofileassignmentname
    delete:
      tags:
      - ConfigurationProfileHCRPAssignments
      operationId: microsoftAzureConfigurationprofilehcrpassignmentsDelete
      description: Delete a configuration profile assignment
      x-ms-examples:
        Delete a HCRP configuration profile assignment:
          $ref: ./examples/deleteConfigurationProfileHCRPAssignment.json
      parameters:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ResourceGroupNameParameter
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/SubscriptionIdParameter
      - $ref: '#/components/parameters/MachineNameParameter'
      - name: configurationProfileAssignmentName
        in: path
        required: true
        description: Name of the configuration profile assignment
        schema:
          type: string
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/parameters/ApiVersionParameter
      responses:
        '200':
          description: OK
        '204':
          description: NoContent
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ErrorResponse
      x-ms-long-running-operation: false
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Hybridcompute Machines Machinename Providers Microsoft Automanage Configurationprofileassignments Configurationprofileassignmentname
components:
  parameters:
    MachineNameParameter:
      name: machineName
      in: path
      required: true
      description: The name of the Arc machine.
      x-ms-parameter-location: method
      schema:
        type: string
  schemas:
    ConfigurationProfileAssignmentProperties:
      description: Automanage configuration profile assignment properties.
      type: object
      properties:
        configurationProfile:
          type: string
          description: The Automanage configurationProfile ARM Resource URI.
        targetId:
          type: string
          description: The target VM resource URI
          readOnly: true
        status:
          type: string
          readOnly: true
          description: The status of onboarding, which only appears in the response.
        profileOverrides:
          $ref: '#/components/schemas/ConfigurationProfileAssignmentProfileOverrides'
          description: The profileOverrides setting for the configuration profile assignment.
    ConfigurationProfileAssignmentProfileOverrides:
      description: Data related to configuration profile assignment profile overrides.
      type: object
      additionalProperties:
        type: object
    ConfigurationProfileAssignment:
      description: Configuration profile assignment is an association between a VM and automanage profile configuration.
      type: object
      properties:
        properties:
          x-ms-client-flatten: false
          $ref: '#/components/schemas/ConfigurationProfileAssignmentProperties'
          description: Properties of the configuration profile assignment.
        systemData:
          $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/systemData
          readOnly: true
          description: Azure Resource Manager metadata containing createdBy and modifiedBy information.
      allOf:
      - $ref: ../../../../../common-types/resource-management/v2/types.json#/definitions/ProxyResource
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
