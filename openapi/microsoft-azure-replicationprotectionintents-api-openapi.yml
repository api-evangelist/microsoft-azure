openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Replication Protection Intents API
tags:
- name: ReplicationProtectionIntents
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.RecoveryServices/vaults/{resourceName}/replicationProtectionIntents
  : get:
      tags:
      - ReplicationProtectionIntents
      summary: Microsoft Azure Gets The List Of Replication Protection Intent Objects
      description: Gets the list of ASR replication protection intent objects in the vault.
      operationId: microsoftAzureReplicationprotectionintentsList
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/SubscriptionId'
      - name: skipToken
        in: query
        description: The pagination token.
        required: false
        schema:
          type: string
      - name: takeToken
        in: query
        description: The page size.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicationProtectionIntentCollection'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        Gets the list of replication protection intent objects.:
          $ref: ./examples/ReplicationProtectionIntents_List.json
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.RecoveryServices/vaults/{resourceName}/replicationProtectionIntents/{intentObjectName}
  : get:
      tags:
      - ReplicationProtectionIntents
      summary: Microsoft Azure Gets The Details Of A Replication Protection Intent Item
      description: Gets the details of an ASR replication protection intent.
      operationId: microsoftAzureReplicationprotectionintentsGet
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/SubscriptionId'
      - name: intentObjectName
        in: path
        description: Replication protection intent name.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicationProtectionIntent'
      x-ms-examples:
        Gets the details of a Replication protection intent item.:
          $ref: ./examples/ReplicationProtectionIntents_Get.json
    put:
      tags:
      - ReplicationProtectionIntents
      summary: Microsoft Azure Create Protection Intent Resource
      description: The operation to create an ASR replication protection intent item.
      operationId: microsoftAzureReplicationprotectionintentsCreate
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/SubscriptionId'
      - name: intentObjectName
        in: path
        description: A name for the replication protection item.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicationProtectionIntent'
      x-ms-examples:
        Create protection intent Resource.:
          $ref: ./examples/ReplicationProtectionIntents_Create.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProtectionIntentInput'
        description: Create Protection Intent Input.
        required: true
components:
  parameters:
    ResourceName:
      name: resourceName
      in: path
      description: The name of the recovery services vault.
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    ResourceGroupName:
      name: resourceGroupName
      in: path
      description: The name of the resource group where the recovery services vault is present.
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    ApiVersion:
      name: api-version
      in: query
      description: Client Api Version.
      required: true
      schema:
        type: string
    SubscriptionId:
      name: subscriptionId
      in: path
      description: The subscription Id.
      required: true
      schema:
        type: string
  schemas:
    ReplicationProtectionIntentProviderSpecificSettings:
      description: Replication provider specific settings.
      required:
      - instanceType
      type: object
      properties:
        instanceType:
          description: Gets the Instance type.
          type: string
      discriminator:
        propertyName: instanceType
    CreateProtectionIntentInput:
      description: Create protection intent input.
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/CreateProtectionIntentProperties'
          description: Create protection intent input properties.
    ReplicationProtectionIntentProperties:
      description: Replication protection intent custom data details.
      type: object
      properties:
        friendlyName:
          description: The name.
          type: string
        jobId:
          description: The job Id.
          type: string
          readOnly: true
        jobState:
          description: The job state.
          type: string
          readOnly: true
        isActive:
          description: A value indicating whether the intent object is active.
          type: boolean
          readOnly: true
        creationTimeUTC:
          description: The creation time in UTC.
          type: string
          readOnly: true
        providerSpecificDetails:
          $ref: '#/components/schemas/ReplicationProtectionIntentProviderSpecificSettings'
          description: The Replication provider custom settings.
    ReplicationProtectionIntentCollection:
      description: Replication protection intent objects collection.
      type: object
      properties:
        value:
          description: The Replication protection intent details.
          type: array
          items:
            $ref: '#/components/schemas/ReplicationProtectionIntent'
        nextLink:
          description: The value of next link.
          type: string
    Resource:
      description: Azure resource.
      type: object
      properties:
        id:
          description: Resource Id
          type: string
          readOnly: true
        name:
          description: Resource Name
          type: string
          readOnly: true
        type:
          description: Resource Type
          type: string
          readOnly: true
        location:
          description: Resource Location
          type: string
      x-ms-azure-resource: true
    ReplicationProtectionIntent:
      description: Replication protection intent.
      type: object
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        properties:
          $ref: '#/components/schemas/ReplicationProtectionIntentProperties'
          description: The custom data.
    CreateProtectionIntentProviderSpecificDetails:
      description: Create protection intent provider specific input.
      required:
      - instanceType
      type: object
      properties:
        instanceType:
          description: The class type.
          type: string
      discriminator:
        propertyName: instanceType
    CreateProtectionIntentProperties:
      description: Create protection intent input properties.
      type: object
      properties:
        providerSpecificDetails:
          $ref: '#/components/schemas/CreateProtectionIntentProviderSpecificDetails'
          description: The ReplicationProviderInput. For A2A provider, it will be A2ACreateProtectionIntentInput object.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
