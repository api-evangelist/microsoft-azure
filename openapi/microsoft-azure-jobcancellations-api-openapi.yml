openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Job Cancellations API
tags:
- name: JobCancellations
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.RecoveryServices/vaults/{vaultName}/backupJobs/{jobName}/cancel
  : post:
      tags:
      - JobCancellations
      description: Cancels a job. This is an asynchronous operation. To know the status of the cancellation, call<br>GetCancelOperationResult API.
      operationId: microsoftAzureJobcancellationsTrigger
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/VaultName'
      - $ref: '#/components/parameters/ResourceGroupName'
      - $ref: '#/components/parameters/SubscriptionId'
      - name: jobName
        in: path
        description: Name of the job to cancel.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        Cancel Job:
          $ref: ./examples/Common/TriggerCancelJob.json
      summary: Microsoft Azure Post Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Recoveryservices Vaults Vaultname Backupjobs Jobname Cancel
