          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-ms-examples:
        Triggers_CreateTrigger:
          $ref: ./examples/Triggers_CreateTrigger.json
      summary: Microsoft Azure Put Datasources Datasourcename Scans Scanname Triggers Default
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trigger_2'
