      description: Gets trigger information
      operationId: microsoftAzureTriggersGettrigger
      parameters:
      - in: path
        name: dataSourceName
        required: true
        schema:
          type: string
      - in: path
        name: scanName
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
