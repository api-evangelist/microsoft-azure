              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-ms-examples:
        Triggers_GetTrigger:
          $ref: ./examples/Triggers_GetTrigger.json
      summary: Microsoft Azure Get Datasources Datasourcename Scans Scanname Triggers Default
    put:
      tags:
      - Triggers
      description: Creates an instance of a trigger
      operationId: microsoftAzureTriggersCreatetrigger
      parameters:
      - in: path
        name: dataSourceName
        required: true
        schema:
          type: string
      - in: path
        name: scanName
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
