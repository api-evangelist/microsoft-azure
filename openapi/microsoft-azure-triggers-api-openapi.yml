info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Triggers API
tags:
- name: Triggers
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataBoxEdge/dataBoxEdgeDevices/{deviceName}/triggers
  : get:
      tags:
      - Triggers
      description: Lists all the triggers configured in the device.
      operationId: microsoftAzureTriggersListbydataboxedgedevice
      parameters:
      - name: deviceName
        in: path
        description: The device name.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      - name: $filter
        in: query
        description: Specify $filter='CustomContextTag eq <tag>' to filter on custom context tag property
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List all the triggers configured in the device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-pageable:
        nextLinkName: nextLink
      x-ms-examples:
        TriggerGetAllInDevice:
          $ref: ./examples/TriggerGetAllInDevice.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Databoxedge Databoxedgedevices Devicename Triggers
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataBoxEdge/dataBoxEdgeDevices/{deviceName}/triggers/{name}
  : get:
      tags:
      - Triggers
      description: Get a specific trigger by name.
      operationId: microsoftAzureTriggersGet
      parameters:
      - name: deviceName
        in: path
        description: The device name.
        required: true
        schema:
          type: string
      - name: name
        in: path
        description: The trigger name.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: The trigger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trigger'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        TriggerGet:
          $ref: ./examples/TriggerGet.json
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Databoxedge Databoxedgedevices Devicename Triggers Name
    put:
      tags:
      - Triggers
      description: Creates or updates a trigger.
      operationId: microsoftAzureTriggersCreateorupdate
      parameters:
      - name: deviceName
        in: path
        description: Creates or updates a trigger
        required: true
        schema:
          type: string
      - name: name
        in: path
        description: The trigger name.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: Successfully created or updated the trigger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trigger'
        '202':
          description: Accepted the request to create or update the trigger.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-long-running-operation: true
      x-ms-examples:
        TriggerPut:
          $ref: ./examples/TriggerPut.json
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Databoxedge Databoxedgedevices Devicename Triggers Name
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trigger'
        description: The trigger.
        required: true
    delete:
      tags:
      - Triggers
      description: Deletes the trigger on the gateway device.
      operationId: microsoftAzureTriggersDelete
      parameters:
      - name: deviceName
        in: path
        description: The device name.
        required: true
        schema:
          type: string
      - name: name
        in: path
        description: The trigger name.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: Successfully deleted the trigger.
        '202':
          description: Accepted the request to delete the trigger.
        '204':
          description: The trigger is already deleted.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-long-running-operation: true
      x-ms-examples:
        TriggerDelete:
          $ref: ./examples/TriggerDelete.json
      summary: Microsoft Azure Delete Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Databoxedge Databoxedgedevices Devicename Triggers Name
  /datasources/{dataSourceName}/scans/{scanName}/triggers/default:
    get:
      tags:
