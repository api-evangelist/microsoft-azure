    Prediction:
      description: Prediction result.
      type: object
      properties:
        probability:
          format: float
          description: Probability of the tag.
          type: number
          readOnly: true
        tagId:
          format: uuid
          description: Id of the predicted tag.
          type: string
          readOnly: true
        tagName:
          description: Name of the predicted tag.
          type:
          - string
          - 'null'
          readOnly: true
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
          description: Bounding box of the prediction.
          readOnly: true
        tagType:
          description: Type of the predicted tag.
          enum:
          - Regular
          - Negative
          - GeneralProduct
          type:
          - string
          - 'null'
          readOnly: true
          x-ms-enum:
            name: TagType
            modelAsString: true
    SuggestedTagAndRegion:
      description: Result of a suggested tags and regions request.
      type: object
      properties:
        id:
          format: uuid
          description: Prediction Id.
          type: string
          readOnly: true
        project:
          format: uuid
          description: Project Id.
          type: string
          readOnly: true
        iteration:
          format: uuid
          description: Iteration Id.
          type: string
          readOnly: true
        created:
          format: date-time
          description: Date this prediction was created.
          type: string
          readOnly: true
        predictions:
          description: List of predictions.
          type: array
          items:
            $ref: '#/components/schemas/Prediction'
          readOnly: true
        predictionUncertainty:
          format: double
          description: Uncertainty (entropy) of suggested tags or regions per image.
          type: number
          readOnly: true
