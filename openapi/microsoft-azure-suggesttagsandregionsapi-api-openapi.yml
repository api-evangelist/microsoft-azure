openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Suggest Tags And Regions API
tags:
- name: SuggestTagsAndRegionsApi
paths:
  /projects/{projectId}/tagsandregions/suggestions:
    post:
      tags:
      - SuggestTagsAndRegionsApi
      summary: Microsoft Azure Suggest Tags And Regions For An Array Batch Of Untagged Images Returns Empty Array If No Tags Are Found
      description: This API will get suggested tags and regions for an array/batch of untagged images along with confidences for the tags. It returns an empty array if no tags are found.<br>There is a limit of 64 images in the batch.
      operationId: microsoftAzureSuggesttagsandregions
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
          format: uuid
      - name: iterationId
        in: query
        description: IterationId to use for tag and region suggestion.
        required: true
        schema:
          type: string
          format: uuid
      - name: imageIds
        in: query
        description: Array of image ids tag suggestion are needed for. Use GetUntaggedImages API to get imageIds.
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 64
          minItems: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SuggestedTagAndRegion'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SuggestedTagAndRegion'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SuggestedTagAndRegion'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
            text/xml:
              schema:
                $ref: '#/components/schemas/CustomVisionError'
      x-ms-examples:
        Successful SuggestTagsAndRegions request:
          $ref: ./examples/SuggestTagsAndRegions.json
components:
  schemas:
    BoundingBox:
      description: Bounding box that defines a region of an image.
      required:
      - left
      - top
      - width
      - height
      type: object
      properties:
        left:
          format: float
          description: Coordinate of the left boundary.
          type: number
          readOnly: false
        top:
          format: float
          description: Coordinate of the top boundary.
          type: number
          readOnly: false
        width:
          format: float
          description: Width.
          type: number
          readOnly: false
        height:
          format: float
          description: Height.
          type: number
          readOnly: false
