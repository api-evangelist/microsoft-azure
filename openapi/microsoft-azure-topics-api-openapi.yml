          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        Release Cloud Event with an optional delay.:
          $ref: ./examples/release.json
      summary: Microsoft Azure Post Topics Topicname Eventsubscriptions…
      tags:
      - Topics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOptions'
        description: ReleaseOptions
        required: true
      security:
      - OAuth2Auth:
        - https://eventgrid.azure.net/.default
