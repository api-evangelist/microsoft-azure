        description: Topic Name.
        required: true
        schema:
          type: string
      - name: eventSubscriptionName
        in: path
        description: Event Subscription Name.
        required: true
        schema:
          type: string
      - name: releaseDelayInSeconds
        in: query
        description: Release cloud events with the specified delay in seconds.
        required: false
        x-ms-enum:
          name: ReleaseDelay
          modelAsString: true
          values:
          - name: By0Seconds
            value: 0
            description: Release the event after 0 seconds.
          - name: By10Seconds
            value: 10
            description: Release the event after 10 seconds.
          - name: By60Seconds
            value: 60
            description: Release the event after 60 seconds.
          - name: By600Seconds
            value: 600
            description: Release the event after 600 seconds.
          - name: By3600Seconds
            value: 3600
            description: Release the event after 3600 seconds.
        schema:
          type: number
          enum:
          - 0
          - 10
          - 60
          - 600
          - 3600
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResult'
        default:
          description: An unexpected error response.
