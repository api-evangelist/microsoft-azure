openapi: 3.2.0
info:
  title: Microsoft Azure Programmable Connectivity Device Network API
  version: 2024-02-09-preview
  description: Azure Programmable Connectivity (APC) provides a unified interface to the Network APIs of multiple Telecom Operators. Note that Operators may deprecate a Network API with less advance notice than the Azure standard, in which case APC will also deprecate that Network API.
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
security:
- OAuth2Auth:
  - https://management.azure.com//.default
tags:
- name: Device Network
paths:
  /device-network/network:retrieve:
    post:
      operationId: microsoftAzureDevicenetworkRetrieve
      description: Retrieves the network a given device is on. Returns network in a networkCode format that can be used for other APIs.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      - $ref: '#/components/parameters/ApcGatewayIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier for the request.
              schema:
                type: string
                format: uuid
            x-ms-request-id:
              description: An opaque, globally-unique, server-generated string identifier for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRetrievalResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-examples:
        DeviceNetwork_Retrieve:
          $ref: ./examples/DeviceNetwork_Retrieve_MaximumSet_Gen.json
      summary: Microsoft Azure Post Device Network Network:retrieve
      tags:
      - Device Network
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkIdentifier'
        required: true
