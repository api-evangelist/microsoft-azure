          items:
            $ref: '#/components/schemas/NormalizationRule'
        regexReplacers:
          type: array
          items:
            $ref: '#/components/schemas/RegexReplacer'
        rejectedPatterns:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        scopedRules:
          type: array
          items:
            $ref: '#/components/schemas/ScopedRule'
        version:
          format: int32
          default: 0
          type: integer
    FastRegex:
      type: object
      properties:
        maxDigits:
          format: int32
          type: integer
        maxLetters:
          format: int32
          type: integer
        minDashes:
          format: int32
          type: integer
        minDigits:
          format: int32
          type: integer
        minDigitsOrLetters:
          format: int32
          type: integer
        minDots:
          format: int32
          type: integer
        minHex:
          format: int32
          type: integer
        minLetters:
          format: int32
          type: integer
        minUnderscores:
