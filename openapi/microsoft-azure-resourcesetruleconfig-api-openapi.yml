      properties:
        acceptedPatterns:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        complexReplacers:
          type: array
          items:
            $ref: '#/components/schemas/ComplexReplacerConfig'
        createdBy:
          type: string
        enableDefaultPatterns:
          type: boolean
        lastUpdatedTimestamp:
          format: int64
          type: integer
        modifiedBy:
