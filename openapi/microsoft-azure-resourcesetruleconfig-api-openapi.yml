          type: string
          x-ms-enum:
            name: resourceSetProcessing
            modelAsString: true
    ErrorResponseModel:
      description: Default error response model
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorModel'
    ResourceSetRuleConfigList:
      description: Paged list of account resources
      required:
      - value
      type: object
      properties:
        count:
          format: int64
          description: Total item count.
          type: integer
        nextLink:
          description: The Url of next result page.
          type: string
        value:
          description: Collection of items of type results.
          type: array
          items:
            $ref: '#/components/schemas/ResourceSetRuleConfig'
    NormalizationRule:
      type: object
      properties:
        description:
          type: string
        disabled:
          type: boolean
        dynamicReplacement:
          type: boolean
        entityTypes:
          type: array
          items:
            type: string
        lastUpdatedTimestamp:
          format: int64
          type: integer
        name:
          type: string
        regex:
          $ref: '#/components/schemas/FastRegex'
        replaceWith:
          type: string
        version:
          format: double
          type: number
    Filter:
      required:
      - name
      - path
      type: object
      properties:
        createdBy:
          default: AzureDataCatalog
          type: string
        filterType:
          enum:
          - Pattern
          - Regex
