openapi: 3.2.0
info:
  title: Microsoft Azure Purview Distribution Service REST API…
  description: Purview distribution service enables various Azure RPs to fetch the policies and attributes for data governance.
  version: '2023-01-01'
servers:
- url: /pds
security:
- azure_auth:
  - user_impersonation
tags:
- name: PolicyEvents
paths:
  /policy-events:
    get:
      tags:
      - PolicyEvents
      description: Get policy events for given scope.
      operationId: microsoftAzurePolicyeventsList
      parameters:
      - in: query
        name: scope
        description: Id for any resource managed by Purview.
        required: true
        schema:
          type: string
      - in: query
        name: syncToken
        description: This sync token represents the latest checkpoint for policies. Client need to pass this value while fetching subsequent delta changes.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyEventsResponseUpdated'
        '304':
          description: Not Modified
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-ms-examples:
        PolicyEvents_List:
          $ref: ./examples/PolicyEvents_List.json
      summary: Microsoft Azure Get Policy Events
components:
  schemas:
    PolicyElementKind:
      description: Represents the kind of policy element.
      enum:
      - Policy
      - PolicySet
      - AttributeRule
      type: string
      x-ms-enum:
        name: PolicyElementKind
        modelAsString: true
    ErrorModel:
      description: Default error model.
      required:
      - code
      - message
      type: object
      properties:
        code:
          description: Error code.
          minLength: 1
          type: string
        message:
          description: Error message.
          minLength: 1
          type: string
        target:
          description: Error description.
          type: string
        details:
          description: Error details.
          type: array
          items:
            $ref: '#/components/schemas/ErrorModel'
    ErrorResponseModel:
      description: Default error response model.
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorModel'
    PolicyElementEventModelUpdated:
      description: Represents the policy element event model.
      required:
      - eventType
      - id
      - kind
      - updatedAt
      - version
      type: object
      properties:
        id:
          description: Id of the policy element.
          minLength: 1
          type: string
        scopes:
          description: List of scopes included in this policy.
          type: array
          items:
            type: string
        version:
          format: int64
          description: Current version of policy element. This is auto incremented with each change. Starts with 1.
          type: integer
        elementJson:
          description: Policy element serialized json payload.
          type: string
        kind:
          $ref: '#/components/schemas/PolicyElementKind'
        updatedAt:
          format: date-time
          description: Time at which this policy element was last updated.
          type: string
        eventType:
          description: 'Type of event. Format: <RP-Name>/<Resource-Type>/<Action>. For Example: Microsoft.Purview/PolicyElements/Delete.'
          minLength: 1
          type: string
    PolicyEventsResponseUpdated:
      description: Response model for policy delta fetch API.
      required:
      - syncToken
      type: object
      properties:
        syncToken:
          description: This sync token represents the latest checkpoint for policies. Client need to pass this value while fetching subsequent delta changes.
          minLength: 1
          type: string
        value:
          description: List of policy elements.
          type: array
          items:
            $ref: '#/components/schemas/PolicyElementEventModelUpdated'
  parameters:
    api-version:
      in: query
      name: api-version
      description: The api-version of the service.
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      flows:
        implicit:
          scopes:
            user_impersonation: impersonate your user account
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
      description: Azure Active Directory OAuth2 Flow.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/endpoint'
