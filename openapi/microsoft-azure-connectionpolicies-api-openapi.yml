openapi: 3.2.0
info:
  version: 2020-08-01-preview
  title: Microsoft Azure AccessControlClient AccessConnector Connection Policies API
tags:
- name: ConnectionPolicies
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Sql/servers/{serverName}/connectionPolicies/{connectionPolicyName}
  : put:
      tags:
      - ConnectionPolicies
      operationId: microsoftAzureServerconnectionpoliciesCreateorupdate
      description: Creates or updates the server's connection policy.
      x-ms-examples:
        Create or update a server's secure connection policy:
          $ref: ./examples/ServerConnectionPolicyCreateOrUpdate.json
      parameters:
      - $ref: ../../../common/v1/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../common/v1/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../common/v1/types.json#/parameters/ResourceGroupParameter
      - $ref: '#/components/parameters/ServerNameParameter'
      - $ref: '#/components/parameters/ConnectionPolicyNameParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConnectionPolicy'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConnectionPolicy'
      summary: Microsoft Azure Put Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Sql Servers Servername Connectionpolicies Connectionpolicyname
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerConnectionPolicy'
        description: The required parameters for updating a secure connection policy.
        required: true
    get:
      tags:
      - ConnectionPolicies
      operationId: microsoftAzureServerconnectionpoliciesGet
      description: Gets the server's secure connection policy.
      x-ms-examples:
        Get a server's secure connection policy:
          $ref: ./examples/ServerConnectionPolicyGet.json
      parameters:
      - $ref: ../../../common/v1/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../common/v1/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../common/v1/types.json#/parameters/ResourceGroupParameter
      - $ref: '#/components/parameters/ServerNameParameter'
      - $ref: '#/components/parameters/ConnectionPolicyNameParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConnectionPolicy'
      summary: Microsoft Azure Get Subscriptions Subscriptionid Resourcegroups Resourcegroupname Providers Microsoft Sql Servers Servername Connectionpolicies Connectionpolicyname
components:
  parameters:
    ServerNameParameter:
      name: serverName
      in: path
      required: true
      description: The name of the server.
      x-ms-parameter-location: method
      schema:
        type: string
    ConnectionPolicyNameParameter:
      name: connectionPolicyName
      in: path
      required: true
      description: The name of the connection policy.
      x-ms-enum:
        modelAsString: true
        name: ConnectionPolicyName
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - default
  schemas:
    ServerConnectionPolicy:
      properties:
        kind:
          readOnly: true
          type: string
          description: Metadata used for the Azure portal experience.
        location:
          type: string
          description: Resource location.
          readOnly: true
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/ServerConnectionPolicyProperties'
          description: The properties of the server secure connection policy.
      allOf:
      - $ref: ../../../common/v1/types.json#/definitions/ProxyResource
      description: A server secure connection policy.
    ServerConnectionPolicyProperties:
      properties:
        connectionType:
          type: string
          description: The server connection type.
          enum:
          - Default
          - Proxy
          - Redirect
          x-ms-enum:
            name: ServerConnectionType
      required:
      - connectionType
      description: The properties of a server secure connection policy.
x-ms-parameterized-host:
  hostTemplate: '{endpoint}'
  useSchemePrefix: false
  parameters:
  - $ref: '#/components/parameters/Endpoint'
