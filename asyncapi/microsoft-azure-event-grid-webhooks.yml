webhooks:
  mechanism: Azure Event Grid
  docs: https://learn.microsoft.com/en-us/azure/event-grid/
  transport: HTTPS POST to a subscriber-supplied endpoint
  schemas:
    - name: CloudEvents v1.0 (JSON)
      standard: true
      spec: https://github.com/cloudevents/spec/blob/v1.0/json-format.md
      binding: https://github.com/cloudevents/spec/blob/v1.0/http-protocol-binding.md
      docs: https://learn.microsoft.com/en-us/azure/event-grid/cloud-event-schema
      note: >-
        Native support. Microsoft is a listed collaborator on the CNCF CloudEvents specification. This
        is the schema to prefer — it is the interoperable one.
    - name: Event Grid event schema
      standard: false
      docs: https://learn.microsoft.com/en-us/azure/event-grid/event-schema
      note: Azure's own proprietary envelope, predating the CloudEvents support.
  endpoint_validation:
    cloudevents:
      method: HTTP OPTIONS
      mechanism: >-
        CloudEvents v1.0 abuse-protection handshake. Event Grid sends an OPTIONS request carrying
        WebHook-Request-Origin; the subscriber must answer with WebHook-Allowed-Origin. When the
        CloudEvents schema is selected this REPLACES the Event Grid validation event.
      docs: https://learn.microsoft.com/en-us/azure/event-grid/webhook-event-delivery
      caveat: >-
        Microsoft is explicit that the handshake "doesn't aim to establish an authentication or
        authorization context. It only serves to protect the sender from being told to push to a
        destination that isn't expecting the traffic." A subscriber must still authorize the delivery
        itself.
    event_grid_schema:
      method: SubscriptionValidationEvent
      mechanism: >-
        Event Grid POSTs a validation event with a validationCode the subscriber must echo back, or
        alternatively a validationUrl that can be visited once manually.
  delivery:
    retry: Exponential backoff with a configurable retry policy and event time-to-live.
    dead_lettering: Undeliverable events can be routed to a storage account.
    ordering: Not guaranteed.
    delivery_semantics: at-least-once
    note: >-
      At-least-once delivery with no ordering guarantee means a subscriber MUST be idempotent on its own
      side. That obligation sits with the subscriber, and Azure documents it rather than solving it —
      which is consistent with the absence of any idempotency mechanism on the request side (see
      conventions/azure-cloud-conventions.yml#idempotency).
  destinations:
